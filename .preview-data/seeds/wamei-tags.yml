# 和名タグ(楽天あらすじAI付与 [[genre_from_rakuten_story_plan]])の表示ゲート。2026-08-11 点検で導入。
# 背景: 対訳表(tag-i18n.yml)は「英語AniListタグ→和訳」専用で、和名タグ1,433種(4,335付与)が
#       要素表示に一切出ていなかった(悪役令嬢/婚約破棄/追放など検索需要の高い語も全滅)。
# 仕組み(ビルダー themes_of / 詳細頁 elemItems 共通):
#   exclude → 非テーマ(出版形態/メタ/分野語)は捨てる
#   alias   → 表記揺れ・同概念を既存語へ畳む(畳み先が対訳語ならそこへ合流)
#   allow   → 全DB出現数>=3 の確定リストのみ表示(閾値未満の長尾1,081種はノイズが多く不採用)
# ★新しい和名タグは自動では表に出ない(安全側)。月次で python scripts/_audit-wamei-tags.py を
#   走らせ、新規に閾値超えした語を人が確認して allow へ追記する。

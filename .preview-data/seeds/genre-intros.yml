# ジャンル別ランディング(/genre/[key])の AIキュレーション導入文。
# discovery+SEO+アフィの「まとめ記事」本体。 人気上位作を踏まえ Claude が生成(2026-06-13)。
# 代表作は editorial copy(必ずしも当サイトにページがあるとは限らない)。 蒸留で見直し可。
intros:
  action: "王道バトルの中心ジャンル。『ONE PIECE』『チェンソーマン』『呪術廻戦』『ベルセルク』など、迫力ある戦いとキャラクターの成長を描く作品が揃う。長編を腰を据えて追うも、短期完結を一気に読むも自由。"
  adventure: "未知の世界を旅する高揚感。『ONE PIECE』『ベルセルク』をはじめ、目的地を目指す道中の出会いとドラマが魅力。世界の広がりごと楽しみたい人へ。"
  fantasy: "魔法・異形・異世界が彩る想像力の宝庫。『チェンソーマン』『呪術廻戦』『ベルセルク』など、現実離れした設定だからこそ描けるテーマが詰まっている。"
  sci-fi: "科学と仮説が物語を動かすジャンル。『ワンパンマン』『20世紀少年』『Dr.STONE』『宝石の国』など、設定の妙と思考実験の面白さが光る。"
  mystery: "謎が読者を引っ張る緊張感。『進撃の巨人』『MONSTER』『DEATH NOTE』『約束のネバーランド』など、伏線と真相のカタルシスを味わえる。"
  horror: "恐怖と不穏が支配する世界。『東京喰種』『うずまき』『ドロヘドロ』など、ページをめくる手が止まらない戦慄を求める人へ。"
  gag: "笑いに全振りしたナンセンスの快楽。『ギャグマンガ日和』『ボボボーボ・ボーボボ』など、勢いと発想で押し切る作品群。肩の力を抜いて読みたい時に。"
  comedy: "日常やキャラの掛け合いで笑わせるジャンル。『SPY×FAMILY』『かぐや様は告らせたい』など、笑いと物語を両立した作品が幅広く揃う。"
  romcom: "ときめきと笑いの黄金比。『かぐや様は告らせたい』『古見さんは、コミュ症です。』など、もどかしい恋模様をコメディに包んで描く。"
  romance: "恋を真ん中に据えた感情の物語。『ホリミヤ』『かぐや様は告らせたい』『聲の形』など、胸を締めつける関係性を味わえる。"
  drama: "人間ドラマの重みで読ませるジャンル。『進撃の巨人』『おやすみプンプン』『バガボンド』など、感情を深く揺さぶる物語が集まる。"
  slice-of-life: "何気ない日常の愛おしさ。『SPY×FAMILY』『葬送のフリーレン』『よつばと!』など、穏やかな時間とキャラの息づかいを楽しむジャンル。"
  school: "学校を舞台にした青春の宝庫。『僕のヒーローアカデミア』『ハイキュー!!』『かぐや様は告らせたい』など、教室から始まる物語が揃う。"
  sports: "勝負と成長の熱。『SLAM DUNK』『ハイキュー!!』『ブルーロック』『あしたのジョー』など、汗と努力のドラマで心を動かす。野球・サッカーは専用棚も。"
  baseball: "野球漫画の専門棚。『MAJOR』『ダイヤのA』『タッチ』『おおきく振りかぶって』など、マウンドと打席の駆け引き、チームの絆を描く定番ジャンル。"
  soccer: "サッカー漫画の専門棚。『キャプテン翼』『ブルーロック』『アオアシ』『シュート!』など、ピッチ上の戦術と個の輝きを楽しめる。"
  historical: "史実と時代を背景にした重厚な物語。『バガボンド』『ヴィンランド・サガ』『キングダム』『ゴールデンカムイ』など、歴史の手触りを味わう。"
  samurai: "侍・剣客の生き様を描くジャンル。『るろうに剣心』『シグルイ』『無限の住人』など、刀に宿る美学と張り詰めた緊張感。"
  mecha: "ロボット・機械が主役のSF。『新世紀エヴァンゲリオン』『PLUTO』『シドニアの騎士』『機動戦士ガンダム』など、人と機械の関係を問う。"
  yokai: "妖怪・あやかしが息づく世界。『呪術廻戦』『蟲師』『ダンダダン』『ノラガミ』など、日本的な怪異の魅力を味わう。"
  gourmet: "食を主役にした漫画。『ダンジョン飯』『ゴールデンカムイ』『食戟のソーマ』『銀の匙』など、料理と人間ドラマが交わるジャンル。"
  4-koma: "4コマ形式のテンポ感。『あずまんが大王』『けいおん!』など、短い区切りに笑いや日常を凝縮した作品群。すきま時間にも。"
  essay: "作者の実体験や観察を描くエッセイ漫画。『大家さんと僕』『うちの妻ってどうでしょう?』など、等身大の笑いと気づきを味わうジャンル。"
  isekai: "異世界転生・転移の人気ジャンル。『転生したらスライムだった件』『無職転生』『盾の勇者の成り上がり』など、第二の人生の冒険を描く。"
  bl: "ボーイズラブの専門棚。『ギヴン』『光が死んだ夏』『同級生』など、繊細な感情と関係性を丁寧に描く作品が揃う。"
  suspense: "先の読めない緊迫が続くジャンル。『約束のネバーランド』『MONSTER』『DEATH NOTE』『20世紀少年』など、心理戦とどんでん返しを楽しむ。"
  music: "音楽を題材にした情熱の物語。『NANA』『BECK』『この音とまれ!』『ソラニン』など、音と青春が響き合う。"
  supernatural: "超常・霊・異能が日常に侵食するジャンル。『チェンソーマン』『呪術廻戦』『鬼滅の刃』『BLEACH』など、人気作の多くがここに重なる。"
  ecchi: "お色気要素を含む作品。『その着せ替え人形は恋をする』『GTO』など、コメディや恋愛と組み合わさったジャンル(成人向けは含まない)。"
  mind-game: "頭脳戦・心理戦が読みどころ。『DEATH NOTE』『約束のネバーランド』『かぐや様は告らせたい』など、知略のスリルを味わう。"
  mahou-shoujo: "魔法少女ジャンル。『カードキャプターさくら』『美少女戦士セーラームーン』『魔法少女まどか☆マギカ』など、変身と戦いと少女の物語。"
  war: "戦争を主題にした漫画。『はだしのゲン』『この世界の片隅に』『軍靴のバルツァー』など、戦時下に生きる人々と歴史を見つめるジャンル。"

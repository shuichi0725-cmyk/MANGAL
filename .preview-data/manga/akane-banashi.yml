synopsis: '正明師匠との稽古で、「死神」の真髄に迫る──。

  正明の仕事に同行して臨む三遍稽古。その舞台となる博多には禄郎の姿が！ 志ぐまとは対をなす「死神」に煩悶する朱音が導きを求めたのは──？ 朱音は限られた時間で演目の核となる了見を掴み、魁生が待つ“死神双宴”に挑むことができるのか!?'
catch: 体と言葉だけで物語のすべてを描く究極の話芸・落語。真打を目指す父を見てきた娘が、唯一無二の世界へ踏み出すドラマ。

  rakuten_caption: '読み切り『みっちゃんの皮膚』で多くの著名人から

    賞賛された漫画界大注目の新しい才能・胃下舌ミィ、待望の最新作!!


    ワンナイトした男が死んだ。

    私の腹の中にはヤツの子がいる。


    金なし家なし25歳フリーター妊婦×「彼」の恋人だと名乗るゲイの大学生


    生と死をめぐり爆走する人間ドラマ、開幕！



    【この漫画は…】

    金もなければ家もなく友達の家に居候中の

    25歳フリーター・ノラが、

    ワンナイトした相手・カンタとの子を妊娠した。

    しかし彼は事故で亡くなってしまい、

    ノラには頼るアテがない。

    そんな中、カンタの恋人だと名乗る

    ゲイの大学生・アキラと出会って……。


    恋人でも友人でもない二人の、とびきりおかしな関係が始まる！'

  rakuten_caption: "『キノの旅』時雨沢恵一、新作ファンタジー \n\n 『キノの旅』時雨沢恵一、初の書き下ろし漫画原作！\n\n突如現れた大量の巨大な獣【巨獣】によって、人類の9割が滅ぼされ、獣達は姿を消した。\nそれから数十年後ーー。 生き残った人々が細々と生きる中で、\n【巨獣】が再び現れたが、それらは全て “巨獣使い”と呼ばれる\n人間の意志に従う、従順な獣になっていた。 \nそんな世界で、とある青年・アルは、“巨獣使い”のリコと旅をしていた。 \n今もなお、荒廃している世界をその目で見るために。各地で暮らす人々と交流するために。 \n【巨獣】という存在の謎を知るためにーー。\n\n“獣”と共に、美しくも残酷な世界を旅する本格ファンタジー、開幕。 \n\n 【編集担当からのおすすめ情報】 \n コミックスおまけとして、描き下ろし4コマ漫画なども読める！"

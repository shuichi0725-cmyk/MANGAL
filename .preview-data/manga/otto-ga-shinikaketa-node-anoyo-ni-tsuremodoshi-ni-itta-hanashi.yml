  rakuten_caption: '「我は死神じゃ。この者の命が尽きるのを待っておる」

    幼い頃から不思議なものが「見える」特別な力と持つ、きほこ。

    出会いは最悪、けれど運命に導かれ、最愛の人・零一と結婚する。

    だが愛と幸せに満ちあふれた生活は、出産予定日の1週間前に一変、

    突如現れた「死神」が夫の死を宣告するーー。

    夫の魂を死の淵から取り戻すため「あの世」まで行ってきたきほこの

    愛と摩訶不思議な旅路が始まる…！

    第0話　予兆

    第1話　震災、魂の再会

    第2話　神社デートと小鬼達

    第3話　夢の中で彼と逢瀬!?

    第4話　背中に生えた羽

    第5話　授かり、別離へのカウントダウン'

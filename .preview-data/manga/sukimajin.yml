    26th DigiCon6 JAPAN Special Jury Award (審査員特別賞)、ほか多数受賞したオリジナルアニメーション作品「ヨビとアマリ」の制作者による

    初の書き下ろし短編作品集の書籍企画となります。


    本作の刊行は上記の受賞作品が都内映画館にて放映が2027年2月頃と決定したため、放映の流れに合わせ刊行となります。

    悠々自適な生活を夢見て豪邸を買った男、アルジ。

    しかし、夢の我が家に行ってみれば瓦礫同然の廃墟！

    絶望に打ちひしがれているところに現れたのは、

    自らを使用人と名乗る謎の少女「スキマジン」のフォン。

    彼女の能力でスキマジンたちを呼び出し、

    アルジは家の再建に乗り出すが、

    壮大すぎる事件へと巻き込まれることに。


    その他、心に孤独を抱える人間を溶かし食らう「池胃」。

    人の本質を晒しだす「めんせつさま」など、

    謎と不思議が織りなす物語を描いた短編作品集。'

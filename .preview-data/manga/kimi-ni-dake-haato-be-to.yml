    まったく授業に参加しない「コトリ先輩」に授業に出るよう言いつけるべく、

    コトリ先輩がベースを演奏しているライブハウスを訪れることになった。

    しかしライブ中、先輩のベースの音を聞いているとなんだか下半身がムズムズしてきて…！？

    一方、今までの軽率な行動をしっかり叱られたコトリ先輩は、

    自分に対し誠が怒り蔑む姿を見て、なにやら新たな扉を開いてしまったらしいーー。'

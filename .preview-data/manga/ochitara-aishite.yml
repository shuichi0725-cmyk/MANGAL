  rakuten_caption: '死がふたりを分かつまで。あなたに愛され、護られたい。

    要人警護を生業とする鬼頭家の中でも歴代最強と言われる潮は、自分の命を懸けて護る価値のある相手を探していた。そんな時、旧財閥桃園家の長男・薫の警護を依頼された潮。薫は噂通りのクズで、その容姿を武器に体を使い情報を得る「仕事」をするような男だった。ところがその「仕事」でのトラブルで、潮は薫に懇願され、射精の手伝いをすることに。嫌悪の感情を隠さず対処する潮に対し、薫は「潮のコト好きになっちゃったかも」と言い出し…!?

    「護ることができなかったら俺とセックスしてくれる？」

    キミは唯一無二の運命のひと。描き下ろしも収録!!'

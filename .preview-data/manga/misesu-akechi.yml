  rakuten_caption: '名探偵・明智小五郎の妻、文代が挑む官能と恐怖に満ちた「乱歩2．0」の試みはさらなる驚異へ！


    明智小五郎最初の事件の現場として知られる「D坂」にて、若者たちの愛憎劇を鮮やかに解決させた自称「ただの人妻」こと、文代。

    明智小五郎の「できすぎる助手」として知られる美青年、小林芳雄。

    この2人に、かつて自らの命と引き換えに明智小五郎の愛を得ようとした稀代の女賊、「黒蜥蜴」を名乗る者の魔手が迫る。


    文代と同種の「危険な魂」を持つ者が集うのは、現代のテクノロジーで制作された「鏡地獄」！


    「モーニング・ツー」で毎月第3木曜日正午更新中の官能サスペンス、江戸川乱歩の猟奇代表作をポストモダン再演！'

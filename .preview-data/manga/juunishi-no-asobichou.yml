  rakuten_caption: 【とっておきの一年がはじまります。】ごはん、おしゃれ、キャンプ、編み物、旅行、花火ーー。十二年に一度、地上に降りてくる十二支たちが、好きなことでいっぱいの毎日を満喫！ お料理好きな卯、読書好きな丑、食べ歩き好きな亥、柄物好きでおしゃれな寅……。個性豊かな動物たちが繰り広げる、四季折々の暮らしと遊び。「CREA コミック＆エッセイルーム」での連載時から書籍化を待ち望む声が続々！
    繊細なタッチで、動物たちのやさしい世界を紡ぐ、yoimoaのデビュー作。読むたびに心が温かくなる、宝物のような日常。

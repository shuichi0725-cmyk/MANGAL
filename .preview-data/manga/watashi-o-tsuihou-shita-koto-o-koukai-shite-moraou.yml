  rakuten_caption: ポーション店を軌道に乗せ、仲間たちと充実した日々を送る天才薬師令嬢アリシア。そんな彼女のもとに、故郷プロミアス領を“呪い”で蝕む、災害級の魔物・カースヒュドラ出現の報せが届く。オルグやルークたちとともに故郷へ駆けつけ、規格外のポーションを武器に総力戦へ挑むことに。しかし、カースヒュドラとの決戦を前に、今なおポーションと彼女の力を認めようとしない父・トマスが立ちはだかりーー!?　故郷の命運を懸けた決戦、そして父娘の因縁がついに決着！

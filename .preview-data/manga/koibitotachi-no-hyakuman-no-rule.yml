  rakuten_caption: 'あなたとならどんなルールを破ってもかまわないーー


    結婚式の当日、恋人の裏切りを知らされ花嫁姿のまま会場から逃げだしたクラレン。そこへひとりの男性が車の中から「乗りませんか？」と誘ってきた。断ろうとした瞬間、クラレンは息を呑んだ。艶やかな黒髪に野性的な顔立ち…なんてハンサムな男性なの？　ダッシュと名乗る彼は、2週間前に亡くなった伯父の友人だという。不信感を抱きながらも、帰る所のないクラレンは彼の車に乗り伯父の家へと向かうことにした。ダッシュが秘密の任務を負っていることを知らないままーー。'

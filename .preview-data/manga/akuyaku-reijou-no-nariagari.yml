  rakuten_caption: 浮気者の王太子に婚約破棄・国外追放された公爵令嬢・エリザ。誰もが憧れるディミトリア帝国の皇太子・アレクに見初められて訪れた隣国で、皇妃の命を救った彼女はその地で確固たる地位を築いていく。しかし『宝石喰いの悪女』の悪名を信じる者達に、王宮の侍女長のイヤリングを盗んだという濡れ衣を着せられてしまう。その悪評を払拭するため、アレクが提案したのはまさかの街中デート!?しかしイヤリングを盗んだ真犯人である『全身黒ずくめの忌々しい奴』が2人を狙っておりーー。悪女の成り上がりファンタジー、思わず涙の第3巻！

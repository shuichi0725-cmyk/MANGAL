  rakuten_caption: 'パーソナルスペース狭めな彼とまさかの同居生活開始…!?


    ブラック企業勤めで毎日疲労困憊な優里。しかし、彼女にはそんな日々も頑張れる理由がある。それは13年の片想いの相手に会うことができるから…。

    優里の片想い相手である玲人は“難攻不落な女嫌い”13年間あしらわれ続ける優里だったが、疲労で倒れた日から徐々に態度が軟化していきーー!?

    「お前じゃなきゃ、家に置いてない」

    これは親愛？ それとも恋愛!?

    素っ気ないかと思いきや、さり気なく甘い彼の態度に優里はたじたじ…！

    一方の玲人も、一途でひた向きな優里に揺さぶられているようでーー…？'

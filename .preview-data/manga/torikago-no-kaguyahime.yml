    虐げられてきた少女・かぐや。

    心を閉ざして生きてきた彼女の前に現れたのは

    妖影を討つ黒鳶隊の大将・祇王隆勝だった。


    その隆勝と仮初めの結婚をして黒鳶隊に入ったかぐやは、

    隊員達とともに妖影を討つなかで、徐々に自信を取り戻しはじめる。

    そして自分の中の力と向き合いーー？


    鳥籠の少女が羽ばたく、異能×和風恋愛ファンタジー完結！'

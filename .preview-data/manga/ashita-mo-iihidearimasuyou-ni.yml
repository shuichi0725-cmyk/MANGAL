  rakuten_caption: "母親を交通事故で亡くし、離れて暮らす父親に引き取られた三兄弟のユイト、ハルト、ユウマ。\n食事も与えられず、理不尽に暴力を振るわれる日々に絶望しかけたその時──土砂崩れに巻き込まれて三人そろって異世界に転移！偶然通りかかった冒険者・トーマスとその妻で食事処 \"オリーブの樹\"を営むオリビアたちに新しい家族として迎え入れられたのだった…。 \n愛され三兄弟が紡ぐあったか異世界スローライフ、はじまります！"

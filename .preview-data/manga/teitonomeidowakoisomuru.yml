synopsis: 大正十年の帝都。婚約者に逃げられたみやは上京し、新興財閥・天蔵家で使用人として働き始める。好奇心から高価な洋書に触れたところを御曹司・優に見とがめられ窮地に。帰る場所もない彼女は必死に食らいついていく和風身分差ロマンス。
catch: 結婚相手に逃げられ上京した、みや。新興財閥の使用人として働き始めた矢先、御曹司・優の逆鱗に触れ窮地に。帰る場所もなく必死に食らいつく――大正帝都を舞台にした、身分違いの恋物語。

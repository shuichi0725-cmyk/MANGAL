  rakuten_caption: '天涯孤独の青年・出淵恭二は、高額報酬の日雇いバイトに参加し、

    そこで突風と共に現れた「何か」によって土中に生き埋めにされてしまう。

    朦朧とする意識の中、穴の上から彼を覗く喪服姿の奇妙な若い男女に助けられる恭二。

    兄妹らしきふたりは、初対面のはずの恭二を弟と呼び、

    強引に彼らが住まう家へと連れていく。

    彼らは、怪異に偽の由来や物語をつけて葬ることを生業とする集団ーー偽葬家で、

    恭二は生きるため、疑似家族の一員として偽葬に参加することにし…？


    大好評「領怪神犯」シリーズの著者・木古おうみノベルが待望のコミカライズ!!'

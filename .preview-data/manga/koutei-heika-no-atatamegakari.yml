  rakuten_caption: '巳の国で珍しい容姿をもつ天涯孤独の貧乏娘・菊花は

    人里離れた田舎でつつましく暮らしていた。

    そんな中、やってきた宦官に新皇帝の宮女候補として見出され、

    並べられた好条件に飛びついて後宮へ。

    ライバルたちの嫌がらせを受けながらも勉学に励む菊花の前に突如現れたのは…皇帝陛下の白香樹!?


    急に「あの時のように私をあたためてくれ」と求められても……困ります！！！！


    寒がり白蛇皇帝陛下と天涯孤独な田舎娘が溶け合うラブファンタジー第1巻。'

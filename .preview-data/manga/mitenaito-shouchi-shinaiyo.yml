  rakuten_caption: 'ーー「ととさーん、今からさか上がりをするよ。見てないとしょうちしないよー！」

    かつて、そう言って“私”の視線を独り占めしようとしていた幼い娘も、今や自分の部屋を持つ小学4年生。一方で、天真爛漫な小学1年生の息子は、公園で拾った石ころを宝物のように“私”へと差し出す。変わりゆく子供たちの成長と、今、この瞬間にしか存在しない家族の体温。


    ーー「変わっていく日々に、変わらない眼差しを」

    本作は、『急がなくてもよいことを』の漫画家・ひうち棚（たな）が、自身の家族との日々を綴る随筆漫画です。繰り返される季節、不意に訪れる成長の寂しさ、そして眠りにつく前の他愛のない約束。過ぎ去れば忘れてしまうような“今日”という一瞬を、筆者は慈しむように描き留めます。


    ーー「ずっとそばで見守れないなら、せめてずっと、見失わないように」

    「誰かに自分を見つめていてほしい」という子供たちの切実な願いは、私たちが慌ただしい日常の中で抱く「誰かと繋がっていたい」という想いへと重なり合います。二度とは戻らない“今”を、同時代を生きる“あなた”と分かち合うために。かつて公園で掘り起こされた“化石”が、あの日、父と子がそこ'

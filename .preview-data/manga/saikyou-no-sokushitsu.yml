  rakuten_caption: '男の身でありながら、若き王・ギディオンの側室となったレオシュ。


    夜ごと激しく求められながらも、自分が王にとっては後腐れなく欲を満たせる、

    都合のよい相手であることは分かっていた。

    それに応えるため、今夜も愛する王に身を委ね、レオシュは自らその熱を求める。


    「あなたのすべてを、この身体にぶつけてくれませんかーー？」


    これが最後の夜になる覚悟を、胸の奥に隠して。

    翌朝、愛する王と国を守るため、レオシュは身分を偽って戦場へ発つ。


    だが彼は知らなかった。

    王の愛が、決して手放す気のない執着であることにーー。


    孤独な若き賢王×一途な側室

    男のエロスが際立つ、官能的なフルカラーコミックス！


    ■収録内容

    ・「最強の側室」第1話〜第6話…カドコミ掲載作品を加筆修正

    ・「最強の側室」描きおろし…14P

    ・本体表紙イラスト…2P描きおろし'

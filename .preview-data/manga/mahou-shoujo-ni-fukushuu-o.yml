  rakuten_caption: '「魔法少女の存在が力をくれるっていうなら、お前らに復讐するための力もよこせよ──！」


    魔法少女が人々を救い、平和を守る世界。

    流ゆらは、唯一無二の親友キキを突然の事故で目の前で亡くしてしまう。

    現場に居合わせた魔法少女ピュアの関連を疑うが、世間は誰も聞く耳を持ってくれない。

    一人真実を求めてさまようゆらは、事故はピュアの故意で起きたものだと確信を得る。

    ゆらはピュアに詰め寄るが、魔法少女とは思えない冷酷な態度で相手にしてもらえない。

    圧倒的な力を前にキキの死をぞんざいに扱われたゆらの怒りは爆発し、

    その姿を怪人・ワルイーモンへと変貌させる──!!!


    倒すべき相手は、世界の守護者《魔法少女》！

    怒りと復讐のマジカルリベンジアクション開幕!!

    第1話：魔法少女が力をくれる

    第2話：魔法少女に復讐を

    第3話：私の怒りは正当だ!!

    第4話：そんなのじゃ収まらない'

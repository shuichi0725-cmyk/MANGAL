  rakuten_caption: "現場に残されたわずかな違和感を追い続ける、警視庁の刑事・佐倉。 \n彼が信頼を寄せるのは「死者の名医」と呼ばれる監察医・出雲。 病死や事故に見せかけても、二人は死者が最期に遺した不可解なシグナルを見逃さない。\n\nブラックライトに光る痕跡が暴く魔性の女の「甘い毒」の正体、「腎臓の障害」が語る不自然な孤独死、消えた家と貯水池の遺体を繋ぐ「髪の毛」。\nバレなければ殺し放題なのかーー？\n\
    \n死体に刻まれたメッセージを解読し、「生きている人間」の恐ろしい業と 事件の真相を明らかにする。"

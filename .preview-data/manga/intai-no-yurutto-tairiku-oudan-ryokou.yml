  rakuten_caption: 守銭奴で人でなしと悪名高い「ぼったくり武装商人」のロディは、突然の営業停止をくらってしまい、店を畳み大陸横断の列車へと飛び乗った。愛弟子アルに商売を譲るつもりが、彼女はロディにひっついてきて離れようとはしなかった。支え合うふたり…師弟関係はやがてそれ以上の関係に…？ 気ままな引退旅行となるはずが、病にむしばまれる令嬢を救ったり、危険な目に遭ったり、途中駅で事件に巻き込まれるハメに。だが超一流の武装商人に不可能はない!?　頭脳と腕っぷしでやっかいなヤツらを蹴散らしていく…！

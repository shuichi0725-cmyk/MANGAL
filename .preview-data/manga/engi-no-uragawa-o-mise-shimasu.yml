  rakuten_caption: '恋愛経験ゼロの今どきアイドル・

    藍郎が挑む初主演作は、

    退廃的な昭和旧家ロマンBL『蟷螂の檻』。

    演じるのは

    “繊細で淫猥な坊っちゃん”役で

    自分とは正反対。


    相手役は大人の色気まとう中堅実力派俳優・咲山で、

    演技に悩んだ藍郎は、役作りのために

    「本気で好きになっていいすか？」

    と大胆にも持ちかけた。


    大人としてあしらわれるかと思いきや、

    試しに触れてきた咲山の手は、色気の滲んだ「男」の熱がこもっていて、

    二人の疑似恋愛はふわりと始まった。


    そこから撮影は進み、咲山の導きは

    そっけないようでいて優しく、

    キスはアダルティックに深まっていく。藍郎はいつしか現場を離れても

    “その先“のことまで考えてしまうようになった。


    「触ってもらいたい、挿れられてみたい。あの人とすんのはどんなかな」

    ーー気づけば、藍郎はこの年上の男に溺れていたのであるーー。 5P描き下ろし！'

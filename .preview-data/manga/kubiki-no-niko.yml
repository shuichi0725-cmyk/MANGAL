  rakuten_caption: '無法の街モンド、どの国にも属さないその灰色の土地では毎日あらゆる悪行が発生する。

    そんな吹き溜まりに残った僅かばかりの秩序を守る集団「カラーレス」に所属する“ニコ”は、

    その日「人間工場」に囚われた少年“クリス”の救出に向かっていた。

    無事にクリスを発見し、あとは逃げ出すだけ。

    しかし脱出間際、ニコの頭が改造ショタ兵士の逸物に貫かれてしまい!?'

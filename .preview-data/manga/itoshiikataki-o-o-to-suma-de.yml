  rakuten_caption: '本音を隠す奴ほど暴かれたがってる


    「あんた、俺と勝負しない？」


    老舗旅館の若旦那・真紘（まひろ）は仕事一筋で、祖父母の代から続く旅館を守り続けている。

    しかし、清楚な見た目に反して激しく抱かれたい夜もあり、俺様系セフレ・秋斗（あきと）に思いっきりイかされることで欲を発散していた。

    そんなある日、大手グループ会社の御曹司として秋斗が現れて…!?

    予期せぬ再会にときめいたのも束の間、旅館の買収を賭けて「先に“好き”と言った方が負け」という勝負を持ち掛けられる。

    こんな俺様な男、本気で好きになるわけない…！

    そう思っていたのに、秋斗からの溺愛はとびきり甘くてーー。


    俺サマ甘S御曹司×負けず嫌いな純朴若旦那の、意地とプライドをかけたラブマッチ開幕！'

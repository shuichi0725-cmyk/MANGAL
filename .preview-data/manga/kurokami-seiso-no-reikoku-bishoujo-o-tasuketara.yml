  rakuten_caption: '男子高校生一条湊のクラスメイトには「冷酷姫」と呼ばれる少女がいる。

    彼女の名は七瀬冷。名家の令嬢であり、その見た目はもちろん、勉強、スポーツなど様々な面で圧倒的な存在感を放つ彼女には、男女問わず学園中に多くのファンがいたが、それらに一切目を向けず、孤高の存在であり続けていた。

    湊自身もそんな冷とはアルバイト先が同じであるものの、ほとんど接点はなかった。

    そんなある日、湊は路地裏で冷が不良の男と揉めているところに遭遇し、思わず助け出す。

    すると翌日のアルバイト後、事務所に本来シフトに入っていないはずの冷が現れ、突然湊に抱き着いた後、キスを迫ってきた。

    普段の「冷酷姫」の姿からは想像できない冷の姿に、湊はーー'

  rakuten_caption: '寝て起きて食べて動画を観て、バイト先の居酒屋へ行く。

    何気ない毎日を過ごす小松蒼生が最近ちょっと気になる人は、

    地味で真面目そうな黒髪の常連さん。

    ある夜、その常連・薬師寺 幸が泥酔しているのを発見。

    ほんの少しの下心もあって家まで送ると、意外にも乗り気な

    薬師寺に誘われてワンナイトしてしまう。

    これからに期待する蒼生だが、薬師寺はつれない態度で！？


    「幸さんのおかげ。おくすりくれたから」

    年上薬剤師×居酒屋バイトの恋のおくすりBL'

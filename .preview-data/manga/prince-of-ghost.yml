  rakuten_caption: 'FANTASTICSがプロジェクトテーマソング「Twilight Glitter」を歌う”PRINCE PROJECT”第2弾は、顔面国宝級な妖たちが導く幻想譚！


    両親を突然の事故で失い、独りぼっちになってしまった女子高生の美琴。

    遺産だというボロボロのあばら家に住むことになると、そこには怪しい棺が…。

    刹那、棺と母が遺したネックレスが光り、封印が解かれ現れたのはーー顔中包帯だらけの”半妖”、儚（はかな）。

    「涙はいらない　俺が笑顔でいさせる」

    儚と”契約”した美琴は、妖と人間、二つの種族の運命に巻き込まれていくーー！'

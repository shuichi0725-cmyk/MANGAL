  rakuten_caption: '新宿は歌舞伎町のキャバクラ「Ephemere」。そこで店長を務める男‥‥通称・テンチョウ。日々、降りかかる売上のプレッシャーや理不尽な客、トラブル続出のキャバ嬢‥‥夜の住人たちの小悪魔的・所業を前に、テンチョウのストレスは限界値を迎えていた。

    ストレスにツケ払い‥なし！テンチョウは今日も、終電の過ぎた夜の街で飯を喰らう‥‥！

    『金田一少年の事件簿外伝　犯人たちの事件簿』の船津紳平が送る、『みいちゃんと山田さん』グルメ外伝。'

    description: 母から子へ、子から孫へと、三世代に愛されるロングセラーの叙情まんが。昭和三十七年に『美しい十代』で連載を開始して以来、半世紀以上にわたって多くのファンを魅了し続けている、みつはしちかこの作品である。ピュアな恋のストーリーと抒情的な描写によって、主人公のチッチこと小川チイコと、ボーイフレンドのサリーこと村上聡の甘酸っぱい恋もようを描く。一九七六年にはミリオンセラーを記録し、日本漫画協会賞優秀賞、手塚治虫文化賞特別賞、日本漫画家協会賞文部科学大臣賞などを受賞している。

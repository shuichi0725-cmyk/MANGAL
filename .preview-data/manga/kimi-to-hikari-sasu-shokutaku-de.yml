  rakuten_caption: '人類が光合成で生きるようになり、「食事」の概念が消えつつある世界。


    光合成で生きていけるのに、おいしそうに食事をしていた祖母の姿が忘れられないコマは、

    大切な人と食卓を囲む夢を諦めきれずにいた。


    恋人の海晴（かいせい）と将来を意識するものの、噛み合わない「食への価値観」が壁となり

    二の足を踏んでしまう。

    そんなとき、目の前に落ちた“焼き鳥”の匂いに魅了され、

    思わずそれを口にしてしまい……。


    食べることは、愛すること。

    人間の本能と絆を描く、すこし不思議で温かなヒューマンドラマ。'

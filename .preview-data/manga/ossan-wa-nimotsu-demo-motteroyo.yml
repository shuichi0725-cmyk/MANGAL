  rakuten_caption: '魔王討伐を目指し、旅を続けるリーベルトたち勇者パーティ。

    森の中でモンスターの群れに襲われる少女を見つけた一行は、モンスターを一掃し少女を助け出す。


    しかし、アリアの持つ勇者の聖剣を見た途端様子が一変。

    少女は突然、アリアの腹部を刺してしまう。


    「困っているなら、この手を取って。私たちに手助けさせてよ」

    血を流しながらも優しく諭すアリアに、涙ながら告白する少女。

    その思いを察したリーベルトたちは、少女と両親を救うため、彼女が暮らすスリラーの街へと向かう。


    「おっさん」剣豪と新米勇者パーティの少女たち。

    勇者の力の真相に迫る第2巻！'

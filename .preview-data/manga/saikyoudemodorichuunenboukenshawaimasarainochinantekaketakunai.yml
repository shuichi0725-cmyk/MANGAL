synopsis: '世界最強の冒険者集団＜アリババ40人隊＞に所属していたジョンマン。

  おっさんになった今、スローライフを夢見て故郷に出戻った！

  穏やかな余生が待ち受ける…かと思いきや、史上最凶の大盗賊団が街に乱入！！

  危機を救うために撃退した結果、活躍は王都まで知れ渡ってしまう。

  さらに、冒険を夢'
catch: 世界最強の冒険者集団に所属していたジョンマンは、おっさんになった今、スローライフを夢見て故郷へ出戻った。だが穏やかな余生のはずが、史上最凶の大盗賊団が街に乱入。撃退すれば名声は王都へ轟き――命を懸けたくない元最強の、巻き込まれ無双ファンタジー。

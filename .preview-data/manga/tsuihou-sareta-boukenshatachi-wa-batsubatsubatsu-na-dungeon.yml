  rakuten_caption: 'エッチなモンスターと罠が満載のエロトラップダンジョン『アシュヴェーダ』。

    世界中の冒険者たちから難攻不落と言われたこの禁断の迷宮に、問題だらけの美少女たちが攻略することに…… !?

    パーティを率いるのは、ビキニアーマー大好きエルフの魔法戦士・コルク。

    さらにパーティメンバーには一癖も二癖もある美少女たちが加わる！

    その彼女たちを導くのは、かつて伝説の冒険者として名を馳せた魔法道具屋の店主・ダイチ。

    追放された冒険者たちが一発逆転を狙って禁断のエロトラップ迷宮へと挑むーー！'

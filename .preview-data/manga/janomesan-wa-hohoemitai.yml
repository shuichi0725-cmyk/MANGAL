  rakuten_caption: "あざと男子のギャップが垣間見える第2巻！ \n\n 元ヤン女子の蛇目さんは、目つきの悪さ故にあだ名は「メドゥーサ」。\n目標は可愛い女子高生になることだが、それは夢のまた夢。\nそこで人気者のあざと男子・桑原くんに“可愛くなる特訓”をしてもらうことに。\nしかし、桑原くんはただのあざと可愛い男子ではなく、極道の息子だった。\n\n高校ではヤンキーだった過去を隠して過ごそうとしていた蛇目さん。\n\
    しかし、なぜかその噂は校内中に広まってしまう。\n\nいったい誰が噂を流したのかーー。犯人を突き止めるため、桑原くんが奔走！？ \n\n 【編集担当からのおすすめ情報】 \n 蛇目さんのために裏で頑張る桑原くんの姿をお見逃しなく！\n描き下ろしおまけ漫画も収録！！"

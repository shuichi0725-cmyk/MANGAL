  rakuten_caption: '谷口悟朗監督のフランスが舞台の新作コミカライズ！

    輝くベルエポックのパリで夢にかける少女達の躍動をフランス人漫画家が描く！


    そこに日本からやってきたふたりの少女が暮らしていました。

    ひとりは、夫を支えるよき妻となる将来を望まれながらも、

    画家を夢見るフジコ。


    憧れの街、パリで駆け出したフジコと千鶴。フジコの後押しもあり、千鶴は元ロシアのバレリーナ、オルガのレッスンを受け始める。一方、二人は異国での現実にも直面する。輝かしい花の都に戦争の影が忍び寄る中、少女達の本当の奮闘はここから始まる！'

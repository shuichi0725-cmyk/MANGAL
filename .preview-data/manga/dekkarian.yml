  rakuten_caption: '高学歴なのに、それを鼻にかけすぎて就職戦争に敗北し

    ネット掲示板に張り付く害悪ニートと化していた渡利岳斗。


    そんな彼は、突如として現れた巨大宇宙人・デッッッカリアンに拉致され

    更生のためとかぬかして、謎の地下施設で

    他のこどおじと共に強制労働させられる羽目に。


    そんな邪智暴虐は当然高学歴のプライドが許すはずもなく

    豊富な知識を蓄えた頭脳で理屈を並び立てて論破ーー

    する余裕も勇気も出せないほどにデッッッカリアンは超パワーをもって

    こどおじを捻じ伏せて分からせていき……。'

  rakuten_caption: "あなたにパスを、送ります。 \n\n 期待の新鋭・かわじろうが贈る最新短編集、発売決定！\n\n初の単行本『あたらしいともだち』（マガジンハウス刊）で、第30回手塚治虫文化賞 短編賞を受賞！\nじわじわと熱い注目を集めている新星が描く、揺らめく思いの物語たち。\nこの気持ちが、あなたに届きますようにーーそんなささやかな願いが詰まった1冊です。\n\n『コースロープ』\n\
    走るのも勉強も苦手だけど、水の中では完璧。でも転校先でスランプになってしまったつぐみは・・・小学館第93回新人コミック大賞 青年部門大賞受賞作!\n『13歳』\n大人になったら犬を飼ってみたいけど、自分の未来は想像できない陽。塾帰り、ぽつんと待つバス停で見つけたのは・・・？\n『敬語の顔』\n無難なことしか言わ（え）ない新入社員・吉田君と、そのチューター・村松さん。二人はどこかギクシャクしたまま出張へ・・・\n\
    『ロング・パス』\nバスケでみんなと繋がっていたのに、ケガをしてしまったバスケ部員・サヤカ。意気消沈してたまたま通りかかった美術部で・・・？\n『みんなで、遠くから』\n人を撮るのがどうしても苦手な写真部員・きい。だけど生徒会の依頼で「卒業前最後の"

  rakuten_caption: '目は死んでるし無愛想、思ったことはだいたい口に出す女子高生・カナデが始めたのは、辺鄙なCDショップのアルバイト。


    レジで寝たり、勤務中にギターを弾いたり。

    勤務態度はクソだけど、なぜだか憎めない。


    マイペースすぎるカナデの周りには、今日も個性豊かな仲間たちが集まってきて……。


    ーーそんなに真面目に生きなくても、まあいいか。


    読めばちょっと肩の力が抜ける、

    愛すべきクソバイト日常コメディ、爆誕！！'

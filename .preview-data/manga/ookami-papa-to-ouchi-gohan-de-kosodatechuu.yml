  rakuten_caption: '不安は全部忘れろ。全力で愛してやるーー。家事代行会社のスタッフと顧客として出会い、ハイブリッドアルファの大神と結ばれた千明。運命の番だった二人には待望の赤ちゃんも誕生し、家は純、蓮、亮太とともにさらに賑わいを見せている。そんなとき大神の妹・ゆきがアメリカから帰国。亮太の父・アレックスとよりを戻したので亮太を引き取ると言い出して!?　

    『オオカミパパ』シリーズ待望の第2巻。描き下ろし17ページ収録！

    【受】大神千明／オメガ。保育士だったが、バースを理由に職場に居づらくなり退職。家事代行会社「マジックメイド」に就職し、奈津彦と出会う。子供好きで料理上手。

    【攻】大神奈津彦／ハイブリッドアルファ。狼の容姿を持つ、特に希少なアルファだが、見た目と違いかわいいものが大好き。人気絵本作家で、マジックメイドのオーナーでもある。'

synopsis: 次第に苛烈さを増すヤードでの激闘…。斬人、狂乱鬼共に多くの犠牲を払いながら、闘争は後戻りできない段階に突入する…‼
catch: 七代目総長・丹沢敦司と斬人六代目総長・弦巻良樹、負け知らずの最強同士が戦局を決める大一番で相まみえる。大いなる因縁を孕んだ激闘の結末――この死闘が過ぎた後、立っているのはどちらだ。熱量たぎる不良抗争アクション。

  rakuten_caption: '☆★シリーズ累計発行部数1000万部突破！★☆★

    「うんこドリル」から、うんこ先生が楽しく教える学習マンガシリーズが登場！


    小学1年生のたし算・ひき算を楽しく学べる！

    ストーリーマンガだから教科書より読みやすい！

    ドリルの勉強より前から読める、うんこ先生と学ぶ日本一楽しい学習マンガ！



    【うんこドリル学習マンガの特長】

    1．「うんこ」で楽しく読める！

    お子さまに面白く学びを伝えるうんこ先生が、小学1年生のたし算やひき算の学習を、「うんこ」を使って教えます。お子さまが興味をもって、楽しみながら読み進めることができます。


    2．学習マンガだから何度でも読んで学べる！

    キャラクターたちが冒険して活躍するストーリーマンガ形式で、たし算やひき算のやり方を学びながら物語が展開します。学校の教科書よりも普段の生活の中でお子さまが手に取りやすく、夢中で何度も読むことで自然とやり方を理解することができます。


    3．学校で習うことだから無理なく身につけられる！

    学習範囲は小学校1年生の算数の教科書で学習する、たし算・ひき算全般です。お子さまが無理なく学ぶことができ、学校の授業でわからなかったことの補完'

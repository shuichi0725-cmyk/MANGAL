    description: 舞台は西暦2015年。“ともだち”が率いる友民党の手で新青少年保護育成条例が敷かれ、思うように表現ができなくなった時代である。東京に建つ常盤荘というアパートには、氏木と金子という二人の漫画家が住んでいる。彼らは二人で一つのペンネーム「ウジコウジオ」を名乗り、CGが全盛となった世の中であえて墨汁とペン先だけを頼りに、漫画界へ旋風を起こそうと意気込んでいた。ところが渾身の自信作をユキジに見せたところ、容赦のない酷評を食らってしまう。強烈なダメ出しを浴びて二人の漫画家魂は逆に燃え上がり、ユキジを唸らせる作品を描いてみせると新作で立ち向かう。こうして前代未聞の漫画対決が幕を開ける。浦沢直樹と漫画家コンビ・ウジコウジオの共作による『20世紀少年』のスピンオフ作品集。

  rakuten_caption: '心がささくれだった日は、あたたかくておいしいものを食べればいい。

    思っているより大人は自由で、昼からビールを飲む日があってもいい。


    蚤の市で買った器にもっちりとした桜餅、真夏の昼下がりのクラフトビール、秋に焼くタルトタタン、梅雨寒の日のオムライス、満月の夜のシュークリーム……。


    心躍る色彩と流れるような線、どこか懐かしいレトロポップな世界観で人気を集めるイラストレーター・日菜乃、初の描き下ろしイラストコミック。

    お菓子、花、アンティーク、レース、そして読書。大好きなものに囲まれて、おいしいものを食べて、なんでもない毎日を少しだけ楽しくする。


    うまくいかない日も、どうにか乗り越えなくてはいけない日もある。

    それでも、自分の「好き」をちゃんと集めていけば、生活は案外悪くない。


    今がいちばん楽しい。きっと、この先も。


    続いていく毎日のなかで、自分のご機嫌を自分でつくるための、小さな魔法が詰まった一冊。'

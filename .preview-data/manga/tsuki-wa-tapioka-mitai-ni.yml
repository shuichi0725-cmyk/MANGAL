  rakuten_caption: 'タピオカ大好きな人気インフルエンサー・白井紗月、25歳。

    誕生日に交通事故で命を落としたーーはずが、目覚めると台湾の女の子・ユエの体になっていた!?

    ユエが残した小さな料理屋を引き継いだ紗月は、大好きなタピオカを使った創作料理に夢中に！

    このまま平穏な第二の人生を送っていく……と思ったのに、体の元の持ち主の魂の行方を捜すことになってーー!?

    手がかりをくれるのは、ユエの友人だという霊能者・イエン。

    おいしい台湾グルメを味わいながら、2人はゆっくり「魂捜し」を始めることに。


    台湾の街角で始まる、ちょっと不思議でおいしい日常グルメ百合！'

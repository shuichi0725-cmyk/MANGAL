  rakuten_caption: 'LINEマンガで大人気！実写ドラマ化もされた、

    甘く切ない青春群像劇が待望のフルカラーコミック化！


    【あらすじ】

    「俺は君が・・・俺のこと好きだと思ってたんだけど」​

    誰からも愛される完璧な優等生の主人公、裕木春奈。


    ある日、春奈はひょんなことから

    親友の咲が、自分が好きな男子である伊吹蓮に

    ひそかに想いを寄せていることを知る。

    親友との友情を守るため、クラスで少し浮いている地味な男子である

    瀬戸俊介が「好きな人」だと嘘をついてしまう。


    瀬戸俊介に対し、慌てて偽装恋愛の

    フリをお願いする春奈に対し、

    彼の返事は意外なもので……？

    嘘から始まった二人の関係は、

    やがて本物の恋へと変わっていく。


    本作は「春・夏・秋・冬」の四季をテーマに、

    季節ごとに主人公カップルが変わるオムニバス形式のストーリー。

    第1部の「春（春奈の花）」では、偽装恋愛から始まるピュアで甘酸っぱい初恋を。

    続く季節では、過去の喪失や10代の抱える悩み、

    友人関係の葛藤などを、時に切なく、時に温かく描き出します。


    スマホ画面を彩った美麗なフルカラー原稿を、紙の単行本として美しく再構成。

    笑って、泣いて、胸が苦し'

  rakuten_caption: "生と死を巡る、 青春幻想譚の最高到達点 \n\n 雄一くんが死んだ。あんなに優しい子が？そんなこと、あるはずがないのに。\n\n「ゴメン わたし知ってたのに 雄一くんが亡くなってしまうこと」\n「は？」\n「だってわたし見えるんだもん」\n\n同級生の女子高生・千鈴はそう言って、雄一くんの最期を\"知っていた\"と告げる。彼女は人の死が見えるらしい。\n残された雄一くんの親友・光文は、不思議な同級生の千鈴とともに友の死の謎を辿り始める。\n\
    \nーーそしてふたりは、もうひとつの“終わり”を知っている。\n千鈴が、一年後に死ぬということを。 \n\n 【編集担当からのおすすめ情報】 \n 人が生きるとは、死ぬとはどういうことか？もし身近な人がこの世からいなくなったら、誰がどのように感じて生きていくことになるのか…\n壮大な、かつ普遍的なテーマを、圧倒的画力で描き出しています。\n命はなんと美しく儚いのか＿＿\n\n大量ページの描き下ろしも収録！"

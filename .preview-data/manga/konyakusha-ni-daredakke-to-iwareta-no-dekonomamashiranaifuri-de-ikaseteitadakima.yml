  rakuten_caption: '原作：編乃肌・コミックシーモア少女マンガ毎日ランキング1位（2026年3月8日付）獲得の大人気作品。

    健気で強気な薬師娘は恋人に忘れられたようです……ふざけんな！


    「あー……お前、誰だっけ？」


    変わり者扱いされている薬師のシェーラには、戦場に行った婚約者グランがいる。

    グランは必ず、シェーラの元に帰ると約束した。だから周りに独り身だ、行き遅れだと揶揄されようと、彼を待ち続けたのだ。

    しかし、帰って来たグランは記憶喪失になっていて……シェーラのことをすっかり忘れており、さらには最低のクズ野郎に変貌!?

    「そっちがその気なら、いいですよ」

    シェーラが取った行動は……


    記憶を失った!?騎士様と、健気で強気な薬師娘の攻防戦ラブ！

    第1話　最悪な再会


    第2話　記憶喪失の裏側


    第3話　私は貴方をーー


    第4話　ばか


    巻末描き下ろし　グランの惚気話？'

  rakuten_caption: '「メルル」こと王女メルヴィリーナの初恋は妖精さんが逢わせてくれた銀髪の王子様。再会を夢見ていたけど、隣国の王・エセルバートとの政略結婚が持ち込まれる……！

    不安を抱えた初対面、銀髪だからなのか、懐かしさまで覚える気が……!?

    期待と緊張とで迎えた初夜、何故か途中で切り上げたエセルバート……悲嘆に暮れていると不思議な声が聞こえるようになってーー「俺はメルル相手にしか勃たないのに!!」って……？


    私だけにむっつり欲情が止まらない旦那様との、シゲキ的新婚生活！'

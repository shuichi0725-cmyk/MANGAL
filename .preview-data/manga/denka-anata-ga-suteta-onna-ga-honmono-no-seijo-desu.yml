synopsis: ランベルスという小国には、強い癒やしの力を持ち国に繁栄をもたらす“聖女”が存在する。第一王子メイナードと政略的に婚約していた侯爵令嬢アイリーンは、ある日突然、彼から婚約破棄を告げられる。だが次代の聖女を選ぶ儀式で――。
catch: 国に繁栄をもたらす“聖女”が存在する小国。第一王子と婚約していた侯爵令嬢が突然の婚約破棄を告げられ、次代の聖女を選ぶ儀式で——。逆転ラブファンタジー。

    description: 練紅炎が率いる西軍と、白龍が率いる東軍。煌帝国を二分する戦が始まる。金属器でも兵の数でも勝る西軍が優勢のまま戦況は進むが、追い詰められた白龍にはとっておきの秘策があった。国に残った紅炎と、国を飛び出した白龍。時を経た兄弟は皇帝同士として戦場で相まみえ、それぞれの想いが戦いの行方を左右する。一方、見知らぬ大地を旅するアリババとジュダルは、思いがけない「人物」と出会い、世界へ迫る危機を知らされる。

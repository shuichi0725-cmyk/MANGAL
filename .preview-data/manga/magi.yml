    description: 『聖宮』を奪い取り、ウーゴとダビデを従えたシンドバッドは、世界のルフを書き換えていた。アラジンはそのやり方に異を唱えるが、世界中の人々はすでにシンドバッドの思考に染まっている。アリババはモルジアナと語り合った末、シンドバッドと戦うことを決意する。さらにジュダルと白龍も姿を見せ、それぞれの心の内が問われる。物語が始まった場所である『聖宮』を舞台に、世界を賭けた死闘が幕を開ける。

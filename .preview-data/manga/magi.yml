    description: 世界をルフに還そうとするシンドバッドに抗うため、アリババたちは最強の布陣で聖宮へ乗り込む。聖宮内に構えられた七つの迷宮で待ち受けるシンドバッドは、自らの過去を語りながら、アリババたちへ神としての問いを投げかける。迫力ある魔装のぶつかり合いとともに、それぞれの信念が正面から衝突する。さらに、白龍との戦いに敗れたあと「死後の世界」を訪れていたアリババが、そこで出会った人々や、復活までの間に起きていた出来事も明かされる。

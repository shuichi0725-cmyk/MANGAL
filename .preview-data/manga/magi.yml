    description: 死後の世界で経験したことを糧に、アリババはシンドバッドへ決死の説得を試みる。その器を目の当たりにしたシンドバッドの感情にも変化が生じるが、その瞬間、地上では大峡谷に異変が起きる。聖宮の主の座はダビデが奪い取り、『世界のすべてをルフに還す魔法』を完遂させようとする。アリババたちは聖宮での戦いをシンドバッドに託して地上へ戻るが、地上の人々は魔法の影響で「ルフに還るのが幸せ」と考えるようになっていた。世界中から敵意を向けられたまま、その世界中の人々を守る戦いへと深まるなか、アリババの前に剣の師匠シャルルカンが立ちはだかる。

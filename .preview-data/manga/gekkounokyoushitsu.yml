synopsis: 普通の会社員・箕輪進夢のもとに、小学校時代のクラスメイト黒藤舞夜が現れる。黒魔女と呼ばれた彼女は、かつての同級生が全員死に、自分たちもじきに死ぬと告げる。舞夜の魔法で魂だけ過去へ転移した進夢は、同じく転移した仲間とともに運命に抗う。
catch: かつての同級生は全員死に、自分もじきに死ぬ——黒魔女と呼ばれた少女の魔法で魂だけが過去へ転移した青年。同じく時を遡った仲間とともに、避けられぬ死の運命へ抗う。謎が謎を呼ぶ、転生サスペンス。

  rakuten_caption: "北の大地を脱出せよ！ \n\n 天明2年。商い用の荷を積み江戸へ向かう航海に出た大黒屋光太夫一行。 しかし突然の暴風雨に襲われ、船は黒い荒海へと飲み込まれてしまう。 果てしない漂流の末、仲間たちがたどり着いたのは、日本人の誰も知らない異国の地だった。 言葉も文化も通じず、食べ物も口に合わない、生きることさえ困難な世界。 絶望に沈む仲間たちの中で、故郷への想いを胸に未知の世界へ挑む男たちの、実話をもとにしたヒストリカルロマン、第一巻！"

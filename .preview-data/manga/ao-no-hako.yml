synopsis: 高校最後の1年、さまざまな重圧を感じる大喜を息抜きに自然公園へと連れ出した雛。励ます中で、初めて見る大喜の表情に雛の感情が込み上げ──。そして始まるIH地区予選。徐々に自分のペースを取り戻しながら勝ち進んだ大喜は、ついに親友・匡との対決へ──!!
catch: バドミントン部の少年が想いを寄せるのは、毎朝一緒に練習するバスケ部の先輩。ある春の日、二人の関係が大きく動き出す。恋とスポーツの青春。

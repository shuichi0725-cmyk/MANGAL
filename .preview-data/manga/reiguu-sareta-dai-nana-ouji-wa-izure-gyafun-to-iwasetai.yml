synopsis: 元社畜の男が転生したのは、実力主義の帝国の第七皇子ルクス。魔力をほとんど持たず無能と蔑まれた彼は、自分と母を守るため鍛錬を重ね、人知れず世界屈指の魔法使いへと成長していく。

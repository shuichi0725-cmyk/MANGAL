  rakuten_caption: '「ていうか甘えさせろ、お兄ぃ」

    会社では俺を震え上がらせる“鬼部長”・奏さん。

    けれど家に帰ればすぐに「だっこ」とくっついてくる、距離感ゆるゆるな甘えん坊妹だった。


    抱き枕にされて眠ったり、一緒にお風呂に入ったり……。

    無防備な妹ムーブで自由奔放。こんな姿、絶対会社では見せられない。

    だけど本当は、俺にも奏さんにも秘密があって…。


    “鬼”な彼女の一番甘い顔を知ってしまう、ギャップありすぎラブコメ!'

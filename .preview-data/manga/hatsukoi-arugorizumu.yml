  rakuten_caption: "理系たちの理屈じゃ解けない青春ラブコメ！ \n\n 生粋の研究好きが集う理系進学校・晶陽科学技術高等学校。\n\n得意科目が文系の夏目行人は、場違い感に戸惑いながらも高校生活をスタートさせる。 そこで出会ったのは、ロボットを介してしか話さない少し変わった天才美少女・雨宮凜と、明るく奔放に見えて実はまじめな理系ギャル・九条りお。 \n\n「やりたいこと」を見つけるため、雨宮さんの研究を手伝うことを決意した夏目くんは、廃部だったデジタル研究部の復活させる。なぜか九条さんも入部することになり…。\n\
    \n 理系だらけの学校で始まる、ひとつの目標とふたつの恋。 恋する理系たちの青春譚開幕ーー！！ \n\n 【編集担当からのおすすめ情報】 \n ロボットを介してしか話さない雨宮さんと、明るく見えて実はまじめな理系ギャルの九条さん。\n全く違う2人のヒロインが、とにかく可愛いんです！！\n文系男子・夏目くんと彼女たちが過ごす、ちょっと変わった理系高校の日々を、ぜひ第1巻で見届けてください！"

  rakuten_caption: '「真咲くんの身に何かあったら、僕も死ぬ！」


    彼女の浮気、上司からのパワハラ、終わらない激務。

    すべてに疲れ果てた篠山栞は、今生を終わらせようと決意してーー

    その瞬間、目に飛び込んできたのは、今にも橋から飛び降りそうな青年！？


    思わず引き止めてしまった青年・真咲は、どこか危なっかしくて、栞は自分のことも忘れて諭してしまう。

    しかし、真咲の何にもとらわれない真っ直ぐな瞳に射抜かれた栞は、勢いのまま彼に告白してしまい…。


    「毎分毎秒生存確認したい」「真咲くんは僕の生きがい」「真咲くんは僕の全て」

    心配しすぎてもはやオカン！？重すぎる社畜と、無敵の天然力で全ての危険を無効化していく青年の、奇妙でピュアなラブコメディ！'

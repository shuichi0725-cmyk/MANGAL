  rakuten_caption: '国に尽くすも「破滅の女帝」として処刑される人生を10回繰り返したカミラ。

    死ぬたびに17歳の誕生日に戻る彼女は、11回目こそは女帝にはならず、自分の幸せのために生きると誓う。

    だが、城からの脱走を画策した矢先、未来の処刑人・ラースと遭遇する。

    戸惑うカミラだったが「この天敵を味方にすれば死を回避できる」と閃き、彼を婚約者に据えることに決める。

    果たして二人は、死の運命を回避し、平和な未来を手に入れることができるのか!?

    大注目のループファンタジー、待望の第1巻！'

  rakuten_caption: '見知らぬ男性と同居!?　息子を奪われないためなら…


    カーリーは養子のビリーを必死に育てていた。そこに突然、ビリーの父親と名乗るアレックスが現れ、息子を引き取りたいと言いだす。独身で仕事命の男性に赤ん坊を育てられるわけがない…。ビリーは絶対に渡せないわ！　引き渡しを拒むカーリーに、ビリーと一緒に自分の家で同居しないかと持ちかけるアレックス。ビリーのためにしぶしぶ承諾するが、生まれも育ちも趣味嗜好も正反対、水と油のふたりは一緒に暮らしはじめたあとも、何かと衝突してばかりいて…!?'

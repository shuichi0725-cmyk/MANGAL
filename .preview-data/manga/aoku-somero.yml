synopsis: 兄は天才だった。わずか十五歳で世界のトップチームから誘いを受ける「日本サッカーの至宝」。マドリードかバルセロナか、誰もが行き先を見守る中、神童は驚きの選択をする。「出来の悪い弟が入学する日本の高校へ行く」と。兄弟が巻き起こすサッカー漫画。
catch: 十五歳で世界トップチームに誘われた神童の兄。誰もが行き先を見守る中、彼は「出来の悪い弟が入る日本の高校へ行く」と告げる。兄弟が巻き起こすサッカー漫画。

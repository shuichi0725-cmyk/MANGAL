synopsis: 暗殺者養成の最終試験として「あずさ荘」に集められた四人の暗殺者。半年の間に殺し合い、生き残る者を決めるのが最後の試練だった。それぞれの事情を抱えた魚成、鈴鹿、戸川、三熊が共同生活を始め、初めての外の世界での暮らしを楽しみ始めるが…。
catch: 「半年以内にひとりの生き残りを決めろ」と命じられ、殺し合いを強いられる4人の若者。明かされる過去と黒幕の正体の果てに待つものとは——スローライフと生死をかけたサバイバルが同居する、新感覚サスペンス。

  rakuten_caption: 'ヴィンセントにかけられた呪いを解くため、塔の魔女であるヨアンと踊ったユリノ。

    呪いを解くことに成功するも、突如闇色の染みが地面を覆い尽くす。

    それは新しい魔王に指名だった……。

    罪悪感に苛まれるユリノに寄り添うヴィンセント。

    少しずつ募る想いを無視できなくなっていると、「元の世界には帰れない」と告げられてしまう！

    すれ違う二人、失恋によって傷付いたユリノが選ぶ幸せとは？


    逆押しかけ女房（？）物語、ここに完結！


  rakuten_caption: 北陸の富山に暮らす、高校生のあこと多古。二人の夢は合作の小説で賞を獲り、上京すること。それは頑張れば手が届くもののはずが、彼女たちの前には高すぎる壁がそびえたっていた。二人が住む街では、この10年ずっと雪が降り続き、街から外へは出られない状況に。出ようとすれば大きなリスクが、という噂もまことしやかにささやかれている。そんな雪に囚われた街で、二人は夢見るだけしかできないのか。息苦しくも瑞々しい青春奇譚、開幕！

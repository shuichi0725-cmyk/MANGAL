  rakuten_caption: 俺のゴリアンは「かわいい」じゃなくて、「かっこいい」んだ。　小学生低学年までガキ大将だった小里杏。通称ゴリアン。小学生高学年で転校して、同級生の知多に恋心を抱き、少しでもかわいく見せたいとダイエットしてかわいい系男子を目指して努力してきた。そして今では自他ともに認める、かわいい男子に見事に大変身！なのに、高校生になり、知多と同じ高校に進んだ杏の前に、ガキ大将時代の同級生・神座が現れた!!元ガキ大将と子分の、かみ合わない微妙な関係の行方はーー!?

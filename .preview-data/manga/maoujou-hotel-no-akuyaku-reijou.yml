  rakuten_caption: '尊敬する父親に陥れられ悪役令嬢とされたラヴィニア。


    復讐のための資金稼ぎの場に選んだのは魔王城を改築したホテル・アルハイムだった。

    魔王の末裔であり総支配人の美青年ルードベルトを篭絡して経営権を奪おうとするが、あっさり失敗。

    しかし成り上がりを目指すラヴィニアは、“悪の知識”で宿泊客の悩みを次々と解決してゆきーー。


    魔王のホテルで繰り広げられる野望と人情の物語、第2巻！'

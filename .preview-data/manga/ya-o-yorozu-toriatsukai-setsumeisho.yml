  rakuten_caption: "全く新たな和風×神々契約譚！ \n\n 幼いころから不思議なものが見える以外は、ごく普通の大学生・栞。\n就職先の倒産をきっかけに「カムイ」の職を紹介された栞は、久我山迅という青年と出会う。\n「カムイ」とは、神や鬼といった【畏（かしこ）さま】と契約を結ぶ、国家付属の組織であった！\n「でもまあ いいか やるしかないしな」\n早速適正試験を受けることとなった栞だが、不測の事態に見舞われ、早くも【畏さま】と契約することとなりーー！？\n\
    「電撃デイジー」「クイーンズ・クオリティ」の著者が紡ぐ、全く新たな神々契約お仕事ファンタジー！ \n\n 【編集担当からのおすすめ情報】 \n 「コミックシーモア」にて単話売り配信初月早々、ランキング1位獲得！\n高評価口コミも殺到！\n「和風神々好きにぶっ刺さる」\n「主人公、度胸がありすぎてかっこいい」\n「紙コミックスになったら絶対に買いたい」\n「アニメ化したらいいのに！」\n読めば夢中になる話題作が、ついにコミックス化いたします。\n\
    \n即断即決の主人公・栞と、謎に満ちた黒ずくめの青年・迅。\n2人が紡ぐ全く新たな神々契約譚、ぜひお楽しみください！"

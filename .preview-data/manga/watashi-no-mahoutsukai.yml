  rakuten_caption: '『君とはまた、いつかどこかで会える気がするよーー』

    幼い頃に両親を亡くしたソフィは、魔法大国・ツァウバル王国の美貌の王弟ジークベルトと運命の出会いを果たす。

    父の生家である伯爵家に引き取られ、使用人のような日々を過ごしていたソフィは、罰として「白薔薇宮」の下働きに送り込まれることに……。

    新天地では、9歳の時に負った醜い火傷痕のせいで孤立してしまう。しかし宮廷薬師と出会い、火傷痕を治す研究の傍ら化粧の技術を磨き上げる！！

    ついにその腕が王妃様に認められ、王宮にも出仕することになって……！？努力で幸せをつかむ、新たなる逆転劇スタート！！

    ☆描き下ろし漫画も収録☆'

  rakuten_caption: 私は貴方を失望させた　商社を営む裕福な家の令嬢ソフィは、生まれつき皮膚に奇病を抱え、その見た目から周囲に「化物嬢」と呼ばれていました。学園でも心ない扱いを受け、やがて退学することに…その後、ソフィはわずかながら持っていた光の癒やしの力を磨き、皮膚や傷など“皮一枚”を治すサロンを屋敷で開業します。大きな病気や重傷を治せるわけではありませんが、火傷や痣、肌の悩みを抱える人々の話を聞きながら、少しずつ傷ついた心までほぐしていきます。自分探しは幸せさがし、心が疲れたら是非お越しください。ハートフル治癒コミック第5巻登場！

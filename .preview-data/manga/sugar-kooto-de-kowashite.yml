  rakuten_caption: 'かつて世間の話題をさらい、今はスランプに沈む作家・篠原秋斗（しのはらあきと）の裏の顔は、今ネットで旬の官能小説家“シュウ”。

    数カ月前マッチングアプリで知り合った「X」とのチャットをネタに綴るーーその刺激的な世界だけが、唯一の逃げ場だった。

    だが「X」との邂逅が、すべてを狂わせる。目の前に現れたのは昔の同僚で、今は有名編集長となった成田一颯（なりたいぶき）。

    彼は篠原の正体をすでに見抜き「どんな名で書いても、お前の物語は俺が導く」と告げてきて…！？'

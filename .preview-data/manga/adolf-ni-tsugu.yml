    release_date: 2008-08
    description: 秘密文書を奪おうと執拗に草平を追う特高の赤羽警部。もみ合いの末に足を滑らせた赤羽は後頭部に深手を負って人事不省となり、草平は傷害放火の容疑で警察に留置される。4か月もの黙秘を続けた草平だが、「仏の仁川」と呼ばれる仁川警部を前に、ついに文書の内容を打ち明ける決心をする。一方、ドイツ領事館員を父に持つカウフマンは、ヒトラー・ユーゲントの一員として、次第にナチスの思想に染まっていく。
  - number: 3

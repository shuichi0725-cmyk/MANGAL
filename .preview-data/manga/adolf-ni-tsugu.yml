    description: 戦争末期の混乱の中、密令を受けたカウフマンは荒廃した神戸に渡り、ついに念願の極秘文書を手にする。だがその時、驚愕の知らせが届く。ヒトラー生誕の秘密を全世界に公表しようとする者と、取り戻そうとする者。三人のアドルフをめぐる大河ドラマが完結を迎える。

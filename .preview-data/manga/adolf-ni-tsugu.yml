    description: 1936年8月、ベルリン五輪取材中の協合通信記者・峠草平は、ベルリン大学に留学する弟・勲から大事な物を渡したいと呼び出される。取材が長引き2時間遅れで下宿を訪れた草平が見たのは、無惨に殺された弟の姿だった。弟が命がけで入手したのは、ヒトラー生誕にまつわる極秘文書。これを手にした草平は特高警察に目をつけられて職を失い、ゲシュタポにも察知されて逃亡生活へ追い込まれる。一方、神戸ではドイツ人外交官と日本人の母を持つアドルフ・カウフマンと、ユダヤ系ドイツ人のアドルフ・カミルという二人の少年が、立場を超えた親友として結ばれていた。
  - number: 2

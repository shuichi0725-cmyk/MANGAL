    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09182067.jpg?_ex=300x300
    release_date: 2008-09
    description: 昭和16年5月、神戸のパン屋ブルーメン。カミルのもとを、憲兵隊長の息子でありながら軍国主義に反対する本多芳男が訪ねる。カミルは肌身離さず持っていたヒトラーの出生文書を芳男に託し、ラムゼイという男に渡すよう願う。この事実を全世界に公表しようと、カミルはソ連のスパイ・ゾルゲの組織に接近していく。一方、文書を取り戻そうとするカウフマンはUボートで日本へ渡る。三人のアドルフをめぐる大河ドラマ、完結編。

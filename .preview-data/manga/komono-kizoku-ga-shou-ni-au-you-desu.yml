  rakuten_caption: '庶民の前では威張り散らすのに、小さな領地しか持たない特権階級の最底辺。そんな小悪党貴族に転生してしまったハチは、節約好きの前世を活かして「慎ましく目立たない小物貴族」を目指すことを決める。だが、その「勿体ない精神」が特異な魔力と、便利すぎるスキルを彼に与えてしまった！　


    さらに、優秀すぎる姉たちの恩恵によって許嫁まで決まり、美人師匠のもとで剣術修行も開始。本人は平穏な人生を望んでいるにもかかわらず、その規格外の実力は周囲の大物たちの目に留まり始めーー!?


    「目立ちたくない」のに隠しきれない才能！

    勘違いと無自覚が巻き起こす、成り上がり（？）異世界貴族ファンタジー第1巻！'

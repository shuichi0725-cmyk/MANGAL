  rakuten_caption: '不吉の象徴とされる白い髪を持つ翠月国の公女・紅玉は、反乱軍の焼き討ちですべてを失う。

    そして五年後。「紅林」と名を変えて市井で生き延びていた彼女は、皮肉にも現皇帝・関ショウの後宮に宮女として売られるはめに！

    変わり者の衛兵とともになぜか後宮で頻発する失せ物事件の調査に乗り出すことになるが、彼の正体こそ、女嫌いと噂される冷酷な皇帝・関ショウだったーー


    ※関ショウの「ショウ」は「王」へんに「召」'

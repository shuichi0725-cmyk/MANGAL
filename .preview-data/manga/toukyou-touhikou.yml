  rakuten_caption: '家や学校に居場所がない女子高生・飛鳥は、“トー横”で暮らす少女の自伝的ネット小説『東京逃避行』に憧れ、新宿歌舞伎町へ。

    そこで偶然、作者の日和と出会い意気投合することに。メリオという男を紹介された飛鳥は

    彼らの拠点に遊びに行くが、そこで目にしたのは衝撃的な現実だった…。

    飛鳥は「一緒に逃げよ」と日和の手を取り、走り出す。

    予測不能な一夜の逃亡劇が繰り広げられる──!!'

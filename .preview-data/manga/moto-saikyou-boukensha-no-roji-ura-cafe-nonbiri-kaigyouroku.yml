  rakuten_caption: '王都の片隅で静かに営業する喫茶店シリウスは、つぶれていないのが不思議なほど店内はガラガラ。

    だが、実は喫茶店のマスターであるギルバートは、莫大な資産を築き上げた元最強冒険者でーーカフェで儲ける気はゼロだった!?　

    そんなやる気なし営業でも、おいしい料理と居心地の良さを気に入った客が通いはじめ、店内は次第に賑やかになっていき……。

    魔王を倒して世界を救った元最強冒険者と明るくて働き者な少女。秘密を抱えるふたりが送る、笑いあり涙あり、たまにバトルもありの日常劇！'

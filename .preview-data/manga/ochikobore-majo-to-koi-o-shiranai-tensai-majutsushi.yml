synopsis: 魔法に支配された世界では、魔力が強いほど髪が月光に近づき、弱いほど暗くくすんでいく。すすけた煉瓦色の髪を持つアシュリーは、魔法の研究には秀でているが魔力は極端に弱く、魔導士になる夢を叶えられずにいた。やがて彼女は、誰も触れられぬ強大な魔力を持つ幽閉された青年の指導を任されることに——。逆転ラプンツェルなファンタジー恋愛漫画。

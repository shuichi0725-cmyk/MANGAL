synopsis: 動画で人気のキャラクター「お文具さん」たちが繰り広げるフルカラー作品。個性豊かな仲間たちと過ごす、クスッと笑えてちょっぴり泣ける、心がゆるくほどけるような日常を描く。
catch: YouTube登録者数105万人オーバー、ワールドワイドに活躍するまんまるお文具さん。個性豊かな仲間たちといっしょに、クスリと笑ってちょっぴり泣いて。あなたのココロもゆるくしてくれる、フルカラー癒やしコミック。

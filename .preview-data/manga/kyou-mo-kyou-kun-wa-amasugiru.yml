  rakuten_caption: "「俺がアンタを甘やかすわ」\n\n頼み事を断れず、他人に甘えられない“いい子”代表の草壁二葉（くさかべふたば）。\nその性格が災いして、3年付き合った彼氏に振られてしまう。 \nあまりのショックに部屋の前で呆然としていると、隣人のヤンキーに「邪魔なんだけど」と冷たくあしらわれ、踏んだり蹴ったりのどん底に。\n翌朝、隣人に弁当を押しつけられた二葉。素っ気ない態度とは打って変わって可愛すぎる弁当に少し癒されたのも束の間、彼の正体は姪っ子が通う保育園で「桜王子」と大人気のキョウ先生だったことが判明！\n\
    しかもその日から、なぜかお隣さんのよしみ（？）で\"過保護な甘やかし生活\"が始まってーー！？\n\nお隣さんの元ヤン保育士との沼きゅんラブコメ、開園♡"

synopsis: かつて美しい神だったデイモスは、想いを通わせ合った美しい女神を愛していた。だが彼女は実の妹。背徳の罪でオリンポスを追われた二人は、悪魔と海底に朽ちる屍へと姿を変える。妹か、その生まれ変わりの人間の少女か——選択を迫られる、幻想ホラー・ロマンス。

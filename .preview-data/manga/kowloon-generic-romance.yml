synopsis: 此処は東洋の魔窟、九龍城砦。ノスタルジー溢れる人々が暮らし、街並みに過去・現在・未来が交差するディストピア。はたらく30代の男女の思い思いの選択と決断。生活彩る恋愛模様を出色の筆致で描いた日常哲学、金字塔。なつかしくて新しい理想的なラヴロマンスを貴方に──。
catch: 過去も未来も交わる九龍城砦。ノスタルジアに満ちた街の片隅で、不動産屋の彼女をめぐり、街そのもののように懐かしい恋が静かに動く。

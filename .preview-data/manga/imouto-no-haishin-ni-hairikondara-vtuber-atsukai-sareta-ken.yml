  rakuten_caption: 'それは名家令嬢設定のVTuber・春風桜の配信事故から始まった。

    配信中に寝落ちして家族の音声が入ってしまうという、よく聞く配信事故がまさかの万バズ。

    そのVTuberが俺の妹で、さらにその家族が俺だなんて…。

    事故の詫び配信をきっかけに春風桜の「兄者」として配信に巻き込まれていく俺を待っていたのは、

    ガチオタ女子、女神だけど酒豪なパイセン、残念ゲーマーな魔王と、ヤバいVTuberだらけ。

    ーー今から入れる保険はありますか？？

    爆笑必至のドタバタ配信コメディ！'

synopsis: 'それは、闇夜に一筋の蜘蛛の糸を探すようなーー。


  大学に進学をした志のぶは、キャンパスライフを満喫。

  学食で翡翠のペンダントに見入っている留学生に声をかけ、地殻で自然が生み出す、宝石生成トークで盛り上がる。


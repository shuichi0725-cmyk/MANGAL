    description: 物語はいよいよクライマックスへ。ゲームシステムのコントロールを争うのは、ペリエとトミエ。ステージルームを死守する飯田たちには、クイーンの特殊部隊が迫る。それぞれの戦いが決着を迎え、プレイヤーはさらなる佳境へ立たされていく。新兵器を搭載した新たなドローン、そして拭うことのできない大きな痛手。それらを乗り越えた時、最後にして最大の敵が坂本の前へ立ちはだかる。

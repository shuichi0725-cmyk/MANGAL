    description: 飯田とペリエが、ついに動き出す。ティラノスジャパン制圧のためサーバへ細工を施す飯田だったが、シュヴァーリッツの部下トミヨが仕掛けたトラップが発動してしまう。その頃、島ではヒミコと坂本が窮地に陥っていた。現実を受け入れた坂本は、どうするのか。さらに坂本を追い、要塞へと攻め込んできた吉良によって事態は混乱していく。以前に増して強さを身に着けた吉良。何が彼をそうさせたのだろうか。戦いが加速する、緊迫の第21巻。

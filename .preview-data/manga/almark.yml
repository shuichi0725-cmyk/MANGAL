synopsis: 'アルマークは、きたる武術大会に向け

  クラスメイトたちと自主練習に励む日々を送っていた。

  魔力が不安定になる日食の日。

  秘密の特訓場所を探していたアルマークたちは、

  突如現れた「穴」の底に横たわるクラスメイト・キュリメを発見する。


  キュリメの安否は、そして穴の底で彼らを待ち受けて'
catch: 戦の絶えぬ北の地で、父のような傭兵を夢見る少年アルマーク。臆病な息子を案じた父は、平和な南の魔法学院という別の未来を描く。やがて少年は旅立つファンタジー。

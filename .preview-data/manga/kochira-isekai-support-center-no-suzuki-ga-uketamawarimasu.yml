  rakuten_caption: '異世界のサポートセンターに勤務するオペレーター・スズキさん。

    転生してきた勇者による器物破損、魔族と勇者の戦闘に巻き込まれた…。

    彼女の元には日々、様々なお問い合わせ電話が舞い込んでくる。

    ある日、非道な勇者に追い詰められた半魔族の少年・マオからの電話を受け、

    現場に向かったスズキさんはマオもろとも絶体絶命の状況に追い込まれる。

    そんなスズキさんを助けに現れたのは赤髪の勇者・トーマ。

    彼もまた、スズキさんに救われた過去があるようで…？


    転生者”ではない”スズキさんが送る、異世界ワーキングファンタジー第1巻！


    description: 合同合宿で出会った瑞穂と本牧東。誓いのとおり神奈川県の頂点を賭けて、ついに決勝のコートで対峙する時がきた。瑞穂はマンツーマン、本牧東はボックス・ワンで試合が始まる。哀川が三ポイントで先制すれば保科がダンクで巻き返し、互いに一歩も譲らぬ展開に。強化された本牧東のディフェンスに苦しむ瑞穂だったが、藤原の意表をついた三ポイントが相手を翻弄する。哀川と藤原のコンビプレイで流れは瑞穂へ傾き、本牧東は藤原を止めるべくオールコートのマンツーへ切り替えて引き戻す。互いの意地がぶつかり合う決勝戦は、瑞穂のリードで前半を終えようとしていた。

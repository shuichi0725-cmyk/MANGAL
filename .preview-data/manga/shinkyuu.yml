  rakuten_caption: '戦争記念碑を手掛けるロシアの彫刻家とアメリカの映画監督が煉獄で課せられたのは「真球」を制作することだった──『銃座のウルナ』 で熱狂的な支持を得た伊図透による最新書き下ろし巨編、ついに始動！


    ❖推薦の言葉──沼野充義（ロシア文学者）

    20世紀のソ連は、途方もない理想の実現を夢見る実験国家だった。その見果てぬ夢が砕け散った現代ロシアで、伊図透の物語は始まる。抽象芸術の可能性に惹かれながらも、国家による巨大モニュメント建造の注文に応じ、具象の世界に甘んじて生きる主人公の彫刻家は、ある日突然現実を離れ、天国と地獄の間のような不思議な空間に導かれ、完全な球体を作るという課題を与えられる。

    彼は現実にはありえない形態（フォルム）の創造を通じて、人間が人間であることを超えられるのだろうか。理想と現実、芸術と政治、抽象と具象の間の亀裂に苦しめられてきた主人公の新たな探求はどこに向かうのか？　彼を待っている思いがけない出会いとは？　東西両世界それぞれのユートピア的願望が絡み合い、物語はさらに壮大なスケールでの展開を約束している。はたして主人公は彷徨の末に神を見るのだろうか？　まだ誰も読んだことのない'

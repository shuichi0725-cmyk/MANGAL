  rakuten_caption: '昔、魔王を倒した勇者パーティーの

    大魔法使いウィズに拾われ、

    森の中で大切に育てられたライ。

    弟子とは名ばかりで、

    まったく魔法を教えてもらえない日々--。

    さらに、ウィズにずっと想いを寄せ

    毎日のように求愛しても

    まったく相手にされず、不満がたまるばかり。

    そんな中、強引に一人だけで街に出たライは、

    怪しい商人に目を付けられて…!?'

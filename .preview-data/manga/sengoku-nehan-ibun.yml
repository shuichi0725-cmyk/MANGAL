  rakuten_caption: "「ワァが生きる場所はワァが決める。誰にも決めさせん。」\nその寒村では、聞き分けがなくてどうしようもない者のことを「わやんだれ」と呼んだ。\n「わやんだれ」な少年三郎は、父に反抗して家を飛び出した先で隻腕の老人と出会う。\n気味悪がって誰も寄り付かないその小屋にはいつしか『わやんだれ』な子どもが集まっていた。 \n百姓の家の三男であり、父親と諍いが尽きない三郎\n\
    獰猛で手が付けられない娘キョウ、ひょろひょろで気弱なモズの集まった三人に、陰蔵は手慰みに剣術を教える。\nその名も『運命剣』。\n「わやんだれ」と呼ばれた三郎たちが何を成し、どう生きるのか。\n十文字青の原作『戦国涅槃』を新たな解釈で紡ぐ「異聞」が幕を開ける"

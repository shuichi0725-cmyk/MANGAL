synopsis: '「我慢も後悔も、もうやめます」

  後悔の死から逆行し、

  二度目の人生では我慢をやめ、

  自分らしく生きる王妃カーティア。

  そんな彼女をはじめは“お飾りの妃”として

  迎え入れた皇帝シルウィオだったが、

  「カーティアを離したくない、絶対に」と

  最近はカーティアへの溺愛が加速しているようで'

synopsis: 後悔の死から時を逆行した王妃カーティアは、二度目の人生では我慢をやめ自分らしく生きると決める。当初お飾りの妃として迎えた皇帝シルウィオだが、近頃は彼女を離したくないと溺愛を加速させていく。
catch: 後悔だらけの死から時を巻き戻し、二度目の人生では我慢をやめると誓った王妃カーティア。お飾りの妃のはずが、皇帝の想いは思わぬ方向へ動き出し――。自分らしく生き直す、逆行ラブロマンス。

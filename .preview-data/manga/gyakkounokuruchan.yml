synopsis: くるちゃんは美味しいごはんと裕福な家庭に恵まれ、幸せな毎日を過ごしている。だが母はまだ充分に幸せではない。だから私が母をもっと幸せにしなきゃ――。母の幸せこそ自分の幸せだと信じる少女の、歪んだ献身を描く物語。
catch: おいしいごはん、裕福な家庭、恵まれた毎日。くるちゃんはお母さんを幸せにするために生まれてきた——そう信じて疑わない少女の歪んだ幸福。読むほどに背筋が冷える、いびつな愛のサイコサスペンス。

synopsis: くるちゃんは毎日幸せな日々を過ごしている。おいしいごはん、裕福な家庭。正直かなり恵まれてる。でもお母さんはまだ充分に幸せになれてない。だから私がもっともっとお母さんを幸せにしなきゃいけない。だってお母さんの幸せは私の幸せだから。私はお母さんを幸せにするために生まれてきたのだから。
catch: おいしいごはん、裕福な家庭、恵まれた毎日。くるちゃんはお母さんを幸せにするために生まれてきた——そう信じて疑わない少女の歪んだ幸福。読むほどに背筋が冷える、いびつな愛のサイコサスペンス。

  rakuten_caption: '絶賛クソデカ感情こじらせ中。


    神絵師でCP最大手の描き手・PN『みん』さん。

    同人誌を読んで社畜だった過去を救われた経験から、亨にとって『みん』はずっと憧れの存在。

    大手サークルとなって隣に並び立つことを夢見ていた…はずが、イベントで接触した『みん』はとんでもないド陰キャだった…！

    ところが、嫌われているのかとショックを受ける亨に『みん』から「大好きです！」とまさかの告白がーー!?

    ーーこの気持ちは憧れ？ それとも恋…？

    『創作』を愛する全ての人間に捧げる、不純でピュアなすれ違いもだきゅん同人ラブ'

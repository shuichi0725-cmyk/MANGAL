  rakuten_caption: '「約束だ、大人になったら必ずおまえを番にする」


    オメガが持つ特殊な力【宝気】をほとんど持たない千尋は、「無能なオメガ」として周囲から疎まれる生活を送っていた。

    そんなある日、幼い頃【番】になると約束したアルファの琳也と偶然再会する。

    ーーまさか、あなたに会えるなんて…！

    奇跡の再会への喜びも束の間、琳也は自分のことを全く覚えていなかった…。


    しかし、突然ヒートを発症した千尋の身体に、ためらいもなく触れてくる琳也。

    誰にも触られたことのない敏感な身体は次第に快感に染められていきーー。'

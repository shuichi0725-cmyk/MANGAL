synopsis: タフな不良少年だった浦飯幽助の人生は、ある自己犠牲によって一変する——その命を終えることで。子どもを車から救って死んだ彼を、あの世も持て余し、もう一度生きる機会を与える。幽霊となった幽助は、三途の川の案内人ぼたんと、閻魔大王の息子コエンマの命を受け、善行をなしていく。霊界アクション。

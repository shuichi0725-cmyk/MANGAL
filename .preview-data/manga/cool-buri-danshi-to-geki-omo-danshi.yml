  rakuten_caption: 'トーカー気質なヤンデレ彼氏×クールぶってるアホの子


    「アホっぽい」と元カレにフラれたことをきっかけに、

    頭が良いキャラを演じる“クールぶり男子”・悠々（ゆゆ）。

    悠々の本性を知りながら、重すぎる愛を隠し

    スパダリを演じる“激重男子”・レン。


    お互いに恋人の前では“理想の自分”を演じているけど

    好きな気持ちはちゃんと同じ。

    そんな二人の前に、悠々が憧れる占い師の転入生

    しあんが現れる。


    しあんは二人ことが気になって仕方ないようで、

    「君たちの恋の行方は、破滅」と予言し

    恋人に嘘をつかない方がいいと忠告してくるがーー？


    波乱万丈でもお互いを大好きの気持ちは揺るがない！

    男子高生カップル「レンゆゆ」の

    もだキュンショートBL!!'

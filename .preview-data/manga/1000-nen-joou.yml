    description: 始たちの乗った空洞船が、ついに惑星ラーメタルへ到着する。首都シティ・ミユの宮殿に招かれた始は、謎の少女ラーレラの正体を知る。彼女は、宇宙のあらゆるものを治める指導者だった。そのとき、シティ・ミユが大地ごと宙に浮かび上がる。地球が滅亡するというのは嘘で、実は千年に一度だけ太陽に近づくラーメタルが、永遠に凍りつく運命にあり、ラーレラが人々の地球移住を計画していたのだ。この事実を知った始や地球人に味方する千年女王たちと、ラーレラとの戦いが始まる。

    description: 雨森始の実家は電子鉄工所を営んでいる。ある日、学校から帰宅した始は、家の中から「入っちゃだめだ」という大声を聞いた直後、何かが爆発して気を失う。目を覚ましたのは病院のベッドの上で、そばには見知らぬ女性が立っていた。数日後、天文学者である叔父を訪ねた始は、そこで最近助手になったというその女性・雪野弥生と再会する。折しも、太陽系の十番目の惑星ラーメタルが地球に近づき、コース次第では地球と月を破壊しかねないという重大なニュースが飛び込む。地球滅亡の危機と、弥生の正体である千年女王の謎が浮かび上がる、壮大なスケールのファンタジー。

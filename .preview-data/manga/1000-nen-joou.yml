    description: 地球の内部には隕石の落下でできた大空洞があり、そこには地上とまったく同じような風景が広がっていた。ただ一つ違うのは、そこ自体が長い年月をかけて建造された巨大な宇宙船だということ。人々の反応を見るための幻覚テストが行なわれたのち、空洞船は千年女王の指揮のもと、地球人を惑星ラーメタルへ輸送するために宇宙へと飛び立つ。始の前には、ラーレラと名乗る不思議な少女が現れる。彼女の正体、そしてたびたび現れる謎の集団“千年盗賊”の目的とは。

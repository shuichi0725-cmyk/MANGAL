  rakuten_caption: '「心霊配信ってなんだよーー!?」


    軽いノリで誘われただけのはずの動画配信。

    蓋を開けてみれば、“心霊配信”をやることに……。

    しかも相方は、顔はいいけどどこかズレてる後輩トドメ。頼りになるのかならないのか、絶妙に不安なコンビでオカルト配信デビューするがーー。


    ノリと勢いで始まった心霊配信は、果たしてバズるのか、ただの黒歴史かーー。

    クセあり先輩たちと、ゆるくツッコミどころ満載でお届けする、オカルト（？）配信コメディ！'

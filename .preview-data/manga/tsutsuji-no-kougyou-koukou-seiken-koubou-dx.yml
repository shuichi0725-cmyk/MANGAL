  rakuten_caption: 'いい感じの棒が落ちていたら拾う。ボタンが並んでたら全部押す。だから、岩に剣が刺さっていたら抜かなければならない…。

    “なにかいいもの”を探し巨大な校舎を持つ「つつじの工業高校」に入学した、立花聖・天谷蓮香・日向光の3人は、何の部活を選ぶか迷っていた。

    「本当はデザイン科に入りたかった」と途方に暮れて校舎をさまよっていた蓮香の前に現れたのは岩に刺さった一振りの剣。その剣は、武器や防具を自分たちで作る部活「聖剣工房」への道標だった。

    自分たちだけの鎧(夢)を鍛錬せよ！

    工業高校×JKが造りだす汗と油と鉄と笑いにまみれた大青春コメディ！'

  rakuten_caption: '絶対に恋してはいけない人。わかっていたはずなのに


    デザイン会社を営むメガンは、友人の紹介で高級デパートチェーンと仕事をするチャンスを得た。幸運としか言いようがないが、一方で複雑な気持ちもあった。その会社のCEOグレッグは友人の元夫で、メガンが3年前から密かに憧れていた相手なのだ。仕事の話は順調に進み、楽しい時間はふたりの距離を近づける。恋と呼ぶことは決して許されない想いに揺り動かされ、メガンはグレッグの突然のキスを拒めなかった。でも、大切な人たちを傷つけるような恋なんて私にはーー。'

  rakuten_caption: 1年にしてバレー部エース。文武両道で男女問わず人気のある朝霞凪沙は、告白されることもしばしば。しかし、今まで好きな人が出来たことのない彼女は、そのどれも断ってきた。自分は周囲と違って恋の感覚を持っていないのではと思い悩む、そんなある日。華奢で女の子のような見た目の男子・帳葵と出会い、突如今までにない欲望が湧いてくる。「この弱くて可愛い生き物をめちゃくちゃにしたい」最低で激烈な感情から始まる、ピュアな初恋の物語！

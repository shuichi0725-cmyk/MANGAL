  rakuten_caption: '「スイッチを押すと、心臓が止まる」

    社会実験のために、自らの命を絶つ【スイッチ】を渡され、

    施設に閉じ込められている子供たち。

    監視員の南洋平は、四人の”7年間もスイッチを押さない子”たちに出会う。

    他の子供たちは続々とスイッチを押す中、何故彼らは7年もの間耐えられたのか…？

    四人と交流する中で、核心に触れていく南はある計画を思いつく──

    そして、彼らを待ち受ける非情な運命とは…？



  rakuten_caption: "働く人の最後の砦 、退職代行に切り込む！ \n\n ブラック気味なベンチャーで働いていた笹岡目白は、\n退職代行と寺と幼稚園を運営する謎の男、黒川に助けられ、退職代行「ヤメタイ」を手伝うことに。\nそんな笹岡と黒川の前に、三角関係に巻き込まれてしまった幼稚園の職員からの依頼が舞い込みーー!?\nそして、気がついたらなぜか○○のお仕事に巻き込まれていて・・・？\n\
    凸凹コンビが紡ぐ、社会派ドラマ、第2巻!"

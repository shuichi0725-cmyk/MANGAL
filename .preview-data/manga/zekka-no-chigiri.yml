  rakuten_caption: '久しぶりついでで悪ぃんだけど、俺んトコに嫁に来い


    『絶華の契り』とは

    呪力を以て交わす誓約を指し、その力は”死”をも屈服させる。


    麗華国の武侠仙女として名を馳せ、対魔討伐に励んでいた紅珠はある日、

    宮殿に招かれて、第三皇子・李陵から突然求婚をされてしまう…！

    しかしその正体は、1年前まで互いの武と知を競い合い、ともに呪術師を目指した幼馴染の“涼”だった。

    身分を偽っていた涼は、かつて結んだ“誓約”を片手に『強制的嫁入り』を宣言してきたのだ！！

    長年、肩を並べた涼との突然の再会と裏切りにふてくされる紅珠だったが、

    この”求婚”は紅珠への救難信号のようでーー！？


    瘴気はびこる後宮を駆け巡るーー

    横溢な最強夫婦（仮）の世直しアジアンファンタジー！！'

    description: 小学生のころの友人だった玄野と加藤は、線路に落ちた酔っ払いを助けようとして電車に撥ねられてしまう。ところが次の瞬間、二人が立っていたのはあるマンションの一室で、そこには死の間際を経験した者たちが集められていた。室内に置かれた黒い玉・ガンツは、事情の説明もないまま、ねぎ星人を倒せという指示だけを一方的に突きつける。なぜ自分たちが選ばれたのか、あの部屋は何なのか。謎ばかりを抱えたまま、玄野たちの戦いが始まる。

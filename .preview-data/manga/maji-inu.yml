  rakuten_caption: 'シュールでコミカル、“まじ”な犬漫画登場！！　ポンコツなシベリアン・ハスキー、食いしんぼうなトイプードル、イキるチワワの3匹が、主の留守中に大暴れ！　さらに、長〜いダックス、気高き柴犬、ポメやドーベルなど…愉快な仲間たちが続々登場。飼い主すら知り得ない「まじイヌ」たちの秘密の日常とおとぼけな大冒険、ここに開幕ッ！


    シュールでコミカル、“まじ”な犬漫画！！　主の留守中、盛大にポップコーンを貪り、アホ面で自由を謳歌するシベリアン・ハスキーのハス山。そんな彼の背後に、小さな2匹の犬が忍び寄る…。病院からの脱出劇、雪の謎の究明、そして怪しい裏取引…。飼い主すら知り得ない、秘密の日常を覗き見！　単行本限定の描き下ろしエピソードもたくさん収録！　愉快な「まじイヌ」たちの織りなす大冒険、ここに開幕ッ！'

  rakuten_caption: '彼に愛されなくても、罪を贖うためこの身を尽くす


    男爵令嬢マリーナは行き遅れの26歳。ある日、母親から結婚しないなら大叔母の面倒をみるようにと引導を渡されてしまう。友人にドレスと髪型を磨かれ、つれだされた劇場で伯爵ジャスティンに声をかけられる。だが、彼は花婿候補として社交界でも指折りの男性…自分は地味なうえ、兄のギャンブルのせいで持参金すら用意できない。不釣りあいなはずの伯爵に求婚され、マリーナは夢心地に。まさかこの結婚が領地と屋敷を奪い返すための仕組まれた復讐とも知らずーー。'

  rakuten_caption: '20歳の誕生日に恋人にフラれた夜長（よなが）マオ。

    しかもクリスマスイブにフラれるなんて。

    神様なんていないんだーー。


    世界に見捨てられた気持ちで、

    行く当てもなく街をさまようなか、

    思い出すのは初恋の人。

    12年前、近所に住んでいた尊（みこと）兄ちゃん。

    誰にでも優しくて、綺麗で……。

    一目惚れだった。

    今までの恋人は、どこか彼に似ていた。


    そうして上の空のまま歩いていると、

    誰かと派手にぶつかってしまう。

    転んだマオに手を差し伸べた、

    その相手はーー…。


    初恋の人との再会は、運命の悪戯。'

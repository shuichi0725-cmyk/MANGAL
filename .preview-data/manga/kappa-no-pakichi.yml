  rakuten_caption: '「俺はパキチだよ。河童のパキチ」


    飢饉の時代、暮らしが困窮していくある農民の家族。

    家長であるお父からの非情な命令に、

    おっ母はパキチの手を引き、静かに川へと向かう。

    子供への愛情と、抗えない現実の狭間で、親子の運命は……。


    Xで大きな反響を呼んだ感動の読切版『河童のパキチ』が、満を持して連載化！

    これは、悲しくも温かい河童の御伽話。'

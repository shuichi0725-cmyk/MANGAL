  rakuten_caption: '医療過誤の疑いで大学病院を追われ、

    外れ者ばかりが集う町・通称《はきだめ》の

    診療所に赴任してきた医者の清良。


    新入りの清良に何かと絡んでくるのは、

    自称自警団のボス・シンだ。


    「この町の人間に、

    本当に救う価値なんてあるの？」

    軽薄な振る舞いとは裏腹に、

    命さえ無価値と説く非情な男──


    相手が前科者でも患者として手を尽くす清良に

    いつしか異様な執着を向けはじめ…!?


    ノワールBLの名手・鳥丸太郎が放つ、

    待望の最新刊!!'

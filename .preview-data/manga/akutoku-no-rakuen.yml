  rakuten_caption: 「楽に稼げる仕事がある」という言葉に釣られて、とあるアジアの南国にやってきたタダシ。「青い海の楽園で、水着美女とチル！」という淡い妄想していた彼だったが、雇い主は「匿名・流動型犯罪グループ」で、パスポートは奪われ、詐欺をさせられ、逃げれば殺される、楽園とは真逆の暴力と死が横行する“地獄”だった───。今、日本人が目を背けてはいけないこの世の地獄を描く、バイオレンスクライムサスペンス！

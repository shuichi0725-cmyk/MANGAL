  rakuten_caption: '大企業の受付で働く亜梨（あり）には密かな楽しみがある。

    それは、毎週休日前に、大好きな『にんにく』を香ばしい料理にして美味しく食べること！


    好きなのに、仕事のことを考えると休日前にしか食べられない…

    仕事終わりの【全☆開☆放】のために日々をがんばる亜梨さんの

    ちょっとダイタンなグルメコメディ！


    ☆コミックスだけの描き下ろしマンガも収録☆

    1話　にんにくでナポリタンとえびピラフ

    2話　にんにくでからあげと丸ごと

    3話　にんにくで餃子パーティー☆

    4話　にんにくでトースト＆ステーキ

    5話　にんにくでネギ塩豚カルビ

    6話　にんにくでキャンプ　前編

    7話　にんにくでキャンプ　後編

    番外編　にんにくを食べすぎたら


    ★描き下ろし4Pマンガ★　にんにくでお風呂'

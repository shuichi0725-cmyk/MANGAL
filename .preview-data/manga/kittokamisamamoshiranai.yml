synopsis: '天涯孤独の少年・オルカは、雪山で行き倒れる美しい青年を助けた。

  美青年の名はベルーガ。神官であった。

  ベルーガのやさしさ、神官としての誇り高さに憧れたオルカは、自身も神官を志すようになる。

  そして、離れがたい感情を抱えながらも、勉学の為に独り王都行きを決めた。

  数年後、小さかった'

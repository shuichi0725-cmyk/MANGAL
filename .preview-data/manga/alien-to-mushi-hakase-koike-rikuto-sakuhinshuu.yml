  rakuten_caption: '17歳の誕生日に、僕たちは結ばれると信じていた。


    10歳の夏。虫捕りに出かけた少年・タクマは、山でエイリアンに出会う。

    彼女は種族繁栄のため、人間の男とまぐわい妊娠して星に帰るのが目的だという。

    性行為を迫る彼女に、タクマは17歳になったら…と約束した。


    時は流れ、エイリアンに対し、恋愛感情が芽生えたタクマ。

    ついに運命の17歳の誕生日の夜、彼女から呼び出されてーー。


    繊細な感情を丁寧に描いた本作。

    ノスタルジックな風景と男子高校生のひとりよがりな想いが胸に刺さる。


    表題作に加え、雪深い田舎を舞台に“忘れる恐怖”をテーマにした「彼女の物忘れ」、

    本音を言えない少女と山に住む妖怪との交流を描いた「声が出た」の読切2本を収録した、豪華特厚226P！！


    デビュー連載『アモ』第1巻と同時刊行！'

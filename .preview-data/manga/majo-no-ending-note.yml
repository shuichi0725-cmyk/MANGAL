catch: 初恋の魔女から頼まれた仕事は、彼女が死ぬまでの準備だった。終わりへ向かう日々に寄り添う、葬祭士の物語。
synopsis: 魔物の王が討たれた二十年後。葬儀屋で働く葬祭士ディドは、勇者パーティにいた伝説の魔女ニナニーナと出会う。二千年近く生きる彼女から依頼されたのは、「終活」の手伝いだった。

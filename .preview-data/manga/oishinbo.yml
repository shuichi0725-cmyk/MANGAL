    description: 士郎や団社長、ブラックたちの家庭にそれぞれ子供が生まれ、ビアホールで大いに盛り上がって乾杯した面々。だがその隣には偶然、子供ができずに悩む夫婦がいて、無邪気な喜びようが彼らを傷つけてしまう。のちにこの夫婦が洋食店を営んでいると知った一同は、謝罪も兼ねて食べに出かけるのだが、その店の料理には大きな問題があった。そして最終段階に入った究極と至高は、その成果を対決で見せ合うことになる。ゆう子はこの対決を通して雄山と士郎の親子を和解させようと考えていた。長年の確執にはたして終止符は打たれるのか。全2編。

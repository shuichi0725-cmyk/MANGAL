  rakuten_caption: 'リリアンナは二度の死を経て三回目のループに突入するが、死の間際にピアスの片方を託したジークも同じく死に戻っていた。


    「俺は今度こそリリーを守ってみせる。二度と遅れは取らない、この手を取れ」


    ジークから熱のこもった想いをぶつけられるも、リリーは単独で事件の証拠探しを始める。するとスペンツァー殿下の執務室から、姉のソフィアからの恋文と贋金を発見しーーー

    謎に包まれていた贋金横行と違法カジノの関係が少しずつ見えてきたところでまたしても時間がまきもどってしまう。


    またしても死から逃れられかったリリー

    もう頼れるのは彼だけ…'

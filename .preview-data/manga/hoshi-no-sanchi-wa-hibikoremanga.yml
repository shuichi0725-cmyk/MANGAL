  rakuten_caption: "毎日喋って毎日妄想、そして毎日笑ってる！ \n\n ほしのさんちは、漫画家のまつこ、\nタクシー運転手の夫・つかさ、小学四年生の娘・すずみの三人家族。\n\n今日の献立から地球の未来図まで、\n語り出したら止まらない会話の洪水一家。\n\n妄想や想像だって行ったきりで決して戻ってこない…だけどだーれもそんなこと気にしない。\n一日の始まりは笑って迎え、一日の終わりは笑って締めたい、\n\
    そんなふうに思っている皆さんに贈る、ほしのさんちの可笑しみ漂う物語！ \n\n 【編集担当からのおすすめ情報】 \n ほしのさんちの毎日には、常人では想像できないような果てしない妄想と順不同に組み立てられる会話があります。\n「そこまで行く？」的なほしの一家の発想力を、重箱の隅をつつくようにお楽しみください！"

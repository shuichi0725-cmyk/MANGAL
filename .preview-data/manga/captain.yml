synopsis: 地道な野球チームの面々が、努力と練習を重ねて強豪へと成長していく熱血スポーツコメディ。墨谷高校へ転校した谷口タケオは、前の学校の制服姿で練習に参加。それが名門・青葉学院のものだと気づいたチームメイトは彼を凄腕と信じ込むが、実は彼は補欠の二軍選手で——。

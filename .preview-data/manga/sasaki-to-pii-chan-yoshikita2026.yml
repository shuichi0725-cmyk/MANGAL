  rakuten_caption: 佐々木とピーちゃん(文鳥・ペット・賢者)は、今日も今日とて異世界と現代を行ったり来たり。理想のスローライフを求めて商売に精を出す。現代では二人静の協力を得たことで、異世界の金品を現代の貨幣に変える手段を手に入れた。魔法の鍛錬も進み、異能力者や魔法少女を相手に異世界の魔法で無双。あとはたっぷり稼いで、悠々自適なリタイア生活を目指すのみ。だが、彼らの行く手を阻むように各所では騒動が巻き起こる。異世界では国王の跡目争いが本格的に勃発。貴族に取り立てられて領地経営がスタート。現代では連日のように異能バトルが発生。魔法少女注意報、発令中。そして、デスゲームに巻き込まれたお隣さんは、悪魔と共に天使の使徒たちから狙われることに。いよいよ各界の交錯が始まり、佐々木の身の上が混迷を迎えるのだがーー。TVアニメシーズン1の続きから読める、原作小説3巻からの新コミカライズ！
  note: 予約②③previewドラフト。本番化はユーザ確認後。ヨミ=楽天仮(NDL照合待ち)。genre=captionからprovisional付与

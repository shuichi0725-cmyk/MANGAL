  rakuten_caption: '「へぁ？」　平凡な女子大生の紗良はいつもと同じように何の疑問もなく、家のドアを開けた。

    しかしそこは、見慣れた日常ではなく、殺風景な川べりで、みたこともない魔獣が跋扈する「異世界」だった。

    紗良に残されたのは「異世界マニュアル」と書かれた謎のノートだけ。

    マニュアルから学んだスキルを身に着け、火をおこし、魔獣を手懐ける紗良の異世界ライフがこうして始まる。'

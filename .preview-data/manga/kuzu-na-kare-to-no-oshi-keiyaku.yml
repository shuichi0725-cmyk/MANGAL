    『推し（ヒモ）』と『ファン（財布）』。

    お金という揺るぎない絆に光を見いだしたゆめは、起死回生の提案を繰り出す。

    「あなたが、私だけの推しになってくれませんか!?」


    ドライなヒモクズ男子×限界オタク女子の前途多難な推し活ラブコメ！'

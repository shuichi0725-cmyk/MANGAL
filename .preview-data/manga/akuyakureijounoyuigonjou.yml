synopsis: '王国随一の資産を持つシュビラウツの令嬢リエリアは、結婚式の当日に、婚約者である第一王子から結婚を破棄されてしまう。

  「さようなら、皆様」とだけ言い残して姿を消したリエリアの死が伝えられたのは、それからまもなくのことだった。

  そして彼女が残した遺言が王国にさらなる騒動を引き起こした'

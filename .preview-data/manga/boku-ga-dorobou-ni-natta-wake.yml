    description: 尾上龍三郎、十歳。料理も洗濯もなんでもできるしっかり者の小学生である。高台にある大きな家に、元女優の美人なママと二人暮らし。お嬢様育ちでわがままなママは贅沢が大好きだ。でも家にはお金がなく、ママは家の骨董品を売っては贅沢をしている。そしてついに、龍三郎がガールフレンドのリエちゃんから預かった指輪まで骨董屋へ売ってしまう始末。あわてて取り戻そうとするが、時すでに遅し。腹を立てる龍三郎にママは一言、盗めばいいんじゃないと言い放つ。不器用なママには任せられないと、龍三郎も盗みに行くのだが。

  rakuten_caption: '歌舞伎町のクラブで美女に一目惚れし、口説き落とした青年コモン。しかし彼女の正体は、転生者を勇者という名の労働力として搾取する闇のビジネス“異世界転生勧誘詐欺”に勤しむ女神で!?

    惚れた女神のために一肌脱ぐと決意したコモンは、夜の人脈をフル活用してホストやスカウトマン、シーシャ屋、バーのボーイら「チーム歌舞伎町」を招集。全員で人外に転生して異世界へ乗り込む！

    剣も魔法も必要なしーー夜の街のノウハウと圧倒的コミュ力で、勇者も悪魔も丸ごと“カモ”にする陽キャ軍団の異世界攻略が幕を明ける！'

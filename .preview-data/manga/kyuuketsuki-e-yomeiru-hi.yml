synopsis: 極上の血を持つすず音は、その血を提供する代わりに吸血鬼・八雲の妻として迎えられる。当初は形だけの結婚だったが、二人の間には次第に温かな感情が芽生えていく。負傷した海軍中尉を匿うなど、波乱も訪れる和風吸血鬼ロマンス。
catch: 極上の血“王華血”を持つすず音は、吸血鬼の八雲に血を捧げる代わりに妻として迎えられる。「血を飲むだけ」の仮初の結婚のはずが、二人の関係に次第に熱が灯り始めて——和の世界観で紡ぐ甘く切ない吸血鬼ロマンス。

catch: 我慢はもう終わり。前世を思い出した令嬢が理不尽な婚約者を言い負かした瞬間、それを見ていた美形公爵が求婚してきた。
synopsis: 家族と婚約者の理不尽に諦めて生きてきたレダは、「お前を愛することはない」と言われた瞬間、浮気夫を制裁した前世の記憶を取り戻す。反論する彼女を見ていた美形公爵が、突然求婚してきて——。

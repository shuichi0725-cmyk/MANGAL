  rakuten_caption: '累計1.3億インプレッション超え！SNSで話題沸騰中の「うさつむ」が待望の書籍化！


    憧れのウサギに擬態して生きるカタツムリのつむちゃん。体質はカタツムリでも、メイクにファッション、食べ方や歩き方まで、ウサギになるための努力は惜しみません。大好きなウサギのお友達と仲良くしたい。憧れの自分に近づきたい。そんな一途な気持ちで毎日奮闘するつむちゃんに、かわいいと共感がとまらない！


    SNSで人気のエピソードはもちろん、書籍でしか読めない描き下ろしもたっぷり収録。つむちゃんとニキちゃん＆モコちゃんの出会いを描いた長編エピソードをはじめ、SNS投稿作の後日談イラスト、3人それぞれのバッグの中身紹介など、うさつむの世界やキャラクターの魅力を深掘りするページが満載！


    これを読めば、もっと「うさつむ」が好きになること間違いなし！かわいくて、ちょっぴり胸に刺さる、つむちゃんの毎日をお楽しみください！'

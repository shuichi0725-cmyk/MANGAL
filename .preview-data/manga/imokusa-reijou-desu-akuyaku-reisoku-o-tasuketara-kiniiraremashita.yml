synopsis: 垢抜けないと社交界で嘲られていた令嬢アグネスは、たまたま公爵子息で王女の婚約者ナゼルバートを助ける。それを見た王女は罰として、アグネスと結婚するよう彼に命じる。あの娘と結婚など酷い罰――そう思いきや、彼は嫌がっていない?二人が惹かれ合う物語。

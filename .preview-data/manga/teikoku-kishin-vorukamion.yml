  rakuten_caption: '全人類に全否定されている「巨大人型ロボの実用化」に並々ならぬ情熱を持つ社畜・間宮路傍（まみや・ろぼう）は、異世界からやってきた肌面積が広すぎる美少女・アルハに「巨大ロボットになって戦ってほしい」とお願いされる。


    こうして、路傍はヴォルカミ帝国が誇る巨大人型ロボットーー機神『ヴォルカミオン』に宿り、前世でのロボへの知見を活かし、初実戦で勝利する。


    なお、神と崇められる路傍の力は強大。よって、全ての女性たちは「全てロボウ様のご意志のままに」を合言葉に、ロボウ様がご気分を害さないよう、いつでもどこでも何度でも、路傍が望めば、SEXできるという超VIP待遇！


    清純ロリのアルハ、爆乳の人妻・セカント大尉を抱いたあとは、メガネっ娘のフェンフ・ツー、ボーイッシュなトライ・ツーにも触手を伸ばしーー♡♡'

  rakuten_caption: '今度こそ、穏やかな人生を送りたいーー。


    1度目の人生は、メリアに婚約者を奪われ、両親にも見捨てられ、病に斃れ幕を閉じた滑稽な人生だった。

    2度目の人生で、それが恋愛小説の中の“悪役令嬢”として描かれた物語だと知る。そのまま、孤児として短い生涯を終えた。

    そして迎えた3度目の人生。辺境の村で祖母と慎ましく暮らす少女・リスティアは、貧しいながらも幸せな日々を送っていた。

    しかし祖母が亡くなった直後、国王直属の騎士・リオルガが彼女の前に現れる。そして彼の口から告げられた、衝撃の事実とは……！？'

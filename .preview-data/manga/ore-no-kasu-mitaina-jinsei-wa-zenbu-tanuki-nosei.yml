  rakuten_caption: 青春を勉学に捧げ都内1位の学力を誇る浪人生のアラタは、なぜか大学受験に落ち続けて春から二浪が決定。途方に暮れていたとき、ある少女との出会いによって気がつくことになるーーーーー自分の人生がおかしくなっている原因は、タヌキであると。科学で説明のつかないことが大嫌いで“不思議”を認めないカタブツの19歳と、存在そのものが“不思議”な人に化けたタヌキの少女が織りなす、モラトリアム・コメディ。

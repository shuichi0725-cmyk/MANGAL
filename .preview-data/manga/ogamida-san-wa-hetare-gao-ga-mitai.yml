  rakuten_caption: '男子高校生の佐賀原くんは連載を持っている少女漫画家。

    彼は同級生である拝田さんを王子様キャラのモデルにしていた。

    そんな彼女に放課後の空き教室で協力してもらっている佐賀原くんは、

    なぜかいつもいじられる展開に…！


    スカートをはかせたり、髪を梳かさせたり、更衣室に引っ張り込んだり…と、

    どんどん佐賀原くんを振り回す拝田さん。

    そんな彼女にもとある“秘密の顔”があって…!?


    王子様系ヒロイン×少女漫画家主人公のいじられ青春ラブコメ、第1巻!'

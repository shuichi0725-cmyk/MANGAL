  rakuten_caption: "口福もたらす旅と寿司のマリアージュ。 \n\n 旅と食欲の間には特別な関係が潜んでいる。\n素敵な頃に旅をすると食欲がぐんぐん増していくのだ。\n旅とは「他火」ともいう。\n訪れた先々で他人にごはんを作ってもらって食べることなのだ。\n銀座の名店『すし竹』で修業をし、支店を任されていた\n寿司職人・春野秀二は、その職を辞し、修業の旅に出た。\n旅先で出会った人々の注文に応えて寿司を握るのだ。\n\
    明日の保証は全くないが、\n秀二はかなり口福に暮らしている。 \n\n 【編集担当からのおすすめ情報】 \n 旅とお寿司という皆が大好きなものを掛け合わせた作品です。\n『築地魚河岸三代目』のはしもとみつお氏の描く\nうまそうな寿司と名手・伴茶彰氏の紡ぐ人間ドラマをご堪能ください。"

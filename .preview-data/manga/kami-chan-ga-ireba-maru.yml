  rakuten_caption: '「“一人前”になったら会いに来るね」

    そう言って涼子のもとを去っていったかみちゃん。

    時が流れ、成長した二人はそれぞれの生活の中で決断を迫られる。


    田舎に残って友達と一緒にいるか、都会に出て新たな道に進むか迷う涼子。

    人間社会の中で自分を押し殺して生きるか、自分本位で生きるか悩むかみちゃん。

    二人がそれぞれに辿り着く“一人前”とは。そして二人は再会できるのかーー。


    少女と人外の子の13年に及ぶ友情物語、完結！

    最終巻は232ページの大ボリューム。泣いて、笑って、きっと大切な物語になります。'

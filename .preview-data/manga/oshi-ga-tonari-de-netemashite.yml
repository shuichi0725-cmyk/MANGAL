synopsis: '「あの日初花に出会えてよかった」

  期間限定の同居生活も終わりに近づき、

  残された時間を名残惜しく思う2人。

  思い出話に花を咲かせながら

  これまでを振り返っていると、

  織が「最初にこうしてここで寝てたこと思い出すね」と

  初花をベッドに押し倒して…。

  さらに初花の過去を知る新キャラも'

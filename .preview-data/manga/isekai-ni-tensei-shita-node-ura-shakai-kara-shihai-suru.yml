  rakuten_caption: 'スラムの路地で、ひもじい思いをしていた一人の少年。

    しかしなぜか突然、自分が異世界転生者だったことに気づいた。


    「でも俺の異世界転生、しょっぱなから詰んでない？」


    なにを思ったか、少年は裏社会からのし上がっていくことを決意する。


    「裏社会王に…俺はなるっ!!」


    異世界に転生した少年が唯一無二の能力を授かり、仲間とともに裏社会から異世界を支配する！'

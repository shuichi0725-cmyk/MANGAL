  rakuten_caption: '常識知らずの田舎者が全てをぶち壊す爽快無双譚！

    魔物を生み出し続ける巨大な塔「迷宮（ダンジョン）」。回復術師である田舎者の少年・エトは、自分を鍛えてくれた師匠の勧めで迷宮攻略に身を乗り出す。しかし世間では回復術というものは多大な魔力が必要で（使い勝手が悪くor必要なわりに効果が薄く）、回復アイテムに劣るものと位置づけられていた。そんな中、規格外の魔力を持つエトは悪評をものともせず、すべてを治し続け、自らも前線で戦うーー。彼は、常識外れの戦い方で探索者の価値観をぶち壊していく。あり得ない早さで迷宮を攻略していくエトはやがて、大陸全土にその名を知らしめる最強の存在へと成り上がっていくーー。'

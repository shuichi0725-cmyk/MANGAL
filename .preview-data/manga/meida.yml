  rakuten_caption: '「メイダ」。それは生きる万能薬。

    その体を食せば、同じ部位が完璧に回復するという、恐ろしい希望。

    高校生・紅野(こうの)には、不治の病に侵される妹がいた。

    彼は妹のため「メイダ」を欲し、大切な人を護るためにテコンドー全国制覇を達成する実力者。

    そして紅野には、青(あお)という親友がいた。

    ある日紅野は、青がメイダであることを知ってしまって……。


    親友に対する、どうしようもなく大きな気持ち。それは人に対する好意か、メイダという生き物への独占欲か。

    稀代のストーリーテラー・キリエが描く巨弾サバイヴ・サスペンス。'

  rakuten_caption: '六歳にして戦災孤児となり、奴隷に墜ちたアメツ。

    そんなアメツにクラビル伯爵は

    命令に背けば苦痛を与える契約魔術を用いて

    利用価値のある道具にするべく魔術を覚えさせた。


    数年後、一人前の魔術師になったアメツは

    クラビル伯爵にリグルット侯爵家長女のティルミを暗殺するように命じられ、

    暗殺者としてティルミの前に姿を現す。


    この出会いがアメツの人生を大きく変えるのであった──。'

  rakuten_caption: 'ここはタブロ。本のすべてが集う街。


    憧れの製本師を目指してやってきたエルフの少女・スピカは、青年親方・レザックに弟子入りを申し込む。


    &quot;文字が読めない&quot;スピカを冷たくあしらうレザックだったが、&quot;本の声が聴こえる&quot;彼女の不思議な魅力に惹かれ、弟子として迎え入れることに決めたーー。


    天真爛漫、感性豊かなスピカと、腕は確かだがぶっきらぼうなレザック。ふたりの物語が、いま始まるーー。'

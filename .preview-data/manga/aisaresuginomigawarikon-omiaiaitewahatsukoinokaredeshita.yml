synopsis: 喫茶店の看板娘・桜は、常連客でホテルチェーン社長の隼人に密かに憧れていた。彼が見合いをすると知りショックを受けるが、相手は桜の親友。親友の後押しで身代わりとして話が進み、初恋の彼との関係が動き出す。
catch: 喫茶店の看板娘・桜が密かに憧れる常連客は、大手ホテルチェーンの社長・隼人。お見合い相手の身代わりとして再会した彼は、まさかの初恋の人で——溺愛シンデレラロマンス。

  rakuten_caption: '政略結婚により9歳という幼さで他国に嫁いだイズミル。

    年の離れた夫・グレアムに祖国の危機をたすけられ

    いつか彼の役に立ちたいと思い続けるも、

    妃たちの間で起きたある事件をきっかけに後宮は解体。

    それから8年ーーグレアムと会う機会を失ったイズミルは

    「忘れられた妃」となっていた。

    そんなある日、グレアムに恩返しをするチャンスが訪れたけれど、

    彼はとんでもない女性不信になっていて!?


    単行本限定描き下ろし付き！'

  rakuten_caption: '新人編集者の羊谷夜一朗は、穏やかすぎる性格が災いして

    「打ち合わせで眠くなる」と担当作家から逃げられる日々を送っていた。

    なんとかして作家さんの力になりたいのに…！


    悩む羊谷に任された仕事は、人気作家・月城澄架に資料を届けること。

    鬼厳しい性格で有名な月城だったが、その日の彼女は寝不足が原因で

    まるで子供のようだった。


    月城に小説を書いてもらうため、羊谷は彼女を「寝かしつける」ことを決意する！'

synopsis: 各話、旅するセールスマン・喪黒福造と、その時々の客を描く。喪黒は人々の心の願いを叶える品を扱うが、取引が成立し不健全な欲望が満たされると、客はしばしば恐ろしい報いを受けることになる——特に取引の掟を破れば。ブラックなコメディドラマ。

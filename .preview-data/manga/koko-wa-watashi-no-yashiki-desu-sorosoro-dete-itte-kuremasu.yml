synopsis: 侯爵令嬢マリッサは、両親の死後に屋敷を乗っ取った叔父一家への復讐を企てる。18歳の誕生日に爵位が戻るその日まで、家でも学校でも虐げに耐え続けてきた。そんな折、婚約者デリオールが一方的に婚約を破棄してきて——。復讐を誓う令嬢のロマンス。
catch: 屋敷を乗っ取った叔父一家への復讐を誓う侯爵令嬢。爵位が戻るその日を待つ彼女に、婚約者は一方的な破棄を告げて――令嬢の逆襲ロマンス。

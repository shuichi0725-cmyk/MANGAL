  rakuten_caption: '「クソ、その冷めた顔を歪ませてやる…！」

    ゲイの大学生・隼人は、隣に住む年下の幼馴染・優希の扱い方に悩んでいた。

    仲良くなった男をお持ち帰りしても、自室のベッドの上には当然のようにくつろぐ優希の姿が…。

    チャンスを潰されて怒る隼人をよそに、優希はマイペースに漫画を読みふけるばかり。

    隼人が男好きだと知っていながらも、優希はどこか無防備でーー


    「ふーん。じゃあ、手出せば？」

    優希のひと言をきっかけに、二人の関係は少しずつ変わり始め…？

    触れたら、もう止まれない。煽り煽られ、近距離ラブ


    二人の日常を覗き見な描き下ろし漫画も収録！'

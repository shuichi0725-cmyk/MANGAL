  rakuten_caption: '「今夜、俺とシてみる？」色気ダダ漏れ上司の重すぎ×溺愛×執着！


    「桂木がコレ開けて？」

    奥を蕩けさせて、欲しがる疼きを感じながら、目の前にゴムが差し出されーー

    恋愛漫画の編集者・桂木雪音（かつらぎゆきね）は、Hアリ漫画の編集をしながらもセックス未経験。

    担当作家からのHシーンの相談にうまく応えられず、長い付き合いの理想の上司・赤羽（あかばね）に相談すると、思いがけず夜の誘いを受けて…

    「今夜、俺とシてみる？」

    先輩で上司…だけど、8年一緒に仕事してきた彼の、知らなかった魅力に翻弄され…

    優しい愛撫で、全身とろとろに感じちゃって…。

    何度も何度も指でイカされてーー

    奥が刺激を欲しがって、熱い想いのこもったオスに、ナカまで深く突かれて…!!

    男の色気ダダ漏れ上司と、秘密の濃密オフィスラブ開幕☆'

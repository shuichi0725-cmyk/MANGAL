synopsis: '食い倒れの街・大阪へ修学旅行にやって来た小林たち。

  宇野達とともに海遊館内を見ている途中で、宇野の体調に異変が。

  静かなところで休む宇野に付き添う小林は、悠然と泳ぐ巨大なジンベエザメを前に、

  最近感じていた自分自身の変化を、ぽつりぽつりと語り始める。

  漫画賞を総なめにした友情物語'

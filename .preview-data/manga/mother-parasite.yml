synopsis: 「寄生虫」と言われたことを気にする涼太の心は揺れる。初めての不安にどう向き合えばいいかわからないまま、自分の”初めての”誕生日が近づいていた。涼太との初めての誕生日を盛大に祝おうと全力で取り組む涼音。だが、その奮闘はから回って…。その頃、リカは涼音について衝撃の事実を耳にするのだ
catch: 些細な迷惑を恐れる母との、どこか歪な関係。過保護に苦しむ同級生のいじめも、母が原因?母をめぐって軋む心理サスペンス。

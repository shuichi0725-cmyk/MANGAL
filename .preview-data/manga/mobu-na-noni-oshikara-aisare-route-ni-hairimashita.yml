  rakuten_caption: '「ここ…『ファース王国物語』の世界ーー!?」

    大好きな小説の世界に転生したことに気づいたパン屋の息子・ラビィは、

    幸運にも推しキャラの公爵子息ラファイエットの祖父に気に入られ、小説の舞台となる学院に通うことに。

    モブに徹して推しの生きて動く姿を堪能するぞ！ …そう思っていたのに、彼が親友である第一王子の暗殺騒ぎに巻き込まれて失明する未来を知っているラビィは、

    なんとか回避しようと画策。その必死で健気な姿にラファイエットも心を動かされて…?


    推しの命は僕が守る!!

    悲運の公爵嫡男×転生者のモブ


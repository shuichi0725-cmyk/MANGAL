  rakuten_caption: 『ちはやふる』『線は、僕を描く』などでメガホンをとった映画監督・小泉徳宏と、ライターズルーム「モノガタリラボ」が、それぞれの体験をもとに、映画業界の「裏の裏」を描く！　漫画を担当するのは、代表作『すくってごらん』で映画化を経験した大谷紀子。映画に縁の深い執筆陣が、ラブコメ映画『QUN・極』を全身で愛する元極道の奥園鯨の視点で、実は大切なパーツと言える裏方仕事の熱いドラマを描き出す。ひょんなことから、映画の撮影現場に関わることになった鯨。先輩の葉月やかつて『QUN・極』に関わっていた幸村の信頼を徐々に勝ち取り（？）、今日も映画の撮影現場で奮闘する日々。エンドロールの端っこに名前が載る、という感動の体験をして、「もしかしたら娘の那由多が自分の名前を見てくれるかも」と淡い期待を抱くようになる。そんな鯨の次なるステージは「装飾部」。持ち前の手先の器用さで重宝される中で、なんと『QUN・極』の続編映画制作が秘密裡に進んでいるという情報をキャッチ。興奮冷めやらぬ鯨だが、一方でその続編には鯨の想像が及ばないところで、新たな火種が。そしてそれは、鯨にも大きくかかわる話で…！？　読むと映画が観たくなる、

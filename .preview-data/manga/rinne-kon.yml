  rakuten_caption: "「貴女は僕の妻だった」時を超えた前世愛！ \n\n 父が亡くなり、借金のために大学を中退した薫。\nしかし、偶然出会った謎めいた青年に、「やっぱり、貴女が僕の妻だ」と言われる。\nその青年・碧は、薫が前世で自分の妻だったと言い、薫の借金を全て肩代わりする代わりに求婚してくる。\n戸惑う薫だが、碧に何故か抗いがたい魅力を感じて…！？\n\nTVドラマ「痴情の接吻」原作で一世を風靡した如月ひいろの、時空を超えた大正浪漫ラブ！ \n\n 【編集担当からのおすすめ情報】 \n 溺愛を描かせたら右に出る者はいない如月先生。\nただでさえそうなのに、今回は「前世からのこじらせ溺愛」です！\nまだ真相は明かされていませんが、愛していたのに悲しい別れをしたらしいふたり…\n残された夫・碧人が生まれ変わって「碧」となり、元妻・薫子の生まれ変わり「薫」を探し当て、今度こそ絶対に離さない…！と渾身の溺愛を繰り広げる様はもう甘っ甘！！！\n大正時代の前世編も、碧人と薫子の出会いはどうやらわけありで…！？\n如月先生自身も大正文化が好きで、レトロ可愛い世界観も必見です！\n少しずつ解き明かされる前世の謎と、めくるめく現世の溺愛をお楽しみくださ"
  note: 予約②③previewドラフト。本番化はユーザ確認後。ヨミ=楽天仮(NDL照合待ち)。genre=captionからprovisional付与

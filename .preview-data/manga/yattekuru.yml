  rakuten_caption: '「本来ホラーは未知の恐怖を楽しむものだが

    この漫画は理詰めで恐怖を説明する。

    それが聞いたこともないほど新鮮な説明でかつ怖い。

    今度は恐怖を解剖している」

    とよ田みのる（漫画家『これ描いて死ね』）


    血痕のようなシミを残し、ひとり暮らしの女性が姿を消した。部屋は施錠され、スマホや鍵が残置されている。事件を追う捜査一課の黒沢楽太郎は、本事案が「特殊事象案件」として、警察内で「心霊課」と俗称される「特殊事象対策課」との共同捜査となったことに戸惑いを隠せない。しかし、次第にあきらかとなる失踪女性の愚痴が鬱積した裏アカ、新たな行方不明者による見境のない攻撃的なリプライ……SNSに澱む言葉は「呪い」となり、まるで灯火に群がる虫のように、それは、「あちら側」から、やってくる。


    ＊第30回手塚治虫文化賞［新生賞］受賞


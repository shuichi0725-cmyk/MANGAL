  rakuten_caption: '「君にご教授願いたいんだ　現世（げんせ）の沐浴の作法を」


    怜は、母親から継いだ温泉宿・蓮見庵の経営不振に悩んでいた。そんなある日、日課としていた参拝先の神社から、自分を呼ぶ声を聞く。まるで招かれるようにその鳥居をくぐるとーーそこには見たことのない世界が広がっており、さらには怜を呼び寄せたという龍神が待ち構えており!?


    「君の助けが必要で呼んだのだ　こちらの常世（とこよ）に」

    「うちの旅館に客足が戻るなら…神様に風呂に入ってもらおう！」


    沐浴をめぐり現世と常世が交わるとき、種族を超えた愛が生まれる？

    お湯もしたたる異世界ファンタジーBLの物語が、ふわり湯けむりのなか動きだすーー…。'

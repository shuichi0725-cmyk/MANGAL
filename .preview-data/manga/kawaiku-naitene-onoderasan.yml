  rakuten_caption: '少し高い声がコンプレックスで、人前で話すことが苦手な小野寺は、

    不慣れな営業部での仕事がうまくいかず、ほぼ毎日上司から叱責されている。

    そんな彼に優しく接し、フォローもしてくれるハイスペックな年下の同僚の風間。

    ある日、ふたりはトラブル処理のために1泊で出張に行くことになったのだがーー。


    「今の声、もう1回出してみましょうか」


    急に様子が変わる風間、そして飲み込まれる小野寺…！？

    ストーカー気質のしごでき後輩×声がコンプレックスな先輩による、オフィスラブBL！！



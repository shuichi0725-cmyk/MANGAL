  rakuten_caption: "助けた亀に連れられてーー竜宮事務所で働くことになりました\n\n絵を描くことに行き詰まった美大生のズーハン。休学をめぐり両親と揉め、家を出て一人で生きることを決意する。しかし、現実はそう甘くなく、海辺で途方に暮れていると、岩に挟まったウミガメが「助けてくれ！」と話しだした⁈ \nそして、助けたウミガメと、急に現れた謎の人物ナイに連れられてたどり着いたのは、海底にある“竜宮事務所”。そこには、信じられない不思議な世界が広がっていた。初めのうちは、「夢なら早く醒めてくれ」と怯えていたズーハンだが、あることに気づき「ここで働かせてください」と願い出る。\n\
    進む道に迷う全ての人に贈る、台湾発ハートウォーミング海底異世界物語。\n\n © 2026 by 哎呀呀 (Aiyaya)"

  rakuten_caption: 'どうやら俺は罪人の女と結婚したらしい


    侯爵令嬢シーラことシェラサール・ドルトンは、第一王子・ライオネルから突然冤罪をかけられ婚約破棄を言い渡される。

    王命で決められたシーラの次の結婚相手は、粗暴で野蛮で女好きだという悪評高き辺境伯。


    辺境へたどり着いたシーラを待っていた夫・ディランはシーラの話を聞かず、彼女を”罪人”だと決めつけ使用人として働くことを命じる。

    ディランの妻として生きるくらいならと使用人として働くことを決意するシーラ。


    一方ディランは使用人として働くシーラと過ごすうちに己の間違いに気づき始めーー!?


    王命での結婚から始まった2人のすれ違いの行方はーー!?'

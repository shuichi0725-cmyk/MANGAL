  rakuten_caption: 'もしかしたら俺の好きな人は、ヤンデレ製造機かもしれない!!

    図書館に勤務する音夜の悩みは、いつも付き合い始めたあと、恋人がダメ男だと判明すること。毎回、浮気をされて、利用されて、結局は別れるといったパターンの繰り返し。恋するときめきも枯れ果てていた。そんな音夜に、図書館に通う大学生・綾星が急接近。元カレの存在など、なぜか音夜のプライベートを色々と知っているのは気になるけど、向けられる好意に失ったときめきを取り戻しつつあったある日、酔った綾星に「俺なら大事にするのに」とキスをされてしまい…!?

    激重愛な年下大学生×無自覚魔性な図書館員の恋愛ステップアップ！'

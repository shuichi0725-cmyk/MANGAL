synopsis: 王女たちの家庭教師オリヴィアは、ある夜、宮殿に侵入してきた黒ずくめの男にさらわれる。目覚めると見知らぬ儀式の最中で、危険な魅力を持つ男に翻弄されていく。恋を知らぬ娘が砂漠の王子の花嫁となる異国ロマンス。
catch: 恋も知らぬまま、家庭教師のオリヴィアは黒ずくめの男に攫われ、見知らぬ儀式の渦中に。危険な魅力を放つその男に、抗う術もなく身も心も委ねていく——砂漠の王子との運命に翻弄される、エキゾチックなロマンス。

  rakuten_caption: "婚活は「見た目」か「性格」か！？ \n\n 46歳、祖母と母の介護を終えた遅めの婚活で\n入会した新会員の西脇千佳様。\n\n\
    予算40万で1か月以内の退会を宣言し、\n仲人のあおいや絆を驚かせるが、\nなんと、その通りに28日で成婚ーーーー\n\n婚活市場で、決して良い条件とは言えない彼女の\n\
    スピード退会の理由を知ることで\n仲人としてのアドバイスの幅が広がると思ったあおいは、\n絆とその謎に挑むが!?\n\nその他、\n\n29歳、おばあちゃんっ子の「ダサい男」。\n\
    39歳、学生時代のモテ服から「アップデートできてない女」。\n33歳、ときめきを探してしまう「少女漫画家」。\n43歳、ハイスペの相手はハイスペ限定!?「年収5千万の経営者」。\n\
    \nなど、様々な会員様の「婚活」そして「人生」を、\n悩みや課題にあわせた戦略（ストラテジー）で導きます！\n\n婚活のリアル、そして希望を描く\n令和の仲人奮闘ドラマ、第2集！\
    \ \n\n 【編集担当からのおすすめ情報】 \n 今回は婚活を始める前に知っていきたい「婚活ファッション」や\n1対1のお見合いとはひと味違う「婚活パーティー」、\n\
    そして「超スピード成婚」の謎に迫るミステリー仕立て…など、\n"

synopsis: 私は昔からオカルトに惹かれ、数々の不可解な謎の相談を受けてきた。だがこの家には覚悟が足りなかった。一見ごく普通の家、ただ一室を除いては。扉も窓もなく、ただの壁にしか見えないその部屋。あるはずのない、存在してはならない空間——この家にはどんな闇が潜むのか。

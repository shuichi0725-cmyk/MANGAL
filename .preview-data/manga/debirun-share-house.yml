  rakuten_caption: "にじさんじ・超話題の2匹 待望の単行本！ \n\n SNSインプレッションがなんと1000万超え！！\n世界級の大人気癒やしまんが『でびるんしぇあはうすっ』がついにコミックスになりました！\n（紙のコミックスにはステッカーがついてるよ☆）\n\n総勢150名以上のおおきなVTuber事務所「にじさんじ」に所属している、\nふわふわでかわい・・・おそろしい2匹のVTuber「でびでび・でびる」と「ルンルン」がまんが化！\n\
    \n作中で、でび様が世界のことを知りたいルンルンに人間の生活を教えるため、はじまったシェアハウス。\n2匹が奮闘する姿を、ちゃおの桜庭あも先生がとーーーってもかわいく、いとしく描いています。\nさらに、本編ではしばちゃんも登場！コミックスでしか読めない描きおろし収録も！\n\nまんがの中でがんばる2匹が、学校やお仕事を毎日がんばるみんなにとって、特大のいやしになることまちがいなし！\n読んで幸せな『でびるんしぇあはうすっ』是非ご覧ください！！！\
    \ \n\n 【編集担当からのおすすめ情報】 \n 間違いなくかわいい！間違いなく永遠にかわいいです！！\n\n2匹の全面協力のもと、はじまった『でびるんしぇあはうすっ』著／桜庭あも\nたくさんの応援をいただき、ついに単行本化いたしました！\n（紙コミックス限定のステッカーもとてもかわいいです。）\n\nひらくと、思わず口角が上がってしまい、2匹のあまりのかわいさに涙が出るほどの『でびるんしぇあはうすっ』。\n\
    たくさんご飯をたべたり、運動したり、じゃんけんしたり、お仕事したり、おもてなししたり、風邪を引いたり・・・？\nなどなど！ さらにはしばちゃん登場で「ふらっふぃい」もみられちゃう！\n\n毎日がんばるみなさま、ぜひ、ふわかわコメディーを体験してみてください！\n【とくべつなシール】\n【もくじ&あらすじ】\n第1 話 シェアハウスしよう/ じゃんけん/ オムライス\n第2話 おはなみ/ おふとん\n\
    第3話 おしごと/ オフィスワーク/ アイスショップ\n第4話 あんみん/ フリスビー/ あめ\n第5話 あくまかぜ/ かんびょう/ あくまかぜふたたび…？/ わたがし\n第6話 おもてなし（しばちゃん登場）\n第7話 ティッシュないよ/ 怒ってる？/ パンケーキ\n第8話 うみ/ じゅんびうんどう/ かきごおり/ たそがれ\n第9話 えにっき/ みちみち/ タイトルは…\n【ちゃお本誌出張版\
    \ うんどうかい】\n【コミックス限定描き下ろし】"

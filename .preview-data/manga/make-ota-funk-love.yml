  rakuten_caption: "「俺、アイツのことクソ好きじゃん!?」\n \n隠れ一途な悪友×拗らせ限界ヲタが織りなす\nやり直しラブコメ、ついに単行本化!!\n \n友達ゼロ、恋愛経験ゼロの陰キャ社会人・庵。\n彼はさえない人生を変えるべく同窓会に参加するが、\n周りのリア充トークになじめず、心が折れてしまう！\n \n絶望する庵に声をかけたのは、高校時代唯一の親友・四季。\n同窓会を抜け出して、二人は青春リベンジを決意!!\n\
    \ \n夜の浜辺でエモい女装デート（？）をしたり、\n推しの炎上に泣いたり、くだらないことで笑ったりーー。\n一緒にバカ騒ぎする毎日は、10年前と変わらず最高に楽しい！\n……それなのに、四季は時折、寂しそうな顔を見せる。\n \n自分の知らない四季がいるのは嫌だ。\n気づけば庵の頭の中は、四季のことばかりで…!?\n\n＜収録作品＞\n負けオタ・ファンク・ラブ 1〜5話"

  rakuten_caption: '通学路の途中にある、斉藤さんの家の塀。

    小学生のゆうたは、ある日、子供たちがそこに落書きをしている現場を目撃する。


    「さいとうさんへ

    カベのらく書き 消すの手つだいます」

    ーー勇気を出して手紙を書いたゆうただったが、待てど暮らせど返事は届かない。


    不安に駆られたゆうたが、意を決して斉藤さんの家を訪れると……。


    人と人との繋がりを、どこまでも優しく、温かく描き出す表題作ほか、

    Xで9万いいねを獲得し大反響を呼んだ

    読切版『河童のパキチ』など、珠玉の全5編を収録。

    心の奥底をじんわりと満たす、著者待望の初短編集。'

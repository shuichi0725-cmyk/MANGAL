synopsis: '両親が他界、会社はブラック、

  苦労の多い人生を歩んできた暦は、

  無気力に変わり映えのない日々を過ごしていた。

  ある日、数少ない友人に誘われ縁結びで評判の神社を訪れることに。

  『家に帰ったら誰かがいて、一緒にご飯を食べて笑いあう』

  そんなありふれた願いが頭に浮かんだ帰宅後の夜、

  暦'
catch: 両親を亡くしブラック企業で働き、無気力な日々を送る暦。友人に誘われ縁結びの神社で「家に帰ったら誰かがいて、一緒に笑いあう」と願ったその夜——ありふれた幸せを求める青年に訪れる、優しく不思議な人外同居ファンタジー。

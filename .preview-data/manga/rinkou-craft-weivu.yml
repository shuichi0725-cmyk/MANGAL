  rakuten_caption: 'YMO、Kraftwerk、Daft Punk…今なお輝き続ける”打ち込み音楽”＝DTMに捧げる

    打ち込み系青春漫画！！


    雪も溶けきっていない北海道の4月。

    ”ものづくり”であれば、なんでも大好きな橙ダイヤは、晴れて封筒高校の一年生に。

    花の学園生活を夢見ていた通学路で、電子音楽好きの翠道橋幸が愛用していた古のウォークマンを壊してしまう。

    ひょんなことから関わり出した2人は、学校きっての変わり者・愛野茜に目をつけられ、

    学園一ヘンテコな部活・パソコン部に入部することに！

    パソコン部の活動は、DTMで音楽を作ること…？'

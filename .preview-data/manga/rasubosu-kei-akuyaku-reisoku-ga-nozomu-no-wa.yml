  rakuten_caption: '前世の愛読書だった復讐系漫画ーーその悪役令息・ラクトフェル伯爵家サタリアに転生した俺は、すべてを理解した。伯爵家が主人公・アルヴェンの手で滅び、自分もまた悲惨な末路を迎えることを。ならばせめて犠牲者を減らし、原作通りこの家を没落させよう。そう決意した矢先、本来なら復讐鬼となるはずのアルヴェンが目の前に現れた。奴隷以下の扱いを受け、誰よりもラクトフェル家を憎んでいるはずの彼は、サタリアの前に跪き、静かに告げる。「俺を…あんたのものにしてくれ」向けられた瞳に宿るのは憎しみではなく、狂おしいほどの執着。重すぎる愛の裏に隠された真実とはーー!?



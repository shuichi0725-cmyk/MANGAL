  rakuten_caption: '浮気者の婚約者フィリップに容姿を貶されつ

    づけ、ついに婚約破棄を言い渡された伯爵令

    嬢アニエス。これまでアニエスは目立たぬよ

    うに髪をまとめ、ドレスも地味にするなどフ

    ィリップの言いなりにしてきたのに。それに

    一応、王族の端くれであるフィリップにふさ

    わしくあれと、マナーや勉強など日々努力を

    つづけてきたのに。都合よく浮気相手を「俺

    の運命」などと呼び、悦に入る姿には苛立ちし

    か感じない。

    （ふざけるな！　キノコが生えるわ！）

    ーーそう、実はアニエスは精霊の加護により

    感情が高ぶると、相手にキノコを生やしてしま

    う特異体質だった。この体質に恩恵を受けた

    ことは今までないはずだが、婚約破棄騒動か

    ら助けてくれた第四王子クロード殿下から、

    すぐに求婚されたのはちょっと意味がわから

    なかった。彼は、よいのは顔と血筋と将来性

    だけで中身はキノコをこよなく愛するおかし

    な人物。いくら婚約破棄されたばかりの私で

    も、キノコの変態はご免です！'

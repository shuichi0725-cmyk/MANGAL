  rakuten_caption: '前世の記憶を持ったまま騎士爵家の三男として転生した主人公。

    特別な異能力こそないが、持って生まれた『ギフト』のおかげで王都の魔法学院に入学することができた。

    華やかな貴族社会で羽目を外す婚約者を尻目に、ただひたすら学院の環境を活かして、家族のために己の研鑽を積む。

    それは前世では経験したことのない愛情をあたえくれた人達が、安寧に暮らしていける手段を求め続けるためだ。


    彼は辺境の子であり、騎士爵家の三男であり……歴史の中では、まだ「名もなき」存在なのだ。'

  rakuten_caption: '「もしかして、告白だと思いました？」

    「俺がモテないからっていじんなよ！」


    オタク高校生・景星（けいせい）は、陽キャな後輩に毎日のようにからかわれている。

    「女の子と付き合ったことありますか？」

    「キス、してもいいですよ」

    「…先輩、ドキドキしちゃいました？」

    ーー爆弾発言を平然と投げてくる後輩に、迫られては何も言い返せず翻弄される日々。


    けれど、その“からかい”の裏に隠された本当の気持ちは……。


    思わせぶりすぎる陽キャ後輩と、からかわれ耐性ゼロな陰キャ先輩の、じれじれ片想い系ラブコメディ！'

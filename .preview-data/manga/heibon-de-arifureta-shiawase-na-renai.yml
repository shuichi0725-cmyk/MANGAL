  rakuten_caption: '文武両道で学園のアイドル的存在の高3女子・幸（さち）。そんな彼女が初めてのカレシに選んだのは、一学年下で、愛嬌のない地味男子・大和（やまと）だった！？　周囲に「釣り合わない」と言われても、二人のまっすぐな気持ちは揺るがない。お互いにとってこれは、大切な、特別な恋だからーー。


    『魔導の系譜』（原作・佐藤さくら）でデビューした俊英、初のオリジナル連載がついに単行本化。

    まっすぐすぎる二人は何もかもが全部“これから”。そんな日々を描く、初カレ＆初カノラブコメ、第1巻です！'

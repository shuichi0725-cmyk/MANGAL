    description: 試合前に必ず「藤村」を訪れる日本チャンプのボクサー・辻本。その接客はベテラン仲居の岩田と決まっていた。岩田の顔をオコゼみたいと馬鹿にしていた伊橋だが、辻本が岩田とのやりとりで緊張をほぐし、岩田も辻本の減量失敗を察して食欲の出る料理をそっと差し出す姿を目にする。一方、気の小さい栗原に他店から立板への栄転話が持ち上がり、親父さんが彼に自信を付けさせようと一計を案じる。伊橋の最初の後輩・長友も加わる。

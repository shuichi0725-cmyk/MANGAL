    description: 「藤村」の常連である銀行頭取・山野が、不正融資疑惑で事情聴取を受けたと新聞で知る伊橋たち。人柄の良さそうな人がと心配していると、その夜、山野が一人で店を訪ねてくる。心労で食が進まない山野のために、伊橋はある珍味を差し出す。また、料亭の食事はムダが多い、食べ物は栄養さえあればいいと主張する病院長の病院食が患者に評判が悪いと知り、伊橋がその改善を買って出る。

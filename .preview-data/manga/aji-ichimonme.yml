    description: クリスマス・イブ。若い頃に家族サービスができなかった親父さんが、家庭持ちの坂巻と谷沢を早く帰し、伊橋と二人で店を回す。だが伊橋にも彼女との約束があり、1時間遅刻して待ち合わせに向かう。忘年会シーズンには親父さん・坂巻・谷沢の三人が同時にダウンし、かつての先輩・川島が土佐から駆けつける。その縁で伊橋とボンさんが土佐の正月に招かれる。

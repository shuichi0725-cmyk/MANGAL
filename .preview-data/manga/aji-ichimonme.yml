    description: 追い回しの渡辺にどうも元気がない。仕事で悩む彼を伊橋は叱責し、親父さんに相談するが「もっとよく見てやれ」とそっけない返事。そんなある日、厨房から渡辺の姿が消え、後には割れたスリ鉢が残される。弟を捜す大蔵官僚、不味い料理をリクエストする男たち、おっちょこちょいな新人仲居など、料亭「藤村」を訪れる人々の様々な事情が、四季折々の料理とともに描かれる。

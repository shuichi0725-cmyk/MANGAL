    description: 親父さん・熊野の先輩で、銀座「柳亭」の花板・田辺が、老いを理由に引退し、後を熊野に任せたいと言い出す。熊野が柳亭に移れば自分は順送りで煮方に昇進できると、伊橋はひそかに期待する。結局「柳亭」は京都「花家」の花板・富田が継ぎ、「花家」の花板には坂巻が移ることになって、「藤村」にも大きな転機が訪れる。京都修業を終えた伊橋の昇進はなるか。

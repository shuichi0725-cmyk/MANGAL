    release_date: 2004-09
    description: 伊橋悟は、新宿の料亭「藤村」に入ったばかりの新米料理人。料理学校を首席で卒業した自信から、洗い物やゴミ捨てなど雑用ばかりの「追い回し（アヒル）」に飽き飽きしている。伊橋の不満を聞いた立板の横川は、その腕前を試そうと、追い回し歴3年の谷沢と「大根の桂剥き」で競わせる。上下関係の厳しい料理人の世界。元僧侶で遊び人らしいワケあり爺さん・ボンさんが新加入したり、No.2の立板が突然辞めたりと、板場は今日も大忙し。
  - number: 2

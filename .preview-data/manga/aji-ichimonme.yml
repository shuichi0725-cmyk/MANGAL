    description: 茅ヶ崎の兄夫婦を訪ねる途中、伊橋は昔のサーフィン仲間・田村と再会する。兄の家で夕食を振るまう約束をした矢先、後輩の女性が沖に流されたと田村が飛び込んでくる。伊橋は地元の青年漁師ガッちゃんに船を頼む。また、髪を黄色に染め派手な化粧をした仲居見習い・見村陽子が「藤村」に入り、ビシビシ鍛えないと使い物にならないと考える伊橋が厳しく接する。

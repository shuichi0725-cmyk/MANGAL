    description: あちこちに女をつくる遊び人のテレビディレクターが、女連れで「藤村」に来店する。天誅を下したいと考える伊橋の思惑通り、数日後、そのディレクターと女たちが店で鉢合わせしてしまう。また、給食はまずいと言った伊橋の一言から学校給食の現場を見学することになり、食べ残しを減らそうと奮闘する若い栄養士の姿に谷沢があるアイディアを思いつく。後半では伊橋が鬼怒川温泉の老舗ホテルへ助っ人に行く。

    description: 体がだるく頬もこけてきた伊橋は、病院で胃潰瘍と診断される。親父さんからは「板前らしくなってきた証拠」と言われ、やむなく休養して湘南の漁師ガッちゃんのもとへ遊びに行く。また、親父さんの師匠・吉武が亡くなり、通夜振る舞いの料理を作るため京都へ出向いた面々。親父さんは伊橋だけを京都に残し、料亭「登美幸」で一番下の追い回しとして修業させる。波瀾の京都修業編が始まる。

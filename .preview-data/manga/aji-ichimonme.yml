    description: 焼場を担当するようになった伊橋。商社勤めの兄から結婚を決めた女性がいると打ち明けられ、両親に紹介する前に会ってほしいと頼まれる。世間から浮草稼業と誤解されがちな「板前」を正直に名乗るべきか思い悩む伊橋は、食品関係とぼかして自己紹介することにする。やがて伊橋は兄の披露宴で焼魚料理をふるまうことになり、兄嫁の弟でトラック運転手の太一が三陸から運ぶ海の幸を、想いを込めて焼く。

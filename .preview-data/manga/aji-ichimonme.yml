    release_date: 2004-09
    description: 「藤村」の改装中、伊橋・谷沢・ボンさんの三人は京都の料亭「花家」へ助っ人に出かける。修業を終えた三人は、最終の新幹線までの間、祇園を巡り歩く。かつて祇園で遊び人としてならしたというボンさんの昔話を眉唾と思って聞いていた伊橋の前に、ボンさんを知る元舞妓・ひな子が現れる。また、著名な大学教授である伊橋の父との確執が、意外にも蒟蒻の田楽を通して描かれる。

    description: 友人の漁師ガッちゃんが警察に拘留されたと連絡を受け、伊橋は茅ヶ崎へ駆けつける。ガッちゃんは、遭難した釣り船の船頭の家族への無遠慮なTVクルーの態度に腹を立て、カメラマンを海に放り込んだのだという。高価なカメラを弁償するはめになった彼に、「藤村」の面々は援助を申し入れる。また、伊橋の提案で慰安旅行のキャンプに出かけ、元気のなかった黒田の様子が一変する。

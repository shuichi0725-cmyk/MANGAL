    description: 「藤村」の玄関をウロウロする怪しい人影。女将から、それが来店中の有名人カップルを張り込む写真週刊誌のカメラマンだと知らされた伊橋たちは、二人を裏口から出入りさせるが、その裏口も嗅ぎ付けられてしまう。また、若手女流落語家・小つると魚河岸で年を越した伊橋は、師匠から一年間の「江戸払い」を申しつけられていた小つるの兄弟子・鶴吉の高座を見に行く。

    description: 京都「花家」の煮方が辞め、「藤村」から板前を送ってほしいと依頼が届く。煮方の伊橋か焼方の黒田が候補となるが、引っ込み思案の黒田は「ボクには荷が重い」と遠慮する。ボンさんの説得や、なじみ客の落語師匠・円鶴の一言が、黒田の気持ちを突き動かす。黒田の代わりに入った新人は、世界各国の料理店を渡り歩いてきた経歴を持つ東達也。親父さんは渡辺を差し置いて、彼に焼方を任せる。

    description: 昼食の賄いでタケノコのコロッケを作った伊橋は、中学時代に毎日食べていた肉屋のコロッケを思い出し、久しぶりに食べに出かける。だが店の主人は息子に代替わりし、昔の繁盛ぶりが嘘のように閑散として、肝心のコロッケも以前とは似ても似つかぬひどい味になっていた。また、江戸前の佃煮にハマる伊橋に、親父さんが突然京都へ行けと言い出し、理由も分からぬまま京の料亭「花家」や「登美幸」をまわることになる。

    description: 年の瀬の忙しい最中、親父さんの急用で伊橋がカウンターを任される。話し上手な伊橋は、無口な谷沢に代わって客あしらいを一手に担い場を盛り上げるが、会話に夢中になって包丁から目を離し、危うく事故をおこしかける。親父さんは「谷沢の客あしらいの上手さを見習え」と、もう一日伊橋をカウンターに立たせる。また、毎度変わった彼女を連れてくる常連・萩原が、今度は三度の離婚を経験した「自然体女」を伴う。

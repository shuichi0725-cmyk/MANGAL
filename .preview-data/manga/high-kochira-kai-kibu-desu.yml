  rakuten_caption: '怪奇を解きほぐすのは、呪われたふたり。

    とある地域で、不可解な“呪い”が発見された。

    人間の仕業とは思えない凄惨な現場に呼ばれたのは『解奇部』の二人組。「除霊」ではなく「怪奇の解説」を行うこの二人が、呪いについて一つ一つ解きほぐす中で垣間見えるのは忘れ去られたその地の過去や人間の本質だった──。

    時にシビアに、時に人情ありきで、この二人が各所の呪いを“解く”理由とは──？

    年齢不詳の凸凹バディによる新解釈ライトホラー漫画！'

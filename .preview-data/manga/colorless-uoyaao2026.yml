  rakuten_caption: '「秘密にしておいてやるよ、その代わり俺と遊ばない？」

    大学病院の院長である傲慢な父の跡を継ぐ為、自由を制限され窮屈な世界で生きていた朱音。

    ほんの出来心でタバコを吸っているところを、先輩・志麻に見つかってしまい、その日から二人の秘密は始まった。

    『出来のいい息子』を演じ続ける朱音にとって、志麻の隣で絵を描くこと、体を重ねることが唯一本当の自分をさらけ出せる時間になっていく。

    しかし、それはほんの些細なことで簡単に壊れてしまいーー！？

    掴みどころのないバーテンダー×秘密を抱える陽キャ優等生のエモーショナルラブ。'

  rakuten_caption: 'ある夏の暑い昼下がり、幸せの絶頂にいた夏成と愛のもとに現れたのは、かつて同じ養護施設で苦楽を共にし、家族のように過ごした希実だった。

    7年振りの再会に、過去を懐かしむ3人。

    しかしその翌日、愛は希実に刺殺される。

    突然の出来事に言葉を失う夏成に、希実が投げかけた言葉は──「なつくん」。

    その愛称で呼ぶのは愛だけのはずだった。


    愛したいし、憎みたい。

    相反する燃えるような感情が、夏成を少しずつ壊していく──。'

  rakuten_caption: '夜専門の整理・清掃サービス「ナイト＆ブルーム」でアルバイト中の大学生・悠馬。

    今晩も、クセのある依頼人の無理難題を受けて立つ！


    冷蔵庫が溢れても食材を捨てられない俳優・椿さん。その理由は？

    妻の入院で、いきなり双子ワンオペ育児になったパパ・桑田さん。家は荒れ放題、どうする？

    心身ともに疲れている役所勤めの柳瀬さん。母が勝手に掃除を依頼！？

    さらに1巻で部屋も心もととのったはずの人々が、新たな悩みを抱えて再登場！


    自分自身でも気づけない、心の奥に隠された思い。

    それらをそっとすくい上げる“心の整理整頓ドラマ”、完結巻。'

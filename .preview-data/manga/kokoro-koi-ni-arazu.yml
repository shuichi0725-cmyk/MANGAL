synopsis: 後輩から怖がられる、しっかり者のOLココロ。自分で買ったマンションで一人暮らしをしている。ある日、酔った勢いでバーの若く生意気なイケメンバーテンダー・ケイに「うちに住まない?」と口走ってしまう。本当に始まった同居生活は、騒動の連続で…?
catch: 「本気でいく」と宣言する同居中の年下バーテンダー・慧と、急接近を危険視して突っぱねるこころ。「指一本だけ」の妥協案を出すも、まっすぐな彼の言葉に少しずつ心が動いて——大人の同居ラブストーリー。

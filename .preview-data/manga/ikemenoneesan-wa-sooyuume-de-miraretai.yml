  rakuten_caption: '与柴 詩恩は、幼馴染のお姉さん・鳳坂 冴久へ好意を抱いていた。クールでカッコいい彼女へ強く憧れている詩恩は、男として見てもらい自らも彼女と並び立つため、下心を隠して接していた。

    一方で冴久も、内心では詩恩のことを男としてガッツリ意識していて、異性として見てもらうために、積極的にアピールをするのだが、全て空回りしてしまい…!

    これは、そーゆー目で見てもらいたいクール系お姉さんと、そーゆー目で見てはいけないと自らを律する男子高校生が贈る両片思いエロコメである。'

  rakuten_caption: '「もうただの幼馴染じゃいられないね」


    一見穏やかな執着男子×男前な強気美人

    幼馴染シンメアイドルの共依存ラブ!


    ヒール系アイドルグループ＜Redust Rev.＞でパフォーマーをしている安芸は

    同じくパフォーマーの宙夢と中学からの幼馴染み。

    宙夢にダンスを誘われて気づけば12年ーー…

    食事は毎日宙夢に作ってもらったものを食べて、一緒に眠りたいと言われれば同じベットで寝ている。

    グループとしてもニコイチ営業をしているが、最近少し度を超えているのではないか、と気になっている。

    モヤモヤした気持ちを振り払うために冗談半分で宙夢に「もしかして俺のこと好き？」と尋ねると、意外な答えがーー！'

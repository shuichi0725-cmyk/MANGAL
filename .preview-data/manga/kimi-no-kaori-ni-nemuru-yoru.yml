  rakuten_caption: '新社会人になり、憧れを抱いて一人上京してきた蓮水蘭は、突如世界を襲ったウイルスの影響で人とのコミュニケーションが断たれ、孤独な日々を過ごしていた。

    しかし上京して初めての誕生日に、ひょんなことから隣に住む商店街のお花屋さん・柳鈴葉と知り合い、食事を共にすることに。

    似たような境遇にいる彼との時間は楽しく、すっかり夜も深まって今日が終わることに蘭が寂しさを覚えていると、夢うつつな様子の鈴葉に抱きすくめられてしまい…!?


    「きみが隣にいるこの夜だけは、いつもより安心して朝を迎えられるーー」

    隣に住む不眠症の花屋さん×誰かの役に立ちたいと願う青年の、優しくて苦い大人の初恋BL。'

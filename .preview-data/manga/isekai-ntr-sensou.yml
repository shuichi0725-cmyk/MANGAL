  rakuten_caption: '現代最強のスパイは、異世界の弱小貴族に仕える執事に転生した。

    彼が胸に秘めたのは、優しき主であるお嬢様への恋心と、彼女の愛する国土を守り抜くという誓い。


    だが、圧倒的な軍事力を誇る隣国の美しき姫将たちが侵攻を開始。

    絶望的な戦力差を前に男は決意する。

    清廉な戦いなど捨て外道スパイとして暗躍し敵を食らい尽くすことをーー。


    絆を裂き、心を折り、与えられたスキル・ハニートラップで敵の姫将たちを寝取り戦場を支配せよ!!'

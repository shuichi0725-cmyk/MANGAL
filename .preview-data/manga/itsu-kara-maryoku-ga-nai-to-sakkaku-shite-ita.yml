  rakuten_caption: '【魔力なし】として生まれ、家族に冷遇されてきたサフィラスはある日、伝説の魔法使いだった前世を思い出した。高度な魔法と知識で名門ブルームフィールド公爵家からの後援を得て、平民として学院生活を送りながら騎士系優等生・パーシヴァルや公爵令嬢・アウ

    ローラとの友情を育んでいく。ギリアムの誘拐騒動も落ち着いて、ようやく訪れた平穏かと思いきや、留学生・クラウィスの母国である獣人国で不穏な動きが...。そんな中、パーシヴァルに誘われたサフィラスはパーシヴァルの実家で長期休暇を過ごすことになってーー!?'

  rakuten_caption: 'ララート王国の第三王女システィーナは、正妻の子供ではないという出自から、姉たちや周囲から邪険に扱われていた。だが、好奇心が強いシスティーナは、剣術や魔法、あらゆることを自ら積極的に学び、いつしか自分の知恵と知識で王都の困りごとを解決するように──。そんなシスティーナが突然、ある陰謀から何もない辺境の領地に左遷されることになってしまう…。しかし、前向きで向学心が強い彼女にとってそれは学びの成果を試せる絶好の機会で…!?

    好奇心旺盛な王女による「辺境改革」がいま始まる！'

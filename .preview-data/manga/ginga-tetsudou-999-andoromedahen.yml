    description: 広大な航路を行く999号が前触れもなく航行を停止し、機関車のC62が客車を置いて姿を消した。原因をつかめない銀河鉄道監理局は全力で機関車の行方を捜すが、メーテルはその理由を知ってか、鉄郎にあるテストなのだと告げる。松本零士のデビュー七十周年にあたり、SF漫画の金字塔であるアンドロメダ編を、雑誌連載時のカラーページを収録した新装版で刊行する。球状住宅団の大酋長、C62の反乱ほか九エピソードを収録。

    description: 大星雲の中心にあり、銀河鉄道の終着駅であり、そして機械帝国の首都でもある惑星大アンドロメダ。ひとつ手前の最後の晩餐駅で、生身の人間として残る道を捨てた鉄郎は、自分用の機械の体が待つ終点へと向かっていく。母との約束を果たすために運命を受け入れる鉄郎を前に、メーテルはただ悲しみの底へ沈むばかりだった。松本零士のデビュー七十周年を記念した新装版、全十巻の完結巻。

    description: 惑星ヘビー・メルダーは、あらゆる空間軌道が一点に集まる宇宙の大分岐点である。地球から二百万光年離れた大アンドロメダ星雲と銀河系の接点に位置し、夢を抱く旅人が必ず訪れるフロンティアだった。しかし今では、時間を支配する時間城の城主に蹂躙されている。その城主は機械人間の海賊であり、メーテルは彼と決着をつけようとする。松本零士のデビュー七十周年を記念した新装版の第七巻。

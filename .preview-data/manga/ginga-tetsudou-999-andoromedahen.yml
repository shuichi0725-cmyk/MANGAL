    description: 宇宙を航行する999号と並行して、そっくりの列車が現れる。軌道が交錯して衝突事故を起こした二つの列車には、片方にメーテルと車掌が、もう片方に少年鉄郎とレドリルが乗車していた。レドリルもまた機械の体を手に入れるため銀河鉄道に乗り込んだというが、彼が来たのは鉄郎の生きる時代よりはるかに下った未来だった。松本零士のデビュー七十周年を記念した新装版の第九巻。

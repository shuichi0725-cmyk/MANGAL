    description: 瑞々しい水と土に覆われた美しい星がある。ところがそこに住む人々は食べ物に餓え、空気で膨らませたわずかな食糧すら口にできずにいた。食料そのものは豊富にあるのだが、この星を二百年前から支配する女王が日暮れ時につまびくハープの調べに合わせて作物を納めなければ、極刑に処せられてしまうのだ。生身の身体で生き続けているというその女王の秘密を、鉄郎とメーテルは解き明かしていく。松本零士のデビュー七十周年を記念した新装版の第六巻。

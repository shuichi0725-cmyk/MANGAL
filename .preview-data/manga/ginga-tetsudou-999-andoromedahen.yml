    description: 路線図にもない謎の駅、STATION No.13。999号は見えない力で停車させられてしまう。人影のないその幽霊星は、星全体が生命反応を示す、機械化された霊的存在だった。二人が足止めされた星に向けて、宇宙警備局から破壊エネルギーが発射される。松本零士のデビュー七十周年を記念した新装版の第八巻で、ヤーヤボールの小さな星ほか七エピソードを収録。

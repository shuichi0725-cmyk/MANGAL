synopsis: ハリストークでの一件が治まり、平穏を取り戻したかにみえたアルトディアス。しかし獣たちが変異をきたし、民に被害が出ていた。アルトディアスの旧城で獣たちの治療にあたっていたロビンは、とある獣使いの子供を弟子にするのだが？
  Ballad新章、新たなるロビンの物語が始まる!!
catch: 毒にも相当する薬を飲み続け、苦しみを乗り越えてロビンの元へ生還したアロラ。白魔法を覚醒させた幼き王子を救うべく奮闘する、継ぐ視をめぐる長編ファンタジー。

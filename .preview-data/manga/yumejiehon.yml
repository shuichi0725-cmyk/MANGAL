  rakuten_caption: "大正ロマンの寵児・竹久夢二が現代に蘇る！ \n\n 恋は芸術か自己愛か。百年前も男と女は遠かったーー\n時代の寵児として生き、いまなお多くの人に愛され続ける画家・竹久夢二。\nしかし彼は、華やかな成功の陰で、満たされぬ想いを抱えていた!?\n年上の妻・たまきとの恋と結婚はやがて綻びを見せ、すれ違いを重ねていく。\nそして、新たな恋も訪れーー!?\n愛を信じ、疑い……出会いと別れを繰り返す。\n\
    そしてそのすべてが、彼の芸術へと昇華されていくーー。\n恋と芸術に捧げた生涯が今、鮮やかな筆致で描かれる！\n監修:石川桂子 \n\n 【編集担当からのおすすめ情報】 \n 古屋兎丸最新作は、画風もがらりと変えて大正時代の日本へーー！\n描くのは、恋と芸術に生きた竹久夢二。そして彼の人生をともに彩った魅力あふれる女性たち。華やかで、ときに切ない恋模様とともに、夢二が表現者として、そして一人の人間として歩んでいく姿を描きます。新境地となる恋と芸術の物語を、ぜひお楽しみください。"

  rakuten_caption: '累計PV数1.6憶の大人気ピュアラブストーリーが待望の書籍化！


    甘野咲心（あまのえみ）は可愛い服を着ることが大好きな女の子。

    ある日、ナンパ男と言い争いになってしまい、飲み物をかけられそうになるが、そこに見知らぬ男の子が間に入って助けてくれてーー…！？

    それをきっかけに、助けてくれた彼・夕晴（ゆうせい）と定期的に会うことになったのだが、咲心は初めての感情に戸惑いを隠せずにいる……。


    コミックス限定の番外編も収録！'

  rakuten_caption: 「水」とは「何も混ざっていない透明な液体」ではなく、『水』という特殊な物質だということを我々は忘れがちだ。なぜなら、我々が住むこの星は、その特殊な物質で満たされた特殊な星だから。だが、水の中には我々と別の「何か」が溶け込んでいることに太古の昔から人は気づいていた。その「何か」を、ネラと呼ぶ──。『蟲師』の漆原友紀が贈る時空を超えた大型ファンタジー、濃厚なる第1巻。

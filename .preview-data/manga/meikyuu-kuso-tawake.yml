  rakuten_caption: '悪意の迷宮。勇猛果敢な英雄が仲間たちと徒党を組み、神話に出てくる魔物たちと戦い、財宝を得る。そんな御伽噺の舞台へと足を踏み入れた僕らは、薄暗い迷宮のなかで眼前に迫る敵に対して身構える。……三匹の大ネズミ。喜劇的とも言える死闘。ネズミに翻弄され、息も絶え絶えになる前衛に、たった一度しか回復魔法を唱えられない僧侶の少女、そしてたった一度、火球を出せるだけの魔法使いの僕。

    激闘と尊い犠牲の末に手に入れることができたのは、汚い革製の帽子が一つ……

    奴隷狩りに捕まり債権奴隷になった少年の冒険が始まる。'

    description: 京極一派の猛将ふたりを相手取り、忍びの陣左はひとりで天守閣の階段を死守するが、奮闘むなしく力尽きる。一方、敵に見つかって絶体絶命となったおんたちの前へ、あずみと千代蔵が救出に現れる。天守閣へ急ぐふたりは、数に物をいわせて迫る敵をなぎ倒していく(第1話「身命」)。将軍の次男・国千代の身柄を巡る西国の籠城戦は佳境に入り、あずみが京極一派から武信を守れるか、首謀者とされる武信をどんな運命が待つかが焦点となる。「非業」「追伐」「強談」「切腹」「当惑」「永別」を収録。
  - number: 41
    asin: null
    isbn13: '9784091812001'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09181200.jpg?_ex=200x200
    release_date: '2007-04-27'
    description: 国千代の救出という過酷な使命を果たしたあずみは、天海とともに海路で江戸へ戻る。武信への思慕を胸に残しながらも、千代蔵と束の間の安らぎに浸る。そんな折、あずみの活躍を聞いた国千代の母・お江与から、どうしても会って礼が言いたいという申し出が届く(第1話「帰還」)。千代蔵とともに秀忠の妻・お江与の屋敷へ招かれたあずみを迎えたのは、ただならぬ空気だった。「奸計」「涙雨」「痛恨」「出奔」「漂白」「露見」を収録。
  - number: 42
    asin: null
    isbn13: '9784091813787'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09181378.jpg?_ex=200x200
    release_date: '2007-07-30'
    description: 女であることを隠し、口のきけない武芸者を装って旅籠で働くあずみ。だがささいな騒動をきっかけに、旅籠の娼婦・茜に女だと見抜かれてしまう。言葉を交わすうちに茜と徐々に心を通わせ始めるが、そこへ茜が敵と呼んで嫌う客が現れる(第1話「記憶」)。旅籠に身を落ち着け平穏を手に入れたかに見えたあずみだったが、因縁深い風馬の手は着実に迫っており、功を急ぐその魔手はあずみが心を許したふたりの女へ向かう。「憐情」「動転」「無惨」「再起」「孤独」「窮境」を収録。
  - number: 43
    asin: null
    isbn13: '9784091815385'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09181538.jpg?_ex=200x200
    release_date: '2007-11-30'
    description: 接近戦での強さを警戒した風魔衆は、眠らせず食べさせない食攻めであずみを追い詰める。じりじりと消耗しながらも包囲網を破る一瞬の隙を窺っていた彼女に、ついに好機が訪れ、風魔衆との攻防は激しさを増す(第1話「逃走」)。風魔に追われるあずみの前には、大男の豪山が突然現れる。さらに豪山を追ってきた女の一行まで加わり、新しい旅の道連れにあずみは戸惑う。豪山はかつて爺・小幡月斎に仕えた男で、あずみを甲斐へ案内する使命を天海から受けている。「盟友」「奇遇」「暗影」「嫉妬」「狙撃」「迷路」を収録。
  - number: 44
    asin: null
    isbn13: '9784091817488'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09181748.jpg?_ex=200x200
    release_date: '2008-02-29'
    description: 風魔の手からは逃れたものの、生来の方向音痴で森に迷ってしまった万。ようやく出会えた頼みの綱の男は、道案内する代わりに身体を要求してくる。一度は断った万だが、礼がなければ案内しないと言い張る男に対し、しかたなく胸を触らせることを承諾する(第1話「野人」)。自分が闘えば巻き添えが出ることを恐れたあずみは、仲間たちと別れ、ひとりで甲斐を目指す。だが風魔は、その想いを踏みにじるようにいっそう残酷な手段に出る。万は豪山の強さに惚れ込んで追ってきた江戸の剣術道場の娘で、門弟の柴田山辰之丞と川田三平も供をする。「内紛」「卑劣」「不慮」「拘束」「懺悔」「入国」を収録。
  - number: 45
    asin: null
    isbn13: '9784091818652'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09181865.jpg?_ex=200x200
    release_date: '2008-04-26'
    description: 爺の故郷である甲斐の国へ着いたあずみは、城代家老から予期せぬ歓待を受ける。自分はともかく、仲間たちの身が甲斐の家臣に守られているという環境に安堵し、久々に仲間と笑顔ではしゃぎ回る。だがそのころ、金地院崇伝と京極が再び暗躍する兆しが見えていた(第1話「安息」)。甲斐には忠長の兄・家光や、安芸の大名・福島正則までが集っており、役者が揃いすぎたこの国に、あずみは波瀾の匂いを嗅ぎ取る。「田園」「手練」「不安」「襲来」「覚悟」「救出」を収録。
  - number: 46
    asin: null
    isbn13: '9784091821379'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09182137.jpg?_ex=200x200
    release_date: '2008-08-29'
    description: 新領主の忠長、将軍の名代として同行した家光、さらに福島正則と、甲斐には続々と役者が揃い始める。あずみ一行は宿舎を小さな寺へと移していた。名目上は忠長の思われ人ということになっているあずみは、忠長を喜ばせたい一心の家老に呼び出されて登城する(第1話「世運」)。旅の途上で気の置けない存在となった仲間のうち、あずみを狙う何者かによって万が誘拐されてしまう。将軍継嗣に絡む京極らの陰謀が進む甲斐で、あずみが動く。全8話構成で「謀議」「黒幕」「名分」「生得」「月夜」「矜持」「変調」を収録。
  - number: 47
    asin: null
    isbn13: '9784091822888'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09182288.jpg?_ex=200x200
    release_date: '2008-11-28'
    description: 毒を盛られて体調を崩した次期将軍・家光を見舞ったあずみは、将軍継嗣を巡る陰謀のため甲斐へ入国していた仇敵・柳生宗矩と再会する。京極のほかにも命を狙う者がこの地にいると悟って早々に退席するが、背後からひとりの侍が声をかけてくる(第1話「剣士」)。斬られれば自分を仇とする人間をこれ以上増やさずに済む。だが斬らなければ、捕らわれた万の命は助からない。若き侍との勝負であずみの剣が出す答えが描かれる。全8話で「煩悶」「哀切」「奸策」「早業」「奪回」「邂逅」「陥穽」を収録。
  - number: 48
    asin: null
    isbn13: '9784091823731'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0918/09182373.jpg?_ex=200x200
    release_date: '2009-02-27'
    description: 自らの息のかかった忠長を将軍の座に据えるため、京極は次期将軍・家光と福島正則の謀殺を企てる。そして計画の邪魔になるあずみには謀反の疑いをかけ、その動きを封じ込めようとする。一方、躑躅ヶ崎館に滞在していた福島の側近たちは、館内に漂う不穏な空気から、自分たちが京極に陥れられたことに気づく。やがて雨の中で家光と福島正則の暗殺が決行され、大切な人を守るためにあずみは急ぐ。長い旅路の果てに彼女がたどり着いた場所が描かれ、あずみ第一部が完結する。「詭計」「殺生」「烈士」「凶弾」「叫喚」「出立」「隠里」「道程」を収録。

  rakuten_caption: '合意の上でキスして触りっこして、これってもう両思いってことでいいのかなーー

    心も身体も、ぐっと距離の縮まった律（りつ）と桐生（きりゅう）だけど、まだ恋人ではない微妙な関係が続いていた。

    そして迎えた七夕まつり当日、「桐生煌世と両想いになれますように」と書かれた短冊を発見！

    色めきだつ周りをよそに、律は気が気ではない。

    告白もせずに失恋するのは嫌だーー勇気を出して告白し、二人はついに恋人同士に！

    幸せの絶倒にいた律だけど、「うちの弟には気をつけろ」と桐生が忠告してきた!?

    そんな天敵である弟が、キャンパス体験でサークル活動に参加することに！

    人懐こい笑みで近づいてきたかと思いきや「兄とはあと何日くらいで別れる予定ですか？」と初対面で宣戦布告してきて…!?'

  rakuten_caption: '人の心がわからぬ“冷害王子”とあだ名され、王位を簒奪されたデ

    ィートリヒ。公開処刑で首を刎ねられた次の瞬間、なぜか自分が生

    きていることに気づく。死に戻った先は、婚約者マルグリットと出

    会った日。かつてどんなにつれなくしても、決して自分を裏切らず

    寄り添ってくれた乙女。死んで初めて気づいたマルグリットの自分

    への深い想いの数々。第二の人生では君をきっと幸せにするーー！

    　陰謀渦巻く王宮で裏切りと支配の数々に傷つけられ、“冷害”と

    呼ばれるほど冷え切った王子の心が解けてゆく。第二の人生で再び

    逢いまみえた愛しいマルグリットを、ディートリヒは今度こそ命を

    かけて幸せにすると誓い、その日から彼女を溺愛しつくすことに。

    マルグリットは婚約者としてディートリヒの暮らす王宮に移り住む

    ことになるが、王宮は魑魅魍魎蠢く伏魔殿で、幸せばかりの日々とは

    いかない。第一王妃による度を越えた妃教育や、立場をわきまえな

    い無礼な家庭教師の態度、第二王子オスカーからの嫌がらせ…血が

    繋がっていようと、臣下であろうと信じるきることはできない。そ

    んな中、開催されることとなったふたりの婚約の宴も、もちろん祝

    福だけ'

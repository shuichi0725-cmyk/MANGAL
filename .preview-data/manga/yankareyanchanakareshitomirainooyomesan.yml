  rakuten_caption: 生まれつき顔にあざがあり、子ども時代から学校でも家でもいじめられてきたリエは、自分に自信がないまま大人になった。そんなリエの唯一の生きる支えとなったのは、いじめっこからいつも守ってくれたやんちゃな男子の真朝。ハイパーイケメンの真朝は、昼は医大生。夜のバイト・ホストクラブでもナンバーワンでモテモテ、いつも女子をはべらせている。そんな真朝がリエを「未来のお嫁さん」と呼ぶのはなぜ？　両想いなのに、お互いが片想いだと思い込んでいるこじらせラブストーリー。

  rakuten_caption: "恋のオムニバス×シェアハウスに住む女子達 \n\n 会社員をしながらまんが家をめざす莉子25歳。\n一目ぼれの彼を追いかけバイトをはじめた乃々19歳。\nベンチャーでシェアハウス会社の運営に励む実28歳。\n再婚した親との関係に悩むましろ16歳。\n\nケーキも幸せも悩みも分け合って助け合う。\n同じシェアハウスに住む女子4人の\nオムニバスストーリー開幕！\n\n会社員の莉子は、まんが家志望。1年以内にデビューして会社をやめる、できなければまんが家はあきらめると決意をする。その矢先、大学時代の“忘れられない人”渡会くんが、莉子の会社に転職してきて…。 \n\n 【編集担当からのおすすめ情報】 \n 「ココロ・ボタン」「スパイスとカスタード」「御曹司の並ぶ店」の宇佐美真紀先生、最新作！\n同じシェアハウスに住む女子4人は高校生から社会人まで年齢もバラバラで、性格も4人4色。\n恋をする。夢や仕事をがんばる。家族の関係に悩む。 \nそんな彼女たちの日々を宇佐美先生が丁寧に優しく描かれます。 \n思わず応援したくなる推しがきっと見つかります！"

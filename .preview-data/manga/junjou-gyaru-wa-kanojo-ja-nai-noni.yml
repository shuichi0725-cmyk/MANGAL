    ニュース番組では温泉レポートが始まり、そこから変わり映えのない1日が始まるまずだった。

    上半身裸の女性レポーターが映るまでは…。

    男女の貞操観念が逆転していることが分かり、戸惑いながらも順応しようとする朝陽。

    そんな中、通学時の電車で痴女から助けてくれた同じクラスの一軍女子・外ヶ浜凛々亜に男性経験が無いことを相談されーー。


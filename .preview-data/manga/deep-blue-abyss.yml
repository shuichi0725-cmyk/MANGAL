  rakuten_caption: "俺はお前の『唯一』になりたい。\n \n【一途なハイスペリーマン×危ういウリ専美男子】\n再会から始まる、エモーショナル救済BL。\n \n借金を背負い、夜の街で身体を売る青年・依織。\n男に媚び、金を返すだけの日々を送る彼の前に、\n高校時代の親友・岳が現れる。\n \n誰もが羨むエリートとなった岳の姿に、差を感じる依織。\nしかも岳は依織に『借金の肩代わり』まで申し出る。\n\
    当然反発する依織に、岳が持ちかけた条件は『同棲』で!?\n \n「結局お前も、恋人ごっこがしたいだけ」\n \nそれなら、徹底的に利用してやるーー。\nそう決意した依織は岳と暮らし始めるが……。\n \n超美麗作画で話題沸騰！ \n羽月レイ最新作、ついに単行本化!!\n\n＜収録作品＞\nディープ・ブルー・アビス 1〜6話"

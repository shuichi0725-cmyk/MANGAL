  rakuten_caption: '中田忍。32歳。独身。区役所の福祉生活課で係長を務める地方公務員である。

    彼を端的に表すと、他人に厳しく自分自身には更に厳しい、誠実にして異質な人間だと言える。


    そんな彼が深夜に仕事から帰宅すると、

    リビングに異世界からやってきたと思しきエルフの少女が横たわっていた。

    通常ならば驚喜するところであろうが、知恵の回転が速いその男は、

    地球の存亡に瞬時に思考を巡らせ、想定外の行動をとるのであったーー。'

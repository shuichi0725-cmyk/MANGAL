  rakuten_caption: "理系大学生・真田六花の異世界探偵譚、完結 \n\n 都内の大学の理工学部に通っていた大学生・真田六花が実験中の爆発によって、見知らぬ異国・祥倫国に飛ばされてしまった。『落ち人』としてこの見知らぬ国で過ごすことになった六花だったが、持ち前の根性と理系のアタマを駆使して祥倫国で起こる様々な事件を解決していく。そんな中、謎の呪術師・塔真が属する呪術院が、国の実権を握ろうと暗躍。その権力争いに巻き込まれた六花は…？\n\
    中華後宮を舞台に真田六花の恋と推理と冒険を描く異世界転移物語、完結！"

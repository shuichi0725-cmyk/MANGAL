    輝加国の新皇帝、龍宗との婚姻！！


    「后教育も受けていない私をどうして指名したの」と驚きつつも

    古の盟約により回避は叶わず婚儀の日を迎える・・・

    けれど、龍宗の表情は冷たく

    皇后に選んだ理由を訊ねても「なぜだろうな」と濁されてしまいーー。


    前途多難な婚姻生活が始まったけれど、

    なんだか龍宗の様子がおかしくて…!


    陛下、スキンシップ多めなのではーー！？'

    新サイド6（旧サイド4・ムーア）に移設されていたテキサス・コロニーでは、コロニー公社とモノトーン・マウス社によるコロニー再生計画が進められていた。

    そんな中、テキサスを根城にしていたNSP（ニューサマープロジェクト）に所属する艦隊〈メドガーエバース〉が、テキサスに寄稿していた連邦軍の試験艦〈アラハス〉を襲撃する。

    戦闘に巻き込まれたモノトーン・マウス社のダリーは、自作のガンダムである〈Dガンダムファースト〉で出撃。接近する2機の〈ガザC改〉を撃退するのであった。



  rakuten_caption: '陸上部の爆発事件の裏には、異能力を悪用しようと目論む組織

    「脳解放者」たちの存在があった！


    部員の犬神キュウも「嫉妬」を司る組織のメンバーだという。

    アタルとナツメ、そして探偵社の一員であるマナは

    持ち味の「感覚」をいかして、キュウとの直接対決に挑むーー!!


    そして、大企業グループ・祁答院家が主催するパーティーに

    招待された探偵社のメンバーたち。

    「味覚」に秀でた先輩・ミライも登場して、一行はますます賑やかに…!?


    さらに、祁答院家の代表・サクラがアタルに急接近！

    アタルのことを「将来の旦那様」と呼び慕う、サクラの思惑とはーー。'

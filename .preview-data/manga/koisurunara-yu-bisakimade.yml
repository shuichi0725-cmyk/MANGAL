  rakuten_caption: '亡き父の後を継いで歯科医院の若き院長となった笹々谷光琉。

    真面目な性格の光琉が、プレッシャーや責任感で押しつぶされそうになった時に

    いつも助けてくれるのは、腕利きの歯科技工士となった幼馴染の親友・国竹象真だ。

    いつからか、光琉は国竹の仕事場で作業の音を聞きながら無防備にうたた寝するようになった。

    穏やかに寝息を立てる光琉を、愛おしく見つめる国竹の思いは知らぬままにーー。


    一途に想いを募らす職人×幼馴染の歯科医

    触れた瞬間から溢れ出す、20年越しのいとしい執着BL


    描きおろし後日談収録！'

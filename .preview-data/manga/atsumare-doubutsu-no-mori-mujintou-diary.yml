synopsis: 人気ゲーム「あつまれ どうぶつの森」を題材にした公式コミックのシリーズ第13巻。無人島での賑やかな四季の暮らしを描き、今回は海遊びを満喫する「レッツ！スイム」編を中心に、住民たちのユニークな日常を綴る。
catch: 無人島での賑やかな四季の暮らしを描く公式まんがシリーズ第13巻。今回はカナヅチ克服に挑むコロユキの特訓や、海辺でのシュールな哲学談義など、海遊び満喫の「レッツ！スイム」編をお届け——ほのぼの島ライフ。

  rakuten_caption: クラスメイトと異世界召喚された、ソロキャンプが趣味の高校生コー。魔導士ルナや猫耳少女リーズと森の調査中、圧倒的な威厳を放つ巨大な神竜に遭遇する！人の言葉を話す神竜に対話を試みるコーだったが、神竜は聞く耳を持たず容赦なく襲いかかってくる。コーは冷静に攻撃をいなしながら、熱くなるあまり口が滑る神竜の言葉に耳を傾ける。どうやら森の奥には絶滅したはずのエルフの里があるようで……！？MFブックス刊の人気作をコミカライズ！最強ソロキャンパー高校生の、気ままな異世界スローライフ第3弾！

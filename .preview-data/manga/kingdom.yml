    description: 邯鄲攻略を目指し、趙国深部の宜安にまで兵を進めた秦軍。しかし、その進路を読み切った李牧の策略によって、秦軍は壊滅的な打撃を被ってしまう。追い詰められた桓騎本陣は、最後の博打として趙軍への決死の奇襲を仕掛け、総大将・李牧へと肉迫していく。

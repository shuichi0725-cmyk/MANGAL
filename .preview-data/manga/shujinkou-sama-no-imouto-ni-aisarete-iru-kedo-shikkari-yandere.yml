  rakuten_caption: '今日もハーレム作成に精を出す主人公様。

    俺はソイツと家が近いという理由で幼い頃から友人を嫌々やらされてきた。何をするにしても主人公様と比較され、呆れられる日々だ。

    とはいってもソイツ自身の性格は腐っているどころか陽キャそのもの。だからこそ特に秀でた点のない俺が余計に目立ってしまう。

    そんな俺だったが、ある日一通のラブレターを貰う。

    開封してみれば「好きです。今日の放課後、校舎裏で待っています」との文面。俺は柄にも無く舞い上がってしまった。--だが現実は非情かな。待っていた相手は、

    「え、誰？」

    俺と告白相手、靴箱を間違えて呼びだしてしまったらしい。

    翌日、なんともう一通ラブレターが俺の靴箱に入っていた。

    文面は、

    「貴方の全てを知っています」

    だった。'

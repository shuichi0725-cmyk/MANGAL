  rakuten_caption: '人や動物の心の声が聞こえるオリビアは、その能力ゆえに実の家族から疎まれていた。

    五歳でとうとう修道院に送られそうになり、逃げ込んだ森の奥で、スープ店を営む養祖父母に拾われる。


    それから二十年。

    今は亡き養祖父母の店を受け継ぎ暮らしていたが、心の底から通じ合えるのは動物たちだけだった。


    しかし、ある雨の日にびしょ濡れで店を訪れた元傭兵のアーサーとの出会いが、彼女の運命を静かに動かしはじめてーー。



    これは「スープの森」に訪れる　

    様々な出会いと別れの物語

    Contents

    第1話　雨と傭兵と三種の豆のスープ　…P 003

    第2話　オリビアの秘密と春野菜のスープ　…P 055

    第3話　フレディ薬草店とさくらんぼのお茶　…P 095

    第4話　別荘街の怪我人と手羽元のスープ　…P131

    第5話　金色の鹿　…P165'

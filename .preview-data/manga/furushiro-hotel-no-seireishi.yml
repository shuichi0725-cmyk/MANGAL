  rakuten_caption: '古城ホテルで働く新米コンシェルジュ、オリビア。彼女は「霊が視える」ことに悩んでいた。

    ある日、ホテルに“精霊師”だという美青年ルイスが現れる。

    彼はホテルの支配人だったオリビアの祖父に「孫娘を頼む」と言われ、ホテルの一室の鍵を渡されたらしい。

    精霊たちと対話ができるルイスはホテルに住まう精霊が起こしていた問題を解決していくが

    彼の浮世離れした行動はオリビアの悩みの種にもなり…？


    偉大な祖父の様なコンシェルジュになるという夢を追う少女と、愛を知らない精霊師が送る

    心に寄り添うお仕事ファンタジー、開幕'

  rakuten_caption: '婚約破棄まであと2日ーーー。


    自身の記憶喪失の原因も明らかになり、記憶は戻らないながらも包帯をとることができるまでに回復したエレナ。

    彼女とオスカーに残されたイベントは、“婚約破棄の実行”のみとなってしまった。

    二人のすれ違う想いを横目に、オスカーの友人である、エレナの治療を行っていた医師のジェイクが驚くべき提案を行った。

    「エレナ嬢、僕と結婚しない？」

    婚約破棄を目前にしているにもかかわらず、衝撃を隠しきれないオスカー。

    そして物語は再び動き出すーーー。'

synopsis: '和平を勝ち取る最強の刀を作り出せーー!!

  ルッツたちに課せられた新たな依頼は、職人人生最高難度の刀製作。苦心するルッツだったが、リスティルの抱える葛藤に触れ、決意を新たに豪刀を打ち出す。ルッツの覇気に応えるかのように、パトリックが荘厳な鞘を生み出し、あとは付呪術を付与するだけ…。'
catch: 生涯最高の傑作を、銘も刻めぬまま手放した無名の鍛冶師。あの一振りはいま、領主お抱えの呪刀匠の手に。異世界スローライフと刀剣の物語が交差する。

synopsis: ある運命の日、無名の鍛冶師ルッツは、生涯最高の傑作と呼ぶべき見事な刀を偶然打ち上げる。だがある出来事から、彼はその刀を手放さざるを得なくなる。しかも作者の銘を刻み忘れ、自分が打った証も立てられない。一方、その刀は領主のお抱え呪刀匠ゲルハルトの手に渡り——。
catch: 生涯最高の傑作を、銘も刻めぬまま手放した無名の鍛冶師。あの一振りはいま、領主お抱えの呪刀匠の手に。異世界スローライフと刀剣の物語が交差する。

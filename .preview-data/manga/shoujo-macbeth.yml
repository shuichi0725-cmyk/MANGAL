  rakuten_caption: 百花演劇学校に入学した結城さやかは、劇作家を目指している。同学年には同じく劇作家志望で、周囲から「神」とまで崇められる天才・設楽了がいた。しかしそんな了は突然、自分の手がける演劇の上演中に舞台から転落死する。不幸な事故だと片づけられたが、翌年春に入学してきた新入生・藤代貴水は全校生徒の前で高らかに宣言した。「わたしは、設楽了の死の真相を調べに来ました」さやかは貴水に巻き込まれる形で、了と生前の関わりのあった生徒を調べることになる。

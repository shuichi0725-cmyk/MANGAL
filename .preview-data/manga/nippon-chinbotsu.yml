synopsis: 地震の多い日本では、ちょっとした揺れに大騒ぎする者はいない。だがある科学者は、先の地震が破滅的な事態を引き起こし、一年以内に日本が海に沈むという証拠をつかんだと信じていた。手遅れになる前に、誰かにそれを信じさせることができるのか——というSFドラマ。

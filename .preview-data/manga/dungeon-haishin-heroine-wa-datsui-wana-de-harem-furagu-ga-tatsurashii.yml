  rakuten_caption: 'ダンジョン配信でエッチなネタを提供して、成り上りませんか？


    ヒーローになりたい一心でダンス配信を始めるも、まったく伸びないサンゲとお手伝いの妹のハナビは、

    学園都市に異世界から突然現れた「スカッドダンジョン」でダンジョン配信をすることに!!


    意気揚々とダンジョンに突撃するサンゲだったが、女神からスキル「ちんちN」を授かる！

    謎スキルのせいで配信は暗雲立ち込める…かと思いきや、女神がモンスターに襲われて痴態を晒したことによって接続数が急激に伸び、

    サンゲとハナビはエロ配信で人気が出ることに気づいてしまう!!

    そして始まる、エロ配信ドリーム…そんなサンゲの魅力に釣られ、他の女の子にもドンドンモテ始めてしまい…!?


    サンゲはダンジョン配信でシコネタを提供し、成り上ることができるのか!!!?


  rakuten_caption: 'チェーン系レストランの店長を務める南雲みもざは、

    望まない環境に身を置き、悪戦苦闘中の日々を送っていた。

    そんな時、真夜中にオープンしているというビストロの話を耳にする。

    半信半疑のみもざだったが、偶然にもそのお店を見つけることになり……。


    路地裏で見つけた夜から朝にかけてオープンする『キッチン常夜灯』。

    寡黙なシェフの作る一皿に癒やされて、

    みもざは少しずつ前向きな自分を取り戻していくーー。'

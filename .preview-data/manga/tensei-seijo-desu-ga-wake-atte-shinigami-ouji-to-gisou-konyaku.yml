  rakuten_caption: 'レアな治療士でありながら、おちこぼれとして冷遇されてきた天涯孤独の少女・ルルカ。

    しかしある夜の事故をきっかけに、前世の記憶がよみがえるーー

    自分がかつて『伝説の大聖女・ルーネ』だったこと、そして最強の治癒能力までも！

    聖女の力を利用され、苦しめられた過去を持つルルカは、今世ではその力を隠して生きようと決意する。

    だが、事故で助けた相手は『死神王子』と噂される王太子・アレクシスだったーー!!

    ルルカの秘密に勘づいた様子のアレクシスは、なぜか彼女に偽装婚約を持ちかけてきて……!?'

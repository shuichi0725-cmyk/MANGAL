  rakuten_caption: "ーー俺はもう二度と、誰の「身代わり」にもならない。\n\nスタントマンとして働きつつ俳優スターを夢見る「清水翔」。彼はドキュメンタリー撮影のロケで土砂災害に遭遇し、崖から転落してしまう。目を覚ますと、同じ名前を持つ「清水翔」という別人の体として生まれ変わっていた。\n\
    困惑しつつも別人の体で生きることを決めた翔。しかし皮肉な運命のめぐりあわせで、自分が転落する前に体の関係を持ち、喧嘩別れした資産家の御曹司、「晏城明修」と再会する。\n\
    そして翔は思い出す。自分を「身代わり」として扱い、死においやった晏城明修との過去をーー。\n\n中国BL文学界の至宝、水千丞の代表作『職業替身』待望のコミカライズ!!\
    \ \n『職業替身』…タイで『MY STAND-IN〜身替わりの君〜』としてドラマ化され、日本でも大好評配信中。"

  rakuten_caption: 'ある日突然、乙女ゲームの悪役令嬢に転生したことに気付いたシンシア。彼女の婚約者・エディのルートを狙う正ヒロインのために潔く身を引き婚約破棄することにしたシンシアは、子爵家の嫡女として新たな婚約者探しスタートさせるがーー彼女が婚約者候補に目をつけたのは、ゲーム内で&quot;悪役令息&quot;と呼ばれ、無理心中≪バッド≫エンドを引き起こすヤンデレキャラのシライヤ・ブルックだった。


    不幸な生まれから、公爵令息ながら虐げられてきたシライヤだったが、成績優秀な上に謙虚で努力家。さらに長い前髪に隠された儚げで美しい容姿、そして何よりヤンデレを拗らせるほどの一途さと誠実さを持った、彼の魅力に気付いたシンシアは、彼を新しい婚約者にすることを決意するーー


    「虐げられているならーー私が愛してさしあげます」悪役令嬢の愛が悪役令息を救うーー!?　逆シンデレラストーリーが開幕！


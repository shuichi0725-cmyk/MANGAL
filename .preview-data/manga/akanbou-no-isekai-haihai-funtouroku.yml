catch: 前世の記憶を持つ赤ん坊が、傾いた男爵領を建て直す。
synopsis: 別世界の記憶で大人並みの意識に目覚めた赤ん坊ルートルフ。生まれた男爵家の領地は食糧難と借金を抱え、領民が冬を越せない有様だった。正体を知った兄と共に、赤ん坊は領地改革に乗り出す。

    さらに森の調査の過程で、洞窟内に塩を精製できる塩湖も発見し、領地の新たな収入源も確立していく！

    冬が迫る中で着々と領内の食糧や財政問題を解決していく2人だったが、診療でルートの生育に問題があることが分かりーー。'

    手帳を携えた少年・沙南は、

    集落の守護神・北神に

    かけられた「不死の呪い」を解くため、

    妖猫・月と共に、台湾島を北から南へと旅をする。

    南へ進むにつれ、長い年月を超えての「再会」とともに、

    北神が企む「沙南は救世主である」という噂に

    直面せざるを得ない状況に。

    そして、思いがけない新たな「出会い」もーー？


    この命は祝福か。それとも呪いか。

    数奇な運命に導かれた少年は、台湾島南部の奥地へーー。'

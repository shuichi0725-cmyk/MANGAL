  rakuten_caption: 'その暴力性故に“鬼子”と呼ばれ周囲から恐れられる少年・了一。

    喧嘩に明け暮れる日々だったが、ある時警察官の小宮に補導される。

    了一を更生するため、小宮がとった手段は“剣道”。


    この出会いをきっかけに少年は奥深き剣の道を歩み始めるが、仲間の裏切りにより重傷を負い右腕に後遺症を残してしまう。

    隻腕の剣士として上段を極めんとする了一が剣道界に旋風を巻き起こす'

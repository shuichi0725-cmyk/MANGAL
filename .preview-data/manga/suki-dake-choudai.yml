  rakuten_caption: '橘郁緒は大の犬好きなのに、アレルギー体質なため、仕事での疲れを犬吸いで癒すこともできないアラサーリーマン。いつも遠くからワンコ連れの人たちを羨望の眼差しで見つめるばかり。

    そんな郁緒の部署に有望なルーキーが配属され、郁緒が教育係に任命された。仕事の覚えもはやく、やる気もあるイケメンの輝明だが、なぜか郁緒に好意があるようで熱い眼差しで見つめられたり、好物を覚えてくれたり、犬に触れない郁緒のために犬耳コスプレをしてくれたり。とにかく“好き好きオーラ”がすごい。嫌な気にはならないが、恋愛に臆病な郁緒は、輝明の好意を素直に受け取れない。

    そんなある朝、出勤した郁緒を待っていたのは、

    「1週間後に先輩を抱きます！」と必死な形相で壁ドンしてきた輝明で…?!'

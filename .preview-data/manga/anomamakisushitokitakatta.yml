synopsis: '仕事のストレス発散のため、家具や雑貨を大量購入してしまう、和花（29歳）。

  気づけば金欠で家賃が払えない!? 　ついに鬼の大家・理航（19歳）が部屋まで押しかけて来るものの、うっかり彼とキスしかけてーー!?

  以来、激しめHな夢を見てしまい、彼を意識するように…。

  一方、理航も和花'
catch: ストレス発散の衝動買いで金欠になった和花の部屋に、鬼の大家・理航が押しかけてくる。うっかりキスしかけた二人が互いを意識し始める、年下大家との大人のラブコメ。

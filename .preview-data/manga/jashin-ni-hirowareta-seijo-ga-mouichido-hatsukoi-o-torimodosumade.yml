  rakuten_caption: '「初恋の王子様、もう一度生きてあなたに会いたい！」

    継母と義妹に代わり、祈りを捧げる本物の聖女セシル。

    ある日、瘴気に蝕まれたセシルは、義妹たちに邪神への生贄として捨てられてしまう。

    谷底で出会った邪神・ゼロから、自分の聖女になるよう迫られたセシルは、

    初恋の王子様・ランベルトを生き返らせるため、契約を交わすが…？

    傷だらけの聖女と運命に抗う王子のドラマチックラブ開幕！

    沢野いずみ書き下ろしSS「繋いだ手」も収録。

    第1話　もう一度会いたい、王子様

    第2話　本当の聖女の祝福

    第3話　守られた約束

    おまけ1　好きなもの

    おまけ2　聖女の願い

    おまけ3　邪神の願い

    沢野いずみ書き下ろしSS　繋いだ手'

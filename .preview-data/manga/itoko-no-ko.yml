synopsis: 友達以上恋人未満の従妹が可愛すぎて死にそう? ノゾムは夏休みに叔父の家に滞在する少年。コンビニもバスもない田舎で、彼の悩みは年下の従妹ソウ。日焼けした元気な彼女に毎日振り回され、年上らしい威厳を示せない。意図的かどうか、ソウの誘うような振る舞いにドギマギさせられっぱなし。日焼け従妹の小悪魔ぶりに沈みかける、理性崩壊系ラブコメ。

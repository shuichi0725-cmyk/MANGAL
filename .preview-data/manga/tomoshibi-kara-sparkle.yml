  rakuten_caption: '『甘々と稲妻』『おとなりに銀河』の雨隠ギド最新作！


    小3の海音〈みお〉は自分の気持ちを家族にうまく言えず拗ねていた。

    ある日家出を決意し、みおは近所に一人で暮らす祖母の自宅へ。

    祖母はピアノの教室に出かける前だったため、みおもレッスンを見学することに。

    まだ拙いながらも真剣な祖母のピアノ演奏と、ピアノの先生のピアノ演奏。

    みおの世界に鍵盤の音がきらきらと降りそそいでいく。


    祖母と孫娘が弾きつなぐ愛の物語。'

  rakuten_caption: '王都に蔓延する病ーーその原因を突き止めたスピーシィを狙って出現したのは、まさかの悪魔だった。

    魔術による攻撃を受け付けず、王都を蹂躙する悪魔の姿に騎士も国民も途方に暮れる。

    だが、暴走を続ける悪魔を止める手段について、スピーシィには確信があった。

    かつてスピーシィを王都から追放した黒幕である現王妃・プリシアの力が必要だということにーー。

    追放された魔女と、追放した王妃がついに邂逅!?　ぎすぎすしながら救国する第3巻！'

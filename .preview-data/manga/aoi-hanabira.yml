    description: 松本あきら名義で1958年に出た、著者にとって二冊目の単行本を復刻したもの。雑誌『少女』へ1957年から翌年にかけて載った読み切り「小鳩のひとみ」「死神のセレナーデ」「幽霊の足音」の三編を収める。家族のつながりや友情、悪へ立ち向かう勇気を描きつつ、森の奥の泉、美しい姿の死神、ピアノを奏でる美少女の幽霊といった幻想的な情景が随所に現れる。カラーページも含めた形で、およそ五十年ぶりに読めるようになった一冊。

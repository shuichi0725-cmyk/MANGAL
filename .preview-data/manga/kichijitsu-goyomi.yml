  rakuten_caption: 'ウエディングプランナーが贈る特別な1日。


    猪名川こよみ、ウエディングプランナー。

    フリーランスながら、業界内でも慕われる

    凄腕の結婚式仕掛け人だ。

    彼女は、新郎新婦のこだわりを日だまりのように受け止める一方で、

    無理難題ほど燃える性質。

    古巣である大手ホテル時代の元同僚でライバルの篠山とは微妙な関係を築きつつ

    こよみは今日も“最高の1日”を作るため奔走するーー！'

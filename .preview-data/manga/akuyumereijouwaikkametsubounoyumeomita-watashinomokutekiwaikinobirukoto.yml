synopsis: 'とある王国の公爵令嬢として、何不自由なく暮らすファリティナの人生は「悪夢」によって一変する。

  その悪夢で彼女が迎えた結末は、一家滅亡という悲劇だった。

  壮絶な未来の可能性を知ったファリティナは、悲劇を回避するために動き出す。

  「あなたは私が守りますーー。」

  “無関心”と悪意に立ち'

    description: 元鬼畜漫画家のやすおが五十歳を目前にようやく授かった双子は、胎内でTTTSという一卵性双生児特有の病気にかかっていた。本来独立しているはずの胎児二人の血管がつながっていて、供血児から受血児へ一方通行で流れている状態である。成長に差が出るだけでなく、様々な症状の原因となるという。妻のクチ子は、特殊漫画家のお前がせっせと描いた鬼畜漫画のカルマ返りだと憤慨する一方、やすおは二人の血液型は適合してるんでしょうかとトンチンカンな疑問を呈する。病院をたらい回しされた末、ついに最先端医療設備と名医たちに出会い、母は双子の命を救うべくレーザー手術に挑む。手術は無事成功するが、身動きも寝返りも許されず、一つ間違えば流産の危険が迫る暗黒の四日間が始まる。そしていよいよ出産間近、再入院したクチ子は予定日前に破水する。一九九八年に元妻のねこぢるが死去した後、再婚した山野一が、双子生誕までの日々を克明に、かつ自虐と諧謔を交えて描く。

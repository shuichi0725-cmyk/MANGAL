  rakuten_caption: '元カレを忘れられず、過去に縛られたまま生きる大学生・令（れい）。

    ある日、彼のもとへ戦時中から来たという男・昭（あきら）が現れる。

    昭は、見知らぬ時代に戸惑いながらも、かつて想いを寄せていた上官の面影を令に重ねていた。

    それぞれの寂しさを埋めるために始まった同居生活は、やがて止まっていた時間を少しずつ動かしていく…。

    過去に囚われたふたりは、「今」を共にできるのか──…？


    一途で真面目な昭和男×孤独な令和男子が贈る、時代を超えた同棲BL。'

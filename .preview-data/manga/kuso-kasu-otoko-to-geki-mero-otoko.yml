  rakuten_caption: "ゲーム感覚で女の子を次々とオトすクソカス男・箕輪倫太郎は、ある日、大学の喫煙所で「激メロ男先輩」こと杵築勝也が号泣している場面に遭遇。\n涙のわけを聞くと、長年片想いをしていた男に失恋したと言う。\n\n立っているだけで男にも女にも大モテしそうな先輩が、平均顔のモブ男に失恋…？ \n不毛な涙に腹が立った倫太郎は、軽い気持ちで「じゃあさ…俺が抱いてあげましょうか？」と提案するが…？\n\
    \n不毛な鼓動が胸を焦がす。\n喫煙所から始まる、カス男・ミーツ・メロ男BL。"

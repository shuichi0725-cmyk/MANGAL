  rakuten_caption: '「文鳥って、こんなに個性豊かなの!?」


    小さな体に、大きな個性。

    文鳥4羽とインコ1羽、5羽の鳥たちとの暮らしを

    「観察報告」という切り口で描く、コミックエッセイが登場！


    食べるのが大好きな子、甘えん坊な子、マイペースな子……。

    同じ鳥でも、性格もクセも、好きなものもみんな違う！


    本書では、飼い主だからこそ気づける、

    鳥たちの細やかな仕草や行動、豊かな感情表現を、ユーモアたっぷりの漫画で紹介します。


    「なんでそんなことするの？」

    「その行動には、どんな気持ちが隠れている？」


    4羽の文鳥と1羽のインコをじっくり観察してみると、

    いつもの何気ない行動が、ますます愛おしく見えてくるはず。


    さらに、実際の鳥たちの写真やプロフィールも収録。

    漫画と写真の両方から、個性豊かな5羽の魅力をたっぷり楽しめます。


    文鳥を飼っている人には「うちの子もそう！」という共感を。

    鳥好きの人には「こんなに違うんだ！」という新しい発見を。

    そして、鳥を飼っていない人にも「こんなにかわいくて面白い生き物だったんだ！」という驚きを。


    5羽の鳥たちを観察しているうちに、きっとあなたも、その魅力に夢中になる'

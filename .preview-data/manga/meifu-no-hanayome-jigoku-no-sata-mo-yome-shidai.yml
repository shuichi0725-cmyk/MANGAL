  rakuten_caption: '行方不明の弟を捜すため、閻魔庁へ単身乗り込んだ翠。

    故郷で出会った青年・天鴦が閻魔王だと知って数日ーー彼の花嫁候補として閻魔庁で働くことになった翠は、

    『ツノナシ』と蔑まれながらも、同僚に支えられ日々を過ごしていた。

    そんなある日、三途の川で閻魔王を取り巻く噂を耳にしてーー。

    天鴦が抱える秘密とは？ そして翠が持つ『原点廻帰』の力に秘められたものとはーー。

    地獄の底で運命が大きく動き出す、ロマンスファンタジー第2巻!!'

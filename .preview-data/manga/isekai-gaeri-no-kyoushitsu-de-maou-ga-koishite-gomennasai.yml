  rakuten_caption: '好きな子は異世界で人類を滅ぼしたことがあるようです──。


    ずっと片思いしていたクラスメイトの優愛に、ついに想いを伝えようと決めた運命の夜。

    突如として自分目掛けて降ってきた隕石により命を落とした俺は、異世界へと転生してしまう。

    しかし「俺の告白を邪魔するな！」という執念のみで魔王を瞬殺し、爆速で現実世界へと舞い戻ってきた。

    無双できるチート能力を持ったまま登校すると、なんとクラスメイト全員が俺と同じ「元勇者」の異世界帰りだと判明！？

    そして優愛も……え？優愛だけ元魔王…？異世界帰還系ラブコメ開幕！'

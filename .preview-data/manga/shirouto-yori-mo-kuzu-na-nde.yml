  rakuten_caption: '溶けて混ざって、戻れない「二人なら最っ高に気持ちいいよ」


    AV男優のじゅんは撮影終わりのある日、同じ事務所の男優・飛鳥が襲われている場に遭遇してしまう。

    助けた勢いでラブホに連れ込むものの、実は好んで乱暴なプレイに耽っていたという告白に意気消沈。

    いたぶられないとイけない飛鳥に”続き”をおねだりされ...!?

    「君が代わりに×してくれるの? 僕のコト」

    売り言葉に買い言葉、ドロドロのぐちゃぐちゃになるまで請われるままひどく彼を抱き潰すがーー...。

    ヤリ手ゲイAV監督と男優事務所社長の過去と今、素人厳禁の共依存・最アダルトラブ

    読み切り「ろくでなしメシア」も収録！'

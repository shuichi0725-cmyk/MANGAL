  rakuten_caption: '舞台は201X年。海と山に囲まれた県立なると高校。

    帰宅部を満喫していた青海まどかと、友人のギャル・米子は、

    ある日、強引に「クイズ研究会」へと誘われる。。

    二人を勧誘したのは、伝説の番組『アメリカ横断ウルトラクイズ』への情熱をこじらせたままの教師・河野だった。

    冷めた視線を送るまどかたちに、河野はクイズの魅力を説く。

    ーークイズの可能性は無限大。老若男女誰もが楽しめるのがクイズなんだよ。

    唯一の部活メンバー・ちくりん先輩の甘い誘いもあり、ふたりは次第にクイズに興味を持ち始め……。


    クイズがつなぐ青春ストーリー、開幕！'

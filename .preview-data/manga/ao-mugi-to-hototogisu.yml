  rakuten_caption: '男子高校生の本郷麦。なんでもできるけど、何かが足りない日々。

    ポニーテールがふっと揺れて、一枚の短冊が閃いて…

    出会った、君と俳句に。


    星越飛鳥は、俳句が好きだけれど、人と接することが苦手。

    クラス中の白い目を感じながら生きていたら、

    自分の俳句に目を輝かせてくれる人が現れた。


    二人が手を取り、俳句の世界に一歩踏み出すーー！


    俳句甲子園にインスパイアされた、あまずっぱ熱血ボーイミーツガール、ついに開幕！'

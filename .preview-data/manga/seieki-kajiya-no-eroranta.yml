  rakuten_caption: '魔王が平和を脅かす世界で、鍛冶屋を営む青年・クルト。ナマクラの剣しか作れなかったが、剣に●液をぶっかけると武器を強化できることを発見。エルフのエルサ、ちょっぴりアレな女剣士のアレシアと共にこの能力を研究することに!!


    様々な実験をしていた3人だったが、そんな彼らの元にクルトの妹にしてシスターのクララが鍛冶屋に訪ねてくる！ 彼女の目的とは?

    そして、興奮を最大限にすることで、武器をより強化できることに気づき、クルトの意中の相手とヤることであることに。その相手とはいったい……!?


    最高の射精で、最強の武器を作る!! エロくてちょっと熱い、ぶっかけクラフトファンタジー最終第2巻!!!!


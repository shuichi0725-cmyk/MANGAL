    description: アシュタロスは生きていた。そしてそれは、美神令子の死を意味している。美神の魂を手に入れたアシュタロスはコスモ・プロフェッサを作動させ、もはや抗う手立ては見当たらない。わずか一パーセントという美神の生存率に賭けて、横島とルシオラは戦いに挑む。だが二人の前に立ち塞がるのはベスパだった。惚れた男の未来をそれぞれ背負った、ルシオラとベスパの美しくも切ない戦いが始まる。美神令子除霊事務所の面々が積み上げてきたものが、この一戦へと集約されていく。巻末には加々美高浩による寄稿エッセイとイラストレーション、椎名がルシオラ、ベスパ、パピリオの創作について語るコーナーを収録。
  - number: 21
    asin: null
    isbn13: '9784091250018'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0018/9784091250018.gif?_ex=200x200
    release_date: '1996-05-15'
    description: 自らの身を捨てることで『究極の魔体』を得たアシュタロス。創造と破壊を繰り返す魔神が何を望んでいるのかは、まだ見えてこない。二人の合体技で対抗しようとする美神と横島だが、肝心の横島が戦力にならず苦戦を強いられる。ルシオラのためにも立ち直れるのか。シリーズ最長編となったアシュタロス編はここで完結し、宇宙の意志がどちらに未来を託すのかが示される。強欲さも超一流の美神と、時給255円の薄給で働き続けた横島の道行きが、ひとつの区切りを迎える巻。巻末には榎本ナリコによる寄稿エッセイとイラストレーション、椎名がアシュタロス誕生の経緯を語るコーナーを収録。
  - number: 22
    asin: null
    isbn13: '9784091250025'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0025/9784091250025.gif?_ex=200x200
    release_date: '1996-08-15'
    description: 人狼の犬塚シロと妖狐のタマモがタッグを組み、心霊ミニスカポリスとして活躍する一編を収録。さらに本巻では、美神令子の両親をめぐる秘密が明らかになる。母の美智恵と父の吾妻公彦がどのように出会い、どう惹かれ合ったのか。そして令子がなぜ父ではなく母の美神姓を名乗っているのか。事務所の日常の裏にあった壮大なラブストーリーが語られる。超一流のゴーストスイーパーとして知られる令子の出自が、ここで具体的に示されることになる。妖怪同士のコンビによる一編と、両親の来歴という二つの読みどころを備えた巻。巻末には七月鏡一による寄稿エッセイとイラストレーション、椎名がタマモの創作について語るコーナーを収録。
  - number: 23
    asin: null
    isbn13: '9784091250032'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0032/9784091250032.gif?_ex=200x200
    release_date: '1996-10-15'
    description: 六道女学院の臨海学校といえば横島でなくともついていきたくなるところだが、六道女学園がただで終わらせるはずもない。さらに時は移って西暦2199年、美神令子除霊事務所にとって最後の事件が幕を開ける。悪霊を祓う現代のエクソシストとして超一流の美神令子と、時給255円の助手である横島、そして元地縛霊のおキヌが歩んだ道のりは、ここで幕を下ろす。巻末には「ヒーローズカムバック」に掲載されたGS美神特別編「ブレイク・ユア・ディスティニー」を単行本初収録。加えて、高橋留美子による寄稿エッセイとイラストレーション、椎名が美神令子の両親について語るコーナーも収められた、文庫版の最終巻である。

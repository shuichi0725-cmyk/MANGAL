  rakuten_caption: '「また俺に抱かれろよ…」

    同窓会で早紀(さき)は、かつてセフレの関係であった旅館の若旦那・寛司(かんじ)と再会する。些細なすれ違いによって別れたものの、早紀は寛司と離れている間ずっと伝えたい気持ちを伝えられず後悔していた。

    「お前以外…俺をこんなふうにできねーよ…!」の言葉によって、気持ちが溢れてしまう早紀。あの頃を思い出すかのように真夏でむせ返るような暑さのなか貪り合うふたり。汗と蜜で溶け合うように激しく交わる三日間限定のラブストーリー。'

  rakuten_caption: '日本と台湾にルーツを持つ少女・シャオミン（小明）は、亡き父の故郷・台湾で大学生活を送るため、住み慣れた日本を離れ海を渡った。しかし、身寄りのない地での部屋探しは難航し、入学式を前に途方に暮れてしまう。


    行き場を失った彼女が迷い込んだのは、台北（タイペイ）の歴史が静かに息づく集落・宝蔵巌（バオツァンイェン）。ガジュマルの木の下に佇むカフェ“百日珈琲（ひゃくにちコーヒー）”--蝶の標本で彩られたその店には、「訪れた者の悩みを解決してくれる」という都市伝説が囁かれていた。店主のモン（孟）と不思議な猫・斑斑（バンバン）が営む同店は、単なる憩いの場ではなく、人々の脳に眠る“夢と記憶の研究所”。


    「亡き父はなぜ、夢を通して私に語りかけてくるの？」

    「答えは、あなた自身の記憶に眠っている」


    ーー2000キロの海を越えて日本と台湾を旅する蝶“アサギマダラ”が繋ぐ父との記憶に導かれ、シャオミンは“記憶の宮殿”を辿る、切なくも温かい“心の時間旅行”を始める。


    本作を紡ぐのは、デビュー作『緑の歌 -収集群風ー』で瑞々しい青春を描き、作詞家・松本隆、作家・村上春樹から熱い賛辞を寄せられた高妍（ガオ・イ'

  rakuten_caption: '公爵家の次女であり、第一魔術師団の副団長でもあるアリアーナ。恋人の第二王子・シリウスは、王家特有の病『竜魔症』に侵されていた。

    彼を救うため、アリアーナは治療に必要な竜の鱗を求め、危険な竜谷へ。

    命からがら鱗を持ち帰った彼女を待っていたのは、シリウスが姉を抱きしめ、「愛してる」と告げる姿だった。

    「一度目の人生では救えなかった。だからこそ、竜との『約束』で得た二度目の人生で、今度こそ必ず……と誓ったのに」

    「生きていてくれたらそれでいい」と言い聞かせるアリアーナ。

    聡明で一途なはずのシリウスは、なぜ彼女を捨てたのかーー。

    すれ違う二人の、甘く切ない溺愛ラブファンタジー開幕！


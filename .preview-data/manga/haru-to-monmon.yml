  rakuten_caption: '一回10万

    カラダで返してもらおうか


    父が営む喫茶店で、料理人を目指して一生懸命働いていた神木心春。

    しかし、再開発のため地上げ屋に店を奪われてしまった。

    買い戻すため、不動産王兼ヤクザの鬼崎誠吾の元で

    住み込み家政婦として働くことに…！

    炊事・洗濯はもちろん、時にはお風呂で背中を流すことも…？

    キケンな極道との刺激的な非日常生活が始まる。


     



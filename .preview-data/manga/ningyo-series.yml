catch: 人魚の肉を食べた者は不老不死になる——それは祝福か呪いか。普通の暮らしを願う不死の二人が、時代と日本を巡る伝奇ロマン。
synopsis: 人魚の肉を食べた者は不老不死になるという伝説。それは祝福か、それとも呪いか。不死となった湧太と真魚は、普通の暮らしを願い、時代と日本を旅していく。道中で同じく人魚の肉を口にした者たちと出会うが、その力の作用は人それぞれだった。全9話を「人魚の森」「人魚の傷」「夜叉の瞳」の3冊に収録。

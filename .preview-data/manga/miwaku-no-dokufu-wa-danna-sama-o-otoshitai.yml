  rakuten_caption: "「煽ったのは きみだ\n もう離すことはできない」\n\n公爵家の長女であるジルコニアは\n「男を誑かすのが好きな毒婦」という嘘を流され\n親友のリーリアに婚約者のクリスを奪われてしまう。\n娘を政治の駒としか見ていない父親にも見限られ絶望していると\n「竜殺しの騎士伯」と恐れられているシグルディスから\n突然、求婚の便りが届く。\n\n婚約者も、親友も、後ろ盾も失ったジルコニアは\n\
    この結婚を成就させるべく、毒婦を演じきることを誓う。\nしかし、シグルディスは予想外な反応を見せて…？\n\n恋するジルコニアのミニ描き下ろしも収録！"

synopsis: "袂を分かつ宿命か、共に舞う運命か。 \n\n 出奔して家に迷惑をかけた負い目からか、\n芸を磨くことに余念がない俊介。\n丹波屋を離れた喜久雄は踊れる舞台がなくなり、\n\

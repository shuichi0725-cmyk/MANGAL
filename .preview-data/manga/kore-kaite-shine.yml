synopsis: "先生と生徒、一歩を踏み出すための回歴！！ \n\n 2年生は、遥か北陸へ修学旅行！\n漫画研究会の面々は、漫画史に燦然と輝くあの巨星コンビの縁の地を巡ることに……\n\
  そこで目にして感じた全てが、未来を拓こうとする生徒たちと過去を慚愧する先生の背中を力強く押してくれる。\n“まんが道”その先"
catch: 伊豆大島の高一あいの執着はただ一つ、漫画。憧れの寡作な推し作家がコミティアに来ると知り、迷わず会いに行く——創作をめぐる出会いの物語。

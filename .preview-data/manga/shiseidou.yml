  rakuten_caption: 刺青の彫りを生業とする「刺青道」には、彫り師の父と仲睦まじい三兄妹がひっそりと暮らしていた。長男の堂本龍也の夢は、父のような「人の心に寄り添う彫り師」になること。しかし18年後、三兄弟からは笑顔が消えていた。そして、そこに父の姿はなく、龍也は「死体にしか刺青を刻まない」彫り師になっていた。その背景には、三兄妹の血涙の誓いが潜んでいた…!!

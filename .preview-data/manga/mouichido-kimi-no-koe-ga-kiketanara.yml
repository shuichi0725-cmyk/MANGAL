  rakuten_caption: "あまりにも急いで逝ってしまった妻、タマ子。\n残された夫の守は、それをどうしても受け入れることができず…。\n\n時間が押し流していく怒りや後悔の後に、残された願いとは。\n\
    「ひとつだけ、聞きたいことがあったんだ」\n\n大切なあの人にまた会えたとき、あなたはなにを話しますか？\n『妻が口をきいてくれません』作者が描く、究極の家族の絆。\n\
    \n【目次】\n第1話 さよなら、タマちゃん \n第2話 涙が出ない \n第3話 今もそこいらにいる \n第4話 マモちゃんがいいな \n第5話 オレは怒っている\
    \ \n第6話 こういうのが幸せ \n第7話 私がついてる \n第8話 ただの無職 \n第9話 タマ子、母になる\n第10話 運命だね \n第11話 なぐさめの言葉\
    \ \n第12話 時間薬ってやつ \n第13話 何年経っても \n第14話 公介の結婚 \n第15話 いい人生だった\n最終話 もう一度、君の声が聞けたなら\n\
    おわりに"

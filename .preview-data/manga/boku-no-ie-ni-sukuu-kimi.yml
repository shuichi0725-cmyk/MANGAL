  rakuten_caption: 'ーーあなたにとって、家族とは何ですか？




    平穏な一家の前に現れた、ひとりの美しい青年。

    彼との出会いをきっかけに、家の中に潜んでいた歪みが、少しずつ姿を現し始める。


    家族だから信じられるのか。

    家族だからこそ、逃げられないのか。

    日常に忍び込む違和感、じわじわと広がる不穏な気配。

    そして、「家族」という言葉の裏側に隠された恐怖。




    この人はこの家を救う光なのか、

    　それとも地獄に巣喰う闇なのか。




    『じゃあ、君の代わりに殺そうか？』の原作・蔵人幸明と作画・榊原宗々が再びタッグを組んで贈る、戦慄の侵食ホラー。

    美しい人物との邂逅が、一家の運命を狂わせていく。'

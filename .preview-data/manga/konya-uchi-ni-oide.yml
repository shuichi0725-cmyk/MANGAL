synopsis: '「私考えたんです　堅実に結婚する方法を」


  後輩・志緒の結婚式に招待された清子と圭亮。

  皆から祝福されている姿を見て、二人は自分達の未来について強く意識させられる。

  圭亮の母・史子に結婚を認めてもらう為、清子はある作戦を決行することにーー！？


  2人の未来のため、清子は大奮闘！

  '
catch: 後輩の結婚式に招かれ、自分たちの未来を強く意識し始める清子と圭亮。圭亮の母に結婚を認めてもらうため、清子が決行するある作戦とは——二人の未来をかけて奮闘する、大人の恋愛コメディ。

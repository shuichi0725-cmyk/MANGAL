  rakuten_caption: 自身の魅了の力に苦しむ第二王子のパーシヴァルと契約結婚した、彼の魅了が効かない王城使用人のサンドラ。最近、パーシヴァルがまるで恋愛結婚の夫婦かのように接してくれることが嬉しいサンドラだが、契約結婚の妻に徹しなくてはと自分の気持ちに蓋をする。しかし、その思いとは裏腹に、自身のサンドラへの恋心に素直になろうとするパーシヴァルがーー！更に、パーシヴァルの従妹・ビヴァリーの衝撃の秘密も明らかになり!?悩める王子×しっかり者令嬢、不器用な2人の関係が急展開をむかえる第2巻！

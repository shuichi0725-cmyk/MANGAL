  rakuten_caption: '科学が使えなくなった世界は、食糧問題により数百万人が餓死し暴動が起きる運命にいたーー。


    精密機械並みの器用さを持つ大利は、

    そんな世界を救うために、

    誰もが魔法を使えるようになるための魔法言語額学の研究に取り組んでいる

    オコジョの姿をした少女と知り合う。


    魔法言語を研究するのは魔力逆流により、

    研究者自体が死にいたることも多い危険な研究であり、

    彼女も魔力逆流によりオコジョの姿になってしまっていたのだった。


    大利は世界のために、そして命を投げうってでも研究を続ける彼女のために、

    誰もが魔法を使えるための魔法杖の開発に挑むーー!!'

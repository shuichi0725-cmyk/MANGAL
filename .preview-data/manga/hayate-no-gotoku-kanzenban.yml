catch: ヤクザに体を担保に取られた苦労人が、大金欲しさに令嬢を誘拐しようとして——なぜか愛の告白と勘違いされ、大富豪の専属執事に。波乱だらけのラブコメディ。
synopsis: ヤクザに体を担保に取られた苦労人ハヤテは、大金欲しさにある令嬢を誘拐しようとする。だが行動を愛の告白と勘違いされ、超大富豪の娘に専属執事として雇われてしまう。波乱だらけのラブコメディ。

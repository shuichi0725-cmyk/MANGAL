synopsis: '“漫画が好き”その想いで絆を育んできた、ギャルの宮本さんとオタクの上原くん。

  互いにホントに好きな気持ちを隠しながら、漫画家になるための“ギジレンアイ”を続けている。

  そんな二人に春が訪れーー上原くんの幼なじみ・恋ちゃんが転校してきた!?

  漫研結成と部員集め、屋上でおしゃべり、陰'
catch: 理想のラブコメヒロインを描くも編集者に一蹴され、絶望する冴えない高校生。そんな彼の前に現れたのは、漫画家志望の華やかなクラスメイト。凸凹の創作ラブコメ。

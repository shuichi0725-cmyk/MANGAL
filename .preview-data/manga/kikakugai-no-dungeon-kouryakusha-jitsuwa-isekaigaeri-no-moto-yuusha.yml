  rakuten_caption: 'ダンジョンが出現し、その攻略を生業にする能力者たちが活躍する現代。

    異世界で魔王を倒し帰還した元勇者、勇気蓮人(ゆうきれんと）は戦いに疲れ、ゲーム三昧の平和な暮らしを満喫したいと願っていた。

    しかし、かつての友人によってその正体を見抜かれダンジョン攻略に駆り出されると、規格外の実力は瞬く間に世間に知れ渡ってしまう…。

    「このままではギャルゲーをやる時間もなくなってしまう！」

    果たして蓮人が平穏な生活を享受できる日は来るのか…!

    かつて異世界を救った勇者が規格外の力で無双する、爽快感あふれるローファンタジー！'

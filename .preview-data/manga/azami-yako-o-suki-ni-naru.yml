synopsis: '公園にヤコを取り残しつつも…急ぎ帰宅したサンノミヤ。そこには、叔父・チュウヤが抱えた借金の取立人である、ヘビノメさんがいた。…さながら編集者っぽく漫画執筆の催促もしていた。強面でパワースタイルな彼女だが、サンノミヤに対しては昔から腰が低いというか当たりが弱い…といった感じだ。

  そ'
catch: 大企業CEOの娘で許嫁のアザミ・ヤコにようやく会える——意気込む転校初日。だが現れたのは、想像とまるで違うだらしない少女で。落差から始まる恋愛コメディ。

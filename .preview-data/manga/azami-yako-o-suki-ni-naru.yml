synopsis: 転校初日、三宮マコトの目当ては、大企業CEOの娘で許嫁のアザミ・ヤコに会うこと。中学時代の写真しか知らない相手にようやく会えると意気込む彼を待っていたのは、大きな落胆。だらしない身なりで独り言を呟くアザミは、想像とまるで違っていて——。恋愛コメディ。
catch: 大企業CEOの娘で許嫁のアザミ・ヤコにようやく会える——意気込む転校初日。だが現れたのは、想像とまるで違うだらしない少女で。落差から始まる恋愛コメディ。

  rakuten_caption: 触れた素材を“劣化”させるスキルのせいで、錬金工房をクビになってしまったエリク。仕方なく冒険者となったが、実はこのスキル、採取前の素材を上位種に変化させるものだった!! スキルの真価に気付いたエリクは、その力で激レア素材を集め、冒険者、そして錬金術師として自由に生きることを決意する。そこへ、エリクの力を見込んだ冒険者の少女や、陽気な神獣たちがやってきてーー追放された錬金術師の気ままな冒険ファンタジー、開幕！

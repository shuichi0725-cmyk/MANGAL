synopsis: 誰も知らない秘密の関係。親友の彼女と「秘密の予習」を始めてしまった——。キスも手を繋ぐのも、本命の彼女ときちんとするための準備のはずだった。悪いと分かっていても止まらない、思春期の衝動を描く背徳ラブコメ。
catch: 親友の彼女と始めた“ないしょの予習”——キスや手繋ぎ、すべては本当の彼女と上手くやるため。よくないと解っていても止まらないリビドー。曖昧で危うくて切ない、青く未熟な思春期の衝動を描く青春ストーリー。

  rakuten_caption: '私が望むのは、ただ平凡に生きて平凡に死ぬこと！

    聖女の力は絶対に隠し通します！


    朝、目が覚めたら前世の記憶を手にしていたエミリア。

    前世では聖女として活躍するも、仕えたブラック国家に酷使され、無残な最期を迎えていた。

    転生後は平穏なスローライフを送ることを目標に、聖女の力を隠して、地味に生きていくことを決意するも、魔法を使うところを王子・フィリップに見つかってしまい…!?'

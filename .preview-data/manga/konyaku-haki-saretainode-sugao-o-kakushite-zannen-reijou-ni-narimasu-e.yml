  rakuten_caption: '伯爵令嬢のセラフィーナには大嫌いな婚約者がいる。

    幼い頃からさんざん虐められ泣かされた侯爵令息のテディだ。

    「全力で嫌われて、婚約破棄されてみせる！」そう誓って

    顔も体型も偽装して”残念令嬢”として学園で過ごすセラフィーナだが、

    そんな彼女に目をつけた第二王子レオナルドが

    ある取引を持ちかけてきて……!?

    なりふり構わぬはっちゃけ才女と貴公子面した腹黒王子の

    ”秘密の取引”から始まる溺愛コメディ！'

    火炎窟の真の攻略を達成し、喜びを分かち合うのも束の間、ラーズ達が以前に攻略を行っていた第3迷宮で多数の黒い魔物が現れた事がわかりーー。

    迷宮へ調査に向かい行方不明となった無窮の翼のメンバー達の身を案じたラーズは、第3迷宮都市・ドライへと急行する。'

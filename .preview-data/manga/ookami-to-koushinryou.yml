synopsis: 荷馬車を引く馬だけを連れに、若き行商人クラフト・ロレンスは儲け話を求めて田舎道を旅していた。だがある夜、狼の耳と尻尾を持つ美しい娘の姿をした豊穣の神と出会う。故郷の北の地を恋しがる賢狼ホロを連れ、商いの流れを追うロレンス。二人は真実と嘘を見抜き、利を得られるのかというファンタジー・ロードムービー。

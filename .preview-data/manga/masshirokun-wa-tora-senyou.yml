  rakuten_caption: '大学1年のトラと真白は、幼少期からの幼馴染。

    実はトラは真白に長年片想いをしている。

    トラの面倒見の良さを知り尽くしている真白は、ウサギのように寂しがり屋で超絶甘えんぼ。トラの気持ちなんてつゆ知らず、今日もマイペースに甘えっぱなし。

    大学進学を機に2人で始めたルームシェア。長年想いを寄せていた相手との生活に理性がはち切れそうになったトラは、思わず真白に告白する。

    冗談だと思っていたトラからの本気の告白に、幼馴染としての「好き」と本当の「好き」の違いに気づけていない真白の脳内は大混乱。


    『片想いって、人を好きになるって、こんなに楽しくて、こんなにもつらい』


    甘えんぼなウサギ系男子と包容力抜群な甘やかしトラ系男子の、むずキュン甘々幼馴染ラブストーリー！


    ■収録内容


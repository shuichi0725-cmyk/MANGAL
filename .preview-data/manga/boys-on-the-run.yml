    description: 鈴木さんに誘われ、ボクシングの聖地である後楽園ホールへ足を運んだ田西。試合前から強面の観客に怯えていた彼だが、初めて本物の殴り合いを目にして、次第に拳へ力が入っていく。メインイベントのあとの予備試合まで見ることにした田西の前に現れたのは、ともにデビュー戦を迎える四回戦ボーイ。しかも一方は、見るからに頼りなさげなボーズ頭だった。ちはるをやり捨てた青山へぶん殴ると宣戦布告したものの、勝算はほとんどない。にわか仕込みのボクシングで、対抗できるのだろうか。

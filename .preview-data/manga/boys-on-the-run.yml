    description: 酔いも手伝ってちはるとラブホに入った田西。だが実は処女だった彼女に、何もできないまま朝を迎える。それでも二人は確実に親密になり、幸せを感じながらラブホを出た。ところがそこで、一週間前に出会った怪物女のまゆみとばったり鉢合わせる。ちはるの目の前で、同伴のヤクザからテレクラのことを問いつめられ、殴られてしまう。それでもちはるにキスをされた田西。次の月曜、風邪で会社を休んだ彼女の家へ、年賀状の住所だけを頼りに突撃見舞いを決行するのだが。

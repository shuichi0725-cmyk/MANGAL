    description: 金曜の夜、池袋のテレクラ。田西敏行は、会社の飲み会で憧れの植村ちはると話せた喜びに浸っていた。妄想の中でしか彼女と結ばれない現実を憂いながら電話を待つうち、二十七歳の誕生日を迎える。残り時間五分でようやくかかってきた女性と待ち合わせをするが、現れたのはとんでもない怪物女だった。妄想ばかりのダメ男に訪れた、一世一代の恋愛チャンス。飲み会をきっかけにメール交換も始まり、憧れの後輩との仲は徐々に進展していくのだが。

    description: いよいよ青山との決戦当日を迎える。相手の会社であるマンモスへ乗り込み本人と相対するが、息を震わせる田西に対して青山は余裕そのもの。それでも田西は、ちはるの考えた四十八手ちゃんの企画をマンモスが盗んだことを理由に、ケンカをさせてほしいと宣言する。侮辱と受け取ったマンモス側は、ケンカを買うことを青山への業務命令とした。かくして事態は、斎田対マンモスの代理戦争という様相を呈していく。ただ祈ろう、田西が勝つことを。そして死闘のすべてを見届けろ。

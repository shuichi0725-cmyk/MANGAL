    description: ちはるにフラれてから三か月。悶々とした週末、しほのいるソープへ足を運んだ田西は、彼女に彼氏ができたらしいと告げられショックを受ける。土曜はいつも朝帰り、毎晩の長電話、そして最近は電話のあとで泣いているという。その話だけでは相手を特定できなかったが、翌日街へ出た田西は、ちはると青山が並んで歩く光景を偶然目にしてしまう。二人が付き合っていたという衝撃。そして、ちはるが会社をクビになるという驚愕の事実。ダメ男の人生が、いま大きく動き出す。

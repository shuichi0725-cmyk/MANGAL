  rakuten_caption: 【やりたいこと、全部やる！！！】乗馬、美容診断、同人誌即売会、重量挙げーー。「人生で一度はやってみたいこと」に、つづ井さんが挑戦する初の全力体当たりレポコミックエッセイ！ 「骨折は絶対NG！ 漫画家ふたりで挑む乗馬体験。馬と心が通じ合った瞬間に……感動！」「“本当に似合うもの”って何？ パーソナルカラー＋骨格＋顔タイプ診断で、新たな自分を発見！」「初めての同人誌即売会に参加！
    読者との交流に、思わず涙ーー。」「自分って人より力持ちなのでは？ 筋トレBIG3にガチ挑戦！」 読むだけで元気が出て、「何か新しいことを始めてみたい！」とワクワクしてくる、笑いと愛にあふれたルポマンガ。　「生き方そのものも『アクティブキュート』なつづ井さん 次は流鏑馬（やぶさめ）しますか？」--漫画家・和山やま氏も参戦！！

synopsis: ごはんのおともになる一品料理を軸に、それぞれの人生を抱えた人々の物語を綴る、あたたかなフルカラーグルメ漫画。姉を亡くした男性や食いしん坊の少女など、料理とともに描かれる小さなしあわせの数々。レシピも収録。
catch: カレー味の豚そぼろ、牛肉とごぼうのしぐれ煮、ツナの冷や汁——あったかいごはんのおともが、人々のささやかな物語にそっと寄り添う。しあわせの笑みがこぼれる、レシピ付きフルカラーの心温まる食物語。

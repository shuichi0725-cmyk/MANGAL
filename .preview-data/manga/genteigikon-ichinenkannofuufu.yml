synopsis: 明日香の仕事は、1年間だけ依頼者の妻として結婚生活を送ること。昇進のためにと疑似結婚を申し込んだ聖は、仕事の悩みを抱えていた。彼に寄り添ううち、明日香は徐々に聖の心を開いていくように見えたが……。偽りの夫婦から始まる婚活譚。
catch: 明日香の仕事は、1年間だけ依頼者の妻を演じること。昇進のために疑似結婚を申し込んだ聖と、損得勘定で始まった夫婦生活。彼の心を少しずつ開いていく明日香だが——契約から芽生える感情を描く婚活ラブストーリー。

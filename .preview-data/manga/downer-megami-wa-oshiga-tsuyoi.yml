  rakuten_caption: '神への生贄になった代償は…ちょっとエッチな恋のお手伝いでした。


    神への生贄が盛んな異世界でアトラトリは、病と穢れを司る女神ウェウェトチトリの生贄と捧げられた。

    このまま死を待つのみ…と思いきや、女神からの積極的なセックスアピールでアトラトリは辟易していた!!?

    彼女がこうも積極的な理由…それは、恋の病をしるため!!! 病と穢れを司る神にも関わらず、恋を知らないウェウェトチトリは、生贄であるアトラトリに迫りまくって学ぼうとしてるのだ。


    こうして始まる、女神とのちょっと卑猥な恋のレッスン。果たして女神は恋を学ぶことができるのか!!!


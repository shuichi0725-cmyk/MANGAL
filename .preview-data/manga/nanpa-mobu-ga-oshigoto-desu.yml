catch: 声をかけてフラれるのが仕事のモブ男。担当ヒロインに恋をしてしまえば「闇落ち」として処分される世界で——。
synopsis: 物語にモブを派遣する世界で、B介はヒロインに声をかけフラれる「ナンパモブ」として働いている。ある日の仕事で、ヒロインの梨夏がまさかのデートを満喫してしまい、心が揺れはじめる。

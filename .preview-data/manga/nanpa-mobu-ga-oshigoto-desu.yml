  rakuten_caption: 'モブとして梨夏の背中を押してから数日ーー。

    未だ消化しきれない想いを抱えながらも、いつも通りの日常を過ごしていたB介だったが、

    ある日、現実世界で事故に巻き込まれて病院へ搬送されてしまう！

    目を覚ましたB介は、自身の状況を把握しようとするが、

    ーーなぜか隣に梨夏がいて…？


    物語のヒロインが現実世界に！？謎が深まる世界系青春ラブコメ第2弾！！'

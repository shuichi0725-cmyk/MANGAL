  rakuten_caption: '5年前に魔王を打ち破った勇者・レオンは再び復活した魔王を討伐すべく魔王城を訪れる。

    今度は危うくやられそうになってしまうが、お互い酒好きであることを知り盃を交わした。

    誰かと一緒に飲む酒の美味しさを知った魔王は魔王を辞めることを決めたが、辞めるには四魔侯の説得が必要で…。

    そこで魔王は、ついて来れば魔界各地の銘酒が飲める、と酒で勇者を釣り、四魔侯の説得に連れ出したのだった！

    いつか殺すと誓った間柄だが、今この一杯は楽しもう。

    お酒と肴の準備は万端！魔界の酒を巡る旅へ、いざ出立！'

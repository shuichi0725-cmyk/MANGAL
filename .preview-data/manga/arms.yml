    description: ARMS誕生の謎と赤木カツミの行方を追い、涼と仲間たちはアメリカへ渡って絞首台の鐘という街を訪れる。だが待ち構えていた猟犬部隊の急襲を受け、武士とユーゴーが捕虜となり、アルと兜刑事は行方が分からなくなる。彼らを捜す久留間恵の前に現れた日本人サラリーマンこそ、ARMS誕生の謎を知る人物だった。すべての始まりはアリゾナ州ギャローズ・ベルであり、5万年前に落下した隕石の破片アザゼルという金属生命の発見が、エグリゴリの創設とARMS計画へつながっていた。真相を知った涼たちがアザゼルと対面し、直属のシークレット・フォースであるイプシロンが襲いかかると、アザゼルが呼応してジャバウォックが覚醒する。

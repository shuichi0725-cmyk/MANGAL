  人との関わり合いを避け生きてきた高校生の湊、

  誰からも好かれそつなく生きてきたコンビニ店員、宝栄。

  コンビニ裏の駐車場で出会った二人は、休憩時間の時だけ

  会話を交わす程度の仲だった。

  仲良くなりたいと言う宝栄に対し苦手意識を持つ湊だったが、

  ある時大きな転機が訪れる。


  これは友情なのか、それとも…

  純粋で不器用で歪な関係が始まった。'

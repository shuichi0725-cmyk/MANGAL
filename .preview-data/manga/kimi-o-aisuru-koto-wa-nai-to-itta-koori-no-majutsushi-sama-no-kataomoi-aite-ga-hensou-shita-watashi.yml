synopsis: 家族に虐げられる伯爵令嬢フィーネには秘密があった。実は国一番の魔女として、人知れず二重生活を送っているのだ。政略で未来の公爵シオンと結婚するが、彼は「決して愛さない」と宣言する。だが彼が本当に想う相手は、魔女姿の自分だった。
catch: 国一番の魔女という秘密を抱える令嬢。政略結婚の相手は「決して愛さない」と宣言する氷の公爵。けれど彼が想う相手は——すれ違う溺愛ファンタジー。

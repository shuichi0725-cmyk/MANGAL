  rakuten_caption: 'シルト大公家の長女・エルーシアは予知夢の能力を持っていた。


    そんなある日、婚約者・ウベルと、家の金を使い潰して国外逃亡した継母と義娘の横領の罪を着せられる夢を見てしまう。

    しかも最後は長年対立していたシュヴェールト大公家当主・クラウスに殺されてしまうのだ...。


    あんな人たちのせいで死ぬなんてまっぴらだ！

    エルーシアは運命回避のため、家を離れようと決意する。


    そのためには自分と同じ大公家で未来の当主になる男・クラウスの元へ嫁ぐのが一

    番だと結婚を申し込むのだがーー。'

  rakuten_caption: "ドラえもんとノーベル賞に輝いた研究に迫る \n\n 毎年10月の発表に世界中が注目し、大きな話題となるノーベル賞。\n本書では、偉大な発明家アルフレッド・ノーベルがどんな人だったのか、なぜノーベル賞が誕生したのかから始まり、これまで賞に輝いた発明や研究が、私たちの暮らしにどのような影響を与え、社会に貢献しているのかを紹介します。\nノーベル賞には6つの部門がありますが、本書で主に取り上げるのは、物理学賞、化学賞、生理学・医学賞の3部門。それぞれの受賞者がどのように研究に取り組み、どんな発想から発明・発見を成し遂げたのかを詳しく解説します。\n\
    現代の暮らしに不可欠なスマホやネットの実用化には、「青色LED」「光ファイバー」（ともに物理学賞）、「リチウムイオン電池」（化学賞）が大きな役割を担いました。\n病気発見の検査には「X線」（物理学賞）や「CT」「MRI」（ともに生理学・医学賞）が欠かせません。新型コロナウイルスが流行したときは、「PCR法」（化学賞）による検査が大活躍しました。\n読者のお子さんたちには、研究者の言葉や発想をヒントに、身近な「どうして？」を大切にし、その答えを探し続け、大きな発見"

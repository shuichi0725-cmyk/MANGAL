  rakuten_caption: '大陸を震撼させた疫病が、終息して間もない16世紀ドイツ風ファンタジー世界。

    主人公・ミーナと相棒エーリヒの特派取材記事で大炎上を脱したヴェルバーデン新聞は、

    市長令嬢のスキャンダル報道をきっかけに、市当局の要請で伝統行事である春祭りのルーツを調査することに。

    しかも、三年ぶりに再開される次回の春祭りに合わせ、

    帝位の正当性を諸侯に疑われている現皇帝がヴェルバーデンに滞在することも判明して……。'

    description: 商家に押し込みながら金品には手をつけず去っていく、不可解な犯行を繰り返す一味が現れる。その手口は往年の大盗賊“百崎の馬之助”の所業をなぞったものだった。この「蘇る怪盗」のほか、盗まれた二千両と埋められた千両箱が交錯する「他人の金」、船宿の殺しの裏に隠し金をめぐる仲間割れがある「算段」、継母に疎まれた娘が盗賊の頭に連れて行ってくれと頼む「居場所」の全4篇。脚色を担当する大原久澄のインタビューも収める。
  - number: 123
    asin: null
    isbn13: '9784160092235'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2235/9784160092235_1_4.jpg?_ex=300x300
    release_date: '2024-12-17'
    description: 深川の岡場所から逃げ出した遊女・玉菊を、密偵の粂八が助けて船宿にかくまう。だが二人のあいだには、玉菊の父が粂八の密告で死罪となったという因縁があった。その「ひとでなし」を含む4編を収録。ほかに、旗本屋敷から拝領の茶碗と宝刀が消える「意趣返し」、押し込みの現場に皿が残される「お七供養」、平蔵の剣友が再会した真面目一筋の商人を描く「真面目な男」を収める。
  - number: 124
    asin: null
    isbn13: '9784160092242'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2242/9784160092242_1_4.jpg?_ex=300x300
    release_date: '2025-04-16'
    description: 板橋宿の居酒屋で評判の料理を味わっていた平蔵と忠吾が、味を盗まれたと騒ぐ客の争いに巻き込まれる「味泥棒」を含む4編を収録。ほかに、密偵の名を騙る盗賊が皆殺しを働く「偽の五郎蔵」、父の墓参りへ向かう東海道で妙な二人組と出会う「旅の空」、江戸城の御金蔵が正体不明の一味に狙われていると知らされる「忍び盗賊」前編を収める。
  - number: 125
    asin: null
    isbn13: '9784160092259'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2259/9784160092259_1_3.jpg?_ex=300x300
    release_date: '2025-08-21'
    description: 江戸城の御金蔵を狙う忍び盗賊の正体を探るうち、長州ゆかりの忍者の末裔が浮かび上がる「忍び盗賊」後編を含む4編を収録。ほかに、丑の刻参りの最中に般若の面をつけた盗賊集団を目撃してしまう「丑の刻参り」、上州の盗賊頭の跡を継いだ二代目が江戸を狙う「あまやどり」、粂八が昔の仲間を張り込むうち捕らわれる「背信」を収める。
  - number: 126
    asin: null
    isbn13: '9784160092266'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2266/9784160092266_1_6.jpg?_ex=300x300
    release_date: '2025-12-16'
    description: 大川岸の両替屋へ押し入った一味が屋形船を奪い、客を人質に逃走する「屋形船にて」を含む4編を収録。ほかに、長谷川邸の前で行き倒れた老人が記憶喪失を装っていた「盗賊仇討始末」、平蔵の剣友が辻斬りをしたという報せに理由を探す「友の涙」、引き込み役の盗人が新入りの料理人に死んだ息子の面影を見る「はち合わせ」を収める。
  - number: 127
    asin: null
    isbn13: '9784160092273'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2273/9784160092273_1_4.jpg?_ex=300x300
    release_date: '2026-04-16'
    description: 妹のお園が盗賊一味に捕らわれ、平蔵は頭目を捕縛するが相手は一切口を割らない。妹の命と引き換えに釈放を迫る狙いを描く「みつぼ」を含む4編を収録。ほかに、同心が右手を負傷し仲間の仇討ちを誓う「右手、使うべからず」、襲われた菓子舗で幼い姉弟だけが助かった理由を追う「雪うさぎ」、将棋好きの盗賊が名著の原書を狙う「盗人無双」を収める。
  - number: 128
    asin: null
    isbn13: '9784160092280'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/2280/9784160092280_1_2.jpg?_ex=300x300
    release_date: '2026-08-19'
    description: 火盗改方同心の木村忠吾は、ふとしたことから盗賊の猿の銀次と知り合う。根っからの悪人とは思えなかった忠吾は、銀次を自分の密偵にしたいと平蔵に願い出る。その「相棒」を含む4編を収録。ほかに、潮干狩りで知り合った波が、酒を酌み交わすうちに辰蔵のなかへ若き日の平蔵の面影を見る「面影」、旧友の井関録之助がまともな父親とは何かと平蔵に問い、数日後に若い娘と連れ立つ姿を目撃される「父になる」、呉服問屋の跡取り彦太郎が岡場所の娼婦およねに入れ揚げて五日も居続け、父の怒りを買って勘当される「居続け彦太郎」を収める。

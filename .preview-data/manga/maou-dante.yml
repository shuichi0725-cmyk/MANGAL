synopsis: 夢を通じて少年に取り憑いた大悪魔ダンテが、千年の眠りから目覚める。古代の忘れられた文明の生き残りであるその存在の意志は、人類の絶滅。だが悪魔の動機は思うほど邪悪ではなく、悪夢と狂気の狭間を揺れる少年の運命と絡み合っていくホラー。

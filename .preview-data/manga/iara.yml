synopsis: 奈良時代、村外れに暮らす若者・土麻呂と、下女のサナメは恋に落ちる。だが土麻呂は大仏造立の最中に投獄され、二人は引き裂かれる。後を追ったサナメは大仏造営を担う国中公麻呂の妻となるが、やがて土麻呂の前で熱い銅を注がれ「イアラ」と叫ぶ。時代を超えるミステリー。

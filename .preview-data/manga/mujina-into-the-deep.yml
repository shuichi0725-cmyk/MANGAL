synopsis: 近未来。人権はもはや保証されず、売買の対象となっていた。人権を持たぬ者は“ムジナ”と呼ばれ、何者でもない。彼らを守る法はないが、法が適用されないなら何をしても自由――その腕さえあれば。アクション。
catch: 人権が売買される近未来。何者でもない“ムジナ”を守る法はない。だが法が届かぬなら、何をしても自由だ——その腕さえあれば。硬派アクション開幕。

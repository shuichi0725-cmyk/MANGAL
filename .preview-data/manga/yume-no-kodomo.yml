synopsis: 高校生の高島陽司は、慕う姉と暮らしていた。だが姉はニューヨークで働くと言い出し、陽司が苦手な友人・秋島蓮のもとに彼を預けて去ってしまう。最初はぎくしゃくしていた二人だが、少しずつ距離が縮まり、陽司は自分の恋心に気づいていくラブストーリー。

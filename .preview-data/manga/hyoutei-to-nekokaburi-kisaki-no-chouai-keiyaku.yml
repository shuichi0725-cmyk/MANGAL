  rakuten_caption: '可憐な才女として名高い貴族の娘・璃璃は、念願叶って「氷帝」と称される新帝・星火の后に選ばれる。

    評判とは裏腹に実は玉の輿になるという野心を抱く璃璃は、星火の冷淡な態度にもめげずに接するものの、夜伽の際に口論となってしまう。

    そんな愛のない初夜を迎えた二人に対して、竜神が入れ替わりの呪いをかける。

    一刻も早く呪いを解こうとする二人だったが、その方法が「愛のある口づけ」と知りーー!?'

  rakuten_caption: 'それぞれが葛藤の末に未来への一歩を踏み出し、降り続いた雨が上がった本編の結末から5年後ーー。

    引きこもりニートだった蒼井、いじめに苦しんでいた桜、そして彼らを取り巻いていたユメと水無月。

    かつて傷つき、すれ違いながらも必死に自分の心と向き合った4人は、5年の歳月を経て大人へと成長していた。


    交際を続けながら同じ大学に通う桜とユメ。大学卒業を目前に、二人で過ごす時間が減ることに不安を感じるユメだったが、かつて自分のエゴにより桜を苦しめてしまった後悔から、どうしても本心を告げられずにいた。

    一方の蒼井は「自分の足できちんと歩ける大人」となるべく、地元の不動産会社で懸命に働く日々を送っていた。その間、水無月との連絡はメールだけ。水無月の気持ちは5年前のままなのか。自分の想いは変わっていないのか…不安が渦巻く中、5年越しに水無月を前にした蒼井はーー。'

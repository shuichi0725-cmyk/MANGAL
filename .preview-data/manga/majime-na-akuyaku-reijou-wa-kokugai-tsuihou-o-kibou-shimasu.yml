catch: 末路は公開処刑か国外追放の二択。自分が開発に携わった乙女ゲームの悪役令嬢に転生した女が、生存ルートを探す。
synopsis: 有紗は制作に携わった乙女ゲーム「天球のリーブラ」の世界に、悪役令嬢ディアナとして転生する。しかもシナリオは後輩に書き換えられ、開発者としての知識がまるで通用しない。

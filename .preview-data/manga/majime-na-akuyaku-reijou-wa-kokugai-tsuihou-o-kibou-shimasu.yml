  rakuten_caption: せっかく悪女のイメージを払拭できそうだったディアナに、またもやトラブル!!今度は第2王子襲撃事件の容疑者として逮捕状を出されてしまう。ピンチの彼女を救ったのは、本来は敵となるはずの護衛騎士や王子たちだった。断罪や処刑を避けるなら、彼らとは距離を置くべきなのに……。交流を深めていくうちに、ディアナの気持ちは少しずつ変化していってーー。乙女ゲーム開発スタッフの前世を持つ悪役令嬢が、バッドエンド回避を目指す異世界ファンタジー!

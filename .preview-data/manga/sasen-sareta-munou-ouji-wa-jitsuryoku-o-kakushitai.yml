synopsis: 大悪魔ナベリウスを仲間に加えたノアは、甥の誕生パーティーのため帝国を訪れる。皇子誘拐事件など数々の難題を、本人は無能のつもりの行動で次々解決し称賛される。実力を隠したい無能王子の痛快ファンタジー。
catch: 大悪魔ナベリウスを仲間に加えたノアは、甥の誕生パーティーで訪れた帝国でも誘拐事件など難題を“無能ムーヴ”で次々解決し、人々から厚く称えられてしまう。隠したいのに目立ってしまう――実力をひた隠す皇子の、痛快すれ違い異世界ファンタジー。

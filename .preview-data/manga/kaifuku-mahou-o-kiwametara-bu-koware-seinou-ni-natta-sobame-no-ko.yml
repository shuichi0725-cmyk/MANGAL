synopsis: かつて剣聖と呼ばれた男は、自由を望みながら使命に縛られたまま生涯を終えた。女神の導きで男爵家の妾の子レイナードとして転生した彼は、差別されつつも規格外の回復魔法で運命を切り拓く。

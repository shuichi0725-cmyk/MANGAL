  rakuten_caption: 'あぁ、この世界に私も住みたい。

    そして隈なく記して歩く学者たちの一人になりたい。

    ーー漆原友紀(『蟲師』『水平線のネラ』（ともに講談社刊）)


    時の薄絹をまとえば霧のなかを泳ぐ鯨になれる。

    クマグスさん、さようなら！

    ーー今福龍太(文化人類学者・批評家)


    ＝＝＝


    〈これは、昔々のお話かもしれませんし、遥か未来のお話かもしれません〉

    “現在“の地点から見ると、地上に人間は随分少なく、まだ世界に未知のものがある“かもしれない“という存在のゆらぎが漂っている時代。

    雨で布を編む民。貝のレコード。生きている電気。木地師たちの棲家。空から落ちた鯨。

    「時間」と呼ばれるそれらのゆらぎを、観察・調査・収集する研究者たちの民族誌（エスノグラフィー）。


    第30回手塚治虫文化賞[新生賞] 作家が描く幻想人類学。「オモコロ」連載時から大幅な加筆改稿を行った完全版。'

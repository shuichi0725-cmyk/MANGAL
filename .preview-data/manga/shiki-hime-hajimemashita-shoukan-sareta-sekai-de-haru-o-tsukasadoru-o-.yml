  rakuten_caption: 'アラサー女子、異世界で若返ってお姫様に!?

    派遣社員の遠野ハナ（34）は、仕事の契約満了を迎えて無職となった。気落ちしていたハナだったが、ひょんな事から異世界「フィアテルエ」に召喚されてしまう。四季を人の力で変えていくという世界、そこで彼女を待ち受けていたのは春を司る『姫』という役職だった。けれど、『姫』には自分に仕え、さらには結婚相手にもなりえる『騎士』が必要で…。すてきな世界であっても、家族も友達もいない異世界。ハナは元の世界に戻るため、『春姫』として奔走する！第二の人生を謳歌する、待望の第1巻！！'

synopsis: ある男が、停滞した実りなき人生の果てに孤独に死ぬ。だが物語はそこで終わらない。彼はウィリアムという少年として、魔法と幻想の地に生まれ変わる。死者の街で、ミイラと骸骨と幽霊の家族に育てられた彼は、前世を無駄にした記憶を胸に世界を巡る旅へ出る冒険ファンタジー。

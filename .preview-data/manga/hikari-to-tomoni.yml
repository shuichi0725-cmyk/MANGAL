synopsis: 日の出とともに生まれた東家の子は、「光」を意味する光と名づけられた。だがある日、母親は息子が他の子と少し違うことに気づく。我が子の自閉症という現実と向き合いながら、家族を守り、子を育てようと奮闘する母の姿を、温かくも切なく描くヒューマンドラマ。

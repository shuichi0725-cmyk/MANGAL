    description: 約二千三百年前、韓、魏、趙、齊、燕、秦、楚の七国が争う戦国時代の中国。趙の大軍が、燕の小城である梁城を落とそうと、国境の易水の川岸に軍を構えていた。梁城では城を守るため、城邑防衛のエキスパート集団である墨家から墨者を呼ぶ。しかしやって来たのは、革離ただ一人だった。一万五千の趙軍が到着するまであと一か月。革離はその短い間に城壁を修理し、武器をととのえ、農民を兵に鍛え上げるため、城内の全権を自分に与えろと城主の梁渓へ迫り、将軍たちの不快を買っていく。

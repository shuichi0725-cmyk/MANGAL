    description: 全面核戦争の危機を乗り越えた人類は、太陽系の開拓へと歩みを進めていた。月面基地に近い巨大クレーターで見つかった隕石の破片は鉱物資源の確保につながり、開拓の手は惑星群へ次々と広がっていく。やがて人類は太陽系の外、深宇宙をめざして踏み出す。旅の先で待っていたのは、異星に残された遙か太古の文明の痕跡、人類とは異なる進化の体系、そして星々の間を渡る種子の存在だった。驚異に満ちた探査行はさらに宇宙の奥へと向かい、センス・オブ・ワンダーに貫かれた宇宙SFはこの巻で幕を下ろす。

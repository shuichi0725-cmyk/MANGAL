  rakuten_caption: '世界で1人だけ時間停止に抗えるのが…俺！？


    不思議なストップウォッチで時間を止め、男の身体を貪る幼なじみ・時愛。

    その姿を目撃した俺は、なぜか時間停止に抗えてしまった！


    授業中でも外でもやりたい放題の時愛の姿に、俺の我慢も限界！

    そこで閃いた！時間停止のおこぼれにあずかれば俺だって…！？


    …欲望のままに、動かない美女たちを味わい尽くしてやる！'

  次なる目的地・根巣村。そこは、悪しき妖魔を「神」と崇め、生贄を捧げる異端の地だった!!村に巣食う指定封印妖魔を鎮圧するため、足を踏み入れた黒朗と布由。そして、今回から加わった仲間・絃の実力はーー!?因習を断ち斬り、未来を開け!'

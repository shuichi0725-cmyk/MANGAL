  rakuten_caption: '「死ぬまでそばにいてほしい」


    ーーこれは、治安の悪い近未来のお話。

    愛玩用の（元）高級ペット獣人ジュナは気に入らない客の検品から逃げた挙句に売れ残ってしまっていたが、

    《街》を牛耳るマフィアのボス・島津に購入されてしまう。


    毎日ケンカばかりなのに、ふたりの距離感は急接近ーー!?

    はじめてのお外デートやふたりっきりのナイトプールなど、危険いっぱい＆ラブ無限大のエピソードを収録。


    お疲れ気味の悪党島津×売れ残り獣人ジュナ。

    近未来SFラブコメ、最高クライマックス!!'

  rakuten_caption: 'あらすじ

    父親から虐待を受けて育ったコンビニ店員の亜美は、大きくなって父親を殺すことを夢見ていた。

    韓国からの不法移民フリーターの建設作業員の龍弥と出会い、2人でできる仕事、漫才師を目指すようになる。

    日本語が上手くない龍弥に、亜美がマシンガンのように喋り続ける漫才を練習する。

    舞台では受けない。

    亜美が久しぶりに酔っ払い認知症の父親の家に帰って、またも大喧嘩となる。

    計画は、睡眠薬で泥酔させた父親を海岸近くの砂浜に埋めてしまう笑い話のようなものだった。

    雨降る夜、2人は父親を泥酔させたのは良かったが、

    車椅子を押しているところを選挙カーが止まって乗せてやるとお節介の親切無理強いを受ける。

    選挙カーの立候補者が龍弥と瓜二つで、

    選挙活動のボランティアをしてくれと頼まれて後日選挙事務所に来るように言われる。

    海岸沿いで降ろしてもらい、2人計画通り砂浜に父親を埋めて捨て去る。

    次の日、龍弥が選挙事務所に行くと、

    立候補者が急遽腹痛で本日の立候補全員討論会に出られない状態だった。

    龍弥が身代わりに水質汚染の演説をする。

    父親は砂浜から出て来て、警察で質問されるが記憶がないと言う。亜美迎えに行'

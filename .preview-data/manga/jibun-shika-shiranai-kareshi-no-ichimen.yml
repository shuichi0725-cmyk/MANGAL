  rakuten_caption: '俺はすごく美人だ。

    品行方正で、誰にでも優しい完璧な優等生。

    入学早々ついたあだ名は「王子様」。

    俺はこんなに完璧なのに、負けている……この男に。


    ＝＝＝＝


    美人で完璧な学園の王子様の鐘森。

    いつも、何をしていても完璧な彼は恋人の前だけはデレデレで……!?

    これからも甘くて楽しい生活が続いていく、そう信じていた。


    しかし恋人の鹿野は、鐘森をかばって記憶を失ってしまう。

    もう一度あの日々を取り戻すために、鹿野は鐘森に「ふたりが付き合う前の話」をしてほしいとお願いするのだが……。


    記憶を失っても、この恋は変わらない……？

    ふたりの愛の行方はーー!?


    SNSで大人気の学園BL、描き下ろしを加えて堂々完結！'

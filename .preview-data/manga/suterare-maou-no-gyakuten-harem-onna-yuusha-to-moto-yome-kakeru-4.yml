  rakuten_caption: '「…してみる？勇者とキス」


    最強の魔王・ゼオン。ところが仕事に没頭するあまり、4人の妃たちが全員実家に帰ってしまう。

    しかもそんな時、女勇者・アレクシアが魔王城に襲撃してきて…！

    絶体絶命のピンチーーと思いきや、「弱った魔王を倒しても意味がないから」と、アレクシアが離婚の悩みを聞いてくれることに。

    別れ際の妃たちの様子を打ち明けるうちに…なぜか、アレクシアとキスの練習をすることになって…!?


    ゼオンを復縁させるため、魔王と女勇者の凸凹旅がいま始まるーー！'

synopsis: 34歳のブラック企業勤めの久保保は、ある日目覚めると見知らぬ世界で6歳の体に転生していた。生来の「結界師」スキルにも気づかぬまま奴隷市場で競売にかけられるが、誰も入札せず処分される寸前、辺境伯バサムに救われる。「リナス」の名で結界師として育てられることに——。
catch: ブラック企業勤めの34歳が、目覚めると異世界で6歳の身体に。結界師の才に気づかぬまま奴隷市場で処分寸前、辺境伯に救われる。第二の人生が動き出す。

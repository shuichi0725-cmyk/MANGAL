  rakuten_caption: '「あの男の元に嫁げないよう、姉様を傷物にしてあげますね」

    姉と義弟の一線を越えたヤンデレ溺愛ストーリー


    多くの異能者を輩出してきた天宮家の長女・茉白は、異能なしの「無能」として毎日のように母親からつらく当たられていた。そんな中、優秀な義弟の柊だけが孤独な茉白に懐き、唯一の支えとなっていた。将来は柊が跡を継ぎ幸せになってほしいと願っていたある日、未来の映像が断片的に見えるようになる。自分の異能が「未来予知」と気づいた茉白だったが、頻繁に「義弟に抱かれている自分」も見えるようになりーー!?



    発売記念 第1話ボイコミ化!!



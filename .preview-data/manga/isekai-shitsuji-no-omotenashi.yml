  rakuten_caption: "「帰宅」できる場所がないなら作れば良い！ \n\n 中河夢乃、会社員。\n残業続きの日々の中、コンセプトカフェに通うのが唯一の癒し。\n\nいつも通りカフェに「帰宅」しようとした道中で、異世界に転移してしまう。\nそこは様々なものが機械化された世界。\nもちろん接客も人ではなくロボットに置き換わっていた。\nつまり……コンセプトカフェは存在しない世界だった！\n\
    何もわからない異世界に飛ばされただけでなく、趣味まで奪われたことに絶望する夢乃。\nしかし、そんな時にカフェ経営に困る一人の青年と出会いーー!?\n\n「帰宅」できる場所がないなら、作れば良い！\n趣味に全力な人間と、異種族たちのドタバタラブコメ開幕!!"

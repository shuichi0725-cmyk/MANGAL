  rakuten_caption: '奴隷少年のアウルを襲うのは、止まない暴力と理不尽な日々。

    ボロボロの身体でうずくまっていた時、

    ある青年とふいに目が合う……。


    「この人に買われたいーー」

    衝動的にそう感じたアウルの手を取ったのは、

    青髪の冒険者・ハルクだった。


    ハルクやその仲間と楽しい日々を過ごすのもつかの間、

    とある「粉」を巡り、

    アウルに暴力を振るっていた女が目の前に現れて…!?'

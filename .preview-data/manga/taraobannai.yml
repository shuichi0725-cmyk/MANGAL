synopsis: 人気の日本映画シリーズを原作に、小池一夫と石ノ森章太郎が描く。多羅尾伴内は、七つの顔を使い分けて敵を出し抜く名探偵。本作では、年老いた伴内が、自らの後継者となるにふさわしい若者を切実に探し求める姿を描く。ミステリー。

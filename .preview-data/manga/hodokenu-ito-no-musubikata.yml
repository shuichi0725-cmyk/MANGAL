  rakuten_caption: 'これは“運命”に恋をした物語か、それとも“運命を超えて”恋を選ぶ物語か。

    “運命の番”よりも、自分の意思で選んだ恋愛が当たり前になった時代。彼氏全員に「めんどくさい」と振られてきたΩ・梓は、幼馴染のα・七瀬が自分の運命の番だと気づきながらも、「この恋は本能に操られているだけかもしれない」と想いを押し殺し、七瀬からの告白を断り続けてきた。

    しかし、七瀬が別の相手に告白されている現場を目撃した瞬間、梓は思わず彼を引き留めてしまう。運命か、本心かーー答えを出せないまま、二人の恋が大きく動き始める。'

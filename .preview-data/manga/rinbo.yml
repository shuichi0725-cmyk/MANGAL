  rakuten_caption: '誰にも好きにはさせない。わたしの心の傷も、あなたへの感情も??

    少女たちの想いが交錯するトラウマ×ダークファンタジー！


    「リンボ」--それは生者と死者の世界の狭間にある死の境界。


    オーロラは「魂の本質」を手に入れるために奔走するが、同じ目的を持つ天使・リーザがその邪魔をする。

    一方、オーロラの態度に疑心暗鬼になった親友のナディーンが彼女から距離を取る。

    二人の間に生まれた亀裂にオニリオが付け込んでしまった時、幼馴染みの魂を救えるのはオーロラのみ！

    しかし、「魂の本質」の本当の用途は……？

    天使はなぜそれを求めている？

    そこに衝撃的な事実がーー！'

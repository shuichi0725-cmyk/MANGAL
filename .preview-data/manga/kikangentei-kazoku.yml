  rakuten_caption: '「係長、俺と一緒に住みましょう」

    1ヶ月限定の擬似家族物語、ついに単行本化!!


    仕事はできるが人づきあいは不器用な会社員・古川。

    彼は姉夫婦の出張をきっかけに、甥っ子・湊を預かることになる。


    生意気盛りの湊に振り回され、古川は早くも限界寸前！

    そんな彼に救いの手を差し伸べたのは、社内でも人気の部下・新井だった。


    家事も育児も完璧にこなし、湊と古川の仲も取り持つ新井だがーー

    「いつでも遠慮なく惚れてくださいね」

    その言動はどう見ても部下の距離感じゃなくて…!?


    【溺愛スパダリ部下×恋愛下手な堅物上司】

    恋に育児に大忙しのドタバタ同居ラブ、開幕♡


    ＜収録作品＞

    期間限定家族 1〜5話


  rakuten_caption: "愛と欲と嘘が渦巻く、華麗なる一族の花嫁！ \n\n 「俺と結婚すれば、貴女は地獄から逃げられる。ただしーーー」\n蓮見千惺、天涯孤独だけど、大好きな仕事と優しい彼氏がいて幸せ…なはずだった。\nしかし現実は、誰にも気づいてもらえないDV、暴力ーーー身も心も傷つき果て、絶望した先に現れたその男は、花城院朱皇と名乗った。\n花城院という一族の当主を狙う朱皇は、千惺に偽装結婚を持ち掛ける。\nしかし、それにはとんでもない条件が付いていて…！？\n\nドラマ化多数のストーリーテラー、わたなべ志穂が放つラブ・サスペンス！ \n\n 【編集担当からのおすすめ情報】 \n 「王様に捧ぐ薬指」「18歳、新妻、不倫します。」など、メジャードラマ化作品を次々輩出してきたわたなべ先生が放つ、渾身の愛憎劇です！\nわたなべキャラの魅力を凝縮したような、ミステリアスなダークヒーロー・朱皇は言うまでなく、2つの顔を持つ謎の美少女・椿姫も今までにない神キャラ！\n千惺、朱皇、椿姫の訳アリすぎる3人が偽装家族となり、これまた訳アリまくりな策謀渦巻く花城院家で戦い抜けるのか…！？\nご期待ください！"

synopsis: '殺すほど愛すから、

  ーー覚悟しろ。


  幼き頃に罹った謎の病により足を患ってしまった王女ルナフィリア。

  家族から酷い冷遇を受ける日々だったが、16歳になったある日

  不自由な体が逆に都合が良いと、敵国の暴君に嫁がされることに。


  しかし失意のうちに敵国へ移送される道中、彼女の運命は一'
catch: 謎の病で足を患い家族から冷遇される王女ルナフィリア。不自由な体を理由に敵国の暴君へ嫁がされた彼女を待つのは、想像もしない運命の変転——ダークな宿命が交差するファンタジー恋愛譚。

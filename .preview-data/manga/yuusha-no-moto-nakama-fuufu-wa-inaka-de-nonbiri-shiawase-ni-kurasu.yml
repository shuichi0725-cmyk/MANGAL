  rakuten_caption: '魔王討伐を成し遂げ、王都に帰還した戦士ルードと魔法使いのフェリ。ふたりは旅路を振り返るなかでお互いの気持ちに気がつき結婚、そして国から賜った自然豊かな田舎の土地で一緒に暮らすことに！

    野山で遭遇した魔物も、何度も死線を潜り抜けてきたこの夫婦にかかれば豪華な食材に！？　料理に釣り、ログハウスの改装などやりたいことがいっぱい！

    しがらみから解放されたふたりの夫婦生活は、王都で暮らし始めた戦友の勇者フレミト夫婦たちからも羨ましがられるほどに充実しーー。

    戦いの旅を終えた戦士と魔法使いの、悠々自適なスローライフが始まるーー！'

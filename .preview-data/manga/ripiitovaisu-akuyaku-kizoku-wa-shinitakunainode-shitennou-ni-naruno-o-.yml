  rakuten_caption: 'この少年、破滅エンドは許さない。死の無限ループに抗い、最強英雄に！

    傲慢貴族・ローファスは、キレていた。なぜなら人気RPGが具現化した異世界で、己が”チンケな悪役貴族”としてパッとしない殺され方をされ続けたからだ。そんな無様な死に方は誇り高き貴族にふさわしくない。まだ12歳だが、年齢なんて関係ない。使えるものはすべて使い、悲惨な破滅エンドを回避するために動き出す！回避のついでに領民の重税を解消し、領地を荒らす魔物を倒し続けたら、ゲームでは発揮されなかった本来の力が目覚め始めて…!?なぜか領民に称賛されるがーー「勘違いするな、下民が。俺は俺のためにやっている」全身全霊で破滅フラグを叩き折っていく痛快無双英雄譚、開幕！巻末に描き下ろし漫画「とある一日の始まり」と、黒川陽継先生著
    書き下ろしSS「暗黒執事の夜営」を特別収録！'

  rakuten_caption: 'メイド服に惹かれる男子高校生・星野影介(ほしのえいすけ)。

    過去のトラウマから周りの目を恐れ、「メイド服が好き」という気持ちを誰にも言えない秘密として心に鍵をかけていた。


    しかし、抑えきれない衝動に突き動かされ、憧れ続けたメイド服専門店へ。

    緊張に震えながら、試着室で念願の服に袖を通した瞬間ーー。


    「お前を噛みたい」


    目の前に現れた男の背には、獰猛な「虎」の影が浮かび上がっていた。

    獰猛な「虎」と密かな欲望が交錯する、続々重版『お憑かれさま、黒瀬くん』（シュークリーム刊）の著者が圧倒的画力で描く妖異譚、開幕！'

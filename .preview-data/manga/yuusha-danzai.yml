  rakuten_caption: '魔族から人類を守る七勇者に憧れる少年フェイドは、

    七勇者と同じ祝福＜ギフト＞持ちであると

    鑑定の儀式で判明する。


    だが、フェイドの祝福＜ギフト＞は

    かつて世界を支配したことで

    危険視されている【闇の力】だった。


    すると、勇者は残虐な本性を現し、

    手始めにフェイドの両親を虐殺する。

    最後にフェイドも命を奪われそうになるが、

    憎しみによって覚醒した【闇の力】で逃げ延びる。


    四年後、復讐者となった少年による

    勇者の断罪が始まる＿＿＿。'

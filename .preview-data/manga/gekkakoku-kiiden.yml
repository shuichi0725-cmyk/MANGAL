synopsis: '宇煩王太子ファーラングの暗殺に失敗し深手を負った亡命南金人クラ 。

  そんな彼女の口から飛び出したのは、「シンは故国を滅ぼした南金王家の王子」だという衝撃の戯れ言。

  しかし、それは戯れ言でも妄言でも窮鼠の命乞いでもなく、シン自身の口から事実であると語られるのだった。

  景雲皇太子肝い'

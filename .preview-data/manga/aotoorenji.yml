synopsis: '美大卒業後、絵画教室を立ちあげた藍人。

  熱心で可愛い生徒に恵まれて「天職」と思っていたのだが、ある日突然、テナントビルのオーナーから建て替えのため立ち退きを迫られてしまう。

  途方に暮れる藍人の前に現れたのはタトゥー＆グラサンのワイルド・ガイ…彼の正体は!?

  本間アキラ、待望の新作'

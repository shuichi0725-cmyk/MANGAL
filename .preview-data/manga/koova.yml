  rakuten_caption: 'この大地は氷と、死と、理不尽に満ちている??

    神々に翻弄される予測不能の壮絶ファンタジー！


    「代々、賢者たちは我々に教えてきた。この世の均衡を保つ三柱の元素の神々がいると。

    風の神・アヴァント。火の神・ピリオ。氷の神・イルヴァ。

    しかし、四柱目の神の存在を我々に伝え忘れたようだ。

    それはーー海の神・コーヴァ」


    虐殺された同胞を助けられなかったアキは、セドナと力を合わせ、風の部族を大熊と小熊の脅威から救うことができた。

    しかし、コーヴァが姿を消した今、何かが神々の均衡を壊している。

    コーヴァの正体は？　「海の部族」は本当に存在するのか？

    確かなものはないが、アキはそれでも勇気を振り絞り、世界の真相を暴く覚悟を決める。'

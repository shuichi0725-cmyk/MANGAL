    description: 完璧な人工食料であるレーションで料理不要論を唱えるユーリ。それに対しドグマは、五感をテーマにした団体戦で勝負を挑む。しかし一回戦の聴覚対決は完敗、続く二回戦の視覚対決も応用の勝利かと思われたそのとき、雲居蜜郎が突如現れる。前代未聞の五感料理対決の行方はどうなるのか。この戦いを静観する立花の下した答えとは何なのか。半井とユーリの過去が明かされ、新キャラクターも登場するヒートアップの第八巻。

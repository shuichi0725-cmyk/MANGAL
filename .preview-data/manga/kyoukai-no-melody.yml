  rakuten_caption: '相方を事故で失い、音楽を止めたキョウスケのもとに、亡くなったはずのカイが現れる。

    二人は、3年前に出来なかったライブをやり直すことに。

    そこで、キョウスケが、そして二人を支えた“ファン一号”ユイが見た景色とはーー。

    新章・サムライアー編も開幕し、物語は新たなステージへ。

    人気グループとなったサムライアーは、「とある問題」を抱えていて……。

    宮田俊哉原作、TVアニメ化も決定の話題作を杉基イクラが圧倒的画力でコミカライズ。'

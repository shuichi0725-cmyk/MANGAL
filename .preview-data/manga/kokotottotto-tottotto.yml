  rakuten_caption: '博多で暮らす、かわいらしか兄弟の日常とちょびっと懐かしか風景

    博多の空気に包まれる新感覚の博多弁マンガ

    ※人気のウェブ連載、待望の書籍化

    ※幻の名作「博多っ子兄弟のゲナゲナ四齣典」、描き下ろし「博多ゲナゲナ事典」を特別収録


    哲学者ウィトゲンシュタインの「語の意味とは言語におけるその使用である」という洞察をヒントに、ことばを使う中でそのことばの意味が立ち現れてくる様子を、作者の故郷・博多（福岡市）のことばを通して表現した4コマ作品。博多弁話者でなくても、ことばの意味や面白さが自然と伝わってくる。



    ◎推薦のことば◎

    同じ「コトバ」でもそれが方言だと一気に血が通う。背景やら気温やら湿度まで一斉に立ち上がる。それが九州弁だとなおのこと。ノスタルジーと未来が四コマに詰まっとる。こりゃあんた、夜中の焼酎にピッタシバイ。今夜も酔うたー。

    　--光石研さん（俳優）


    弟いないのに。博多弁話せないのに。全編が私自身の思い出みたいだ。ロダンにシロ、内田かずひろ作品のお馴染みさんとも再会できて嬉しい一冊！

    　--大九明子さん（映画監督）


    福岡に引っ越してきた12歳の頃、最初は全く分からなかった方言が'

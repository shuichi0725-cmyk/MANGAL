  rakuten_caption: "犯罪者対犯罪者。戦隊型強盗スクワッド見参 \n\n 『双生遊戯』作者、待望の連載最新作！！\nとある都市、さびれかけた商店街に佇むクリーニング屋。その店頭に立つ若者たちにはある“副業”があった。それは犯罪者をターゲットにした強盗（タタキ）稼業で…！？\n社会の枠組から溢れた若者たちが、業の螺旋の先で掴むものとは。悪人跋扈する裏社会に駆ける、アウトキャスト・クライムアクション！！ \n\n 【編集担当からのおすすめ情報】 \n 現代日本社会に必ずや存在するであろうあらゆる犯罪者に、“もしかしたらいるかもしれない若者たち“が「タタキ」まくる！超絶作画で描かれる日常と非日常に揺れる、懲悪青春活劇！"

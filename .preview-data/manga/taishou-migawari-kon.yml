synopsis: 千波紡績の事件が解決し、嵩也と雪子にようやく穏やかな日々が訪れる。女優の友人に頼まれた雪子は雑誌の料理企画を手伝うことに。嵩也の母が亡くなって一年、二人は夫婦として家族のかたちに向き合い始める大正ロマンス。
catch: 事件を乗り越え、ようやく訪れた嵩也と雪子の穏やかな日々。亡き母の一周忌を機に、二人は夫婦として家族の形と改めて向き合っていく。大正の世を生きる、しっとりとした和風ロマンス。

  rakuten_caption: 'バスの事故に巻き込まれた事により、異世界へ転生することとなった主人公。

    そしてどうやら転生するにあたり、

    特殊な職業《クラス》を選ばせてくれるとのこと。


    さっそくクラスを選ぼうとしたのだが……、

    最高ランク『勇者』『大賢者』に並ぶクラスに、

    一際異彩を放つ…


    『ポーション師』　と言う、謎のクラスを発見する。


    他のクラスは『剣聖』とか色々あるのにひたすら戸惑う…。

    しかし、都会の喧騒に疲れていたので、のんびり暮らすのにちょうど良いかと思い、

    『ポーション師』を選択したのだが、

    ーーまぁこれがトンでもないぶっ壊れクラスで…!?


    異世界でどんなポーションでも創れる！ 最強幼女の異世界スローライフ(？)！'

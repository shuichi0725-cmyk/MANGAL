  rakuten_caption: '2045年の『厄災の日』--。

    突如、天より現れた謎の巨大生物が、東京、NY、LAといった主要都市を侵略。

    人類は『蟲』と呼称したその生物により、生息圏を脅かされ続けていったーー。


    それから10年の年月が経ち、人類は日々の侵攻に抗う術を手に入れていた。

    それは、『厄災の日』の孤児にバイオコンピューターの細胞を組み込むことで生まれた“人の兵器”である。

    『厄災の日』の孤児であり兵器化された雨宮準は『平和の守護神・プロメテウス』として、憎き『蟲』を駆逐し続ける！


    そして、『蟲』との種族闘争が激化していく中で、この大戦の深淵に触れていくーー!!'

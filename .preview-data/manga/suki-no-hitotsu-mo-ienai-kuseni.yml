  rakuten_caption: "漫画家業界×幼なじみの焦れキュンラブ！ \n\n 『じゃあアンタも今夜は俺を一番にしてくれる？』\n\n恋愛にいい思い出がなく恋に億劫な少女漫画家の莉子。ある日、担当編集者の結婚式の帰りに一人でバーに寄る。\n\
    恋愛運のなさを嘆いてヤケ酒をしていたところ、同じ結婚式帰りの男性と出会う。\nお互い「好きな人の一番になりたい」という気持ちが重なり、一夜をともにすることに…。\n\
    もう二度と会うことはない、と思っていたのにまさかの場所で再会！\nしかも彼は小学校時代の幼なじみの真田右京で…！？ \n\n 【編集担当からのおすすめ情報】\
    \ \n 著作累計1110万部突破！\n『恋はつづくよどこまでも』『はぴまり?Happy Marriage!?』の円城寺マキ最新作！\n漫画家業界×幼なじみラブコメ！\n\
    \n莉子の喜怒哀楽がかわいい！\n右京の不器用さが切ない…。\nリアル！？な漫画家業界にもワクワクすると大反響！\n2人の切ない不器用な初恋やり直しラブをお楽しみください♪"

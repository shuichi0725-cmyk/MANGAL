  rakuten_caption: 恋愛よりも仕事に夢中な日下部すずは、会社から希望退職を促され、仕事も住まいも失ってしまう。そんな時、幼なじみの上田玲の提案で同居することに。昔と変わらない距離感で接する玲。だがその裏で、20年間ずっとすずを想い続けていて…。同居初日、無防備なすずに触れられたことをきっかけに、玲の理性がプッツンと切れてしまう。「もっとぐちゃぐちゃにしたいって言ったら怒る？」抑え込んできた20年分の愛情が、ついに溢れ出すーー。

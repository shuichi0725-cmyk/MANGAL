  rakuten_caption: '覆面ボーカリストとして活動する高瀬路生

    通称「roar(ロウ)」は、過去のバンド活動中に起こったトラブルが原因となり、

    正体不明の孤高の存在として、たった独りで歌うことを心に決めていた。


    にもかかわらず、助っ人として参加したライブの映像が

    許可なく配信されてしまいロウの正体がバレてしまう。


    そんな折、路生の通う大学に現れたまるで素人とは思えない

    強烈な歌声を披露する男と出会う。


    その男の奏でる音楽を聴いているうちに、

    自然と一緒に歌ってしまった路生を見つけると

    見ず知らずのその男は、突然「お前を探していた」と追いかけてきてー…!?


    「お前の声に 抗えない」

    天才作曲家×覆面ボーカリストが送る

    激しく、重く、逃れられない執着愛！'

  rakuten_caption: 毒を浄化する不思議な花鈿ー花模様の痣ーを額に持つ黄明凛。ある日、前世の記憶を取り戻した彼女は、ここが愛読していた中華ファンタジー小説の世界であることを知る。小説だと近い将来「推し」の皇帝夫妻が皇太后に殺されてしまう…!明凜はモブ令嬢ながら阻止しようと動くが、皇帝・青永翔に花鈿の力を知られてしまい、皇帝の“寵姫”として秘密裏に“お毒見役”を務めることに。 図らずも皇帝を守りやすくはなったけど、いつまで経っても皇帝と皇后は出会う様子はないし、更には偽りの関係のはずの彼に本気で迫られてしまってーー!?

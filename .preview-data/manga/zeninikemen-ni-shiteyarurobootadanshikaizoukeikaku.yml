  rakuten_caption: '「廃部になるか、モテ男子になるか選べ」

    からくり研究部に所属する“美ゴリラ”こと希帆と、オタク男子三人衆の平和な（？）日々に非常事態が訪れる。見た目や行動がオタクすぎる事が原因で、1年後にイケメン化＋全国大会優勝できなければ廃部と告げられるのだった…！


    とはいえ三人衆の整ったパーツに律義な一面…磨けば光る原石に違いない！

    フィットネスの知識を駆使して、私があいつら全員をイケメンに変身させてやる！'

  rakuten_caption: '「俺は&quot;特別&quot;…なのか？」


    周囲の期待に応え、波風を立てずに体裁を気にして生きてきたサラリーマンの宏成。

    気づけば仕事ばかりの毎日で、恋愛だってまともにしたことがない。


    疲れ切ったある日の帰り道に立ち寄ったゲームセンターで、思い出のキャラクターのぬいぐるみを見つけた宏成は

    ぬいぐるみを取ろうとするが…失敗。

    諦めて帰ろうとしたその時ーー。


    見知らぬチャラい男が、いとも簡単にぬいぐるみをゲット。


    「はい、これ」

    「どうして…？ 」

    「メシでも付き合ってよ」


    軽い誘いだと思ったはずなのに、その出会いは思いもよらない一夜へと繋がっていくーー。

    恋を知らない男(28)×恋に臆病な男(34)


    恋愛不器用モンスター同士の大人の恋が始まる



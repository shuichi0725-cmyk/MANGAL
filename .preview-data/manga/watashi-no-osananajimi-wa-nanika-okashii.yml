  rakuten_caption: '嫌がらせを受けていた中学時代、幼馴染の壮に「助けない」と言われたことが原因で引きこもりになってしまった千紘。大人になった今、芸能人として人気絶頂中の壮と偶然再会する。そして千紘はなりゆきで付き人の仕事を始めることにーー。

    そんな中、千紘のもとに中学時代の同級生・瀬菜から連絡が!?　壮が瀬菜と二人で会っていることを知ってから、もやもやが止まらない千紘。気持ちを知っていながらからかってくる壮に傷ついた千紘は、勢いで壮にキスしてしまいーー!?'

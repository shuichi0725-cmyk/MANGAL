  rakuten_caption: '健気な幼皇妃が前向きに頑張る異世界ファンタジー！

    健気な幼皇妃が前向きに頑張る異世界ファンタジー！好きな人のお嫁さんになる夢をあきらめたシャノンは、幸せとは程遠い政略結婚を14歳という若さですることになった。しかしシャノンは大切な人たちのためならそんなこと大歓迎だと前向きに考える。むしろ…「なにもしないのに養ってもらえるなんて天職では!?」世話焼きな相棒の神獣をもふもふし、クールな殿下に（無自覚に）溺愛されながら、大切な人達のためにもシャノンの奮闘が始まる！SQEXノベルの人気作、待望のコミカライズ第1巻！'

  rakuten_caption: '欲望と絶望、快楽と苦痛、悲劇と喜劇、

    あらゆる混沌が渦巻く迷宮都市『灰色の隣人（グレイ・ネイバー）』。

    これはここに生きる誇り高き『深紅の姫騎士』と、

    彼女のために生きる『ヒモ男』の生き様を描いた物語ーー。


    『灰色の隣人』にやってきた聖護隊隊長・ヴィンセント。

    彼はかつてマシューが手をかけたギルドの鑑定士・ヴァネッサの兄だった。

    ヴァネッサ殺害の容疑をマシューにかけ、拷問まがいの尋問を続けるが確証は得られない。

    業を煮やしたヴィンセントは強引な手段に出ようとするが……。


    悪いなヴァネッサ。

    お兄ちゃんにもそっちに行ってもらうことになりそうだ。


    過去も現在も未来も、ヒモはいつでも姫騎士様のためにーーー。'

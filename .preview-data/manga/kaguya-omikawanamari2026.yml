  rakuten_caption: '影にて名を轟かせる名家・神門家。

    嫡男である彩葉とその従者・藤花悠星は共に日々を謳歌していた。

    しかしその日常は突然崩壊する。


    平安の世から続く“月の監視”

    その禁が何者かによって解かれてしまった。


    厄災がひと筋の流星となって襲い掛かり、そして戦いの火蓋は切って落とされる。

    それこそ、神門家を筆頭に貴族の末裔たちが“虚構”と偽り隠し続けてきた『竹取物語』の真の姿であった。


    不死の姫とは？富士山に隠された秘密とは？

    日本最古の物語『竹取物語』に隠された壮大な真実が今解き明かされる！'

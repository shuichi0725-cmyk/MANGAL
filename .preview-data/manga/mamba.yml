  rakuten_caption: 'オカルト絡みの特殊事案を請け負う「特殊業務委託機関マジカルステップ第19分室」。

    子供の姿のまま時が止まった女・時村潤（ときむらうるみ）と、元刑事の部下・鷹頭大祐（たかとうだいすけ）は、

    畏怖すべき超常の“何か”が引き起こす怪異を追い続けている。


    ＝＝＝


    足に人面瘡を宿し、痛みに苦しみながらも高額な除去費用に慄いて拒否した女性・松影(まつかげ)。

    さらに時村たちが遭遇した少年・隼詩(しゅんじ)の腕にも、同じ人面瘡が浮かび上がっていたーー。


    閉ざされた空間で苛まれる親子の姿。

    自身の役目を淡々と全うする時村。

    元警察官としての「正義」と、機関としての「意義」の狭間で葛藤する鷹頭。

    血の通った「家族」という絆は、いつしか逃げられない呪縛へと変貌していく。


    人間ドラマと怪異が交錯する、今最も目が離せないダーク・怪奇サスペンス！'

  rakuten_caption: '記憶を失い、さらに自分自身の体に常に違和感を感じて生きてきた青年〈ねじり〉。

    ある日、〈影〉と呼ばれる化け物に襲われ、生命の危機に陥った彼の前に突如不思議な少女〈ヨビ〉が現れる。

    「強制的に「管理」させていただきます」と、自らの血をねじりに注入するヨビ。

    するとねじりの体は内側から開かれ、異形と化してビームのように高温の液体を放出、見事に〈影〉を撃退する。

    ねじりの変化の原因が〈冬〉と呼ばれる巨大な生物であり、自分はそれを追いかけていると語るヨビ。

    唯一記憶に残る弟を探すため、ねじりはヨビと共に旅立つーー。'

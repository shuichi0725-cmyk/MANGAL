  rakuten_caption: '都会の片隅で女子高生・大西と無邪気に戯れている一匹の白猫。

    しかし大西は万引きの冤罪を着せられ、裏で糸を引くヤクザたちに売り飛ばされようとしていた。

    その事実を知った猫は静かな怒りを燃やし、大西を蝕む闇に純白の裁きを下す…！

    「お前は…一体…」

    その猫の名は、アイリス。'

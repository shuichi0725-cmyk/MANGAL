  rakuten_caption: '7年前、一族惨殺事件の犯人として自ら罪を認め、終身刑となった美しき少年・程謹熙（チョン・ジンシー）。

    事件を担当した刑事・梁遠風（リャン・ユエンフォン）は、その後も面会を重ねる中で、

    謹熙が人ならざる力を持つ“巫者（フシャ）”であることを知る。


    そして7年後、街を揺るがす不可解な怪異事件が発生。

    停職中の遠風は、その真相を追うため、謹熙を刑務所から連れ出すことにーー。


    7年もの間、誰にも言えない秘密を共有してきた二人は、再び事件の渦中へ足を踏み入れていく。


    正義と罪に揺れる刑事×異能を持つ美しき“殺人犯”。

    歪な共犯関係で結ばれた二人の、クライムサスペンスBL開幕！'

  rakuten_caption: '不器用な大人たちの、もどかしくも愛おしい再会ストーリー


    人気若手俳優・奥村は、高校の同窓会に参加するため地元に戻ってきていた。そこで再会した元恋人・古本に助けられ、胸がぎゅっと締め付けられる。何故なら今でも古本のことが好きだから…。不器用な自分をからかう声、繋いだ手のぬくもり、何年経っても古本を忘れることはできなかった。「なぁ…久しぶりにシようよ」つい口走ってしまった奥村に、古本は…？'

  rakuten_caption: '因縁のインモラル・ラブ


    絶世の美形・虚魂に一目惚れした画家・悠弥。

    ゴミ箱から拾ったおにぎりを食べたり、初対面のはずなのに親しげに抱きついてきたり、

    どこか常識から外れた彼に、悠弥は振り回されながらも惹かれていく。


    虚魂をもっと知りたくて絵のモデルを頼んだ悠弥に、虚魂が告げた願いはただひとつ。


    「私を食べてくれませんか？」


    セックスの誘いだと勘違いした悠弥は、虚魂との危うく甘い関係を始めるがーー

    その言葉には、切なく悲しい過去が隠されていた。


    室町時代ーー飢饉によって人肉食が横行する世で出会った、心優しい青年と悲しき妖怪。

    残酷な運命に引き裂かれた二人の想いは、時を超え、現代へと受け継がれていた。


    生まれ変わっても変わらない願いが紡ぐ、慈愛と倒錯の転生絵巻。'

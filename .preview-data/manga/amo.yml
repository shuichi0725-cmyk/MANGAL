  rakuten_caption: '【アモ】---人をじっと見つめる習性がある動物。


    戦争で故郷を離れた少女、身分違いの恋に悩む青年、生きるために殺生を行う男。

    時を越え、種族を問わず、アモは彼らの生き様をじっと見つめる。

    その瞳に映る人間の姿は滑稽か、それとも崇高かーー。


    アモを中心にオムニバス形式で描かれる、客観的な視点から人間の在り様を問うた、小池リクトの連載デビュー作。

    人間と異界のモノとの交流を描いた短編集『エイリアンと虫ハカセ　小池リクト作品集』も同時発売！'

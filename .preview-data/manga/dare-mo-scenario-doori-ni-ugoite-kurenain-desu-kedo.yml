  rakuten_caption: '学園一の変人カイル先輩、前世での推しキャラ無骨騎士のアルバートと出会い、

    いよいよゲーム『セブンスリアクト』のスタート地点に立ったレイル。

    そんな中、かつて魔物に襲われたレイルの脚の怪我は完治の可能性があることを知る。

    ファルクをつなぎ止めていたトラウマからの解放を手放しに喜べないレイルは、

    いよいよ自分がファルクへ向けている感情が恋であることを自覚させられる。

    しかし、みんなを死なせないシナリオ通りの正しい未来とファルクの幸せのために、

    レイルは芽生えたばかりの恋心を封印し、二人の思い出の森でファルクと決別する。


  rakuten_caption: "理不尽に酔った社会を酔拳で叩き醒ます！ \n\n 『殺し屋1』、『ホムンクルス』の山本英夫 最新作!!\n酒神に取り憑かれたサラリーマン、現る。\n\
    \n夜ごと悲鳴が響く飲み屋街。\n酒に飲まれた迷惑客に、常識なんて通じない。\n\n酔っ払いが支配する夜の街で、\n酒神の力を宿したサラリーマンが、\n迷惑客も、社会にはびこる理不尽も”酔拳”で叩き醒ます、\n\
    喜劇的残虐アクション♪ \n\n 【編集担当からのおすすめ情報】 \n 数々の怪作を生み出してきた、鬼才・山本英夫氏が新境地に挑む。\n氏の真髄である「狂気」を宿しながらも、これまでにない「可笑しさ」や「優しさ」が確かに息づいている。\n\
    狂気と安らぎ。緊迫と平穏。\n相反する感情が独自ブレンドされた『酔拳JAPAN』。\n\n学校でも、家庭でも、職場でも、理不尽を飲み込みながら今日を生きている”あなた”にこそ響く作品です。\n\
    ぜひ一度、手に取ってみてください。"

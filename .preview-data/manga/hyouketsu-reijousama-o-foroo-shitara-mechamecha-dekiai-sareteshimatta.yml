  rakuten_caption: "ついにアリシア様の○○解禁！？！？ \n\n 『アリシア・オズリンドは「氷結令嬢」』。\n人を人とも思わない厳しい言動から、貴族界の悪役と呼ばれている。\nそんな氷結令嬢の屋敷で働く少年・グレイは、\n彼女の優しさを見抜いたことで溺愛され、幸せな日常を過ごしていた。\nだが、アリシアの前に婚約者が現れたことで、平穏は一変しーー\n\n「好きでもない男と結婚しろって言うの！？」\n\
    \nアリシアの父親によって仕組まれた、強制的な婚約を前に、\n平民であるグレイは彼女を守ることができるのか！？\nクールで甘々なお嬢様の溺愛が止まらない異世界ラブコメ、第二幕!! \n\n 【編集担当からのおすすめ情報】 \n コミックス1巻が発売後即重版した、大人気異世界ラブコメの第2巻です。\n今巻では、コミックス限定で、アリシア様の○○を加筆しております。\nぜひチェックしてみてください。"

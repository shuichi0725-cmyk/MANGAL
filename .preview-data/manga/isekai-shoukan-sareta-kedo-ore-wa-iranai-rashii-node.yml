  rakuten_caption: '『小説家になろう』大人レーベルの大人気作品が、大人も子供もお姉さんも美少女も安心の全年齢向けでコミカライズ!!


    コンビニへの買い物の途中、前を歩いていた高校生たちの異世界召喚に巻き込まれてしまった大輝。勇者候補だという彼らに比べて使えないスキルしか持たない大輝は、不要と判断され王宮から放逐されてしまう。

    ある程度の生活資金はもらえたものの、この世界のことがさっぱりわからない。王宮のお偉いさんの助言に従い、まずは身の安全のために護衛を雇おうかと奴隷市場に来てみたら、そこで目を疑うほどの美少女が売りに出されていて…!!

    え…待って、買えるの？　あの子買えるの？　オークション？　待って待って　ちょっと財布の確…待っ…えぇいままよ!!


    異世界の物価や生活必要費用もわからぬまま、当面の生活資金として受け取った金貨をほぼつぎ込んでしまった大輝。

    金はない、知識もない、護衛も手に入ってない…大輝の明日はどっちだ!!


synopsis: 完璧でありたい高校生・犬窪ノアと、彼女に想いを寄せる後輩タマキ。ある日タマキはノアにある呪いをかけてしまい、ノアは性的な欲求を抑えられなくなり、タマキには男性器が生えてしまう。呪いを解くには二人が交わるしかなく——。ちょっとエッチなラブコメディ。
catch: 完璧でありたい高校生に、後輩がうっかり妙な呪いをかけてしまう。解くには二人が距離を縮めるしかなく――ちょっとエッチなラブコメディ。

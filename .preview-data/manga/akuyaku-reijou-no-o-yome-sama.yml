  rakuten_caption: '「食事って、その残飯の事？」

    王妃としての将来を約束されていた令嬢・カリナは、

    ある日突然、婚約破棄を言い渡される。

    彼女を流刑に処す王子の隣には、妹・アウロラの姿があった。


    魔物が棲むと噂される極北の地へ追放されたカリナ。

    不穏な音に誘われて踏み出した雪原で、一匹の獣を助ける。

    それが、運命を変える“つがい”との始まりだった。


    悪役令嬢×人外少女。追放から始まる、極寒の“共犯”ファンタジー！'

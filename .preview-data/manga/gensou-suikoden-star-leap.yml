  rakuten_caption: '母国は長年、戦の渦中。

    太陽暦422年。「蒼槍のシャプール」と呼ばれる主人公シャプールは、少年時代の念願を叶え将軍になるも、

    貧しい民が死んでゆくだけの自国の状況に傷つき、理想と現実の差に失望していた。

    しかし、ホウと名乗る無鉄砲な男と出会った瞬間から運命は変わりだし、

    仲間とともに新たな地へ希望を求めて動き出すーー！



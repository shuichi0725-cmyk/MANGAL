    description: まっすぐと言えばまっすぐ、馬鹿と言えばそうかもしれない17歳の瞬は、ふざけてはいない本気だと言い切る将棋指し。同い年でイケメン坊ちゃんの夏目と言い合い、辛辣な最年長23歳の迫にいじられ、一見温和な牧野にフォローされながら、ひたすら勝ちたいと願う日々を送る。将棋が好きか嫌いかと問われれば嫌いではないと答え、なりたいかと聞かれれば間違いなくなりたいと言ってしまうが、その理由はよく分からない。考えながら暴れ回る男たちの成長群像劇で、棋譜監修はプロ棋士の橋本崇載八段が務める。

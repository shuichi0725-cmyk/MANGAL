  rakuten_caption: '不死者になること、その意味ーー


    「私の身体はまだ元に戻っていないようだね」

    ひょんなことから『不死者』になってしまった少女・由紀子。


    事件に巻き込まれ一度死んでしまった由紀子だが、本人は至って冷静。

    それを憂う不死王の息子・山田不死男だが…なんだかいつもと様子が違う？


    破天荒な山田家との家族ぐるみの交流もはじまるなか、

    由紀子は自分の寿命を知りーー


    不死の少年少女が数々の死亡フラグにぶちあたる

    カニバリズム・コメディ第2巻！'

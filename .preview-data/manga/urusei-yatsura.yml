      description: 諸星あたるは、なぜかこの世の不幸を一身に集めてしまう、見るからに凶相の青年。ある日、UFOに乗って地球へやってきた鬼娘ラムの、鬼ごっこの相手に選ばれてしまう。この一件をきっかけに、あたるの運命はさらなる不幸と珍騒動へと突入していく。押しかけ女房となったラムをはじめ、同級生のしのぶ、旅の僧チェリー、巫女のサクラらを巻き込みながら繰り広げられる、奇想天外なSFコメディの幕開け。
    - number: 2
      asin: null
      isbn13: '9784091207173'

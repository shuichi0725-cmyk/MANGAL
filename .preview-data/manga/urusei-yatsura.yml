      release_date: '2006-11-17'
      description: 世界でもまれに見る浮気症の諸星あたる。「ダーリンとうちは夫婦だっちゃ」と迫るラムの激しい電撃攻撃を浴びながら、それでも今日も恋人しのぶとの密会に命をかける。美しい雪女のお雪や、セクシーな天狗の娘クラマ姫にまで果敢に言い寄っていくあたるの本能が、さらなる災いと珍事件を次々に巻き起こしていく。
    - number: 3
      asin: null
      isbn13: '9784091207180'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120718.jpg?_ex=300x300
      release_date: '2006-12-16'
      description: どんな災いが降りかかろうとも、女を追いかけることだけはやめない諸星あたる。時空を超えてまで発揮されるそのスケベ心は、ついに歴史さえ塗り替えてしまう。そしてこの巻では、財閥の御曹司にしてあたる最強のライバル・面堂終太郎がついに登場する。常識を超えたスペクタクルな珍事件が続発し、宇宙規模のアホらしい笑いが巻き起こる。
    - number: 4
      asin: null
      isbn13: '9784091207197'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120719.jpg?_ex=300x300

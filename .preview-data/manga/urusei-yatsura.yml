      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120739.jpg?_ex=300x300
      release_date: '2007-02-16'
      description: ある日、諸星家に奇妙な郵便物が届く。それはラムのいとこ、テンだった。自称プレイボーイの小さな紳士は、口から炎を噴きながら友引町で暴れ回る。新たな天敵の出現に、あたるは打ち勝つことができるのか。うる星からの強烈なキャラクターがまた一人加わり、騒動はさらに熱を帯びていく。
    - number: 8
      asin: null
      isbn13: '9784091207401'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120740.jpg?_ex=300x300
      release_date: '2007-02-16'
      description: 浮気をしてこそ諸星あたる。ラムの愛情いっぱいの電撃を浴びながら、女と見れば人でも猫でも条件反射で口説いていく。物語は遥かみやびな平安時代へも舞台を移し、炸裂するギャグと日本古来の文化が見事に融合する。常識が通じないのが彼らの常識、珍キャラと珍事件がまだまだ続いていく。
    - number: 9
      asin: null
      isbn13: '9784091207562'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120756.jpg?_ex=300x300
      release_date: '2007-03-16'
      description: 友引町をひそかに賑わせる、とんでもない噂。なんと「ラムが見合いをするらしい」というのだ。平静を装いつつも戸惑いを隠せないあたる。その気持ちを知ってか知らずか、わくわくと浮かれ気分のラム。ついにあたるは、ラムを追いかけて地球を飛び出していく。二人の行く末に待ち受けるものとは。
    - number: 10
      asin: null
      isbn13: '9784091207579'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120757.jpg?_ex=300x300
      release_date: '2007-03-16'
      description: そこに女の子がいるから口説く——本能で生きる男あたるに、理屈は通用しない。しかし、そんなあたるにまたも新たな災難が降りかかる。雨を呼ぶ妖怪アメフラシに、海辺の幽霊、コウモリと、次元を超えた面々が押し寄せ、さすがのあたるも降参寸前。爆裂ギャグが超連発で繰り広げられる。
    - number: 11
      asin: null

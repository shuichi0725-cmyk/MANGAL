      description: 黒子に引かれてぎしぎしと揺れる牛車の中から、白昼堂々あらわれたガイコツ顔の女妖怪。あたるも仰天し、その噂は瞬く間に学校中へ広まって騒然となる。なぜか心当たりがありそうなのは、終太郎。この不気味な女妖怪の正体とは何なのか。その正体を前に、あたるのいつもの病気がまた暴れ出す。
    - number: 13

      release_date: '2007-04-18'
      description: あらゆる不運を呼び寄せるあたるのせいで、いつも珍事件でにぎわう友引町に、なぜか幸運が訪れる。太宰府のお守りからは菅原道真が飛び出し、空からは八百万の神々が舞い降りる。そしてすさまじい怨念を胸に、古き良き日本の冬を後世に伝えるべく、究極の癒やし系こたつキャラがついに初登場する。
    - number: 12

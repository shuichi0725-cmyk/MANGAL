      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120774.jpg?_ex=300x300
      release_date: '2007-07-18'
      description: 面堂終太郎の隠された過去が、ついに明かされる。暗所恐怖症と閉所恐怖症、その二大恐怖症の渦に終太郎を陥れた恐ろしい現実とは何だったのか。同情か、友情か、それともただの興味本位か——終太郎の病を治すため、あたるたちは幼き日の終太郎のもとへと旅立つ。終太郎の心に秘められた闇に、ついにメスが入る。
    - number: 18
      asin: null
      isbn13: '9784091207753'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120775.jpg?_ex=300x300
      release_date: '2007-07-18'
      description: 校長の肝いりで、ミス友引コンテストが開催される。友引高校を代表する美しい女生徒たちが、美貌に知性、健全な精神、さらには力と技までを競い合う、華麗なる美の祭典。ミス友引の座に輝くのは誰なのか。学校始まって以来という豪華賞品を懸けて、白熱の戦いが体育館を震撼させる。
    - number: 19
      asin: null
      isbn13: '9784091207760'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120776.jpg?_ex=300x300
      release_date: '2007-08-10'
      description: 真夏の海は、妖怪退治に来た錯乱坊や、浜茶屋の再建を目指す藤波親子でにぎわう。一方、水着の女子にしか興味のないあたると面堂は、海底をさまよう美しい人妻を見つける。子どもを捜しているというその女性は、竜之介を見るなり「あたしの子」とつぶやく。そして浜辺に「真砂子」と呼ぶ声が響き、竜之介は。
    - number: 20
      asin: null
      isbn13: '9784091207777'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120777.jpg?_ex=300x300
      release_date: '2007-08-10'
      description: 諸星家の朝は、あたるとテンの大ゲンカで幕を開ける。炎を噴き続けるテンに、フライパンや鍋のフタで応戦するあたる。だがトドメにと投げた電気釜は、テンの後ろにいたラムの頭を直撃してしまう。予想外の出来事にうろたえるあたるとテンに向かって、ラムが放った言葉とは。
    - number: 21
      asin: null
      isbn13: '9784091207784'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120778.jpg?_ex=300x300
      release_date: '2007-09-18'
      description: ラムがまたも怪しげな生物を地球へ持ち込む。かくし芸に失敗した者を次々と消し去っていくその生物の登場で、友引高校は恐怖に震える。さらに、氷に覆われた惑星・海王星の女王おユキの怒りに触れたランの運命も危うい。氷の刃がラン、そしてラムや弁天へと襲いかかっていく。
    - number: 22
      asin: null
      isbn13: '9784091207791'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120779.jpg?_ex=300x300
      release_date: '2007-09-18'
      description: 財閥の御曹司・終太郎の身に、突然の見合い話が持ち上がる。しかも相手は、兄の飛麿すら存在を知らなかった水乃小路家の娘・飛鳥。鉄の甲冑に身を包み、百メートルを十二秒で走破する謎の乙女に、終太郎は震え上がる。ただ一人、甲冑の中身に興味津々のあたるだけが、果敢に「鉄の女」へと挑んでいく。
    - number: 23
      asin: null
      isbn13: '9784091207807'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120780.jpg?_ex=300x300
      release_date: '2007-10-18'
      description: 友引高校の女生徒に絡む不良たちを、ラムが電撃で一発で叩きのめす。「勇気さえあれば不良になんか負けないっちゃ」と女生徒を励ましてしまったばかりに、今度は電撃を使わずに不良たちと決闘する羽目になる。相手は、力も外見も人間離れした仏滅高校の総番。ラムに、これまでで最大のピンチが訪れる。
    - number: 24
      asin: null
      isbn13: '9784091207845'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120784.jpg?_ex=300x300
      release_date: '2007-10-18'
      description: 一向に治らない飛鳥の男性恐怖症に、見かねた母親がついに強硬手段に出る。飛鳥が唯一怖がらない男・終太郎とデートをさせ、成功すればそのまま婚約という計画だった。しかし、女を口説くためなら苦労を厭わないあたるや、兄への嫌がらせを生きがいにする了子までもが加わり、平和なはずのデートは大惨事へと転がっていく。
    - number: 25
      asin: null
      isbn13: '9784091207852'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120785.jpg?_ex=300x300
      release_date: '2007-11-16'
      description: 食べると望みどおりの夢が見られるという“夢の実”に、自分の願いをたっぷり込めて育てたラム。ところが、それを不眠症に悩むサクラが食べてしまう。出会い、交際、結婚と三夜連続で繰り広げられる、ラムが思い描く理想のダーリンとの恋物語。あまりに理想化されたダーリン像に、サクラもたじたじになっていく。
    - number: 26
      asin: null
      isbn13: '9784091207869'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120786.jpg?_ex=300x300
      release_date: '2007-11-16'
      description: ケンカっ早い福の神・弁天と、そんじょそこらの男より男らしい少女・竜之介。この二人が、どちらが女らしいかをめぐって大バトルを繰り広げる。腕力で決着をつけようとする二人に、あたるは女性としての美徳を競わせようとするが。気づけば校長主催の心理劇まで始まり、全校生徒を巻き込む一大イベントへと発展していく。
    - number: 27
      asin: null
      isbn13: '9784091207876'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120787.jpg?_ex=300x300
      release_date: '2007-12-15'
      description: 貧しい男が、たんぽぽの綿帽子で娘に立派な花嫁衣装を着せてやったという昔話。それを聞いた一匹のキツネが、大好きなしのぶを嫁にしようと友引町へやってくる。人間の娘に恋をした一途なキツネの求婚が、友引町にまた新たな騒動を呼び込んでいく。
    - number: 28
      asin: null
      isbn13: '9784091207883'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120788.jpg?_ex=300x300
      release_date: '2007-12-15'
      description: シューマイは一人三個、玉子スープはおかわりなし——そんな質素な諸星家の食卓に、天井を突き破って降りてきたのは、願いを叶えてくれる七夕の“願い星”だった。今年のラッキーな貧乏人に選ばれた諸星一家。だが、叶えてもらえる願いはたったの三つだけ。この降ってわいた幸運を、あたるたちは活かすことができるのか。
    - number: 29
      asin: null
      isbn13: '9784091207890'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120789.jpg?_ex=300x300
      release_date: '2008-01-18'
      description: 久しぶりにあたるとデートをすることになったラム。ところが待ち合わせ場所に、奇妙な少年が現れる。ヒョウ柄のパンツ一丁でゾウにまたがったその少年は、ラムを見るなり勝手に恋の始まりだと盛り上がる。遅れてきたあたるを置き去りにして、ラムは誘われるまま少年についていってしまう。
    - number: 30
      asin: null
      isbn13: '9784091207906'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120790.jpg?_ex=300x300
      release_date: '2008-01-18'
      description: 元旦、面堂終太郎宛てに届いた一通の年賀状。そこには「おまえのひみつをしっている」とだけ記されていた。差出人は不明で、手がかりは筆跡のみ。後ろ暗い秘密などないと思いつつも、終太郎は書き初めの宴を開くことを決める。事情を知らないあたるや男子生徒たちが招待状で集められ、犯人捜しが始まっていく。
    - number: 31
      asin: null
      isbn13: '9784091207982'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120798.jpg?_ex=300x300
      release_date: '2008-02-18'
      description: 謎のウサギ男・因幡が落としていった“運命の鍵”によって、亜空間に迷い込んでしまったラム、あたる、しのぶの三人。そこで彼らが目にしたのは、自分たちの未来の姿だった。しかもそれは、理想とはかけ離れた暗いものだった。ショックを受けた三人は、理想の未来を求めて、時空をめぐる旅へと出発する。
    - number: 32
      asin: null
      isbn13: '9784091207999'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120799.jpg?_ex=300x300
      release_date: '2008-02-18'
      description: 筋金入りの男性恐怖症である飛鳥が通うのは、日本一の対男性警備システムを誇る潔癖女子中学。犬のオスさえ侵入できない完璧な男子禁制のその学校は、飛鳥にとって楽園のような場所だった。ところが、イベント好きの友引高校校長がとんでもない企画を思いついたことで、潔癖女子中学に開校以来の危機が訪れる。
    - number: 33
      asin: null
      isbn13: '9784091208002'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120800.jpg?_ex=300x300
      release_date: '2008-03-18'
      description: ウサギ男の因幡が、運命製造管理局の昇級試験に挑む。課題は、時空の森に咲く一輪の花を摘んでくること。ただし、必ず女性を同伴しなければならない。因幡がパートナーに選んだのは、しのぶだった。合格者は五十年前に一人出たきりという難題に挑む二人のもとへ、あたるとラムまで乱入してくる。
    - number: 34
      asin: null
      isbn13: '9784091208071'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120807.jpg?_ex=300x300
      release_date: '2008-03-18'
      description: 友引高校に、ラムの許嫁を名乗る謎の男が突然現れる。ブタの馬車をひき黒衣をまとったその男は、太陽のない闇の宇宙へとラムを連れ去ってしまう。ラムを取り戻す方法はただ一つ、あたるが一言「好きだ」と言うこと。それだけでラムは戻ってくるのだが——。ラムとあたるの長い長い“鬼ごっこ”が、地球の命運を懸けてついに決着を迎える、完結巻。

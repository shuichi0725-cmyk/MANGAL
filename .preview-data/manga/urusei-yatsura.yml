      description: 存在そのものが災いではないかと思えるほど、この世のあらゆる不運を呼び寄せてしまう諸星あたる。酒乱のキツネにバク使い、悪魔と、次々に現れる珍生物があたるに襲いかかる。そんなあたるが、とうとうラムとデートをすることになる。受難の星を背負った彼にも、ほんの少しだけ幸せが訪れるはずだったのだが。
    - number: 5
      asin: null
      isbn13: '9784091207203'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120720.jpg?_ex=300x300
      release_date: '2007-01-18'
      description: ラムの電撃にも懲りず、女を追い回す世界一の浮気者・諸星あたる。巫女のサクラが友引高校の保健医として新たに加わり、あたるの浮気心をくすぐって、学校はかつてない災難に見舞われる。さらに新キャラクター・水乃小路飛麿の出現によって、騒動はますますアホらしく加速していく。
    - number: 6
      asin: null
      isbn13: '9784091207388'
      cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/0912/09120738.jpg?_ex=300x300
      release_date: '2007-01-18'
      description: あたるにとって唯一ほっとできる場所だったはずの友引高校に、いよいよラムが通い始める。ただでさえ収拾のつかないところへ、ラムの母親や面堂の母上まで現れ、学校は今日もパニックに包まれる。さらにラムの幼なじみで、過激なフリルをまとった美少女ランも初登場し、あたるの運命はいっそう波乱含みになっていく。
    - number: 7
      asin: null

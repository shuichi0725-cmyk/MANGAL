  rakuten_caption: '訳あり一匹狼メロダーリン×ピュアな泣き虫ワンコ大学生。真夏の田舎でゆきずりの恋延長戦。


    素直でピュアなわんこ系大学生・太一は、とある理由から路地裏で泣いているところをクールな美丈夫・ミズキに拾われる。

    ぶっきらぼうに見えて優しい態度に惹かれ、もう少し一緒にいたいと思ってしまった。

    人恋しさから抱いて欲しいとねだり、忘れられない夜を過ごしたあの日ーー。


    後日また会いたくてミズキを探すも、再会できず夏休みを迎えた太一。

    田舎の祖母の家に帰省したら、お寺の息子として彼が現れて!?


    「盆の間だけなら、かまってやらんでもない」

    いたずらっぽくからかわれて、彼を知るたび気持ちはあふれる一方。

    むせ返るような暑さのなか、視線が絡まり火照った肌が近づいて…


    訳あり一匹狼メロダーリン×ピュアな泣き虫ワンコ大学生の、ひと夏で終われない恋。'

synopsis: 母の死後、黒高木は父が経営する四辻学園へ転校する。だがそこは「日没後の校内立ち入り禁止」という奇妙な掟を持つ普通でない学校だった。掟を破った黒たちはゾンビと化した教師に襲われ、やがて黒は己に流れる血の秘密と隠された力に気づいていく、ダークなアクションホラー。

  rakuten_caption: '士郎正宗が1989年に連載を開始したSF作品の金字塔『攻殻機動隊 THE GHOST IN THE SHELL』の同日譚が始まる。

    2029年4月。草薙素子や荒巻が公安9課を設立しようとしていた時、アメリカで数々の事件が発生。

    FBIやAI研究者、そして軍が事件を追う中で、ある戦いを目撃する。

    人類の命運を担うソロモン級AI VS.プロジェクト2501、通称“人形使い”。

    本作は、士郎正宗自らが脚本やキャラクターデザインを担当し、『不死身の特攻兵 生キトシ生ケル者タチヘ』（原作：鴻上尚史）、『警視庁草紙 -風太郎明治劇場ー』（原作：山田風太郎）の漫画家・東直輝が作画を担当した『攻殻機動隊 THE GHOST IN THE SHELL』とリンクする新時代のサイバーパンクアクション!!'

  rakuten_caption: '大学生の百生の家に届いた大きな箱。

    そこに収められていたのは、百生が長年片想いをしている

    幼馴染・千歳そっくりのアンドロイドだった。


    人に尽くす為につくられた彼は、百生が「千歳にしてほしかったこと」を

    昼も夜も惜しみなく与えてくれる。

    誰にも言えなかった密かな願望まで、千歳と同じ顔で叶えてくれるが…


    満たされるほど、本物の千歳への想いは募るばかりでーー。

    2人の“千歳”に翻弄される近未来トライアングルラブ♡



  rakuten_caption: "騎士×魔女×幼馴染み三角ラブファンタジー \n\n 魔女は、媚薬を操る恋のエキスパートのはずなのに…\nどうして自分の恋の答えは、見つけられないのーー\n\n香りで魔力を読み取る魔女・レイラが営む魔法薬店「パルファン・マジック」。 \n表向きは普通の薬屋を営みながら、店の奥に用意する様々な効能の媚薬は、恋に悩む貴婦人からひっそりと人気を得ていた。\nある日、騎士団長・ディオンは違法魔法薬の調査のため、レイラの店を訪れ、騒動の中で媚薬を浴びてしまう。\
    \ \n相手に少なからず好意がなければ媚薬は効かないはずなのに…\n出会ったばかりのレイラに、ディオンの理性は烈しく揺らいでーー\n\n香りが導いた出逢いは、レイラの運命を大きく変えていくーー!"

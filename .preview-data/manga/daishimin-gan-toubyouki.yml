synopsis: 健康に人一倍気を配ってきた孤高の小説家・山形鐘一郎が、まさかの大腸がんに見舞われる。手術の結果はステージ3。術後の抗がん剤投与を勧められるが、副作用で仕事ができなくなる事態を想定し、葛藤しながら治療と向き合う闘病記。
catch: 健康には人一倍気を配ってきた孤高の小説家・山形鐘一郎を襲ったのは、まさかの大腸がん。手術の結果はステージ3、抗がん剤と仕事の狭間で揺れる日々——病と向き合う人間の心情を率直に描く、闘病エッセイ漫画。

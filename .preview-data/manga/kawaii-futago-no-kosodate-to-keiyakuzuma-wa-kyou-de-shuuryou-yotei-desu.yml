  rakuten_caption: '名門魔術家の次男であるフェリオと契約結婚した貧乏令嬢メリッサ。

    「君はいずれこの家を継ぐ双子の世話さえしてくれれば、好きにしていい」

    そう告げたフェリオは、結婚後すぐに戦場へ。

    手紙を送っても返事はなく、夫婦らしい時間もないまま3年が過ぎてしまう。

    それでも、可愛い双子のルードとリアを我が子のように育てる日々は、メリッサにとってかけがえのないものになっていた。


    「いよいよフェリオ様が帰ってくる。今日で契約終了ね…。」


    英雄となったフェリオの帰還は、メリッサにとって双子との別れを意味していた。

    涙をこらえるメリッサの前に、甘く名前を呼ぶフェリオが現れてーー？

    契約結婚の終わりは、幸せな家族の始まり？

    契約妻と不器用な旦那様、そして愛らしい双子が紡ぐ、甘くて温かな子育てロマンスファンタジー開幕！


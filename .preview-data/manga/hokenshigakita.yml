synopsis: 「夜明けの図書館」の作者が描く保健師漫画。新人の行政保健師・三御一花は、乳幼児から高齢者まで地域住民を対象に、医療や社会福祉の活動に取り組む。実地指導者の七海さやかは元ヤンキーらしいが、そのアドバイスはいつも的確だ。
catch: 「夜明けの図書館」の作者が描く保健師の物語。新人の三御一花は、行政保健師として乳幼児から高齢者まで地域住民の医療と福祉を支える。元ヤンキーの指導者とともに「誰ひとり取りこぼさない」現場に挑む、お仕事ドラマ。

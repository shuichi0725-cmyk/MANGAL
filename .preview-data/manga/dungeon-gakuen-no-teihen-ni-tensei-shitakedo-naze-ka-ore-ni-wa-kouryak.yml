  rakuten_caption: '『高杉貴志はクラス最下位の成績で運も悪く、主人公と対立して学園を去り、死亡した噂を耳にする気の毒な生徒』

    ゲームの攻略本にそんな記述をされる底辺キャラに転生してしまった主人公。絶望のどん底にいたが、ふと教室の机の中を探るとそこには転生前に買っていたこのゲームの攻略本があった。

    「これを生かせば最強になれる!?」


    犬死に回避のため強くなる決意をした高杉は裏スキル上げのためダンジョンへ向かうが苦難の連続…。しかしゲームの美少女ヒロイン・花ヶ崎と行動を共にするようになり運命は加速度的に逆転するーー！'

    突然の経営難で勤務先を失い、先行きに困った独身アラサー・眞田ゆうきは、とある縁で年下イケメン・佐久間はじめのもとで住み込み家政婦として働くことに!!

    思いがけない好条件に浮かれるゆうきだったが、雇い主と家政婦という関係をわきまえ、はじめとは一定の距離を保とうとする。

    しかし実は、はじめはゆうきに一目ぼれしていて……!?

    ずれた二人のすれ違う恋、開幕!!'

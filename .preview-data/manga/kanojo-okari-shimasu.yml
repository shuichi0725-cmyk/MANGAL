synopsis: 'たった一度の“レンタル”で、輝き出す“リアル”がある。

  都内在住のダメダメ大学生、木ノ下和也（20）。ある日、“ワケアリ”の超絶美少女、水原千鶴との出会いをキッカケに、彼の人生は大きく変わり始めて──！？



  水原に相応しい男になるためなら…なんだって…なんだってできそうな気がす'
catch: 恋人さえレンタルできる今の日本。失恋でやけになった大学生が、レンタル彼女を頼んでみたら——互いの素性が絡み合う、こじれ系ラブコメ。

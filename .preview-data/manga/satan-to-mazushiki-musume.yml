  rakuten_caption: '悪魔と呼ばれるあなたに、心惹かれてしまうなんて…


    バーバラは父を止めるため、雪の中をひた走っていた。冷酷な実業家と噂の新しい工場主ジョセフに、父は労働者たちを率いて抗議しようとしていた。刑務所に入れられてしまうかもしれないのに…。現場に着くや、人波にのまれ転倒しかけたバーバラを、颯爽と現れたジョセフが抱きとめる。「悪魔とは、神よりも美しい顔をして人間の前に現れるのだわーー」一瞬で彼女の心を奪ったジョセフはしかし、バーバラを利用し暴動を収束させると、金貨をばらまいて人々を侮辱して…!?'

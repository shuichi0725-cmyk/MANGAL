  rakuten_caption: '総務課の新入社員・播上は、毎日手作り弁当を持参する”料理男子”。いつものように社員食堂でお弁当を食べていると、弁当袋を手に暗い顔の同期の清水に気づく。仕事が上手くいかず悩む清水を励ますべく、おかずを一切れプレゼントしたことから、二人は“メシ友&quot;となる。


    一緒にお弁当を食べ、感想を言い合い、レシピを教える。先輩からは清水との関係を茶化されたりもしたが、マイペースにメシ友の距離感を続け、同期として励まし合いながら日々仕事に打ち込んでいた。


    苦手な先輩、自分より優秀な同期、将来への漠然とした焦燥感…

    播上もまた悩みを抱えていたが、いつも前向きになれたのは清水のおかげでーーー



    お弁当が結ぶ、ちょっぴり鈍感でのんびり屋さんの恋愛ストーリー！


  rakuten_caption: '勇者の兄を殺すため、魔王の従者と手を組んだ少年が居たーー。

    家族にすべてを奪われた少年と、主人の仇を討ちたい魔人メイド、偽りの主従契約からはじまるダークファンタジー、開幕。


    勇者を輩出する名門一族の息子でありながら、英雄の弟でもあるアレンは、剣術の才能がなく、長所は打たれ強さと怪力のみ。

    そのため一族から嫌悪され、兄レオンからは酷い特訓を受ける日々を送っていたが、アレンは唯一の心の拠り所であった使用人に支えられていた。

    だが、唯一優しくしてくれた使用人が、なぜかレオンによって殺されてしまう。それからというものアレンは家族の愛を知らずに暮らしていた。

    そんなある日、レオンが旅で不在の間に、魔王の従者である魔人・ザラが屋敷を襲撃し、アレンとレオン以外の一族を皆殺しにしていく。

    アレンはこの状況を最後の望みとしてザラに助けを求めると、彼女は何かを企みながらも、アレンに手を差し伸べるが…。

    世界から“悪”と称されても己の信念を成し遂げるため偽りの主従契約を結ぶ、復讐と救済のダークファンタジー!!


    ※最新情報は8月中旬以降に更新予定'

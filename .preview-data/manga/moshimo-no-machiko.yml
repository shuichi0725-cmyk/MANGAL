  rakuten_caption: '人は一日に約三万五千回の選択をしながら生きているというーー。

    雪村マチコ、大手インテリアメーカー企画部部長。仕事優先に生きてきた自分の人生に、悔いはない。


    ある朝起きて目の間に合ったのは、知らない幼児と自分と同じ顔の女。

    慌てて飛び出し向かったのは、どこよりもなじみのある会社の受付。

    だったのだが…、受付担当者には「雪村マチコ」という社員はいないと言われてしまい…'

  rakuten_caption: '【電子書籍版では限定コラムを掲載！】


    「読むとだんだん実家に帰りたくなる！？」

    家族とのビミョ〜なキョリ感に悩むお年頃のインスタ女子たちを

    爆笑の渦に巻き込んだフォロワー26万人超（※2026年8月現在）の

    漫画家・小林潤奈とその一家による、とにかく明るい家族あるあるエッセイ。


    昭和気質だけど、どこか乙女なお父さん。

    優しくてほんわか！だけど思わぬところで思い切りの良いお母さん。

    そしてやっぱり忘れちゃいけない「小林姉妹（コバヤシスターズ）」の

    お姉ちゃんこと万里菜さん。

    小林家のチャームポイントのちゃめちゃん、ハニィちゃん等、

    「家族ってこんな可愛かったっけ？」が詰まったコミックエッセイです！


    第二弾のテーマは「おでかけ＆はじめてのチャレンジ」

    おでかけはちょっとした近場から旅行まで、

    小林一家がおうちから飛び出して大冒険しちゃいます！


    また単行本特典は、みんな大好き小林姉妹（コバヤシスターズ）の

    大人気むちむち旅シリーズを特別出張編を収録。

    今回はなんと姉妹でドキドキ！リムジンパーティ（！？）を開催しちゃいます。

    ほかにもSNSで好評の珠玉の名作から新作描き下ろしまで

    満足'

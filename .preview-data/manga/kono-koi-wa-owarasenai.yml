  rakuten_caption: '生徒からは大人気！

    ……でも恋愛になると毎回ポンコツな高校教師・恵。


    元恋人にバッタリ再会して、つい見栄を張って言ってしまった。

    「お前よりいい彼氏を紹介する！」


    ……そんな人、いるわけないのに!?


    後に引けず困り果てる恵の前に現れた救世主（？）は

    なんと密かに片想い中の後輩教師・瑞樹！

    しかも向こうから“偽の恋人役”を引き受けてくれて……!?


    偽装カップルのはずが、やけに独占欲を見せたり、やさしく世話を焼いてきたり……。

    その一挙一動に、恵の心臓は今日も大忙し！


    大失恋組のふたりが巻き起こす、すれ違いだらけのドタバタ両片想いラブコメ！'

    女子への免疫ゼロな俺にこの春、義妹ができたーー。

    それも……5人!?


    長女の地夏は大の男嫌いで、心優しい次女の水緒とギャルの三女・火鈴は双子。

    四女・風香は秘密アリのお嬢様で、末っ子の空音は甘えん坊！

    突然始まった同居生活は、トラブルだらけのはちゃめちゃライフ！



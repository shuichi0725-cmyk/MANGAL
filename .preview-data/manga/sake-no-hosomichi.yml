synopsis: '呑兵衛たちの永遠のバイブル『酒ほそ』、待望の最新刊‼

  ラーメンはつまみになるか、好きなお酒で打線を組むなら、焼肉においての飲酒のペースなど…酒飲みならば誰しもが一度は抱く（？）答えのない問いを呑兵衛リーマン・岩間宗達が解決⁉

  更に前・中・後編の3話にわたって、関西の焼き穴子の美味'

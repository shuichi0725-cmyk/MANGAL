  rakuten_caption: ある日突然起きた震災により家族と離れ離れになってしまった、小学1年生のここなと子猫のきなこ。“ユーレイ”になったここなはきなこと一緒に、“ユーレイ”が見えるおばあさん・千代子の家で暮らし始め、家族の帰りを待つ“おるすばん″を続けている。さらに、少年カイと黒猫のゴンタも仲間に加わり、亡くなった人たちの声を聞いて天国へと送り出す「こどもレスキューたい」を結成。一方、きなこの飼い主だった少女・さきは、故郷を離れた避難生活で寂しさを抱えていた……。津波の跡、瓦礫の山。人がいなくなった町。原発事故の不安。亡くなった人たちの心残りと、声なき声。生き残った人たちの願い。--「猫の一生」を通して描く、震災の物語。※この話には、津波・原発事故に関する描写が含まれます。フラッシュバック、強いショックを受けられるなどのご心配がある方はご注意ください。

  rakuten_caption: '「お前に、もう一度会いたかった」

    クリスティーナは、

    大国ロマノワの若き王ダーヴィットに嫁いだ。

    しかし、氷像のように美しく無口な彼との結婚生活は、

    どこまでも冷え切っていた。

    孤独を抱えながらも彼を想い続けたクリスティーナは、

    ある日、ダーヴィットが何者かに命を狙われた瞬間、

    咄嗟に身を挺して彼を守る。

    そして、そのまま命を落としてしまう。

    ーーはずだった。

    目を覚ますと、そこは彼と結婚する前の世界。

    二度目の人生を与えられたクリスティーナは、

    今度こそ自分の幸せのために生きようと決意する。

    けれど再会した彼は、なぜか以前とは

    まるで別人のように激しくアプローチしてきて……？

    運命を覆す逆行ラブストーリー。'

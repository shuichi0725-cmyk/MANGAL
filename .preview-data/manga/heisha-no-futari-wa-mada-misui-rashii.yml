  rakuten_caption: '「なんてしんどいんだ“匂わせカップル”ってやつは…」

    株式会社ミナトは、コミュ力の高いモテ男・吉成(30)とクールな綺麗系・三城(27)の先輩後輩コンビに沸いていた。なぜなら“匂わせ”がすごいからだ。リモート会議の背景が同じ部屋だったり、同じネクタイをつけていたり、お揃いのタンブラーを使っていたり…。毎日のように投下される大胆なイチャイチャ供給を、社員たちは興奮しながら見守っていた。しかし、当の本人たちはというとーー「匂わせじゃなくて、付き合いたい……！」実は両片想いを拗らせまくっていた。そんなある日、ひょんなことから二人きりで一晩を過ごすことになり……？'

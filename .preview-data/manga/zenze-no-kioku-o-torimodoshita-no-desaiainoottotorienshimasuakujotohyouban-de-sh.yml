  rakuten_caption: 聖女の事件をきっかけにラルフの想いを知り、よりを戻すことになったアシェリーは、王宮に戻り、王妃でありながら治癒師としても活躍していた。そんなある日、貧民街で起きた魔力暴走事件に治癒師として駆け付けたアシェリーは、魔力暴走自体をなんとかできないかと考える。前世の記憶から魔力を閉じ込めておくことができる“精霊の涙”の存在を思い出したアシェリーは、入手するため、ラルフとともに辺境領へと向かう。そんな中、王弟クラウスが王位簒奪を狙い、あやしい動きをしていると聞いたアシェリーは警戒を強めるがーー!?

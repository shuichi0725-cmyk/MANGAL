  rakuten_caption: '世界30ヵ国に旅した経験をもとに、海外で食べたあの”おいしいグルメ”の味を日本でも再現したい。そんな思いから、身近なスーパーや食料品店で手に入る食材を使って、海外のごはんを完全再現！北欧の「スモークサーモン」やクリスマスにぴったりのイギリスのご馳走「ビーフウェリントン」や、イギリスの爽やかな夏の飲み物「ピムス」、韓国の身体温まる優しい味のスープ「プゴクッ」などなど…季節や気分に合った世界のグルメを掲載。作り方を解説したレシピページやおすすめの観光スポットを収録した、旅行気分になれるコラムもたっぷり収録。読むだけでお腹が空いてくる「海外旅行記×グルメコミックエッセイ」を、全編オールカラー、描き下ろし40p以上を加えて書籍化！

    プロローグ


    第一章　お家で楽しむ旅気分

    暮らしのそばに異国の香り

    フランス・アルルの市場とゴッホの光

    クリスマスはロンドンの素敵なご馳走を

    クリスマスの翌日も特別な一日


    第二章　季節の中にスパイスを

    初詣とネパールのぬくもり

    疲れた身体に染みわたる韓国のスープ

    バレンタインとメキシコの甘い記憶

    ラマダン明けのお菓子とホワイトデー


    第三章　思い出を何度でも味わっ'

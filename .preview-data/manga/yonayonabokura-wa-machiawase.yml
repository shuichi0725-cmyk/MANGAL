  rakuten_caption: '不眠に悩む大学院生の西東洸と、独立後の孤独から眠れなくなった一条宵子。

    睡眠遺伝子「ネムノキ」の相性が非常に良い「適合者」と判明した二人は、安定した睡眠を得るための共同生活実験を始める。

    戸惑いながらも同じベッドで眠りにつく二人は何年も味わえなかった深い眠りへと落ちていく……。

    誰かが隣にいてくれること。不器用な男女の不思議で温かな物語の幕が上がる。'

synopsis: クラスの底辺にしがみつく少年・市川京太郎は、ひそかに自分を心理スリラーの主人公だと思い込んでいる。クラスのアイドル山田杏奈を密かに想いつつ、級友の平穏を乱す妄想に明け暮れる日々。だが彼は思うほど病んでおらず、杏奈も実は少し変で――。青春ラブコメディ。

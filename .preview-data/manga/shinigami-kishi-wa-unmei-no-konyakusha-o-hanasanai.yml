  rakuten_caption: '王子に婚約破棄され、キズモノ令嬢になったエメリーン。


    すると国王は、エメリーンに『死神騎士』と呼ばれる英雄・ランスロットとの婚約を命じた。

    けれどそれは、エメリーンの&lt;運&gt;という&lt;祝福&gt;を目当てにしたものでーー


    「いいじゃない、契約結婚。閣下を支えてみせます!」


    そう割り切っていたのに、

    あれ、なんだか閣下がすごく甘くないですか……?'

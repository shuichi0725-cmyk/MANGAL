  rakuten_caption: 'どうか皆さん、小さなままで。


    温暖化後の未来を描いた「utopia」で

    話題を呼んだ作家・夕暮宇宙船　初の短編集。


    表題作「水の定規」を含む、計4作品を収録。

    著者の漫画の師である、齋藤なずな氏による解説付きです。


    わたしが経験していない、わたしのものじゃない記憶のはずなのに、

    こんなにもわかるし、優しい棘になって突き刺さる。

    抜けないし、抜きたくない。（小説家・歌人　加藤千恵）


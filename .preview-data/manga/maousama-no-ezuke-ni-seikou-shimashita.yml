  rakuten_caption: ある日突然、前世の記憶を思い出した悪役令嬢・ミネルヴァ。慌てて今までの悪女ぶりを謝罪するも時すでに遅く、「魔界で恐ろしい魔獣たちに食べられて死ぬように」と断罪され人間界を追放されてしまう！そんなピンチを救ってくれたのは超絶美形の魔王様・ウィルフレッド。助けてくれたお礼として、空腹だったウィルフレッドに得意な料理を振舞うと、その腕を大絶賛されとても気に入られる。「このまま魔王の胃袋をつかんで、魔界で生き残ってやるんだから！」魔族も胃袋も虜にする！追放悪役令嬢の美味しい成り上がり！

  rakuten_caption: "南の島で繰り広げられる青春・書店幻想譚！ \n\n 書店の息子・窪田くんの前に突如現れた、クールビューティーな転校生・東さん。\n\
    実は彼女は、熱烈な「えっち漫画ラバー」だった！\nそんな彼女に画力を見込まれた窪田くんは、\n東さんに（なかば強引な形で）頼まれてえっち漫画を描くことに。\n\
    \n漫画執筆のため己に眠るフェチとリビドーを探すこととなった窪田くんだが、\n東さんの存在にリビドーを喚起されている自分に薄々気づき始めて…!? \n\n\
    \ 【編集担当からのおすすめ情報】 \n 美しい南の島と、思春期少年少女の情熱が光る青春譚！\n大注目の最新刊です！"

    しごできリーマン・朝倉 誉は、営業成績トップを争うライバル・佐々木 慎太郎がどうしても気に食わない。

    ある日、「佐々木はゲイらしい」という噂を耳にした朝倉は、色仕掛けで翻弄し、出し抜いてやろうと誘惑する。

    佐々木のうろたえる姿を見るはずが、予想外に求婚されてしまいーー!?

    普段は理性的で非の打ちどころのない真面目男なのに、甘く激しい愛情を惜しみなく注いできて……♡



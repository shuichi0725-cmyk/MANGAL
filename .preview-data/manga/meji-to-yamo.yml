  rakuten_caption: '世界はまだまだ謎でいっぱい。

    「黒ずくめの運び屋」の正体を考えたり、

    ネズミのハミから種の保存をかけた

    切実な脱出劇の話を聞き、同情したりあきれたり。

    今日も2匹は、自分と違う生き物たちのことを

    ひとつひとつ解釈しながら

    軽快におしゃべりを繰り広げる。'

  rakuten_caption: '素行不良によりプロ野球界から追放された天才投手・結城。

    再起を目指し彼が入団した独立リーグのチームで捕手・要田に出会う。


    練習には真っ先に現れ、まっすぐ野球に取り組む彼は、

    2年目なのになぜか試合出場経験は1度だけ。

    しかし技術や才能がないわけではないらしい…。


    そんな謎に包まれた要田は、

    プロ野球界にも存在しない唯一無二の特性をもっていて…!?


    キャッチャーの価値を今一度問う、成り上がり野球譚!'

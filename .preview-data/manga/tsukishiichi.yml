  rakuten_caption: '心霊系配信者のカケルは、口裂け女のドッキリ動画を撮影中に、謎の「月師」ミチルと遭遇する。

    直後、彼らの前に現れたのはーー本物の口裂け女だった。

    異空間に閉じ込められ、圧倒的な「月師」の力を目の当たりにするカケル。

    妖怪は本当に消滅させるしかないのか？ 「月師」とは一体何者なのか……？


    凡人だったカケルの日常は終わりを告げ、妖異渦巻く「月師」の世界への扉が開く！'

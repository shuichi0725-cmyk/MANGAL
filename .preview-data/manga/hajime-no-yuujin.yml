  rakuten_caption: '旅行で訪れた田舎の村に伝わる「ふた祭り」に参加することになった小学生の谷亀遼太。祭りには「うなゐさま」という存在が関係しているようだが、祭りの起源について村人達は不自然に口をつぐむ。遼太は村の少年・中本朔と友人になり、災いを閉じ込めているという「ふた」をこっそり見に行くことになるが、その先には恐ろしい出来事と、村の言い伝えに隠された真実が待ち受けていた。

    時は流れ大学生になった遼太は、ある日教室で謎の青年と出会う。彼は、かつて村で出会った少年と同じ名前・中本朔を名乗るが、それ以来遼太のまわりでは奇妙な出来事が起こるようになり──？'

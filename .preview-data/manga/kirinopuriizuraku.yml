  失意のまま彷徨い、廃墟の街に辿り着く。

  そこで出会ったのは、口がきけない敵国の少年兵だった。

  アダムはレフを救えなかった怒りと後悔を彼にぶつけるが、通じ合えない。

  そして、断絶の二人の奇妙な共同生活が始まるーー


  廃墟の街ーー生死の端'

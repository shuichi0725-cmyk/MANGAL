  rakuten_caption: 【月マガ基地ランキング1位獲得！　『なろう』コミカライズ！】超高速のバトル・アクション！　新宿ダンジョンと呼ばれる巨大な幻想領域（ダンジョン）で今日も主人公はモンスターたちと戦いを繰り広げる！　料理が好きな主人公・御山ミトの目的は大切な妹とともに平穏に暮らすこと。だが、ある日ステータスがオール1になってしまい筋力が急激に落ちて呼吸もままならないくなってしまう。そして救急搬送された病院で突如「トレーニングルーム」に入室するスキルを手に入れる。ミトは自分のスキルの特殊性に気付かないままダンジョンに突入し、腕試しのつもりがとんでもないことになってしまう！　※「小説家になろう」は株式会社ヒナプロジェクトの登録商標です。

synopsis: '余命一年のグランヴェル侯爵子息・ライオネルと婚約したエディス。

  エディスはオークリッジ伯爵家に戻るよう脅迫を受けるが、

  ライオネルのおかげで縁を断ち切り、無事グランヴェル侯爵家に帰ってくる。

  次第にライオネルの病状も回復し、

  二人は婚約を公表するために公爵家主催のお茶会に参加する'
catch: 義姉の代わりに名門家へ嫁ぐことになった孤児の少女。相手は「余命一年」と告げられた侯爵令息——。冷遇されてきた彼女が見つける、奇跡を呼ぶ純愛。

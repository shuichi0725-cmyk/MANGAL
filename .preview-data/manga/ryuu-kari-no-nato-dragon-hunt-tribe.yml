  rakuten_caption: '《龍狩族》の男・ルドラが龍の巣で発見したのは、龍とともに育った少女・ナト。

    人の知恵を持たない少女を、ルドラは強引に里へ連れ帰る。

    生きるため、復讐のため、人としての生き方を身につけていくナトだったが、

    ともに育った小龍・ナバジがルドラたちに捕らえられてしまったことをきっかけに、

    里の少年・ラナクたちと心を通わせていくことにーー。


    人か龍か。《龍狩族》ナトのジュブナイル冒険ファンタジー　開幕！！'

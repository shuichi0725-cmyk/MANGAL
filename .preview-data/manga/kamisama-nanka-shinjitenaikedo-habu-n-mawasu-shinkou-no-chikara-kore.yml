    クラスメイトとの交流や冒険者としての挑戦など、学院での生活を過ごしていたが──侯爵令嬢の誘拐事件に遭遇!!

    少女の命、自身の立場、様々な事情がミカを悩ませるが……。

    事件の顛末は、ミカの運命をさらに大きく動かしていく!!'

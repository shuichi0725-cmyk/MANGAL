  rakuten_caption: '「俺にはもう　選択肢がない」

    教育センターで再会したキリヤの母は、目の前で連れ去られた。

    その先に待っているのは「卒業」という名の「最終処分」--執行日は、明日。

    母を救出するため教育センターに単身乗り込もうとするキリヤが、ヒスイたちに見つかってしまう。

    その時、突然鳴り響いた電話は、意外な人物からのものだった…！'

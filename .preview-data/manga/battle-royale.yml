synopsis: 「研修旅行」と称してバスでガスに眠らされた中学生の一団が、孤島の廃校で目を覚ます。そこで知らされたのは、毎年クラスメイト同士が最後の一人になるまで殺し合う「プログラム」のルールだった。首には逃亡を許さない爆弾付きの首輪——という極限のサバイバル劇。

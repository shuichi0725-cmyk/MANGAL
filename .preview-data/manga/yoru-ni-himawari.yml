  rakuten_caption: '特別支援学級に通う五年生の妹・明里を支えながら、派遣社員として働く小豆沢（あずさわ）紗夜、27歳。ある日、明里が通う放課後デイサービスの送迎ドライバーとして紗夜の前に現れたのは、中学時代に大の苦手だったヤンキー少女、宇田夏葵だった。かつて絶対に交わることのなかった紗夜と夏葵だったが、時が経ち、互いが抱える悩みを分け合ううちに、いつしか親友のように、恋人のように、心を許せる存在になっていくーー。

    泣いて、怒って、それでも君はいてくれた。心をゆさぶるディア・ホームストーリー！'

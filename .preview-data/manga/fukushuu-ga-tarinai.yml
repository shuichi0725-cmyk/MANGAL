synopsis: '社内で起きた性加害事件をきっかけに今度は自分が加害者となってしまった復田朱里。

  隠蔽工作を重ねるうちに違法大麻ビジネスにかかわるようになり、

  最終的には大麻栽培現場の火災から逃走する。

  しばらくして、開き直った復田は生まれ変わったように生活をし始めた。

  会社員を続けながら、副業で'
catch: 社内の性加害事件をきっかけに、今度は自らが加害者となってしまった復田朱里。隠蔽を重ねるうち違法ビジネスに足を踏み入れ、火災現場から逃走する。開き直り生まれ変わった彼女が向かう先は——転落と再生を描く、衝撃のクライムサスペンス。

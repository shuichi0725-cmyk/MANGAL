    description: とある国同士の戦場で、日本人の力と敵兵は、トラにくわえられた赤ん坊を助けるために戦いを中断する。勝った者が赤ん坊を育てる約束のもと、勝利した力は赤ん坊を抱いて日本へ帰る。十数年後、その子は力也としてすくすく育つが、尻に大きなシッポを持ち、ビルの上を飛び回る身体能力と並外れた頭脳を備えていた。一方、ヒマラヤ調査から戻った田手上博士は「人類は0マンに狙われている」と発表する。0マンとは地下都市で暮らす、人間よりあらゆる面で優れた種族で、やがて人間を滅ぼし地球を乗っ取ろうとしていた。その参謀が人間世界への攻撃を開始していく。

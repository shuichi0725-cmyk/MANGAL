    description: 0マンが作り出した電子冷凍機によってあらゆるものが凍りつき、地球は氷河期の状態に陥る。田手上博士は人類がこれ以上地球に住めないと判断し、盗み出した0マン設計のロケットで金星への脱出を図る。一方、悪人ランプは博士の救出計画にリッキーの両親である0マンが協力していると知り、自分専用のロケットを作らせるため彼らをさらおうと画策し、オリに閉じ込めたリッキーに手紙を書かせようとする。やがて冷凍機とブッコ・ワース光線機が失われ、地球には一応の平和が戻るが、0マンの国は廃墟と化していた。人間に散々な目に遭わされた0マンたちが最後に下した結論が描かれる。

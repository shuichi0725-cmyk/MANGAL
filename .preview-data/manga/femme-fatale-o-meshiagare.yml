  rakuten_caption: "この悪女、惚れたら破滅。 \n\n 人間と魔族が停戦協定を結んでから50年。『迷い茨の魔王城』に引きこもり、惰眠をむさぼる魔王ナサニエル・ノアに下された命令は、人間と結婚すること。その相手とは、“傾国の悪女”ことニカ・サタニック・バルフェスタ。類い稀なる美貌と、自らに惚れた相手を意のままに操る『魅了』の異能で、世界中の人間を下僕に変えてきた史上最悪の大罪人である。\n\
    しかし、ナサニエルはちょっと興奮するだけでも気絶してしまう、超絶コミュ障だった。ニカはあらゆる色仕掛けを駆使して、ナサニエルを虜にしようとするが…\nガガガ文庫の人気作をコミカライズ。惚れたら破滅のラブゲーム、ここに開幕！ \n\n 【編集担当からのおすすめ情報】 \n 純情魔王のナサニエルと悪魔的美女のニカ。人間と魔族、立場も性格も正反対のふたりが織りなすアレコレをどうぞお楽しみください！"

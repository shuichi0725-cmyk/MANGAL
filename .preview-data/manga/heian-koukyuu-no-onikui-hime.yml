  rakuten_caption: '時は平安。

    貧乏貴族の明乃は、父から「鬼になってくれ」と懇願される。

    それは宮中の高貴な人々の毒見をするお役目……

    《鬼食い》のことだった！


    突然の大役に怪しむものの、家族のため、

    そして美味しいものの誘惑に負けて出仕を決意した明乃。

    だが、内裏では奇怪な事件が次々と巻き起こり……!?


    明乃は幼き頃より培った《舌》と食の知識を武器に、

    謎の青年・黒弾正こと源蘇芳とともに、内裏の闇を暴いていくことにーー。


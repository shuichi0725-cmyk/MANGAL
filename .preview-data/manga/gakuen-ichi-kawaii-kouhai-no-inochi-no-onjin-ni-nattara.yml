  rakuten_caption: '学園一かわいい後輩が許嫁兼通い妻に！?

    半同棲あまあまラブコメ！


    「先輩の世話をしに来ました！」

    どうして学園一の美少女Jkが俺の家に！?


    高校2年になった俺・御堂友也。

    ある日、校内外で話題の美少女新入生である白洲結佳を交通事故から助けた。

    これ以上の面倒は勘弁ーーその場を立ち去り帰宅したら、

    我が家の玄関先に彼女の姿が。

    なんと結佳は親同士の話し合いで決まった許嫁だった！

    さらに事故から助けた際に負傷した俺の右腕を見て、

    彼女は通い妻になることを宣言！

    その日から「半同棲生活」始まったのであった。


    純粋無垢で大胆な後輩通い妻との半同棲あまあまラブコメ開幕！'

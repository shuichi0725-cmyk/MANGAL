  rakuten_caption: 'たゆまぬ努力で切り開け、

    理想のセカンドライフ！


    少女を庇い、トラックに轢かれた30歳独身サラリーマン。

    死の間際、もっと強ければ自らも死ぬことなく少女を助けられたと後悔する。


    そんな中、目覚めた先は魔法が使える異世界！

    鍛冶屋の三男・ノイスとして生まれ変わったものの、

    才能は平凡、肉が食べられない…などなど困難の連続。


    それでも彼は第二の人生こそ強くなり、豊かな異世界生活を送ることを決心！

    努力し周囲のサポートを得ながら才能を開花させていく。


    時にアツく、時に温かい。

    心震わせる人生やり直しファンタジー開幕！'

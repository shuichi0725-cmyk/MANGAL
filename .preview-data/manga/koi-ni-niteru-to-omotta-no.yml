  rakuten_caption: '同じ見た目、同じ声。

    だけど中身はまったく別の生き物になってしまった好きな人・クウに、

    恋人を騙って一緒にいることを選んだゆずる。


    クウは、他の生き物の身体を乗っ取って繁殖するという。

    それでも彼を人間社会で生かすため、ゆずるはクウの職場復帰を申し出る。


    しかし、周囲が様子の変わったクウを見逃すはずもない。

    ゆずるの妹・まもるも動き出し、

    二人きりだった世界は思わぬ方向に転がり始める…！


    行き場を失った恋にもがくホラーロマンス、第2巻。'

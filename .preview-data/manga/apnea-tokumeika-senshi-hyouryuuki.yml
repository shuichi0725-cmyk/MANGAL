    腹帯に書かれた遺書の持ち主を捜すため、鳩谷たちが潜ったのは太平洋戦争末期の沖縄。鷹取とはぐれてしまった鳩谷は、水上特攻艇の震洋の部隊に編入されてしまいーー。


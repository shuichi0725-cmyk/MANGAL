synopsis: 晴れて幕臣となった新選組だが、徳川家に政権を返上させる時代の流れが押し寄せる。坂本龍馬や後藤象二郎、西郷吉之助らが動く幕末の転換期に翻弄されながら、刀と生きる侍たちを描く新選組譚。
catch: 徳川幕府が終焉を迎える幕末、晴れて幕臣となった新選組。倒幕へと傾く時代の奔流に翻弄され、病に蝕まれながらも刀とともに生きる侍たちの矜持を描く——激動の幕末群像時代劇。

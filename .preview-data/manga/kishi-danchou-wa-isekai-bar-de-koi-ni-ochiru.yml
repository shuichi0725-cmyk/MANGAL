  rakuten_caption: '「ここ、どこ──!?」

    目覚めたら、そこは見たことのない世界だった──


    敬愛する祖父と共にバーを営んでいた薫は、突然の祖父の死と、叔父による店の売却ですべてを失いかけていた。

    思い出の詰まった店を手放すことに絶望したその翌朝、薫が目を覚ますと、バーごと異世界へと転移していたのだ。

    この世界では薫の作るカクテルは見たこともない珍品として評判を呼び、「この店の酒を飲めば恋が成就する」というジンクスまで生まれてしまう。

    噂を聞きつけた騎士団長は、魔法使用の疑いで取り調べに訪れるが、

    魔法ではないはずの&quot;恋&quot;の力は、どうやら彼自身に効いてしまったようで…？


    堅物騎士団長×臆病なバーテンダーの、転生恋物語。'

synopsis: 死屍戸捜索のため、魔界に潜入するキヨシ達。しかし、そこへ死屍戸公開処刑の知らせが届く！ 急行した現場には、大魔王の息子・地獄瀬ガガが降臨。ガガに奪われた宝物を取り返すために、戦いに挑む死屍戸は突如として手錠を食べ始め…!?
  一方、対抗したガガが繰り出した思わぬ能力とは──!?
catch: 史上最強の悪祓士キヨシ。大切なものを守るため究極の力を得た彼には、誰にも言えない秘密がある。悪を斬る剣となれ——新たな悪祓いバトルコメディ。

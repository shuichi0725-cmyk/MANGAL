    description: 高校1年の二階堂アリスは、弱小ラグビー部のマネージャーを務める元気少女。少しエッチな部員・小野寺克巳とは、互いに気になりながらも喧嘩ばかり。ある日、不思議な水晶を拾ったアリスは同時に落雷を受けて気を失う。その夜から、彼女が夢で見たことが現実になり始める。マジカルホラーストーリーの開幕。

    description: 封印が解かれ、みずからパワーを得たキャサリンは、さやかを必要としない“生きた人形”となって動き出す。“今度こそ総二郎と生涯を共にする”ため、呪術を用いてアリスと入れ替わろうと企む。アリスは予知夢で見た場所を探して、キャサリンと総二郎がいたというドイツへ向かうが、そこには罠が待っていた。

    description: 人の心を失ったキャサリンの目的は、克巳の魂と総二郎の魂を入れ替えること。その行動を阻もうとアリスたちは総二郎の過去を追うが、突如、克巳が姿を消してしまう。そして総二郎終焉の地・フランスで、アリスとキャサリンの最後の決戦が始まる。100年にわたる愛と憎しみの物語が、衝撃の完結を迎える。

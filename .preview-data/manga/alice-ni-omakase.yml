    description: 突然、別人のようになってしまった克巳。目が青く変わり、影が魔物のような形になったさやか。次々に起きる異変を調べ始めたアリスは、さやかの家で人形のキャサリンに襲われる。だが克巳の曾祖父の写真を見たキャサリンは、涙を流して動きを止める。一方さやかは、アリスの親友・由加利を魔術で操り、新たな罠を仕掛けてくる。

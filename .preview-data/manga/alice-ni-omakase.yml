    description: 奪われた身体をようやく取り戻したアリスは、壊れた人形をキャサリンの墓に埋め、残された謎を解くと誓って日本への帰途につく。時を同じくしてドイツでは、100年前を思わせる子供の行方不明事件が起きる。そんな折、アリスの家に外国人の少女ジェニファーが現れる。その腕には、人形と一緒に埋めたはずのブレスレットがあった。

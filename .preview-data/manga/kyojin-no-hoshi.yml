synopsis: プロ野球で活躍する父・星一徹のような一流選手を夢見る、有望な若き投手・星飛雄馬。父はかつて三塁手だったが、戦争で負傷し引退を余儀なくされた。やがて飛雄馬は人気球団・巨人に入団するが、高すぎる期待に応える難しさを思い知る。過酷な特訓、宿敵・花形満との対決——最高の魔球で挑む野球ドラマ。

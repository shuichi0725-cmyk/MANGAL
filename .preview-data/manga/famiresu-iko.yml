    description: あの地獄のカラオケ大会から四年が経った。大学一年生の岡聡実くんは、東京で普通の大人になるべく学業に勤しんでいた。しかしひょんな出来事から始めた深夜のファミレスのアルバイトをきっかけに、奇妙な縁が再びめぐり始める。バイト先のファミレスに現れるマンガ家の北条先生、マンガオタクでバイトの先輩である森田さん、そしてあの夏の日に出会ったヤクザの成田狂児など、個性豊かな面々が聡実くんの日常に関わってくる。『カラオケ行こ！』の続編。

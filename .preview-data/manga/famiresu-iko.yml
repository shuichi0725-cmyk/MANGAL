    description: 上京して忙しくも平穏な大学生活を送るはずだった岡聡実くん。ところが中学時代に地元の大阪で知り合ったヤクザ、成田狂児との縁を断ち切れず、いまだに振り回され続けていた。普通の大人になる準備をするため、意を決して狂児へ別れを告げるものの、その帰り道で彼の背中に抱きついてしまう。締め切りに追われる漫画家、ゴシップ記事を書くライター、喋り続けるバイトの先輩、同じアパートに暮らす謎の女性。個性豊かな面々にまたしても絡まれていく聡実くん。ヤクザと大学生という奇妙な縁は、どこへ向かうのか。

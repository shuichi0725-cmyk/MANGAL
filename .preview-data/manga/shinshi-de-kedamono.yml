  rakuten_caption: '彼はとても優しくて、獣のように激しい男。

    生花店を営むコワモテのイケメン・武尊と恋人になって半年。同棲も始めて幸せ絶頂のはずのエリート会社員・佳都の悩みは、武尊が自分に何かを隠していること。聞き出せずにいたある日、武尊がヤクザの組長の息子で、父親の部下が武尊に跡を継がせたがっていることを知る。佳都に嫌われたくなくて言えなかった、組を継ぐつもりはないと言う武尊。ところが、武尊の幼馴染でもある九鬼が、武尊を組に連れ戻すために現れる。九鬼が武尊を想う気持ちと自分を比較し、武尊のために身を引くべきかと悩む佳都だったが…。

    「俺は絶対に別れない。どこに逃げても捕まえる」

    コワモテ彼氏×エリート男子が贈るシークレット・ラブ!!'

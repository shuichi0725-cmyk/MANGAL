synopsis: 十七歳、まだ新免武蔵と呼ばれていた頃の宮本武蔵。関ヶ原の戦いに敗れ、逃亡者となった彼は、その荒々しい気性ゆえに故郷でも追われる身となる。人生の岐路に立つ彼を導くのは、風変わりな僧と幼なじみだけだった。剣豪の生き様を描く物語。

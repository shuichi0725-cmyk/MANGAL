  rakuten_caption: 'この世界には2種類の能力者が存在しているーー。

    五感が発達した能力者である＜センチネル＞と、センチネルの能力制御・精神ケアを行う＜ガイド＞である。


    蓮は特異能力管理局、通称＜タワー＞に研修生ガイドとして入庁。

    養成部にて研鑽を積んでいたある日、歴代最強センチネルと謳われる飛鷹とパーフェクトマッチであることが発覚！

    それ以降の飛鷹は、片時も蓮のそばを離れない溺愛執着っぷりで…！？


    「俺とボンド契約して…ずっとそばにいてよ」

    「俺は、あなたに見合う一流のガイドになりたいんです」


    この邂逅がもたらす結末は…？

    運命に翻弄されるセンチネルバースBL、ここに開幕!!'

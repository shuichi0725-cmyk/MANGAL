  rakuten_caption: '田舎の集落で小さな工房を営む薬売りの男。彼はある日、薬の素材としてあるモノ──いや、人を引き取らないかと勧められる。それはボロボロになったエルフの娘だった。

    『コレね 散々弄ばれて捨てられたエルフだ』

    彼女の境遇に憤りを覚えた薬売りは、治療を施すことを決意するが…。

    命とは、人間とは、二人の数奇な運命を描く異世界ファンタジー開幕!!'

  rakuten_caption: 'ペテンに生き、ペテンに敗れた俺が、なぜ異世界に…!?

    現代で悪名を轟かせた天才詐欺師・トガネは、仲間の裏切りをきっかけに異世界へと転移。

    そこは強者が弱者を喰い潰す非情な世界だったーー。

    その惨状を目の前に、トガネはこれまでの騙しの手口をフル活用し、異世界をぶっ壊す策士へと変貌。

    そして裏切った“アイツ”への復讐に奔走し始める。

    稀代の天才イカサマ師が、暗黒の世界に光を差し込む異世界世直し冒険譚、ここに開幕!!

    2026年9月刊'

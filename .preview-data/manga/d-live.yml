    description: 特殊な依頼にも対応すべく、世界中からあらゆる分野のスペシャリストを集めた国際的人材派遣会社ASE。その仕事ぶりは迅速にして完璧で、高額料金にもかかわらず信頼度の高さから依頼は引きもきらない。登録メンバーになれるのは、選び抜かれた特殊能力者のみである。斑鳩悟、十七歳、高校生。ふだんはユルいダメ男子だが、実はズバ抜けた運転の才能の持ち主で、どんなマシンでも完璧に乗りこなす天才マルチドライバーだ。乗り物には魂があると信じている彼は、ピンハネ後のわずかな報酬にもめげず、次々と危険な任務に挑み続ける。一度も乗ったことのない特別製ジェットスキーで銀行強盗を追う「地下水道」、巨大建機を操る「脱出」ほか、「ジェット・パイロット」「暴走特急」「砂漠の戦場」の傑作五編を収録。

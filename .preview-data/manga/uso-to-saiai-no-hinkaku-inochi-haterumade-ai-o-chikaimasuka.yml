  rakuten_caption: "人生最後の燃えるような恋と大きな「嘘」と \n\n 人生最後の、燃えるような恋。\n大きな“嘘”を孕んだままに。\n\n\n双葉凪沙、27歳。都内ホテルに勤務中。\n最後の彼氏と23歳のクリスマスに別れて以来、仕事一筋で浮いた話のひとつもない。\n\nそんな凪沙の密かな「推し」は、ホテルのお客様で日本を代表するジュエリーブランド副社長の美住晴臣さん。\n37歳とは思えない若々しく美麗な見た目もさることながら、紳士な振る舞いの美住さん。\n\
    \nだけどある夜、凪沙はホテルの部屋から出てきた美住さんのあられもない姿を目にしてしまい…\n\n「あの人 どんな風に女性を 悦ばせるんだろう」\n\nそんな想いに火がついてしまった凪沙に、突然の転機が訪れてー!?\n\n「…私と火遊びしていただけませんか」\n\n凪沙の言葉の裏にはある真実が隠されていてー？\n\n\n愛と嘘が絡み合うドラマチックラブ、開宴！ \n\n 【編集担当からのおすすめ情報】\
    \ \n 「花は二度咲き乱れる」「文豪に捧げる乙女」の甘宮ちか先生最新作が登場です！\n冒頭からジェットコースターのような波瀾万丈な恋模様に目が離せません！"

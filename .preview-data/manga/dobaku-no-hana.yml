synopsis: 自衛隊拠点まで20キロ。重傷を負いビルの最上階に取り残された津久田…友永が回収に向かうが既に敵兵が入り込んでいた。敵勢力を削ぎながらアスキラと共にビル内を進む友永…追っ手を振り切り基地に帰投することは叶うのか！？眼前に迫りくる危機を描いた自衛隊ヒューマンドラマ、堂々完結！
catch: ソマリア国境で任務にあたる日本の精鋭部隊が、待ち伏せ攻撃を受ける。逃れてきた女性を守れるか——受賞小説を原作に描く、極限の戦場サバイバル。

    description: 高田美術館が近頃どうにも振るわない。三田村館長の企画は意欲的で作品も揃っているのに、客足がまるで伸びないのだ。見かねた新米学芸員の舟越がフジタに相談を持ちかける。聞けば中央新聞文化部の夏目記者が、美術評で大きな影響力を持つ立場を笠に着て三田村へ言い寄り、拒まれた腹いせに高田美術館の記事を締め出しているらしい。ほかにラモスに呼ばれてシカゴへ渡ったフジタが、アル・カポネの財宝をめぐって彼と元妻ショーンの家庭争議に巻き込まれる一編、日本酒の偽造ラベルを見破られたニンベン師の木戸が、職人としての誇りを賭けて偽札作りの勝負を挑む一編など、全12話を収める。

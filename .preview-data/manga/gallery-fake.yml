    description: プリンスツアーが企画した芸術を訪ねる旅は、七日間でイギリス各地の美術館をじっくり回るというものだった。解説役として同行した美術評論家の大谷は、ツアー客の態度が気に入らず次第に嫌気がさしていく。そんななか大英博物館のソファーに寝そべる日本人を見つけた大谷はついにキレて椅子を蹴り上げるのだが、そこに寝ていたのはフジタだった。舞台はやがてある公爵家のハウスセールへ移る。西洋への傾倒が度を越し日本の文化を軽んじていた大谷の前に、オークション最大の目玉が現れる。本巻ではフジタとサラが大喧嘩し、サラが故郷のQ首長国へ帰ってしまう一幕も。さらにラモスや吉岡と黄金郷を求めてアマゾンへ向かう。

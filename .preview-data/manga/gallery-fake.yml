    description: ギャラリーフェイクを訪れたCM業者から、ミロのヴィーナスの失われた両腕を甦らせたいと相談されたフジタは、パリのルーブル美術館へ飛ぶ。旧知の学芸員に頼み込み、倉庫に眠ったままの左腕の石膏型を取ることに成功した。リンゴを握るその腕はリキュールのテレビCMに使われ、大きな反響を呼ぶはずだった。ところが三田村館長が現れ、その腕は真っ赤な偽物だと糾弾する。さらにCMのモデルである三田村みちるが館長の妹であることも明らかになる。ほかに重度のオカルトマニアである映画プロデューサー・ギブソンの古城に招かれ、ファラオの財宝の発掘に誘われる一編、ジュエリーショップを営む翡翠が登場する最終話を収める。

    description: コート・ダジュールで休暇を過ごすフジタとサラ。マン・アボット美術館を訪れた二人は、そこでアボットの遺産という噂を耳にする。翌日ドライブに出た二人は偶然見かけた三田村館長の車を追いかけ、人気のない荒れ地でアボットの使用人だったヴァレリーと出会う。原始美術を思わせる作風で知られた巨匠の隠された真実が明かされていく。また三田村館長が身寄りのない少女エリザベータを連れてきたことからフジタに隠し子疑惑が持ち上がる。十三年前に確かに知り合った女性フローラの娘だという彼女は、まもなく何者かに誘拐されてしまう。モナ・リザの謎が絡むこの事件を追い、フジタはフィレンツェへ向かう。全11話。

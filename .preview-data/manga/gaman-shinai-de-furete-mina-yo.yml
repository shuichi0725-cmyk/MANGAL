  rakuten_caption: '高校時代に出会った姉の彼氏の髪色に惹かれ、

    同じプラチナブロンドに染めた瑛太(えいた)。

    夢だった美容師になり、アシスタントとして

    働いていたある日、その元カレ・

    達哉(たつや)が偶然来店!!

    たった一晩、数分言葉を交わしただけにも

    かかわらず、なぜか達也は再会を喜ぶ。

    距離感に戸惑いながらも、誘われるがまま

    仕事終わりに二人きりで食事に行くことに!!

    ところがその帰り道、女性不信だという悩みを

    告白すると「男が好きなんじゃない？」と

    キスされ…!?'

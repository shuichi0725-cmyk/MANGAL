  rakuten_caption: "突如として伯爵家後継の立場を失った令嬢・アデルは、嫁ぎ先を探す中、本音を押し殺して息苦しい日々を送っていた。\nある日、そんな彼女に手を差し伸べてくれた、謎めいた美青年の正体は、なんと王弟・フランシスだった！\n\n貴族の夜会で上手く言葉が出なくなってしまったアデルに、フランシスはパートナーとして付き添うことを提案。\n彼の社交的な性格に支えられ、アデルの本来の能力を活かせるようになっていく。\n\
    しかしそれだけに留まらず、フランシスからの強引な誘いで、街へのお出かけや突然の川遊び(？)にも連れ出される日々……。\n\n自由奔放な彼に振り回されながらも、徐々に心を解き放っていくアデルだったが、一方で家族は彼女の変化を認めない。\n苦しむ彼女へ、フランシスが渡したのはーー二人の婚約証明書！\n「じゃーん！僕と婚約したよ！」って、一体どういうこと！？\n\n翼を折られた有能令嬢 × 型破りな王弟殿下　自分らしさを取り戻す、前向きラブストーリー！\n\
    第1話　\n第2話 \n第3話\n第4話\n第5話\n\nあとがき"

  rakuten_caption: '大嫌いなアイツと子供を作らないとこの国は滅んでしまうーー!?　

    侯爵令嬢のリュシエンヌとハイスペ公爵令息のジェイドはケンカばかりの仲。

    ある日、リュシエンヌはジェイドとの間にできた“我が子”が帝国の侵攻から国を守り、救世主となる予知夢を見る。

    この夢を実現させるため、犬猿の相手と子作りをすることに…!?　

    意を決してジェイドにお願いすると、「覚悟しろ」と押し倒されてーー!?

    異世界ケンカップルの国の命運をかけた(？)ムズきゅんラブ！'

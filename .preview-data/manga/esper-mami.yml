    description: 藤子・F・不二雄の名作が次々とよみがえるてんとう虫コミックス新装版の第三弾は、連載開始四十周年かつアニメ化三十周年を迎えた『エスパー魔美』である。本作は一九七七年一月号から『マンガくん』で連載が始まり、一九八七年四月から一九八九年十月までアニメが放送され、それまでより少し上の世代にファン層を広げた代表的傑作のひとつ。カバーデザインを一新し、全ページを新規製版した新装版として刊行される。
  - number: 2

    release_date: '1978-03-04'
    description: 中学生の超能力少女である魔美が、人知れず空を飛んで活躍する。一千万円と三時間をめぐる話、どこかでだれかが、未確認飛行物体、ただいま誘拐中、魔女・魔美、わが友コンポコ、エスパーコックといったエピソードが収められている。てんとう虫コミックス新装版として全ページを新規製版して刊行された第二巻。
  - number: 3
    asin: null
    isbn13: '9784091415035'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6780/2000010206780.jpg?_ex=300x300
    release_date: 1978-05
    description: 待望の大事件だ、腕の見せどころだと張り切る魔美に、プロの殺し屋の弾丸が容赦なく迫る。まだまだ半人前のエスパーは、早くも大ピンチを迎えてしまう。中学生の超能力少女が人知れず空を飛び、人助けや事件解決に大活躍する。さわやかな正義感と思春期のドキドキが詰まった第三巻。
  - number: 4
    asin: null
    isbn13: '9784091415042'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6774/2000010206774.jpg?_ex=300x300
    release_date: '1978-09-05'
    description: このままではパパとママが出会わないかもしれない。テレパシーによって父が母と出会った頃の思い出を垣間見た魔美。ところがいつまで経っても二人はすれ違うばかりだった。なんとかして出会わせなければ大変なことになってしまう。ロマンチックな雪の夜、超能力が時空を超えていく。
  - number: 5
    asin: null
    isbn13: '9784091415059'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6786/2000010206786.jpg?_ex=300x300
    release_date: '1978-10-05'
    description: 気配を感じる、これは大嵐になりそうだ。平和な学園に黒い霧がむくむくと広がっていく。暴力に一人で立ち向かう高畑。正義のエスパーである魔美はどう戦うのか。二回に分けて連載された読みごたえたっぷりの四十四ページ『学園暗黒地帯』を収録している。
  - number: 6
    asin: null
    isbn13: '9784091415066'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6146/2000004986146.jpg?_ex=300x300
    release_date: '1980-08-05'
    description: 目当てはそれだったのか、あたしを主役に選んだ本当の目的は。疑うことを知らない魔美は映画部の主演女優を引き受けるが、ストーリーは思わぬ展開を見せていく。魔美のピンチに高畑の助言が冴える『魔美が主演女優！？』ほかを収録。中学生の超能力少女が人知れず空を飛び活躍する。
  - number: 7
    asin: null
    isbn13: '9784091415073'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6209/2000004986209.jpg?_ex=300x300
    release_date: '1980-10-06'
    description: 超能力にますます磨きがかかる一方で、魔美は事件の背後にさまざまな人生があることを知っていく。解散を決意した人形劇団の夢と現実とは何なのか。ダムに沈んだ村で見た謎の男の秘密とは。そして魔美を誘拐した気弱な中年男の事情とは。大人をも悩ませる深いテーマが描かれる。
  - number: 8
    asin: null
    isbn13: '9784091415080'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6172/2000004986172.jpg?_ex=300x300
    release_date: '1981-10-05'
    description: 今夜はあたしがサンタになる。真心と超能力で人の役に立ちたいと願う魔美は、心に闇を抱えた見知らぬ青年を救うため、自らを捧げようとする。マミを返せと乗り込んだ高畑は、勇気を振り絞って説得を試みる。中学生の超能力少女が人知れず空を飛び、人助けに奔走する。
  - number: 9
    asin: null
    isbn13: '9784091415097'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/rakutenkobo-ebooks/cabinet/6167/2000004986167.jpg?_ex=300x300
    release_date: '1983-06-04'
    description: 父である十朗の同級生で有名画家の水上が、魔美にモデルを依頼してくる。テレパシーによって知ったその苦悩の陰に隠された真意とは何だったのか。全九巻を締めくくるにふさわしいテーマの最終話『パパの絵最高！！』ほか、少しずつ成長してきた魔美の希望に満ちた将来を暗示させるエピソードが収められている。

synopsis: 勇者や悪魔皇子、魔王たちが入り乱れる異世界バトルロイヤル。覚醒進化した暗黒騎士を待ち受けるのは、神域からの反逆者。女子高生シュリや魔王エルメシアらが絶体絶命の状況に挑む、群像バトルファンタジー。
catch: 勇者、悪魔皇子、科学者、そして魔王ーー異世界に集った強者たちが、神域からの反逆者を巻き込み生き残りを賭けて激突する。覚醒と進化、共闘と裏切りが交錯する、絶体絶命のサバイバル・バトルファンタジー。

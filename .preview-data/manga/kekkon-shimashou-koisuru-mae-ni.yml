synopsis: 結婚は恋より先に来てもいい?——ある日、皆瀬夏希は、勤め先の法律事務所の若く端正なパートナー・高村から、付き合ってもいないのに突然プロポーズされる。「君を愛してはいないが、結婚するなら君が一番の候補だ」と言われ困惑する夏希。風変わりな契約結婚の恋物語が始まる。

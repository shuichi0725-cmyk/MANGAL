  rakuten_caption: '「もっと俺を褒めろ！」

    承認欲求強めな俺様男子・山吹流星は、トップアイドルを目指して超名門「煌條学園」へ入学する。

    しかし、同じ仮グループになったのは、クール系男子と、ワンコ系男子だった。

    自己主張の激しい流星とクール男子の衝突は免れず、グループは前途多難。

    そんな彼らの前に、圧倒的オーラを放つ天才双子アイドルが現れるが……！？

    互いの「譲れないもの」をぶつけ合う少年たちが、世界で一番輝く「一等星」を目指す、胸熱の青春ストーリー第1巻！'

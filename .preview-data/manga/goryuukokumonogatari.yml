synopsis: 龍の血を色濃く継ぐ皇帝・雷零は、トラウマから妃嬪を迎えず女官すら遠ざける女嫌い。ようやく后を迎えることになったが、無事に床入りできるか案じた賢臣たちは、ある女性を閨の指南役に選ぶ。后と皇帝をめぐる後宮ファンタジー。
catch: 龍の血を色濃く継ぐ女嫌いの皇帝・雷零は、トラウマから妃嬪をひとりも迎えていなかった。ようやく后を迎えると決まり、閨の指南役に選ばれたのは——華やかな後宮を舞台に紡がれる、東洋ファンタジー・ラブロマンス。

  rakuten_caption: 大好きなランスロットと政略結婚したものの、愛されることは望まないオルタンシア。傷物の自分は彼にふさわしくないと、いつかは身を引く覚悟をしているがーーランスロットは無表情な妻がふと見せる笑顔に、心惹かれていく。そんな2人を居候のヴィヴィアは妬み、ある計画を思いつく。オルタンシアを男に襲わせ、自分がランスロットの妻になるのだ!ところが計画は思わぬ方向へ進んで……?最強騎士×片想い令嬢、想いが募ってついに初夜!?甘くて激しい（!?）純愛ロマンス第2巻!

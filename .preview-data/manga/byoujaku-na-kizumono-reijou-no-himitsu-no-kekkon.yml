catch: 愛されることは望まないと決めた妻と、恋を知らない最強騎士。愛のない政略結婚のはずが、距離は少しずつ縮まっていく。
synopsis: 婚約者の浮気で破談となった帝国最強の騎士ランスロットに、隣国の令嬢オルタンシアとの縁談が舞い込む。病弱で傷物と噂される彼女は、なぜか最初から彼に釘付けで——愛なき結婚のはずだった。

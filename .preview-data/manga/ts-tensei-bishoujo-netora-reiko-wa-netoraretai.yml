    前世で数々のカップルを破局に追い込んだ男は、天使の如き美少女・音虎玲子に転生を果たす！そんな玲子の望みはただ一つ、“最高の寝取られを味わう”こと!?玲子は理想の寝取られシチュを作るため、己の美貌と計算しつくされた策略によって、幼なじみのユウくん、その友達の冬木くん、そして同じ文芸部の由利ちゃんと、男女関係なく次々とその毒牙にかけていきーー!?寝取られ大好きTS美少女が、全てを欺き幼なじみの脳破壊を目指す、最低で最高なラブ(?)コメディー開幕！'

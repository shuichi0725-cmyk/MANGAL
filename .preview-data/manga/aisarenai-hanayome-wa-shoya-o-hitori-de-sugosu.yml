  rakuten_caption: '夫と妹の裏切りを目の当たりにし、初夜をたった一人で過ごすことになったアルビナ。

    彼らへの復讐を誓い、綿密な計画を巡らせた彼女は、ついに二人を絶望の底へと突き落とす。

    復讐を果たしたアルビナは、一人新たな地へと旅立つ。そこで出会った青年ロスルドに真っ直ぐな想いを寄せられるも、

    過去を知るルサラの出現により、穏やかな日々は再び波乱に包まれていく。

    「許されるなら私も恋をしてみたい」復讐の果てにアルビナがたどり着く、本当の幸せとはーー。'

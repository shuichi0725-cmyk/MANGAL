    description: ひょんなことから、商店街対抗の駅伝大会に赤組のアンカーとして出場することになったきょう。それを聞いた金子は、白組のアンカーに銀子を出場させることを決める。そして迎えた駅伝当日、あすの応援に応える走りを見せたいきょうと、特別コーチとトレーニングを積んできた銀子のアンカー対決の行方はどうなるのか。姉妹だけの貧乏暮らしだけれど、いつも仲良く明るく生きているきょうとあす。ある日、叔母さんに誘われて行った遊園地で、行方不明になっていた父親を発見する。ハートフルコメディの感動の最終巻。

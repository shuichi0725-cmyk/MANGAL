synopsis: 憧れの漫画家・茜部明のアシスタントを務める崎枝公樹。彼女はいつも何かと崎枝を褒めてくる。このままでは惚れてしまうと悩む崎枝に、茜部は突然交際を申し込み——。照れ知らずに褒めちぎる先生と受け止める青年の日常コメディ。
catch: 憧れの漫画家のアシスタントになったら、先生がいつも照れ知らずに褒めてくる。このままでは惚れてしまう——そんな彼に先生は突然交際を申し込み。

synopsis: '『君と幸せになるためのキス』

  コウキにとって初めてとなる同人誌即売会。二人で協力して仕上げた本が買ってもらえるか緊張するコウキの隣で見守る茜部先生だったが…!? 他にも『紅の魔女』読者からの恋のお悩み相談を受けたり、ケモミミの茜部先生に甘えられたり、各務から彼氏とのデートの話があ'
catch: 憧れの漫画家のアシスタントになったら、先生がいつも照れ知らずに褒めてくる。このままでは惚れてしまう——そんな彼に先生は突然交際を申し込み。

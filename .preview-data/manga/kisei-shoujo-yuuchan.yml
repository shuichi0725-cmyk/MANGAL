  rakuten_caption: '「もう一度、私とひとつになろう。」

    自我を失い暴走した茂木の救出を試みる、ゆうとエイリアン。その決死の作戦の結末は…!?

    さらにとうとう姿を現したもうひとりの寄生生物・ミカ。地球上の生物たちの命と引き換えに、エイリアンとの同化を求めるミカとの対決は不可避…だけどゆうと寄生生物の関係には不和が生じてしまい…!?

    そしてついに明らかになる、寄生生物の出自とゆうがニートになった衝撃の過去。すべてを思い出したゆうはエイリアンを救うため、この奇妙な日常で出逢えた多くの仲間たちの助けを借りて『運命の場所』へと激走する…！

    種族も生まれた場所も超越したちょっとヘンテコで、でも温かな「ともだち」の物語、大団円の最終巻！'

    description: ノヴァとの戦いで意識を失ったガリィが目覚めると、そこはザレムだった。しかしテクノロジーの楽園と思われていたザレムは荒廃し、死と暴力が充満する地獄と化していた。親友のルウを助け出すため、ガリィはザレムの中をさまよっていく。空中都市ザレムがすべてを支配する未来、地に残されたわずかな人類はザレム直下に吐き出されるゴミ溜めの周囲に寄り添って、なんとか生き延びていた。人とは何か、生とは何か。スクラップ場より再生したサイボーグ少女は、過去と現実、肉体と機械の狭間でもがきながら宿命へ立ち向かう。初期短編の飛人を特別収録。

synopsis: 秋山と中村さんは正反対。すぐ動揺するオタクの秋山には、派手で社交的なギャルの中村が関わってくる世界など想像もつかない。だが命を救われたことをきっかけに、彼女はとんでもない要求を——一緒に暮らそうと言い出す。秋山から離れると赤面して動揺する、ギャップ系ラブコメ。
catch: 動揺しがちなオタクと、派手で社交的なギャル。本来交わらない二人が、ある出来事をきっかけに同居宣言。実は離れると赤面しちゃう、ギャップ系ラブコメ。

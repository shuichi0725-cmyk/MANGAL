synopsis: 婚約者のもとから水樹を救い出した一真たちに、卒業の足音が近づく。仲間との思い出とざわめく想いを胸に、それぞれが選ぶ未来と、一真へとつながる五つの縁の行方が描かれる完結巻。
catch: 婚約者の元から水樹を救い出し日常を取り戻した一真たちにも、卒業の足音が近づく。思い出とざわつく想いを胸に、それぞれが選ぶ未来とは——五つの縁が行き着く先を描く、再青春やりなおしラブコメ堂々完結。

  rakuten_caption: '「ゆ、ユーグラムになってるううう!?」

    ゲーム化された原作のファンタジー小説『聖なる勇者アイリス』。男はある日、その作品に登場する悪逆非道のキャラクター、最強のラスボス・ユーグラムに転生していた!? 念願の異世界転生を果たしたものの、死の宿命を背負った存在への転生は喜べるはずもなく……。悲劇の未来を回避するために亡命を思いつくと、主人公である敵国の王女・アイリスのいる王国へと向かった。目指すは、悠々自適な贅沢三昧王国ライフ☆ そして、筋書きになかった邂逅が果たされた時、二人の運命は新たな方向へと変わり始めていく！

    敵国に寝返った最強ラスボスと、清楚可憐（ちょっぴり脳筋）な主人公の、イチャラブ＆チート亡命ライフ、開幕!!'

  rakuten_caption: '「僕も一緒に背負ってあげる」


    いよいよ呪いの儀式の生贄になるミーシャ。

    心配した伯爵は予定をずらす提案をするが、

    ミーシャは決行への意志を曲げない。


    それは幸せな暮らしを続けるためでもあり

    伯爵の特別になりたいという願いでもあった。


    やがてレノ城には人を殺める呪いの依頼が届く。

    それは常に生贄が死んでしまう儀式だった。

    「この私に失敗など決してない」と豪語する伯爵だが──


    呪う者とその生贄。二人は夜を越えることができるのか。

    《死なない生贄》になるための本格ダークファンタジー、ついに完結！'

    ゆるキャラヒーロー「ぱんぶぅ」の着ぐるみバイトをしている帆菜。

    街の平和を守るためこの正体はゼッタイばれちゃダメ！

    なのに、「帆菜」にも「ぱんぶぅ」にも優しい生方くんにドキドキがとまらなくて…。


    七夕まつりですれ違ってしまった帆菜と生方くん。

    さらに新しい「相棒」の間宮くんの活躍で波乱の予感！？


    中の人バイト女子×隣クラ激メロ男子の絶対にバレてはいけない恋、

    恋が加速する第2巻！'

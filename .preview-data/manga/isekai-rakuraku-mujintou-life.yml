  rakuten_caption: '『無人島に何か一つ持っていくなら？』

    どこにでもいる普通の男子・工野創助は、真っ白な空間にそんな一文の書かれた黒板がある、奇妙な夢を見た。スマホにお菓子、ナイフなど、クラスメイトたちが次々と無人島あるあるの回答をしていく中、創助は──

    「俺が持っていくのは、クラフト能力だ！」

    すると次の瞬間、創助たちは突如謎の光に包まれた。そして目を覚ますと……異世界無人島にクラス転移していた!? しかし、創助は与えられたクラフト能力を駆使して、幼馴染のクーデレ巨乳美少女・千癒と一緒に異世界無人島をラクラク攻略していく。そして始まる、オタクに優しいギャルや清楚系美少女、真面目委員長たちに囲まれる日々──。

    快適＆快感！ 巨乳美少女たちとのえっちなハーレムスローライフ、開幕──!!'

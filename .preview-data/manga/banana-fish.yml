synopsis: 美しい容姿に生まれ、しかし非情な殺し屋として育てられた少年アッシュ・リンクス。「パパ」と呼ばれる男ディノ・ゴルツィネの養子として育てられた彼は、17歳にして反逆を決意する。だがその男が握る、兄を狂気に追いやった忌まわしい秘密が、日本から来た純粋な青年・英二と出会った矢先に絡みついてくる。サスペンス。

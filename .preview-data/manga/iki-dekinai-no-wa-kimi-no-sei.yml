synopsis: '「これからも一緒にいてね」「いいよ、いてやる」


  バーの店長業にも少し慣れ、

  再び穏やかな日々を過ごす志筑と矢野。


  楽団では志筑不在が続く中、

  新入団員が矢野に好意を寄せ始める。


  志筑との恋人関係を

  隠さずに周りに言いたいと

  矢野は思うようになって…？


  大ヒット日常BL、堂'

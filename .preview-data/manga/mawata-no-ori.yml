synopsis: 古風で地味でおとなしい——それがハルカの印象だ。幼い頃から両親を助け、結婚してからは夫に尽くしてきた。ある日、母が怪我をして介護を頼まれるが、夫は難色を示す。実家は離婚して帰ってこいと言い、ハルカは思いもよらぬ強さで応える。

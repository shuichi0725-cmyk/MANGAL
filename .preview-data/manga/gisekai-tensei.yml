  rakuten_caption: 20XX年、不治の病に侵された東都規は、治療薬が完成する未来を信じ、長期間コールドスリープに入る。しかし、目覚めた彼を待っていたのは、二つの月が浮かび、邪神の眷属が跋扈する異世界だった。トキを“伝説の聖勇”と歓待するエルフ族に戸惑うも、言われるがまま世界を救う旅へ。現実離れな状況に「フルダイブVRだ」と冷めた気持ちでいたトキだったが、その世界には驚愕の真実が隠されていた。果たしてここはVRの偽世界なのか、あるいは本当に異世界なのか。ミステリーの名手が放つ、衝撃の異世界転生譚、待望のコミカライズ！

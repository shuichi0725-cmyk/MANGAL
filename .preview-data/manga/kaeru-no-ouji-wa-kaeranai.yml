  rakuten_caption: '人里離れた“迷子の森”で暮らす、落ちこぼれ魔女・ベルニカ。

    魔法が苦手な彼女が唯一使えるのは、『人をカエルに変える魔法』だけ。

    そんな彼女の前に現れたのは、貴族の青年・イアン。

    しかし、彼との出会いによって封印の腕輪が壊れ、ベルニカの魔法が暴走。

    イアンをカエルに変えてしまったベルニカは、彼を元の姿に戻すため奮闘することにーー!?


    落ちこぼれ魔女と、カエルになった青年が織りなす、魔法と運命の物語。'

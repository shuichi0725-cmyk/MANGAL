  rakuten_caption: 'アルビノの大学生・波多棗。就活中に「教養が足りない」と言われ、半ばヤケになりながら学芸員の資格を取ることにした彼に、東洋美術館でのインターンの話が舞い込む。向かった美術館で待ち受けていたのは予想外の仕事の連続と、個性的な学芸員たち。そこで彼は、「陰の芸術」と運命の出会いを果たすこととなる…！　

    美術館学芸員の仕事って？ 仏像や浮世絵の楽しみ方って？ 知られざる美術館の裏側を描く学芸員お仕事マンガ！'

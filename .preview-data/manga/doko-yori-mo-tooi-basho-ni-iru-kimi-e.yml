  rakuten_caption: '忘れない、未来よりも遠い場所にいる君を。

    ある秘密を抱えた月ヶ瀬和希は、知り合いのいない環境を求め離島の采岐島高校に進学した。采岐島には「神隠しの入り江」と呼ばれる場所があり、夏の初め、和希は神隠しの入り江で少女が倒れているのを発見する。病院で意識を取り戻した少女の名は七緒、16歳。そして、身元不明。入り江で七緒がつぶやいた「1974年」という言葉は？'

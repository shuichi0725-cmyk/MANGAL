  rakuten_caption: 'つぎラノ 2025 文庫部門第1位獲得！

    『異種族レビュアーズ』の天原、ラノベデビュー作が待望のコミカライズ！

    『魔族を仕込んでハーレム作る』のアルデヒドが鮮やかに描く！


    「よし……温泉ダンジョンを作るぞ」

    現世で命を落とし、転生後突然ダンジョン経営を任せられた俺。

    俺を転生させた悪魔っ娘ーーペタちゃんに命じられたのは、

    ダンジョンにたくさんの人を呼び込み、大きくすること。

    それに必要なのは宝物？強いモンスター？

    いいや違う、温泉だ！

    転生先で「温泉」経営始めます。

    反則級の異世界経営譚、開幕！


  rakuten_caption: '絶対に復讐する。この命に代えてもーー。

    閉鎖的な田舎・阿加田町（あかだまち）に住む男子高校生・中川栞（なかがわしおり）の家に、 ある日突然、佐藤冥（さとうめい）という少女が同居人としてやって来た。 突然の同居に戸惑う栞に対し、冥は衝撃の目的を告白する。 「殺してやりたい人間が七人いるの」 いじめで自殺した姉・明里（あかり）の仇討ちのため、 冥は古の血塗られた祭儀”オカカシツツミ”を行い、 神様の力を借りた壮絶な復讐殺人を計画する。だが彼女の行く末には、ある残酷な運命が待ち受けていて…。'

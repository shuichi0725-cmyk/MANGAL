synopsis: 辺境の農業領地出身、下級貴族の娘アメリア。彼女は領地に必要な土魔法を授けてくれる相手リースと幼い頃から婚約していた。政略結婚ながら仲は良かったが、リースが王立魔法学院に通い始めてから様子がおかしくなり、連絡も途絶えてしまう——。ファンタジー・ロマンス。
catch: 幼い頃から仲の良かった婚約者が、学院に通い始めてから様子がおかしくなり連絡も途絶え——下級貴族の娘アメリアの行く末を描くファンタジー・ロマンス。

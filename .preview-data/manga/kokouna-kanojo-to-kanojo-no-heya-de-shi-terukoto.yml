  rakuten_caption: '『孤高の氷姫』と呼ばれクラスで一目置かれる美少女・小鳥と、陰キャでボッチな拓海。

    教師の中では交わらない二人には放課後小鳥の部屋で誰にも言えない秘密があった。


    それは小鳥が意を決して行動を起こす際、必要としている人には言えない淫靡なルーティンであり、拓海はその協力者だった。

    必要最低限だけ衣服を乱して、事務的に身体を繋げる。

    そこにはキスも会話もない。


    そんな二人の前に理想を体現したような、生駒瑛という不思議な先輩と出会う。

    これは不器用な二人が手探りで色んなことに挑戦し、実績を解除し、リア充を目指すちょっぴり不道徳な青春攻略・・・。'

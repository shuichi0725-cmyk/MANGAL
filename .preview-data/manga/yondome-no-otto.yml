  rakuten_caption: '伯爵令嬢の藤林美青（ふじばやし みさお）は、三人の夫に次々と先立たれ、夫を呪い殺す女という不吉な噂を立てられていた。


    三番目の夫の葬儀中に 、大地主で豪商の富嶋基（とみしま はじめ）が借金の取り立てに現れる。


    基は、亡き夫の借金を帳消しにする代わりに美青を嫁にもらいたいと持ちかけてきた。

    また夫を殺すことになると躊躇するも、病弱な父の後押しもあり結婚を受け入れる。

    一方、基は呪いの噂を承知で受け入れた理由があるようでーー？


    二人の訳あり結婚の行方と美青に起きる死の連鎖の謎に包まれた美麗ミステリーロマンス第1巻！'

synopsis: 賢く生きることを信条とする高校生・秋田正道は、暴力至上主義を掲げる女子高生・六道刹那と出会う。不良に絡まれたところを刹那に救われた彼は、その圧倒的な強さに惹かれ、戦い方を教えてほしいと頼む。秋田が「暴力」の世界へと足を踏み入れていくアクションドラマ。
catch: 賢く生きるはずだった高校生が、暴力至上主義の女子高生に救われた。圧倒的な強さに惹かれ、彼は拳の世界へ踏み込んでいく。痛みと熱のアクションドラマ。

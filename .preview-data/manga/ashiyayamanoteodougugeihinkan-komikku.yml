synopsis: 神戸・芦屋山手にある古い洋館には、織田信長ゆかりとも噂される茶器をはじめ、国宝級の道具の付喪神たちが暮らしていた。そこへ住む先生のもとに、ある日ひょっこり現れた来訪者をめぐり、賑やかなおしゃべりが響くあやかし譚。
catch: 芦屋山手にたたずむ古い洋館に響くのは、付喪神となった茶器たちの楽しげなおしゃべり。彼は織田信長が愛した名器なのか——皆が国宝級の器に囲まれた、ほっこり和める付喪神ファンタジー。

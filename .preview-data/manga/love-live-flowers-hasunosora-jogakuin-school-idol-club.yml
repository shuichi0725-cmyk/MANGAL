  rakuten_caption: '少女たちが紡ぐ青春群像劇、開幕っ！

    高校生活で「花咲きたいっ！」と期待に胸を膨らませ“蓮ノ空女学院”（通称“蓮ノ空”）へ入学した日野下花帆は、入学初日の金沢駅で、高校からは「自分を変えたい！」と意気込む村野さやかが階段で足を滑らせたところを助ける。偶然にも、2人は同じ学校のクラスメイトだった！
    友達になった花帆とさやかはそれぞれ、乙宗梢と夕霧綴理の公演を目撃！ 興奮冷めやらぬなか、“蓮ノ空女学院スクールアイドルクラブ”に誘われて──!? “ラブライブ！”シリーズ・集英社初コミカライズ、第1巻♪'

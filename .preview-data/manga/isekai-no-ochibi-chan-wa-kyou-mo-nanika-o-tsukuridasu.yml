  rakuten_caption: ある日、自分が異世界転生したことを思い出した小さな女の子、おチビ(5歳)。おチビは、想像したものを創り出せる【想像創造】スキルを持っていました。ポーション作りの依頼をこなしたら、まさかの特別なポーションができあがり！ハンターギルド受付嬢アイリーンをおチビたちの家に招待したら、領主の娘ベアトリスと鉢合わせ！そして、おチビの母親を名乗る怪しい女性に話しかけられ…。少年「おにぃ」と少女「ねぇね」がおチビを守ろうとするハートフルストーリー5巻!!!

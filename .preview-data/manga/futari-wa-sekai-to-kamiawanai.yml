  rakuten_caption: '吉葉愛生、社会人1年目、ASD（自閉スペクトラム症）。周りの人と見えている世界が少し違う愛生（メイ）は、快活な性格で社内の人気者である小枝さんに淡い恋心を抱き、彼の役に立とうと持ち前の集中力で仕事に邁進するも、失敗ばかり。

    そんな傷心の愛生を見かけた小枝さんは、“二人だけの秘密”を打ち明けることにーー。

    俊才・青目槙斗が当事者の目線で描く、

    「この世での生き辛さを抱えた二人の、笑って泣ける純愛物語。」'

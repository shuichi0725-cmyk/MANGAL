  rakuten_caption: '私の幸せなんて関係ない、ただ役目を果たすだけーーー


    時は大正ーー

    京都の華族である御厨家で、一人娘・綾子の侍女として働いている七生。

    お仕えしている綾子は女学校を卒業し、

    許嫁である華乃宮の子息との結婚を控え、幸せな日々を過ごしていた。

    そんなある日、多額の借金を抱える御厨家に、

    東京でも有名な成金として知られる志波家が

    融資をする代わりに綾子との婚姻を申し入れてきて!?


    侍女・七生、一世一代の大博打ーー

    お嬢様の身代わりとして成金・志波家へ嫁ぎます!'

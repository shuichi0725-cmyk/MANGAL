synopsis: '「想像には際限がない、

  脳内に生み出されたものが一番怖いんだよーー」


  栞奈は同級生の三宮に誘われて

  他校の美術部部員 九重香織と三人で甘味を食べに行くことに。

  その前に、香織は品評会に油絵を提出したのだが、

  後日、品評会の会場から香織の絵だけが消えてしまっていた！

  現場に足を運'

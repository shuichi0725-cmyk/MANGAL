  rakuten_caption: 'ブラック企業で働く古賀一希は、ある夏、突然糸が切れたように退職して実家へと戻ってきた。

    けれどそこはとにかく田舎で、あるものは広大な自然のみ。

    やることもなくだらだらする毎日を送っていたが、ある日道端でひとりの男性ーー三宅葉太に声をかけられる。

    話を聞くと彼はこれから「陶芸教室」を開く予定の陶芸家だという。

    そこで一希は陶芸体験の練習相手として、陶芸に初挑戦！

    すると、みるみるうちに陶芸の魅力にとりつかれていき…？


    そしてこれをきっかけに、事務仕事が苦手な葉太に代わり、

    なんと一希は陶芸教室の事務スタッフとして、アルバイトを始めることに。

    田舎ではじまった新生活。陶芸を通じて、一希は新たな出会いや価値観に巡り合う。'

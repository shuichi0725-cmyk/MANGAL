  rakuten_caption: "「やろ？ すげー凛ちゃんとシたい」　抗えない、ダウナー“沼”攻\n\n「この顔、どストライクなんだよね」 \n料理代行の面接で、大人気ストリーマー黒八木侑里（くろやぎゆうり）の家を訪れた凛太郎（りんたろう）。\nところが生活力皆無のダウナー男に“デリヘル”と勘違いされ、初対面でいきなりべろちゅーをかまされる大事故が発生！\n \n自由奔放でノンデリな態度に呆れつつも「絶対真人間にしてみせる！」と奮起し、自慢の料理で侑里の胃袋をつかむことに成功するが…\n\
    気だるげな瞳で無邪気に甘えられ、気を許したのが運の尽き。\n\n「俺だけの凛ちゃんだったのに」\n\n抗えないSっ気攻めの独占欲に、身も心も蕩かされ喰い尽くされるーー。\n年下ダウナー沼男子×恋に不器用な美人飯スタント。\n雇用関係から始まるズブズブ甘い執着ラブ"

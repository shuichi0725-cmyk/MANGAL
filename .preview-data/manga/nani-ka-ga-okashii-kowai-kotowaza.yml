  rakuten_caption: 'ことわざ×ホラーショート　新感覚の「怖い」がここにある…。

    その意味に気づくとゾクッと怖い、世にも恐ろしいショートまんが＆超ショートストーリー200本以上！


    「石橋を叩いて渡る」「猿も木から落ちる」だれもが知るあの「ことわざ」は怖い世界への入り口だった…！？

    けんかの仲直りや、道ばたでのささいな会話、虫取りにハイキングなど、一見するとありきたりな日常の1コマ、だけど何かがおかしい…！？

    超短文なのに、意味が分かるとゾクゾク怖さがにじみだす。珠玉の超ショートショートまんが＆読み物。


    サクッと読めて、ゾクッと怖い！

    一度ハマったら抜け出せない、「怖いことわざ」の沼へようこそ…。'

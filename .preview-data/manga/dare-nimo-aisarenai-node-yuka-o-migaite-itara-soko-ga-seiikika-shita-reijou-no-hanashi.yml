synopsis: 家族の愛も神の授ける才も与えられなかったステラ。婚約者の心を妹に奪われ、彼女は修道院へ駆け込む。そこで掃除の喜びに目覚めた彼女は、瘴気に満ちた部屋に閉じこもる悩める王子セシルのメイドとなり――。コメディ・ファンタジー。

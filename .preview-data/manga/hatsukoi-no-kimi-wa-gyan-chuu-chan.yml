  rakuten_caption: '「私、大きくなったら宗ちゃんのお嫁さんになるの」

    そう言い残して海外へと引っ越していった初恋のキミ。


    そんな彼女のことを忘れられずに大学生となった宗則（むねのり）は、

    大学で初恋のキミと奇跡の再会！　をしたのだが…。


    再会をした彼女はギャンブル大好きのゴリゴリなギャルになっていた！？


    そんな彼女にも幼少期の面影を見出していた宗則は、

    自由奔放な彼女に振り回されることに…。



    宗則とその友達をも巻き込んだ

    ちょっと変わった大学生活が始まる！'

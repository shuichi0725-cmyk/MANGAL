  rakuten_caption: 体が大きく、男子の輪にもよく馴染んでいる高校生の航希。けれど内心では、会話の内容に戸惑ったり、植物に詳しいことを素直に話せずにいた。ある日、クラスに転校生の岬がやってくる。でもその姿がなぜか航希にだけは見えなくて……。周囲は何事もないように接しているけど、どんな表情で話しているんだろう。いつの間にか岬を目で追うようになった航希は、彼を通して知らなかった世界と向き合うことになっていくーー。

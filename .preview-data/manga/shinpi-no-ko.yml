synopsis: 卒業式の日に事故に遭った高校生・七色楽は、公爵家六男ルルクとして異世界に転生する。だが魔術が使えず家族に虐げられる日々。早く家を出ようと焦る中、自分が『数秘術』の才を持つことに気づき成り上がっていく。
catch: 魔術が使えず家族に虐げられる転生先で、楽が見出したのは未知の力『数秘術』。落ちこぼれの烙印を覆し、独自の術で運命を切り拓く。数の神秘で成り上がる、異世界ファンタジー。

  rakuten_caption: '「菫、今夜は手加減できないかも」

    「触れて、触れられて。藍澤さんの熱にのまれていく」


    図書館司書として働く長月菫（ながつきすみれ）と

    大人の色気漂う実力派俳優・藍澤千尋（あいざわちひろ）。


    芸能人との年の差恋愛に戸惑いながらも、

    ふたりの関係はゆっくりと、しかし確実に熱を帯びていく。


    クリスマスが近づくある日、

    藍澤さんから提案されたのは「はじめてのお泊り旅行」！

    期待と不安に揺れる菫の姿が、

    余裕たっぷりだったはずの彼に火をつけてーー


    けれど幸せ絶頂のなか、

    藍澤さんが元婚約者と、新年特番で共演しなくてはならないことに…

    さらに菫の同僚・湯川（ゆかわ）くんが、菫に急接近!?


    年齢も身分も違うふたりの恋は、

    波乱万丈で、甘くて本気でーー…

    想い絡まる第2巻！'

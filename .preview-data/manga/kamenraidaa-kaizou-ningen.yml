  rakuten_caption: '1970年創刊の「学研の図鑑」シリーズに、“仮面ライダーの改造人間”を徹底解剖する異色作『学研の図鑑　仮面ライダー「改造人間」』が加わる！　動物・昆虫・恐竜の代わりに並ぶのは、悪の組織がサイボーグ技術と動植物の力を融合して生み出した超越存在ーー改造人間だ。空を飛び、地を駆け、水中を泳ぐ。彼らはどんな能力を与えられ、どんな環境に適応するよう設計されたのか。本書はその“生態”を、学習図鑑の視点で読み解いていく。収録数は約600体、写真・イラストは約1200点超。ページをめくるたび、図鑑ならではの密度と発見が押し寄せる！


    ●約600体を網羅する圧倒的データ量

    昭和の仮面ライダー作品に登場した改造人間を約600体収録。キャラクターの羅列ではなく、“図鑑として俯瞰できる物量”が魅力となる。


    ●約1200点超の写真・イラストでビジュアル満載

    文章だけでは伝わらない造形の情報量を、写真とイラストで一気に補強。眺める楽しさと、読み解く楽しさが両立する。



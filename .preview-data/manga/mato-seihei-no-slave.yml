synopsis: 数十年前、日本各地に異界「魔都」への門が現れた。そこに実る「桃」を口にすると特異な能力を得られるが、それは少女に限られる。気弱な高校生・和倉勇気は魔都に巻き込まれ、魔防隊七番隊の美しき隊長・宇善京香に救われ、隷属を命じられる。
catch: 異界「魔都」の門が日本に現れた時代。気弱な高校生が魔都に巻き込まれ、美しき隊長に救われ隷属を命じられる。少年と少女戦士のアクション。

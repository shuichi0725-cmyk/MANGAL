synopsis: 人間の強い意志と自然の厳しさがせめぎ合う東北地方。奥羽の山々には今も銃声が絶えず響く。深い知識と技をもって獲物を仕留める「マタギ」と呼ばれる狩人たちだ。自然は敵でもあり唯一無二の友でもある。山の香りに満ちた、彼らの目を通して語られる冒険譚。

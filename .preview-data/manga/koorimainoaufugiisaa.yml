synopsis: '「アウフギーサー」とは、

  ドイツ発祥のサウナ文化「アウフグース」でパフォーマンスを行う専門家のこと。


  かつて将来有望なフィギュアスケーターであった穂村葵は、

  怪我のせいで引退に追い込まれてしまった。

  未来に絶望しふさぎ込んでいたところ、

  「アウフギーサー」を目指す一人の少女と出'

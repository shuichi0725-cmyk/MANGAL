  rakuten_caption: 働きものの父と美しい母を亡くし天涯孤独になった青年のシャルル。両親が遺してくれた人里離れた家で慎ましく暮らしていたが、ある日家の前で行き倒れていた男を拾う。その正体は偽聖女に嵌められ元婚約者を断罪しようとするも、自らが返り討ちにあって王都を追放された元王子・リュシオンだった!　瀕死のところをシャルルに甲斐甲斐しく世話をされ、みるみるうちに体調が回復したリュシオンは、命の恩人であるシャルルのためにこれまでやったことのない家事や料理にも挑戦。ひとつ屋根の下、孤独な者同士で穏やかなスローライフを送るうちに互いに惹かれあうが…!?

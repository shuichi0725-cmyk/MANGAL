  rakuten_caption: 'かつて“冷酷皇帝”と畏れられた大陸の覇者は幼女の姿で今世に転生し、冒険者ユーリとして第二の生を謳歌していた。

    しかしそんなユーリの暮らす街で次々に不穏な出来事が。

    疫病、領主一家の暗殺、市民の暴動ーー…一連の騒動の裏にはどうやら黒幕がいるようで……？

    街を蝕む悪の芽を潰すべく、最強幼女の暗躍が始まるーー。'

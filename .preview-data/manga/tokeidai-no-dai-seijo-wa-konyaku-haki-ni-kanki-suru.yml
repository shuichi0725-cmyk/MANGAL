  rakuten_caption: '「お前との婚約を破棄する!!」

    公爵令嬢・ヴェロニカは、卒業パーティーで婚約者・デレックから婚約破棄を言い渡される。しかしその瞬間、ヴェロニカは心の底から歓喜した──

    遡ること6年前。ヴェロニカは、幼馴染の第二王子・エドゼルと王国で崇められている大時計台を訪れ、ひょんなことから大聖女候補になってしまう。さらに、学園で悪名高い第一王子・デレックとの婚約まで決まり、危機的状況に追い込まれる。

    婚約を解消させる唯一の条件は、18歳までに大聖女として才能を開花させることだった。大聖女・バーシアのもとで修行の日々を送るが、ヴェロニカに降りかかる試練は困難なものばかり。それでも諦めず、誠実で前向きに励むヴェロニカの姿を遠くから見守っていたエドゼルはある想いが芽生えて…

    運命の秒針が動き出す、ファンタジー×ロマンスストーリー、ここに開幕──！'

  rakuten_caption: '熱烈ファンの後輩ワンコ×魔性な天才ゲーマー

    信仰から恋へ着火する、もだもだラブ！


    格闘技のゲームで活躍中の新鋭プロゲーマー世良は、ゲイを公表して活動している若手選手。

    まだまだ旧体質な業界では、感じの悪いファンに絡まれたりもするけれど、

    そんなときは、かつて格ゲー界で圧倒的な人気と実力を誇った末、突如姿を消した憧れの神ゲーマー・イガラシを思い出して、心を奮い立たせている。


    イガラシへの気持ちは、もはやファンを超えて信仰のようになりつつある世良なのであった。


    そんなある日、リアル対戦会にゲスト参加していた世良に対戦申込みの声がかかる。

    声の主は見間違うはずもない、毎日のように映像や記事で見返していた「イガラシ」本人でーーー!!!?'

  rakuten_caption: '届かない一番星（恋）だと思ってた


    地方の小さな町で不動産屋として働く智基（ともき）の生き甲斐は、人気アイドルグループ「RAYZ.」（ライズ）のメンバー・彗（すい）を推すこと。

    彼は智基にとって高校の同級生であり、ずっと忘れられない“初恋の相手”でもあった。

    ところが半年前、突然の解散発表とともに彗は表舞台から忽然と姿を消してしまう。

    行方をくらました彗を想い続ける智基だったが、なんと本人が客として物件探しに現れてーー!?


    地元に戻ってきたミステリアスな元アイドルと、世話を焼くことになった一途なファン。

    欲情を隠して“友達”として関係をリスタートする二人だが、触れるたび「推し」と「初恋」の境界線が溶けていき……。


    「本当は何度も思ってた…彗に抱かれてみたいって」


    眩しすぎる彼との格差が甘くほどける、運命の再会ラブ！'

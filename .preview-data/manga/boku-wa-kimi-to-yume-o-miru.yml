  rakuten_caption: '生まれつき身体が弱く、苦労しながら高校生活を送る太陽。

    ある日、体調を崩した太陽は保健室へと向かうが、そこには先客である3年生の先輩・葵人が眠っていた。

    目を覚ました葵人に促され、戸惑いながらも同じベッドで添い寝をする太陽。


    知らない先輩と添い寝した日ーー。


    人との距離感が近い、不思議な先輩との出会いによって、太陽の不器用な日常が予想もしない方向へ動き出す。'

    description: 青い空、緑の大地、そして光輝くカリフォルニア。だがこの土地にも、いいことばかりがあるわけではない。父親との確執や兄へのコンプレックスといった人間関係のきずなを振り切るように、高校をドロップアウトしたヒースは冬のニューヨークへやってきた。相棒で同居人のイーヴ、悪友のブッチ、その妹で恋人のスウェナ。灰色の空の下、大都会の片隅でひとつの青春が始まる。吉田秋生の名を世に知らしめた初期の傑作青春ロマン。

    description: カリフォルニアでは散々だった。どう望んでも兄のテリーのようにはなれないと悟ったヒースは、自分の存在を賭けて父親と対立する。すさんだ気持ちはエレインとの出会いによって癒されるが、不良グループによって麻薬中毒にされてしまう。閉ざされたヒースの心を開いたのは、東からの旅行者であるインディアンだった。そして二年後のニューヨーク。二十歳になったヒースは、イーヴの愛の告白に呆然とする。

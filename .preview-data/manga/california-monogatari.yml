    release_date: '1980-04-24'
    description: 立て続けに悲劇がヒースを襲う。イーヴがホテルの窓から墜落死したのだ。しかもその死に不審を持った警察は、ヒースを有力容疑者として調べ始める。窮地に追い込まれたヒースだったが、友人たちの協力で真犯人を突き止める。西のカリフォルニア、東のニューヨーク。アメリカの両岸に生きる若者の夢と現実を描いた青春ロマンの完結編。番外編の夢の園も収録。

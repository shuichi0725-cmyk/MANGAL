    description: テリーが死んだ。その知らせを受けて帰郷したカリフォルニアは、人も街も少しずつ変わっていた。おまえのようになりたかったと綴られた亡き兄の手紙に、ヒースは激しく打ちのめされる。さらに自分を捨てて去った母親と再会したことで、家族を拒否し続けてきた心が少しずつほぐれていく。その頃ニューヨークでは、ヒースをめぐるイーヴとスウェナの三角関係が緊張の限界に達していた。そしてイーヴが出ていった。

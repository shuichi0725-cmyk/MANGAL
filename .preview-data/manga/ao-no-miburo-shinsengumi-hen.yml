synopsis: '「この京でこの人たちに血を流して欲しくない」

  “京の町を守る”ため、におたち三匹の狼は 新選組を離れ、御陵衛士へ。小さき務めにも真摯に向き合い、周囲の心を動かしていく。

  一方、新選組と御陵衛士の間者として立ち回る藤堂。沖田の代わりに双方を繋ぐ架け橋となれるか…。そして、突如現れる'

  rakuten_caption: '「オレがいるのに、必要ないじゃないですか」

    推しだったはずの彼と、静かな恋が、動き出す。

    国民的俳優（休業中）とのヒミツの家事契約ラブストーリー！


    休業中の国民的俳優・アオイとの“家事契約生活”は、

    まさかのお隣生活へ突入!?

    仕事と育児に追われるファッション誌編集長・佳乃と、その息子・晴人を、

    ヒミツの家事代行として支えるアオイ。

    ところが、アオイの敏腕マネージャー・本郷の登場で、秘密の契約生活は大波乱！

    そんな中、佳乃の発案で一行は温泉旅行へ。

    家族みたいな時間、すれ違う本音、そして予想外の急接近ーー…。

    ヒーローとの距離がますます縮まる、胸キュン加速中の第2巻！'

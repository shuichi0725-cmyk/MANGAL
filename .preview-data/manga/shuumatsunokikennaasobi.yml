synopsis: 妹の結婚式のため花婿付添人の医者ハリーを空港へ迎えに行く――簡単なはずのミッションだった。だが一目見てケイトの心は騒めく。情熱的な一夜のあと、相手が完全な人違いだったと気づいて――。すれ違いのロマンス。
catch: 情熱的な一夜を過ごした相手が、まさかの人違いだった――。妹の結婚式で出会ったセクシーな医師ハリーに、ケイトの心は揺れ動く。すれ違いから始まる、大人のロマンス。

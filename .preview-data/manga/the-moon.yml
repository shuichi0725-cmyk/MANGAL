synopsis: 「ザ・ムーン」は、大富豪のバロンが2兆5千億円(当時)を投じて造り上げた巨大ロボット。神は死んだと説くバロンは、悪に満ちた世界に正義をもたらす新たな力としてムーンを生み出した。彼はその操縦を、真の正義を見出せる純粋な心を持つ少年たちに託す。SFメカアクション。

catch: 酔った勢いで呼び出したのは、家事万能で超癒し系の小さな悪魔。限界OLの生活が、今日から改善されていく。
synopsis: 限界独身社畜OLのイノリが酔った勢いで召喚したのは、寿命の半分と引き換えに願いを叶えるという小さな悪魔・メギ。願いが決まるまで居候することになった彼は、なぜか家事万能だった。

    オトギやラーレ、ユキヒコらと海に遊びに行ったイノリとメギ。「このまま時間が止まればいいのに」とつい思ってしまうような幸せな時間だったが、直後のメギの帰省で「別れ」についても向き合わなければならないと悟るイノリ。


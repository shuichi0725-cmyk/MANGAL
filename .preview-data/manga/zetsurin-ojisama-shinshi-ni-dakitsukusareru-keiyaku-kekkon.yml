  rakuten_caption: '激重一途な独占欲にとろける　純愛▽契約結婚


    切り盛りしていた食堂を手放すことになり、借金を抱えることになってしまった日菜（ひな）。

    途方に暮れていたところ、食堂の常連・小鳥遊（たかなし）さんから契約結婚を提案されて…!?　


    大人な色気とスマートな振る舞い、ずっと憧れていた小鳥遊さんの思いがけない提案を思い切って受け入れることにした日菜。


    ところが、契約結婚のはずなのに、待っていたのは昼夜問わずトロトロに愛し尽くされる日々！

    「触れるたびにナカが締まって、エッチな身体だ」

    ダメになりそうなくらいアソコを舐められて、硬いオスでゆっくり満たされてーー

    初めてのカラダを外とナカからいじられて、こんなの知らない…っ

    早く欲しくて、たっぷり潤ったアソコがヒクヒク疼いちゃう…

    甘くて幸せな快感が何度も押し寄せて止まらない…!!'

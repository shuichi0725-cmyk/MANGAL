  rakuten_caption: '巨大な城「十六夜城」そのものが一つの国となった「巨城国」。

    武士が支配するこの国で、地下に生きる“蟲”の少年・兜丸は、まだ見ぬ太陽に憧れていた。しかし、武士の理不尽によって育ての祖父を殺され、妹まで奪われてしまう。すべてを失った兜丸は、“妖”の種族の長・不知火と共に地上を目指し、支配された世界を覆すための戦いに挑む。

    下剋上バトルファンタジー！！'

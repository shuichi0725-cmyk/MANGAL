  rakuten_caption: '過酷でもゼッタイ生き延びる！ピュアでビビりな超堅実志向少女の異世界成長譚、第2幕!!!!!!

    クレインが突然飛ばされた異世界は、転移者を“異邦人”と忌み嫌う王国。

    当ても無い状況に焦るクレインだったが、彼女の直向きさが王国の冒険者たちの心を打ち、徐々に現地人との溝を埋め始める。

    だが、その矢先に異邦人の仕業と思しき大事件が発生し……!?

    2026年11月刊'

  rakuten_caption: '「俺の対人能力を高めるのに協力してくれない？」


    都内屈指の格式を誇る〈ホテルメリオラ東京〉のコンシェルジュ・遠坂楓は、同期の深水創を密かにライバル視している。

    顧客満足度No.1、仕事は完璧ーーなのに、どこか嫌味に聞こえる物言いがいけすかない。

    それでもその実力は認めていて、いつか深水を超えてみせると密かに燃えていた。


    そんな二人が、カップル向けのデートプランの企画でペアを組むことに。

    今回も深水が華麗に仕上げると思っていた遠坂だが、意外にも深水は企画に苦戦していた。

    さらに、“人と親密になるのが苦手”という、誰にも明かしていなかった悩みを抱えていることを知りーー。'

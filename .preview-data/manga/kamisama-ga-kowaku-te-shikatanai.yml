  rakuten_caption: '《ギフト》を持って生まれた類まれな人物は国から厚遇され、将来を約束されるーー

    そんな誰もが羨み、お近づきになりたいと願う《ギフト》持ちが集まる下宿を祖母から受け継ぎ、大家さんをやっている圭。圭自身は平凡な大学生に過ぎないが、設備の維持管理から住人全員分の炊事まで完璧にこなすスーパー管理人・津さんに助けられ、日々なんとか過ごしている。

    あるとき、どういうわけか闇落ちした《ギフト》に襲われかけた圭は、真っ黒で圧の強い男に助けられる。見も知らぬその男から「お前が成人するのを待っていた」と告げられてすっかり怯えてしまうが……!?'

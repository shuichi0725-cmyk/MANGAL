    そしてトラウマを抱えていたひめちゃんが個人でのイベント参加をついに決意！でも行動に移すのはなかなか大変で…女性しかいないシェアハウスで「作品を作る」ことで勇気や元気をもらうロマンシス・ストーリー、ここに完結です！'

  rakuten_caption: "眠れない夜に聴きたくなる声ーー。 \n\n大学生の颯太が眠れない夜に聴くのは、配信者、源治さんのゲーム実況。穏やかな話し方、低くて艶のある声が心地よくて癒し効果がある。そして何より配信の最後に「おやすみ」と言われると本当に安眠できるのだ。\nある日、大学の講義でたまたま隣に座った人のくしゃみが特徴的で、「源治さんと同じ…?!」と気が付いてしまう。源治さん＝間宮は、人との会話が苦手で配信で話す練習をしているらしい。大学でも一人でいる間宮を放っておけず、「話す練習に協力するよ」と二人で実況配信をすることを提案して…?!\n\
    世話焼き好青年×美人の実況者のステップアップBL！"

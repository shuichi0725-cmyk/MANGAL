    description: 勝った方がリーグ優勝という、コヨーテスとの一戦。六回に一挙八失点を喫して一度は諦めの空気に包まれたホーネッツだったが、ワッツの檄と捨て身のプレーによって闘志を取り戻し、七回裏から反撃を開始する。五点差まで詰め寄り、なおも二死一、二塁でキーンが打席に立つ。抑えの吾郎も出番に備えて投球練習を始める。血行障害をチームに隠したまま強行出場する吾郎が、二十五年ぶりの優勝へ導けるかどうかが焦点となる。

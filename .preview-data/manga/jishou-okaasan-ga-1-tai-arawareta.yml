  rakuten_caption: 'モンスターが溢れ出し、それを狩る冒険者も増え続ける国のお話。

    駆け出しの子ども冒険者・アリーとカザムは意気揚々と初クエストに挑む。

    しかし、それを見守る1人の女性……いや、不審者があらわれる。

    謎の女はあろうことか2人の「お母さん」を自称し、2人の冒険につきまとっては、

    勝手にモンスターや盗賊を追い払う過保護三昧！

    一人前になりたい2人の冒険の行方は──？'

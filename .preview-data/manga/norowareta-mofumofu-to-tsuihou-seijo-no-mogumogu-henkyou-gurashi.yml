  rakuten_caption: '偽聖女の烙印を押され、危険な「宵闇の森」へと追放されたエリーザ。

    ーーそれから八年、彼女は相棒の白鷹・オーリと森を駆け、獲物を仕留める一人前の狩人になっていた！

    聖女だった頃よりも自由で、たくましくて、美味しい毎日。


    そんなある日、狩りの途中で傷ついた黒狼を発見する。

    一人と二匹の賑やかな森暮らしが始まったーーと思ったら、

    満月の夜、モフモフの黒狼が美青年になってしまって!?


    獲って、食べて、森で暮らしてーー

    追放聖女と訳アリ黒狼の、狩猟スローライフ・ファンタジー、開幕！'

  rakuten_caption: "「オレが直接、淫魔のお仕事教えてあげる」\n\n罪を犯し、処刑を待つ下級悪魔・ミオ。\nその前に現れたのは、魔王となったかつての幼なじみ・レイだった。\n\
    \n死を望むミオを、レイは人間の精を糧に生きる淫魔へと作り変えてしまう。\n強制的に発情させられた身体は、レイとのセックスに溺れ、淫魔になったことを実感させられる。\n\
    \ だが、疼いて狂いそうな腹の奥に、決して精液を注いではくれなくてーー。\n\n「アイツはなんで俺を淫魔なんかにしたんだよっ！」\n\n飢えた体を満たすため、人間を誘惑するミオ。\n\
    なんとか精を奪うが、抱かれることだけは拒絶してしまいーー。\n\n冷酷魔王×淫魔に堕とされた下級悪魔\n幼なじみ二人の歪な執着愛が絡み合うフルカラーコミックス！\

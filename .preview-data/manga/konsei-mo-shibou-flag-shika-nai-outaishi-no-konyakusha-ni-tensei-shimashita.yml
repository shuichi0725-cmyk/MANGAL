  rakuten_caption: 公爵令嬢ニーナは王太子レオンとの婚約直後、あまりにも残酷な「前世の記憶」を思い出す。それは、彼をどれほど愛しても最後には必ず裏切られ、17歳の誕生日に命を落とすという絶望的な運命。今世で7度目の人生を迎えたニーナは、惨劇のループを変えるため、大好きなレオンと別れる決意をする。しかし前世ではつねに冷徹だったはずの彼が、なぜか今世では真摯に愛を囁き、驚くほどの執着を見せてきて…!?　さらに「時の神」と名乗るギードが現れ、混迷する運命を一層狂わせていく。刻一刻と迫るタイムリミット。ニーナは哀しい愛の連鎖を断ち切り、今度こそ生き残ることができるのか。死に戻り令嬢の切ないラブ・ファンタジー、開幕!!

  傷心の大和は仕事に生きることを決意し、麻美には何も告げずに出港してしまう。

  大和からの連絡が途絶えた日々の中で、

  麻美はプロポーズを断ったことの重みを感じていた。

  そんな中、大和の同期・武蔵が麻美に急接近してーー！？


  コピーじゃなくてアプデ'

  rakuten_caption: '最悪のクリスマス──

    いい子にしてたのに突然サンタにキスされた!?


    湊は少女漫画に憧れる大学生。

    けれど路上で寝ている酔っぱらいサンタに

    ファーストキスを奪われてしまった。


    ショックを受ける湊だが、

    結局そいつを見捨てられずに自宅へ連れ帰ってしまう。


    サンタ服のまま目覚めた男・玲央は

    湊に介抱されるとすぐゼロ距離になる。

    恋愛経験がないと打ち明ける湊に

    「俺と付き合ってみない？」なんて軽く誘う。


    湊はとっさに玲央の誘いを断るが…

    頭の中は寝ても覚めても玲央のことばかり。


    もう一度会いたい。


    なんて考えていたら──お隣さん…だった!?


    少女漫画の恋がしたい × 恋なんてただの暇つぶし。

    正反対な男たちの不器用BL、ここに開幕！'

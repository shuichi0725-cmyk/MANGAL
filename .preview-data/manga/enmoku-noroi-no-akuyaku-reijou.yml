    街で盗みを働く少年の手助けをしたところ、それを見ていた謎の人物…第一王子ニコラに買われてしまい!?

    「君には悪役令嬢になってもらうーー期限は一年」

    マナーを纏い令息令嬢に馴染もうと学園生活をスタートさせるも、初めての友人が傷つけられ感情が昂り、禁忌とされる&quot;呪い&quot;を発動させてしまう。

    恐れられるはずなのに、ニコラの好感度はなぜか上がっていくばかりで!?


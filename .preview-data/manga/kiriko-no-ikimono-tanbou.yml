  rakuten_caption: "深海魚との出会いから始まる生き物×SF譚 \n\n 生き物を研究するキリコの前に現れたのは、「死にたくない」と叫ぶ深海魚・ミズウオ。なぜ彼は陸へ打ち上げられてしまったのか。その理由を探すため、キリコはミズウオとともに研究を始める。その日々のなかで、ふたりは少しずつ心を通わせていくが……\n\nキリコのもとには、今日も水辺の生き物たちとの出会いが訪れる。\nヒトと生き物の境界が交差する、生き物×SF譚。"

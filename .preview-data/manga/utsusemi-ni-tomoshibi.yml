  rakuten_caption: '【不朽の青春BL『くらやみにストロボ』待望のスピンオフ！】


    ここは、ふたりだけの秘密の場所。

    「澤も共犯でしょ」


    バスケ部の澤山が抱く、エース・宮本への恋に似た憧れ。

    その想いを唯一見透かしてきた長谷が苦手だった澤山だが、

    長谷に誘われ、図書室の立入禁止の部屋に出入りするようになった。

    ふたりだけが使う秘密の部屋は、次第に彼らだけの特別な居場所になっていきーー。


    食えない飄々男子＆堅物バスケ部が

    互いの領域を侵食し合っていく、もうひとつの青春BL。'

  rakuten_caption: "仕事は完璧だが、人間味の薄い性格に無表情。\n総務部のお仕事ロボット「ロボ子」と称される、小鳩亜子。\n孤独を愛し、他人との関わりを極力避けて生きてきた亜子だったが、\nある夜、人生最大の転機が訪れる。\n\n亜子の会社の会長であり、最愛の祖父から告げられた、まさかの余命宣告。\n衝撃を受ける亜子に、追い打ちをかけるように頼まれた祖父からの最期の願いーー、\n\
    それは「一年以内に社内で結婚相手を見つけること」だった！\n\n祖父のために、一念発起して婚活を決意した亜子。\nだが、「社内で相手を見つけること」という条件は、希薄な人間関係の中で生きてきた彼女には、ハードルがあまりにも高く、時間ばかりが無為に過ぎていく…。\n焦る亜子は、エレベーターから降りて、ロビーで出会った男性にプロポーズをすることを決断。\n扉が開いた瞬間、その場に立っていたのは、社内でも有名なチャラ男・城守蓮司だったーー！\n\
    \n亜子の無機質なプロポーズにドン引きしつつ、彼女のあまりにも不器用で無茶な行動を見かねて、城守は「婚活指南役」を引き受ける。 \n恋愛経験0のポンコツロボ子とおせっかいなチャラ男の恋愛マスター。\n真逆の二人が駆け抜ける、たっ"
  note: 予約②③previewドラフト。本番化はユーザ確認後。ヨミ=楽天仮(NDL照合待ち)。genre=captionからprovisional付与

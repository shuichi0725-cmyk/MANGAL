  rakuten_caption: '通り魔に殺され転生した少年・イツキ。

    彼が転生したのは人を襲うモンスター《魔》が存在している日本ーーしかも魔法を駆使してモンスターを討滅する《祓魔師》の一族だった!

    祓魔師の子は《魔》に狙われやすく、弱ければ再び殺されてしまう。

    だからイツキは決意した。強くなるーーもう二度と、死なないために。

    最強を目指し赤ちゃんの頃から魔法の練習を積み重ね……気がついた。


    「しまった……努力しすぎた……」


    努力しすぎて凡人なのに最強に!?

    規格外の力で魔をことごとく打ち倒す、努力無双ファンタジー開幕！'

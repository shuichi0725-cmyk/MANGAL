    description: 文化祭に、恵利香は三人の人物を招く。一人目は渚沙の父、二人目は元A組担任の鈴木。鈴木は精神的に不安定な茉莉の相手をした末に退職し、心を病んで入院していた人物だった。桃や真紀と楽しげに話す茉莉を見た鈴木は、カッターを手に取り暴走し、取り押さえられる。そして三人目、城杏学園のいじめ自殺事件の加害者である池田が来校し、事件の真相が明らかになっていく。文化祭のさなか、桃は自見に惹かれていく第12巻。

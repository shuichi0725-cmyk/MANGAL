  rakuten_caption: 大国アストリアの第二王子であり、無自覚な魔術の天才であるニート・ファン・アヴァドーラ。お家大好き引きこもりな彼だが、魔術学院の研修でアストリア北方の「国立魔術研究所」に遠征することに。観光もして案外楽しい研修になりそう……と思った矢先、軍事国家イスカルの兵から脅迫を受ける！ 仲間を守るため、戦いに赴かざるを得なくなったニート。さらにこの戦いの裏にはニートの兄・第一王子アレクの意志が絡んでいるようで……？

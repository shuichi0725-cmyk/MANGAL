  rakuten_caption: '千葉・鴨川の高校に通う児玉惟(こだまゆい)は、

    かつて元気いっぱいの野球少年だったが

    いまは、心を閉ざして日々を過ごしていた。

    そんな惟を野球部に連れて行く女子が現れる！

    だが、彼は過去のトラウマから入部を断り…。

    いつかの野球少年が、もう一度白球に触れ心を取り戻していく！

    “ハイタッチ”毎に、交代する「主人公」。

    全員主役×全員全力で描破される、チーム漫画の最前線！！

    青い海、青い空、眩しい太陽、潮の香り…鴨川出身の作者が描く

    一生の中で一番輝く、唯一無二のド青春・高校野球物語。'

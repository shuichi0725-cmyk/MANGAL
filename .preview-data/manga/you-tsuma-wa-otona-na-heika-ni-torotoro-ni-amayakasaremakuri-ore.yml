  rakuten_caption: '【あらすじ】妖精国で大人へと急成長したリーファは、ついにディラントの王・レオルグと婚約。心も身体も結ばれ、ますます愛を深める二人。しかし王妃の座を奪われた他国の姫がリーファの命を狙い、庇ったレオルグは生命の危機に……！　事態は他国からの反乱に及び、リーファはレオルグを救うため、妖精王・イシュトナーの力を借りる。その代償は自分の身を捧げることで……!?

    妖精の不思議な力で大人になった王女が初恋の国王陛下と結ばれる、新婚ラブコメ☆ファンタジー、堂々完結!!


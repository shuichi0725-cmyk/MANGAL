  rakuten_caption: '山々に囲まれた田舎町・戎ヶ丘。

    寂れゆく町で、学生の深水雛子は行き場のない思いを抱えていた。

    その日の朝、雛子は行きつけの駄菓子屋で同級生たちと合流し、他愛ない話に興じていた。

    それはいつもの日常のはずだった。

    その「化け物」が現れるまではーー。

    大人気サイコロジカルホラー、日本を舞台にした待望の最新作を

    竜騎士07描き下ろしの「新たなエンディング」でコミカライズ。'

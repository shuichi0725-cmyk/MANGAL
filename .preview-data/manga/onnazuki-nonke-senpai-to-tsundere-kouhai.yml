  rakuten_caption: 'ぼっちな大学生活を送る瀬野の唯一の話相手は、適当な性格だが友達は多い留年生の松浦。

    いいように使われて知っておきながら、今日もわけあって松浦の代返を行う瀬野。

    周りから距離を取られている瀬野がなぜ素直に言うことを聞いているのかと言うと

    実は…瀬野は松浦の顔が超超好みだったのだ……！！！

    自分がゲイであることを隠しながらどうにか松浦と距離を縮めたい瀬野だけど……？

    凸凹コンビがおりなすゆるきゅん、スクールラブコメ！'

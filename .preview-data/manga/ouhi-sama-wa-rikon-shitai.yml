synopsis: 異世界の記憶を持つ者を聖女とし、王妃に迎えるリエンライン王国。この決まりに従い”歴女”の記憶を持つイーリスが王妃となったが、政略で結婚し、リーンハルト王の愛を感じられない生活を強いられる。さらに新たに異世界から転移してきた陽菜が現われてから、リーンハルトの気持ちは陽菜に傾いていく

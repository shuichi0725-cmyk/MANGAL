  rakuten_caption: '淫魔(インキュバス)、それは性を司り、欲に溺れる魔界の悪魔。

    その頂点である淫魔王ゼノン・アルバノートは新たな雌を求めて人間に転生した。

    それから十数年、すでに人間の雌を抱き飽きていたゼノンであったが、

    そんな折にゼノンの才能を知った王立ルセティリア魔法学園から招待状が届きーー。


    貴族令嬢から喧嘩娘まで、

    将来有望な若雌が集まる人間界最高の学園でゼノンのハーレム育成計画が始動する！'

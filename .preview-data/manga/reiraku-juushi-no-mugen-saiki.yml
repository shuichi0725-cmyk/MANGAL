  rakuten_caption: '人類の敵と戦う戦士「マリオネット」を育成する学園で

    かつて魔力量最低ながら最強と呼ばれた少年・イズル。

    彼はある事件をきっかけに学園から姿を消していた。


    それから3年。

    イズルは、後輩の少女・イヴに再び因縁の学園へ誘われる。


    「わたしは負けるわけにはいかないの」

    学園で毎年行われる進級試験まで、あと1週間。


    イヴによって強引にバディとなった2人は、

    “敗北=死”の過酷な試験に挑むため、特訓を開始するが──────

    元最強×現最弱。

    落ちこぼれバディが弱肉強食の学園で成り上がる、

    学園バトルファンタジー!! 待望の第1巻発売!!'

  rakuten_caption: '『このモヤモヤって、なんなんだろう……』


    人見知りな大学生・紬生（つむぎ）は、同居することになった幼馴染のお兄ちゃん・慧（けい）との“距離感”に戸惑っている。

    朝は起こしに来てくれるし、ご飯も一緒、バイトの迎えまで。

    昔からずっと甘えてきたはずなのに、最近は近づかれるだけでなんだか胸が落ち着かなくなる。


    これはただの幼馴染じゃなくて……もっと特別な、何かのせい？


    この「難題」を解決しようと、紬生は慧以外との人間関係を広げるため、勇気を出して合コンに参加することに。

    ところが、そのことを知った慧の態度が突然変わってーー？


    まだ気づけない、でも気づきたい。

    じれったい幼馴染が一歩ずつ育む、はじめての恋のお話。'

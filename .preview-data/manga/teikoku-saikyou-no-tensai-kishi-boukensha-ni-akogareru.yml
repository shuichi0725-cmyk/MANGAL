  rakuten_caption: '100年に1人の逸材と言われ、頭脳明晰で剣術と魔法の才にも秀でていたフランツは、18歳という若さで帝国の騎士団長にまで上り詰めた。しかしそんなフランツが憧れていたのは、冒険者だ。いつかは自分も冒険の旅に出て活躍をしたいと淡い夢を抱いていた。

    そんなフランツが先の戦争で帝国の完全勝利に多大なる貢献をし、褒美として願ったのはーー長期休暇。

    かくして自由な時間を手に入れた帝国最強騎士であるフランツは、新人冒険者として国中を巡っていくことになる。

    フランツの旅は国に巣食う問題を次々と解決するものになり、後世では帝国が飛躍するきっかけとなった旅とまでいわれるのだがーー本人は憧れの冒険者稼業を全力で楽しんでいただけ…？

    これは、そんなフランツの冒険物語である。'

synopsis: '【全裸】になってしまう呪いを解くため

  仲間と共に異世界で旅を続けていた幡上瑠奈は、

  囚われていた仲間の黒の勇者クリスを助け出し、

  遂に西の魔女・リムルを追いつめる。


  しかし突如リムルを助けに来た東の魔女に

  急襲されてしまいまたしてもピンチに。


  更には助けたはずのエルフの里には'

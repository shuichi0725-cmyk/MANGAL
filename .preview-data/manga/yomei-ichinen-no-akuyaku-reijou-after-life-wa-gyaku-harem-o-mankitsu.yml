  rakuten_caption: '言って…「愛している」ってーー


    余命一年の公爵令嬢・エルフリーナはロマンス小説に倣って買った四人の恋人たちのうち、無事にミケ、大佐と体験を通じて『恋』を育む。本当の『恋』をする時間はないけれど、後悔しない人生を過ごしたいーー！


    今夜の相手は異国の王子。

    言葉は通じないはずなのに、王子の妙な色気に翻弄されてしまう。

    そんな不器用ながらも懸命に愛を求めるエルフリーナに、閣下は現実を突きつけてきて……。


    「それであなたは満足ですか？」



    「愛している」と言ってほしいーー。

    恋を知らない公爵令嬢が、愛を求めて駆け抜ける溺愛ファンタジー第2巻！　

    全力全開で残生≪アフターライフ≫を楽しむハーレムラブにも、新たな変化の兆しが……。'

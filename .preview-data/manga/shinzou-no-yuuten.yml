  rakuten_caption: '欲しいと思った。「かわいい愛おしい壱千、俺が　ってやらなくちゃ」


    “この世ならざるもの”が視える大学生の壱千と視えない春永はセフレの関係。

    とある出来事をきっかけに出会って以来、どこか放っておけない雰囲気の壱千に春永がベタ惚れ。

    恋人という傍にいる理由が欲しいのに、踏み込めないまま絶妙な距離感を保っている。

    そんな二人は教授の頼みで心霊相談を受けるバディでもあった。

    『写真に写った自分に異変が起きる』

    『何度捨てても戻ってくるぬいぐるみ』


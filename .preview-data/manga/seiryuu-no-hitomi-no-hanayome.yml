  rakuten_caption: '『茉莉花官吏伝』、『十三歳の誕生日、皇后になりました。』と舞台を同じくする新スピンオフ開幕!!

    青龍の瞳を持つ采青国の公主・瑠璃は、未来視の能力で

    「このまま次の皇帝の妃になると、国が滅びる」という予知夢を見てしまう。


    国の滅亡を阻止するため、瑠璃は自ら結婚相手を選ぶ決意をし、

    “訳あり皇族”の武官・蒼天に球婚するが、あっさり断られてしまう……。


    諦めない瑠璃に、蒼天はある条件を提示し、二人の駆け引きが始まるーー!!


    可愛すぎる押しかけ妻による中華求婚物語!!'

  rakuten_caption: 天涯孤独なリリ・ラズベリーの夢は、魔法使いになって冴えない「自分の人生」を変えること。14歳になり、魔法学校スキエンティアに入学したリリは夢への第1歩を踏み出す。初めての友だちやステキな恋…そんなキラキラの学園生活を送るつもりだったのに、そこは「スワン」と「クロウ」という2つのクラスに分かれて激しく競い合う厳しい世界だった…！？　夢と冒険のマジカル学園ストーリー、はじまりはじまり！

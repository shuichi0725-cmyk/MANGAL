synopsis: 'ゲームライターの楓太は、ある日突然、祖父から2歳児の子守を任される。

  まったくの他人に息子を預け放置した父親・葵に嫌悪感を抱くが、

  実は2人は自由奔放な母親に置き去りにされた兄弟だった。

  働きながら必死に弟を育てる葵を気にかけるうちに

  恋心が芽生えた楓太は一緒に子育てを頑張る決心'
catch: 祖父から突然2歳児の子守を任されたゲームライターの楓太。預けた父親に嫌悪を抱くが、実は彼らは母に置き去りにされた兄弟だった。弟を必死に育てる兄を気にかけるうちに芽生える恋心——子育てと恋を描くハートフル・ストーリー。

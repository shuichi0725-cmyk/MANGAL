  rakuten_caption: '乙女を花ひらかせたのは、美貌の悪魔ーー


    グレイシーは風邪をひいた庭師の友人に代わり、豪華な邸宅の庭で薔薇に水をやっていた。そこへ屋敷の主ラファエルが現れ不法侵入を咎められてしまう。ハンサムな男性に見とれたのも束の間、彼は庭師をクビにしない代わりに今夜開かれるパーティーに同行するようにとグレイシーに命じてきた。あっという間に用意された白いドレスをまとい、夢のようなキスを交わすうち、情熱に溺れたグレイシーは気づけば薔薇園で純潔を捧げていた。これは彼の戯れでしかないのにーー。'

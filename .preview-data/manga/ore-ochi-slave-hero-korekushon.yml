  rakuten_caption: '新たな怪人を仲間に加え、家族のような穏やかな日常を過ごし始めた息吹たち。しかし、その平和は突如として打ち破られる。

    彼らの潜む地下基地に、圧倒的な力を持つ地球最強のヒーロー「ザ・ライトニング」が襲来したのだ！

    逃げ場を失い、無情な猛攻の前に絶体絶命の危機に陥る仲間たち。そして同時に交錯し始める、息吹の両親の命を奪った「過去の因縁」。

    愛する「家族」を守り抜くため、すべてを懸けた絶望的な戦いへと身を投じる衝撃の最終巻！


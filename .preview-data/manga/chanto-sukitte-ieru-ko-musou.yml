  rakuten_caption: '【甘えたがりなハイスペギャル】天崎雨音。

    【巨乳でお世話好きな元・許嫁】白菊白亜。

    【ツンツンちょろい小悪魔後輩】春日波留。


    男子高校生・和泉に恋心を寄せる彼女たちの前に現れたのはーー。

    【ちゃんと好きって言える子】天性のメインヒロイン、七瀬七緒！


    転校して即告白した七緒は、あざとい直球アプローチで攻めまくり和泉とのデートにこぎつける。

    瞬時に負けヒロインと化した雨音は、

    白亜・波留と同盟を組みデートの尾行をするがーー目撃したのはキスシーン!?

    絶望から這い上がれるか、雨音!?　熱き恋心が激突する!!


    さらにさらに、爆乳×妖しきお狐ガールも新登場!?

    正体不明の転校生・明星明那が&quot;エイチ&quot;な猛攻で、ヒロインレースをかき乱す！'

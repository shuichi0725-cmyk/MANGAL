  rakuten_caption: "僕が君に頼られたいんだ。 \n\n 家族から虐げられていたところを、“空気が読めない”と評判のミハイル王子に助けられた侯爵令嬢のナタリー。実はナタリーは、前世、日本で看護士をしていた記憶を持つ。\nリラリナ学園に入学したナタリーは、そこで、同じ前世の記憶を持つアレンと出会い、新たな事実が判明し…？\n新キャラ多数登場！ 両片思い!? 幼馴染すれ違い学園ラブファンタジー、第2巻！\
    \ \n\n 【編集担当からのおすすめ情報】 \n 小学館「ファンタジーノベル&コミック原作大賞」大賞受賞作、大好評コミカライズ第2巻！\nリラリナ学園に入学したナタリーにたくさんの出会いが訪れます。\n同じ過去の記憶を持つアレン。悩めるクラスメート、リリィ。憧れの先輩、アンネ。黒天使と呼ばれるファルコ。\n彼らとどう関わっていくのか、学園生活を満喫するナタリーたちをぜひお楽しみください！"

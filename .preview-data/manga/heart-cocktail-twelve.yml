  rakuten_caption: "37年ぶりに届いたハートカクテル完全新作 \n\n 都会的かつ洒脱な作風で、多くの読者を魅了してきた『ハートカクテル』。1980年代にアーバンな恋愛シーンを描きつづけた物語は全250話、全11巻。その1話4ページの叙情詩のようなスタイルによる新作単行本は、実に37年ぶりの刊行です。新たに描き下ろされた20話の舞台は、1年12か月。四季折々の人生に青春を感じる瞬間の数々が星のように描かれます。主人公「ボク」の物語の旅に、またあなたを誘います。ようこそ「twelve」の世界へ。\n\
    カバーは今回も描き下ろし。「何かが始まる」予感を胸に、南国の小空港に降り立った男女。その姿はこれから物語の旅に出るあなた自身かもしれません。"

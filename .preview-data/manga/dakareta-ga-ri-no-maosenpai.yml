  rakuten_caption: '愛も精気も全部ちょうだい？ 初心な淫魔の焦れキュンラブ


    「もっと奥…おへそのとこまで来て？」


    恋愛経験0のリーマン・真生(まお)は、会社の寡黙でクールな後輩・倉橋（くらはし）に絶賛片想い中！


    出会った瞬間ビビッと“運命”を感じて以来想いは募るばかりだが…

    真生には誰にも言えない秘密があった。

    それは淫魔の末裔で、運命の相手としかセックスできないこと。


    倉橋と結ばれたい、えっちなこともしたいーー…

    なのに、なかなか進展せずヤキモキしてばかり。


    ある日、ひょんなことからふたりきりの密室チャンスが到来！

    意を決して大胆な誘惑を仕掛ける真生だが…

    隠していた秘密がバレてしまった上、いつも余裕な倉橋の思わぬ反応に翻弄されて…!?


    運命の出会いから始まる、初心な淫魔の焦れキュンラブ'

catch: ゾンビが蔓延しても、お嬢様は今日も紅茶を所望する。終末にまるで似合わない、優雅すぎる主従のコメディ。
synopsis: ゾンビウイルスが広がっても人類は滅びず、ゾンビと共存しながら暮らしていた。そんな世界で、超天然のお嬢様と最強の執事・神代は、いつもどおりの優雅な日常を守り続けている。

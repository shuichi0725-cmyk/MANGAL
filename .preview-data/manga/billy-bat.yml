synopsis: 1949年、ロサンゼルス。日系アメリカ人の漫画家ケヴィン・ヤマガタは、人気作『ビリーバット』を描いていた。だがあるとき、そのキャラを過去に日本で見た絵から無意識に盗用したのではと気づく。彼は焦土の日本へ原画の作者を探しに渡るが、その起源は想像を超えて古く謎めいていた。ミステリー。

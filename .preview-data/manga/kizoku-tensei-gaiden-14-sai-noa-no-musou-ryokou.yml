catch: 帝国最強の14歳が、身分を隠してお忍びの旅へ。世直しの道中で暴かれるのは、法の穴を突いて民を虐げる悪党たちだ。
synopsis: チートスキルと知性で帝国に圧倒的な存在感を放つ14歳のノア。貴族として育った自分には平民の常識が欠けていると気づき、見識を深めるためオードリーと共に帝国漫遊の旅へ出る。

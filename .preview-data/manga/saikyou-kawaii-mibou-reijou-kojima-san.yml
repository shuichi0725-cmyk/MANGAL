  rakuten_caption: 元令嬢で未亡人のメイド…ではなく家政婦「コジマさん」との、奇想天外でやさしい日常のはじまり。森の中で獣に襲われていた少年・ディミトリが出会ったのは、メイド(自称・家政婦)の「コジマさん」だった!! コジマさんは、とある理由で主人たちから邪険に扱われ、ひとり森で暮らしていた。ケガをしたディミトリはコジマさんに介抱され一緒に過ごすうちに、彼女のぶっ飛んだ強さや、かわいらしさを知っていきーー？
    ミステリアスだけど最強で最高にかわいいコジマさんが少年と出会い、新たな人生を切り拓いていく幸せファンタジーラブコメディ！

  rakuten_caption: '川童、山の神、座敷童に人の魂ーー。

    遠野地方に伝わる伝承たちは仄暗く輝く。


    或る村で、不遇な扱いを受ける女がいた。

    舅姑と夫に「穀潰し」と罵られ、「何ひとつ普通にできない」と自分自身を責め、心を痛める日々を過ごしている。

    川辺で涙していた時、女の前にある生き物が姿を現した……その奇っ怪な口先、ヌメヌメとした肌、水掻きがついた手。

    その全てが恐ろしく不気味だったが、彼女は「其れ」の虜になってしまい……。


    日本民俗学の金字塔、柳田国男が佐々木喜善らから蒐集した『遠野物語』。その珠玉の物語5篇を、力強い筆致で新解釈し、漫画化。'

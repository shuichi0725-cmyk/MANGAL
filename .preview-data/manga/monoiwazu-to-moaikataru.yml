  rakuten_caption: 'ある日、自分とまったく同じ顔をした青年の夢を見た莉央。


    「私と君の人生を交換してもらう」


    そう言われて目を覚ますと、そこは言葉も通じない獣人の国だった。

    恐怖に耐えきれず、脱走を試みるも失敗。連れ戻された莉央の前に現れたのは、覇気をまとった一頭の獅子でーー。


    もしかしてオレ……食べられちゃうの！？


    莉央はまだ知らない。

    獣人国へ嫁ぐはずだった王子の身代わりとして転移させられ、

    目の前の獅子王の“妻”になっていることをーー。


    人間嫌いの獅子王×何も知らない身代わり花嫁

    言葉通じぬ二人のフルカラーな異世界ラブストーリー！


    ■収録内容

    ・「物言わずとも愛語る」第1話〜第8話…カドコミ掲載作品を加筆修正

    ・描きおろしまんが18P…描きおろし

    ・本体表紙イラスト1P…描きおろし'

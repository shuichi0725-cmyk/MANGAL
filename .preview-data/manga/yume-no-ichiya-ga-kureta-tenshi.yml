  rakuten_caption: '僕を捜し出せて幸運だったな。いくら欲しいんだ?


    恋に臆病なロッティは、兄の勧めで登録したマッチングアプリでラグナーと出会った。途切れないやりとり、青く澄んだ瞳と心地よく響くテノールの声。会ったばかりの彼に心を奪われるが、まさか思いもしなかったのだ。初めてを捧げた夜を最後に、連絡が途絶えるだなんて。私はただの遊び相手にすぎなかった…。その一夜で妊娠したロッティだったが、テレビ番組でラグナーがアプリの開発・運営をしているCEOだと知る。娘の存在をせめて告げようと会いに行くが…？'

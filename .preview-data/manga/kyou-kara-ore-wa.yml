    description: どれほど本気で挑んでも、左手一本しか使わない相手に今井はまるで歯が立たない。谷川に女を連れて逃げるよう告げ、今井はひとりその場に残る(第1話)。三橋と伊藤への復讐に燃える相良は開久の連中に呼びかけ、二人にとって邪魔になりそうな者へ次々と賞金をかけて襲わせる。孤立を深める三橋と伊藤。やがて理子が狙われ、連れ去られてしまう。本編に加え、今井と谷川を主人公にした外伝「今井・谷川みちのく純情二人旅編」、双子の涼子と翔子が転校を機に普通の女の子を目指す「今日からあたしゃ!!」、西村博之による「今日からトモダチ!!」、ファンキー吉原による「今日だけ俺は!!」、「甘く危険なナンパ刑事」2編を収めるシリーズ完結巻。

  rakuten_caption: '「この婚約はなかったことにしてほしい」


    理不尽な理由で捨てられ、居場所を失ったオーレリア。

    しかし彼女には、誰にも明かしていない秘密があった。

    それは前世の記憶と、桁外れの「付与魔術」の才能。


    しがらみから解放された彼女は、その魔法を駆使して

    王都で人々の「困りごと」を優しく解決し始める。

    それはやがて、彼女を“運命の出会い”に導いてーー？'

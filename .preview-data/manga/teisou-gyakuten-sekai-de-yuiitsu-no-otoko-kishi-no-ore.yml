catch: 女が男を支配する世界で、唯一の男子生徒として騎士学園へ。捨てられた孤児だった少年が英雄と呼ばれるまで。
synopsis: 貞操逆転世界に生まれ、男というだけで親に捨てられたクレト。ある日発現したのは、女と関われば関わるほど強くなるスキルだった。力を得た彼は、エリート女性だけの騎士学園へ入学する。

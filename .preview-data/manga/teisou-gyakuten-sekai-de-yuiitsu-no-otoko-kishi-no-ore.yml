  rakuten_caption: 山奥の村を襲う黒龍の討伐に成功したクレト。学園に戻り精力的な毎日を過ごしていたある時、武術の祭典「覇剣祭」の話を聞く。クレトは、ソフィア、ベルガ、フラウとチームで参加することに。3人が覇剣祭に向けて特訓を始めると、クレトとソフィアの息がまったく合わないことが判明。見かねたフラウは、クレトとソフィアを手錠でつなぎ、強制的に24時間共同生活をさせることに。それでも、溝が開くばかり。しびれを切らしたフラウはある秘策を思い付く。それはお互いが裸になり、お風呂場で洗い合いっこすることだったーー。

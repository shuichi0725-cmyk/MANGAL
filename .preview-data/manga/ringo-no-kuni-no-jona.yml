  rakuten_caption: 青森で暮らすジョナのもとに、地元を離れた一因でもあるママが現れる。相変わらずの調子で娘の体型をいじり、正市への偏見を口にするママ。ジョナの様子がおかしいと気づいた正市は、ジョナが無意識に隠していた秘密を目撃して…。探しているのは自分じゃなくて「居場所」。『自転車屋さんの高橋くん』著者が描く、出会いと再生の物語。【単行本限定おまけ漫画収録】

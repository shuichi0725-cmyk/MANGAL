  rakuten_caption: 感情と魔力を持たずに生まれた、魔法使いの名門貴族の次男・アスク。四大精霊王との契約をきっかけに自由を求め、窮屈な家を飛び出す。旅先で出会ったのは、亜人であるがゆえに故郷を失ったエルフの少女・ルリア。彼女の冒険者パーティに加わり共に時間を過ごすうち、アスクの知らない特別で温かな「感情」が芽生えてゆく。しかしある日、ギルドの他の冒険者にルリアたちが亜人だとバレてしまいーー!?

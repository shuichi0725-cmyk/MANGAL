catch: 魔力ゼロの欠落は、精霊王を宿すための器だった。
synopsis: 魔法使いの名門に生まれながら感情も魔力も持たないアスクは、出来損ないと蔑まれ別邸へ追放される。だがその欠落こそ四大精霊王と契約する器の証だった。力を得た彼は自由を求めて旅に出る。

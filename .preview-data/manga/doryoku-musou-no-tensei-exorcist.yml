  rakuten_caption: '血統なし才能なし、ただし最強の悪魔祓い。

    通り魔に刺され生まれ変わった先は、悪魔の脅威がある世界だった。

    主人公は、悪魔から人界を守る者──悪魔祓い（エクソシスト）を輩出する大貴族の孤児院にて第二の人生をスタートさせた。

    「お前は悪魔祓いの血統にはない凡人だ」

    「だが、身を守るために悪魔祓いとして成長せねばならない」

    「凡人悪魔祓いが20歳を迎えられるのは10人に1人だ。死ぬ気で強くなれ」

    未来は決まっていた。悪魔祓いになるしかない。血統の優位性はない。才能もない。

    それでも死を避けるため、大切な主人を守るため、主人公は努力を続けて──いつしか最強になっていた。

    これは凡人と侮られていた主人公が最も恐れられる悪魔祓いとなり、エクソシスト界で名を馳せる物語。'

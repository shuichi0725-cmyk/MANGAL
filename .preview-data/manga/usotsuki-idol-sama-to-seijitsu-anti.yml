  rakuten_caption: '「愛してる 逃げたりしないで待っててね」壊れた世界にふたりきり。激重執愛ループ


    国民的カリスマアイドル、南千歌世には秘密があるーー。

    それは高校の同級生・鈴木縁を自宅の地下で囲っていること。

    閉じ込めて朝から晩まで重たい愛を囁くのだ。

    芸能人と凡人...交わらないはずの関係だったのに、高校時代なぜか千歌世に懐かれてしまったのが運のツキ。

    数年後ひょんな再会から異常粘着がスタート、縁の平凡だった人生は変わり始めたーー...。

    壊れた世界にふたりきり。

    愛と狂気の執着サイコアイドルに一般人がずぶずぶのグズグズに堕とされるまで。'

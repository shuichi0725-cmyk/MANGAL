catch: 「俺の嫁になると食われる」——そう言って結婚を拒む夫と、屋敷に潜む陰謀に囲まれていく。二人の男の間で心が揺れる。
synopsis: 貧しい家族を救うため資産家の月神家へ嫁いだ光。だが夫となる白夜は「俺の嫁になると食われる」と結婚を拒む。さらに屋敷内では、何者かから執拗な嫌がらせを受けることになる。

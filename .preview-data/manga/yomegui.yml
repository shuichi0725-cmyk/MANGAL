  rakuten_caption: 貧しい家族を救うため、資産家の月神家へ嫁入りした光。しかし、旦那となる白夜は「俺の嫁になると食われる」と言い、結婚を拒む。さらに光は、月神家の屋敷内で何者からか執拗な嫌がらせを受けることに。そんな中、光の血を見た白夜は突如、別人格の極夜に変わり、猛烈に言い寄ってきた。冷たく美しい白夜と、情熱的に愛を示す極夜。光は、月神家に潜む陰謀と、2人の男の間で揺れる自らの心に翻弄されていく！

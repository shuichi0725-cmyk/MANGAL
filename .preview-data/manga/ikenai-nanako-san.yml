synopsis: 大学生・蒼の下宿先は美熟女だらけのシェアハウス小春荘。蒼と初エッチした最愛の元叔母・菜々子さんを筆頭に性に奔放な三十路四十路の女盛り真っ只中の熟女が迫ってくるハーレムラブストーリー！
catch: 大学生・蒼の下宿先は、美しい女性たちが暮らすシェアハウス・小春荘。初体験の相手となった元叔母の菜々子さんを筆頭に、性に奔放な大人の女性たちが迫ってくる。色気あふれる同居生活を描く、大人向けハーレムラブストーリー。

  rakuten_caption: '有働組のΩ組員・清二が若頭の座と引き換えに命じられたのは、組長の孫・彰臣との結婚、そして跡取りを産むこと。αのくせにどこか頼りなく、自分より9歳も年下の男。そんな相手との結婚など冗談じゃない…そう思いながらも、野心を捨てきれず承諾してしまった清二。

    形ばかりの結婚生活が始まり子作りなんてまだ先だとそう思っていた矢先、予期せぬヒートが清二を襲う。理性が溶けそうな中逃げようとした腕を彰臣に掴まれ、「するんだろ? 子作り」と熱に浮かされたまま押し倒されーー。'

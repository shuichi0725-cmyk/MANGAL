  rakuten_caption: 両親と兄を亡くし、幼くしてホテル事業で栄えたセレニティ家の唯一の相続者となったセレナ。 危機に陥った家門を救うため、彼女は創業者である祖母によって王国で最も嫌悪するグレイオン家の次男・アイザーと結婚させられてしまう。 セレニティ家を奪われるのではないかという不安や、愛のない契約結婚で孤独に苦しむセレナをそばで慰めたのは、愛人のフリードリックだった…。それぞれに秘密や思惑を抱えた、愛憎渦巻く3人の物語。

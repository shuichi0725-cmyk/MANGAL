  rakuten_caption: '勇者「王様チィーッス。勇者ですよーっと」


    魔王を倒した勇者が、城に凱旋する。しかし魔王討伐という偉業を報告するにはあまりにも軽々しく、あまりにも…みすぼらしい姿であった。

    やがて彼の口から語られる、勇者一行の旅路。それは、希望に満ちたいかにもなRPG調の英雄譚ーーではない。

    これは、あらゆる人間を疑い、魔物を「殺人」する罪を背負い、中毒症状が出るほど強い薬草で倫理観を誤魔化し、仲間を斬り伏せて進む、血塗られた現実の物語である。

    誰も知らなかった勇者の本当の物語ーー血と嘘と愛の英雄譚、ここに開幕。


    永垂不朽の伝説SS『勇者「魔王倒したし帰るか」』が、時をこえて待望のコミカライズ!!

    原作者・湯葉の書き下ろし小説も収録！'

    「商業地区」に暮らす、独身子なしの先山あさみ（44）、「文教地区」の中学生・白井万寿（14）、「保養地」の施設に住まう笠原史乃（82）。

    合理的に分断された世界で、偶然居合わせた三世代の女性たち。互いの名前も知らぬまま目と目が合ったその瞬間、どこか不思議な関係が芽生えていくーー。



  rakuten_caption: '出会い。別れ。そして再会。

    ねこと人間（私達）は、今も昔も、あの世でもこの世でも、共に生きてゆく。


    総いいね数120万超。Xで大反響を呼ぶショート漫画「つり目ねこ」が待望の書籍化。

    描き下ろし16P収録！ ねこだけのお話も盛りだくさん！



    収録エピソード紹介

    ・忘れねこ

    おばちゃんはボクのことを愛してくれる。でもボクのことを、毎日忘れちゃう。


    ・送り出しねこ

    今日はボクが、天国へ行く日。どこに生まれ変わるのかは、もう決めてるの。


    ・生まれてから一度もかわいがってもらえないねこ

    「この子には一切、情をかけないようにします」

    そうやって生まれてきた。そういうものだと思ってた。だけど、本当はボクも愛されたい。'

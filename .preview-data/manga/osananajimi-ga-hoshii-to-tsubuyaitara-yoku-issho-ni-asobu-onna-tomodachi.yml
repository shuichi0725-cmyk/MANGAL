  rakuten_caption: '「可愛い女の子の幼馴染みが欲しい」

    それは、いつも一緒の四人組でお昼を食べている時に秋人が放った何気ない一言だった。しかし彼は知らなかった。目の前にいる夏実こそ、実は小さい頃に引っ越してしまった幼馴染みだということを！　それ以来、夏実は秋人に対してアピールしていくのだが、今まで友達の距離感だったことからうまく伝わらなくて……。いつも一緒の友達から大切な恋人へと変わっていく青春ストーリー！！'

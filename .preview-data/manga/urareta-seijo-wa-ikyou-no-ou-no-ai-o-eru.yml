  rakuten_caption: '聖女として国中の土地を浄化するという役目を務めてきたセシーリア。

    しかし、とある領地で瘴気が溢れ出す事件が発生。

    力が足りないと判断され、聖女としての任を解かれてしまった。

    そればかりか、婚約者だった殿下からは婚約破棄され、瘴気により荒れた国フェーグレーンへ行くよう命じられてしまう。

    追い出されるように異国へ向かったセシーリアは、到着早々瘴気に蝕まれ命が尽きかけている国王・フェリクスを治療することになりーー!?'

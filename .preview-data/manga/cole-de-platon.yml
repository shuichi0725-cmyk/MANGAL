    description: 関東大震災の約三ヶ月後、一九二三年十二月。中山太陽堂が興した出版社プラトン社は、『文藝春秋』に遅れること一年、直木三十五と川口松太郎を編集者に迎えて雑誌『苦楽』を創刊した。執筆陣には谷崎潤一郎や菊池寛が名を連ね、後に資生堂の花椿マークを生むデザイナーの山名文夫や、スター挿絵画家として名を馳せる岩田専太郎も参画する。大正末期のモダニズムを体現し、若き才能を多く輩出したプラトン社を舞台に描かれる、日本近代文学勃興の裏面史。各話末には作者による追補テキスト、巻末には山田俊幸による解説を収録し、これにて完結。

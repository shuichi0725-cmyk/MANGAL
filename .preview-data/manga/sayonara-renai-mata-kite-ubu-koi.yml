    イケメンだけどヒモ状態の彼氏・透と同棲中のモモ。

    大学時代からの付き合いでお互い27歳になり、そろそろ結婚も考えたいけれど、

    何かあれば金をせびられる現状では夢のまた夢ーー。

    そんな中、会社の飲み会でいつものように「クズ彼氏とは別れなさい」と

    同僚に説教されていると、敏腕営業マンと名高い東がやって来て…？'

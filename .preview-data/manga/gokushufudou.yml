synopsis: 数々の伝説を残した、最凶のヤクザ「不死身の龍」。だが彼はある日その世界から足を洗い、まったく別の道——主夫の道を歩み始める。クールなヤクザが家事に奮闘する日常コメディ。
catch: 伝説の極道が足を洗い、選んだ道は専業主夫。鋭い眼光で家事に奮闘するギャップが笑いを生む、ほのぼの極道コメディ。

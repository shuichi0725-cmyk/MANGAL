    description: 円形の印を持つ超能力グループと、菱形の印を持つ超能力グループの抗争らしいことがわかってきた。そして蘭は、相手の印を奪って超能力を無効化できる力を持つ円形の器だと判明する。求世会からの猛攻を凌ぎながら、どうにか円形の印を持つ者を仲間にすべく奔走していた蘭。一方、勢力を拡大する菱形のグループは、まだ菱形の器が誰なのかを掴めずにいた。そんな最中、戦いで命を落とした円形のグループのメンバー、星川ルミ子の葬儀の場に、静かに菱形の器が現れる。

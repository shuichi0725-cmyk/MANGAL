    description: 出世とも浮いた話ともまるで無縁な、さえない中年サラリーマンの左江内氏。彼はある日、先代スーパーマンに見込まれ、スーパースーツをしぶしぶ引き継ぐことになる。日常の裏に隠れたさまざまな人間模様を垣間見ながら、ささやかな希望をみつけ、ときには正義に疑問を感じ、思い悩む。練り上げられた全十四話は、どれもSF異色短編に匹敵する深みを持った大人の珠玉のストーリー。連載は一九七七年の週刊漫画アクション。当時四十六歳だった藤子・F・不二雄とほぼ同年齢で、娘を持つ父親という立場も共通する主人公が描かれる、著者唯一の大人向け連載ヒーローコミック。全作品全カット完全収録の新装版。

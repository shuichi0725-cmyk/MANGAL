synopsis: 日本と異世界を行き来できるスキルを持つ転生者アレンは、学園でのカードゲーム交流会を何とか成功させる。だが安心したのも束の間、頼まれていた禁制品のBL本が手違いで配布されてしまったと報告を受け、大事にならないか気が気でなくなる。
catch: 日本と異世界を行き来できる転生者アレンが営むのは、波乱続きの商売。カードゲーム交流会を成功させた矢先、禁制品の手違い配布という新たな騒動が舞い込むーー商才とドタバタが同居する異世界コメディ。

  rakuten_caption: '鬼と人間の間に生まれた少女・桜羽（おとは）。

    幼い頃に母親を鬼に殺され、彼らへの復讐を誓い陰陽師として生きてきた桜羽だったが、彼女を捕らえた鬼の頭領・焔良（ほむら）のもとで暮らすうちに、彼らの優しさや悲しみを知る。

    焔良と共に潜入した舞踏会で桜羽が見たものは……、そして優しく触れてくる焔良に抱く思いはーー。'

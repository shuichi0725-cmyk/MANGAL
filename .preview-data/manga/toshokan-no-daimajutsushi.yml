synopsis: 貧しくも本を愛する少年が、心優しい図書館の魔術師にすくい上げられ、読書の(文字どおりの)魔法に出会う物語。アムンの小さな村に住む少年テオは、本が大好きなのに、尖った耳と貧しさのせいで村の図書館を使わせてもらえない。本の都アフツァークを夢見る、美しい冒険ファンタジー。
catch: 本が大好きなのに図書館を使わせてもらえない少年。心優しい魔術師に救われ、読書の本物の魔法に出会う美しい冒険譚。

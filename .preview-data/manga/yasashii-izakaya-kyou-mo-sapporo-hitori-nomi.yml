  rakuten_caption: '札幌の居酒屋を舞台にしたオムニバス漫画。実在店舗の空気感や料理、店主の人柄を生かしながら、5人の主人公の心温まる人間ドラマが展開されます。各話は一話完結でありながら、登場人物たちが少しずつ交差し、最終話までゆるやかにつながっていきます。

    【一人で暖簾をくぐり、一人で酒を飲む。 おいしい酒と料理を口にし、偶然隣り合った誰かと言葉を交わす。 ただそれだけなのに、帰るときにはほんの少しだけ心が軽くなっている。ひとりで飲む。でも、独りではない。】'

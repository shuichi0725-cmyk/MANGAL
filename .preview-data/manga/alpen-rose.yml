    description: 「殺人鬼」にしてナチスの手先である通称「タランチュラ」の正体は、ランディの生き別れた兄ジャン＝ジャックだった。ランディは兄を止めるためパリへ向かうが改心させられぬまま、ジュディとスイスへ戻る決意をする。その道中、二人は死んだはずの宿敵グールモン伯爵と再会する。第二次大戦下のヨーロッパを舞台にした物語が大団円を迎える。

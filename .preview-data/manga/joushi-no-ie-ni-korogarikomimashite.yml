  rakuten_caption: '離れたくない。ずっと一緒にいたい。

    「私、霧島さんが好きなんだ…」


    上司・霧島と、その姪っ子・桃乃とグランピングに出かけた雪。

    ところが、3人でいるところを同僚・鳥海に見られ、おまけに怪我を負わせてしまう！

    責任を感じた雪は鳥海の看病をするべく、彼の家を訪れるが鳥海から霧島への恋心を指摘されーー…。

    動揺する雪に追い打ちをかけるように、霧島と2人っきりの大阪出張も決まり…!?

    どん底から始まるハートフルラブ（!?）コメディ第4巻'

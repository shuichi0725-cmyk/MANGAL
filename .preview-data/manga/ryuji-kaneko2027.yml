  rakuten_caption: '「俺 やめるわ…ヤクザ」　腕っぷしが強く、情に厚いヤクザ・竜二は、舎弟たちを家族のように想い、慕われ、上からの信頼も厚い、本物のヤクザだった。そんな竜二が、なぜ裏社会から足を洗うことを決意したのか。

    それは6年前、ある出会いをきっかけに、竜二はこれまで知らなかった感情を知っていく…

    竜二は最後に、全て背負って何を守るのかーー。

    伝説の映画『竜二』の公開から43年。新たな時代の感性とともに再び日本映画史に名を刻んだ『RYUJI 竜二』を公式コミカライズ！'

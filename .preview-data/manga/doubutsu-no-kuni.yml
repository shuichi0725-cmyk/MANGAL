    description: スカイの攻撃で心臓を貫かれたタロウザは、瀕死の状態に陥る。謎の少年ココノの治療によって一命は取り留めたものの、いまだ予断を許さない状況が続く。そんななか、バベル3と呼ばれる新たなキメラがタロウザたちに襲いかかる。動物しかいない星に暮らすタヌキのモノコが人間の赤ちゃんを拾ったことから始まる、奇跡のアニマルファンタジー。

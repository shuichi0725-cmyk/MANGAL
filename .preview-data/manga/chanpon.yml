  rakuten_caption: "多種多様人外 究極のごった煮短編集 \n\n 人間とケルベロス、人外、獣人、不死鳥、吸血鬼…。\nX＆Instagram総フォロワー数30万人超えのマルチクリエイター・かもみらが贈る、ごった煮ごちゃまぜ短編集！！\n本書でしか読めない特別描き下ろしも収録。\n\n研ぎ澄まされた感性と唯一無二の表現で、SNSを中心に大きな支持を集める鬼才・かもみらが、満を持して放つ初の漫画短編集。\n\
    ひとくちで虜になること間違いなし！\n\n収録作品\n・ケルベロスさんとペットトリマーくん\n 殺し屋ケルベロスの3匹（？）が初めて恋に落ちた相手は、ペットトリマーのヒトだった！\n 同人誌『BAU！』『GAU！』『NYAU！』から厳選したもふもふで少し不穏な彼らの日常。\n・多目君と多口君\n 人間も人外も区別なく通う百怪学園。多眼・多口・蜘蛛男・獣人・ラミア・単眼・ろくろ首などなど、彼らの自由で不思議な学園生活。BL漫画の脇役達の恋物語・『当て馬先輩とモブ後輩』も収録。\n\
    ・不死鳥と火葬場職員\n 生と死の炎が交わる、優しいおとぎ話。\n・天国にいった神父様\n 亡き神父を慕う青年は、善行を積み彼と同じ天国へいこうとしたが…。\n・神父様と"

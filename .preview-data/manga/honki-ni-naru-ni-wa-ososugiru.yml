  rakuten_caption: '同僚でありながら、かつてセフレ関係を結んでいた悠と良介。

    良介の海外赴任を機に、2人は連絡を絶っていたが、

    帰国した良介はトラブルを起こして悠を頼ることに…。

    しかも何故だか悠の家に転がり込むことになってしまう。


    元セフレな同僚と一つ屋根の下という、奇妙な生活が始まるが、

    悠の頭をよぎるのは過去のとある約束だった……


    「本気になったら、そこで終わり」


    圧倒的画力の新鋭・KANIHAが描く、

    ドラマティックリーマンラブコメ開幕！'

  rakuten_caption: '命の恩人に、なぜか本気で口説かれていますーー。


    一途で男前な喫茶店マスター×無自覚な美人リーマン

    フルカラーで描く、エモーショナルラブ！


    不注意で川に落ちた弟月（おとつき）を救ったのは、

    近くの喫茶店のマスター・聖（ひじり）だった。


    命の恩人に何かお礼がしたいと申し出ると、聖は「週末、また店に来てほしい」と言う。

    そして戸惑う弟月へ、聖はまっすぐに告げる。


    ーーお付き合いを前提に、あなたとお友達になりたい。


    突然の求愛に困惑しながらも、弟月は彼の店へ通うようになる。


    急かさず、触れず、ただただ大切にされる週末。

    そんな優しさでじわじわ囲われたら、もう逃げ道なんてなくない!?



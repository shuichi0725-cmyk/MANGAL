  rakuten_caption: "現代の解釈で解き放つ！ 『座頭市物語』！ \n\n 揺らぐ幕藩体制、迫り来る開国の波ーー時は天保。\n暗殺集団に属していた凄腕の剣客・市は、\nかつての同僚だった徳佐と死闘を繰り広げる。\nそして、さらなる「凶敵」たちが市を包囲し？\n\n剣の道と人の道の狭間で\n懊悩する市が選ぶ道は？\n\n鮮烈 天保アクション大活劇！ \n\n 【編集担当からのおすすめ情報】\
    \ \n いまも多くの人に愛され続ける『座頭市物語』（子母澤 寛氏）。\n永遠の傑作を、『ALIENS AREA』『極東ネクロマンス』の那波歩才氏が再構築し、超絶画力で紡ぐ、斬新時代劇です。\n全神経が痺れる圧巻の真剣勝負をご堪能ください！"

  rakuten_caption: "主人公は、世界的人気ヒーロー・ソニック！ \n\n 世界的人気キャラクター「ソニック」が主人公の公式コミカライズ作品、ついに単行本になって登場！\n心優しいノロマな少年・ユータと、最速のハリネズミ・ソニック。 性格もスピードも正反対の二人が、世界を救うために駆け抜ける──！ \n『漆黒のハリネズミ シャドウ・ザ・ヘッジホッグ』の今田ユウキ先生が描く、圧倒的スピード感と熱量に満ちた本格ストーリー漫画。 SEGA完全監修、完全オリジナルストーリーで描かれるソニックの活躍を見逃すな！ \n\n 【編集担当からのおすすめ情報】 \n 疾走感あふれるド迫力のスピードアクションと、爽快なストーリー展開が魅力の本作。\nSEGA完全監修ならではの小ネタも今作の注目ポイントのひとつです。 もちろん、これが初めての「ソニック」作品という読者の方々にも、全力でおすすめできる作品です！"

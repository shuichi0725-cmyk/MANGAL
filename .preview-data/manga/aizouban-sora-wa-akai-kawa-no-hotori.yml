rakuten_caption: "あの名作オリエントロマンが豪華に復刻！ \r\n\r\n 1995年〜2002年に少女コミック（現Sho-Comi）にて連載され、単行本全28巻、累計2000万部（2026年現在）を売り上げた篠原千絵の大作「天は赤い河のほとり」が、氏の画業45周年を記念して愛蔵版として復刻。\r\
  \n\r\n豪華箔押しカバーかつA5の大判で、当時の感動がよみがえります。\r\nまた、雑誌掲載時の1話目のカラー扉を復刻収録いたします。\r\n\r\n＜あらすじ＞\r\
  \n普通の中学生の夕梨（ユーリ）は、ある日突然水たまりから伸びた手によって古代オリエントのヒッタイト帝国に引き込まれてしまう。\r\n我が子を帝位につけたいナキア皇太后の企みで命を狙われるユーリだったが、帝位継承最有力候補の皇子・カイルと出会い、次第に惹かれてゆく。\r\
  \nカイルも、現代人ならではの才覚で乱世をたくましく生き抜くユーリに特別な感情を抱きはじめるが、ユーリを現代に還すタイムリミットが迫りーー？\r\n\r\n＜内容＞\r\
  \nフラワーコミックス版1〜3巻およびカラーイラストを複数収録。 \r\n\r\n 【編集担当からのおすすめ情報】 \r\n 迫力のある戦闘シーンや、当時の中学生読者をときめかせたユーリとカイルの恋模様を大判で！\
  \ 何度読んでも新たな発見がある本作の魅力をご堪能頂ければと思います。"
catch: 水たまりから伸びた手が、少女を三千年の彼方へ攫った。古代ヒッタイトで生き抜く数奇な運命。画業45周年の愛蔵版。
synopsis: 普通の中学生だった夕梨は、ある日突然、水たまりから伸びた手に掴まれ、古代オリエントのヒッタイト帝国へと連れ去られてしまう。異国の地で待つ運命を描く歴史ロマン。

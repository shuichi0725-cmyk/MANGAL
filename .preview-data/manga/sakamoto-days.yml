synopsis: 護送車を強襲する七夕・トーレス・牛頭！ 最凶の刺客にシンとキンダカが応戦する中、神々廻＆大佛や周らJCC勢も合流し、戦場は極限状態に!! 依然、眠り続ける坂本。この戦場に終止符を打つのは果たして…!?
catch: かつて殺し屋たちが憧れた最強の男は、恋に落ち引退し、太った。商店を営む元伝説のヒットマン、家族を守れるか?新感覚アクションコメディ。

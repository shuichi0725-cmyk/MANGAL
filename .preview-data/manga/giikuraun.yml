  rakuten_caption: 'A國の王候補6人の中に裏切り者が1人。

    敵対中のB國が送り込んだスパイを見つけなければA國は乗っ取られてしまう。

    国の未来を守るため王女がスパイ捜しを依頼したのは王候補の1人、カイ・ブラックマン。


    彼はひ弱で貧弱なアニメオタクで戦闘能力は0。

    しかし、カイには「嘘」を見抜く特別な力があった！

    謀略渦巻く王位継承戦にギークな少年が挑む！

    『オリエント』『マギ』の大高忍が描く軍事ファンタジー、開幕！'

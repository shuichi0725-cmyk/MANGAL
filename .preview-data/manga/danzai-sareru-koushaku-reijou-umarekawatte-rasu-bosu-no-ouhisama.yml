catch: 断罪される悪役令嬢に転生。ならばラスボスの養女になります。
synopsis: 目覚めると、小説の中で無実の罪により断罪される悪役令嬢リリアの幼女姿になっていた。前世の記憶を頼りに、彼女はこの世界のラスボスである王妃へ助けを求め、その養女の座を掴み取る。

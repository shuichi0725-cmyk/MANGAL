    「無実の罪で断罪される悪役令嬢」・リリアに転生していたらしい。

    でも、前世の記憶を思い出したからには、思い通りになるものか…！！

    手始めにこの世界のラスボス・ヒルベルト王妃に助けを求めたら、

    まさかの養子入り成功ーー！？

    しかも、その王妃には溺愛されるわ、可愛すぎる兄はできるわで、

    私の第二の人生、満たされすぎ……！？


    断罪幼女→ラスボス養女になって一発逆転！


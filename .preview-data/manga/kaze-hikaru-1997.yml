    description: 徳川慶喜が十五代将軍に正式に即位して間もなく、孝明天皇が世を去る。政権をめぐる争いから、暗殺の疑いも持ち上がった。伊東は新選組を二つに分け、分かれた一派を薩摩の内部へ送り込んで情報を得るという策を土方に提案する。慶応三年の正月、伊東は斎藤と永倉を宴席へ呼んだ。門限を破ってまで料亭に居続け、切腹を覚悟する三人には、それぞれの思惑があった。
  - number: 31
    asin: null
    isbn13: '9784091341099'
    cover_url: https://thumbnail.image.rakuten.co.jp/@0_mall/book/cabinet/1099/9784091341099_1_5.jpg?_ex=200x200
    release_date: '2011-12-31'
    description: 激動の慶応三年、参謀の伊東甲子太郎が先導してきた新選組分離（偽装）策が、いよいよ正式に動き出す。薩長の情報を得るためという表向きの理由の裏には、伊東の巧みな思惑が隠されていた。別働隊・御陵衛士の人選は隊内に波紋を呼び、志願する者と残る者、それぞれの矜恃と本心が交錯する。セイにとっても、沖田や斎藤、土方、近藤にとっても、己の本分を見つめ直す転機となる。
  - number: 32

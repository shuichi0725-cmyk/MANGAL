    description: 大政奉還が成る。そのウラには、新選組の知られざる活躍があった。倒幕派の動きが過激さを増す中、長州は出兵の準備を進め、薩摩は将軍慶喜討伐の勅命を得ようと朝廷内の反幕勢力へ手を回す。土佐は大政奉還を建白し、政権の返上を幕府に迫った。慶喜が返答を引き延ばす間に、新選組は幕末史の行方を左右する重大な情報を入手する。時代の奔流から取り残され己の無力を知る沖田だが、その病は良好な状態が続き、セイは奇跡を願う。

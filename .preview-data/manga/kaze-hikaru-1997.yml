    description: 新選組が分離し、セイと総司は唇を重ねる。隊を離れた斎藤は、伊東が率いる新選組の分派へ加わることになった。そして総司を慕う遊女・子花には、壮絶な最期が待つ。嬉しいことも楽しいことも、つらいことも、武士の覚悟も女性の涙も描き込み、うねる時代とキャラクターたちの生き様を堪能させる圧巻の32巻。
  - number: 33

  rakuten_caption: '生真面目サラリーマン・成嶋の癒しは、女装アイドル『いずみん』を応援すること。

    可憐なビジュアルとは裏腹に、いずみんは無愛想で毒舌ーー

    けれど、ひたむきに努力する姿が何よりの魅力！

    いつものように“推し活”を楽しんでいた成嶋は、ある日、

    プライベートの『いずみん』こと泉に遭遇。

    悪質ファンに追われていた泉を助けたことで、泉に懐かれてしまう。

    ……が、成嶋は『推しは遠くから見守りたい派』のオタクだった!!　

    距離を縮めたいアイドルと距離を取りたいオタクのすれ違いラブコメディ、開幕！'

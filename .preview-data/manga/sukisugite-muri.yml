  rakuten_caption: '「今日してみようか、最後まで」


    親の再婚で兄弟になった利玖と春輝。 ふたりは家族にも友達にも秘密の“恋人同士”。

    190cmの高身長に容姿端麗、女子からもモテる春輝は、学校でも利玖にベッタリ。

    利玖は照れ隠しでツンを装うけれど、 内心は春輝が愛おしくてたまらない。

    こんなに弟から溺愛されて、不安になる必要なんてないはずなのに。

    実は…春輝のアレが大きすぎて、エッチがまだ　“最後まで”　できていなくて……。

    焦る中、女子から春輝の連絡先を聞かれた利玖は、モヤモヤしてしまいーー!?'

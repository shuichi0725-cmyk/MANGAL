catch: 寝ている間にレベルが上がる。過労死したプログラマーが異世界に持ち込んだのは、前世で極めた放置ゲーの理論だった。
synopsis: ブラック企業で過労死したプログラマーは、異世界で少年ジークに転生する。前世の知識から「放置ゲー理論」を思いつき、自動で魔物を狩る“闇人形”を生み出して、眠る間に力を蓄えていく。

  rakuten_caption: 'ブラック企業で過労死してしまったプログラマーは、異世界でジークという子供に転生した。

    そこでジークは「放置ゲー理論を持ち込んだら最強になれるんじゃね？」と

    前世の知識を活かし、最強の魔法使いを目指すことを決意する。

    魔術の基礎訓練を積み、異世界生活7年目にして

    “闇人形”という全自動でモンスターを倒し、経験値や素材を集める魔術を生み出すことに成功!?

    夜中に闇人形に狩りの指示をして寝ているだけで、みるみるレベルアップしていき、大人の冒険者の想像を超えていくーー

    放置ゲー理論で最強を目指す冒険譚、ここに開幕‼'

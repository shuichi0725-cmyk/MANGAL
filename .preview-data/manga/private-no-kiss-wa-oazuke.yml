  rakuten_caption: '王子様系アイドル・瀬川依は、童貞で恋愛経験ゼロなのに、

    ドラマで濡れ場を演じることになってしまった。


    エッチなことには興味津々……だけど

    経験値が足りない依の危なっかしい様子を見かね、

    マネージャーの龍平から

    役作りのための特別講師を紹介される。


    講師役の男はーーAV男優の久我玄室。

    彼は、メンバーの若宮美弦に連れられ

    初めて訪れたクラブで、依が思わず目を奪われた大人の色男。


    手練れな玄室に依は

    どんどんのめり込んでいきーー…。


    包容力MAXのカリスマ男優×ピュアすぎる王子様系アイドル

    甘く淫らなプライベートレッスン、開講！'

synopsis: 超がつくほど人見知りの高校生・朝野太陽が唯一心を許せるのは、幼馴染の夜桜六美。ところが彼女は、究極のスパイ一家の娘だった。さらに六美は、過保護で悪夢のような兄・凶一郎に付きまとわれている。六美を守るため太陽が取る思い切った手段とは——スパイ家族のコメディ。

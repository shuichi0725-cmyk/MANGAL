  rakuten_caption: '人間のオスの精え…精気を糧とし生きる、女子大生サキュバスの桜庭（さくらば）ジル。

    サディスティックな女弁護士・辻巴に目を付けられると、

    その数え切れない不貞行為を見逃す代わりにと、巴の手駒となって「男と別れたい女性」の手助けをする、

    限りなくグレーでエッチなおしごとを強要されるのだった。

    そんなある日、辻巴弁護士事務所に変態男からの性被害に苦しむ女学生が訪れる。

    巴が不在なのをいいことに勝手に安請け合いし、相棒の花をおとりにした作戦を決行するジル。

    だが作戦は当然、大失敗。

    花が変態男の欲望の餌食になろうとしていた……！'

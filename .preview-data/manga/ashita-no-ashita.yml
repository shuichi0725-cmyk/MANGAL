  rakuten_caption: '今が変わるのが…終わるのが怖い。でも、その先を見つめて。


    平凡ながらも楽しい学校生活を送る千沙代、よみ、美雪たち。

    四季折々の出来事を満喫するが、高校生の一大イベント「進路調査」の時期がやってくる。

    ふと「将来」を考えたとき、「今」についても千沙代は悩み始めてしまってーー？


    ゆるりのんびり日常開拓コミック第2巻!!'

  rakuten_caption: '大学入学を期に、アパートで一人暮らしを始めた花田颯太。

    真面目できれい好き、だらしないのは許せない性格の颯太は、実は大のエルフオタクだった。

    そんな彼に告げられたのは、お隣さんが正真正銘の「エルフ」だという衝撃の事実！

    彼が越してきたアパート「イセカイ・ハイツ」は、人間以外の存在も受け入れる特別なアパートだったのだ。

    エルフとは、優雅で賢く、神に近く気高い存在…。憧れを胸にお隣さんのドアを叩く颯太だが、現れたエルシアさんは、汚部屋で酒浸りの超だらしないエルフでーー!?


    「こんなエルフは認めない！ 僕がエルシアさんを真人間…いや真エルフにしてやる!!」

    「え〜？ お隣くんも一緒にごろごろしようよ〜」


    勢いでだらしなエルフのお世話係になってしまった颯太は、エルシアさんからの堕落への誘惑に抗えるのか…!?'

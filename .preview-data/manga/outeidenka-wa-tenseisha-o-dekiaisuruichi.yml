  rakuten_caption: '「殿下は好みじゃありません」


    平凡な会社員の海老沢大志は、同僚との食事の帰りに事故に遭ってしまう。

    目が覚めると、そこには見知らぬ人物と、綺羅びやかな部屋。

    どうやら、名門侯爵家の次男リオン・クレアージュに異世界転生してしまったようで……。

    美形の家族に囲まれ、恵まれた容姿をしているはずなのに、なぜか自分はボサボサの黒髪にダサい伊達メガネ。

    大志はそんな今の自分の身なりを整え、登城すると、遊び人と噂の王弟殿下が接近してきてーー。


    「今の君は、私好みだ」


    ハッキリと拒絶するも、なぜか更に執着されてしまうーー。'

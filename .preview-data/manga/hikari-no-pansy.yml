synopsis: アフリカで発見された、チンパンジーに育てられた野生の少女パンジー。彼女を見つけた青年マークは、研究のため彼女を母国ローランドへ連れ帰る。やがてパンジーは、少し年上の少年エドと出会い、その自由な心を愛される。冒険と陰謀のドラマ。

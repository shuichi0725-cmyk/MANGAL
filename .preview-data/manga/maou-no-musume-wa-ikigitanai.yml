  rakuten_caption: "鬼畜難易度の“死に戻り冒険”開幕！！ \n\n 魔王の娘・ベルフェゴルは、「ただダラダラ過ごしたい」ポンコツ魔族。\n不幸にも、魔王討伐に来た勇者に惨殺され…と思いきや、なぜか生き返り！？\n 地獄！血！死！死！死！\n世界一怠惰な魔族が死にまくる、悲哀のデスロード開幕！！ \n\n 【編集担当からのおすすめ情報】 \n ありとあらゆる方法で、死にまくるベルフェゴル。\n\
    何度死んでも心折れない生き汚さが、なんだか不思議と可愛く見えてくる…\nそんな可哀想可愛いをぜひ楽しんでください！"

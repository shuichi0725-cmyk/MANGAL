    description: クーデターによって渚としずくを負傷させ、月人間城を奪った十六夜ルナ。彼女は地球人の女子高生になりすまし、二子玉高校へ転入してきた。そして同じく女子高生として通っているしずくに、次の体育の柔道で私に勝てたら城を返すと挑発し、さっそく柔道対決へ。しずくは首領の娘の名誉にかけ、右手を負傷しながらも善戦するが。さらに月人間の発射した兵器が、自らの月を破壊してしまう大ピンチも発生する。その危機を回避すべく、ジャパのメンバーたちが宇宙へと飛び立つ。果たして地球と月の運命はどうなるのか。

  rakuten_caption: '幼い頃、犬神の呪いで声を封じられた宵子は、”呪い子”として家族から冷遇され使用人のように扱われていた。

    足に付けさせられた鈴の音を立てないよう、日々平穏を祈っていた宵子はある日、双子の姉・暁子の代わりに出席した鹿鳴館の夜会でドイツ貴族の青年・クラウスと出逢う…。

    声も出せず言葉もわからない中での一度きりのダンスは、心を閉ざした宵子の心を溶かし、クラウスもまた宵子の美しさに一目惚れしてーー。


    一夜の出逢いで二人の運命が大きく動き出す！

    西洋浪漫香る、運命の物語ーー！'

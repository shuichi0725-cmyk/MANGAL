    今までは友達ができなかったけど、新学期を迎え、今年こそは友達を作りたい！ 自分を変えるため一歩踏み出そうとするネガッチョが出会ったのは、怖そうな転校生・牙城さんで…!?

    自信はないけど変わりたい、不器用でまっすぐな学園青春コメディ！'

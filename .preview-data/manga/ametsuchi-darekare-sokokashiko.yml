synopsis: ヒゲもこどもも高校生も。　天涯孤独の身の上だと思っていた青司が相続した祖父の家。その家で年神の年男、納戸神の納戸と共に暮らしながら、友人、親戚、神々との賑やかな日々を過ごしてほぼ一年が経過したある日、青司はふと、あることに気づく。土着日常奇譚、ここに完結！
catch: 天涯孤独だと思っていた青司が相続したのは、年神や納戸神が暮らす祖父の家。神々や友人と過ごす賑やかな一年の果てに、青司はあることに気づく——土着日常奇譚、完結編。

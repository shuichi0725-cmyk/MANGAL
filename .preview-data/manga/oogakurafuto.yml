synopsis: 'クラフトビールって…名前は聞くけどおいしいの？

  羽立姫子、21歳無職。親の都合で東京から秋田県男鹿へ引っ越したけどやりたい仕事も夢もなく、フラフラ過ごす日々。癒やしはせいぜい、ゲームの女性キャラを目の保養にするぐらい。そんなある日、散歩中に偶然出会ったクラフトビールを造るお姉さん'
catch: 無職で夢もない21歳の姫子が、引っ越し先の秋田・男鹿で偶然出会ったのはクラフトビールを造るお姉さん。馴染みのない一杯から始まる、小さな町と人との縁。ほろ苦くも前を向きたくなる、地ビール×地方暮らしのお仕事グルメ譚。

  rakuten_caption: "公式外伝！空白の数十年を覗き見。 \n\n 自らの力を人のために使うことを紗都子と約束し\n進平は贖罪の旅へと歩み出す。\n\n旅の途中で出会った少年・河合弥太郎は、\n進平を師と慕い、共に旅をすることになる。\n真っ直ぐな弥太郎と過ごす日々は、止まっていた彼の時間を少しずつ動かしていくーー\n\n二人が歩んだ、師弟の旅路。\n本編では描かれなかった進平の物語が、ここに。\
    \ \n\n 【編集担当からのおすすめ情報】 \n 最終回までの空白の時間を描く、公式外伝！！\n空虚な心で旅をしていた進平は、弥太郎と出会い、何を思い、何を得たのか……？\n\n★東京メトロ丸ノ内線新宿駅のメトロプロムナードに掲出された、紗都子と進平の番外編「縁結びの橋」収録！\n★描き下ろしおまけ漫画は、なんと合計15p！！！\n ・進平が料理……！？\n ・稀代の小説家オクムラ…！？\n\
    \ ・紗都子への恋煩いをこじらせた進平がスピリチュアルに…？\n ・弥太郎、初恋のつづき…\nなど4本収録！！！"

synopsis: 母親が御影に殺されたことを知った藤は復讐を決意。オルビスの一員・油田に御影を裏切るよう迫る藤の思惑は…。一方、桐は音信不通だった友人・ハヤトと再会。自身を嵌めたハヤトに対し強盗犯・シザーマンではないかと追及するが…。背信と疑惑が渦巻く商店街で戦いのゴングが鳴らされる──。
catch: 母を殺された藤は復讐を、桐は自身を嵌めた友を追う——背信と疑惑が渦巻く商店街を舞台に、裏切りと暴力が交錯する。誰が敵で誰が味方か、戦いのゴングが鳴り響くダークサスペンス・アクション。

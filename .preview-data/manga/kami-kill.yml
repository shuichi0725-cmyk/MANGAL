synopsis: 寂れた商店街で、兄弟のフジとキリは父の帰りを待ちながら小さな理髪店を営んでいる。生活費を稼ごうと奮闘する二人のもとには、毎日のように新たな出来事が訪れて——。下町を舞台にした物語。
catch: 母を殺された藤は復讐を、桐は自身を嵌めた友を追う——背信と疑惑が渦巻く商店街を舞台に、裏切りと暴力が交錯する。誰が敵で誰が味方か、戦いのゴングが鳴り響くダークサスペンス・アクション。

synopsis: 簡単に作れてボリューム満点の、働く男たちの手軽なガッツリ飯を紹介するグルメ漫画。流行・歴史・郷土・家族など多角的に食を語り合い、袋麺や勝負飯、夜食、カレーうどんなど、空腹と孤独を満たす一品が並ぶ。
catch: 簡単でボリューム満点、働く男たちの手軽でガッツリな飯が盛りだくさん。袋麺に勝負飯、夜食やカレーうどん――流行も歴史も郷土も家族も、食へのこだわりを熱く語り合う。空腹と深夜の孤独を埋めてくれる、男たちのグルメ談義漫画。

  rakuten_caption: '大型ワンコ系人外（？）×視えちゃう世話焼き男子

    メリーホラーBL


    人ならざるものが視えてしまう男子高校生・水谷は、怪異から助け出したことをきっかけに「常葉くん」と出会う。

    背が高くて、少し暗くて、寂しがりで不器用で…そして素直な常葉くんのことが、水谷はどんどん気になってくる。

    けれど、ある放課後、ナニカに閉じ込められた教室で…

    「怖がらなくて大丈夫だよ、俺にキスして？」

    ──常葉くんが豹変…!?'

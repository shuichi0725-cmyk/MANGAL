  rakuten_caption: 【ひとりでは越えられない夜も、君となら。】瀕死のカワウと捕食者のオオカミが出会い、魂の会話を交わす表題作「夜をまたいで」をはじめ、仲良しなキツネ兄弟の巣立ちと今生の別れを描く「面影を抱いて」、「愛」とは何かを伝えたいリスの物語「君のため芽吹く」、かしこいネズミとやんちゃなネズミ、お互いを大好きなふたりが冬に備える「春をぬくめて」など、動物たちのやさしい世界を描いた8つの短編マンガと美しいペン画イラストを収録。瑞々しい感性が煌めく、胡桃（くるみ）初のコミック＆イラスト集！

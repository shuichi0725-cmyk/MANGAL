  rakuten_caption: ブラックな星間輸送会社で働いていた、タツヤフジシロ。仕事中に宇宙海賊に襲われ、脱出ポッドに入れられると、ブラックホールに向けて射出されてしまう。運よく流れ着いた先で古代戦艦に拾われて、九死に一生を得る。その戦艦は現代技術をはるかに凌駕する性能を備えた最強戦艦だった。この力を活かすためにタツヤは傭兵に転職。最初の依頼はとある女の子の護衛。しかし、彼女を狙う宇宙海賊たちの背後には強大な組織が絡んでいて、タツヤは陰謀に巻き込まれていくーー。最強戦艦で宇宙を駆けるSFファンタジー開幕！

  rakuten_caption: '「幼馴染の男子二人はお互いのことが好きである」

    ーーこれは、そんな“勘違い”をした関係性オタク女子による、

    令和の【三角関係ラブコメ】である。


    小山もみじには二人の幼馴染がいる。

    一人は秀才の高身長イケメン、諒(りょう)。

    もう一人はスポーツ万能な美少女顔男子、青陽(あおひ)。

    モテモテの完璧男子二人とともに育ったもみじは、

    すっかり二人の強火オタクと化していた!!!!

    同級生に布教をし、昼休みは幼馴染ウォッチングに勤しむ中で

    もみじはある日、二人が互いの事を好きだと勘違いしてしまう。


    幼馴染の恋を成就させるべく全力を尽くすもみじだが、

    二人が本当に好きなのは、他でもないもみじのことでーー。


    幼馴染の【溺愛】に気付かない、強火オタク女子のすれ違いラブコメ!!'

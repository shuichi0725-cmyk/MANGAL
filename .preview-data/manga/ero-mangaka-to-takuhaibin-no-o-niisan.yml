  rakuten_caption: 'エロはエロでも、BLは描いていないんだけど？

    男性向け人気エロ漫画家の月島は、荷物を届けてくれる宅配業者の配達員・佐伯が気になって仕方ない。カッコいいし、汗をかいている姿もセクシーだしーーということで、本人に無許可でこっそり漫画（若妻と宅配業者のエロ）のキャラクターにしていた。ところがある日、オトナのオモチャ（漫画の資料）が散乱した部屋を佐伯に見られてしまう。恋の自覚と共に失恋が決定…と思ったら、佐伯に好きだと告白されて!?

    「この漫画みたいに、あなたをオモチャでじらしたり、おねだりさせてみてもいいですか？」って、現実は（エロ）漫画より奇なり!? 描き下ろしは漫画の「資料」を使ったエッチ!?


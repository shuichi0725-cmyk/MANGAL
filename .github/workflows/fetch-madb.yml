name: 📥 Fetch MADB (test run)

# 2026-05-08: scripts/fetch-madb.ts の動作確認用 standalone workflow。
# bulk-promote-test workflow への統合は別プラン。
#
# データ責務分担 (= Tier 1 で確定):
#   - MADB:      ISBN / publisher_key / volume_number / release_date / edition.type
#   - Wikipedia: magazine_key / title_kana / genres / synopsis / demographic
#
# MADB は graph 構造的に 単行本 と 雑誌 の link を持たない (= MangaBook と
# MangaMagazine が分離されたサブグラフ)。 そのため magazine 情報は
# 既存の fetch:wikipedia (= NDL pipeline で実証済) で別途埋める。

on:
  workflow_dispatch:
    inputs:
      qids:
        description: "空白区切りの QID 列 (= 既定: 6 作家 probe-madb と同じ subset、 CSV mangaka.qid 真値)"
        required: true
        default: "Q3782468 Q241885 Q348436 Q600217 Q24865213 Q972529"
      include_original_author:
        description: "[原作] credits も拾う (= 諫山創 → キメツ学園スピンオフ等)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      INPUT_QIDS: ${{ inputs.qids }}
      INPUT_INCLUDE_OA: ${{ inputs.include_original_author }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! printf '%s' "$INPUT_QIDS" | grep -Eq '^Q[0-9]+( +Q[0-9]+)*$'; then
            echo "::error::qids は空白区切りの 'Q+数字' のみ"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Fetch MADB for each QID (= ISBN + publisher 担当)
        run: |
          OA_FLAG=()
          if [ "$INPUT_INCLUDE_OA" = "true" ]; then
            OA_FLAG+=(--include-original-author)
          fi
          for q in $INPUT_QIDS; do
            echo "::group::fetch:madb $q"
            npm run fetch:madb -- --qid "$q" "${OA_FLAG[@]}"
            echo "::endgroup::"
          done

      - name: Fetch Wikipedia (= magazine_key / title_kana / genres / synopsis 補完)
        # MADB は graph 構造上 単行本 → 雑誌 link を持たないので、 magazine
        # 情報は Wikipedia infobox から補完する (= 既存 NDL pipeline と同じ)。
        # 1.1 s/req × series 数。 6 作家 probe (= ~123 series) なら 数分。
        run: npm run fetch:wikipedia

      - name: DB summary report
        run: npm run db:report -- --series --sources

      - name: DB top 30 (= MADB 由来 series が並ぶ想定)
        run: npm run db:report -- --top 30

      - name: Show MADB raw dumps directory
        if: always()
        run: |
          echo "=== .cache/madb/ files ==="
          ls -la .cache/madb/ || true

      - name: Probe edition predicate (= 「版表示」 URI 確定)
        if: always()
        # Monster CSV 分析で MADB は title でなく独立 column 「版表示」 で
        # 「完全版」 / 「特装版」 を保持していると判明。 RDF predicate URI
        # を発見するため、 MangaBook の outgoing predicates のうち value に
        # 「完全版」 を持つものを直接 SPARQL で探る。 1 度判明したら fetcher
        # の SPARQL に hard code して、 この step は削除可能。
        run: |
          set -euo pipefail
          MADB_SPARQL="https://mediaarts-db.artmuseums.go.jp/sparql"
          echo "=== predicates of class:MangaBook whose literal contains \"完全版\" ==="
          QUERY='PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
          SELECT ?p (COUNT(*) AS ?n) WHERE {
            ?b a class:MangaBook ; ?p ?o .
            FILTER(isLiteral(?o) && CONTAINS(STR(?o), "完全版"))
          } GROUP BY ?p ORDER BY DESC(?n) LIMIT 10'
          curl -sS -X POST \
            -H 'Accept: application/sparql-results+json' \
            --data-urlencode "query=$QUERY" \
            "$MADB_SPARQL" \
            | jq -r '.results.bindings[] | "\(.n.value) × \(.p.value)"' \
            || echo "(SPARQL fetch failed)"
          echo
          echo "=== sample MangaBook with 完全版 (= verify URI mapping) ==="
          QUERY2='PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
          SELECT ?b ?p ?o WHERE {
            ?b a class:MangaBook ; ?p ?o .
            FILTER(isLiteral(?o) && STR(?o) = "完全版")
          } LIMIT 3'
          curl -sS -X POST \
            -H 'Accept: application/sparql-results+json' \
            --data-urlencode "query=$QUERY2" \
            "$MADB_SPARQL" \
            | jq -r '.results.bindings[] | "\(.b.value) -- \(.p.value) -- \(.o.value)"' \
            || echo "(SPARQL fetch failed)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-madb-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/madb/
            .cache/wikipedia/
          if-no-files-found: warn

name: 📥 Fetch MADB (CSV import test run)

# 2026-05-08: SPARQL 路線を廃止し、 MADB 公式 CSV (= cm101 マンガ単行本)
# を直接 import する形に転換した。 旧 workflow は schema discovery / 完全版
# 判定の SPARQL probe step を含んでいたが、 CSV では「版表示」「巻」「レー
# ティング」 が独立 column 化されているため不要になった。
#
# データ責務分担 (= Tier 1 で確定):
#   - MADB:      ISBN / publisher_key / volume_number / release_date / edition.type
#   - Wikipedia: magazine_key / title_kana / genres / synopsis / demographic
#
# adult filter (= scripts/fetch-madb.ts 4 層):
#   1. レーティング = 成年コミック     ← MADB 公式 (= 一次)
#   2. 概要 に 成年コミック 含む        ← rating 漏れ catch
#   3. 単行本レーベル ∈ adult_imprints ← Tier 2 シード DB 照合
#   4. 発行者名 ∈ adult_publishers      ← Tier 1 シード DB 照合
#
# bulk-promote-test workflow への統合は別プラン。

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: "MADB cm101.csv の直リンク URL (= 公式 portal の download ボタンからコピー)"
        required: true
        type: string
      mangaka_limit:
        description: "import 対象の mangaka 数上限 (= 動作確認用、 空 / 0 で全員)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      INPUT_CSV_URL: ${{ inputs.csv_url }}
      INPUT_LIMIT: ${{ inputs.mangaka_limit }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [ -z "$INPUT_CSV_URL" ]; then
            echo "::error::csv_url is required"
            exit 1
          fi
          # URL は https:// 始まりのみ許可 (= file:// 等を防ぐ)
          if ! printf '%s' "$INPUT_CSV_URL" | grep -Eq '^https://'; then
            echo "::error::csv_url must be https://"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Seed adult publisher / mangaka lists (= Wikipedia + manual)
        # adult-publishers / adult-mangaka-known テーブルを seed しておくと
        # MADB CSV の adult filter 4 次 (= 発行者名照合) が発火する。 imprint
        # seed (Tier 2) は data/seeds/adult-imprints.yml が source-of-truth で
        # db:init 後に seed:adult-imprints から流す。
        run: |
          npm run fetch:adult-lists
          npm run seed:adult-imprints

      - name: Download MADB cm101 CSV
        run: |
          mkdir -p .cache/madb
          # User-Agent を付ける (= portal が bot を弾く可能性に対する保険)
          curl -sSL \
            -A "MANGAL-MADBFetcher/0.2 (+https://github.com/shuichi0725-cmyk/MANGAL)" \
            -o .cache/madb/cm101.csv \
            "$INPUT_CSV_URL"
          # 期待 column 数 (= 52) を header で確認
          head -1 .cache/madb/cm101.csv | awk -F',' '
            { if (NF != 52) { print "ERROR: expected 52 columns, got " NF; exit 1 } else { print "ok: 52 columns" } }
          '
          echo "csv lines: $(wc -l < .cache/madb/cm101.csv)"
          echo "csv bytes: $(stat -c%s .cache/madb/cm101.csv)"

      - name: Fetch MADB (CSV import)
        # mangaka_limit が空 / 0 なら全員 import、 数値なら DB の上から N 名のみ。
        run: |
          ARGS=(--csv-path .cache/madb/cm101.csv --all)
          if [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "0" ]; then
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          npm run fetch:madb -- "${ARGS[@]}"

      - name: Fetch Wikipedia (= magazine_key / title_kana / genres / synopsis 補完)
        # MADB CSV には magazine link が無いので、 既存 NDL pipeline と同じ
        # Wikipedia infobox 補完を流す。 1.1 s/req × series 数。
        run: npm run fetch:wikipedia

      - name: DB summary report
        run: npm run db:report -- --series --sources

      - name: DB top 30 (= MADB 由来 series が並ぶ想定)
        run: npm run db:report -- --top 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-madb-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/wikipedia/
          if-no-files-found: warn

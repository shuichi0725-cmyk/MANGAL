name: 📥 Fetch MADB (test run)

# 2026-05-08: scripts/fetch-madb.ts の動作確認用 standalone workflow。
# bulk-promote-test workflow への統合は別プラン (= 本プラン Out of scope)。
#
# - 空 DB を作って mangaka CSV import → 指定 QID で MADB fetch を実行
# - DB report で投入された series / editions / volumes を確認
# - artifact: .cache/db.sqlite + .cache/madb/ raw dumps

on:
  workflow_dispatch:
    inputs:
      qids:
        description: "空白区切りの QID 列 (= 既定: 6 作家 probe-madb と同じ subset、 CSV mangaka.qid 真値)"
        required: true
        default: "Q3782468 Q241885 Q348436 Q600217 Q24865213 Q972529"
      include_original_author:
        description: "[原作] credits も拾う (= 諫山創 → キメツ学園スピンオフ等)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      INPUT_QIDS: ${{ inputs.qids }}
      INPUT_INCLUDE_OA: ${{ inputs.include_original_author }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! printf '%s' "$INPUT_QIDS" | grep -Eq '^Q[0-9]+( +Q[0-9]+)*$'; then
            echo "::error::qids は空白区切りの 'Q+数字' のみ"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Fetch MADB for each QID
        run: |
          OA_FLAG=()
          if [ "$INPUT_INCLUDE_OA" = "true" ]; then
            OA_FLAG+=(--include-original-author)
          fi
          for q in $INPUT_QIDS; do
            echo "::group::fetch:madb $q"
            npm run fetch:madb -- --qid "$q" "${OA_FLAG[@]}"
            echo "::endgroup::"
          done

      - name: DB summary report
        run: npm run db:report -- --series --sources

      - name: DB top 30 (= MADB 由来 series が並ぶ想定)
        run: npm run db:report -- --top 30

      - name: Show MADB raw dumps directory
        if: always()
        run: |
          echo "=== .cache/madb/ files ==="
          ls -la .cache/madb/ || true

      - name: Inspect first record per author (= magazine field debug)
        if: always()
        run: |
          for f in .cache/madb/*.json; do
            echo "::group::$(basename $f) — first record"
            jq '.records[0]' "$f" 2>/dev/null || cat "$f" | head -30
            echo "::endgroup::"
          done

      - name: Show unique magazine literals (= master 解決の手掛り)
        if: always()
        run: |
          echo "=== unique magazine literals across all authors ==="
          jq -r '.records[].magazine' .cache/madb/*.json 2>/dev/null \
            | sort -u | head -50 || true
          echo
          echo "=== unique magazineType across all authors ==="
          jq -r '.records[].magazineType' .cache/madb/*.json 2>/dev/null \
            | sort | uniq -c | sort -rn || true

      - name: Probe MangaBookSeries → MangaMagazine link predicate
        if: always()
        # 前 run で schema:isPartOf は MangaBookSeries を指しており (=
        # 665/689)、 真の雑誌情報はそこから更に 1 hop 必要だと判明。
        # MangaBookSeries の outgoing predicates と、 各 predicate の
        # target type 分布を SPARQL で直接取得して、 雑誌への正しい link
        # predicate を発見する。
        run: |
          set -euo pipefail
          MADB_SPARQL="https://mediaarts-db.artmuseums.go.jp/sparql"

          echo "=== [1] outgoing predicates of class:MangaBookSeries (top 30) ==="
          QUERY1='PREFIX schema: <https://schema.org/>
          PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
          SELECT ?p (COUNT(*) AS ?n) WHERE {
            ?s a class:MangaBookSeries ;
               ?p ?o .
          } GROUP BY ?p ORDER BY DESC(?n) LIMIT 30'
          curl -sS -X POST \
            -H 'Accept: application/sparql-results+json' \
            --data-urlencode "query=$QUERY1" \
            "$MADB_SPARQL" \
            | jq -r '.results.bindings[] | "\(.n.value | tonumber | tostring) × \(.p.value)"' \
            || echo "(SPARQL fetch failed)"

          echo
          echo "=== [2] target type distribution from MangaBookSeries (any predicate, top 15) ==="
          QUERY2='PREFIX schema: <https://schema.org/>
          PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
          SELECT ?type (COUNT(*) AS ?n) WHERE {
            ?s a class:MangaBookSeries ;
               ?p ?next .
            ?next a ?type .
          } GROUP BY ?type ORDER BY DESC(?n) LIMIT 15'
          curl -sS -X POST \
            -H 'Accept: application/sparql-results+json' \
            --data-urlencode "query=$QUERY2" \
            "$MADB_SPARQL" \
            | jq -r '.results.bindings[] | "\(.n.value | tonumber | tostring) × \(.type.value)"' \
            || echo "(SPARQL fetch failed)"

          echo
          echo "=== [3] specific predicates from MangaBookSeries → MangaMagazine ==="
          QUERY3='PREFIX schema: <https://schema.org/>
          PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
          SELECT ?p (COUNT(*) AS ?n) WHERE {
            ?s a class:MangaBookSeries ;
               ?p ?mag .
            ?mag a class:MangaMagazine .
          } GROUP BY ?p ORDER BY DESC(?n) LIMIT 10'
          curl -sS -X POST \
            -H 'Accept: application/sparql-results+json' \
            --data-urlencode "query=$QUERY3" \
            "$MADB_SPARQL" \
            | jq -r '.results.bindings[] | "\(.n.value | tonumber | tostring) × \(.p.value)"' \
            || echo "(SPARQL fetch failed)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-madb-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/madb/
          if-no-files-found: warn

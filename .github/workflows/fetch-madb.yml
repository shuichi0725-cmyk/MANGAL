name: 📥 Fetch MADB (JSON-LD import test run)

# 2026-05-08: SPARQL → CSV → JSON-LD と段階的に転換した最終形。 公式
# GitHub release `mediaarts-db/dataset` の latest tag asset
# (= metadata101_json.zip、 ≈47.5MB / 展開後 ≈627MB / ≈397k records)
# を直接 fetch して streaming 投入する。
#
# データ責務分担 (= Tier 1 で確定):
#   - MADB:      ISBN / publisher_key / volume_number / release_date / edition.type
#   - Wikipedia: magazine_key / title_kana / genres / synopsis / demographic
#
# adult filter (= scripts/fetch-madb.ts 4 層):
#   1. schema:contentRating == "成年コミック"   ← MADB 公式 (= 一次)
#   2. schema:description に "成年コミック" 含む ← rating 漏れ catch
#   3. schema:brand ∈ adult_imprints              ← Tier 2 シード DB 照合
#   4. schema:publisher ∈ adult_publishers         ← Tier 1 シード DB 照合

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "mediaarts-db/dataset の release tag (= 例 1.2.15)。 空で latest 自動解決"
        required: false
        default: ""
        type: string
      mangaka_limit:
        description: "import 対象の mangaka 数上限 (= 0 で全員)"
        required: false
        default: "0"
        type: string
      run_wikipedia:
        description: "Wikipedia step を走らせるか (= 6,650 series で ~1.5h かかる、 fetch:madb 単体検証なら false)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 全体 180 分 cap。 内訳:
    #   fetch:madb 単体    ≈   2 分
    #   fetch:wikipedia    ≈ 110-130 分 (= 6,900 series × 1.1 秒/req)
    #   その他 step + 余裕 ≈  30 分
    # 60 分だと wikipedia 込みで間に合わない (= 2026-05-08 の試走で 35% 進捗時点で
    # cancel されたため引き上げ)。 GH Actions の job max は 360 分 (= 6h)。
    # 将来 series が更に増えるなら別 workflow 化を検討する。
    timeout-minutes: 180
    env:
      INPUT_TAG: ${{ inputs.release_tag }}
      INPUT_LIMIT: ${{ inputs.mangaka_limit }}
      INPUT_RUN_WIKIPEDIA: ${{ inputs.run_wikipedia }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Resolve release tag (= latest if empty)
        id: tag
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # GitHub API で latest tag 取得。 -L で redirect 追従。
            TAG=$(curl -sSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/mediaarts-db/dataset/releases/latest" \
              | jq -r '.tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::failed to resolve latest tag"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "[ok] resolved tag: $TAG"

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Seed adult publisher / mangaka lists (= Wikipedia + manual)
        run: |
          npm run fetch:adult-lists
          npm run seed:adult-imprints

      - name: Download MADB metadata101_json.zip
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p .cache/madb
          URL="https://github.com/mediaarts-db/dataset/releases/download/${TAG}/metadata101_json.zip"
          echo "[fetch] $URL"
          curl -sSL \
            -A "MANGAL-MADBFetcher/0.3 (+https://github.com/shuichi0725-cmyk/MANGAL)" \
            -o .cache/madb/metadata101_json.zip \
            "$URL"
          echo "zip bytes: $(stat -c%s .cache/madb/metadata101_json.zip)"

      - name: Extract metadata101.json
        run: |
          cd .cache/madb
          unzip -p metadata101_json.zip metadata101.json > metadata101.json
          ls -la metadata101.json
          echo "json bytes: $(stat -c%s metadata101.json)"

      - name: Fetch MADB (JSON-LD streaming import)
        run: |
          ARGS=(--jsonld-path .cache/madb/metadata101.json --all)
          if [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "0" ]; then
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          # Node の heap を増やしておく (= queued 配列が数十 MB 膨らむため、
          # default 1.5GB だが余裕を見て 4GB)。
          NODE_OPTIONS="--max-old-space-size=4096" npm run fetch:madb -- "${ARGS[@]}"

      - name: Fetch Wikipedia (= magazine_key / title_kana / genres / synopsis 補完)
        # 6,650 series × 1.1 秒/req ≈ 1.5 時間 かかる重い step なので、 fetch:madb
        # 単体の動作確認をしたい時は run_wikipedia=false で skip できるように。
        if: ${{ inputs.run_wikipedia == true }}
        run: npm run fetch:wikipedia

      - name: DB summary report
        run: npm run db:report -- --series --sources

      - name: DB top 30
        run: npm run db:report -- --top 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-madb-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/wikipedia/
          if-no-files-found: warn

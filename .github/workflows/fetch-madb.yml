name: 📥 Fetch MADB (test run)

# 2026-05-08: scripts/fetch-madb.ts の動作確認用 standalone workflow。
# bulk-promote-test workflow への統合は別プラン (= 本プラン Out of scope)。
#
# - 空 DB を作って mangaka CSV import → 指定 QID で MADB fetch を実行
# - DB report で投入された series / editions / volumes を確認
# - artifact: .cache/db.sqlite + .cache/madb/ raw dumps

on:
  workflow_dispatch:
    inputs:
      qids:
        description: "空白区切りの QID 列 (= 既定: 6 作家 probe-madb と同じ subset、 CSV mangaka.qid 真値)"
        required: true
        default: "Q3782468 Q241885 Q348436 Q600217 Q24865213 Q972529"
      include_original_author:
        description: "[原作] credits も拾う (= 諫山創 → キメツ学園スピンオフ等)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      INPUT_QIDS: ${{ inputs.qids }}
      INPUT_INCLUDE_OA: ${{ inputs.include_original_author }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! printf '%s' "$INPUT_QIDS" | grep -Eq '^Q[0-9]+( +Q[0-9]+)*$'; then
            echo "::error::qids は空白区切りの 'Q+数字' のみ"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Fetch MADB for each QID
        run: |
          OA_FLAG=()
          if [ "$INPUT_INCLUDE_OA" = "true" ]; then
            OA_FLAG+=(--include-original-author)
          fi
          for q in $INPUT_QIDS; do
            echo "::group::fetch:madb $q"
            npm run fetch:madb -- --qid "$q" "${OA_FLAG[@]}"
            echo "::endgroup::"
          done

      - name: DB summary report
        run: npm run db:report -- --series --sources

      - name: DB top 30 (= MADB 由来 series が並ぶ想定)
        run: npm run db:report -- --top 30

      - name: Show MADB raw dumps directory
        if: always()
        run: |
          echo "=== .cache/madb/ files ==="
          ls -la .cache/madb/ || true

      - name: Inspect first record per author (= magazine field debug)
        if: always()
        run: |
          for f in .cache/madb/*.json; do
            echo "::group::$(basename $f) — first record"
            jq '.records[0]' "$f" 2>/dev/null || cat "$f" | head -30
            echo "::endgroup::"
          done

      - name: Show unique magazine literals (= master 解決の手掛り)
        if: always()
        run: |
          echo "=== unique magazine literals across all authors ==="
          jq -r '.records[].magazine' .cache/madb/*.json 2>/dev/null \
            | sort -u | head -50 || true
          echo
          echo "=== unique magazineType across all authors ==="
          jq -r '.records[].magazineType' .cache/madb/*.json 2>/dev/null \
            | sort | uniq -c | sort -rn || true

      - name: Probe MangaBookSeries → MangaMagazine link predicate
        if: always()
        # 前 run で確定: MangaBookSeries の outgoing には MangaMagazine
        # への直接 link が無い (= [3] 0 件)。 outgoing 先の entity は
        # Agent (= 作家) のみ。 つまり magazine 情報は MangaBookSeries
        # にはなく、 別 entity 経由で繋がっている。 MangaMagazinePublication
        # (30k 件) を pivot にした探索を追加。
        run: |
          set -euo pipefail
          MADB_SPARQL="https://mediaarts-db.artmuseums.go.jp/sparql"

          run_query() {
            local label="$1"
            local query="$2"
            echo "=== $label ==="
            curl -sS -X POST \
              -H 'Accept: application/sparql-results+json' \
              --data-urlencode "query=$query" \
              "$MADB_SPARQL" \
              | jq -r '.results.bindings[] | [(.[].value)] | join("  ×  ")' \
              || echo "(SPARQL fetch failed)"
            echo
          }

          # [4] MangaMagazinePublication の outgoing predicates
          run_query "[4] MangaMagazinePublication outgoing predicates (top 25)" \
            'PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p (COUNT(*) AS ?n) WHERE {
               ?pub a class:MangaMagazinePublication ; ?p ?o .
             } GROUP BY ?p ORDER BY DESC(?n) LIMIT 25'

          # [5] MangaMagazinePublication が MangaBookSeries と MangaMagazine
          #     を両方指すなら、 真の pivot 確定
          run_query "[5] MangaMagazinePublication pivot predicates (?p1 to BookSeries, ?p2 to Magazine)" \
            'PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p1 ?p2 (COUNT(*) AS ?n) WHERE {
               ?pub a class:MangaMagazinePublication ;
                    ?p1 ?series ;
                    ?p2 ?mag .
               ?series a class:MangaBookSeries .
               ?mag a class:MangaMagazine .
             } GROUP BY ?p1 ?p2 ORDER BY DESC(?n) LIMIT 10'

          # [6] 逆向き: MangaMagazine を指している predicates (= incoming)
          run_query "[6] predicates pointing TO MangaMagazine (top 10)" \
            'PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p (COUNT(*) AS ?n) WHERE {
               ?s ?p ?mag . ?mag a class:MangaMagazine .
             } GROUP BY ?p ORDER BY DESC(?n) LIMIT 10'

          # [7] MangaBook 自身が MangaMagazinePublication / MangaMagazineIssue を
          #     直接指す predicate がないか (= isPartOf 以外)
          run_query "[7] MangaBook outgoing predicates pointing to Magazine-family entity" \
            'PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p ?type (COUNT(*) AS ?n) WHERE {
               ?b a class:MangaBook ; ?p ?o .
               ?o a ?type .
               FILTER(?type IN (class:MangaMagazine, class:MangaMagazineIssue, class:MangaMagazinePublication))
             } GROUP BY ?p ?type ORDER BY DESC(?n) LIMIT 10'

          # [8] MangaMagazinePublication への incoming predicates
          run_query "[8] predicates pointing TO MangaMagazinePublication (top 10)" \
            'PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p (COUNT(*) AS ?n) WHERE {
               ?s ?p ?pub . ?pub a class:MangaMagazinePublication .
             } GROUP BY ?p ORDER BY DESC(?n) LIMIT 10'

          # [9] schema:isPartOf で MangaMagazine を指している側の type 分布
          #     (= 173k の正体が MangaMagazineIssue かどうか確認)
          run_query "[9] source types of (?s schema:isPartOf MangaMagazine)" \
            'PREFIX schema: <https://schema.org/>
             PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?type (COUNT(*) AS ?n) WHERE {
               ?s schema:isPartOf ?mag .
               ?mag a class:MangaMagazine .
               ?s a ?type .
             } GROUP BY ?type ORDER BY DESC(?n) LIMIT 10'

          # [10] (name, creator) bridge feasibility: 進撃の巨人 を例に、
          #      MangaBookSeries と MangaMagazinePublication で同じ
          #      (name, creator) ペアが取れるか確認
          run_query "[10] bridge feasibility — 進撃の巨人 (name, creator) match" \
            'PREFIX schema: <https://schema.org/>
             PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?series ?seriesCreator ?pub ?pubCreator WHERE {
               ?series a class:MangaBookSeries ;
                       schema:name "進撃の巨人" ;
                       schema:creator ?seriesCreator .
               ?pub a class:MangaMagazinePublication ;
                    schema:name "進撃の巨人" ;
                    schema:creator ?pubCreator .
               FILTER(STR(?seriesCreator) = STR(?pubCreator))
             } LIMIT 5'

          # [11] 進撃の巨人 publication → magazine への path 探索
          #      MangaMagazinePublication が雑誌 entity に届く predicate chain
          run_query "[11] 進撃の巨人 MagazinePublication → Magazine path probe" \
            'PREFIX schema: <https://schema.org/>
             PREFIX class: <https://mediaarts-db.artmuseums.go.jp/data/class#>
             SELECT ?p1 ?intermediateType ?p2 (COUNT(*) AS ?n) WHERE {
               ?pub a class:MangaMagazinePublication ;
                    schema:name "進撃の巨人" .
               ?intermediate ?p1 ?pub .
               ?intermediate a ?intermediateType .
               OPTIONAL { ?intermediate ?p2 ?mag . ?mag a class:MangaMagazine }
             } GROUP BY ?p1 ?intermediateType ?p2 ORDER BY DESC(?n) LIMIT 10'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-madb-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/madb/
          if-no-files-found: warn

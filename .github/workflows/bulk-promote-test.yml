name: 🧪 Bulk promote test (multi-mangaka)

# 複数の漫画家 QID を 1 ジョブ内で順次 fetch:ndl → 同じ SQLite に積む →
# promote:bulk で data/manga/_drafts/ に YAML を一括生成する評価用ワークフロー。
#
# - drafts は gitignore されているのでブランチには commit されない（artifact 経由）
# - 何度でも回せる（毎回 db:init で空から作り直す）
# - 既定値を Q219948 Q193300 にしてあるので「Run workflow」だけで試金石が走る

on:
  workflow_dispatch:
    inputs:
      qids:
        description: "空白区切りの QID 列（例: Q219948 Q193300 = 高橋留美子 + 手塚治虫）"
        required: true
        default: "Q219948 Q193300"
      max_pages:
        description: "1 人あたりの NDL ページ数 (1-10、1ページ=最大200件)"
        required: false
        default: "5"
      include_adult:
        description: "has_adult_credit=true の作家も対象にする"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  bulk-test:
    runs-on: ubuntu-latest
    env:
      INPUT_QIDS: ${{ inputs.qids }}
      INPUT_MAX_PAGES: ${{ inputs.max_pages }}
      INPUT_INCLUDE_ADULT: ${{ inputs.include_adult }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! printf '%s' "$INPUT_QIDS" | grep -Eq '^Q[0-9]+( +Q[0-9]+)*$'; then
            echo "::error::qids は空白区切りの 'Q+数字' のみ。例: 'Q219948 Q193300'"
            exit 1
          fi
          if ! printf '%s' "$INPUT_MAX_PAGES" | grep -Eq '^[1-9]$|^10$'; then
            echo "::error::max_pages は 1〜10 の整数: '$INPUT_MAX_PAGES'"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize empty DB
        run: npm run db:init

      - name: Import publisher / magazine masters
        run: npm run db:import:masters

      - name: Import mangaka CSV (full)
        run: npm run db:import:mangaka

      - name: Fetch adult publisher / mangaka lists from JA Wikipedia (Fix C)
        # 成人向け漫画雑誌の一覧 + 日本の成人向け漫画家の一覧 を 2 リクエストで
        # 取得して adult_publishers / adult_mangaka_known を seed する。
        # promote:bulk が adult_score を計算する前提データ。
        run: npm run fetch:adult-lists

      - name: Seed adult imprints from manga-db.com dump
        run: npm run seed:adult-imprints

      - name: Fetch NDL for each mangaka QID
        run: |
          INCLUDE_FLAG=()
          if [ "$INPUT_INCLUDE_ADULT" = "true" ]; then
            INCLUDE_FLAG+=(--include-adult)
          fi
          # $INPUT_QIDS は意図的にクオートしない（空白区切り展開）
          for q in $INPUT_QIDS; do
            echo "::group::fetch $q"
            npm run fetch:ndl -- --qid "$q" --max-pages "$INPUT_MAX_PAGES" "${INCLUDE_FLAG[@]}"
            echo "::endgroup::"
          done

      - name: DB summary report
        run: npm run db:report -- --series --adult --sources

      - name: DB top 30 series with edition breakdown
        run: npm run db:report -- --top 30

      - name: Fetch Wikipedia metadata for each series (kana / magazine / genres / synopsis)
        # 1.1s/req × series 数 ぶん。 599 series でも ~11 分、 6h 枠に余裕。
        # B-1 (2026-05-06): hit-rate 解明のため --limit 200 を撤去、 全 series を
        # 試行して layer A/B/C の統計信頼性を上げる。
        run: npm run fetch:wikipedia

      - name: Probe openBD coverage (read-only diagnostic)
        # B-2 (2026-05-06): Wikipedia 18% ceiling 後の補完候補として openBD を試験。
        # ISBN 1700+ 件を bulk で叩き、 publisher / collationkey / synopsis /
        # C-code / cover の取得率を測定。 DB は変更しない (read-only)。
        run: npm run probe:openbd

      - name: DB top 30 (post-Wikipedia, with metadata filled)
        run: npm run db:report -- --top 30

      - name: Run promote:bulk (drafts to data/manga/_drafts/)
        run: npm run promote:bulk

      - name: DB adult report (post-promote, scores + signals)
        # promote:bulk が adult_score / adult_signals を埋めた後の結果を観察。
        # ここで「どの series がどの signal で skip されたか」が workflow log に残る。
        run: npm run db:report -- --adult

      - name: SQL diagnostics (editions.imprint distribution + adult_imprints state)
        # Tier 2 (adult_imprints) がなぜ発火しないかの診断材料を出す。
        # editions.imprint が真のサブレーベル名 (クリベロン等) を持っているか、
        # それとも publisher 名 (リイド社等) しか持っていないかを確認する。
        run: |
          DB=.cache/db.sqlite
          echo "=== editions.imprint distribution (top 30) ==="
          sqlite3 -separator $'\t' "$DB" "SELECT COUNT(*) AS n, COALESCE(imprint,'(NULL)') FROM editions GROUP BY imprint ORDER BY n DESC LIMIT 30"
          echo
          echo "=== series.magazine_key fill rate ==="
          sqlite3 "$DB" "SELECT COUNT(*) AS total, SUM(magazine_key IS NOT NULL) AS filled, SUM(magazine_key IS NULL) AS empty FROM series" -header
          echo
          echo "=== series.magazine_key distribution (top 30) ==="
          sqlite3 -separator $'\t' "$DB" "SELECT COUNT(*) AS n, magazine_key FROM series WHERE magazine_key IS NOT NULL GROUP BY magazine_key ORDER BY n DESC LIMIT 30"
          echo
          echo "=== adult_imprints sample (top 30 by count) ==="
          sqlite3 -separator $'\t' "$DB" "SELECT count, imprint, COALESCE(publisher,'(NULL)') FROM adult_imprints ORDER BY count DESC LIMIT 30"
          echo
          echo "=== editions.imprint × adult_imprints intersection ==="
          # editions に存在する imprint が adult_imprints にも存在するか
          sqlite3 -separator $'\t' "$DB" "SELECT e.imprint, COUNT(DISTINCT e.series_id) AS series_count FROM editions e JOIN adult_imprints ai ON instr(e.imprint, ai.imprint) > 0 OR instr(ai.imprint, e.imprint) > 0 GROUP BY e.imprint ORDER BY series_count DESC LIMIT 30"

      - name: Count + list drafts produced
        run: |
          COUNT=$(ls -1 data/manga/_drafts/ 2>/dev/null | wc -l)
          echo "drafts written: $COUNT"
          echo
          echo "=== first 50 drafts ==="
          ls -1 data/manga/_drafts/ 2>/dev/null | head -50 || true
          echo
          echo "=== sample: first draft (full content, alphabetical) ==="
          first=$(ls -1 data/manga/_drafts/*.yml 2>/dev/null | head -1)
          if [ -n "$first" ]; then
            echo "--- $first ---"
            cat "$first"
          fi
          echo
          echo "=== samples: up to 5 'high-quality' drafts ==="
          # 「magazine が null でなく、genres が TODO_genre 以外」を高品質と
          # みなしてピックアップ（Wikipedia 連携が機能した代表例）。
          for f in data/manga/_drafts/*.yml; do
            if grep -q '^magazine: null$' "$f"; then continue; fi
            if grep -q '^  - TODO_genre$' "$f"; then continue; fi
            HIGH_QUALITY="$HIGH_QUALITY $f"
          done
          if [ -z "$HIGH_QUALITY" ]; then
            echo "(no high-quality drafts found)"
          else
            count=0
            for f in $HIGH_QUALITY; do
              count=$((count + 1))
              [ $count -gt 5 ] && break
              echo "--- $f ---"
              cat "$f"
              echo
            done
          fi

      - name: Drafts quality stats (placeholder breakdown)
        # 233 件 (試金石 50-mangaka run) の draft が production-ready か placeholder
        # 漬けかを定量化する診断 step。 loadData は TODO_genre / TODO_publisher
        # を弾くので、 placeholder 多い draft は本番に乗らない = 無駄。 Wikipedia
        # 連携の hit/miss が直接効く。
        run: |
          DRAFTS=data/manga/_drafts
          TOTAL=$(ls -1 $DRAFTS/*.yml 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "(no drafts to analyze)"
            exit 0
          fi
          echo "=== placeholder field counts (lower = better) ==="
          echo "total drafts: $TOTAL"
          KANA=$(grep -l '^title_kana: TODO_kana$' $DRAFTS/*.yml 2>/dev/null | wc -l)
          MAG=$(grep -l '^magazine: null$' $DRAFTS/*.yml 2>/dev/null | wc -l)
          GENRE=$(grep -l '^  - TODO_genre$' $DRAFTS/*.yml 2>/dev/null | wc -l)
          PUB=$(grep -l '^publisher: TODO_publisher$' $DRAFTS/*.yml 2>/dev/null | wc -l)
          SYN=$(grep -l '^synopsis: ""$' $DRAFTS/*.yml 2>/dev/null | wc -l)
          printf "  title_kana == TODO_kana       : %4d / %4d (%3d%%)\n" "$KANA"  "$TOTAL" $(( KANA  * 100 / TOTAL ))
          printf "  magazine == null              : %4d / %4d (%3d%%)\n" "$MAG"   "$TOTAL" $(( MAG   * 100 / TOTAL ))
          printf "  genres == [TODO_genre]        : %4d / %4d (%3d%%)\n" "$GENRE" "$TOTAL" $(( GENRE * 100 / TOTAL ))
          printf "  publisher == TODO_publisher   : %4d / %4d (%3d%%)\n" "$PUB"   "$TOTAL" $(( PUB   * 100 / TOTAL ))
          printf "  synopsis == empty             : %4d / %4d (%3d%%)\n" "$SYN"   "$TOTAL" $(( SYN   * 100 / TOTAL ))
          echo
          echo "=== distribution: drafts grouped by # of placeholders (0 = production-ready) ==="
          B0=0; B1=0; B2=0; B3=0; B4=0; B5=0
          for f in $DRAFTS/*.yml; do
            c=0
            grep -q '^title_kana: TODO_kana$'        "$f" && c=$((c+1))
            grep -q '^magazine: null$'               "$f" && c=$((c+1))
            grep -q '^  - TODO_genre$'               "$f" && c=$((c+1))
            grep -q '^publisher: TODO_publisher$'    "$f" && c=$((c+1))
            grep -q '^synopsis: ""$'                 "$f" && c=$((c+1))
            case $c in
              0) B0=$((B0+1));;
              1) B1=$((B1+1));;
              2) B2=$((B2+1));;
              3) B3=$((B3+1));;
              4) B4=$((B4+1));;
              5) B5=$((B5+1));;
            esac
          done
          printf "  0 (ready)        : %4d\n" $B0
          printf "  1 placeholder    : %4d\n" $B1
          printf "  2 placeholders   : %4d\n" $B2
          printf "  3 placeholders   : %4d\n" $B3
          printf "  4 placeholders   : %4d\n" $B4
          printf "  5 (all empty)    : %4d\n" $B5
          echo
          echo "=== top 10 source mangaka by draft count ==="
          grep -h '^# Source mangaka:' $DRAFTS/*.yml | sed -E 's/^# Source mangaka: (.*); Source series.*$/\1/' | sort | uniq -c | sort -rn | head -10
          echo
          echo "=== first 5 production-ready drafts (0 placeholders) ==="
          ready_shown=0
          for f in $DRAFTS/*.yml; do
            c=0
            grep -q '^title_kana: TODO_kana$'        "$f" && c=$((c+1))
            grep -q '^magazine: null$'               "$f" && c=$((c+1))
            grep -q '^  - TODO_genre$'               "$f" && c=$((c+1))
            grep -q '^publisher: TODO_publisher$'    "$f" && c=$((c+1))
            grep -q '^synopsis: ""$'                 "$f" && c=$((c+1))
            if [ $c -eq 0 ]; then
              ready_shown=$((ready_shown+1))
              [ $ready_shown -gt 5 ] && break
              echo "  $(basename $f)"
            fi
          done

      - name: Upload SQLite + drafts as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-test-run-${{ github.run_number }}
          path: |
            .cache/db.sqlite
            .cache/ndl/
            .cache/wikipedia/
            data/manga/_drafts/
          if-no-files-found: warn

name: Deploy Preview to Cloudflare

# テストプレビュー(=トンネルで見せている600件サブセット)を、
# Git連携(Workers Builds)済みの "mangal" とは別の新ワーカー "mangal-preview" に
# GitHub Actions からデプロイする。 別名なので Git連携ワーカーのデプロイ拒否と競合しない。
# 認証は既存 GitHub Secrets(CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)を流用。
#
# 経緯: "mangal" へ直接 wrangler deploy すると Cloudflare API
#   /workers/scripts/mangal/versions が拒否(Git連携ロック)。 アセットUP自体は成功
#   (1,325/1,404 files)= 容量/認証はOK。 よって別名ワーカーに出す。
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/manga-database-affiliate-3x0ms
    paths:
      - ".preview-data/**"
      # ★画集 = build時に data/art-books から hydrate する(下記 Hydrate step)。
      #   data/ 変更でも preview を建て直すため trigger に含める(2026-07-23: これが無く
      #   書影同期commitがリビルドを起こさず「preview に画像出ない」事故)。
      - "data/art-books/**"
      # ★試し読みマップはビルド時joinの入力(lib/tameshiyomi.ts が data/ から読む)。
      #   ここに無いと map を更新しても preview が建て直らない(2026-09-06)。
      - "data/tameshiyomi-map.json"
      - ".github/workflows/deploy-preview.yml"
      - "wrangler.jsonc"
      - "worker.js"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"

# 同一ブランチの古いビルドはキャンセルし、 最新pushを優先(連投でのビルド渋滞を防ぐ)。
concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build subset + Deploy to mangal-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (sanity)
        run: npx tsc --noEmit

      # ★ クライアントは /manga-*-index.json を public/ から runtime fetch する
      #   (lib/useMangaIndex.ts)。 一覧/検索を preview サブセットに揃えるため、
      #   .preview-data の索引を public/ に上書きしてから build (= CI のみ、 commit済 public/ は不変=本番不影響)。
      - name: Stage preview-subset indexes into public/
        run: |
          cp .preview-data/manga-list-index.json public/manga-list-index.json
          cp .preview-data/manga-catch-index.json public/manga-catch-index.json
          cp .preview-data/manga-list-head.json public/manga-list-head.json
          cp .preview-data/manga-alt-index.json public/manga-alt-index.json
          # ★列形式索引(2026-09-23 ブラウザ用・行配列から派生)。行配列と内容ハッシュで照合し、古ければ作り直す
          python3 scripts/_index_files.py ensure .preview-data
          cp .preview-data/manga-list-cols.v1.json public/manga-list-cols.v1.json
          # ★本棚の「番号タイルを押すと書影」= 作品ごとの巻の書影(64分割 public/vc/NN.json・2026-10-04)。
          #   テスト環境の作品データから作る(git には入れない)。 本番は本棚の本番化の時に週次へ配線する。
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/_build-vol-covers.py .preview-data/manga public
          echo "preview index entries:"; node -e "console.log('list', require('./public/manga-list-index.json').d.length)"

      # ★羅針盤(/compass・テスト環境)だけが読む本番の全件索引(2026-09-29 ユーザ裁定「3」)。
      #   テスト環境の索引は抜粋で糸がほぼ張れないため、本番の公開索引を取得 → 列形式を生成 → public/prod-idx/ に置く
      #   (同一オリジン配信 = 本番の索引は CORS ヘッダ無しなので別オリジンからは読めない)。
      #   ほかの頁の索引(public/ 直下)には触らない。 取得に失敗したらこの段だけ飛ばす(ビルド全体は止めない。
      #   頁は「索引が読めませんでした」と出す)。
      - name: Stage production full index for /compass (public/prod-idx/)
        continue-on-error: true
        run: |
          set -eu
          mkdir -p /tmp/prod-idx public/prod-idx
          for f in manga-list-index.json manga-list-head.json manga-catch-index.json; do
            # ★素の curl の名乗りは Cloudflare に 403 で弾かれる
            curl -fsS --retry 3 -A "Mozilla/5.0" -o /tmp/prod-idx/$f https://mangal-db.com/$f
          done
          python3 scripts/_index_files.py ensure /tmp/prod-idx
          cp /tmp/prod-idx/manga-list-cols.v1.json /tmp/prod-idx/manga-list-head.json /tmp/prod-idx/manga-catch-index.json public/prod-idx/
          # ★Cloudflare Pages は1ファイル 25MiB まで(列形式は今約21MB)。 超えたら警告して外す(デプロイ全体は落とさない)
          for f in public/prod-idx/*.json; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 26214400 ]; then
              echo "::warning title=prod-idx over 25MiB::$f is $size bytes (> Cloudflare Pages 25MiB limit). Removed; /compass will show 索引が読めませんでした"
              rm -f "$f"
            fi
          done

      # ★画集 = data/art-books に全件(161)。 .preview-data/art-books は .gitignore で未追跡
      #   (preview サブセットに含めない設計)。 /art-books 一覧を preview で表示するため、
      #   build 前に data/ から hydrate する (= 常に本番データと同期。 CI のみ・commit不要)。
      - name: Hydrate art-books into preview data
        run: |
          mkdir -p .preview-data/art-books
          cp data/art-books/*.yml .preview-data/art-books/
          echo "preview art-books: $(ls .preview-data/art-books/*.yml | wc -l) files"

      - name: Build Next.js (preview subset → out/)
        env:
          MANGAL_DATA_DIR: .preview-data
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify build output
        run: |
          COUNT=$(ls out/manga/*.html 2>/dev/null | wc -l)
          echo "preview manga pages built: $COUNT"
          ls out/index.html

      # ★previewはnoindex(2026-07-15): 本番(mangal-db.com)と同内容の重複ページとして
      #   Googleに拾われ「重複/非正規」判定の一因になるのを防ぐ。robots.txtのDisallowでなく
      #   X-Robots-Tagヘッダ(=クロールは許可しnoindexを見せる)が正道。本番out/には入れない。
      - name: Add noindex header for preview (Cloudflare Pages _headers)
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > out/_headers
          cat out/_headers

      - name: Deploy to Cloudflare Pages (mangal-preview)
        # ★Pages = 多数の静的ファイル向けで Workers の metadata 1MiB 制約が無い。
        #   Workers用 wrangler.jsonc は pages deploy と混線するので一時退避してから実行。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mv wrangler.jsonc wrangler.jsonc.bak 2>/dev/null || true
          # 初回はプロジェクトが無いと pages deploy が "Project not found" (code:8000007)。
          # 先に作成(既存なら無害にスキップ)。
          npx -y wrangler@4.100.0 pages project create mangal-preview \
            --production-branch=main || echo "(project already exists; continue)"
          npx -y wrangler@4.100.0 pages deploy out \
            --project-name=mangal-preview \
            --branch=main \
            --commit-dirty=true

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Amazonリンク試験</title>
<!-- 2026-10-15 実機試験用(一時ファイル)。結果を受け取ったら削除する = 週次で本番に出さない。 -->
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --ink: #1f1d1a; --sub: #6b665e; --line: #e4ded4;
    --accent: #e69500; --on: #1f6feb; --ok: #1a7f37; --ng: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514; --surface: #201f1d; --ink: #f2efe9; --sub: #a39e95; --line: #3a3733;
      --accent: #f0a733; --on: #58a6ff; --ok: #3fb950; --ng: #f85149;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161514; --surface: #201f1d; --ink: #f2efe9; --sub: #a39e95; --line: #3a3733;
    --accent: #f0a733; --on: #58a6ff; --ok: #3fb950; --ng: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 8px; padding-left: 8px; border-left: 4px solid var(--accent); }
  p.note { font-size: 13px; color: var(--sub); margin: 4px 0; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; }
  .head { display: flex; gap: 8px; align-items: baseline; }
  .num { font-weight: 700; color: var(--accent); min-width: 1.6em; }
  .label { font-weight: 700; font-size: 14px; }
  .expect { font-size: 12px; color: var(--sub); margin: 2px 0 8px; }
  a.go { display: block; text-align: center; background: var(--accent); color: #fff; font-weight: 700;
    text-decoration: none; border-radius: 999px; padding: 9px 12px; font-size: 14px; }
  .url { font-size: 11px; color: var(--sub); word-break: break-all; margin-top: 6px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pick button { flex: 1 1 auto; min-width: 64px; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 6px 8px; font-size: 13px; }
  .pick button.on { background: var(--on); border-color: var(--on); color: #fff; }
  .pick .cap { width: 100%; font-size: 11px; color: var(--sub); }
  .out { margin-top: 24px; }
  .out button { width: 100%; border: 0; background: var(--ink); color: var(--bg); font-weight: 700;
    border-radius: 999px; padding: 11px; font-size: 15px; }
  textarea { width: 100%; height: 160px; margin-top: 8px; font-size: 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px; }
  .msg { font-size: 13px; color: var(--ok); margin-top: 6px; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>Amazonリンク試験</h1>
  <p class="note">いつも MANGAL を見ているブラウザで開き、上から1つずつタップしてください。</p>
  <p class="note">開いたら、この画面に戻って「どこで開いたか」を押します。最後に一番下の「結果をコピー」でチャットに貼ってください。</p>
  <div id="list"></div>
  <div class="out">
    <button type="button" id="copy">結果をコピー</button>
    <div class="msg" id="msg"></div>
    <textarea id="txt" readonly></textarea>
  </div>
</main>
<script>
(function () {
  var TAG = "mangal08-22";
  var H = "https://www.amazon.co.jp";
  var e = encodeURIComponent;
  function q(path, k, i) { return H + path + "?k=" + e(k) + "&i=" + i + "&tag=" + TAG; }

  // いまの紙ボタンと同じ仕組み(components/VolumeCoverflow.tsx の openStoreApp)
  function amazonAppIntent(href) {
    return "intent://" + href.replace(/^https:\/\/(www\.)?/, "") +
      "#Intent;scheme=com.amazon.mobile.shopping.web;package=com.amazon.mShop.android.shopping;S.browser_fallback_url=" +
      e(href) + ";end";
  }
  // Chrome を名指しして開く
  function chromeIntent(href) {
    return "intent://" + href.replace(/^https:\/\//, "") +
      "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + e(href) + ";end";
  }

  var MAIKON = "こんにちはマイコン 1";
  var kSearch = q("/s", MAIKON, "digital-text");

  var groups = [
    { title: "A. 7月の結果がいまも同じか(どちらもブラウザのはず)", rows: [
      { id: 1, label: "Kindle版の商品ページ(こんにちはマイコン1巻)", expect: "7月の結果: ブラウザ",
        href: H + "/dp/B0CW1B581M?tag=" + TAG },
      { id: 2, label: "紙の商品ページ(ONE PIECE 1巻)", expect: "7月の結果: ブラウザ",
        href: H + "/dp/4088725719?tag=" + TAG },
    ]},
    { title: "B. Kindleを題名で検索(ブラウザで開いてほしい)", rows: [
      { id: 3, label: "ふつうの検索の形", expect: "7月の結果: アプリ(比較用)", href: kSearch, search: true },
      { id: 4, label: "言語指定つきの検索 /-/ja/s", expect: "未試験", href: q("/-/ja/s", MAIKON, "digital-text"), search: true },
      { id: 5, label: "モバイル用の古い検索 /gp/aw/s", expect: "未試験", href: q("/gp/aw/s", MAIKON, "digital-text"), search: true },
      { id: 6, label: "www を付けない検索", expect: "未試験",
        href: "https://amazon.co.jp/s?k=" + e(MAIKON) + "&i=digital-text&tag=" + TAG, search: true },
      { id: 7, label: "Amazon内の転送を経由 /gp/redirect.html", expect: "未試験",
        href: H + "/gp/redirect.html?ie=UTF8&location=" + e(kSearch) + "&tag=" + TAG, search: true },
      { id: 8, label: "Chromeを名指しして開く", expect: "未試験(Chrome以外のブラウザだと効かない)",
        href: kSearch, intent: chromeIntent(kSearch), search: true },
    ]},
    { title: "C. 紙を題名で検索(アプリで開いてよい)", rows: [
      { id: 9, label: "ふつうの検索の形", expect: "7月の結果: アプリ", href: q("/s", MAIKON, "stripbooks"), search: true },
      { id: 10, label: "いまの紙ボタンと同じ「アプリ指定」で開く", expect: "アプリのはず",
        href: q("/s", MAIKON, "stripbooks"), intent: amazonAppIntent(q("/s", MAIKON, "stripbooks")), search: true },
    ]},
    { title: "D. 検索の当たり方(開く場所は問わない。目当ての巻が上の方に出るか)", rows: [
      { id: 11, label: "Kindle「ONE PIECE 1 尾田栄一郎」", expect: "目当て: ONE PIECE 1巻のKindle版",
        href: q("/s", "ONE PIECE 1 尾田栄一郎", "digital-text"), search: true },
      { id: 12, label: "Kindle「タッチ 1 あだち充」", expect: "目当て: タッチ 1巻のKindle版(ありふれた題名の例)",
        href: q("/s", "タッチ 1 あだち充", "digital-text"), search: true },
      { id: 13, label: "紙「タッチ 1 あだち充」", expect: "目当て: タッチ 1巻の紙の本",
        href: q("/s", "タッチ 1 あだち充", "stripbooks"), search: true },
    ]},
  ];

  var KEY = "mangal-amazon-link-test-v1";
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (_) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} }

  var WHERE = ["ブラウザ", "アプリ", "エラー/犬", "何も起きない"];
  var HIT = ["上の方に出た", "出なかった"];

  var list = document.getElementById("list");
  groups.forEach(function (g) {
    var h = document.createElement("h2"); h.textContent = g.title; list.appendChild(h);
    g.rows.forEach(function (r) {
      var d = document.createElement("div"); d.className = "row";
      d.innerHTML = '<div class="head"><span class="num">' + r.id + '</span><span class="label"></span></div>' +
        '<div class="expect"></div>';
      d.querySelector(".label").textContent = r.label;
      d.querySelector(".expect").textContent = r.expect;
      var a = document.createElement("a");
      a.className = "go"; a.href = r.href; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "開く";
      if (r.intent) {
        a.addEventListener("click", function (ev) {
          if (!/Android/i.test(navigator.userAgent)) return;
          ev.preventDefault();
          window.location.href = r.intent;
        });
      }
      d.appendChild(a);
      var u = document.createElement("div"); u.className = "url"; u.textContent = r.intent || r.href; d.appendChild(u);
      d.appendChild(picker(r.id, "w", "どこで開いた?", WHERE));
      if (r.search) d.appendChild(picker(r.id, "h", "目当ての本は?", HIT));
      list.appendChild(d);
    });
  });

  function picker(id, kind, cap, opts) {
    var box = document.createElement("div"); box.className = "pick";
    var c = document.createElement("div"); c.className = "cap"; c.textContent = cap; box.appendChild(c);
    var k = id + kind;
    opts.forEach(function (o) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = o;
      if (state[k] === o) b.className = "on";
      b.addEventListener("click", function () {
        state[k] = state[k] === o ? undefined : o; save();
        Array.prototype.forEach.call(box.querySelectorAll("button"), function (x) {
          x.className = state[k] === x.textContent ? "on" : "";
        });
        render();
      });
      box.appendChild(b);
    });
    return box;
  }

  var txt = document.getElementById("txt");
  function render() {
    var lines = ["Amazonリンク試験の結果(" + (navigator.userAgent.match(/Android [0-9.]+/) || ["?"])[0] + ")"];
    groups.forEach(function (g) {
      g.rows.forEach(function (r) {
        var w = state[r.id + "w"] || "未", h = state[r.id + "h"];
        lines.push(r.id + ". " + r.label + " → " + w + (r.search ? " / " + (h || "未") : ""));
      });
    });
    txt.value = lines.join("\n");
  }
  render();

  document.getElementById("copy").addEventListener("click", function () {
    var msg = document.getElementById("msg");
    function fallback() { txt.focus(); txt.select(); msg.textContent = "下の文字を長押ししてコピーしてください"; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt.value).then(function () { msg.textContent = "コピーしました"; }, fallback);
      } else { fallback(); }
    } catch (_) { fallback(); }
  });
})();
</script>
</body>
</html>

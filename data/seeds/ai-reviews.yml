          誰かが誰かの救いになり、同時にその救った者もまた誰かに支えられている。完璧な人間など一人も登場しないからこそ、互いの欠落を埋め合わせるパズルのピースのような関係性が、読む者の心を強く打ちます。
          脇を固めるサブキャラクターの一人ひとりに至るまで、彼らがなぜその性格になり、なぜその言葉を選ぶに至ったのかというバックボーンが徹底的に描き込まれています。「悪役」に見える人物にすら、そうならざるを得なかった背景と哀しみがある。全編を通したこの圧倒的な人間肯定の眼差しこそが、本作を時代を超えた名作たらしめている理由です。
          ギャグの軽快さと、胸を締め付けるシリアスの完璧な黄金比
          「そんなに重いテーマなら、読むのが辛くなるのでは？」と危惧されるかもしれません。ですが、ご安心ください。プロの編集者として断言します。本作のページをめくる手は絶対に止まりません。
          高屋先生の卓越したストーリーテリングは、テンポの良い軽快なギャグと、心を揺さぶる緻密なシリアス展開を絶妙なバランスで織り交ぜていきます。
          クスッと笑える日常のコミカルなやり取りがあるからこそ、ふとした瞬間に差し込まれる切ない一言や、キャラクターたちの心の叫びが、読者の胸にダイレクトに突き刺さるのです。
          笑って、和んで、油断した次の瞬間、涙が溢れて止まらなくなる――。そんな極上の感情のジェットコースターが、全巻を通してあなたを待ち受けています。
          この本を開こうとしている「あなた」へ
          もし今、あなたがこんな気持ちを抱えているなら、迷わず『フルーツバスケット』を開いてみてください。
          自分自身の嫌なところばかりが目についてしまうとき
          他人との距離感に悩み、孤独を感じているとき
          誰かの言葉に傷つき、心が折れそうになっているとき
          ただ純粋に、「本当に面白い、心に残る物語」に没頭したいとき
          読み終えたとき、あなたの世界は少しだけ優しく見えているはずです。自分の弱さを受け入れる強さ、誰かを信じる勇気、そして何より「自分自身を赦すこと」の大切さを、この作品は静かに、けれど強く教えてくれます。
          一生に一度出会えるかどうかというレベルの感動と、温かな救いがここにあります。さあ、物語の扉を開いて、彼ら・彼女らとともに涙し、笑い、歩みを進めてみませんか。
  - setsu: 11
    slug: black-jack
    title: ブラック・ジャック

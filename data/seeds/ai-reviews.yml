          一、芥見下々という「異物」
          この作家の筆致を初めて目にしたとき、私は編集者としての長年の勘が警鐘を鳴らすのを感じた。何かがおかしい。いや、「おかしい」は語弊がある。「正しくない」のだ。しかしその「正しさの欠如」が、恐ろしいほどの魅力として機能している。
          芥見下々のコマ割りは、しばしば「読みにくい」と評される。確かにそうだろう。視線の誘導が教科書的ではない。吹き出しの配置が意図的に不穏である。しかし、その「読みにくさ」こそが、この作品の世界観そのものなのだ。呪いとは、理不尽とは、本来「読みやすい」ものではない。あなたの日常に突然割り込んでくる恐怖は、起承転結の美しい構造など持たない。芥見下々は、漫画というメディアの「文法」を意図的に歪めることで、読者の身体に直接、不条理の感触を刻み込んでくる。
          そして、その画力。初期の粗削りな線が、巻を追うごとに研ぎ澄まされていく過程を目撃すること自体が、この作品を読む喜びの一つである。特に中盤以降の戦闘描写における「間」の取り方、一コマに込められた情報量の異常な密度、そして何より「描かない」ことの恐怖。見開きいっぱいに描かれた破壊の痕跡の中央に、ぽつんと置かれた小さな沈黙。あの沈黙が、どんな叫びよりも雄弁に物語を語る瞬間がある。
          二、「呪い」というメタファーの射程
          この作品の根幹にある設定を、最小限の言葉で述べよう。人間の負の感情――恐怖、憎悪、後悔、羞恥――が澱のように溜まり、やがて「呪い」という実体を持つ存在として顕現する。それを祓うのが「呪術師」である。
          ここまでは、ある種の「お約束」に見えるかもしれない。だが芥見下々の真価は、この設定を単なるバトルの舞台装置として消費しない点にある。
          考えてみてほしい。「呪い」の源泉は、他ならぬ人間自身なのだ。この世界で怪物を生み出しているのは、外部の侵略者でも、異次元の存在でもない。我々自身の、どうしようもなく醜い、しかし決して否定できない感情の滓である。つまり、呪術師が戦っている相手とは、究極的には「人間であることの代償」そのものなのだ。
          この構造が、物語全体に独特の倫理的重量を与えている。敵を倒すことが「正義」なのか。呪いを祓うことが「善」なのか。そもそも、呪いを生み出しているのが人間である以上、呪術師という存在は、人間という種の自己矛盾を体現しているのではないか。こうした問いが、派手な戦闘シーンの裏側で、静かに、しかし執拗に読者の胸を叩き続ける。
          三、キャラクターという名の「哲学」
          ネタバレを避けつつ、この作品の人物造形について語るのは至難の業である。なぜなら、この作品においてキャラクターの「存在理由」そのものが物語の核心に直結しているからだ。
          しかし、あえて言おう。この作品の登場人物たちは、誰も「正しい」ことを言わない。いや、より正確に言うなら、誰もが「自分にとっての正しさ」を語っている。そしてその正しさ同士が衝突したとき、どちらにも正義があり、どちらにも業がある。読者は、ページをめくるたびに「自分がどちらに感情移入しているか」を自問させられる。その自問が、心地よい。心地よく、そして痛い。
          主人公の少年について、一つだけ。彼は「正しくあろう」とする。しかし、この作品における「正しさ」は、彼を何度も、何度も、容赦なく裏切る。それでも彼は立ち上がる。その「それでも」の重みが、巻を重ねるごとに増していく。初期の彼の「正しさ」と、後の彼の「正しさ」は、同じ言葉でありながら、まるで別の物質になっている。その変質の過程を目撃すること。それこそが、この作品を読むということの本質だと、私は確信している。
          そして、師匠格の人物。この人物の「軽さ」について語らずにはいられない。圧倒的な力を持ちながら、どこまでもふざけている。しかし、そのふざけの奥に覗く「何か」を見たとき、読者は背筋が凍る。この人物が「本気」になる瞬間の描写は、この作品屈指の読書体験である。詳しくは言えない。ただ、その瞬間が来たとき、あなたは息を止めていることに気づくだろう。
          四、「死」の描き方について
          この作品は、人が死ぬ。
          この一文の重みを、私は編集者として、いや一人の読者として、何度でも強調したい。近年の少年漫画において、「死」はしばしば安価である。蘇生が前提となり、犠牲が感動の消費材となり、読者の涙が計算された工程の一部となる。
          芥見下々は、それを許さない。
          この作品における死は、取り返しがつかない。本当に、本当に、取り返しがつかない。ページをめくった先に待っている喪失は、次の巻で覆されることはない。作者は読者に「慣れ」を与えない。十巻読んで「この作品では人が死ぬものだ」と頭では理解していても、実際にその瞬間が来ると、やはり胸の奥が抉られる。なぜか。それは、芥見下々が「死の直前」ではなく「死の直後」を描く作家だからだ。いなくなった人間の不在。残された側の、どう処理していいかわからない感情の行き場。その「空白」の描写が、どんな劇的な死に様よりも残酷で、そして美しい。
          五、世界構築の「不親切さ」がもたらす快感
          この作品の術式設定は、正直に言って、複雑である。初見で完全に理解できる読者は稀だろう。領域展開、反転術式、縛り、天与呪縛――用語が洪水のように押し寄せ、戦闘の最中に長大な「説明」が挿入されることもある。
          しかし、私はこの「不親切さ」を、欠点ではなく美点として提示したい。
          なぜなら、この世界の住人たちは、我々読者に「わかりやすく説明する義務」を負っていないからだ。彼らは彼らの論理で生き、彼らの言語で戦っている。読者は、その世界に「放り込まれる」。わからないまま、しかし確かにそこに「ある」という感触だけを頼りに、ページをめくり続ける。その体験は、まるで異国の街に地図なしで降り立ったときの、あの心細さと高揚感に似ている。
          そして、巻を重ねるうちに、点と点が繋がる瞬間が来る。「あのときの、あの一言が、こういう意味だったのか」という発見。芥見下々は、伏線を「張る」のではなく「埋める」作家である。土の中に種を埋めて、忘れた頃に芽を出す。その芽を見つけたときの快感は、この作品を「一度読んで終わり」にすることを許さない。再読のたびに、新しい意味が立ち上がってくる。
          六、「少年漫画」の文法との対話、そして裏切り
          この作品は、少年漫画の王道的構造を熟知した上で、それを裏切る。
          友情は、万能ではない。努力は、必ずしも報われない。勝利は、代償なしには訪れない。そして何より、「主人公だから助かる」という、我々が無意識に依存している物語の契約が、この作品では機能しない。
          しかし、誤解しないでほしい。これは「暗い漫画」ではない。むしろ、逆である。希望が「約束」されていない世界で、それでも誰かのために拳を振るうことの、なんと眩しいことか。光が「当たり前」ではないからこそ、一筋の光が、読者の網膜に焼きつく。芥見下々は、少年漫画の本質――「それでも前を向く」という精神――を、安易な楽観主義から剥ぎ取り、血と泥にまみれた「選択」として再提示する。それは、より残酷で、しかしより誠実な、希望の形である。
          七、読むという行為そのものについて
          最後に、編集者として、一人の「最初の読者」として、この作品を読む体験そのものについて語りたい。
          この作品は、あなたを「安全な観客席」に座らせてくれない。ページをめくる指が、次第に重くなる。次のコマを見たくない。しかし、見なければならない。登場人物たちが向かう先を、あなたは知っている。しかし、彼らは知らない。その非対称性が、読むという行為に、ほとんど物理的な痛みを伴わせる。
          そして、読み終えたとき。最終ページを閉じたとき。あなたは、しばらく動けないだろう。本を膝の上に置いたまま、天井を見上げるだろう。そして、思うだろう。「この物語を読んでよかった」と。同時に、「この物語を読む前の自分には、もう戻れない」と。
          結：あなたへの招待
          私は、この作品を「おすすめ」しない。「おすすめ」という言葉が持つ軽やかさが、この作品には似合わないからだ。
          代わりに、こう言おう。
          覚悟を決めて、第一巻を開いてほしい。
          あなたの「漫画を読む」という行為の定義が、書き換わる。あなたの「少年漫画」に対する信頼が、一度壊され、より強靭な形で再構築される。そして何より、あなたの中に眠っている「正しさ」とは何かという問いが、目を覚ます。
          芥見下々は、あなたを甘やかさない。しかし、決して裏切らない。
          その約束を、私は編集者として、ここに記す。
          芥見下々『呪術廻戦』。全巻、あなたの本棚に、いや、あなたの血肉の中に、居場所を求めている。

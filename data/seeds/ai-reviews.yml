          本作の核心を担うのは、平凡な高校生である主人公・泉新一と、彼の右手に偶発的に寄生することになった謎の生物「ミギー」との間に結ばれる、歪で、しかし他に類を見ない奇妙な共生関係です。新一は感情豊かで、他者の痛みに涙を流せる「ごく普通の人間」です。対するミギーは、徹底した合理主義者であり、自身の生存のみを最優先事項とする「完全なる他者」です。この二つの精神が、一つの肉体を共有するという極限状態。ここから生まれるドラマの密度は、他のあらゆるバディもの、相棒ものの追随を許しません。
          「新一、『心に余裕（ヒマ）』がある生物、なんと素晴らしいことか」。これは劇中で語られる象徴的な視点ですが、ミギーという「人間の倫理観を持たないフィルター」を通して見ることで、私たちが当たり前だと思っている「優しさ」「愛」「道徳」といった概念が、いかに脆く、同時にいかに尊いものであるかが浮き彫りになっていきます。交わるはずのなかった二つのロジックが、激動の運命の中で激突し、互いに影響を与え合っていく過程。新一はミギーの冷徹さに侵食されていくのか、それともミギーが人間の割り切れなさを理解していくのか。そのグラデーションのように変化していく二人の距離感は、サスペンスとしての緊張感を常に最高潮に保ち続けます。読者は、彼らの対話の一言一句に、まるで哲学の議論を見守るかのような深い没入感を覚えるはずです。

        text: |-
          「医療漫画」という言葉だけでは、この作品の本質は決して語り尽くせない。
          『ブラック・ジャック』は、天才外科医が難病を治す物語ではない。命とは何か、人は何のために生きるのか、正義とは誰のために存在するのか――そんな答えの出ない問いを、たった一話ごとに読者へ突きつけ続ける、手塚治虫の到達点ともいえる傑作である。1973年の連載開始以来、半世紀以上にわたって読み継がれ、医療漫画という枠を超えた「人間ドラマの金字塔」として世界中で愛され続けている。
          主人公ブラック・ジャックは、法では無免許医。しかし、その腕前は誰もが認める世界最高峰。法と倫理、金と命、善と悪。そのすべてを曖昧な境界線の上で歩く彼は、決して「正義のヒーロー」ではない。高額な報酬を要求し、冷酷にも見えるその姿に戸惑うこともあるだろう。しかし、一話読み終えたあと、不思議と胸に残るのは彼の技術ではなく、その奥底に隠された揺るぎない信念である。
          この作品の真の主人公は、人間そのものだ。
          患者、家族、医師、研究者、権力者、犯罪者、子ども、老人――毎回異なる人生が描かれ、それぞれが抱える事情や苦悩が鮮やかに浮かび上がる。そこには単純な善悪は存在しない。誰もが間違い、誰もが迷い、それでも生きようともがく。その姿を、手塚治虫は驚くほど冷静に、そして驚くほど温かく見つめている。
          一話完結でありながら、一本の短編映画を観終えたような満足感があるのも本作ならではだ。わずか数十ページの中で笑い、驚き、緊張し、考えさせられ、最後には静かな余韻だけが心に残る。その構成力は、現代の漫画家たちからもたびたび絶賛されるほどで、限られたページ数の中に濃密なドラマを成立させる技術は、今なお色褪せない。
          もちろん医療描写も見どころの一つだ。しかし、専門知識を楽しむ作品ではない。病気や手術はあくまで「人間を描くための舞台装置」であり、その先にある感情こそが、この作品の核となっている。だからこそ、医療に興味がなくても夢中になれる。むしろ読めば読むほど、人の弱さや強さ、生きることの意味について考えずにはいられなくなる。
          そして何より驚かされるのは、その普遍性だ。何十年も前に描かれたにもかかわらず、生命倫理、医療格差、科学の進歩、経済と命の価値など、現代社会にも通じるテーマが数多く盛り込まれている。時代が変わっても色褪せないどころか、新しい時代だからこそ響くエピソードが次々と現れる。その先見性は、「漫画の神様」と呼ばれる手塚治虫だからこそ到達できた境地なのだろう。
          読後に残るのは爽快感だけではない。切なさ、希望、やるせなさ、温もり、そして「人間とは何か」を考え続けたくなる静かな感動である。ページを閉じたあと、ふと誰かの顔を思い浮かべたり、自分自身の生き方を見つめ直したりする。そんな漫画は決して多くない。
          もし「名作漫画を一つだけ読むなら何を薦めるか」と問われたなら、多くの人がこの作品を挙げる理由が、きっと読み終えた瞬間にわかるはずだ。
          『ブラック・ジャック』は、医療漫画の原点ではない。

          主人公ブラック・ジャックは、無免許の天才外科医だ。顔に走る縫い傷と、白と黒に染め分けられた髪。その異形とも言える風貌は、彼が背負ってきた壮絶な過去を物語ると同時に、社会の枠からはみ出した存在であることを雄弁に示している。彼は法の外にいる。医師免許を持たず、巨大な闇医者として、莫大な治療費を要求する。その額は時に数千万、数億にまで跳ね上がり、患者やその家族を絶望の淵に叩き落とすことすらある。一見すると、彼は冷酷非情な守銭奴にしか見えない。金のない人間には目もくれず、金さえ払えばどんな悪党でも救うのか。そう思った瞬間、私たちの常識や倫理観は激しく揺さぶられる。しかし、ページを繰る手が止まらないのは、その奥にちらりと覗く、計り知れない人間性の深淵のせいだ。
          手塚治虫という、漫画の神様が描いた医学漫画の金字塔。だが、この作品は決して医療の知識をひけらかすだけの医療マンガではない。メスが皮膚を切り裂き、血管が縫合され、奇跡的に生命が蘇る。その超絶技巧の数々は、読む者を息詰まるような緊迫感で包み込む。しかし本当にスリリングなのは、手術室の外で行われる、魂の葛藤である。金で命は買えるのか。正義とは何か。人間の尊厳はどこに宿るのか。『ブラック・ジャック』の一話一話は、そうした根源的な問いを、極限状態に置かれた人間たちを通して浮かび上がらせる。患者は病に苦しみ、家族は金に苦しみ、そして医者は自らの信念に苦しむ。ブラック・ジャックの放つ「いくら払える？」という冷たい一言は、単なる金銭の要求ではなく、生きることの重み、そしてその対価を、お前に本当に支払う覚悟があるのかと、私たち読者自身に突きつけているのだ。

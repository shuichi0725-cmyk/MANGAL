          本作の登場人物たちはみな、競技かるたという一見マイナーな世界に魅せられ、青春のすべてを注ぎ込みます。周りからどう見られようと関係ない。ただ目の前の枚の札に、自分のすべてを賭ける。その一途な狂気すら感じさせる熱狂は、大人の階段を上るにつれて私たちがいつの間にか手放してしまった「純粋な情熱」を強烈に思い出させてくれます。
          読み進めるうちに、あなたの心の中にある冷めていた情熱の火種が、パチパチと音を立てて燃え上がり始めるのを感じるはずです。
          今、このページを開くべき理由
          物語が紡ぐのは、一瞬の眩しさであり、二度と戻らない青春の輝きです。
          ページをめくるごとに走る痺れるような快感、あふれ出る涙、そして読み終えたあとに胸に残る、爽やかでどこか切ない余韻。読書という体験が与えてくれる最高の感動が、ここに詰まっています。
          ・最近、胸が熱くなるような体験をしていない方
          ・何かに夢中になることの尊さを思い出したい方
          ・人間の真摯な美しさに触れて、思い切り涙したい方
          コミックの表紙を開いてみてください。
          そこには、あなたの想像を遥かに超える、熱く、切なく、美しい世界が広がっています。畳の上の静寂が、今度はあなたの魂を揺さぶる番です。

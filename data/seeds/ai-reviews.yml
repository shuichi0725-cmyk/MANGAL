          そして『銀魂』の大きな魅力は、笑い続けていた読者の心に、突然静かな余韻を残してくるところです。くだらないやり取りの積み重ねが、いつの間にか人物への愛着になり、何気ない一言が後からじわじわと響いてくる。読者は気づかないうちに、この作品の世界と、そこに生きる人々を大切に思うようになります。

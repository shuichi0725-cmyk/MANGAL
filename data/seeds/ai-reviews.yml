        text: |-
          命の値段を、あなたは決めることができるか。
          一冊の漫画を前にして、これほどまでに「読む」という行為が「問いかけられる」体験があるだろうか。
          ページをめくる。そこに立っているのは、白と黒のまだら模様の髪を持つ、一人の男。顔には縫い跡が走り、黒いマントを翻し、メスを握るその手は神の域に達している。名を、ブラック・ジャック。医師免許を持たない。所属する病院もない。学会から追放され、医療界の正規のルートからは完全に外れた存在。それでも、世界中のどんな名医も匙を投げた患者が、最後の望みを託して彼の元を訪れる。そして彼は、法外な報酬を要求する。三千万。五千万。時には一億。提示された金額を前に、患者の家族は絶句し、怒り、泣き、そしてそれでも頭を下げる。命とは、そういうものだから。

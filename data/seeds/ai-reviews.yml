          刃を交え、命を奪い合う極限の状況下にあっても、本作は決して彼らを「記号的な悪」として切り捨てることをしません。討ち果たされるその瞬間にフラッシュバックする彼らの過去は、読者に言い知れぬ余韻を残します。正義と悪という単純な二元論では片付けられない、泥臭くも切ない感情の交錯。刃が断ち切るのは、単なる憎悪の連鎖ではなく、彼らを縛り付けていた深く暗い「哀しみ」そのものなのです。

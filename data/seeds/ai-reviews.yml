          もしあなたが今、日々の生活の中で理不尽さに打ちのめされそうになっていたり、自分の弱さに嫌気がさしていたりするのなら。あるいは、誰かを想う気持ちの尊さをもう一度信じてみたいと願っているのなら。ぜひ、『鬼滅の刃』の第一巻を手に取ってみてください。そこには、あなたと同じように迷い、傷つきながらも、それでも歯を食いしばって前を向こうとする名もなき者たちの姿があります。彼らの不屈の精神と、優しさに満ちた眼差しは、きっとあなたの心に深く、静かに、そして力強く寄り添ってくれるはずです。

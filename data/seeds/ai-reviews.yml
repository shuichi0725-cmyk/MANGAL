          末次由紀が描く『ちはやふる』の舞台は、風流な和の世界などではありません。そこは、コンマ数秒の遅れが敗北を意味し、指先から血が滲み、汗と涙が畳にしみ込む、泥臭くも圧倒的に美しい「格闘技」のリングです。
          一瞬の静寂から爆発する、極限の「動」と「静」
          物語の核にあるのは、「競技かるた」という世界です。
          読手の声が響く直前、会場を包むのは呼吸すら憚られるほどの完璧な静寂。選手たちは膝を突き合わせ、一点を見つめ、全身の神経を耳と指先に研ぎ澄ませます。そして、最初の音が発せられた瞬間——。

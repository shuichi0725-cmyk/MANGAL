          物語は、高校生になった千早が、もう一度あの畳の上に立つために── 「クイーン（女性日本一）」になるという夢を胸に、瑞沢高校かるた部を立ち上げるところから本格的に動き出します。彼女の前に立ちはだかるのは、天才的な才能を持つ者、努力で限界を突破する者、そして何より、かるたに人生を懸ける熱いライバルたち。個性豊かな部員たち──和歌を愛する大江奏、勝負強さが光る西田、理詰めの駒野──と共に、チームで、そして個人で、全国の頂点を目指して戦い続けます。
          競技かるた。一見、静かな和の遊びに見えて、その実態は瞬発力、体力、そして読み手の息遣いまでも読み解く究極の頭脳戦です。札が飛び交い、指先が畳を擦る音、息を呑む静寂、そして札を取った瞬間の高揚感──末次由紀氏の描くその一瞬一瞬は、読む者の心臓を掴んで離しません。かるたを通じて、友情、努力、恋心、そして自分の限界との向き合い方までが、繊細かつ力強く描かれていきます。

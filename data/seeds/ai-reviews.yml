    reviews:
      - vendor: Anthropic
        model: Claude Opus 5 (1M)
        text: |-
          手塚治虫『ブラック・ジャック』
          「無免許の天才外科医」。たった一行の設定である。にもかかわらず、この一行から半世紀分の物語が生まれ、いまも古びていない。まずその事実に、驚いてほしい。
          黒いマント。継ぎ接ぎのように縫い目の走る顔。法外な報酬を平然と要求する、口数の少ない男。彼の輪郭は、読む前からすでにどこかで見たことがあるはずだ。作品を読んでいない人ですら知っている——それはもう、キャラクターというより神話に近い。だが本当に凄いのは、その神話の中身が、読み始めた瞬間に想像を裏切ってくる点にある。
          この作品は、一話完結の連作だ。ほとんどの回が二十ページ前後で始まり、終わる。だから、どの巻のどのページから開いてもいい。通勤の途中でも、眠る前の十分でも構わない。ところがその二十ページには、短編小説一本分の密度が平然と詰め込まれている。読み終えて本を閉じ、天井を見上げてしばらく動けなくなる。そういう種類の二十ページが、何十本も並んでいる。分量に対して、心が受け取るものの量が明らかに釣り合っていない。
          背景には、作者自身が医学の学位を持つ人間だったという事実がある。だからメスの入り方には、素人が真似で描いた線にはない手触りがある。同時に、この作品は決して「正確な医療漫画」ではない。ありえない手術が、堂々と、確信を持って描かれる。リアリズムと荒唐無稽が同じ画面の中で握手している——その奇妙な同居こそが、この作品にしかない体温を生んでいる。
          そして、読み進めるほどに気づく。ここで本当に問われているのは、医学の話ではないということに。
          彼が請求する法外な金額は、単なるキャラクター付けではない。命に値段をつけるという行為を通して、作品は読者に問い返してくる。その一つの命は、いくらの価値があるのか。誰が、それを決めていいのか。治すことは、いつでも正しいのか。答えは提示されない。主人公は説教をしないし、作者も裁定を下さない。ただ、こちらの手に問いだけが残される。
          主人公は、気持ちのいい英雄ではない。冷たく、金に汚く、社会の外側にいる。愛想がなく、しばしば読者の期待を裏切る選択をする。それでも読者は、彼から目を離せなくなる。なぜなら、その無愛想な沈黙の奥にあるものが、ときどき、ほんの一瞬だけ露出してしまうからだ。その一瞬のために、多くの読者が何十年も彼のもとへ帰ってくる。
          もちろん、重いだけの作品ではない。時にとぼけ、時に笑わせ、時に思い切り泣かせにくる。緩急の付け方は、いま読んでも異様に上手い。連載当時、すでにベテランだった作者が「これが最後になるかもしれない」という位置から描き始めた作品であることを思うと、その振り切り方にも納得がいく。結果として、これは作者の代表作の一つとして残った。
          そして——ここが最も重要なのだが——この作品は年々新しくなっている。延命とは何か。医療はどこまで人に踏み込んでいいのか。技術が可能にしたことを、人間はすべてやっていいのか。一九七〇年代に描かれた問いが、いまの私たちの目の前にそのまま置かれている。これほど「先回りしてしまった作品」は、そう多くない。
          長い作品だが、覚悟は要らない。必要なのは、たった一話ぶんの二十ページだけだ。読み終えたとき、自分がもう一話読んでしまっていることに、たぶん気づく。そこから先は、もう説明の必要はない。
      - vendor: OpenAI

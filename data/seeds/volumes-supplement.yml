#   isbn13: string     ← 確定 ISBN (= 別 source から)
#   release_date: string  ← YYYY-MM-DD or YYYY-MM
#   pages: int (optional)
#   publisher: string  ← 出版社
#   edition_type: standard/bunkobon/wideban/kanzenban/shinsoban/aizoban
#   title_display: string  ← 公式 商品名 (= Amazon 表記等)
#   source: string     ← 確認 source (= amazon / ndl / publisher-official 等)
#   added_at: YYYY-MM-DD
#   note: |            ← 補完根拠 / 確認内容

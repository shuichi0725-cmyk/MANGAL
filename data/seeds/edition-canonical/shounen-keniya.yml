source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブに2005年MANGA Shop Series・1962-63年の単行本・1976年サンケイ・ジュニア ブックスが混線し、1巻2005-11-03→2巻1962-02-20の43年逆行になっていた。文庫タブも1953-55年サンケイ児童文庫と角川文庫が混在。★主版は**巻が連番で揃い日付も全部ある最古**のサンケイ・ジュニア ブックス(全10巻 1976)とし、他はextra_editionsへ。文庫は suppress_types でサンケイ児童文庫(全13巻 1953-1955。MADBの重複行は巻ごとに最も精度の高い日付へ寄せた)と角川文庫に分けた。★NDL SRU(creator=山川惣治)は2回ともタイムアウトして取得できなかったため、**版元を断定できる材料が無いrunは publisher を不明**にしてある(レーベル名はMADBの記録どおり)。富士見コミックス・アニメ版(1984)はアニメ版のため掲載対象外。★角川文庫の11・12・17巻(9784041547113/120/175)は現行の種2に無く既存の本番頁にだけ載っていた分。ISBNが 404154711/712/717 と巻番号に連番なので巻番号を確定して復帰させた(反映の「消えたISBN」警告で気づいた)。'

source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 同レーベル分裂の統合: 「フラワーコミックス」が1巻と2巻で別タブに割れていた(ISBN 9784091337931=楽天「ないしょのハムスター」/9784091337924=「ないしょのハムスター（2）」、いずれも seriesName=フラワーコミックス・小学館・真木ひいな)。主版(フラワーコミックス ちゃお)は同じ1巻をISBN無しで持っていたので、ISBNを主版の1巻に結び2巻を並べて1タブに統合した。1巻の発売日は種2の初版値1991-08-20を維持(楽天の2001-05は重版の登録値)。'

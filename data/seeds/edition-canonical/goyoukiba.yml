source: 'ギャラ型B是正 2026-08-17: 初出単行本(少年画報社 1971-11〜1977-04 全18巻)の1巻枠を2011年の小池書院「King series 漫画スーパーワイド」1冊目が占有し、40年逆行していた(頁の出版社も小池書院表示)。さらに復刻2種(King series 漫画スーパーワイド 全14巻・Comic魂別冊 全11巻)はMADB側で巻番号が全部v0/v1に潰れており、それぞれ1冊しか頁に出ていなかった。NDL SRU(creator=神田たけ志)で確定= 初出は**少年画報社** 1971.11- / King series 漫画スーパーワイド 小池書院 2011.6-2012.1(章題つき) / 主婦の友ヒットシリーズ Comic魂別冊 はちどり 2018.4-2019.12(章題つき) / 秋田漫画文庫 小池一夫選集 1976。初出run全18巻を主版に戻し、復刻2種は発売日順(ISBN連番と一致)に採番してextra_editionsへ。★初出のレーベル名はNDLに記載が無いため canonical_label/canonical_imprint を省略し、MADB側のimprint(コミック)をそのまま活かしている。'

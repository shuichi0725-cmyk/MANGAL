source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 同レーベル分裂の統合: SPコミックスの2巻だけが別タブ「SPコミックス(2003)」に割れていた。ISBN 9784845806652(1)/9784845806669(2)/9784845806676(3) が連番で同一runと確定。発売日は seed の2003-04(重版登録値)でなく楽天books の 1992年01月24日 を採用し、1991-12→1992-01→1992-05 と単調になった。'

source: 'ギャラ型B是正 2026-08-17: 通常版タブに2008年キングシリーズ・2012-13年小池書院愛蔵版・1981-82年劇画キングシリーズが混線し、1巻2008年/2-8巻2012-13年/9-12巻1982年という31年逆行(頁の出版社も小池書院表示)。文庫タブも「講談社漫画文庫」という名札で中身は1995年の道草文庫10冊だった。MADBは同じ劇画キングシリーズを2 sidに割り、1981-82年版(v1-7,9,11,12 + 別sidのv8,v10)と1989年版(v1-7)を1 editionに混ぜていた。NDL SRU(creator=小島剛夕)で確定= 初出は**講談社 1972-1976**(刀哭の章/秋水の章/残心の章/刹鬼の章/石火の章/赤手の章/止心の章 …章題のみで巻番号なし) / 小池書院「愛蔵版」全8巻 2012.9-2013.4 / My first big special 小学館 2024-25(コンビニ本=掲載対象外)。★主版は**番号が揃う完備最古**の劇画キングシリーズ1981-82年版 全12巻とした。この版の出版者は NDL にも MADB にも無く(1973-75年の同名レーベルはNDL上オリオン出版/スタジオ・シップだが1981年版が同じとは確認できない)ため publisher は「不明」と明示している。★講談社の初出単行本(1972-76)は章題しか無く年内の刊行順が両ソースから決まらないので巻番号を作らず、本seedには起こしていない(元から頁に出ていない=表示の後退はない)。'

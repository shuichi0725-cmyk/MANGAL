source: '★2026-08-17追記: 種4(volumes-supplement)がNDL/楽天で確定していた Jump comics deluxe の2巻(9784088594774)をseedに取り込んだ。canonicalはstandard版を丸ごと差し替えるので、入れないと頁から消える。 ギャラ型是正 2026-08-17: 通常版タブに2009年の小池書院King series(大石賢一版 上下)が1巻・3巻枠として入り、1958年からの17巻run(MADBがレーベル名なしで持つ分)と51年逆行していた。まず日付逆行を解くため、17巻runを主版に据え、他のrunをextra_editionsへ分けた。★この頁は本来**同じ原作(野村胡堂)の別々のコミカライズが同居している真のA型**(石森章太郎プロ版 Jump comics deluxe 2004 / 大石賢一版 King series 2009 / さとう勝己『銭形平次事件帳』Kibo comics 2018)。頁分離は別作業として残す。今回は版タブへの切り分けと日付逆行の解消のみ。★17巻runの版元と各巻の発売日は両ソースに無い(13巻の1958-12だけMADBにある)ため publisher は不明のままにした。 / ★2026-08-29 同名/同ISBNタブの是正: 種2由来の deluxe タブ「デラックス版」が canonical の「Jump comics deluxe(石森章太郎プロ版)」と**まったく同じ3ISBN**を持ち二重表示になっていたため suppress_types に deluxe を追加。'

source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 同レーベル分裂の統合: 小学館文庫が1巻と2巻で別タブに割れていた。2巻(ISBN 9784091902979)の発売日が種2で1973-03になっていたが NDL by-ISBN は「九頭竜. 2」**1983.3** と記録しており(ISBNは1973年には存在しない)、1巻の1983-01と同じ刊行runと確定。日付を1983-03に是正して1タブへ統合した。 / ★2026-08-29 偽の巻抜けを是正: Leed cafe comics版は2冊本(上・下)なのに 1巻と**3巻**として持っており2巻が欠番に見えていた。楽天books キャッシュで 9784845849758=「買厄懸場帖九頭竜（上）」/9784845849765=「同（下）」(いずれもリイド社 SPコミックス ポケットワイド 2020-06-11)と確認 → 1(上)/2(下)へ。'

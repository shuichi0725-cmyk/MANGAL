source: 'ギャラ型B是正 2026-08-17: 1988年の豪華版2冊が通常版の1-2巻枠を占有し、23巻と26巻には2019年/2010年の日付が入って1975-1981年の本編run内で40年逆行していた。NDL SRU(creator=山上たつひこ)で少年チャンピオン・コミックスのISBNが巻番号と厳密に連番であることを確認(v5=9784253032681 → v25=9784253032889 が +7 刻みで一致)。★これにより 9784253032865(v23)/9784253032896(v26) は「爆笑コミックス版」という別版ではなく**本編run自身のISBN**で、MADBの2019-04-06/2010-07-06 はその重版日と判明したため本編に戻した(デスハンターv1と同型)。v23の初版日はNDLの「第23巻 1977.10」がv22 1980-07-20とv24 1980-12の間に収まらず信用できないため null。v26はNDL「第26巻 1981.04」+全体表記「1975.4-1981.4」の2点一致で1981-04。v1-v4はNDLもISBN無し。'

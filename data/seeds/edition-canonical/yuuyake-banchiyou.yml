source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 初出のサンデーコミックス(秋田書店 全17巻 1968-1971)がMADB上で3 sid × SUNDAY COMICS/サンデーコミックスの表記ゆらぎに散らばり、そこへ1999-2000年の漫画名作館スペシャル(アース出版局 全7巻)が1-7巻枠として食い込み、14巻には1986年サンケイコミックスの日付が入っていた(3巻2000-01→8巻1969-08-30の31年逆行)。散らばっていた初出全17巻を1本に統合して主版に戻し、サンケイコミックス版(全15巻 1986)と漫画名作館スペシャル(全7巻 1999-2000)はextra_editionsへ。NDL SRU(creator=荘司としお)は本作の版元が秋田書店であることを裏づける(小説夕やけ番長 昭和44 秋田書店 / 冒険王付録 1968.8 秋田書店)。2巻と14巻の発売日は両ソースに無いので空のまま。'

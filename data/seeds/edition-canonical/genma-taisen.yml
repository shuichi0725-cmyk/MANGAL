source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブに1968年サンデーコミックス・1981年アニメージュコミックス・1999年Shotaro worldが混線し3巻1999-05-01→4巻1981-05の18年逆行、文庫タブも2009年秋田文庫と1977年講談社漫画文庫が混ざって1巻2009-04-20→3巻1977-02-28の32年逆行になっていた。MADBは同作を5 sidに割り、初出サンデーコミックスの1巻と2巻すら別sidに分かれていた。初出のサンデーコミックス全2巻(秋田書店 1968-02-25/1968-06-20)を1本に統合して主版に戻し、アニメージュコミックス(1980-81 全4巻)/NTT出版マンガ傑作選(1996 上下)/Shotaro world(1999 全3巻)/復刊ドットコム(2019 全2巻)と文庫4種はextra_editionsへ分けた。★秋田文庫はISBNブロックの違う2組(9784253171182 2009-04 と 9784253177566・573 2009-07)があり、同じ版の続巻か別セットかを両ソースから決められないので統合せず別タブのままにした。★富士見コミックス/富士見コミックスアニメ版(1983)は劇場アニメのコミカライズなので掲載対象外。'

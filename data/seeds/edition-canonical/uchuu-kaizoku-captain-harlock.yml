source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 ★ISBN補充3巻 2026-08-24(partial-isbn-gap半自動: 帯/楽天題/巻番号/未使用の4検証) / ★2026-08-29 壊れラベル是正: 2026-08-17の一括処理が、種2でimprintが空だったrunにtype名(standard)をそのまま貼って『standard版』という実在しないタブ名を作っていた。NDL by-ISBNの叢書名(dcndl:seriesTitle)→楽天seriesName→出版社名 の順で実名に戻した。どれも取れないrunは『別版』とし、巻・ISBN・発売日には一切触れていない。 / ★2026-08-29 上下分冊の番号是正: 上下2冊本が「1巻と3巻」として焼かれており2巻が欠番に見えていた(MADB系統の 上=1/中=2/下=3 固定割当を2026-08-17の一括処理がそのまま取り込んだもの)。揃っている分冊だけを 1..N に振り直した(片側欠落=真の取りこぼしは触っていない)。 / ★2026-08-30 エロイカ型(和名↔英名のARMS分裂 × 幽霊巻マスク)の掃引で判明。同じサンデーコミックスが「通常版(サンデーコミックス)」[1,2,3,5]と「SUNDAY COMICS」[1,2,3,4]に割れ、主版は4巻が欠番、SUNDAY COMICS側は1-3がISBN無しの重複だった。4巻の実ISBN 9784253063661 は楽天books で「宇宙海賊キャプテンハーロック（第4巻）」秋田書店・seriesName=サンデーコミックス と確認でき、ISBNも 06363-0(1)/06364-7(2)/06365-4(3)/**06366-1(4)**/06367-8(5) と完全連番。よって1版へ統合し1-5巻とした。ISBN無しの重複1-3は落とした(実体は主版に残る)。 / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= Akita top comics wide(2巻) / ★2026-08-30 コンビニ廉価/抜粋版の除去(bucket B=巻数が主版以上のため個別に裏取りした分)。楽天で価格・叢書名・巻の実題を確認し、テーマ別の再編集(=抜粋)であることを確定した。 除去=「Akita top comics」(5巻)。2003-2004年刊・**314円**・叢書=Akita top comics。巻の実題が「1(星の海への旅発)」「2(俺の旗のもとに)」「3(女王ラフレシア)」「4(マゾーンの生命)」「5(わが永遠のアルカディア)」＝**テーマ別の再編集**で原版サンデーコミックス(1977-79・全5巻)とは構成が異なる。ハレンチ学園のKPC(ドキドキ校内編/ワクワク校外編)と同型。'

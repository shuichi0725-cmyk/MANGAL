source: '刊行run分裂の是正(ARMSワイド版型) 2026-08-28: 1本の刊行runが版タブに割れていた頁を、本番頁が既に持っている巻をそのまま組み替えて1版に戻した。分裂の真因はMADBのレーベル表記ゆれ(英字↔和名・略称↔正式名)・schema:brandの欠落/混入・種2のクラスタ分裂で、同一runであることはMADBのシリーズ容器ID(schema:isPartOf)・楽天seriesName・ISBN連番・刊行ペース・外部の刊行リストで裏取りした(調査エージェント+反証エージェントの二段裁定)。巻・ISBN・発売日の新規追加や値の改変はしていない。 / 集英社YOUコミックスは1995年10-11月にline全体がDX表記→標準表記へ一斉に切替わっており(無関係な5作品が同月に反転)、4/5巻の境界はその写し。'

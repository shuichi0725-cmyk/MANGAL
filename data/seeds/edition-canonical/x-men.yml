source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 巻抜け補完: ShoPro Books(2024)版の2巻が欠けていた。楽天books キャッシュに 9784796873925「X-MEN Vol.2：徒花」小学館集英社プロダクション 2024-09-12 があり、ISBN も 87391-8(1巻)/87392-5(2巻)/87393-2(3巻) と連番で確定。'

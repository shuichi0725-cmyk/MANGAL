source: 'ギャラ型B是正 2026-08-17: 通常版タブに1974-77年パワァコミックス(全8巻)と2011年小学館クリエイティブ版(全4巻)が混線し、1巻2011年/2巻1974年…という37年逆行(頁の出版社も小学館クリエイティブ表示)。アクション・コミックスの1980年版・1990-91年版、KPC、Rare mix comicsは巻番号衝突で1冊も出ていなかった。NDL SRU(creator=横山光輝)で確定= 【アクションコミックス】双葉社 1974.03.01 / 1980.06.30 v1 / 1990.11.30 v1(4575816795)・v2(4575816809)・1990.12.28 v3(4575816841) / 【KPC】講談社 2007.8-10 春秋烈風篇・暴虎震撼篇・竜虎飛翔篇 / 【Rare mix comics】小学館クリエイティブ 2011.7-9 飛竜編・風雲編・血刀編 / 小学館クリエイティブ 2011.2-4 全4巻。★初出のパワァコミックス自体はNDL未収録だが、同じ1974年に双葉社が本作を刊行していることがNDLで確認でき(1974.03.01のアクションコミックス記録)、後続の再版も全て双葉社なので版元を双葉社とした。1990-91年版の5巻は両ソースに無く欠番のまま。文庫タブ(講談社漫画文庫 全5巻 2001)とデラックスタブは混在なしのため温存。 / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= KPC版(講談社)(3巻)'

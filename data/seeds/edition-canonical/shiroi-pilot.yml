source: 'ギャラ型B是正 2026-08-17: 通常版タブに1962-63年手塚治虫漫画選集・1969年ゴールデン・コミックス・1978-79年手塚治虫漫画全集・2011年文庫全集・2012年小学館クリエイティブ限定版BOXが混線し49年の逆行。NDL SRU(creator=手塚治虫)で分離確定= ①【手塚治虫漫画選集 ; 22/24】鈴木出版 第1部 1962.11 / 第3部 1963.01(第2部は両ソース不在=欠番のまま) ②【ゴールデン・コミックス】小学館 全2巻 1969.10.10/1969.11.10(完備最古) ③手塚治虫漫画全集 講談社 全2巻 1978.10.10/1979.2 ④小学館クリエイティブ「少年サンデー版 限定版box」2012.3 ⑤手塚治虫文庫全集 2011.12 ⑥小学館文庫 1997.11.10 ⑦秋田文庫 2006.11。完備最古の②を主版に、他はextra_editionsへ。★④はNDL上「第1巻(ふたごの秘密の巻)」と「第2巻(ハリケーン号の巻)」が**同一ISBN 9784778032128**=BOX1点なので1件にまとめた。⑤はMADBが通常版扱いだがNDLで手塚治虫文庫全集(BT-177)と判明したため文庫に置いた。'

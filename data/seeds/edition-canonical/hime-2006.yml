source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 レーベル表記ゆれの統合(ARMS型): 同じ双葉社アクション・コミックスが中黒の有無で「アクションコミックス」(1・3巻)と「アクション・コミックス」(2・4巻)に割れ、巻が相補だったため1タブに統合(1-4巻)。中黒ありの表記に寄せた。巻・発売日は不変。'

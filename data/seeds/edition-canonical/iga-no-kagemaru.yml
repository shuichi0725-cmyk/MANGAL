source: 'ギャラ型B是正 2026-08-17: 通常版タブにサンデーコミックス(1969-1976 全15巻)・秋田コミックス・セレクト(1985-87)・KCDX(2008)が混線し、9巻2008-12→10巻1976-03-20という32年逆行(レーベル名も横山光輝漫画全集に化けていた)。文庫タブも1995-99年の秋田文庫と1977-78年の秋田漫画文庫が1本に混ざり、1巻1995/2巻1977/3巻1995/4巻1977…と交互になっていた。NDL SRU(creator=横山光輝)で確定= サンデーコミックス 秋田書店 第1巻 ISBN 9784253061223 1969.03 / Akita top comics 秋田書店 上 4253188656 2001.11 / 小学館クリエイティブ 限定版BOX は 貸本版(2010.6)・由比正雪の巻(2010.10)・闇一族の巻(2011.11)・七つの影法師(2013.4) の**各BOXが1 ISBN**。サンデーコミックス全15巻を主版に戻し、他の版は全てextra_editionsへ分離した。★MADBが「Akita top comics」に混ぜていた ISBN 9784253240857(2006-03)は 42532408xx のワイド版連番に属するので Akita top comics wide 側へ寄せた。★「Akita Bunko」の1冊(9784253171076 1996-06-10)は秋田文庫の欠けていた8巻なので秋田文庫に統合した。★横山光輝漫画全集は版元が両ソースに無いため publisher を不明とした。My first big special(2015)はコンビニ本のため掲載対象外。 ★ISBN補充2巻 2026-08-24(partial-isbn-gap半自動: 帯/楽天題/巻番号/未使用の4検証) / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= Akita top comics(2巻) / Akita top comics wide(8巻)'

source: '俺の空 4分割 2026-09-06(ユーザ「刑事編とくっついてる」): NDL書誌(ユーザ提供TSV 81行)+マンガペディアで確定。1頁に本編/刑事編/三四郎編/安田一平編の4作品が同居していた。巻は1冊も捨てず作品ごとの頁へ配置換え(総集編・傑作選は非掲載方針で除外)。
  本頁=本編(週刊プレイボーイ 1976-1979)のみ。刑事編/三四郎編/安田一平編は別頁へ移した。
  巻題はNDL書誌の副題。★スーパー・プレイボーイ・コミックスは種2で「スーパー・プレイボーイ・コミックス」と
  英字「SUPERPLAYBOY COMICS」の2タブに割れていた(ARMS型)ので1本に統合(2巻は所在不明で欠番)。
  ★頁に無かったホームコミックス「本宮ひろ志傑作集」全7巻(1994-12〜1995-06)をNDLで確認して追加。
  ★1000p総集編(2003-2005)は総集編=非掲載方針で載せない。'

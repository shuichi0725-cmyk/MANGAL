source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定。実体はB型+ISBN取り違え): 通常版タブに1958-59年の初出・1992-93年の漫画名作館・2009年のマンガショップ完全版が混線し、5巻1993-08→7巻1959-02の34年逆行になっていた。★さらにNDL SRU(creator=桑田次郎)で**ISBNの取り違え**が判明= 頁の1-3巻に入っていた 9784775913246/253/260 は漫画名作館(1992)のものではなく【マンガショップシリーズ 325-329】「月光仮面 完全版」2009.7-8(正義の章 上中下/慈愛の章 上中下)のISBN。漫画名作館(アース出版局)の正しいISBNは 9784795298248/255/262/279/415/422 の全6巻。両者を別タブに分けて是正した。初出run= MADBがUSAGI BOOKSとレーベル無しの2 editionに割っていた全7巻(1巻1958-09-01/7巻1959-02。2-6巻は日付なし)を統合して主版に。初出の版元は両ソースに記載が無いため publisher は不明と明示する。文庫タブは講談社漫画文庫(1976 上中下)と講談社の特選漫画文庫が混ざっていたのでsuppress_types で版ごとに作り直した。'

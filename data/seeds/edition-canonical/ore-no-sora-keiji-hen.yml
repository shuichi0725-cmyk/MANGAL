source: '俺の空 4分割 2026-09-06(ユーザ「刑事編とくっついてる」): NDL書誌(ユーザ提供TSV 81行)+マンガペディアで確定。1頁に本編/刑事編/三四郎編/安田一平編の4作品が同居していた。巻は1冊も捨てず作品ごとの頁へ配置換え(総集編・傑作選は非掲載方針で除外)。
  本頁=刑事編。初出=ヤングジャンプ・コミックス全7巻(1980-10〜1981-12。ISBN以前の本でISBN無し=NDLも無しで一致)。
  1993年のヤングジャンプ・コミックス・スペシャル全6巻(9784088751146〜1191)と、集英社文庫コミック版の
  8〜11巻(NDL題「俺の空. 11(刑事編)」=文庫は本編1-7+刑事編8-11の通し番号)を版タブに。
  ★2012年のヤングジャンプ・コミックスGJ全2巻は同名だが2012年刊で7巻→2巻と巻数が合わず、
  1980年版の再刊とは断定できないため**別タブに置いて保留**(別作品と判れば頁を分ける)。
  ★ヤングジャンプ特別編集「刑事編 総集編」(1980-07)は総集編=非掲載方針で載せない。'

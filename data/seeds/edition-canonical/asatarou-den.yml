source: "per-case版再構築 2026-08-14(ユーザ提供 ja.wikipedia「朝太郎伝」+ NDL SRU live(creator=中島徳博) + 楽天キャッシュ)。\n★壊れ方は3つ重なっていた:\n  ①「通常版(集英社/ジャンプ・コミックス)」と名乗る版の1〜7巻が、実体は\n    **ホーム社のジャンプコミックスセレクション(1987-88)**のISBN(4-8342-11xx)だった。\n  ②同じ版の8〜11巻はISBN無しで1979-80年=**集英社ジャンプ・コミックス初版**の巻。\n    つまり1つの版に2社2版が接ぎ木され、初版の1〜7巻はどこにも出ていなかった。\n  ③ワイド版が1・3・6の3冊だけ(巻抜け仮想 wideban:[2,4,5])。\n★確定した実体は3版(Wikipedia と NDL が全巻で一致):\n  ①集英社 ジャンプ・コミックス 全11巻 1978-07〜1980-07(初版はISBN無し。9巻のみ後刷でISBN登録\n    9784088521794 = JC;179)\n  ②ホーム社 ジャンプコミックスセレクション 全7巻 1987-10〜1988-04(ISBN 4-8342-1101〜1107)\n  ③リイド社 ワイド版SPコミックス 20世紀ヒーロー・シリーズ 全6巻 2000-01〜2000-06\n★ワイド版の発売日は**奥付基準**で統一した。NDL/MADB は 1・3・6巻を 2000-01-10 / 2000-03-09 /\n  2000-06-20 とし、楽天は同じ3冊を **ちょうど1ヶ月前**(1999-12-10 / 2000-02-09 / 2000-05-20)と記す\n  = 店頭発売日 vs 奥付発行日の系統差。本DBは奥付基準(MADB)なので楽天日付をそのまま入れると\n  ★3巻(奥付2000-03-09)と4巻(楽天2000-03-09)が同日で衝突する。\n  2・4・5巻はNDL/MADBに無いため**日を捏造せず年月のみ**とした(2月/4月/5月は\n  NDL確定の1月・3月・6月に挟まれて一意に定まり、楽天日付+1ヶ月とも月が一致する)。\n★各巻のサブタイトル(「どチビの意気!の巻」等)はWikipediaに全11巻分あるが、\n  JC版はWikipedia単独ソースなので今回は入れていない(JCS版はNDLが巻名を持つ)。 / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= ジャンプコミックスセレクション(7巻)"

source: 'ギャラ型C型是正 2026-08-17: MADBが1 edition行に1952年の原著・1978年秋田書店の長篇繪物語・2012年秋田書店の復刻を同居させ、2巻2012-08→3巻1952-11の60年逆行になっていた。しかも別sidに林よしおの『砂漠の魔王』(新生閣漫画絵本)まで同じqidで抱えていた。NDL SRU(creator=福島鉄次)で確定= 1978.08 秋田書店「沙漠の魔王 : 長篇繪物語」1冊 / 2012.8 秋田書店「秋田書店創立65周年記念特別企画」全1-10巻(セットのISBNが 9784253102018)。原著run(MADBのv1・v2・v3・v5・v7。3巻だけ1952-11の日付があり、他は日付なし)を主版に、1978年版と2012年復刻はextra_editionsへ分離した。★原著の版元は両ソースに記載が無いため publisher は「不明」と明示する。★4巻・6巻は両ソースに無いので作らない(欠番のまま)。★林よしおの『砂漠の魔王』は別人の別作品なので本seedに含めない=この頁から外れる。別頁として登録すべき候補。'

source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブに1957-59年の初出・1969-71年ヒット・コミックス・1991-92年漫画名作館・2007-08年小学館クリエイティブ復刻が混線し、12巻1992-01-22→14巻1957-12の34年逆行になっていた。MADBは初出runをレーベル無しの1 editionに v0や重複込みで詰め込んでいた。★主版は**巻が連番で揃い日付も全部ある最古**のヒット・コミックス(少年画報社 全8巻 1969-10-15〜1971-03-15)とし、1957-59年の初出(巻番号が飛び飛びで版元も両ソースに無い)はその他タブに版元不明で残した。漫画名作館(アース出版局 全13巻)と小学館クリエイティブ復刻(全5巻)もextra_editionsへ。※初出タブの日付は巻番号順に単調でないが、MADBの記録どおりで他の出典が無いため触らない。'

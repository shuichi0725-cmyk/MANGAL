source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 壊れラベル是正: 2026-08-17の一括処理が、種2でimprintが空だったrunにtype名(standard)をそのまま貼って『standard版』という実在しないタブ名を作っていた。NDL by-ISBNの叢書名(dcndl:seriesTitle)→楽天seriesName→出版社名 の順で実名に戻した。どれも取れないrunは『別版』とし、巻・ISBN・発売日には一切触れていない。 / ★2026-08-29 ユーザ報告「サバイバルもだいぶ分裂してる」の全面是正。裏取り = NDL SRU(creator="さいとう・たかを" AND title="サバイバル" 全137件) + ja.wikipedia 書誌情報節。 ①同一レーベルが4タブに割れていた: SPコミックスが (1988)/(1995)/(2019)/無印 に散り、少年サンデーコミックスとSP pocket wideも各2タブ。NDLの叢書名+巻+ISBNで刊行runごとに束ね直した。 ②**ワイド版(全6巻+Another Story)が版として存在していなかった**。3・4・6巻だけが他タブに紛れ込み、1・2・5・Another Story は頁に無かった。Wikipedia書誌節のISBN(4845802988/2996/3003/1981/199X/2007/1973)とNDL「サバイバル : ワイド版. N」の一致で確定し1版として復元。発売日はWikipediaの初版発行日。 ③SP Pocket(2000-01)が 6巻 + 別タブの2巻(8・14)に割れていた → 統合(1/5/8/9/11/14/15/17)。 ④SP pocket wide(2025-26)は先頭巻が「0巻」になり、2-5・13巻が欠けていた → NDLのVol.表記で1-13に是正。 ⑤リイド文庫に Another Story(9784845821525)を追加。発売日はWikipediaの正確な日付へ。 ⑥★**別作品の混入を除去**: 9784845854325 と 9784845858712 は NDL で「サバイバル : 少年Sの記録」(宮川輝作画のリメイク)。本編頁から外し survival-shounen-s-no-kiroku へ移設した。 ⑦種2の重複レコード由来だった「少年サンデーコミックス(1977)」「SPコミックス(1995)」の断片タブはsuppress_types で除去(中身は上のrunに全て含まれている)。'

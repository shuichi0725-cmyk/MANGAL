source: 'ギャラ型B是正 2026-08-17: 2005-06年のマンガショップ復刻(全4巻)が通常版の1-4巻枠を占有し、初版サンコミックス(1969-70)は5-8巻の残骸だけが見えていた(頁の出版社もパンローリング表示に化けていた)。しかも同じ通常版タブに若木書房Big action版(全8巻)まで混在。NDL SRU(creator=望月三起也)で3runを分離確定= ①サン・コミックス 朝日ソノラマ 全1-7巻 昭和44-45 ②Big actionシリーズ 若木書房 全1-8巻 1973-1974 ③マンガショップシリーズ 2005.12- 全4巻(ISBN)。初版run=①を主版に、②③はextra_editionsへ。Big actionの巻日付はMADB(v2 1973-08-20/v3 1973-09-20)を優先しそれ以外はNDLの月精度(NDLはv3を1973.7とするがMADBと矛盾するため採らず)。文庫タブ(ソノラマ漫画文庫 全7巻 1977)は巻構成に混在は無かったが、出版社が空欄表示だったのと work-level publisher が巻数多数決で若木書房に化けるのを直すため、suppress_types で作り直して朝日ソノラマを明示した。'

source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブに1997年ちばてつや全集・1988年母と娘でみる漫画名作館・1976年ホーム・コミックス・1963年初出が混線し、1巻1997-07-23→4巻1963-10の34年逆行になっていた。NDL SRU(creator=ちばてつや)で確定= 初出は**曙出版** 第2集1963.08 / 第4集1963.10(第1集のみ文華書房) / 【母と娘でみる漫画名作館】草の根出版会 上中下 1988.7(中のISBN 4876480451 をNDLから補完) / ちばてつや全集 ホーム社 全3巻 1997。初出run(2-6巻)を主版に、他はextra_editionsへ。★1巻はMADBに無く、NDLでも第1集だけ版元が文華書房=この曙出版runとは別なので巻を作らない(欠番のまま)。文庫タブ(ちばてつや漫画文庫 全4巻 1978)は混在なしのため温存。'

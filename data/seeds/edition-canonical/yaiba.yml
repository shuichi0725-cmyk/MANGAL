source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 同レーベル分裂の統合: 小学館文庫の1巻だけが別タブ「小学館文庫(2011)」に割れていた。ISBN 9784091933713(1)〜9784091933805(10) が完全連番で同一runと確定。発売日は seed の2011-12-20でなく楽天books の 2001年12月14日 を採用(2011は重版の登録値)。タブ名は年サフィックス不要になったので「小学館文庫」に戻した。'

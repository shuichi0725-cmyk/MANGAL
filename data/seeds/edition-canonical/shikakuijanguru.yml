source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-30 中身ゼロの幽霊タブを除去。「講談社コミックス」タブは 2/4/6巻の3行だけで**ISBNも発売日も無かった**(種2 M224613/14/15)。少年マガジンコミックス=講談社コミックスの少年マガジン向けレーベルであり、主版(少年マガジンコミックス)の2/4/6巻が発売日つきで実在するのでMADBの重複レコードと判断した。読者には「情報が何も無い3巻の版」に見えるだけなので外す(実体は主版に残るので消失しない)。suppress_types に shinsoban を足したのは種2側の再流入防止で、残す新装版(KCスペシャル/梶原一騎原作漫画傑作選)はcanonicalが再構築するため影響しない。'

source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 壊れラベル是正: 2026-08-17の一括処理が、種2でimprintが空だったrunにtype名(standard)をそのまま貼って『standard版』という実在しないタブ名を作っていた。NDL by-ISBNの叢書名(dcndl:seriesTitle)→楽天seriesName→出版社名 の順で実名に戻した。どれも取れないrunは『別版』とし、巻・ISBN・発売日には一切触れていない。 / ★2026-08-29 偽の巻抜けを是正: 小学館クリエイティブ版は2冊本(上・下)なのに 1巻と**3巻**として持っており2巻が欠番に見えていた。楽天books キャッシュで 9784778038700=「ザ・ウルトラマン 単行本初収録＆傑作選（上）」2022-05-20 / 9784778038717=「同（下）」2022-06-24 と確認 → 1(上)/2(下)へ。タブ名も書名に合わせた(旧「小学館クリエイティブ版」は出版社名でレーベル名ではなかった)。'

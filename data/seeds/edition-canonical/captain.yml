source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 初出のジャンプ・コミックス(集英社 全26巻 1974-04-30〜1980-06-15)がMADB上で別sid(著者欄に白泉社が混入したクラスタ)に丸ごと落ちており、頁の1-18巻枠を1986年ジャンプコミックスセレクションと2010年ホームコミックスが占有していた(16巻2010-04→19巻1978-05の32年逆行)。初出全26巻を主版に戻し、ホーム社系3run(セレクション1986-87 全15巻/ホーム社1991-92 全15巻/ホームコミックス2009-10 全18巻)と集英社ホームリミックス(2022 全2巻)はextra_editionsへ。文庫タブは集英社文庫の1・3巻が別edition(集英社文庫 コミック版)に分かれていたので suppress_types で全15巻を1本に作り直した。NDL SRU(creator=ちばあきお)でホーム社版のISBNと版元を確認。アクションコミックスアニメ版(1980)はアニメ版のため掲載対象外。 ★ISBN補充4巻 2026-08-24(partial-isbn-gap半自動: 帯/楽天題/巻番号/未使用の4検証) / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= ジャンプコミックスセレクション(ホーム社)(15巻) / 集英社ホームリミックス(2巻)'

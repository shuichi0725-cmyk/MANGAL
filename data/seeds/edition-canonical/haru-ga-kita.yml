source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定。実体はB型+別作品1冊): 通常版タブの1-6巻枠を2012年の小池書院King seriesが占有し、初出アクション・コミックス(双葉社 全10巻 1976-01〜1978-10)は7-10巻の残骸だけになっていた(36年逆行)。初出run全10巻を主版に戻し、劇画キングシリーズ(1990。MADBが2 sidに割っていた1巻と3巻を統合)とKing series全6巻(2012)はextra_editionsへ。My first big special(2022-23 全6冊)はコンビニ本のため掲載対象外。★MADBが同じクラスタに入れていた「ワールドコミックススペシャル」1冊(9784765903783・1993-10・著者=新田真子)は**別人の別作品「春が来た」**なので本seedには含めない=この頁から外れる。別頁として登録すべき候補として記録する。'

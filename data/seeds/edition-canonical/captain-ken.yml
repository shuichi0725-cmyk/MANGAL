source: 'ギャラ型B是正 2026-08-17: 通常版タブに1962年手塚治虫漫画選集(全3巻)・1968年虫コミックス(全2巻)・1978年手塚治虫漫画全集(全2巻)・2011年文庫全集・2012年小学館クリエイティブ限定版BOXが混線し50年の逆行。NDL SRU(creator=手塚治虫)で分離確定= ①【手塚治虫漫画選集 ; 17/18/21】鈴木出版 1962.06/1962.08/1962.10 全3巻(完備最古) ②【MUSHI COMICS ; 5/16】虫プロ商事 全2巻 1968.6/1968.10 ③手塚治虫漫画全集 講談社 全2巻 1978.1/1978.5 ④小学館クリエイティブ「少年サンデー版 限定版BOX」2012.3 ⑤手塚治虫文庫全集 2011.11 ⑥小学館文庫 1997.11 ⑦秋田文庫 2006.8。①を主版に、他はextra_editionsへ。★④はNDL上「1(モロ族の巻)」と「2(火星うちの巻)」が**同一ISBN 9784778031992**=BOX1点なので1件にまとめた(MADBはv2としてのみ収録)。⑤はMADBが通常版扱いだがNDLで手塚治虫文庫全集(BT番号)と判明したため文庫に置いた。'

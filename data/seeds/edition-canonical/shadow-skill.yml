source: 'Wikipedia(ja)「SHADOW SKILL」書誌節 × 楽天書誌(ISBN直引きで叢書名・出版社・発売日を全巻照合)× NDL(v8-v11のKCDX書誌)の一致。この頁は講談社『月刊アフタヌーン』連載の第三期(2000-2014)=アフタヌーンKCデラックス全11巻。2026-08-08。★従来は同じ11巻が「通常版(v1/v2/v3/v4/v8-v11)」と「デラックス版(v1-v7)」に割れたうえ、三つの別物が本編の巻番号を奪っていた: (a)通常版v1=9784063363333は楽天叢書名が『KCキャラクターブックス』の初回限定版で本編の巻ではない (b)通常版v2/v3/v4=9784049261226/57/71は角川書店ドラゴンコミックス(1998)=竹書房版と同一内容の再版=第一期の別作品 (c)デラックス版v1=9784063342406は『phantom of shade』=旧装丁版(竹書房版1-2巻をblack howling、3-4巻をblack wing、ドラゴンジュニア連載分をphantom of shadeとして再編集した3冊)であって新装版1巻ではない。新装版の正しい1巻9784063344578は頁に存在しなかった'

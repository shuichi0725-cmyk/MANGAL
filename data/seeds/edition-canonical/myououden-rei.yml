source: '明王伝レイ 是正 2026-09-03(ユーザ提供 ja.wikipedia で確定): 頁が KCDX(1-12) と KCデラックス(8,9,10,13,14,15) の2タブに割れ、★**8・9・10巻が同一ISBNで二重掲載**、13-15巻は別タブに孤立していた。実体は KCデラックス 全15巻の1本のrun(1988-11〜1993-04)= レーベル略記ゆれによる版分裂。Wikipediaの刊行リスト15巻のISBNは頁の15冊と完全一致(過不足なし)。さらに ★KCフェニックス版(復刻・第一部のみ全4巻 2000年)が種2に在るのに同type合流で本番から消えていたので、版タブとして復活させた。'

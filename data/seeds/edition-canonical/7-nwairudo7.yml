note: "2026-08-08 per-case是正(ユーザ提供のNDLサーチTSV + Wikipedia)。本編ワイルド7と**同じ版混在(接ぎ木)**だった。\n★旧状態: 「通常版」14巻のうち v1-8 が ぶんか社版(2005年・文庫)、v9-14 が徳間書店トクマコミックス版(1989-1991)。\n レーベル「トクマコミックス」に出版社「ぶんか社」が付く矛盾も出ており、徳間版 v1-v8 は本番に存在しなかった。\n【再構築】通常版 = 徳間書店トクマコミックス 全14巻(初出単行本) / 文庫版（ぶんか社）= 全8巻(2005-03〜2005-06)。\n★通常版 v1-v5 は release_date/ISBN を空にしてある。MADBが持つのは v6 以降だけで、\n TSVに在るのは図書館所蔵の「1988」(v6が1988-11なのでv1が1988とは考えにくい)と\n NDLのまとめ書誌「野獣伝説 1～5」のみ。初版日もISBNも確定できないため**推測で埋めない**。\n★徳間 v8 の ISBN 9784197890507 は本TSVから新規に判明したもの(旧頁ではこの巻がぶんか社版に占有されていた)。\n【出典】巻構成=Wikipedia(全14巻) / 巻・日付=メディア芸術DB(MADB) / ぶんか社版=NDLサーチTSV × 楽天(ISBN直引き)一致。\n"

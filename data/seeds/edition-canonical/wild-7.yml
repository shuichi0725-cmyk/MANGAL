note: |
  2026-08-08 per-case是正(ユーザ提供のNDLサーチTSV + Wikipedia)。
  ★根因=版混在(ベルサイユのばら型): 1つの「通常版」の中で v1-18 が徳間書店トクマコミックス版(2001年・ISBN有)、
  v19-48 が少年画報社ヒットコミックス版(1974-1979・ISBN無)という**別版の接ぎ木**になっていた。
  結果、原版である少年画報社版の v1-13(1970-1973)が本番のどこにも存在せず、
  レーベル「ヒットコミックス」(少年画報社)に出版社「徳間書店」が付く矛盾も出ていた。
  【再構築】
   通常版 = 少年画報社ヒットコミックス 全48巻(原版・連載完結まで揃う唯一の版)
   徳間書店版 = トクマコミックス v1-18(2001年再版。ISBN・日付は従来の standard v1-18 をそのまま移送)
   愛蔵版 = 実業之日本社 全12巻(2002-11〜2003-08) ★本番に1冊も無かった
   文庫版(ぶんか社コミック文庫) = 全27巻(2007-10〜2008-09) ★本番に1冊も無かった・書影27/27あり
   既存の 文庫版(徳間コミック文庫 全33巻) と デラックス版(トクマコミックス・デラックス) は温存。
  【出典】巻構成=Wikipedia(全48巻) / 少年画報社版の巻・日付=メディア芸術DB(MADB) /
   愛蔵版・ぶんか社文庫の巻・ISBN・日付=NDLサーチTSV × 楽天(ISBN直引き)の2ソース一致。
  ★通常版 v1-13 は release_date を空にしてある。MADBが初版発行年月日を持たず、
   TSVに在る図書館所蔵はいずれも「重版」で、ヒット・コミックス通し番号の順序とも矛盾する
   (v8=HC83が1972.10、v9=HC91が1972.4)ため初版日を確定できない。**推測で埋めない**。

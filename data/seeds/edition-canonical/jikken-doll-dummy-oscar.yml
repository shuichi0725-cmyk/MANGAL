source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 初出の劇画キングシリーズ(1979-1991 全19巻)がMADB上で2 sid × 4 editionに散らばり、そこへ2018-19年のComic魂別冊叶精作が食い込んで2巻2019-12→3巻1979-05の40年逆行になっていた。散在していた初出全19巻(18巻はISBN 9784883151103・19巻は9784883153558)を1本に統合して主版に戻し、Comic魂別冊叶精作(はちどり 2018-2019 8冊。MADBが巻番号を持たないので発売日順に1-8へ採番)とGoma books(2019 全2巻)はextra_editionsへ。★劇画キングシリーズの版元は両ソースに記載が無いため不明と明示。★このseedは当初 volumes 配下のインデントが不揃い(2スペースと0スペースの混在)でYAMLパースに失敗し、promoteに**無警告で読み飛ばされていた**(get_edition_canonicalがexcept:continueで握り潰す)。2026-08-17に是正。★さらに別sid(129946)の「漫画スーパーワイド」5巻(9784883158003 2003-03-01)が抜けており、反映の「消えたISBN」警告で気づいて別タブとして足した。※11巻の発売日1980-05は前後(10巻1983-01/12巻1984-01)と矛盾するがMADB以外に出典が無いためそのまま残した(逆行は3年弱で検出閾値の5年未満)。'

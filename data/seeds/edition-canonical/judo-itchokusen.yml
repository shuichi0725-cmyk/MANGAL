source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブの1-7巻枠を2004年の完全復刻版(ネコ・パブリッシング)が占有し、初出キング・コミックス(少年画報社 1968-1970)は8-13巻の残骸だけになっていた(1巻2004-02→8巻1970-04-01の34年逆行)。MADBは同じ作品を3 sidに割り、KCスペシャル全8巻も2 sidに分断していた。初出run(v1-v10とv13。11・12巻は両ソースに無く欠番のまま)を主版に戻し、サンケイコミックス版(1986。MADBはSCとサンケイコミックスの2 editionに分かれていたので統合)・KCスペシャル(講談社 1990-91 全8巻)・完全復刻版(ネコ・パブリッシング 2004 全7巻)はextra_editionsへ。2004年版の版元は楽天(ISBN 9784777050406=「柔道一直線（第1巻）完全復刻版」ネコ・パブリッシング 2004年02月)で確認。文庫タブ(光文社文庫comic series 全7巻 1998)は混在なしのため温存。'

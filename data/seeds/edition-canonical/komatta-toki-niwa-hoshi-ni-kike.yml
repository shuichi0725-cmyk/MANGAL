source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 是正(ユーザ報告「同漫画内で分裂」): ①MADBが2巻のレーベルを「いち好き・コミックス no.74」(=レーベル通し番号入り)で持つため2巻だけ別版タブに割れていた=主版へ統合。②MADBはISBN 9784887412330を3巻としていたが NDL by-ISBN が「困った時には星に聞け!. 4」1998.10 と明示、Wikipedia書誌節の刊行順とも一致 → 4巻へ是正。③真の3巻 ISBN 9784887412071(1998-06) は MADB/NDL/楽天/JPRO のいずれにも無い取込もれ。Wikipedia書誌節と紀伊國屋書店(dsg-01-9784887412071=「困った時には星に聞け！〈3〉/あべ美幸/冬水社/いち好き・コミックス」)の2ソース一致で確定し追加。発売日はWikipedia(1998-06-24)を採用(紀伊國屋は1998年10月とするが4巻と衝突するため不採用)。④残り25巻のISBNはWikipedia書誌節と種2(MADB)が完全一致=裏取り済み。'

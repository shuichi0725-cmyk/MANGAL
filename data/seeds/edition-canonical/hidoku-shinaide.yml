source: >-
  漫画内分裂の是正 2026-09-10(ユーザ報告→検出器#30の穴を塞いで発見)。
  本編は全12巻(ねこ田米蔵/リブレ)だが、種2で**同一レーベルが4通りに表記**され版が4つに割れていた:
  Be-boy comics(1巻 9784862631015 2007-01) / Be×boy comics(1巻 9784799730812 2016-10 + 2-6巻) /
  ビーボーイコミックス(7-9巻) / ビーボーイコミックスデラックス(10-12巻)。
  promote が2つの「1巻」を衝突させ**2007年の初版を落として**おり、頁の最古が2巻(2010)になっていた。
  さらに 10-12巻が deluxe タブに落ちて内部分裂していた。
  裏取り=楽天live題検索で本編16件を全数確認(「酷くしないで」2007-01-10 → 「酷くしないで12」2025-12-10)。
  1巻は刷違い2種(2007初版 9784862631015 / 2016再刊 9784799730812)。初版を主に据えた。
  ★再刊ISBNは頁に出していない: apply_edition_canonical の _v() は number/isbn13/release_date/
  volume_label しか搬送せず **canonical は variants 非対応**(2026-09-10 実地確認。書いても黙って落ちる)。
  刷タブが要るなら edition-overrides 経由(promote 2770行)か canonical 側の対応追加が要る。
  ★同qidのスピンオフ「小鳥遊彰編」は auto-merge で本編1巻の座を奪っていたため
  merge-exceptions [53797,53798] で遮断し、別頁 hidoku-shinaide-takanashi-akira-hen として独立させた。

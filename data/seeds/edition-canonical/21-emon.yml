source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型=復刻混在): 通常版タブで2018年のてんとう虫コミックス新装(ISBN 97840914275xx)が1巻枠を占有し、1977-78年の初出てんとう虫コミックスと41年逆行していた。さらに虫コミックス(1971-72 全3巻)・中公コミックス(1984 全5巻)・藤子・F・不二雄大全集(2010)は巻番号衝突で頁に出ていなかった。NDL SRU(creator=藤子不二雄)で確定= 【てんとう虫コミックス】小学館 第1巻1977.8(ISBN 4091401716)/第2巻1977.11(9784091401724)/第3巻1978.2(9784091401731) / 【中公コミックス 藤子不二雄ランド】中央公論社 全5巻 1984。★主版は「完備最古」の規則どおり虫コミックス(虫プロ商事 全3巻 1971-10-30〜1972-01-30・MADB単独だがNDL未収録層)とし、てんとう虫コミックス全4巻はNDLのISBNを補完した上で別タブに置いた。 ★ISBN補充1巻 2026-08-24(partial-isbn-gap半自動: 帯/楽天題/巻番号/未使用の4検証)'

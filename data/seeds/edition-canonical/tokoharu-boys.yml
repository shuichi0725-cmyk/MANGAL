source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 是正(ユーザ報告「同漫画内で分裂」の型掃引): MADBはラキッシュ・コミックスのレーベル通し番号(no.2/no.9/no.29/no.35/no.70…)をimprintに含めて持つため、同一のラキッシュ版が巻ごとに別edition行へ割れており、2026-08-17のギャラ型是正一括処理がその区切りをそのままextra_editionsへ焼き込んでいた。NDL(creator=葉芝真己 束縛SRU)で1本のラキッシュ・コミックス run であることを確認し主版へ統合。発行はvol1-5が吉祥寺企画、vol6-7が冬水社(社名変更、ISBN出版者記号はともに4-88741)のため表示は冬水社に統一した。日付はNDL/MADB一致値をそのまま採用(旧刊のためNDL出版年は重版由来で巻順と非単調だが、情報を足さない方針で加工しない)。 巻構成=NDL: ラキッシュ・コミックス 1=no.6(1993.12) / 2=no.12(1994.03) / 3=no.64(1996.01) の全3巻。主版は「巻数最多かつ最古のrun」の規則どおりラキッシュ版に戻した(旧canonicalは幻冬舎バーズ版を主版に据え、かつ上下2冊を巻1と巻3としていた=NDLは「上」「下」の2冊 → 1/2 + volume_label 上/下 に是正)。'

source: 'ギャラ型C型是正 2026-08-17: MADBが1 edition行の中に**初版(先進社 1929-1930)と大空社の復刻(1990-10/1991-12)を同じ巻番号で二重に**持っており、1巻だけ復刻の1990-10が採用されて3巻1929-07との61年逆行になっていた。NDL SRU(creator=岡本一平)で確定= 初版は**先進社**(1929年・1931.4「世界漫画巡礼」)、復刻は**大空社**の増補版 1990(第1-9巻ほか)。初版15巻を主版に、大空社復刻(1990-10の1-15巻+1991-12の16-20巻)はextra_editionsへ分離した。※初版の刊行順は巻番号順ではない(5巻1929-06→3巻1929-07→9巻1929-08…)が、これはMADB/NDLどおりの実際の刊行順なので直さない。'

source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 壊れラベル是正: 2026-08-17の一括処理が、種2でimprintが空だったrunにtype名(standard)をそのまま貼って『standard版』という実在しないタブ名を作っていた。NDL by-ISBNの叢書名(dcndl:seriesTitle)→楽天seriesName→出版社名 の順で実名に戻した。どれも取れないrunは『別版』とし、巻・ISBN・発売日には一切触れていない。 / ★2026-08-29 壊れラベル是正の続き(ARMS型統合): 『standard版』だった run は KCデラックス の3・4巻だった(楽天books: 9784063131376=「野球狂の詩（愛蔵版）（3）」/9784063131383=(4)、いずれも seriesName=KCデラックス・講談社。ISBN も 1352(1)/1369(2)/1376(3)/1383(4)/1390(5)/1406(6) と連番で欠けが埋まる)。既存KCデラックスへ統合し、発売日は楽天の 1990-05-23 / 1990-06-23 を採用(既存巻も23日刊行で整合)。 / ★2026-08-30 ユーザ裁定「機械的に処理できそうな物は処理して」。コンビニ廉価/抜粋レーベル × 同頁に他版が残る × 主版より巻数が少ない、の3条件をすべて満たす版だけを落とした(作品が消えないことを機械で保証)。 除去= KPC mini(1巻) / KPC(1巻)'

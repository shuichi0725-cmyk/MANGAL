source: 'ARMS型(レーベル表記ゆれ版分裂)の是正 2026-09-06(七色いんこと同型・ユーザ依頼):
  原典の秋田書店サンデー・コミックス版が種2で分断され、1巻(1968-05-10)と3巻(1972-10)が
  「サンデー・コミックス」に、2巻(1968-06-10)だけが英字表記の「SUNDAY COMICS」に落ちて別タブになっていた。
  NDLで原典は全3巻と確認(【SUNDAY COMICS】バンパイヤ 1 = 1968.5 / 第3巻 = 1972.10、
  【サンデーコミックス】【サンディコミックス】等の表記ゆれ記録も同一書誌)。
  さらに通常版タブを1979/1993年の講談社「手塚治虫漫画全集」が占めていたため主版が全集になっていた。
  → 主版=サンデー・コミックス全3巻(秋田書店1968-1972)、1988年の新装4巻(9784253063906-937。
  NDL「サンデー・コミックス 第1巻 ISBN=425306390 1988.3」)は別タブへ。
  ★1・2巻はISBN以前の本のためISBN無し(NDLも無しで一致)。3巻の9784253062022は種2(MADB)由来の
  重版ISBNで楽天/NDLには無いが書影seedに実物があるため温存する。'

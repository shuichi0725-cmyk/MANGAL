source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-30 コンビニ廉価/抜粋版の除去(bucket A の取りこぼし分)。レーベル表記が「ジャンプ コミックス セレクション」(中黒なし・語間スペース)で、初回の判定正規表現が拾えていなかった。楽天books で叢書名=ジャンプコミックスセレクション・641円・判型コミック と確認。同頁に主版が残り、巻数も主版より少ない(=抜粋)。 除去= ジャンプ コミックス セレクション(1巻)'

source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブの1巻枠を2018年の徳間書店 Tokuma comics 版が占有し、初出ビッグコミックス(小学館 全17巻 1976-08-01〜1982-11)と42年逆行していた。初出run全17巻を主版に戻した。文庫タブ(小学館文庫 全6巻 1983-84。MADBが2 sidに割っていた分は同一imprintなので自動で1本になる)は混在なしのため温存。★Tokuma comics の1冊は副題が「とんぼ・お志摩のまったりな日々 : 江戸吉原始末屋ばなし傑作選」= **傑作選(抜粋本)**で、MANGALの掲載境界では非掲載対象。canonical化でこの頁から外れる。※石ノ森章太郎萬画大全集の17冊は日付もISBNも無く元から非表示。'

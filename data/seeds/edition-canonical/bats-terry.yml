source: |
  per-case版再構築 2026-08-14(ユーザ提供のNDL横断TSV + MADB + 楽天キャッシュ)。
  ①ワイド版(SPコミックス/リイド社)が2巻と4巻の2冊しか無く巻抜け仮想 wideban:[3] に出ていた
    → 楽天キャッシュに全11巻(毎月刊行。奥付で1999-06〜2000-04)が揃っており全量で再構築。
    ★旧版は publisher=講談社 だったが SPコミックス はリイド社のレーベル(MADB vol2レコードの誤り)。
  ②KCスペシャル(講談社1991)全13巻が頁に丸ごと不在だった → 全ISBN連番(9784063055016〜139)を
    楽天+MADBの双方で確認し aizoban(24巻→13冊の合本再編)として追加。
  ★ワイド版の発売日は**奥付基準**(2026-08-14 訂正・ユーザ裁定)。当初は楽天(店頭発売日)を全11巻に
    入れたが、同じリイド社ワイド版の『朝太郎伝』をNDLで引いたところ、楽天日付は奥付のちょうど
    1ヶ月前という系統差だと判明したため全巻を +1ヶ月 して本DB(奥付基準)に揃えた。
    根拠は3重: ①MADBが持つ2巻=1999-07-18 / 4巻=1999-09 と一致する
    ②リイド社はワイド版を毎月同じ発売スロットで出しており、本作と『朝太郎伝』は楽天日付が完全に
      同一(本作v8=朝太郎伝v1=1999-12-10 / v10=v3=2000-02-09)。その朝太郎伝側のNDL奥付が
      2000-01-10 / 2000-03-09 = 本作 v8 / v10 の補正後と一致する
    ③補正前は楽天ラダーのままで、奥付基準の他頁と1ヶ月ずれ続ける
    ★残る9巻の日は導出値(楽天+1ヶ月)。上記②の同一スロット一致で月日とも裏付けが取れている。
  ★見送り(掲載対象外=抜粋再編): IDコミックスWIDE(一迅社2008「愛狂抗争編・前/後」「激闘！地区大会編」
    「αα死闘編」)4冊 / バンブーコミックス(竹書房2014 副題「一発逆転!編」等)4冊。
    電子版(グループ・ゼロ2018)と小説版(講談社X文庫)も対象外。

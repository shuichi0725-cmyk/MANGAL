source: 'ARMS型(レーベル表記ゆれ版分裂)の是正 2026-09-06(ユーザ「よく見直してほしい」):
  原典の少年チャンピオン・コミックス全7巻が、種2で **3つのedition**に割れていた
  (「SHONEN CHAMPION COMICS」1-4,6巻 / 「少年チャンピオン・コミックス」7巻 /
  「Shōnen champion comics = 少年チャンピオン・コミックス. 演劇ロマンコミックス」5巻)。
  ISBNが 9784253038096→8157 の連番で1本の刊行と確定(NDL 少年チャンピオン・コミックス
  第1巻=9784253038096 1981.9 とも一致)。さらに原典がどれも shinsoban に落ち、
  通常版タブを1994年の講談社「手塚治虫漫画全集」が占めていたため、頁の主版が全集になっていた。
  → 主版=少年チャンピオン・コミックス全7巻(秋田書店1981-1982)に戻し、全集ほかは版タブへ。
  ★秋田文庫も種2で2つに割れていた(「Akita Bunko」standard 1,3,4,5巻 /「秋田文庫」bunkobon 2巻)ため
  bunkobonも suppress し、秋田文庫5巻・手塚治虫文庫全集3巻を版タブとして明示し直した。
  ★5巻の発売日: 種1(MADB)にこのISBNは **2024-02-06 の再版レコード**としてしか無く(原典の登録が無い)、
  楽天も1991-12-05(重版)。原刊行はNDLの「七色いんこ. ５ / 秋田書店 / １９８２.」しか根拠が無いため
  **1982**(年精度)で置く。推測の月日は入れない。'

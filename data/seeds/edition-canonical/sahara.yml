source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型+別作品1冊): 通常版タブの1-4巻枠を2011年の小池書院キングシリーズが占有し、初出ビッグコミックス(小学館 全8巻 1974-12-10〜1976)と35年逆行していた。NDL SRU(creator=平野仁)で確定= 【キングシリーズ 漫画スーパーワイド】小池書院 全4巻 2011.2-4(ソルティdog編/サンフラン死スコ編/別れのエスプレッソ編/疲れたスカート編)。初出run全8巻を主版に、キングシリーズ全4巻と劇画キングシリーズ(1985)はextra_editionsへ。文庫タブは小学館文庫の全8巻がMADB上2 sidに割れていたので suppress_types で1本に作り直した(6巻が別sid)。★MADBが同じクラスタに入れていた Emerald comics 1冊(2014-02・著者=高口里純)は**別人の別作品「サハラ」**なので本seedには含めない=この頁から外れる。別頁として登録すべき候補として記録する。'

source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 通常版タブに1998年Sebunコミックス・2002年アリババコミックス・2022年パーフェクト・メモワールが混線し、2巻2022-04-13→3巻2002-04の20年逆行になっていた。文庫タブも2008年セブン文庫と1976年秋田漫画文庫が混在。MADBは同作を4 sidに割り、リイド社の3run(SPコミックス2014-17/SP pocket wide 2018/パーフェクト・メモワール2022)も分散していた。★本作は1976年の初出が秋田漫画文庫(文庫)で、通常版として完備している最古のrunが無い。そこで**巻が最も揃っているSPコミックス全4巻(リイド社 2014-2017)**を主版に据え、他のrunは全てextra_editionsへ分けた(初出の秋田漫画文庫は文庫タブに独立させて温存)。★アリババコミックス(世界文化社)の2011-10・2016-01の2冊はMADBが巻番号を持たない(v0)ため、発売日順に3・4巻として同じタブに並べた。'

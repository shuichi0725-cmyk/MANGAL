source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 初出アクション・コミックス(双葉社 全28巻 1972-05-15〜1976-05)がMADB上で2 sidに割れ、そこへ2011-13年の小池書院King series(全20巻)と1990年劇画キングシリーズが食い込んで16巻2013-01-10→21巻1975-04の38年逆行になっていた。文庫タブも1995-96年の道草文庫と1976/1979年の小学館文庫が混在。初出run(ed69891の28巻)を主版に戻し、1982-83年のアクション・コミックス重版(14冊)/1971年の漫画アクション・コミックス(2冊)/King series(2011-13 全20巻)/Comic魂別冊(2018-19 11冊。MADBが巻番号を持たないので発売日順に採番)/劇画キングシリーズ/Goma books(2019 全8巻)はextra_editionsへ。文庫は suppress_types で道草文庫(全28巻)・小学館文庫1976・小学館文庫1979に分けた。★4巻はed69891に無く、別editionの1972-02は3巻(1972-06)・5巻(1972-08)と矛盾するため日付なしで置いた。　/ 2026-08-28 刊行run分裂の是正(ARMSワイド版型): MADBのレーベル表記ゆれ(英字↔和名・略称↔正式名・中黒)や種2のクラスタ分裂で、1本の刊行runが複数の版タブに割れていた。楽天seriesName・MADBのシリーズ容器ID(schema:isPartOf)・ISBN連番・刊行リストで同一runと確認できた分だけ、既存の巻を版間で移して統合した(調査エージェント+反証エージェントの二段で裁定)。巻・ISBN・発売日の新規追加や改変はしていない。'

source: |
  per-case版再構築 2026-08-14(ユーザ提供 ja.wikipedia「オメガ7」+ NDL SRU live(creator=小林源文) + 楽天キャッシュ)。
  ★壊れ方: 巻番号が 1,2,3,4,5,**7** で、この「7」は 2002年ソフトバンクパブリッシング版
    『Omega 7』(9784797321647)。**題の「7」が巻番号として拾われた**もので7巻は存在しない。
    さらに版が1つに束ねられ、publisher=ソフトバンククリエイティブ なのに imprint=ボムコミックス
    (=日本出版社のレーベル)という取り違えも起きていた。
  ★確定した実体は2系統(Wikipedia/NDL/楽天の3ソース一致):
    ①日本出版社『オメガ7 : 自衛隊特殊コマンド部隊. 創生編』1994-06(ボムコミックス;45)= 初出単行本1冊
    ②ソフトバンク系 全5巻 = 2002-10『Omega 7』(ソフトバンクパブリッシング/ドリマガcomics。①の再版)
      → v.2 2006-06 → v.3 2007-08 → VOL.4 2014-04 → VOL.5 2014-11。
    ②を通常版(=完結した5巻の本編)、①を別ブロックの初版として並べる。
  ★発売日は既存(MADB)を維持。NDL(奥付)と全巻一致するため変更不要。
    Wikipediaは各巻とも約1ヶ月早い日付を載せるが、これは店頭発売日 vs 奥付発行日の差で
    本DBの全66k頁は奥付基準に揃えてあるため、ここだけWiki日付に寄せない。
  ★保留(本seedに入れていない): ゴマブックス2018-12の分冊2冊
    『Omega 7. PKO部隊救出作戦編』(9784814918720) /『Omega 7. 観測施設奪回作戦編』(9784814918737)。
    NDLにのみ在り楽天に無く書影も取れない。「〜編」の分冊再版は抜粋再編の可能性が高くユーザ裁定待ち。

source: 'ギャラ型B是正 2026-08-17: 通常版タブに1995年小学館叢書(全2巻)・1967年コンパクト・コミックス・1959年東邦漫画が混線し、1-2巻が1995年で4-5巻が1959年という36年逆行。NDL SRU(creator=白土三平)で確定= 【コンパクトコミックス】集英社「忍者旋風 : 風魔忍風伝」全1-4巻 昭和42(1967)=完備最古 / 小学館叢書 全2巻 1995.11-12 / 小学館クリエイティブ「未復刻集成」2010.9(ISBN 9784778031473) / 小学館文庫 全2巻 1999.5。東邦漫画版(1959)はMADBが3-6巻しか持たず1-2巻が両ソースに無いため主版にせずその他タブへ(巻番号はMADBのまま)。★NDLの「小学館叢書/小学館文庫 忍者旋風シリーズ」は別題『真田剣流』で別ISBNのため本作の版ではない。文庫タブ(小学館文庫 全2巻)は混在なしのため温存。'

   9784757521780 / 9784757523074)で、**祭囃し編の本当の1-4巻(9784757524460 / 9784757525870 /
   9784757527515 / 9784757529724)は本番のどこにも無かった**。v5-v8 だけが正しかった。
  ★根因: 罪滅し編と祭囃し編は**どちらも作画=鈴羅木かりん**なので種2のクラスタが寄ってしまう
   ([[clustering_unit_is_series]] の「著者軸で寄せるな」の実例)。同じ日に登録した新頁
   higurashi-no-naku-koro-ni-kai-tsumihoroboshihen と ISBN が丸ごと重複していた。

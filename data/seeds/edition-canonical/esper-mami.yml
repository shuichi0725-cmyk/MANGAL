source: '★ユーザ指摘 2026-08-07「エスパー魔美が分裂していて足りていない」+ てんとう虫コミックス3巻(9784091415035)の提示。楽天書誌の出版社・叢書名で5版を確定: てんとう虫コミックス9巻(ISBN 9784091415011-097の連番)/中公コミックス藤子不二雄ランド9巻/小学館コロコロ文庫6巻/藤子・F・不二雄大全集5巻/てんとう虫コミックス2017年新装9巻。★従来は3頁に割れ、さらに大全集タブに2017新装の6-9巻が混入し、てんとう虫版はv3欠番+v6,v7がISBN無しの幽霊だった。★2026-10-05 ユーザ再提示(Wikipedia エスパー魔美)で是正: 単行本節=少年ビッグコミックス9巻(1-8巻は当初マンガくんコミックス)/てんとう虫コミックス9巻(昭和62年4月25日付から刊行=少年ビッグ版の新装)/藤子不二雄ランド9/コロコロ文庫6/大全集5/てんとう虫2017新装9 の6版。従来の通常版=てんとう虫(97840914150xx)に1978-83年の日付が付いていた(楽天の旧版日付の流用。NDL TC-1504=1987.04.25)→原版を通常版に、てんとう虫1987を新装版タブへ。原版の日付=NDL(マンガくん1-8/少年ビッグ9)×MADB(4,5,9巻)、ISBN=MADB(4,5,9)×NDL(6,7,9)。1-3,8巻のISBNはどの源にも無い=空(推測しない)。8/7に幽霊として外したv6,v7(ISBN無し)は実在の原版巻'

source: '騎士ガンダム per-case 2026-09-03: 本頁=ボンボンKC本編 全10巻(1989-12〜1993-05)。旧頁は同じedition内に『特別版』1〜3巻(1990-12/1991-12/1992-10)が本編1〜3巻と番号衝突して不可視だった(=特別版は別頁へ)。2015新装版(本編分7冊)は旧来2頁(ラクロアの勇者編のみ1冊/『聖機兵物語編』頁は1巻枠に伝説の巨人編が座り聖機兵物語編・上が不可視)+5冊未掲載だったのを版タブとして本頁へ統合。 正史=ユーザ提供NDL書誌(29行)+楽天キャッシュ(全48 ISBNの題/日付/caption)+ja.wikipedia各編記事「漫画版」節。楽天caption(講談社文言)で収録対応を確定: ボンボンKC『騎士ガンダム物語』=本編10巻+特別版3巻(全13巻)→2015新装版KCDX全9巻(本編7+特別版2)、2017新装版KCDX全8冊=『機甲神伝説』〜『聖伝』の全13巻、『SDガンダム列伝 ガンダム騎士団』=コミックボンボン1998年2〜7月号の初単行本化(2017-12)。'

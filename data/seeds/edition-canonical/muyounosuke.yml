source: 'ギャラ型B是正 2026-08-17: 通常版タブが2021-2023年のリイド社「パーフェクト・メモワール」(全13巻)＋2004年SPコミックスで1-13巻を占められ、初出の講談社コミックス(1969-70)は14-15巻の残骸だけになっていた(頁の出版社もリイド社表示)。NDL SRU(creator=さいとう・たかを)で確定= 講談社 昭和44年 1-3巻の存在 / 小学館文庫 全15巻 1976-1978(v10-13のISBN 9784091901804/811/828/835 をNDLから補完。MADBはv5・v9のみ) / リイド社 1999・2004・2005・2021-23。★主版は初出の講談社コミックスとした。MADB/NDLとも5・11・12・13巻が無く不完備だが、完備している他runはいずれも2021年以降の復刻で、それを通常版に据えると初出単行本が見えなくなるため。欠番は捏造せず空けたまま。'

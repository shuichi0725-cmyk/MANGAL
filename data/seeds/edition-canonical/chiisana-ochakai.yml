source: 'ギャラ型B是正 2026-08-17: 2025年の「このマンガがすごい!comics」版(上中)が通常版の1-2巻枠を占有し、初版花とゆめコミックスの1巻・2巻が頁から消えていた(3-7巻だけが残り、2025年の上→中→1983年3巻という逆行)。さらに扶桑社版4巻・宝島社版2巻・2025年版の「下」は巻番号衝突で1冊も出ていなかった。NDL SRU(creator=猫十字社)で5runを分離確定= ①花とゆめコミックス 白泉社 全7巻 1981.2-1988.8(v1のISBN 9784592113416 はNDLから補完・v2はNDLもMADBもISBN無し) ②白泉社文庫 全2巻 2000 ③扶桑社 全4巻 2004.3-4 ④宝島社 全2巻 2012.11/2013.2(副題つき) ⑤このマンガがすごい!comics 上中下 2025.10-11。①を主版に、③④⑤と1980年の白泉社単行本「ぷりんともっぷの四季」をextra_editionsへ。文庫タブ(白泉社文庫)は混在なしのため温存。★2026-07-04の volume-exclude 2件(9784594045470/9784594045487 を「激マン型混入」として除去)は、扶桑社版を別タブに分けた今は扶桑社版1-2巻を消すだけの副作用になるため解除した。'

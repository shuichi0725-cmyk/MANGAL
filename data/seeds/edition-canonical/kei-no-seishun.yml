source: 'ギャラ型B是正 2026-08-17: 通常版タブの1-5巻を2013年の小池書院King series 漫画スーパーワイドが占有し、初出のアクション・コミックス(双葉社 1978-11〜1981-03 全14巻)は6-14巻の残骸だけになっていた(頁の出版社も小池書院表示)。NDL SRU(creator=小島剛夕)で初出が【アクションコミックス】双葉社(第1/第10/第11/第12巻を確認)であることを確定。★MADBが「King series 漫画スーパーワイド」(v1-5)と「King series」(v6-8)の2 editionに割っていた2013年の小池書院版は、ISBN 9784862259103〜172 が連番・発売日も2013-05〜2013-12で連続するので1つの版として統合した。劇画キングシリーズの13巻(1995)は1冊だけの記録なのでその1冊で立てる。デラックスタブ(アクション・コミックス・デラックス 全10巻 1989)は混在なしのため温存。※初出9巻の発売日1979-03はMADB上3巻と同値で前後(8巻1980-01/10巻1980-05)と矛盾するが、正しい値がどちらのソースにも無いためMADBのまま残した。'

slug: bakemonogatari
canonical_label: 通常版
canonical_imprint: KCデラックス
canonical_publisher: 講談社
source: |
  per-case版分離 2026-08-14(ユーザ指摘「化物語は通常版と特装版が同時発売。特装版しか載っていない」)。
  ★実態は「特装版だけ」ではなく**2版が1つに混ざっていた**。本番22巻のISBNを1冊ずつ判定すると
    通常版=3,4,5,6,7,8,9,11,13巻の9冊 / 特装版=1,2,10,12,14〜22巻の13冊 の混成で、
    imprint は どちらでもない「Magazine KC box」になっていた。
  ★原因: 種2が2クラスタに割れている。sid=92123(name:西尾維新|name:化物語)=特装版18冊、
    sid=149401(name:VOFAN|name:化物語)=KCDX3冊+特装版1冊。promoteが両者をmergeし
    巻番号でdedupした結果、巻ごとにどちらか片方が生き残って混成になった。
  ★確定(楽天とNDLが両版とも全巻で一致):
    通常版 = KCデラックス(NDL表記「KCDX週刊少年マガジン」)全22巻 2018-06-15〜2023-05-17
    特装版 = 講談社キャラクターズA(NDL表記「講談社キャラクターズA. Magazine KC box」)全22巻・同日発売
    価格でも別物と確認(1巻: 通常792円 / 特装1760円)。ISBNは全44点が互いに素。
  ★著者: 楽天・NDLとも「西尾維新 / 大暮維人」。本番は大暮維人(artist)のみで原作が空だったので
    edition-overrides.json で original_authors=西尾維新(writer) を付与。
    キャラクター原案のVOFAN(種2 sid=149401のクラスタ名)は役割が原案でありcreditsの領域なので入れていない。

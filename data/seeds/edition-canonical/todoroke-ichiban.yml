source: 'ギャラ型是正 2026-08-17(20-29年帯): 通常版/文庫タブで後年の復刻が初出runの巻枠を占有し日付が逆行していた。種2が持つimprintどおりに版を分離し、完備最古のrunを主版に戻した。版元はISBN出版者記号から解決し、ISBNを持たないrunは本セッションでNDL確認済みのレーベル対応にある社だけ明示、他は不明。 ★ISBN補充1巻 2026-08-24(partial-isbn-gap半自動: 帯/楽天題/巻番号/未使用の4検証) / ★2026-08-29 上下分冊の番号是正: 上下2冊本が「1巻と3巻」として焼かれており2巻が欠番に見えていた(MADB系統の 上=1/中=2/下=3 固定割当を2026-08-17の一括処理がそのまま取り込んだもの)。揃っている分冊だけを 1..N に振り直した(片側欠落=真の取りこぼしは触っていない)。'

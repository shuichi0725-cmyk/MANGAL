source: 'ギャラ型是正 2026-08-17(worksheetのA_SPLIT_WORK?判定だが実体はB型): 初出のジャンプコミックス(集英社 1974-1977)の1-3巻枠を 2020年のMy first wide と2026年のリイド社 SPコミックス SP pocket wide が占有し、2巻2026-03-23→4巻1974の52年逆行になっていた。初出run(MADBが持つv1-v16。13巻は両ソースに無く欠番のまま)を主版に戻し、Bamboo comics(竹書房 2014 3冊。MADBは全部v1だったので発売日順に1-3へ採番)と SP pocket wide(リイド社 2026 全3巻)はextra_editionsへ。文庫タブは集英社漫画文庫(1979 全5巻)と集英社文庫コミック版(1995-96 全12巻)が1本に混ざっていたので suppress_types で版ごとに作り直した。デラックスタブ(ジャンプ・コミックスデラックス 全12巻 1983-85)は混在なしのため温存。★My first big / My first big special / My first wide はコンビニ本のため掲載対象外。★注意: SP pocket wide は2026年に刊行中の版なので、続巻が出たらこのseedに追記しないと頁に出ない(canonicalは巻を固定する)。'

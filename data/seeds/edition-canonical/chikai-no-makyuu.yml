source: 'ギャラ型B是正 2026-08-17: 通常版タブが1995年ちばてつや全集(ホーム社 全5巻)に1-5巻を占められ、初出の講談社版(1961-63)は6-10巻の残骸だけになっていた(頁の出版社もホーム社表示)。文庫タブも2003年講談社漫画文庫(全4巻)と1977年ちばてつや漫画文庫(全7巻)が1本に混ざっていた。NDL SRU(creator=ちばてつや)で確定= ①講談社 昭和36-1963 全10巻(v1 1961.5「怪投手出現の巻」/v3 1961.08.20/v4 1962.01.20/v10 1963.05 がMADBと一致)=完備最古 ②虫コミックス 虫プロ商事 1971 ③講談社コミックス 1971.8 ④SUNDAY COMICS 秋田書店 全7巻 1973-74 ⑤ちばてつや全集 ホーム社 全5巻 1995.1-4 ⑥ちばてつや漫画文庫 講談社 全7巻 1977 ⑦講談社漫画文庫 全4巻 2003。①を主版に、他はextra_editionsへ。★①のレーベル名は両ソースとも記載が無いため imprint は付けない(推測しない)。虫コミックスはMADBが同じ巻を2 edition・4重複で持っていたので巻ごとに1件へ寄せ、日付が無い1-4巻は空のままにした。'

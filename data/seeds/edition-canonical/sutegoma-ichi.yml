source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 壊れラベル是正: 2026-08-17の一括処理が、種2でimprintが空だったrunにtype名(standard)をそのまま貼って『standard版』という実在しないタブ名を作っていた。NDL by-ISBNの叢書名(dcndl:seriesTitle)→楽天seriesName→出版社名 の順で実名に戻した。どれも取れないrunは『別版』とし、巻・ISBN・発売日には一切触れていない。 / ★2026-08-29 壊れラベル是正の続き: 『standard版』の run は**別々の2冊が1版に混ざっていた**。1巻(9784061013292)は楽天books で「捨て駒いち（1）」seriesName=KCスペシャル・講談社・1987-06-06 → 既存KCスペシャル(2巻1987-07-06)へ統合。7巻(9784088610177)は NDL by-ISBN で「捨て駒いち : 港警察署特捜要員 7」集英社 → 主版(ヤングジャンプ・コミックス、1/2/3/4/6/8を保有)の欠番7に該当するため主版へ移した。発売日は楽天にもNDLにも無いので null のまま(推測で入れない)。'

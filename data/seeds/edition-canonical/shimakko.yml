source: 'ギャラ型是正 2026-08-17(一括): 頁の版タブに複数の版(run)が畳み込まれて発売日が逆行していた。種2(MADB)が edition として持っている版の区切りをそのまま使って版タブに戻し、巻数が最も多く最も古い run を主版に据えた。版元はISBN出版者記号(本番から学習した記号表)とNDLで確認済みのレーベル対応から解決し、どちらでも引けない run は「不明」と明示している。巻番号がMADB側で潰れている run は発売日→ISBN順に採番し直した。情報は追加していない。 / ★2026-08-29 上下分冊の『上』を補完(ローカル楽天キャッシュ・live照会なし)。下巻だけが在って上巻が欠けていた版に、同じ出版社・同じ叢書名・隣接ISBNの上巻を追加した。 ★同一叢書が「母と娘でみる漫画名作選」(中・下)と「母と娘でみる漫画名作館」(上)の2タブに割れていた。楽天books で 9784876480234「島っ子 上」/…241「中」/…258「下」がいずれも草の根出版会・seriesName=母と娘でみる漫画名作館・1987-08 と確認できたので1タブの上中下(1-3)へ統合。'

source: 'ギャラ型B是正 2026-08-17: 通常版タブに1955年鈴木出版の初出単行本・1966-67年コダマダイヤモンドコミックス(MADB側で3通りの表記ゆらぎに分裂)・1977年手塚治虫漫画全集・1992年小学館叢書・2011年小学館クリエイティブ限定版BOXが混線し56年の逆行。NDL SRU(creator=手塚治虫)で確定= ①鈴木出版 前編 1955.02 / 第3集 1956.10(第2集は両ソース不在=欠番) ②手塚治虫漫画全集 講談社 全2巻 1977.7/1977.9.20 ③小学館叢書 手塚治虫初期傑作集6 1992.11(ISBN 4091972160) ④小学館クリエイティブ 限定版BOX 2011.10(第1部デイモンの嵐編/第2部鳥人の反乱編/付録が**同一ISBN 9784778031893**=BOX1点) ⑤角川文庫 1994.11 ⑥手塚治虫文庫全集 2010.4。★主版は「完備最古」の規則に従い②(全2巻そろい)とした。①は巻構成が前編/第3集で不完備、コダマ版はMADBがv1を1966-10-30と1967-02-10、v2を1967-02-10と1967-10-30の二重に持ち初版/重版の判別が両ソースからできないため、各巻の最古日付だけを採ってタブ化した(1967-02-10のv1と1967-10-30のv2は重版とみなす。デスハンターv1と同じ扱い)。虫コミックス・手塚治虫漫画選集のレコードはMADB側がv0(巻番号不明)で元から非表示。'

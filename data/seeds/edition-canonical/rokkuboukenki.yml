source: 'ja.wikipedia「ロック冒険記」の単行本節(2026-09-06 ユーザ提示)で版構成が確定したため再構築。
  ★この記事にISBNは無いが、**版ごとの「全何巻」**が書かれており、ISBN以前(1955-1971)の版しか無い本作では
  それが唯一の全巻数の根拠になる:
  鈴木出版 全3巻 / 手塚治虫漫画選集(鈴木出版) 全1巻 / ダイヤモンドコミックス(コダマプレス) 全2巻 /
  虫コミックス(虫プロ商事) 全1巻 / 手塚治虫漫画全集(講談社) 全2巻 / 小学館叢書 全1巻 /
  角川文庫 全1巻 / 手塚治虫文庫全集 全1巻 / 限定版BOX 全1巻。
  これで判ったこと= ①通常版タブを1977年の講談社全集が占めていたが、初出は鈴木出版(1955-1956)。
  ②鈴木出版は全3巻で、当方は1巻(前編1955-02)と3巻(第3集1956-10)しか持っていない=**2巻は真の欠落**
  (NDLに「巻表示なし・1956.10.15・鈴木出版」の記録があるが第3集と同月で中編と断定できないため入れない)。
  ③コダマプレス版は全2巻が正しく、種2にある3つ目のレーベル表記(コダマダイヤモンドコミクス 2巻 1967-10-30)は
  重複記録=出さないのが正。 ④種2にあるのに頁へ出ていなかった虫コミックス(1971)は実在の版なので版タブへ復活。'

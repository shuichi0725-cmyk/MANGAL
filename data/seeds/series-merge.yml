- main: シャングリラフロンティア
  aliases: []
  merge_sids: [77559, 141297, 141298, 141299]
  merge_edition_types: true
  note: |
    表記揺れ + 著者振り分け 差異で 種2 内 4 sid に分散登録:
      - sid=77559  : 中黒違い 「シャングリラ・フロンティア」 sub=クソゲーハンター...
      - sid=141297 : subtitle なし 「シャングリラフロンティア」 (= 著者=不二涼介)
      - sid=141298 : subtitle あり (= 著者=硬梨菜 原作)
      - sid=141299 : 末尾 . 揺れ sub=クソゲーハンター...とす.
    実態 = 1-26 巻 同一作品 (= 20 巻 は MADB 取込もれ、 種4 で補完済 ISBN 9784065377437)。
    硬梨菜 (原作) / 不二涼介 (漫画) の 2 著者で MADB が 巻ごと creator 振り分け 差異。
    23 / 26 巻 = brand 「KC magazine deluxe」 で 種2 build script が shinsoban に
    振り分けたが、 実態は 連続通常巻 = merge_edition_types: true で standard と
    shinsoban を 同 bucket 集計。
    cluster 統合により audit 偽陽性 解消。 ユーザ判断 = 2026-05-25。

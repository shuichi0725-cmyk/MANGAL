# 改題 chain による series 統合定義。
# 種2 sqlite は不変、 audit script + 本番 yml 生成時に lookup する mapping のみ。
# 自動生成元: scripts/_gen-series-merge.py (= kaitai-chain-strong.csv 由来)
#
# 形式:
#   - main: 統合先 (= 検索性/知名度高い親 title)
#     aliases: 統合元 子 title 配列 (= title 単位 merge、 改題 chain 主用途)
#     merge_sids: [int,...] (= optional) ★ 種2 series.id 直接指定で merge
#                          (= 表記揺れ救済、 個別判断ケース、 同名異作リスク回避)
#     merge_edition_types: bool (= optional) ★ True で audit 集計時 edition.type
#                          区別を 解除 (= 装丁切り替えで standard → shinsoban に
#                          移行した 連続巻 を 1 bucket 集計、 例: シャングリラ
#                          フロンティア 23/26 巻 「KC magazine deluxe」)
#     note: |
#       根拠 / 確認内容
#

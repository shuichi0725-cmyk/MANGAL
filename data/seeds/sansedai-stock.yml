  comment: 野球マンガなのに頭脳戦がエグい。一球ごとに駆け引きが回って、気づいたら朝。週末イッキ読み完全に沼る一作です。
- persona: ミナト(10-20代)
  gen: 0
  slug: orient
  title: オリエント
  comment: 侍×妖怪のバトルが王道ジャンプ系で熱い。少年たちの友情がベタに沼れるやつ、テンション上がりたい時に読むの推す
- persona: ミナト(10-20代)
  gen: 0
  slug: oshi-no-ko
  title: 推しの子
  comment: 芸能界の裏側の生々しさにゾクッとくる。ミステリー要素の引きが強くて、続き気になりすぎて沼る
- persona: ミナト(10-20代)
  gen: 0
  slug: ou-sama-rankingu
  title: 王様ランキング
  comment: 見た目で油断したら沼。ボッジ応援したくて止まらん、週末イッキ読み確定の王道ファンタジー。ガチで泣ける🥹
- persona: ミナト(10-20代)
  gen: 0
  slug: ping-pong
  title: ピンポン
  comment: 画がクセ強だけど読むと一発で沼。卓球通して描く青春がエモすぎて言葉失う。短いから週末でちょうど読み切れる。
- persona: ミナト(10-20代)
  gen: 0
  slug: ragna-crimson
  title: ラグナクリムゾン

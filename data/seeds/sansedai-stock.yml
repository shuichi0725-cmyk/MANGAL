  comment: アクションのコマ運びが映画みたいで爽快。ギャグのテンポも軽くて、サクサク読めて沼に落ちる
- persona: ミナト(10-20代)
  gen: 0
  slug: sakamoto-desu
  title: 坂本ですが?
  comment: 何やってもスタイリッシュすぎる坂本くんが反則。1ページごとに笑える完成度で、テンション爆上げのギャグ枠です。
- persona: ミナト(10-20代)
  gen: 0
  slug: satsuriku-no-tenshi
  title: 殺戮の天使
  comment: 二人の異様な関係性に引き込まれてヤバい。緊張感MAXで一気読み不可避、深夜に読むとマジ眠れんやつ
- persona: ミナト(10-20代)
  gen: 0
  slug: seihantai-na-kimi-to-boku

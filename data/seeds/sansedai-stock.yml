entries:
- persona: ミナト(10-20代)
  gen: 0
  slug: akane-banashi
  title: あかね噺
  comment: 落語で成り上がる話、地味そうで激アツ。一席のセリフ回しで魅せてくるの新感覚、週末に静かに沼った一作
- persona: ミナト(10-20代)
  gen: 0
  slug: black-lagoon
  title: BLACK LAGOON
  comment: 銃と漢気のテンション最高。セリフ全部かっけぇし、雰囲気が大人で背伸びして読んだら一気にハマった一作。
- persona: ミナト(10-20代)
  gen: 0
  slug: blue-giant
  title: BLUE GIANT
  comment: ジャズ知らんでも刺さる。音が紙から聞こえてくる熱量、夢を追う主人公にガチで燃やされる
- persona: ミナト(10-20代)
  gen: 0
  slug: blue-rokku
  title: ブルーロック
  comment: サッカーなのにエゴむき出しのバトル感。自分も負けたくなくなる熱量で、読んだ夜は寝れなくなるやつ ⚽
- persona: ミナト(10-20代)
  gen: 0
  slug: bocchi-za-rock
  title: ぼっち・ざ・ろっく!
  comment: 陰キャの解像度が高すぎて刺さる。バンドに青春賭ける感じが熱くて、読んだら絶対ギター触りたくなる。
- persona: ミナト(10-20代)
  gen: 0
  slug: chainsaw-man
  title: チェンソーマン
  comment: とにかく予測不能でテンポがガチ。コマの勢いに脳がバグる。週末イッキ読みしたら確実に沼る一作 🔥
- persona: ミナト(10-20代)
  gen: 0
  slug: choujin-x
  title: 超人X
  comment: トーキョーグールの石田スイ最新作、コマと能力デザインがいちいちオシャレすぎて毎話スクショ案件。今推せる連載
- persona: ミナト(10-20代)
  gen: 0
  slug: dandadan
  title: ダンダダン
  comment: オカルトとSFを全部乗せした勢いがヤバい。作画のキレ味で毎話テンション爆上げ、今いちばん推せる連載
- persona: ミナト(10-20代)
  gen: 0
  slug: gin-no-saji
  title: 銀の匙
  comment: 農業高校×青春ってだけで沼。荒川弘のキャラ全員愛おしくて、笑ってじんわり来る神バランス
- persona: ミナト(10-20代)
  gen: 0
  slug: gokurakugai
  title: 極楽街
  comment: 今のジャンプ系で一番作画がエモい。キャラのビジュ良すぎて、雰囲気だけでも沼れる新世代アクション
- persona: ミナト(10-20代)
  gen: 0
  slug: hikaru-ga-shinda-natsu
  title: 光が死んだ夏
  comment: SNSで作画がバズりまくった話題作。じわっと不穏な空気がガチで上手くて、夜中に一気読みして眠れなくなるやつ
- persona: ミナト(10-20代)
  gen: 0
  slug: hikaru-no-go
  title: ヒカルの碁
  comment: 囲碁知らなくても全然いける、てか刺さる。ライバル戦のヒリつきがガチ。少年漫画の青春全部ここに詰まってる。
- persona: ミナト(10-20代)
  gen: 0
  slug: jujutsu-kaisen
  title: 呪術廻戦
  comment: 術式バトルの理屈が燃える。キャラの掛け合いもエモくて、気づいたら全巻買ってる。クラスでも話題ガチ勢多い
- persona: ミナト(10-20代)
  gen: 0
  slug: konjiki-no-gash
  title: 金色のガッシュ!!
  comment: これガチで泣ける王道。バディもの好きなら絶対沼る。週末イッキ読みしたら止まらんくて朝になってた、マジ名作。
- persona: ミナト(10-20代)
  gen: 0
  slug: look-back
  title: ルックバック
  comment: 短いのに刺さりすぎてしばらく動けない。創作する全人類に効くやつ。週末の夜に一気で読んでほしい
- persona: ミナト(10-20代)
  gen: 0
  slug: medalist
  title: メダリスト
  comment: フィギュアに全部賭ける師弟の熱量がエグい。夢追う系で今いちばん推せる。1話読んだら最新刊まで一気だわ。
- persona: ミナト(10-20代)
  gen: 0
  slug: mobu-psycho-100
  title: モブサイコ100
  comment: ONE先生の勢いが詰まった一作。バトルもギャグも全部アツいのに、最後に効いてくるのが青春なの強すぎ
- persona: ミナト(10-20代)
  gen: 0
  slug: munouna-nana
  title: 無能なナナ
  comment: 頭脳戦×能力者バトルで先読めない緊張感。1巻の引きでガッツリ持ってかれる、止まらん系サスペンス
- persona: ミナト(10-20代)
  gen: 0
  slug: my-home-hero
  title: マイホームヒーロー
  comment: 普通の親父がここまで頭フル回転するのヤバい。1話ごとの緊張感えぐくて、夜更かし確定の沼系サスペンス。
- persona: ミナト(10-20代)
  gen: 0
  slug: oshi-no-ko
  title: 推しの子
  comment: 芸能界の裏側の生々しさにゾクッとくる。ミステリー要素の引きが強くて、続き気になりすぎて沼る
- persona: ミナト(10-20代)
  gen: 0
  slug: ping-pong
  title: ピンポン
  comment: 画がクセ強だけど読むと一発で沼。卓球通して描く青春がエモすぎて言葉失う。短いから週末でちょうど読み切れる。
- persona: ミナト(10-20代)
  gen: 0
  slug: ragna-crimson
  title: ラグナクリムゾン
  comment: 作画ガチで覚醒する系。竜と人の総力戦、見開きの圧がエグくて週末イッキ読み余裕で沼る一作 🔥
- persona: ミナト(10-20代)
  gen: 0
  slug: ruri-dragon
  title: ルリドラゴン
  comment: ゆる〜い空気感が最高に沼。難しいこと考えず読めるのに普通に泣けるバランス、休日のお供にマジで最適
- persona: ミナト(10-20代)
  gen: 0
  slug: saiki-kusuo-no-nan
  title: 斉木楠雄のΨ難
  comment: テンポ最強のギャグ。一話で完結してくれるからスキマ時間に無限に読める、笑い止まらん系
- persona: ミナト(10-20代)
  gen: 0
  slug: sakamoto-days
  title: SAKAMOTO DAYS
  comment: アクションのコマ運びが映画みたいで爽快。ギャグのテンポも軽くて、サクサク読めて沼に落ちる
- persona: ミナト(10-20代)
  gen: 0
  slug: seihantai-na-kimi-to-boku
  title: 正反対な君と僕
  comment: 青春恋愛の空気がリアルで尊い。性格真逆コンビの距離感がエモすぎて、ニヤニヤしながら全巻いける。
- persona: ミナト(10-20代)
  gen: 0
  slug: seishun-butayarou-wa-banii-girl-senpai-no-yume-o-minai
  title: 青春ブタ野郎はバニーガール先輩の夢を見ない
  comment: 会話のキレ味がマジ最高、思春期×ちょいSFの空気感に沼る。先輩との掛け合いがエモくて何回も読み返してる。
- persona: ミナト(10-20代)
  gen: 0
  slug: sentai-daishikkaku
  title: 戦隊大失格
  comment: 戦隊モノの裏側っていう発想がガチで天才。テンポ良くてバトルも頭脳戦も両取り、止まらん勢いで読める。
- persona: ミナト(10-20代)
  gen: 0
  slug: shangurira-furonteia
  title: シャングリラ・フロンティア
  comment: ゲーム廃人の主人公がクソゲー卒業して神ゲー攻略するやつ。ボス戦のアツさガチで沼る、週末イッキ読み余裕です
- persona: ミナト(10-20代)
  gen: 0
  slug: summer-time-render
  title: サマータイムレンダ
  comment: 夏の島に帰ってきたら何かおかしい…っての伏線がエグい。一周だけじゃ足りなくて二周目で鳥肌、構成ガチ勢必読
- persona: ミナト(10-20代)
  gen: 0
  slug: takopii-no-genzai
  title: タコピーの原罪
  comment: ジャンプ+で全人類が一晩で沼った伝説のやつ。短いのにガチで心抉られる、週末に一気でいけるから絶対読んで欲しい
- persona: ミナト(10-20代)
  gen: 0
  slug: the-jojolands
  title: The JOJOLands
  comment: ジョジョ最新部、舞台がハワイでオシャレ。今からリアタイで追える幸運、スタンドバトルの頭脳戦は相変わらず最高
- persona: ミナト(10-20代)
  gen: 0
  slug: toshokan-no-daimajutsushi
  title: 図書館の大魔術師
  comment: とにかく絵が美しすぎて画面で殴ってくる。ファンタジー好きなら絶対推す、世界観に浸れるやつ
- persona: ミナト(10-20代)
  gen: 0
  slug: tougen-anki
  title: 桃源暗鬼
  comment: 鬼の血を継ぐ主人公のバトルもの。勢いとビジュ全振りで、ジャンプ系アクション好きならまず読んどけって感じ
- persona: ミナト(10-20代)
  gen: 0
  slug: uchuu-kyoudai
  title: 宇宙兄弟
  comment: 兄弟で宇宙目指すやつ。テンション上がる回も泣ける回もあって、推せる大人キャラ多すぎる
- persona: ミナト(10-20代)
  gen: 0
  slug: undead-unluck
  title: アンデッドアンラック
  comment: 能力バトル好きならガチで刺さる。設定がどんどん広がってく感じが脳汁出るし、テンションの上げ方が天才なんよ
- persona: ミナト(10-20代)
  gen: 0
  slug: wind-breaker
  title: WIND BREAKER
  comment: ケンカ最強の主人公が街を守る系。熱くて泥くさくて、でもキャラがみんな推せる。アニメから入った勢にも刺さるはず
- persona: ミナト(10-20代)
  gen: 0
  slug: witch-watch
  title: ウィッチウォッチ
  comment: ギャグのキレと作画の上手さがバグってる。笑える回もエモい回もあって、休み時間に語りたくなるやつ。
- persona: ミナト(10-20代)
  gen: 0
  slug: world-trigger
  title: ワールドトリガー
  comment: 頭脳戦の密度がガチでえぐい。チーム戦が将棋みたいで、週末イッキ読みすると気づいたら朝。完全に沼。
- persona: ミナト(10-20代)
  gen: 0
  slug: yomi-no-tsugai
  title: 黄泉のツガイ
  comment: 鋼の作者の新作とか期待しかないやん。バトルとテンポが気持ちよくて毎話アツい。今いちばん追ってる作品の一つ。
- persona: ミナト(10-20代)
  gen: 0
  slug: yozakura-san-no-daisakusen
  title: 夜桜さんちの大作戦
  comment: スパイ一家のドタバタ&アクション。テンポ良くて笑えて、たまにちゃんと熱い。サクサク読めるの最高に推せる
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: air-gear
  title: エア・ギア
  comment: 大暮維人のスピード線と人体のひねりが異常に色っぽい。デザイン過剰なのに破綻しない構図センス。動きを描く快楽の塊。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: akira
  title: AKIRA
  comment: 線の密度がもう異常。コンクリの質感も瓦礫の崩れ方も全部手で描き起こしてる。背景が一番うるさく喋る漫画。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: akutaaju
  title: アクタージュ
  comment: 表情の振れ幅と演技を線で描く挑戦が見事。瞳と顔の歪みで「演じる」を可視化する作画の野心に惹かれる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: berserk
  title: ベルセルク
  comment: ペン先の執念がこわい。鎧の質感も影の密度も狂気じみていて、1ページを構図として何時間でも眺めていられる。線の彫刻。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: blue-giant
  title: BLUE GIANT
  comment: 音を絵で鳴らすってこういうこと。サックスの見開き、墨の飛沫が完全に咆哮になってる。コマ割りの呼吸が音楽。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: blue-period
  title: ブルーピリオド
  comment: 美大を志した身として刺さりすぎる。デッサンや色彩の苦しさを線で語る、絵を描く人間の生理がそのまま漫画になってる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: chrome-kidoutai
  title: 攻殻機動隊
  comment: 士郎正宗の情報量に溺れる。メカの陰影、書き込みの精度、画面が思考そのもの。線で未来を設計した人の凄み。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: dead-dead-demon-s-dededededestruction
  title: デッドデッドデーモンズデデデデデストラクション
  comment: 日常の背景を写真みたいに描き込んで、空にだけ非日常を置く対比が効いてる。線の精度が異様に高い。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: dorohedoro
  title: ドロヘドロ
  comment: 汚れと質感のテクスチャが密度の暴力。マスクや街の意匠が全部デザイン的に立っていて、画面の情報量に溺れる快感がある。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: gunnm
  title: 銃夢
  comment: 金属とパーツの描き込みが工芸的。メカと肉体の境目を線で攻めてて、デザインの執念に唸らされる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: gyo
  title: ギョ
  comment: 伊藤潤二の描き込みの執念。気持ち悪さは作画密度から生まれると教えてくれる。線一本の不快感がもう才能。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: hikaru-no-go
  title: ヒカルの碁
  comment: 小畑健の端正な線と人物デザイン。静の対局を画面で躍動させる構図とコマ運びが本当に上手い。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: hirayasumi
  title: ひらやすみ
  comment: 余白の使い方が上手すぎる。何でもない日常の光と影をすくう線が柔らかくて、コマの間の静けさまで描けてる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: houseki-no-kuni
  title: 宝石の国
  comment: 透明と反射をモノクロで成立させる線の透き通り方が異常。CGと手描きの境界を構図で操る、デザインの解像度が段違い。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: innocent
  title: イノサン
  comment: 白の余白の使い方が完璧。装飾と人体の描き込みが版画みたいで、ページをめくる手が止まる耽美の到達点。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: innocent-rouge
  title: イノサンRouge
  comment: 坂本眞一の描き込みは執念の域。衣装と肌の質感、見開きの設計が美術書レベル。線一本に費やす時間を想像すると震える。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: jigokusei-remina
  title: 地・獄・星レミナ
  comment: 伊藤潤二の線は美しいから怖い。緻密なハッチングと不穏な構図、整いすぎた画面が生む居心地の悪さが芸術。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: kakukaku-shikajika
  title: かくかくしかじか
  comment: 描くことそのものを描いた作品。デッサンに向き合う絵描きの執念がページから滲む。美大生の私には刺さりすぎて痛い。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: kasane
  title: 累
  comment: 松浦だるまの顔の描き分けが主題そのもの。光と陰影で美醜を語る画面設計が見事で、コマごとに視線誘導が計算されてる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: kaze-no-tani-no-naushika
  title: 風の谷のナウシカ
  comment: 宮崎駿の描線の密度が異常。蟲も大地も全部生きていて、コマの隅々まで描き手の手が走っているのがわかる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: kowloon-generic-romance
  title: 九龍ジェネリックロマンス
  comment: 眉月じゅんの背景と空気の描写が主役級。湿度と光の温度まで線で表現してて、ノスタルジーが画面から滲み出てくる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: look-back
  title: ルックバック
  comment: 机に向かう背中、ペンを走らせる手。描くという行為そのものを線の勢いで描き切る。作画のテンポが感情に直結する。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: medalist
  title: メダリスト
  comment: 氷上の身体の流れを線で掴む巧さに見惚れる。表情の機微と動きの繊細さ、構図の呼吸が美しい。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: mugen-no-juunin
  title: 無限の住人
  comment: 墨の擦れと筆致がそのまま殺気になってる。刃の重さを線の太さで描き分ける感覚、完全に画家の手。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: mushishi
  title: 蟲師
  comment: 余白と線がここまで湿度を持つ漫画は稀。淡い墨のような陰影と虫の造形が、見る側の呼吸まで静かにする。画面の沈黙が美しい。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: nijigahara-holograph
  title: 虹ヶ原ホログラフ
  comment: 浅野いにおの線が一番冷たく研ぎ澄まされてた頃。光と影の置き方が建築みたいで、構図の余白が痛い。画面そのものが体温を持ってる。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: ping-pong
  title: ピンポン
  comment: 歪んだ線が躍動を生む奇跡。整った絵が正解じゃないって、このコマ割りと余白が証明してる。鳥肌もの。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: planetes
  title: プラネテス
  comment: 無重力の構図設計が緻密で、人物の手や視線で「重さの無い空間」を描き切る線が好き。地味に見えて画力の塊。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: ran-to-haiiro-no-sekai
  title: 乱と灰色の世界
  comment: 入江亜季の線は工芸品。衣装と背景の描き込み、画面構成のセンスが一枚絵として成立してる眼福。
- persona: リコ(10-20代・美大生)
  gen: 0
  slug: shidonia-no-kishi
  title: シドニアの騎士
  comment: 閉塞した艦内の硬質な質感がたまらない。冷たい線で描く巨大構造物の重さ、画面の暗さの設計が完璧。
- persona: リコ(10-20代・美大生)
  gen: 0

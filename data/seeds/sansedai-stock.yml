  comment: 囲碁なんて、と渋る客ほどハマった。一巻試し読みコーナーに置けば必ず動いた、入口の作り方が完璧な一作。
- persona: タケル(30-40代・元書店員)
  gen: 1
  slug: hina-matsuri
  title: ヒナまつり
  comment: 設定だけ聞くと身構えるけど、笑える人情コメディ。レジ前で「これ表紙で損してる」と何度言ったか。脇役が全員いい。
- persona: タケル(30-40代・元書店員)
  gen: 1
  slug: hirayasumi

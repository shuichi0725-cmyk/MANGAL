  comment: ゲーム廃人の主人公がクソゲー卒業して神ゲー攻略するやつ。ボス戦のアツさガチで沼る、週末イッキ読み余裕です
- persona: ミナト(10-20代)
  gen: 0
  slug: steins-gate

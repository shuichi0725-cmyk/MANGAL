entries:
- persona: ミナト(10-20代)
  gen: 0
  slug: 100-man-no-inochi-no-ue-ni-ore-wa-tatte-iru
  title: 100万の命の上に俺は立っている
  comment: デスゲーム系でこの主人公の性格クセ強くて逆にハマる。命の重み描き方がシビアで、続き気になりすぎる。
- persona: ミナト(10-20代)
  gen: 0
  slug: akane-banashi
  title: あかね噺
  comment: 落語で成り上がる話、地味そうで激アツ。一席のセリフ回しで魅せてくるの新感覚、週末に静かに沼った一作
- persona: ミナト(10-20代)
  gen: 0
  slug: baby-steps
  title: ベイビーステップ
  comment: 努力の積み上げがリアルすぎて自分も頑張れる系。地味に見えて続きがガチで気になるスポーツ沼、コツコツ勢に推したい
- persona: ミナト(10-20代)
  gen: 0
  slug: black-lagoon
  title: BLACK LAGOON
  comment: 銃と漢気のテンション最高。セリフ全部かっけぇし、雰囲気が大人で背伸びして読んだら一気にハマった一作。
- persona: ミナト(10-20代)
  gen: 0
  slug: blue-giant
  title: BLUE GIANT
  comment: ジャズ知らんでも刺さる。音が紙から聞こえてくる熱量、夢を追う主人公にガチで燃やされる
- persona: ミナト(10-20代)
  gen: 0
  slug: blue-lock-episode-nagi
  title: ブルーロック-EPISODE 凪-
  comment: 凪の視点で観るブルロが新鮮すぎて推せる。覚醒していく感じがアツくて、サッカー興味なくても刺さるやつ。
- persona: ミナト(10-20代)
  gen: 0
  slug: blue-rokku
  title: ブルーロック
  comment: サッカーなのにエゴむき出しのバトル感。自分も負けたくなくなる熱量で、読んだ夜は寝れなくなるやつ ⚽
- persona: ミナト(10-20代)
  gen: 0
  slug: bocchi-za-rock
  title: ぼっち・ざ・ろっく!
  comment: 陰キャの解像度が高すぎて刺さる。バンドに青春賭ける感じが熱くて、読んだら絶対ギター触りたくなる。
- persona: ミナト(10-20代)
  gen: 0
  slug: chainsaw-man
  title: チェンソーマン
  comment: とにかく予測不能でテンポがガチ。コマの勢いに脳がバグる。週末イッキ読みしたら確実に沼る一作 🔥
- persona: ミナト(10-20代)
  gen: 0
  slug: chi-chikyuu-no-undou-ni-tsuite
  title: チ。-地球の運動について-
  comment: 命かけて真理を追う話、マジで鳥肌。歴史モノ苦手でも余裕で刺さる、一巻読んだら止まらん神作です。
- persona: ミナト(10-20代)
  gen: 0
  slug: choujin-x
  title: 超人X
  comment: トーキョーグールの石田スイ最新作、コマと能力デザインがいちいちオシャレすぎて毎話スクショ案件。今推せる連載
- persona: ミナト(10-20代)
  gen: 0
  slug: cross-game
  title: クロスゲーム
  comment: 野球×青春のじんわり感が反則。派手さ控えめなのに気づいたら全巻イッキ。エモさで殴ってくるタイプ推せる
- persona: ミナト(10-20代)
  gen: 0
  slug: dandadan
  title: ダンダダン
  comment: オカルトとSFを全部乗せした勢いがヤバい。作画のキレ味で毎話テンション爆上げ、今いちばん推せる連載
- persona: ミナト(10-20代)
  gen: 0
  slug: dark-gathering
  title: ダークギャザリング
  comment: ガチで怖いのにバトル展開アツすぎ。霊を狩るって発想が新しくて週末イッキ読み余裕。ホラー苦手でも沼る作画力よ
- persona: ミナト(10-20代)
  gen: 0
  slug: dead-mount-death-play
  title: デッドマウント・デスプレイ
  comment: 成田良悟原作の現代×異世界バトル、テンポがガチで気持ちいい。設定の噛み合いがエグくて週末に一気読み余裕で沼る作品！
- persona: ミナト(10-20代)
  gen: 0
  slug: deatte-5-byou-de-battle
  title: 出会って5秒でバトル
  comment: 能力バトル好きならマジ刺さる。頭脳戦のひりつき感ヤバくて、5秒で読み始めて気づいたら全巻いってるやつ。
- persona: ミナト(10-20代)
  gen: 0
  slug: drcl
  title: '#DRCL'
  comment: 作画が映画レベルでバグってる。吸血鬼ものをこんな美しくやれるの坂本眞一だけ、ページめくる手が止まらん。
- persona: ミナト(10-20代)
  gen: 0
  slug: fool-night
  title: フールナイト
  comment: SFの設定がめちゃ尖ってて引き込まれる。重い空気感と画力で一気に沼る、今推したい連載のひとつです。
- persona: ミナト(10-20代)
  gen: 0
  slug: gannibal
  title: ガンニバル
  comment: 村に来た駐在さんの違和感がガチで沼。1話読んだら止まれないやつ、週末イッキ読み案件。空気の重さで首絞められる感覚を推す
- persona: ミナト(10-20代)
  gen: 0
  slug: gigant
  title: ギガント
  comment: 奥浩哉のスケール感がガチで規格外。日常からどんどん巻き込まれてく勢いが止まらん、ページめくる手が完全に沼。
- persona: ミナト(10-20代)
  gen: 0
  slug: gin-no-saji
  title: 銀の匙
  comment: 農業高校×青春ってだけで沼。荒川弘のキャラ全員愛おしくて、笑ってじんわり来る神バランス
- persona: ミナト(10-20代)
  gen: 0
  slug: gokurakugai
  title: 極楽街
  comment: 今のジャンプ系で一番作画がエモい。キャラのビジュ良すぎて、雰囲気だけでも沼れる新世代アクション
- persona: ミナト(10-20代)
  gen: 0
  slug: hataraku-saibou
  title: はたらく細胞
  comment: 体の中をガチのバトル漫画にした天才発想。勉強になるのに普通に熱くて笑える、誰に薦めても外さないやつ
- persona: ミナト(10-20代)
  gen: 0
  slug: heart-gear
  title: HEART GEAR
  comment: 終末×ロボ少女の世界観がエモすぎる。絵の迫力ガチで映えるし、ローナ可愛くて旅を最後まで見届けたくなる。
- persona: ミナト(10-20代)
  gen: 0
  slug: hi-score-girl
  title: ハイスコアガール
  comment: ゲーセン青春×不器用ラブコメが刺さりすぎる。レトロゲーわからん世代でもキャラの距離感にガチで沼った
- persona: ミナト(10-20代)
  gen: 0
  slug: hikaru-ga-shinda-natsu
  title: 光が死んだ夏
  comment: SNSで作画がバズりまくった話題作。じわっと不穏な空気がガチで上手くて、夜中に一気読みして眠れなくなるやつ
- persona: ミナト(10-20代)
  gen: 0
  slug: hikaru-no-go
  title: ヒカルの碁
  comment: 囲碁知らなくても全然いける、てか刺さる。ライバル戦のヒリつきがガチ。少年漫画の青春全部ここに詰まってる。
- persona: ミナト(10-20代)
  gen: 0
  slug: hyouka
  title: 氷菓
  comment: 省エネ主人公が日常の謎を解いてくとこがクセになる。派手じゃないのにめっちゃ続き気になる、青春ミステリの沼
- persona: ミナト(10-20代)
  gen: 0
  slug: jujutsu-kaisen
  title: 呪術廻戦
  comment: 術式バトルの理屈が燃える。キャラの掛け合いもエモくて、気づいたら全巻買ってる。クラスでも話題ガチ勢多い
- persona: ミナト(10-20代)
  gen: 0
  slug: kabushiki-kaisha-majirumie
  title: 株式会社マジルミエ
  comment: 魔法少女を「お仕事」にした発想が最高に今っぽい。バトルもアツいのに社会人モノとしても刺さる、二度おいしい作品
- persona: ミナト(10-20代)
  gen: 0
  slug: kanata-no-astra
  title: 彼方のアストラ
  comment: 宇宙サバイバルSFなのに伏線の張り方がガチで巧い。一気読み前提の構成、週末にイッキ読みしてくれ！
- persona: ミナト(10-20代)
  gen: 0
  slug: kekkai-sensen
  title: 血界戦線
  comment: 異能バトルの見せ方がいちいちオシャレで脳がバグる。一話完結でサクッと推せるテンポ感が最高にエモい
- persona: ミナト(10-20代)
  gen: 0
  slug: kengan-omega
  title: ケンガンオメガ
  comment: 格闘がとにかく派手で見開きの破壊力ヤバい。バトル好きなら絶対テンション上がる、週末に一気推し案件です。
- persona: ミナト(10-20代)
  gen: 0
  slug: kishibe-rohan-wa-ugokanai
  title: 岸辺露伴は動かない
  comment: ジョジョ好きなら絶対刺さる短編集。一話完結のキレ味がガチで、露伴先生のクズかっこよさに沼る。
- persona: ミナト(10-20代)
  gen: 0
  slug: konjiki-no-gash
  title: 金色のガッシュ!!
  comment: これガチで泣ける王道。バディもの好きなら絶対沼る。週末イッキ読みしたら止まらんくて朝になってた、マジ名作。
- persona: ミナト(10-20代)
  gen: 0
  slug: kono-subarashii-sekai-ni-shukufuku-o
  title: この素晴らしい世界に祝福を!
  comment: ダメパーティで笑い倒す異世界コメディの王。テンション高いギャグが刺さりまくり、疲れた夜に最強の癒し。
- persona: ミナト(10-20代)
  gen: 0
  slug: kuutei-dragons
  title: 空挺ドラゴンズ
  comment: 龍を狩って喰うって設定だけで優勝。飯描写がガチで旨そうで、空飛ぶ冒険ロマンに静かに沼る一作。
- persona: ミナト(10-20代)
  gen: 0
  slug: kyokou-suiri
  title: 虚構推理
  comment: 妖怪×頭脳戦のロジックバトルが沼すぎ。ヒロインの口の回り方が最高で、推理モノ好きならガチで推せる。
- persona: ミナト(10-20代)
  gen: 0
  slug: look-back
  title: ルックバック
  comment: 短いのに刺さりすぎてしばらく動けない。創作する全人類に効くやつ。週末の夜に一気で読んでほしい
- persona: ミナト(10-20代)
  gen: 0
  slug: medalist
  title: メダリスト
  comment: フィギュアに全部賭ける師弟の熱量がエグい。夢追う系で今いちばん推せる。1話読んだら最新刊まで一気だわ。
- persona: ミナト(10-20代)
  gen: 0
  slug: mobu-psycho-100
  title: モブサイコ100
  comment: ONE先生の勢いが詰まった一作。バトルもギャグも全部アツいのに、最後に効いてくるのが青春なの強すぎ
- persona: ミナト(10-20代)
  gen: 0
  slug: mokushiroku-no-yonkishi
  title: 黙示録の四騎士
  comment: 七つの大罪の流れを継ぐ正統王道ファンタジー。バトルもキャラも安定して熱くて、週末ガッツリ浸れる。
- persona: ミナト(10-20代)
  gen: 0
  slug: munouna-nana
  title: 無能なナナ
  comment: 頭脳戦×能力者バトルで先読めない緊張感。1巻の引きでガッツリ持ってかれる、止まらん系サスペンス
- persona: ミナト(10-20代)
  gen: 0
  slug: my-home-hero
  title: マイホームヒーロー
  comment: 普通の親父がここまで頭フル回転するのヤバい。1話ごとの緊張感えぐくて、夜更かし確定の沼系サスペンス。
- persona: ミナト(10-20代)
  gen: 0
  slug: nigejouzu-no-wakagimi
  title: 逃げ上手の若君
  comment: 逃げて勝つって発想がガチで新しい!松井優征の頭脳戦×アクションがキレッキレで、週末イッキ読み余裕の沼作品。
- persona: ミナト(10-20代)
  gen: 0
  slug: one-outs

rakuten_caption: '3,000人からなる「幻夢の盗賊団」を率いる大盗賊、

  人呼んで盗賊王ルーク・ディ＝バルドが釈放されることになった。


  とはいえ、「伝説の盗賊王」なんて男をただただ世に放つ、なんてことはなく。

  ルークの力の源泉たる『ジョブ』を剥奪したうえで、

  部下3,000人の保釈金を冒険者として稼ぐことが課されたのだ。


  全てを奪われたルークは、部下のために涼やかに奮闘する！'

rakuten_caption: 'ある日、文芸部にあった椅子を他の部活に貸し出してしまい、椅子が一つだけになってしまった。

  翔と柚子の二人はその残された椅子を譲り合って軽い言い争いをする。

  自分よりも相手を座らせたい。お互いに優しさから一歩も譲らない平行線が続き、結果として柚子の意見が通って翔が一人で椅子に座ることになってしまった。

  自分だけ座るなんて申し訳ないと思う翔だったが、そこである閃きをする。


  「椅子に座った俺が椅子になって、柚子先輩を俺の膝に座らせれば良いんじゃないか？」


  ……と。'

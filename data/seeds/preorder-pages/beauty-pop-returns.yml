rakuten_caption: "大人気！美容師×青春グラフィティ再始動！ \n\n 美容師×青春グラフィティ\n『ビューティーポップ』の新たな物語が今はじまるーーー！！\n\
  累計発行部数195万部突破の大人気作、待望の続編！！\n大人になり鳴海彰伍と結婚した綺里。新婚生活をおくる2人のもとにS・P（シザーズ・プロジェクト)のメンバーの落合計彦と南啓が遊びにくる。\n\
  相変わらずの2人をみて、鳴海と結婚した理由が気になった啓は、綺里に理由をたずねる。\n\n時はさかのぼり、鳴海と落合が大学3年生の春。\n落合は鳴海にS・Pを再開させようともちかけて…。\
  \ \n\n 【編集担当からのおすすめ情報】 \n 衝撃の最終話から18年。「ビューティーポップ」待望の続編です！\nなぜ、綺里は鳴海と結婚したのか。\n最終回でL.A.に旅立ってしまった綺里と離れ離れになってしまったS・P（シザーズ・プロジェクト)のメンバーたちはあの後どうなったのか。\n\
  \n綺里のマイペース＆クールさも健在！ちょっぴり大人になった綺里たちが繰り広げる青春ストーリーにわくわくすること間違いなし！\nドキドキのカット対決も…！？\n\
  \nS・Pのメンバーをはじめ、前作のキャラもたくさん出てくるのでお楽しみに！\n気になるお話は「ビューティーポップ Returns」第1巻、ぜひお手に取ってみてください！"

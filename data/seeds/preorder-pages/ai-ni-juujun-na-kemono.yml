rakuten_caption: '欲しいモノ全部あげるーーだから、俺に騙されて。


  最悪な元カレとの別れ話をこじらせていたところ、再会したのは謎多き美青年・カイム。

  傷ついてボロボロの侑李に会うため、はるばるアメリカからやってきたという。

  どこか影のある空気をまとう彼は、昔一度会ったきりの文通相手であった侑李に何故か異常な執着を見せる。

  「これからは俺が侑李を幸せにしたい。俺じゃだめ？」

  一途すぎる告白を前に抗えず侑李は甘い夜と熱に溺れていくのだが、実はカイムの正体はマフィアの幹部で…

  冷たい夜に出会った、危険で一途な男に愛されすぎるインモラル・ラブロマンス。'

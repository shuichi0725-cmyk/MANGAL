rakuten_caption: クラス全員が異世界に召喚され、同級生が勇者・聖女など華々しい職業を得る中、陰キャの陽一が授かったのは、誰もが失笑するアホみたいな職業・エロ賢者だった。無能だと決めつけられ追放されるが、その職業にはとんでもない秘密が隠されていた！それは、女性との仲が深まるほどレベルアップするというもの。クラスメイトのメンヘラ魔法使いと“初めて”を経験し、能力が覚醒。ショートカット巨乳美女、さらに獣人姉妹との“お手合わせ”で瞬く間に最強に!?
  美女たちと未開の領地で幸せ家族計画♪追放陰キャが"愛と絆"で成り上がる！

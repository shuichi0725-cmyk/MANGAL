rakuten_caption: "悪に生きた忍者の、叛逆が始まるーーー。 \n\n 孤児を集めて残忍な忍へと育て上げ、数々の村を焼いてきた“悪忍の頭領”-その男の名は、服部幻蔵(はっとり\
  \ げんぞう)。\n妖魔王に仕えて四天王として君臨する彼は、ある任務の失敗をきっかけに、衝撃の真実を知ってしまい…！！\n己に課せられた残酷な運命と、過去の後悔に向き合い、男は決意の炎を心に宿すー\n\
  真実を見抜く“目”を手にした悪忍の、反逆の忍者活劇…第一巻！"

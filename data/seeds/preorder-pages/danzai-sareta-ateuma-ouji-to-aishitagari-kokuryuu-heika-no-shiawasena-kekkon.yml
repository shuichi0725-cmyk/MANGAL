rakuten_caption: '聖女を虐げたという無実の罪で、兄である第一王子に断罪されたイル。

  ニヴァーナ国の第二王子でありながら、妾腹ゆえに「ナイナイ王子」と蔑まれてきた彼に、ある日突然、龍人国の王・タイランから政略結婚の申し出が届く。

  野蛮と恐れられる龍人、しかも男同士の結婚ーー戸惑いと不安の中でイルは結婚式当日を迎える。

  けれど出会ったタイランは、誰よりも優しく、イルに甘く愛を囁いてきてーー?


  これは、ひとりぼっちだった王子が真実の愛を知るまでの物語。'

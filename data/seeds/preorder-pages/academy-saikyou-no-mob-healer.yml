rakuten_caption: 名作恋愛アクションRPG『ダンジョン・アカデミア』。死にゲーとして名高いその世界に、最弱職【ヒーラー】のモブとして転生した俺・アレン。このままでは即死亡ルート確定ーーだが、前世で極め尽くしたゲーム知識が運命を覆す。回復魔法を武器に変え世界最強へと駆け上がる異世界逆転成長ファンタジー。

rakuten_caption: 'しばらく普通の同僚に戻りたい


  長谷川直幸、37才。

  常識と良識を兼ね備え、上司からも部下からも慕われる中間管理職。

  年下の恋人（部下）に時に悩まされ、時に愛し愛される日々を送っている。


  片桐 聡、30才。

  顔よし、頭よし、性格よし。

  男女問わず、社内憧れの王子様ーー

  だが、その実体は貞操観念が緩く、社会性に欠けたクズ。


  なんだかんだと順調なふたり。

  ところが、平穏なサラリーマン生活に不穏な気配が忍び寄り!?

  GAPSマニア、待望の新作登場！'

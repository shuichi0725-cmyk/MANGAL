rakuten_caption: '広告代理店に勤める白石乙葉。

  社内での人間関係は良好でも、同僚の鳴瀬仁とだけは犬猿の仲。

  何かと絡んでくる鳴瀬を嫌いな奴!!!と思っていた。

  ある日、彼氏の浮気現場に遭遇した乙葉。

  修羅場を救ってくれたのは、まさかの鳴瀬…！

  「コイツは俺がもらう」と乙葉を引き寄せ、堂々と宣言!?

  その場しのぎかと思いきや、

  なぜかそのまま“偽カレ”をやってもらうことに…！

  会社では憎まれ口ばかりなのに、

  ふたりきりだと甘く迫ってきてーー。


  不仲なふたりの

  じれキュン♡オフィスラブ、スタート！'

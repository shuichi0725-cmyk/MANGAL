rakuten_caption: 46歳、中卒、スポットバイトでマイペースに働く田村。家に帰れば、綺麗な奥さんとイケメンの息子、モフモフのワンコが待っている。派手ではないが充実した生活を送る田村だが、彼には超凄腕の殺し屋というもう一つの顔があった。息子の成人を機に、殺し屋から足を洗う決意をした田村に、組織のボスはとあるハードな条件を与えるーー。最強の殺し屋パパ、最後の大仕事。

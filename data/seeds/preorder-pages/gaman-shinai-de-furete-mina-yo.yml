rakuten_caption: 高校時代に出会った姉の彼氏の髪色に憧れ、同じプラチナブロンドに染めた瑛太(えいた)。夢だった美容師として働いていたある日、その元カレ・達哉(たつや)が来店!!　
  ほんの数分言葉を交わしたことがあるだけなのに、なぜか再会を喜んでくる…。距離感に戸惑いながら、誘われるまま二人で食事に行った帰り道、女性不信気味であることを告白!!　すると、「男が好きなんじゃない？」とキスされて!?

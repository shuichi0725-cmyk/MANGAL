rakuten_caption: '勇者一行から「テイマーのお前は必要ない」と理不尽に追放されたアレス。

  仲間の魔物たちとともに辿り着いたのは、辺境に広がるうっそうとした未開の森だった。だが、魔物たちと協力することで、その地は次第に快適な空間へと変わっていく。さらに新たな仲間として獣人も加わり、生活はますます充実。

  落ちこぼれと蔑まれたテイマーは、仲間たちと共に優雅なスローライフを始めるーー！'

rakuten_caption: '藤原カムイが描く最後のドラゴンクエストが始まる

  エスタード島に住む漁師の息子・アルスは、謎の石版を見つけた事から、過去と現在を行き来する不思議な冒険をする事にーー。幼馴染のマリベル、天真爛漫な少年・ガボとともに旅をする中で、アルス達は邪悪な存在と対峙するようになり……藤原カムイが『ドラゴンクエスト7』の世界を描いた『ドラゴンクエスト　エデンの戦士たち』から20年。その正統続編がついに始まるーー。'

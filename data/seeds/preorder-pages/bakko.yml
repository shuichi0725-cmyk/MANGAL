rakuten_caption: 'わたしはただ穏やかに暮らしたいだけなのに!!冴えない陰キャが妖キャを斬る！オカルティック剣戟バトル、開幕!!

  特技なし、コミュ力なし、友達なし……自他ともに認める“陰キャ”である神野伐子はある日、突然現れた大天狗の鞍馬から自身が妖怪たちを統べる魔王の後継者に指名されたと告げられる。魔王の後継者に人間である伐子が指名されたことへ当然反発する妖怪たちは伐子の命を狙いに陽の当たらない地底深くの魔界から人間界へ続々とやってくるが……？わたしはただ穏やかに暮らしたいだけなのに!!冴えない陰キャが妖キャを斬る！オカルティック剣戟バトル、開幕!!'

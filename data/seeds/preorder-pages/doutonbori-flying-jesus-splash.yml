rakuten_caption: '大阪での新生活がスタートし、大和との仲も順調。

  木下家のみんなとも関係は良好で充実した日々を送る北斗、

  ……だったはずが木下家が住処を失ってしまう事態に!!!!?

  いい距離感でお付き合いを続けていた北斗と大和だが、

  木下家分裂の危機にふたりの間にも微妙なズレが生じて…？


  “恋人”だけど“家族”じゃない。

  大和が一家を支える大黒柱だからこそ、ふたりだけでは

  解決できない問題にふたりの在り方にも変化が必要でーー。


  一方、男運のないちんぽこ脳やんちゃボーイ・黒田と

  カタブツインテリ眼鏡・片上、絶対合わなさそうなふたりの

  ちぐはぐわちゃわちゃな恋も動き出す!?

  カテゴリ違いの恋が詰まったシリーズ最新刊★



  元ヤン大黒柱×ほんわかしっかりインテリくん

  カテゴリ違いも遠恋も乗り越えいちゃらぶ満喫中に問題勃発!?'

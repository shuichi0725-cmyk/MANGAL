rakuten_caption: 二丁目を飲み歩いていた私は酔っ払った挙句、トラックに轢かれ命を散らした……はずだったが、目が覚めると美しき公爵令嬢に転生していた！　名前はマリー・エリザベート・ローズ・アントワネット……って、長いわ！　しかも役割は悪役令嬢ですって？　冗談じゃないわよ！　そんなことよりこの美貌を活かして、好みのゴリマッチョな恋人作りでしょ！　…と、緩すぎる世界にツッコミを入れつつ知識チートで無双するエリザベートは本人の望みとは裏腹にスラリとしたイケメン王子に溺愛されーーオネエ様の二度目の人生は超痛快！

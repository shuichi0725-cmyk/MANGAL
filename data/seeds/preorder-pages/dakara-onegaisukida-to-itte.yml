rakuten_caption: '海外を拠点にするモデルの宮司璃旺は、仕事を兼ねた一時帰国で実家に帰るはずが、姪がインフルになり宿無しに。

  急遽、空港まで迎えにきてくれた元恋人で人気俳優の敷嶋 嵐の部屋に泊まることになり、酔った勢いでセックスしてしまう。

  6年前、海外留学を理由に別れを切り出した璃旺。

  引き止めることもなく、あっさりと別れを受け入れた嵐。

  自分だけが引きずっているのが悔しくてこの6年間“ただの友人”という関係を続けてきた璃旺だったが、昔のように自分を求めてくる嵐の真意がわからなくて…？



  【収録作品】

  ・だからお願い好きだと言って 1〜5

  ・描き下ろし'

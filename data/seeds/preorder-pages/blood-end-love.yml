rakuten_caption: '念願のファッションデザイナーになり人生の絶頂をむかえたウィリアム。

  祝賀会で泥酔し目覚めた深夜、目の前には見覚えのない死体があった。

  パニックになるウィリアムのもとに、赤い瞳をした絶世の美青年が現れる。

  彼は吸血鬼を名乗り、「犯人を突き止めることに協力すれば、罪を代わりに被ってやる」と言い放ち…？

  悪夢の底に射した赤い光は、怪物の罠かーー？

  異端の吸血鬼×殺人犯に仕立てられた青年のミステリー・ブロマンス!!'

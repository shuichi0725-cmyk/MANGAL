rakuten_caption: 男ウケ抜群のあざとい女子・左藤ユナ。真面目で気遣い上手なギャル・左藤エマ。同じバイト先、同じ苗字、同じ家庭環境、それ以外は全く合わないふたりは、ユナの母親の再婚をきっかけにルームシェアすることに。価値観の相違から衝突もするけど、だからこそ理解したいと歩み寄れる──。特別な関係のオンナノコたちが紡ぐ可愛さ溢れる新世代シスターフッド、第1巻!!

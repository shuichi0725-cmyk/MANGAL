rakuten_caption: '夜逃げ寸前から大逆転！ラベンダーで村を幸せにーー没落令嬢の領地改革物語


  「今晩、夜逃げするぞ！」


  父の言葉にヴィオレット・グランベールは愕然とする。

  ここは自分が読んだ小説の世界ーーしかも“主人公の姉”という序盤で命を落とす脇役に転生してしまった。

  夜逃げをしたら待つのは破滅。

  前世でも貧しさから命を落としたヴィオレットは運命に立ち向かうと決意する。

  奮闘の末、残されたのは寂れた領地と銀貨一枚。

  前世知識で名産品を生み出し、領地を豊かに変えていく!?


  没落令嬢のワクワク領地改革が始まる！'

rakuten_caption: 'このお話の舞台は、セルビアの首都・ベオグラード。

  20XX年、超人的な能力を持つ人々「能力者」たちが密かに暮らしている。

  彼らは平穏な日々を送っていたが、ある日セルビアの巨大企業・ゴールデンドーンが「能力者狩り」を始めてしまう。


  建設途中で放棄された地下鉄、ベオグラード・メトロには多くの能力者たちが集っていた。

  そこに入り浸るごく普通の少年・シズキは、相棒のデジャンとともに、能力者たちを守るためーーひいてはメトロを守るために立ち上がる！


  日本語タイトル：ベオグラードメトロの子供たち

  英語タイトル：CHILDREN OF BELGRADE METRO

  キリル文字タイトル：Деца београдског метроа'

rakuten_caption: '私たちはきっと

  きっとずっと前から約束してきたんだね

  家族になろうねってー


  SNSで大きな反響を呼んだ実録エッセイマンガ「青い目の子」「ぐーのこと」の再編エピソードに加え、「心肺蘇生について」など緊急時の対応や「先住猫さんと新入り猫さんのあわせ方」など、猫を保護する際のお役立ちコラムも専門家監修のもと多数収録！


  どんなに愛してもいつか来る別れの日…

  それでもまた巡り会えば

  全力で愛したいって思うんだよね


  クスッと笑えて、あなたのそばにいる猫がより愛おしくなる一冊。'

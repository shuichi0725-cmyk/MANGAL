rakuten_caption: "陰キャ男子＆イケメン店長！ \n\n 隠キャで自意識過剰な藍沢くん。\n\nバイト先のカフェの同僚・理沙に\n密かに憧れているものの、\n\
  気持ちをなかなか表には出せない日々。\n\nそんな彼に、カフェの店長・璃恩は\n藍沢くんの気持ちガン無視の\nトンデモムーブをかまして…!?\n\n『翼くんはあかぬけたいのに』の小花オトが\n\
  ド根性こめて描き出す、デコボコ・バディ・コメディー！ \n\n 【編集担当からのおすすめ情報】 \n 惜しまれつつ完結した『翼くんはあかぬけたいのに』。その作者・小花オト氏が満を持して放つ、男子二人のヘッポココメディーです！\
  \ 主な登場人物は、『翼くん』でも異彩を放っていたりおぴこと白鐘璃恩と、こちらも同作にモブ一歩手前くらいの立ち位置で描かれていた藍沢くんの二人。もちろん、まったく新しい物語なので、ここから読んでもまったく問題なし！\
  \ 絶対に親友になりたいりおぴと、絶対になりたくない藍沢くんの、ちょっとどうかしている日々…ぜひご一読ください！"

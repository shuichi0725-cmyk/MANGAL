  \ \nSNSを中心に人気を博した「ギャップのある女子2人が付き合うまでの話。」「初夜チャレンジTAKE1」「初飲みデートの2人」などのエピソードに加え、新規描き下ろし「初夜チャレンジTAKE2」「馴れ初め話番外編・奈々緒視点」を収録！"

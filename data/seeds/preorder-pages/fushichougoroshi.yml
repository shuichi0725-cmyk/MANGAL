rakuten_caption: 東京で保険外交員をしていた宮本飛鳥は、祖父・繁に地元に呼び戻され、実家の神社の様子がおかしい事を知る。家を継いでいた兄・ 聡一は失踪し、怪しい不動産業者が宗教法人格を譲れと言ってくる。祖父の教え子の亜川十三と対抗策を探る中で、失われた奇祭『不死鳥殺し』の存在を知る。飛鳥は寂れていく地元・神社の起爆剤として宮司を継ぎ『不死鳥殺し』を復活させることを宣言する！

  女性初の王立騎士団・団長に任命されたリザ。

  国と信念のために奮起するものの、部下の四騎士はくせ者ばかり。


  中でも【黒炎の獣】と呼ばれるゼロは手に負えない戦闘狂で、まさに狂犬。

  だが、主従の契りによって、強制的に行動を制限することに成功した。

  その様子はまるで飼い犬のようで…ちょっと、かわいい…？


  リザは狂犬ゼロを手懐けて騎士団を統率し、国の未来を守ることができるのか…！？


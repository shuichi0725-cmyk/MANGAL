rakuten_caption: エリナ・モーガン、28歳。10年間連れ添った夫に先立たれてしまった元気いっぱいの未亡人。前妻と離縁した美貌の宰相様とお見合いをすることになったけど、女嫌いで有名なクリストファー・リード様は興味がなさそう……残念！　まあ、仕方ないか！　せっかくだからとお菓子をいっぱい食べて好き勝手に振る舞ったら、なぜか宰相様に気に入られてしまって、情熱の大求婚へーー!?

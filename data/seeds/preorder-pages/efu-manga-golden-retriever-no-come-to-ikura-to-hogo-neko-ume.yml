rakuten_caption: "【大変お待たせいたしました！笑って泣ける！大人気の「エフ漫画」待望の第3弾！】\n\n第1弾の大重版、第2弾への熱い大反響にお応えし、待望の第3弾がついに登場！\n\
  \n犬を飼っている人もそうでない人も一瞬で笑顔になれる優しさに満ちた世界が、さらにパワーアップ。\n亡き「エフ」への変わらぬ愛情と、天真爛漫な「コメ」との賑やかな日々に、今回は新しい仲間たちがやってきます。\n\
  なんと、マイペースで愛らしい保護猫の「ウメ」、さらに新しく家族に迎えられたゴールデンレトリバーの「イクラ」が登場！\n\n犬と猫の種を超えたユニークなやりとりや、ゴールデン多頭飼いならではのドタバタ劇など、これまでにない新しい見どころが盛りだくさんです。\n\
  \n\n【登場犬猫】\n\n●エフ（初代ゴールデンレトリバー） \n「エフ漫画」の原点で永遠の主人公。著者が13歳で見送った特別な存在。\nどの時代も愛嬌たっぷりで何より食いしん坊！　\n\
  犬と暮らす楽しさを教えてくれたユーモラスな看板犬。\n\n●コメ（2代目ゴールデンレトリバー / 8歳・女の子） \n大きくて穏やか、誰にでもフレンドリーな優等生。\n\
  イタズラも盗み食いもしないが、実は気が小さく繊細というギャップが魅力。\nSNSやご近所でも愛される人気者。\n\n●イクラ（3代目ゴールデンレトリバー / 2歳・女の子）\
  \ \nコメが大好きな少し小柄な末っ子。愛想がなく身内以外には尻尾を振らない。\nコメの真似をする健気でコミカルな姿とつぶらな瞳が魅力。\n\n\n●ウメ（保護猫\
  \ / 5歳・女の子） \n犬中心の我が家に新たな風を吹き込んだ、クールでマイペースな白黒ハチワレ猫。\n犬たちの大きな体や騒動にも一切物おじしない堂々とした性格。\n\
  犬たちとユニークなやりとりがほほえましい。"

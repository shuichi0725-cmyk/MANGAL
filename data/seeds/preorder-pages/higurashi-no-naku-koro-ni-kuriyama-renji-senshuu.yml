_note_origin: |
  per-case新規登録 2026-08-08(ユーザ提供のNDLサーチTSV + 楽天)。
  ★一迅社の「◯◯撰集」= **個人作家1名によるひぐらし番外編**(既存頁 higurashi-no-naku-koro-ni-itagaki-hako-senshuu と同型)。

  収録編 = 函満し編(ハコミタシヘン)。
  【出典】NDLサーチTSV(責任表示「栗山廉士 漫画 , 竜騎士07, 07th Expansion」)× 楽天ISBN直引きの2ソース一致。
  題ヨミ・著者ヨミ = 楽天 titleKana(「ヒグラシ ノ ナク コロ ニ クリヤマレンジ センシュウ …」)。
  title_kana は既存の撰集頁と同じ流儀で本題+撰集名まで(編名は含めない)。

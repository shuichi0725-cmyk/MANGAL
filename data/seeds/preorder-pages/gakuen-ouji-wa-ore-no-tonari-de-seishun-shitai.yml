rakuten_caption: '交友遮断モードなメガネ男子 × 青春に飢えた学園王子様の、

  もどかしくも尊い見守り系青春BL！



  「人気者のくせになんで俺なんだ」


  難関大学合格を目指し、勉強に励むと心に決めた駿人。

  だが、女子が息をのむほどのイケメン・実留が入学早々に声をかけてきた。


  「俺と友達になってくれないか？」

  拒む駿人のそばを実留はなぜか離れようとせず、

  “友達っぽいこと”を、全力でまっすぐに求めてくる。


  毎日現れては日常をかき乱す彼に駿人はうんざりするが、

  実留から“空っぽだったこれまで”を明かされ、

  わずかな共感を覚えてしまいーー。


  お楽しみの描き下ろしは12P収録！'

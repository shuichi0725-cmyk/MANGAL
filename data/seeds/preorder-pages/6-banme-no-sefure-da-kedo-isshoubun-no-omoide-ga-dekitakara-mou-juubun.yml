rakuten_caption: 平凡な学生である幸平は、幼馴染の陽太に片想いをしている。地味な幸平と違って、陽太は顔が良く人気なモテ男。5人もセフレがいると噂されるほどの彼に、高校の卒業式の日、意を決して告白した幸平は、なんと6番目のセフレになることができた。それから一年半。大学生になった幸平は陽太と身体だけの関係を続けていた。会えるのはお互いの家だけ、長居はしない、身体を重ねた後に渡される一万円。虚しさに苛まれながらも、セフレを続ける幸平だがーー……

rakuten_caption: '舌を噛んで吸われるキス、やけどしそうな熱い視線……期間限定の恋が幕を開けるーー。

  憧れで激推しの“のん”こと野々宮を追って劇団に入団した新米役者の凪音は、

  次回公演のBL作品で野々宮の恋人役に抜擢！　

  しかし緊張しすぎてお芝居にならない凪音を見かねた野々宮は「本番まで恋人として接する」ことを提案する。

  それからの彼はとびっきり甘くて優しくて……でもキスの練習では【喰われそう】なほど獰猛な色気で迫ってーー。

  番外編も多数収録の一途で健気なファーストラブ！'

rakuten_caption: 'ーー先祖が狸である勘太は、正体を隠して働くサラリーマン。

  そんな勘太が苦手にしているのは、顔も仕事も完璧なのに口が悪い同期・芳野。


  ある日うっかり狸の耳としっぽを知られてしまってから、

  意地悪く距離を詰めてくる芳野に心も身体もかき乱されっぱなし。


  触れられて、嫌なはずなのに抗えない。

  気持ち悪いはずなのに、もっとしてほしいなんてーー


  「その耳触らせてくれるなら黙っててやる」


  ＜しごできイジワル同期×ポンコツタヌキ＞

  秘密をきっかけに変わっていく、ふたりの距離の行方は……？


  描き下ろし漫画5P収録'

rakuten_caption: "新たなD・M物語は歴代主人公を巡る旅！ \n\n 25年続く大人気トレーディングカードゲーム、「デュエル・マスターズ」の漫画最新作！\n\
  不思議なクリーチャーに誘われ主人公ウィン君が放り込まれたのは、\n第一作主人公・切札勝舞のいる世界。\nだが、ウィン君が漫画で読んだ世界とは少しだけクリーチャーの様子がおかしく…\n\
  \n歪んだ運命を取り戻す、25周年を記念するシリーズが堂々の幕開け！\n\n付録カードは、ウィンとザキラが激突する限定イラストの「プライマル・サーガ」のキラカード！"

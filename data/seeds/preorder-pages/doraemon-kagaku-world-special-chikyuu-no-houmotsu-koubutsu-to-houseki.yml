rakuten_caption: "鉱物・宝石のふしぎな世界をのぞいてみよう \n\n みなさんは、石が好きですか？\n\n道ばたの石や海辺の岩、ダイヤモンドやルビーなどの宝石、さらにはスマートフォンや自動車につかわれる金属まで、私たちの身の回りには鉱物でできているものがたくさんあります。\n\
  \nこの本では、鉱物のでき方や見分け方、結晶のふしぎな形、光る石や色が変わる石のひみつ、ダイヤモンドなどの宝石の物語を紹介します。\nまた、鉱物の観察や実験を通じて、その性質や特徴を楽しく学ぶことができます。\n\
  \nさらに、レアアースや金属資源など、私たちのくらしを支える鉱物の役割や、地球環境との関わりについても取り上げています。\n\n鉱物を知ることは、地球を知ること。ドラえもんたちと一緒に、石の中にかくされた地球の歴史やふしぎを発見する旅にでかけましょう。\n\
  \n\n国立科学博物館名誉研究員の宮脇律郎先生による本格的な鉱物・宝石の入門書。\n【巻頭特集】\n鉱物のいろいろなすがた\nクイズ 宝石と鉱物\n\nこの本について\n\
  \n第一章 鉱物と地球について知ろう\n 〈まんが・ハワイがやってくる〉\n -地球の中の宝物、鉱物\n\n第二章 鉱物の見つかる場所と、鉱物の見方を知ろう\n\
  \ 〈まんが・合成鉱山の素〉\n -もっと知りたい！ 鉱物\n 鉱物のでき方\n 鉱物の成分「元素」 元素の周期表\n 鉱物を見分ける手がかり\n\n第三章 おどろきの形、光る石、色が変わる石！\n\
  \ 〈まんが・かわいい石ころのはなし〉\n -色ちがいの鉱物\n おもしろい鉱物\n 巨大な結晶\n \n第四章 金属やレアアースの鉱物を知ろう\n 〈まんが・古道具きょう争〉\n\
  \ -金、銀、銅も鉱物から\n\n第五章 金属だけじゃない、身近な鉱物を知ろう\n 〈まんが・人間磁石〉\n -絵の具、やきもの、ガラスも鉱物から\n\n第六章\
  \ 宝石のひみつを知ろう\n 〈まんが・王かんコレクション〉\n -宝石のひみつー色、かがやき、カット\n 時代をこえるジュエリー\n 宝石のスタイルとシェイプ\n\
  \n第七章 宝石にたくされた物語と言い伝え\n 〈まんが・悪運ダイヤ〉\n -宝石をめぐる物語\n 「たん生石」-12か月の宝石\n 宝石のいろ、いろいろ\n\n\
  第八章 鉱物で実験、観察してみよう \n 〈まんが・ママのダイヤを盗み出せ〉\n -楽しい実験と観察\n\n第九章 地球のつくった宝物、鉱物を大事につかっていこう\n\
  \ 〈まんが・地球製造法〉\n -鉱物と地球の未来\n\nあとがき 「探求の気持ちと科学の目で、たくさんのワクワクに出会おう」\n -国立科学博物館名誉研究員\
  \ 宮脇律郎"

rakuten_caption: '転校生は、「不死王の息子」だったーー


  『薬屋のひとりごと』日向夏の新境地！

  人外×不死身少女×死亡フラグのカニバリズム・コメディ


  「これ、何の肉？」

  ーーーー現代日本、でもけっこう普通に人狼や吸血鬼など人外たちが暮らしている世界。

  中学受験を控えた小学六年生の少女・由紀子のクラスに転校生がやってくる。

  山田不死男と名乗るその少年は、「不死王の息子」だった。ある日、由紀子は同級生を助けるために食人鬼に襲われるが、不死男によって命を救われる。

  しかし、代償として由紀子は人間ではなく人外である不死者になってしまいーー…。

  これは不死身になった女の子と不死王の息子が様々な死亡フラグにぶちあたるお話である。'

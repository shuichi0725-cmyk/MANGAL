rakuten_caption: '不死の男・ジーンは、とある施設に監禁されていた。彼の不死たる所以は“再生”。腕や

  足を切られても再生していく様は、常たる人々にとって貴重な研究対象。日夜繰り返され

  る拷問のような実験を耐えるジーンの精神を支えるのは毎日彼のもとへ訪れ、労わる健気

  な少女・ミリの存在だった。記憶も曖昧な中、自分に尽くしてくれるミリの幸福を、まる

  で父親のように願うジーンのもとへ、いつものように現れたミリがつぶやく「今日でちょ

  うど50年よ」--それは、彼と彼女がこの施設で過ごした時間。……彼女は何者だ？'

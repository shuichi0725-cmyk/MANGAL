rakuten_caption: '悪役転生からの破滅フラグ回避へ！

  →違います！男女比がバグってるんです！


  ある日、青年が目覚めるとーー

  そこは豪華絢爛な屋敷、周囲には美女メイドがてんこ盛り！

  名家の御曹司・羽澄玲人に転生した彼は、

  周囲の態度から悪役に転生したと勘違い。

  破滅フラグを回避するため奔走する。

  しかし彼はまだ知らない。

  この世界が女性に大きく偏った男女比の世界で、

  自分が美女たちにとって超希少な“男”だということをーー！

  勘違いから始まる、貞操逆転ラブコメ開幕！'

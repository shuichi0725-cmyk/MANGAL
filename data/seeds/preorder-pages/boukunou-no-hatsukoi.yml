rakuten_caption: 'もう恋愛なんてしないって

  決めたのに


  同僚に婚約者を奪われ、失意のドン底にいる桜子。

  出勤前に立ち寄った骨董品屋で、幸せを呼ぶ“幸福の本”を手に入れる。

  半信半疑で家に帰ると、本の中から金髪碧眼の全裸イケメンが現れた！

  美しい肢体の彼は、暴君と恐れられる王様ネロ・テオシウス。

  ネロは、魔女の呪いで“真実の愛”を知るまで元の世界に帰れないらしい…!?

  愛を知らない暴君王と、愛を信じられないサレ女が紡ぐ純愛物語。'

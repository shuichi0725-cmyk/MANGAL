rakuten_caption: “英雄の一族”の末娘に生まれたシア・ヴィスコンティは、規格外の才能を持ちながら、過保護な家族のせいで外界を知らずにいた。自らの力を試すため家出を決行したシアは、傷だらけの少女ラナー・シュミッドと出会う。彼女は王家の姫君でありながら、忌子として疎まれ命を狙われていた。シアは彼女の手をとり、ある提案をするーー「私と一緒に家出しませんか？」

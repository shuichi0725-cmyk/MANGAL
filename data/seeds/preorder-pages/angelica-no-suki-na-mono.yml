rakuten_caption: 'ーーわたしは自分が好きなものがわからない。

  魔法研究所で働くアンジェリカは、家族から搾取されていた。連絡は金の無心の時だけ。

  所長側近のヴィクトルは、そんな自分を蔑ろにしているアンジェリカを心配していた。

  ある日、アンジェリカは精霊王復活のための研究のためにヴィクトルの家での同居生活をすることになって！？

  彼の手料理と優しさにアンジェリカの心は溶かされていくけれど……。

  甘くて切なくて、おいしい同居ロマンス'

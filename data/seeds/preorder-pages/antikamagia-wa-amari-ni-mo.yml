rakuten_caption: '超肉体派＆超頭脳派 魔法使いバディが大暴れ!!


  ーーとある王国が今、滅びの危機を迎えていた。


  平和だった王国を突如襲った怪物"武装ペンギン"の大群は農地を荒らし、市街地を破壊し、そして人々を殺戮した。


  この怪物に対し、魔導技術者ギョームが率いる王国軍は電子演算機と液体燃料を用いた高火力の"現代魔法"で応戦するが力及ばず、たった3ヶ月間で国土の99%を失ってしまった。

  絶望の淵に飲まれる王国民たちに、王女ルイスは希望の予言を告げる。


  「今日の正午、1000年前の大魔導士が復活するーー」


  果たして伝説の大魔導士・アルヴィラは蘇り、武装ペンギンに向かって最大の"古代魔法"を放つが……!?


  1000年前の大魔導士＆現代の最強技術者が亡国の危機に立ち向かう！

  ド迫力の超ハイテンションバトルファンタジー、開幕!!!'

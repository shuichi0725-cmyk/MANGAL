rakuten_caption: '「私の”ママ”になってーー。」

  長く続いた戦争で荒廃し、UDLと呼ばれる違法薬物が蔓延した”東国”。その最底辺で暮らす少年・イブキは、行方不明の母親を捜していた。ある日、不思議な少女・ミルフィと出会ったことで、イブキの母親捜しは急展開を迎えるーー。うみハルがおくる、それぞれの”希望”を捜す鮮烈ダーク・ファンタジー!!'

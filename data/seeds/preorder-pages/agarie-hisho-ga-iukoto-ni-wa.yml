rakuten_caption: '高校時代、東江聡二はずっと二番だった。

  一番はいつだって古賀利人。

  顔も頭も性格も完璧な男、

  そして、東江が密かに恋をしていた相手だ。

  劣等感と一緒に恋心も忘れたはずなのに、

  大手ゼネコンで秘書として働く東江の前に

  利人が新たな上司として現れる。

  完璧な男──けれどある夜、催淫剤を盛られ、

  苦しげに熱を孕んだ姿を見てしまい……


  「では、私が介抱させていただきます」


  秘書であることを言い訳に、

  東江はずっと焦がれていた男へ

  自ら体を差し出して──!?'

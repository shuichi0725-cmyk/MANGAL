rakuten_caption: 'たとえ この男に利用されているとしても

  必ず一族の復讐を果たすーー


  謀反の罪で、皇后に村ごと焼き払われた慈一族の生き残り・凜風。

  同胞の無念を晴らすため忍び込んだ皇宮で、第一皇子・昊天に見つかってしまう。

  冷酷無比な暴君と悪名高き彼の前で死を覚悟するも、取り引きを持ちかけられる。

  昊天も皇后を倒そうとしており、その手駒として凜風に妃になれと命じてきた。

  互いの目的を果たすための契約結婚。

  それなのに、昊天に触れられると胸が高鳴り、二人きりの閨は熱を帯びる…。'

rakuten_caption: '異世界女子は、チョロい。


  オスの「陰キャ化」が止まらない異世界・イグドラシル。

  枯渇した”ときめき”を求め、

  女の子たちが人間界にやってきた！？


  平凡な男子学生・朝日は

  「ヒト代表」として、ときめき担当に就任。

  異世界女子って、何をしたらときめくと思う？

  それは…×××すること♪


  ツンデレエルフにむっつりサキュバス、果てはドM天使まで！

  あらゆる種族をときめかせる、

  ちょっぴりおバカなハーレムラブコメ開幕!!

  単行本限定、描きおろし漫画も収録！'

rakuten_caption: 'どこにでもいる平凡な若手サラリーマン、千羽我聞（センバガモン）。

  いつものように仕事をサボってスマホでゲームをしていると、突然異世界の帝国に勇者として召喚されてしまう。

  彼に与えられたスキルは、あらゆる『ガチャ』が引ける謎のスキル『ガチャ・マイスター』。

  しかし、ガチャから出るのは現世で馴染みのあるお菓子ばかり。期待外れの結果で皇帝の怒りを買ってしまった我聞は、身柄を引き受けてくれた侯爵の子息、ティムの護衛として共に亡命の旅に出ることに……

  すべてが運任せのスキルで、我聞は逆境から始まる異世界を生き抜けるのか──!?'

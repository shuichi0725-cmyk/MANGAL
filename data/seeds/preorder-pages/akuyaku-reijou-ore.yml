rakuten_caption: ゲーム世界の悪役令嬢に転生した元サラリーマンは、公爵令嬢アスカとして転生！　いきなりメインヒロイン・リリアをいじめる場面に遭遇してしまい、思いがけず彼女を助け出してしまう。さらには、攻略対象の第一王子・ギルスとは婚約が発表され、ゲームシナリオは予想外の方向に!?　そもそも体は女同士じゃ恋愛できないし、ましてや中身男同士で結婚なんてできないだろ……。育むのは友情か恋愛か？　体は令嬢、中身は男の悪役令嬢はこの世界で自分らしく生きていく!?　小説第1巻も同時発売！

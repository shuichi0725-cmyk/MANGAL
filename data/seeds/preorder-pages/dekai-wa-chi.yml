rakuten_caption: 'SNSで「面白かわいい」「家にいてほしい」と大反響！

  「次にくるマンガ大賞2024」Webマンガ部門で11位を獲得した話題作『でかいはち』の第1巻がついに登場！


  ある日突然現れたのは、体長40センチもある巨大な「はち」。触った感じはまさに「ふとったねこ」で、ふわふわもこもこ。

  カブトムシより弱い、にわとりぐらいは飛べる。はちみつよりもポテチがすき。針が尻に埋没している……

  摩訶不思議な愛らしい生物です。


  本書では、はちと人間の優しくて笑える日常をお届け。

  でかいはちを通じて友情をはぐくむ「オタク高校生」、ひと夏の心温まる思い出「少年と夏休み」、そして寡黙な職人との交流を描く人気の「職人さん編」などを豪華収録！

  描き下ろしマンガも必見です。

  大人しい子からワガママな子まで、個性豊かなはちたちがちょこまかと動く姿に癒やされること間違いなし！'

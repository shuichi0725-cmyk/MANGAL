rakuten_caption: 'フリーターの朝日奈は、特定の恋人を作らず『ヤりたい時にヤる』という、奔放な性生活が気楽だった。

  けれど、実は最近好きな人ができた。

  その相手・月森は勤務先のカフェの後輩で、現セフレだ! 月森には彼女がいるらしいけれど、それでもこの関係をやめられずにいる。

  だって、ベッドの上での月森は、普段のクールな印象からは考えられないくらい、熱くて、エッチで、甘いから。

  だから、この「好き」の気持ちは絶対バレないようにしていたけど......??'

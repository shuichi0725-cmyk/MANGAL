rakuten_caption: '『ブルータル』から数年後を舞台に、壇浩輝が再来…！

  警視庁刑事部捜査第一課長、壇浩輝。輝かしいキャリアを持つエリート中のエリートである彼の裏の顔は、罪深い悪人に私刑を下すシリアルキラーだった。 性犯罪者、悪徳ペットブリーダー、ひき逃げ大学教授…。法で裁けぬ悪人を、趣味の拷問で絶望に陥れ、彼は微笑む。

  悪人を餌食にする悪魔の快楽断罪録、第1巻。'

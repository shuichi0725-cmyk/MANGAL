rakuten_caption: 小さな国の17番目の王子であるサザと、子どもの頃に出会って彼の従者になった朝日。幼くして母を亡くし虚無感を抱えていたサザにとって、大好きな数学を語る朝日はとても眩しく見えて…。出会いから十年、立場は違えど朝日と共に過ごしてきたサザは、彼に家族のような安心感を抱いていた。そんなある日、朝日を巡る衝撃的な場面に遭遇して…!?

rakuten_caption: '貧乏令嬢のカレンは、たった一人の家族である義理の兄、クライドに密かな想いを寄せていた。

  恋心を隠して過ごしていたある日、カレンは突然『精霊姫』の能力を授かる。植物に愛されるその力は、野菜や果物の収穫も自由自在。

  内緒で育てる最高に美味しい家庭菜園は、少しずつカレンの日常を変えていってーー！？　

  「小説家になろう」で人気のほのぼのスローライフラブコメディ、コミカライズ！'

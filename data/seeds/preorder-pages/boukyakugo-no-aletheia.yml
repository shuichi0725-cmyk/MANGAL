rakuten_caption: '第1師団に所属するアレーティアは稀有な「忘却魔法」の持ち主。

  唯一その魔法が効かない師団長・クリストフとの、はっきりしない距離感に居心地の良さを感じていた。

  しかし、忘却魔法を何者かに狙われ、苦渋の決断の末、アレーティアは全世界から「自分の存在」を忘却して…!?

  「次に思い出した時に伝える、約束しようーー」

  “忘却”からはじまるファンタジーロマンス、第1巻！

  2026年12月刊'

rakuten_caption: おしとやかで可愛らしく、誰からも好かれるお姫様。そんな女子高生の相原麻里はある日、友達との帰り道で何者かに包丁で刺されてしまう。目覚めた麻里が目にしたのは、どこか古臭い街並みと異形の化け物たち。巨大な饅頭の怪物に襲われて捕食されかけた麻里を助けたのは、陽気でノリの良い音楽をCDラジカセから爆音で流す、全身真っ黒焦げの男ーーくろぐろだった。
  「おいおい、おじさん傷ついちゃうぜ。なんでそんな怖がるんだよ」 「だ、だって……どうしてそんな、真っ黒なんですか……！　顔も、腕も……！」 「肌の色が違うって言うならお前だってそうだろ？　罰を受けた同じ異形同士、仲良くしようぜ」
  ここは過ちを犯した人間が、その罪によって姿を変えられた上、莫大な刑期を背負わされて死に続ける地獄の三丁目。しかし、麻里には地獄に落ちるほどの罪を犯した記憶はなくーー？
  『貴様ノ刑期ハ、残リ、二十億三千二百年デス』 無自覚のまま地獄に堕ちた少女と、全身焼け焦げた真っ黒な侍。 奇妙な二人が人生の終わりの後に出会いを果たす。 「おいでませ、わくわく地獄町三丁目へ。歓迎するぜ」

rakuten_caption: 地味で華のないアナウンサー・田村の唯一の特技は、「原稿を絶対に噛まない」こと。そんな彼は、魔力ゼロの少年・フィルの身体に異世界転生してしまう。無双もチートもない、また地味な人生が始まる…そう思われた矢先、田村は一冊の“禁書”と出会うーー。そこに記されていたのは、呪文を噛むと命を落とす禁書魔術『詠唱魔法』だったーー！地味な特技を武器に、転生アナウンサーが最強を目指す、命懸けの詠唱魔法ファンタジー第1巻!!

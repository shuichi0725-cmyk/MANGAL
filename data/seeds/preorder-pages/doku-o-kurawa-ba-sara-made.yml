rakuten_caption: 竜の恩恵を受けるパルセミス王国。その国の悪の宰相・アンドリムは、娘が王太子に婚約破棄されたことで前世を思い出す。同時に、ここが前世で流行していた乙女ゲームの世界であること、娘は最後に王太子に処刑される悪役令嬢で、自分は彼女と共に身を滅ぼされる運命にあることに気が付いた。そんなことは許せないと、アンドリムは策略をめぐらせ、王太子側の人間であるゲームの攻略対象達を陥れていく。ついには、ライバルでもあった清廉な騎士団長を自身の魅力で籠絡しーー

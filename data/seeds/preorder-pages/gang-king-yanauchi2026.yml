_note_origin: |
  2026-09-20 ユーザGO。少年画報社YKコミックス版=講談社版(gang-king 2004-2021 全37巻)の
  リブート新シリーズ。楽天caption「伝説的ヤンキー漫画『ギャングキング』が、今、蘇る/
  世界一の彫り師を目指す青年・"和彫りのジミー"」= 主人公が本編と異なり巻番号1から再出発。
  同名衝突のため slug は CLAUDE.md 規則の -姓+年 サフィックス(yanauchi2026)。
  種2に少年画報社版のseriesが未収載(予約段階)のため key2slug+src頁でなく preorder-pages 経路。
  月次でMADBが追いついたら通常の種4/canonical運用へ。
  ★2026-08-08に既存頁 gang-king の種4 vol1 として誤登録されていた分は退役済

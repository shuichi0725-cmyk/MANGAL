rakuten_caption: '魔獣に襲われ薄れゆく意識の中、自分が乙女ゲーム『セブンスリアクト』内のモブキャラ、レイル・ヴァンスタインに転生していたと気が付いた《僕》。

  正規シナリオではここで命を落とすはずだったのに、なぜか生き延びてしまった！

  さらに、人気攻略キャラである影のある幼馴染みの侯爵家嫡男ファルク・サンブールが、超過保護な溺愛甘々キャラに変わってしまった！

  シナリオの流れを狂わせたのでは？ このままではバッドエンドルートでみんな死んでしまうのでは…？

  これ以上レイルの存在がゲーム本来のシナリオを狂わせることがないよう決意したものの──。


  「絶対に俺がレイルを守るって約束する」


  ゲームの舞台シルヴァレンス学園に入学してからもファルクはレイルを甘やかしまくり、本来の主人公セーラとはなぜか友人になり、ほかの攻略対象たちからも変に注目を集めてしまうし……なんでみんなシナリオ通りに動いてくれないの!?


  糖度カンストの大人気異世界転生BLノベル、公式コミカライズ開幕!!

  第1話：幼馴染みが激甘すぎるんですけど！

  第2話：黒歴史を忘れてもらえないんですけど！

  第3話：はじめてのダンジョン探索なんですけど！

  第4話：あの頃の僕じゃないんですけど！

  第5話：部屋で二人きりなんですけど！


  描きおろしマンガ：はじめての制服なんですけど！


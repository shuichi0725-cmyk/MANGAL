rakuten_caption: 男子校に進学してしまい、灰色の高校生活を送ることになったと絶望していた図師だったが、そんな彼の前に天使が降臨した！ …それは保健室の“くらげ先生”…。図師はくらげ先生に会うべく、あの手この手で保健室を訪れるが、いつもオトナの余裕な態度で躱されてばかり…。だが、そんなくらげ先生には生徒たちに知られてはならない“秘密”があり…!?
  ミステリアスなくらげ先生と彼女を取り巻くオバカ男子高校生たちとの、王道学園コメディ開幕!!

rakuten_caption: '幼い頃から母とふたりで生きてきた瑛奈。そんな母が病に倒れ、頼らざるを得なくなったのは極道の組長である実の父親だった。

  憎しみを抱えながらも母を救うため、心を押し殺して極道一家で暮らしてきた瑛奈はある日、憎き父から将来有望な組の男・翔と政略結婚するよう言い渡される…！


  その男はどこか暗い目をしていて瑛奈にも冷たい態度。「ヤクザと結婚なんてありえない」

  「いつか心から愛せる人と出会って家庭を築きたい」心の奥底でそう思ってきた瑛奈だけど、突き放しては、たまに優しさを見せる彼にはどうやら秘密がありそうで、なぜか気になってしまいーー…。


  絶対に近づいてはいけない、危険な男の正体はーー。愛を知らない二人の、不完全で甘いラブストーリー！'

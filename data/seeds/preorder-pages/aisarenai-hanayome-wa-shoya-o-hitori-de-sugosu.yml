rakuten_caption: '「お前を妻とは思わないし、愛することもない」と夫から宣言され、初夜をたった一人で過ごすことになったアルビナ。

  さらに夫はアルビナの妹と浮気関係にあり、彼女を本気で愛していると告げてくる。

  ーー私の心を踏みにじった愚か者たちには相応の罰がふさわしいわ。

  屈辱と絶望のなか復讐を誓ったアルビナは

  夫と妹を地獄へ突き落とすべく、破滅へのシナリオを描き始めて…

  それぞれの想いが交錯する鮮烈で美しい復讐劇の幕が上がるーー！'

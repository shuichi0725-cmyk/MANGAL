rakuten_caption: '★YouTube登録者数180万人超の大人気ゲーム実況グループ「ちろぴの」がついにマンガ化！　お宝さがしにビックリ建築…!?　わちゃわちゃ楽しいハートフル・コメディ！★


  大人気ゲーム実況者「ちろぴの」の2人は、毎日動画の撮影に大いそがし！

  「たまには撮影を忘れて、のんびり2人で遊ぼう！」と、だれも知らないヒミツのワールドにやってきたよ。

  2人で住むお家も完成して、のんびりゆるっとライフ……のはずが、

  不思議な世界でドタバタ大冒険がスタート！？

  迷子に、お宝探しに、ハチャメチャ建築…！？

  2人のわちゃわちゃ楽しい「ゆるっとライフ」のはじまりだよ！



  ※本書は、すべての漢字にふりがながつきます。'

rakuten_caption: '筆頭侯爵家の娘イリアは、王宮のお茶会で前世の記憶を取り戻し、自分が乙女ゲーム「フロイライン」に登場する悪役令嬢であることを思い出す。

  ゲーム内のイリアは王太子の婚約者として登場し、物語の終盤で断罪される運命にあった。

  しかし、悪役令嬢が登場するのは王太子ルートのみ。

  「婚約者にならなければ未来は変えられる」と考えたイリアは、家を出て、王家と関わらない人生を選ぶ。

  ところが、なぜか王太子は強い執着を見せ始めーー!?


  パワフル悪役令嬢の断罪逆転劇、ここに開幕!!'

rakuten_caption: '捨てられた花嫁は、新郎の兄と旅をすることにーー!?


  美しい式場で花嫁のドーンは不安でいっぱいだった。挙式の時刻は過ぎているのに新郎が現れないのだ。大丈夫、今度こそ幸せになれるはず…。ところが新郎の代わりに現れたのは、新郎の兄で富豪一族の長男クーパー。彼はドーンを見すえ冷たく言い放った。「弟はここには来ない。結婚式は取りやめだ」これまで5度も恋人に裏切られてきたけれど…まさか結婚式当日に捨てられるなんて！
  その場から逃げ出し、ある決意を固めたドーンの前にふたたびクーパーが現れて…!?'

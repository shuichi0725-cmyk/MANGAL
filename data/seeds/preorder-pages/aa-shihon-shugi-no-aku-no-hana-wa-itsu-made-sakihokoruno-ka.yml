rakuten_caption: '第5回トーチ漫画賞「榎本俊二賞」受賞作家、

  今井新が現代に問うポリティカル・ゴシック


  榎本俊二 激賞!!

  「神か作者かもしくは詩人か陰謀の黒幕かとにかく誰かの嗄れた声でこう聞こえる。

  『汝、アーカイブするなかれ』と。

  不敵で不穏で不埒で不遜なウルトラダークリテラチュアミソロジー。図書室の暗黒神話。

  俺たちの知的デバガメ精神を刺激しまくる最高のブツがついにようやく現れた。」


  戦前日本、とあるアナキストが記した一冊の詩集。

  発禁、収監、拷問の果てに、言葉は燃やされ灰になった。

  敗戦を経て、彼は転向し、資本主義者となったーー。

  戦前・戦後の継ぎ目に消えた、声なき者たちの詩が聞こえる。

  暗闇会館の地下には、今もすべてが沈んだままだ。


  暗闇会館の図書室で働く司書・田名部咲は、

  新任の記録士・杉沼瞬と共に、

  戦前資料を収めた地下書庫のアーカイブ化を任される。

  ある日の午後、点検のため地下書庫へ下りた咲は、

  突如退路を断たれた先で「謎の声」を聞き、意識を失うーー。


  怪異の謎を追う司書・咲。

  埋蔵金を求める記録士・瞬。

  自分を変えたいバーテンダー・せいら。

  別々の理由で動き出したはずの三人は、

  やがて一冊の詩集へと呼び寄せられていく…'

rakuten_caption: "話題の百合ラップ・コミック、遂に発売！ \n\n 青春は孤独だ。でも、わたしには“言葉”があるから。\n\nネガティブでひっこみ思案、\n\
  思ったことが口に出せない\n主人公・高辻皐月（たかつじさつき）は\nなんとなく噛み合わない毎日を過ごしてきた。\nしかし女子高入学式当日、\n同じく新入生のレンとアンズが披露した\n\
  ラップと出会ったことで、\n高校生活が少しずつ輝き出す。\n\n「ねえ、わたしたち、崖っぷちに立つ誰かを救えるのかな？」\n \n\n 【編集担当からのおすすめ情報】\
  \ \n 『だがしかし』のコトヤマ先生、絶賛！\n\nSNSで話題沸騰の“声に出して読みたい”百合ラップ・コミックが\n遂に単行本発売となりました！\n\n「週刊ビッグコミックスピリッツ」で連載中の異色青春漫画です。\n\
  \n読むとちょっと元気になれる、\n韻を思わず口にしてみたくなる、\nそんなラップバトル漫画です！"

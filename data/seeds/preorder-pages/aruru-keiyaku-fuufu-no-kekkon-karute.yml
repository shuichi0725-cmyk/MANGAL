rakuten_caption: '「いいわ。私、貴方と結婚します。」


  時は大正三年ーー。

  職業女性が生きにくい時代に、織部絢子（おりべあやこ）は看護婦として

  医学の道を極めるため、仕事に没頭する28歳。


  若い時はよかったものの、適齢期になると周りから結婚を急かされ、

  それが過ぎれば「結婚できないから仕事に逃げている」と言われる始末。


  そんなある日、絢子が勤める医院に現れたのは、武骨で野蛮な陸軍の軍医・相良深巳（さがらふかみ）。

  仕事一筋のせいで前妻と別れ、子供もいなかったことで親からの再婚圧力に

  うんざりしていた相良は、絢子が自分と同じ仕事人間であることを知り、

  お互い仕事を続けるための“契約結婚”を持ち掛ける！


  部屋は別々、子作りもなし、家事も不要…と、いわゆる新婚らしさとは無縁の結婚生活がスタート！

  世間に抗う二人の、不器用でじれったい“防波堤婚”の行方はーー！？'

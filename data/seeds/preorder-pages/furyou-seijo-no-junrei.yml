rakuten_caption: "神が救わぬなら、\n私が救うーー。\n\n世界を蝕む瘴気を浄化する唯一の希望ーー“聖女”。\n選ばれし聖女候補が集う学園に通う少女キャロルは、人々を救う日を夢見て厳しい修練を重ねていた。\n\
  \nだが、運命の選定の儀で神が彼女に与えたのは、触れる万物を腐らせ溶かす、悍(おぞ)ましき“腐食の力”。\n\n期待から一転、掌を返し石を投げつける仲間たち。\n\
  \n理不尽に突き落とされた絶望の底で、キャロルは膝を屈さず、煙草を燻らせ不敵に嗤う。\n\n「やっぱり私はお前が嫌いだよ、神様(リュカ)」 \n\n祈りを捨てた“不良聖女”の反逆救世譚、開幕！"

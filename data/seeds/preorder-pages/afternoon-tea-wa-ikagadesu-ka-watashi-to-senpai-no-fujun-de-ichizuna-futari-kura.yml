rakuten_caption: '青澤かなたは大学一年生。

  家族でイギリスに住んでいたが、大学進学を機に、ふたつ年上の先輩・結衣とのルームシェアが始まる。

  美人で面倒見がよく、一見非の打ちどころのない結衣には、女性なら誰とでも寝てしまうというとんでもない一面があった。

  「タイプじゃない」はずのかなたにも、結衣のスキンシップは止まらない。柔らかなハグ、献身的な看病、そして突然のキス!?

  自由な結衣に振り回されながらもかなたはどんどん惹かれていって…

  原作者・桃田ロウ描きおろし小説＆キャラクター原案・塩こうじの描きおろしイラストなど、単行本だけの描きおろしページ15ページ以上収録！


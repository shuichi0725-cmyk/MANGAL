rakuten_caption: "電子ストアで話題の帝国浪漫ファンタジー！ \n\n 「君と結婚するつもりはない」\n\n娶ると幸福を呼ぶとされる「花の乙女」。\n\
  そんな奇跡の力を持つ家系に生まれながら、3度結婚が破談になっているなずな。\n4度目の嫁ぎ先は、\n醜い痣を持つことから“呪われた軍神”と恐れられる、\n冬賀朔人の屋敷だった。\n\
  \nしかし、そこで待っていたのは、冷たい拒絶の言葉でーー!?\n\n幸せを知らない花嫁と、呪いを背負う軍人。\n二人の出会いが運命を変える、帝国浪漫ファンタジー第1巻！"

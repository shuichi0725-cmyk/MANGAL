rakuten_caption: "一途な考古学科大学生×孤独なランプの精。\n時を越えるアラビアン・ロマンス、上下巻同時発売！\n\n幼いころ本で見た砂漠の風景に心惹かれる大学生・駿馬。\n\
  ある日、古いランプを譲り受けた彼の前に、\nなんと美しいランプの精・ラミウが現れた！\n\n「やっと生まれ変わったか。さあーー私を抱け！」\n\nなぜか駿馬を知っているラミウは、\n\
  彼に会うために二千年もの間待ち続けたというが……!?\n前世の約束と今世で芽生える恋、その行方はーー？\n \n\n＜収録作品＞\n二千年夜の朝に 1〜5話"

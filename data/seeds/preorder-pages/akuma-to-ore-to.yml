rakuten_caption: 【関西弁オカンな悪魔とフツーの成人男性の、温かくて愛おしい日常】夢も目標もない、28歳の大ちゃんの人生はパッとしない。他とちょっぴり違うのは、家に悪魔が住み着いてること。悪さをするどころか「プラごみは分けて捨ててや」とか、実家の母親みたいなことばかり言ってくる。何で一緒にいるのかは分からないけど…ふたりの生活は、今日も小さなハッピーであふれている。★web未公開描き下ろし漫画5p収録

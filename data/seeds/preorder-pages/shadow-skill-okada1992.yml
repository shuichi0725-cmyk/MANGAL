_note_origin: |
  per-case新規登録 2026-08-08(ユーザ指示「起こして」)。
  ★本作=SHADOW SKILL 第1期『影技 SHADOW SKILL』(コミックガンマ 1992-01〜1996-05・竹書房)。
  既存頁 shadow-skill は第3期『SHADOW SKILL』(月刊アフタヌーン 2000-2014・講談社 全11巻)で別作品。
  ★角川書店ドラゴンコミックス版 全4巻(1998)は Wikipedia が「竹書房版と同一内容」と明記する再版のため、
  別頁でなく本頁の別版(shinsoban)として収容した(うる星モデル=同一作品の別版は1頁に統合)。
  ★本番に竹書房版4冊・角川版1巻は1件も存在せず、角川版2〜4巻だけが第3期頁に紛れ込んでいた
  (2026-08-08 の shadow-skill per-case是正で edition-canonical により除去済)。
  種2には本作のseriesが無いため種2を通さない自己完結頁として登録。
  【根拠】巻構成・ISBN・発売年月 = Wikipedia書誌節 × 楽天(ISBN直引き)の2ソース完全一致
  (ISBN-10→13変換後も8冊すべて一致)。竹書房版2〜4巻はNDL(ISBN直引き)でも裏取り済。
  発売日の「日」は楽天 salesDate 由来。角川版4冊は楽天が年月までしか持たないため月止まり(日は推測しない)。
  題ヨミ「シャドウスキル」= 楽天題「影技（シャドウ・スキル）」のルビ表記 + 既存第3期頁の確定ヨミ。
  ★NDLは竹書房版をラテン題「Shadow skill」で収録しており日本語ヨミを持たない(ground truth不在)。
  demographic=shounen は掲載誌コミックガンマ(竹書房・中高生男性向け)による。
  【欠落】書影 = 8冊すべて楽天 noimage(絶版・実画像なし)。キャッチ/あらすじ = 楽天itemCaption 全巻空で材料ゼロ。
  掲載誌 = 「コミックガンマ」が data/magazines.yml 未登録のため magazine 未設定(捏造せず空)。

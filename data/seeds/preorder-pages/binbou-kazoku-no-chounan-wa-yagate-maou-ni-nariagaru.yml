rakuten_caption: '【家族のために頑張ってたら魔法の才能が覚醒しました】

  中学を卒業したばかりの一色樹。親はいない。親戚もいない。6人兄妹の長男として家族を養うため、高収入を得られるダンジョン冒険者になることを決意する。

  「金がいるんです、家族のために。命なら賭けます。」

  魔法の素となるマナを自由自在に扱い、魔法を創造する異常な才能。普段の生活では活かされない力がダンジョンで覚醒し、一色は世界の常識を蹂躙していきーー？

  家族のために力を尽くす長男による最強の魔法無双譚開幕！


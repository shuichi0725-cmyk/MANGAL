rakuten_caption: '感情を持ったアンドロイド「エモロイド」が人間社会に溶け込んだ世界で、

  男子高校生の楓はある日の放課後、何者かに突然襲われる。

  横にいた友人・想夜が何かに気づいたように楓の手を引き路地へと逃げ込むが、

  追手に追い込まれるふたり。

  楓をかばった想夜だが、その身体には大きな穴が開いていてーー？'

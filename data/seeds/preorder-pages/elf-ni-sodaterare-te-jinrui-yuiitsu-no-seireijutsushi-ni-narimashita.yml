rakuten_caption: 'エルフの精霊術で無自覚無双！

  エルフに育てられた精霊術師：リュートが大精霊と共に世界を駆け巡る！リュートにとって世界を旅することは最大の夢だった。しかし人間の世界ではエルフは幻の種族とされ、エルフ直伝の精霊術のせいで様々な面倒ごとに巻き込まれる。エルフとの繋がりを求める貴族たちに絡まれ、マイの美貌や大精霊としての器を狙われ……そんな逆境も、リュートはエルフ仕込みの圧倒的な精霊魔法ですべて吹き飛ばしていく。常識知らずの無自覚無双が今、始まる──！'

rakuten_caption: 唐の時代、芙蓉城と呼ばれる都・成都にて。齢二十で難関試験である科挙を突破した李黎明（り・れいめい）は検屍官として赴任する。使命に燃える黎明だが、指導係の隆起（りゅうき）からは邪険にされ、明らかに歓迎されていない様子だった。そんなある日、富豪の商人が不審死を遂げ…！？不審死の謎を解き明かす、中華検屍ミステリー開幕！

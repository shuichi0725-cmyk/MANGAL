rakuten_caption: おいしいカレーで超ド級無双!? リアルな五感を再現するVRMMOゲーム、通称“LEF”。味覚を失ったカレーオタクの東 海斗（あずま
  かいと）は、カレーの味を求めてそのゲームに飛び込んだ。ゲームのオープニングやストーリーは全部スキップ！ ひたすらカレーを作り食べる海斗は、ある日「カレーを作る・食べるだけでレベルアップする」という【称号】を手に入れる。ただカレーを求めているだけなのに、個性的なプレイヤーたちや波乱万丈な事件が海斗のもとに引き寄せられていってーー!?
  圧倒的カレーの痛快グルメ×冒険ファンタジー開宴！

rakuten_caption: '中途半端な適当男の、あまり冒険しない冒険譚


  それなりに強力な能力を授かって異世界に転生したものの、

  おっさんギルドマンのモングレルには大きな野望も立派な志もなかった。

  成り上がりも無双もハーレムも望まないーー彼の夢はただ一つ、平和にだらだらと生きること。

  異世界の日常に溶け込み、ギルドで適当に働き、料理や釣りに勤しんで、時々人の役に立つ。

  これは、中途半端な長さの剣「バスタードソード」を愛用する、中途半端な男の物語。

  第1話 中途半端な剣　001

  第2話 売られた喧嘩　051

  第3話 エビ釣りと外道　085

  第4話 ライフイズシュリンプ　115

  第5話 収穫時期の街道警備　149

  描き下ろし短編 176

  あとがき　179'

  アークと出会う前のアリアンやチヨメの様子が描かれた前日譚。

  異世界転移してきて早々アークが試した“異世界あるある”？

  窮地をアークに救われた人や、成敗された人のその後……など

  骸骨騎士の旅のこぼれ話を紡いだ珠玉の番外編集！

  「これぞファンタジー!！ ふははははー!!」

  笑いあり、涙ありーー本編では描き切れなかったエピソード14編。

  巻末に原作者書き下ろし小説も収録。'

rakuten_caption: '現代の悪女に騙された男は、

  “歴史”を狂わせた悪女と結ばれ

  望まぬ戦火へと身を投じるーー


  頂き女子に大金を貢いだ末、あっさりブロック

  されてしまった残念な漫画家・囮鯨丸。

  失意に暮れる鯨丸だったが、そんな彼の前に

  18世紀フランスを代表する王妃にして

  恐怖政治の引き金となった世紀の悪女、

  マリー・アントワネットが突如として現れる。

  鯨丸は考える間も拒む間もなく、

  歴史上の悪女たちが集う冥界の決闘イベント

  「悪女ランキング」へと引きずり込まれ……。'

rakuten_caption: '地球を爆破するためタイにやってきた宇宙人・シュンは、食堂を営む青年・ダンの料理に感動し、任務を一時中断!?

  「ごはんがおいしい限りは爆破しない」と決めたシュンは、ダンと同居して毎日一緒に食事をすることにーー


  タイBLドラマ『Last Meal Universe』原作小説、『The last meal before the world turns into Galaxy
  expressway』をコミカライズ。


  愛を知らないピュア宇宙人と祖母の味を受け継ぐ食堂店主が織りなす、地球存亡をかけたほっこりSFラブコメディ！'

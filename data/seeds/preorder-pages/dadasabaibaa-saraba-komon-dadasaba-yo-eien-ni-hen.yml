rakuten_caption: "全世界1億DL突破の大人気ゲーム！ \n\n コロコロコミック掲載で大反響を呼んだまんがのコミックスがついに完結。\n今、コロコロで大人気No．1アプリの4コマギャグまんが！\n\
  \n一流サバイバーのコモンと、タイプBドローンのべー太が\n襲いかかってくるゾンビから生き残るために、爆笑サバイバル！\n\n超スタイリッシュな新キャラクター、キングにも大注目！\n\
  \n思わず腹を抱えて笑うこと間違いなし!! \n\n 【編集担当からのおすすめ情報】 \n 今、日本で大人気のアプリゲーム「ダダサバイバー」のコミックス 激動の最終巻!!!\n\
  \n4コマまんがで展開もわかりやすいので\n初めてまんがを読む方にも楽しんでいただけるかと思います。\n\n魅力的なキャラクターたちが織りなす、爆笑ギャグの数々！\n\
  アプリゲームも遊びながら、ぜひご一読ください!"

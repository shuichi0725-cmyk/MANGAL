rakuten_caption: '政財界から芸能界まで、各界の著名人を輩出してきた日本屈指のエリート校ーー長者原学園。

  そこは『資本』至上主義の高校だった。


  入学試験の内容は、『ありとあらゆる手段を使って資産総額を積み上げる』こと。

  そして、合格できるのは『上位3名』のみ。


  入学試験に挑む少女・芹沢在歌は、「金」を嫌う変わり者の少年・獅隈志道に共同戦線を持ちかけられーー？'

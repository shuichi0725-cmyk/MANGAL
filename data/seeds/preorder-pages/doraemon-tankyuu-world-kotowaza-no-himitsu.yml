rakuten_caption: "ことわざの「なぜ？」を解き明かそう！ \n\n 「犬も歩けば棒にあたる」「鬼に金棒」「千里の道も一歩から」……。\nみなさんも、これらのことわざを聞いたことがありますよね。\n\
  \nでも、どうしてことわざには、動物や鬼、数字などが登場するのでしょうか？ \n\nこの本では、おなじみのことわざを中心に、その意味から、短い言葉に込められた昔の人の知恵や工夫まで、楽しく探ります。\n\
  \n「二兎を追う者は一兎をも得ず」は、なぜウサギなの？\n「石の上にも三年」は、どうして「三年」なの？\nうんちやおならまでことわざに登場するのはどうして？\n\
  \nほかにも、思わず声に出したくなるリズムや、日本と世界のことわざの違いなど、さまざまな角度からことわざの面白さを紹介します。\n\n言葉への興味を広げながら、語彙力や表現力を楽しく育む一冊です。\n\
  \nことわざ研究の第一人者・時田昌瑞先生の監修。\n第1章ことわざはおもしろい\n第2章つい声に出したくなるひみつ\n第3章どうして動物がよく出てくる？\n第4章鬼・地獄・妖怪のことわざ\n\
  第5章うんちもおならも、ことわざになる!?\n第6章ことわざにひそむ数字のナゾ\n第7章正反対なのに、どっちも本当？\n第8章びっくり仰天！ 世界のことわざ\n\
  第9章江戸でことわざはみがかれた！\n第10章こんなとき、ことわざを使おう！\n第11章ことわざは変わり続ける！\n第12章今度はきみがことわざを作る番！"

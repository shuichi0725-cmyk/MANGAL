rakuten_caption: "ドスケベ催眠×青春コメディ！？ \n\n 「ドスケベ催眠術」をご存知だろうか。\n\n知らない？\n知りたくもない？\n今その言葉を聞いたことを後悔している？\n\
  \nごもっともな感想だ。\n俺だって、こんなトンチキな言葉とは無縁で生きていたかった。\n\nよりにもよって父親が「ドスケベ催眠術師」じゃなければな。\n\n\
  イカれた家庭環境と縁を切り、苗字まで変えて、\n平穏な生活を手に入れたはずなのに。\n\n二代目ドスケベ催眠術師を名乗る謎の美少女・片桐真友が\n俺のクラスに転校してきやがったーー\n\
  第1話……003\n第2話……045\n第3話……093\n第4話……117\n第5話……139\n第6話……157"

rakuten_caption: '「可愛さ」と「あざとさ」を駆使した処世術で一部から『悪女』と呼ばれる公爵令嬢アリエッタ。実は没落しそうな生家を支えていただけなのだが、突如現れた自称『天真爛漫』の義妹フィオリィにより、アリエッタの「あざとい処世術」の本領が発揮できない日々が続いていた。そんなある日、アリエッタに美貌の王太子リオネルドから縁談が申し込まれる。無欲を装いつつ本心ではリオネルドの婚約者の座を狙っていたフィオリィは、姑息な手でアリエッタの縁談の邪魔をしてくるのだがーー残念。今まで邪魔され続けてきたアリエッタの逆襲が始まる。

  「私が一番可愛くて♡私が一番性格悪いのよ♡」悪女VS悪女の仁義なき戦い、ここに開幕！'

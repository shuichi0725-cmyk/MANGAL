rakuten_caption: '“フラン・アイリッシュ”

  彼はBL漫画で複数のイケメンに

  いやらしいことをされてしまう総受けキャラ”。

  そんなキャラに転生したと気付き、

  皆から忌避される悪役令息・サモンの

  “腰巾着”になることで、

  総受けフラグを折ろうとしたけれど……


  「貴様のためなら盾でもなんでもなってやる」

  「俺なしでは生きられなくなればいい」


  はじめはフランを邪険に扱っていたサモンが、

  だんだん超過保護になってきてーー？'

rakuten_caption: '“霊魔”と呼ばれる魔物が実在する日本に転生した白神界。だが産まれた瞬間、なぜか“最凶の悪霊”を呼び出す儀式の真っ最中だった。母親は呪い殺されかけ、悪霊は界の体を乗っ取ろうと大暴れ。そして、脳内で暴れる最凶悪霊とバトルしていたら、気づけば界自身がとんでもない存在になっていて───!?

  生まれ変わって、最強の“破魔師”を目指せ! 謙虚な少年が覇道を征く無双×和風ファンタジー、ここに開幕!!



  20××年、未曽有の大震災が日本を襲い、白神界は見知らぬ子を庇って命を落とす。ところが、目が覚めたら赤ん坊の頃に転生しており、更には“最凶の悪霊”を呼び出す儀式の真っただ中だった。転生先は“霊魔”と呼ばれる悪霊が実在する日本。赤子のうちから界の身体を乗っ取ろうと暴れる最強悪霊と脳内バトルしているうちに、とんでもない力がついていた──。“霊魔”に対抗し得る存在である“破魔師”の家系に生まれ変わった界は、二度目の人生で最強を目指す!!'

rakuten_caption: "先生、大好き\nド直球DKの猛アプローチにトキメキが止まらない！\n\nポジティブ陽キャな校内イチの人気者×自己肯定感激低の物理学教師\n\
  真剣交際を賭けた受験カウントダウンが今始まるーー\n\n\n\nーねぇ先生、なんでそんなに可愛いの？-\n\n「東大受かったら那智先生に告白する！」 \n屋上から全校生徒の前で突然の宣言を受けた教師の那智、相手は老若男女問わず人気の高崎だ。その日を境に高崎の猛アピールが始まり、ほかの教師までもが応援する始末。平穏を愛する那智は、高崎に振り回されている状況に頭を抱えていた。しかし、高崎から向けられる想いの強さに次第に心動かされていきーー？"

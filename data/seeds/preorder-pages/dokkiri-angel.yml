_note_origin: |
  per-case新規登録 2026-08-08(ユーザ提供ISBN 978-4-06-172833-2 + 「Koboに書影あるかも三冊とも」)。
  ★本番に1巻も存在しなかった。楽天(紙)にも商品が無く、NDLは1巻と3巻しか収録していない。
  【巻構成】全3巻。講談社コミックス(KC)番号が v1=832 / v3=852 で、ユーザ提供のISBN 4-06-172833-4(=KC833)は
   その間に入る2巻。楽天Koboが「どっきり！エンジェル 1巻/2巻/3巻」を3点そろえ各巻の紹介文に「（全3巻）」と
   明記していることで全3巻が確定した。
   v1 9784061728325 = NDL「どっきり!エンジェル 1」講談社コミックス832 / 1982.06.20
   v2 9784061728332 = ユーザ提供。★NDL未収録・楽天(紙)にも無く**発売日が確定できないため空**(推測で埋めない)。
   v3 9784061728523 = NDL「どっきり!エンジェル 3」講談社コミックス852 / 1982.08.20
  【題とヨミ】NDL題は半角の「どっきり!エンジェル」だが、★書影の実物ロゴとKoboの流通題がいずれも全角「！」
   なので全角を採用。ヨミはNDLの transcription「ドツキリ エンジエル」を小書き文字に正規化した「ドッキリエンジェル」で、
   ★**書影上部のローマ字クレジット「KAZUKI MOTOYAMA / DOKKIRI ANGEL」が題と著者名の読みを裏付ける**
   (著者ヨミ モトヤマカズキ も同じ根拠)。
  【書影】楽天Kobo(2015年電子化・クリーク・アンド・リバー社)の3点。★skill kobo-covers の目視ゲートを実施し、
   3冊とも同一ロゴ書体・同一著者名表記・1980年代の絵柄と印刷質感で**原書カバーをそのまま電子化したもの**と確認。
   電子化用の描き下ろし別装丁ではないので採用した(比較対象の紙書影はそもそも存在しない)。
  【欠落】掲載誌=不明のため空。あらすじ/キャッチ=Koboに紹介文があるが未生成(エンリッチは登録後)。

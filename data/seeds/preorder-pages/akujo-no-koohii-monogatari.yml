rakuten_caption: '美しいが高慢な『氷の悪女』という評判の王女・レティアには秘密があった。それは、前世の記憶があることと、無類の珈琲好きということ！　

  でも、この世界では珈琲は『紳士の飲み物』で、高貴な女性が飲むのははしたないとされているーー。

  このまま、貴族の男性と結婚しようものなら、大好きな珈琲を我慢しなくてはならない。それが嫌で、求愛者たちを冷たくあしらってきた彼女だったけれど……。

  ある日、王家主催の舞踏会に、王家への贈り物として赤い果実ーー”コーヒーチェリー”を持参した人物が！

  隣国の侯爵だというその人なら、珈琲を飲むことを受け入れてくれる！

  そう思ったレティアは、その侯爵……ルーカス・ブラシアスに嫁ぐことに？'

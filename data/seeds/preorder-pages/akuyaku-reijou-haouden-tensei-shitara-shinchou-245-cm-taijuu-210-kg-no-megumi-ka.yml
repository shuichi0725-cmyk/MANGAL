rakuten_caption: '【乙女ゲーの世界に転生した… 身長245cm体重210kgの体で。】


  悪役令嬢ゴリアテッサ・アイアンローズ（17）はある朝思い出した。

  自分が転生者であること、そして正ヒロインに敗れ死にゆく運命であることを。

  「──ならばそのように征きて死ぬだけのことよ」

  彼女はネグリジェを脱ぎ捨てて決意する。

  いつの日か訪れる正ヒロインとの死闘のため、拳を磨くことを…！


  麗しき最強悪役令嬢がおくる、新感覚異世界コメディ！'

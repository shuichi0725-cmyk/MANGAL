rakuten_caption: '生まれながらに精霊たちの強い加護を受けて育った少女アリアンヌ。

  幼い頃から共に過ごしてきた公爵令息リオネルと結婚を誓い合い、穏やかで幸せな日々を送っていた。

  しかしある日、生家の伯爵家によって望まぬ第二王子との婚約を強いられ、屋敷に幽閉されてしまう。

  リオネルとの再会を信じ、孤独に耐え続けるアリアンヌだったが、

  やがて精霊の加護すら奪われ家族からも冷遇される日々に、心身ともに追い詰められていくーー

  一方、リオネルは愛するアリアンヌを取り戻すため、密かに動き出していて……？

  第1話 「精霊と遊ぶ令嬢」

  第2話 「いなくなったアリア」

  第3話 「お姉様なんていらない」

  第4話 「始まった王子妃教育」

  第5話 「アリアを取り戻すために」'

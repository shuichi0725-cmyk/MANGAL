rakuten_caption: 王女シャノンと騎士オリオン。激しい身分差から結婚を許されなかった二人はそう誓い合い、記憶を継承して生まれ変わる「転生の魔法」をかけて命を終えた…のだが。あろうことか二人は立場が逆転して転生。加えてオリオンは前世の記憶を全て失っていた。「そうか。愛した人は、とっくに新しい人生を歩み始めていたんだ──。ならば、私は新しい恋をしよう。彼を忘れるくらい、熱い恋を。」明るく前向きに婚活に勤しむシャノン。対してシャノンを見てるとなぜか気を引きたくなっちゃうオリオンで…！？

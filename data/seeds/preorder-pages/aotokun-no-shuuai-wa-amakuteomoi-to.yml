rakuten_caption: '14年分の片想い×お試し結婚＝エロ甘デイズ


  「そんな可愛い顔されたら、我慢できない」


  27歳の舞香（まいか）は仕事の傍ら婚活中。

  本当は14年前の初恋が諦めきれないけれど、そろそろけじめをつけなきゃいけない…


  ある日、親の勧めでお見合いすると、相手は初恋の碧斗（あおと）くん…!?

  外資系企業のエリートサラリーマンになった彼に、「俺のこと、結婚相手として考えてほしい」と真剣な瞳で見つめられ、入籍前のお試しとして1ヶ月同棲を始めることにーー！


  そして迎えた初夜、14年分の愛情をたっぷり込められたキスでトロトロに溶かされて…！

  敏感な乳首もナカも、碧斗くんの巧みな愛撫でいやらしい音が止まらない…っ！

  一番深いトコロで繋がる幸せに…心も身体も満たされてーー！


  朝は理想の旦那様、夜は絶倫な碧斗くんに溺愛されすぎちゃう…！

  甘くてエッチで濃厚な、お試し結婚生活スタート'

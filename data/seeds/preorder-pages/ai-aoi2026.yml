rakuten_caption: '高校生の妊娠を描いた『あの子の子ども』で、講談社漫画賞少女部門を受賞した蒼井まもるが送る「愛」にまつわる短編集。

  人工知能（AI)を搭載したアンドロイド「アイ」は、人間の幸福のために開発された。

  そんな「アイ」に一目惚れしてしまった”律子のアイ”。

  「アイ」があれば幸せになれると信じる”心のアイ”。

  大切な人を「アイ」で守り続けたい”私のアイ”、”希望のアイ”。

  AIから愛を知る、4人の主人公の物語。'

rakuten_caption: "妖怪に憧れ、趣味は絵描きと覗きーー\nそんな一風変わった直哉のもとへ嫁いだ綾乃は、新たな生活にドキドキしていた。\nそんなある日、使用人のばあやが殺される事件が発生！　\n\
  直哉は妖怪になりたいなんて言ってるし……この屋敷、どこかおかしい!? \n\nコドモペーパーが描く、妄想NTR妖怪譚、開幕ーー。"

rakuten_caption: '国防のために魔女と騎士が結婚する世界。

  出来損ないゆえに誰にも選ばれない魔女・エレナは、ある日、絶大な魔力を持つ帝国最強の騎士・政孝と出会い、惹かれ合う…しかし、それは、やがてエレナと政孝の抱える秘密を大きく揺さぶっていくー!!

  「想い」と「出愛い」が恋と魔力を覚醒させる逆転劇！ 溺愛ロマンティックファンタジー…！

  2026年8月刊'

_note_origin: |
  per-case新規登録 2026-08-08。★**私が日次蒸留で誤ってdenyした作品の復活**(ユーザ指摘)。
  denyの理由「v1-12が全て同じ発売日=巻構成が壊れている」は誤診で、**実際に同日一斉刊行**だった
  (通常版v1-12=2020-06-26 / 新装版19冊=2023-09-08 / カルチュア版25冊=2026-10-13)。
  「publisher未解決」も消す理由ではなくマスターに足す話だった(ネクストF / カルチュア・エンタテインメントを追加)。
  【全巻回収】★**JPRO出版権検索が決め手**。楽天は30件上限で取り切れず、NDLは単話売しか持たず、
   **元版(ネクストFコミックス)1-19は楽天題名検索にもNDLにも出なかった**が、JPROの題名検索1回で44件が揃った。
   さらにISBN連番の総当たりで新装版19巻・カルチュア版25巻の欠けゼロを確認し、全68巻を確定。
  【版構成】ja.wikipedia「熱愛プリンス お兄ちゃんはキミが好き」= 青月まどか / 『NextComicファースト』→
   『ネクストF』→『コイハル』/ 宙出版→ジャイブ→宙出版 / 2015年4月連載開始。
   通常版 = ネクストFコミックス v1-19 + ASTRO COMICS v20-24 の**通し1-24**(発行元は移籍。重複巻なし)。
   ★v13(2019-12-02)/v14(2020-03-02)が v1-12(2020-06-26)より古いのは**実際の刊行順**(先に13巻から紙が出て、
   後から1-12巻がまとめて刊行された)。日付逆行に見えるが事実なのでそのまま記録する。
   新装版 = 宙出版 v1-19(2023-09-08 一斉) / カルチュア・エンタテインメント版 = v1-25(2026-10-13 一斉・全巻再刊)。
   ★25巻はカルチュア版にしか存在しない(通常版は24巻まで)。
  【出典】巻・ISBN=JPRO出版権検索(題名「熱愛プリンス お兄ちゃんはキミが好き」44件) ×
   楽天ISBN直引き(全68巻で発売日・叢書名・書影を確認。書影68/68) の2ソース一致。
   題ヨミ= ja.wikipedia 冒頭の「ねつあいプリンスおにいちゃんはキミがすき」。

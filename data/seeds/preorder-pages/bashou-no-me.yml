rakuten_caption: '「俺たちの雑誌を創ろうぜ！」

  1930年代、日本統治下の台湾。文学と自由を愛する若者たちの青春群像劇！

  第18回日本国際漫画賞 優秀賞受賞作、待望の日本語版！



  自由を校風とする旧制高校・台北高校で出会った台湾人の葉星橋と日本人の南城雲太郎は、仲間たちとともに文学同人誌『鐘の音』の創刊を目指す。


  自由が少しずつ失われていく時代。それでも彼らは、本を読み、物語を紡ぎ、笑い、夢を追いかけたーー。

  友情、創作、葛藤、そして時代のうねり。

  綿密な取材に裏打ちされた歴史描写と、透明感あふれる美しい筆致で、台湾漫画界を牽引する実力派・左萱が描く青春グラフィティ。

  本や作品について仲間と語り合ったことのある人なら、きっと胸が熱くなる渾身作！


  本を愛する人へ、創作をする人へ、

  そして、本を届けるすべての人へーー。


  単行本各巻には、それぞれ世界初公開となる描き下ろしカラーイラストを掲載！



  伊坂幸太郎氏（小説家）、マツオヒロミ氏（イラストレーター）、紗久楽さわ氏（漫画家）も絶賛！


  ◆著者メッセージ・左萱（サケン）


  「葉」の生命力、「雲」の自由。

  私が描きたかったのは、昭和の面影が残る台湾を舞台にした、

  明るく、熱を帯び、そして燦然と輝く青春のひとときです。'

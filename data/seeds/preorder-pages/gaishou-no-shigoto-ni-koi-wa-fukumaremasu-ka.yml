rakuten_caption: '最高級のお客様と規格外な恋


  距離感バグな富豪×お人好し外商担当のハイクラスなアテンドラブ♪


  百貨店の外商部に転属した本田は、独り立ちして初めてのご新規様・犀川のもとを訪れる。

  容姿・財力・ステイタスーーすべてを兼ね備えた犀川に住む世界の違いを感じながらも、プロとして喜んでもらえる“案内《アテンド》”に全力を尽くす本田。

  しかし、どんどん距離を詰めてくる犀川のケタ違いな熱烈アプローチに、本田は翻弄されてしまいーー!?'

rakuten_caption: '【お望み通り、消えて差し上げましょう。--ただし、後悔しても知らないわよ?】

  アントワール王国第一王女として次期女王になるべく、全てを犠牲にして王太女教育を受けていたノルティマ。

  だがある時、彼女が目にしたのは婚約者ヴィンスと妹が抱き合う姿だった。

  裏切りを知ったノルティマは、遺言の手紙を残して王宮を去ることに。

  何もかも諦めて、崖から湖に身を投げたとき、救いの手を差し伸べる男が現れて……?

  不遇の才女が大切な人と新たな幸せを築く


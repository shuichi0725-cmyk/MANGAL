rakuten_caption: 'SNS＆コミックDAYSでも話題沸騰！俺にはふわっふわでもこもこのワンコ・ビションフリーゼのりつ（愛称りっちゃん）という相棒がいる。りっちゃんは、犬見知りで人間の女の子が大好きだ。女の子が大好きなところは俺にとてもよく似ている。そして若干俺のことをなめている節もある…解せぬ。りっちゃんと出会ってから、新たにいろいろな人（＆わんこ）と出会い、いろいろなことに気づかされ、世の中っておもしれえ！と実感中。そんな俺とりっちゃんをとりまく、クセ強な人間とわんこたちのワンダフルな日常瓢箪、開幕！

  紙版の単行本は白黒、電子単行本はカラーで、どちらも別々の魅力が楽しめます！'

rakuten_caption: '必ず君を殺す。

  だから俺と結婚して


  不老不死ゆえに人間から迫害された魔女のララニカはたった一人で数百年もの間、森の奥で暮らしていた。


  死を望みつつも叶わない日々に辟易していたある日、森で大怪我を負った元奴隷の少年と出会う。


  傷が癒えるまでの間だけ面倒を見るつもりが、居場所のない少年を見捨てることができずーー

  彼に“ノクス”と名付けて生活を共にすることに。


  しかし次第に心を開くノクスとは裏腹に、ララニカは「寿命のあるものを愛さない」と決めていてーー。


  これは、愛を諦めた死ねない魔女と一人の少年が紡ぐ純愛の物語。'

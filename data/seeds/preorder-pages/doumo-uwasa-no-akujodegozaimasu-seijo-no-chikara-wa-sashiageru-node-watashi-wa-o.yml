rakuten_caption: "「お前のような悪女とは婚約を破棄する！」\nある日突然、王太子・イアンから糾弾され、\n婚約破棄を告げられた聖女・マリーアンジュ。\n\
  さらに、王太子の恋人である男爵令嬢・メアリーに\n“聖女の力を譲れ”と命じられてーー!? \n多くの貴族が集う舞踏会で受けた、いわれなき侮辱。\n「それ相応の報いは受けていただきます」\n\
  静かに微笑んだマリーアンジュが選んだのは\n“悪女”になる覚悟ーー！\n\n聖女による華麗な\n報復サクセスストーリー！"

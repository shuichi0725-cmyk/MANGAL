rakuten_caption: '努力する人間を馬鹿にし続け、自らは努力せず、クズに堕ちた男は死の間際に己の人生を嘆く。

  もしも来世があれば自分も努力できる人間にーーと願った矢先、

  錬金術師の一家の赤ん坊“アイザック”に転生!?

  今度こそ後悔のない人生を…と一念発起したある日、眼球に激痛が走る。

  彼の眼は全ての魔力が視える“魔眼”へと覚醒を遂げたのだったーー

  「この先この不思議な力でどんなことができるようになるんだろう!!」

  魔眼で全ての魔力を分析し、努力を以ってあらゆる魔法に応用する。

  そして習得した規格外の魔法は、錬金術のレベルを別次元のものに昇華させる!!

  さらに天性と努力に裏打ちされた実力は徐々に世界に広まっていきーー!?

  世界最高の錬金術師を目指す、超王道異世界ファンタジー第一巻!!

  巻末に描きおろしおまけ漫画も収録!!'

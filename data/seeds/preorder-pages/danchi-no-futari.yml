rakuten_caption: 'ーー50歳、独身、幼なじみ。　

  売れないイラストレーターの”なっちゃん”。大学の非常勤講師を掛け持ちする”ノエチ”。生家の築古団地で暮らす。昭和レトロな「お品物」をフリマアプリで売り、その売上で美味しいご飯を食べる。小さな恥も誇りも初恋も、互いに知っているので今さら気は使わない。時にケンカし、時に高齢ご近所さんのため奮闘し、だらだらと過ごす等身大ライフ。　

  NHKでドラマ化！話題の「50代女友達小説」を志村貴子がコミカライズ!!'

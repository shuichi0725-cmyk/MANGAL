rakuten_caption: '裁縫が趣味の大柄な男・針山豊成。

  ある日、憧れの“総柄作家”ガラノに声をかけられる。

  推しとの夢のような出会いに喜ぶ針山だったが、ガラノは創作活動をやめようとしていた！

  彼女の引退を阻止すべく、針山は自らのハンドメイド作品を通して、その魅力を広めようと動き出す！


  好きなものを信じるふたりが紡ぐ、ものづくりコメディ！'

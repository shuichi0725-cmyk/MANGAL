rakuten_caption: '創立100年以上の歴史を誇る蜻蛉高校には1人の不登校の女子生徒がいた…。

  なんと、その不登校の生徒は異世界から転校してきた100年留年してるエルフだった！ 

  そんなエルフのエルエルの部屋にやってきたクラスメイトの歩が目にしたのは神秘的で美しいエルフとはおよそ違う情けなさすぎる姿で…！？

  最弱かわいいうすほそエルフとのハイテンションラブコメ！！

  いっぱい笑えて、ちょっぴり沁みます。'

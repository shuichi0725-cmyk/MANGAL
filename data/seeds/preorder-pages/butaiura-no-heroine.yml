rakuten_caption: "芸能界の舞台裏で輝く ヒロインの溺愛ラブ \n\n 「明日からも毎日また頑張るから\n今だけヒロインでいてもいいよねー」\n\n\
  若手スタイリストのあやは、大学時代に出会った人気俳優・玲央と秘密のおつき合い7年目！自信がなく控え目な性格だけど、一人前になって人気者の彼と肩を並べることを目標にしている。ついに、玲央が主演の作品で彼と一緒に仕事をすることになってー!?\
  \ あや編のほか、4編の読みきりを収録。\n\nキラキラした芸能界の舞台裏で輝く\n4人のヒロイン達の溺愛ラブシリーズ、開幕！ \n\n 【編集担当からのおすすめ情報】\
  \ \n 著作累計600万部突破！ \n読みきりが大反響のためシリーズ化した、しがの夷織の溺愛ラブシリーズです！\n\n芸能界の舞台裏で日々頑張るヒロインたち4人のラブストーリー読みきりを収録しました。\n\
  \n俳優/マッサージ師/デザイナー/コミュ強男子など、\nヒロインを癒やす多彩なイケメンたちをご堪能ください♪"

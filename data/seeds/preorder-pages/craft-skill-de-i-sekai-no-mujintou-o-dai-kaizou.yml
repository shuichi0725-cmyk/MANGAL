rakuten_caption: '男がいない島に異世界転生してーークラフトも女の子もエンジョイしちゃおう！


  クラフト系ゲームが大好きな大学生・ハヤトは、ある日ゲームの世界に引きずり込まれる。

  島に流れ着いたハヤトは、素材を収納したり、家を制作したりする”クラフトスキル”に目覚めて、

  のんびりとスローライフを送ろうと思っていたが、エルフの娘・リーナと出会い状況が一変。

  この島には男がおらず、子種に困っていることを知る。

  ハヤトの子種を狙い次々と襲ってくる異種族の娘たち!!

  子種をかけた異種族ハーレム・ラブコメが幕を開ける!!


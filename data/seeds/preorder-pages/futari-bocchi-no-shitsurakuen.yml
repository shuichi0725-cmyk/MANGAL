rakuten_caption: '特殊な力を持つ者は「上空」、

  持たざる者はいずれ沈む「地上」に落とされる世界。


  地上での退屈な日々に飽き飽きしたミカエラは、

  上空から来た先輩・アヴァの秘めた力に興味を抱き、

  彼の家で共に過ごすようになる。


  はじめは興味本位で、

  アヴァから向けられる好意も欲も利用するつもりだったミカエラ。

  しかし、心の奥の孤独を見破られ、

  愛おしむようなアヴァの温もりに身を委ねているうちに、

  打算も強がりも甘く溶かされていきーー…。


  無愛想→溺愛先輩×小悪魔系つよがり後輩

  ドラマチック相互救済ファンタジー！'

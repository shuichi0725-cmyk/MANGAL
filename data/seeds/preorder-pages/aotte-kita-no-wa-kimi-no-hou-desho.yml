rakuten_caption: '図書館司書として働く長月菫（ながつきすみれ）。

  せわしなく過ぎていく毎日は、嫌いじゃないけど少し退屈。


  ある夜、仕事帰りに立ち寄ったバーで本を読んでいると、


  「僕もその作品好きなんです」


  話しかけてきたのは、遊び人風ながら、どこかインテリさを纏う素敵なおじさま・藍澤（あいざわ）。

  彼の不思議な居心地の良さと、にじむ色気に飲まれーー。


  「まさか、誘っておいて怖気づいてないよね？」


  後腐れなくを約束に、甘くて危険な一夜を過ごしてしまう。

  朝、目覚めると彼の姿はないものの、

  机の上には、そっと差し出された連絡先のメモがーー。


  あんな抱かれ方したら、忘れられっこない。

  なのに、恋してしまった藍澤さんの正体は手の届かない存在で…？

  ふとした出会いが運命に変わる、甘い珠玉のラブストーリー。

  大人気連載が、ついにコミックスになって登場です！'

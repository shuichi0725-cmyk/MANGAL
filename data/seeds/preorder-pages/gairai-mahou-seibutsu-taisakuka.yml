rakuten_caption: '魔力を持つ生物が人の手によって国を渡り、別の土地に定着。

  定着した生物たちは「外来魔法生物」と呼ばれ忌み嫌われていた。

  そんな外来魔法生物の調査、対策のために発足したのが外来魔法生物対策課だった。

  対策課職員の青年・ロクロクは、赴任してきたばかりのエルフっ娘・ニニンと外来魔法生物の調査を進めていた。

  スライム、カーバンクル、ガーゴイル…聞き馴染みのあるモンスターが次々巻き起こすトラブルにふたりは…!?

  さまざまな魔法生物のため、外来魔法生物対策課は今日もゆく！！！

  第1話　スライム　003


rakuten_caption: '憧れのアパレル店員として、キラキラした毎日を送る有紗。彼氏に誘われ、軽い気持ちで始めたギャンブルをきっかけに、嘘も借金も止められなくなっていく──。

  そんな有紗の前に現れたのは、依存症の「匂い」を嗅ぎ分ける奇才カウンセラー・都凪遥。

  ギャンブル、アルコール、薬物、性依存……。誰の人生にも忍び寄る「依存症」の正体とは？

  人はなぜ、やめたいのにやめられないのか。そして、なぜ依存していくのか。依存に苦しむ人々の人生と、その心の奥に迫る衝撃の人間ドラマ、開幕。'

rakuten_caption: 青森グルメ漫画でデビューし、コミックスも出してきた漫画家・仁山渓太郎。だが、両親を立て続けに亡くし、一人ぼっちとなり、漫画を描けなくなってしまった。「なんとかしなきゃ」彼が選んだ道は、故郷青森を離れ、富山の山小屋・大日小屋で一夏を住み込みで働く…山小屋バイト生活。額に汗して働き、人と出会い、彼の心は…!?

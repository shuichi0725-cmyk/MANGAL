rakuten_caption: '『みんなと違う』って、特別なこと？

  「違い」を愛おしさに変えるコミックエッセイ。


  ハンディキャップのある長男と、個性豊かな3姉妹。

  でこぼこな4人きょうだいが巻き起こすのは、

  容赦ないきょうだいゲンカにドタバタの連続。


  『ハンディキャップのある子がいる家族』

  そう聞くと、少し特別な毎日を想像する人もいるかもしれません。

  けれど、母・マミー・マウス子ビッツさんがユーモアたっぷりに描く彼らの暮らしには、「みんな違うけれど、みんな同じ」という、優しくて当たり前の日常が溢れています。


  完璧じゃなくていい。

  自分だけの感性で、真っ直ぐに「今」を生きる彼らの姿に、

  クスッと笑えてじんわり泣ける、心温まる一冊です。


  ＜内容紹介＞

  第1章・・・マウス子ビッツ家の日常

  第2章・・・4人きょうだいの全力エンジョイ

  第3章・・・完璧じゃなくていい

  第4章・・・みんなちがうけれど、おなじ


  ＜こんなあなたに読んでほしい！＞

  ・周りと比べて、「自分って普通じゃないかも」と悩んでいる人

  ・毎日を頑張っていて、ちょっとした癒やしや元気をもらいたい人

  ・読んだ後に、ホッと温かい気持ちになりたい人


  肩の力を抜いてページをめくれば、彼らから元気をもらえること間違いなし。

  読んだ後はきっと、あなたの何気ない毎日が少しだけ愛おしくなるはず！



  マミー・マウス子ビッツ

  イラストレーター、漫画家。4児の母。

  2023年よりInstagramにて育児漫画の投稿を開始。PR漫画や雑誌のカットイラスト、コラム執筆など幅広い分野で活動中。現在、中年太りと本気で戦っている。


  Instagram：＠mousecobiz'

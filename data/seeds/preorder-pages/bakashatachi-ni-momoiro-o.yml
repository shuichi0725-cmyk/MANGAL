rakuten_caption: '「俺を初恋にしたらいいんじゃね？」


  学年中の問題児が集められた放課後補習で、

  みちるは武藤と出会う。

  初めて会って、初めて話したというのに、

  「ちょっと慰めてよ」といきなりキスされてしまう!?


  ファーストキスだったのに!!!!!


  警戒しつつも、補習のたびに

  みちるは武藤に詳しくなっていく。

  チャラくて強引、なのに気になる。

  武藤も素直でおバカなみちるがかわいくて!?


  初恋にする気満々男子 × 無自覚ピュアの

  おバカで甘くて、ちょっとエッチな放課後ラブ♥'

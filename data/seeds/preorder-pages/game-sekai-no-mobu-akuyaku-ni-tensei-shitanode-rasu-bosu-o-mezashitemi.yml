rakuten_caption: '悪のカリスマになる！…はずだった。

  かなりの名作ながら、ラスボスだけが不評の恋愛アクションRPG「アルテナ・ファンタジア」。そのラスボスーーの配下のモブ悪役貴族に転生した俺は、ゲームの知識を生かしてラスボスに取って代わり、理想のクライマックスを迎えることを思いつく。悪行を重ねて目指せ悪のカリスマ！　のはずが、なぜか評価が爆上がり！？　「どうしてこうなったのか、誰か教えて!!」'

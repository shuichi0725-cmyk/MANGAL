rakuten_caption: "回復、バフなどの後方支援をする白魔導師でありながら\n『対象に触らないと魔法が付与できない』ことで\n欠陥品と言われパーティを追放された白魔導師ルーミア。\n\
  \ \n心の傷も言えぬまま生活のため薬草取の依頼をこなしていたが、道中…猛獣に襲われてしまう。\nピンチを切り抜けるためルーミアは、まさかの支援魔法を自分に付与⁉\n\
  バフを盛って全力強化した体はもはや災害級の強さに！\n \nガントレットに重量ブーツを身に着けた、最強可愛い暴力少女の快進撃をご覧あれ！"

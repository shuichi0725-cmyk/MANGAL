rakuten_caption: ごく普通の高校生・ユウは、目標のオーディションに向かう途中、謎の馬車に遭遇し、連れ去られてしまう。目が覚めると、そこは“ツイステッドワンダーランド”という異世界でーー！？魔法士養成学校ナイトレイブンカレッジに入学し、学園生活にも慣れてきたユウ。ウィンターホリデーで多くの生徒が帰省する中、学園に残ったユウとグリムは、一人の生徒と出逢う……。大人気スマートフォンゲーム『ディズニーツイステッドワンダーランド』の第4章「熱砂の策謀家」を、コミカライズの名手・マジコ！がコミック化!!

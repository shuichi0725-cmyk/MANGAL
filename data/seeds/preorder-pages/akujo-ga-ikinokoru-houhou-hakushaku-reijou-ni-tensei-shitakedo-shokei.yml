rakuten_caption: 5歳令嬢が目指すのは、幸せな暮らしと大往生！　稀代の悪女として国民を震撼させた伯爵令嬢アリア・マルシャン。彼女はとあるロマンス小説の悪役令嬢で、大陸一の美女として人気を博したが、25歳の若さで処刑されてしまった。その「アリア」に18歳の丸島ありさが生まれ変わっていると気づいたのは、「アリア」5歳の誕生日…。悪女として死ぬ運命なんてあり得ない！まずはこの可愛さで、最大の敵である叔父クロヴィスを攻略してみせる！5歳の令嬢人生を懸けた、生存戦略がいま始まる!!

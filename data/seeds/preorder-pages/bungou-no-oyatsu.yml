rakuten_caption: 【原稿は、おいしいおやつと引き換えです！】戦後の日本。新米編集者の燕くんは、偏屈で有名な小説家・鶯谷先生の原稿取りを任される。意気込んで先生の自宅を訪問する燕くんだけれど、「私好みのおやつを買って来なければ、原稿は渡せない」と追い払われ…。がむしゃら新米編集者×くせつよ甘党小説家ーー「おいしい」がつむぐ物語。

rakuten_caption: 'かつて世界を救うべく、魔王に闘いを挑んだ勇者ビヨンド。しかしある理由でトドメを刺すことに失敗し、魔王は最期に解呪不可能な不滅の呪い“ブヨブヨ”を全生命体にかけた。人々の不満の全ては勇者に向けられ、そのストレスからビヨンドは引きこもりに…しかし生活費は底をつき、働き口を求め身分を隠して再び外へ…!?

  ブヨブヨだらけの世の中に、レベルアップして立ち向かえ!! 極限の勇者VS社会生活コメディ、第1巻!!'

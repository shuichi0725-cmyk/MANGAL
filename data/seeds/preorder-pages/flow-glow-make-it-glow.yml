rakuten_caption: "大人気VTuberユニットがコミックスに \n\n ホロライブ所属の大人気VTuberユニット『FLOW GLOW』がコミックスに！\n\
  描きおろしまんがや、ここだけのインタビュー、Q＆Aも収録！！\nさらに、紙のコミックス限定で、ミニキャライラストを使用した『ステッカーシール』がついてくる！\n\
  【あらすじ】\nいつか世界中を笑顔にできるユニットになりたいという目標を掲げ、\n活動をする FLOW GLOW のメンバー5 人。まずは知名度を上げる\nために\
  \ KOSEI FES なるフェスに挑むことに！\nしかし待ち受けていたのは個性豊かなミッションで！？\n5 人は無事フェスに出場し輝くことができるのか？ \n\
  \n 【編集担当からのおすすめ情報】 \n 『FLOW GLOW』がコミックスになりました！\n5人の友情や目標に向かって進む一生懸命な姿など必見の物語が詰まった一冊になっています！\n\
  ステッカーシールもとってもかわいいです！"

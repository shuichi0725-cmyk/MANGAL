rakuten_caption: '冴えない日々を送る人事コンサルタント・スガワラは、突然悪の組織「ブラックショック団」に連れられてしまう。

  そこで依頼されたのは、正義のヒーロー「イノベイションレンジャー」を倒すための組織改革だった！

  ブラック企業をマネジメントして、世界を征服せよ！

  そして、本当の正義とはーー。


  コンサルタント×戦隊アクションスペクタクル第1巻。'

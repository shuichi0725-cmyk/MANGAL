rakuten_caption: 'ーーーねえ、先生。学校では教えないことをしましょうか？

  教師を務める那須の職場に赴任してきたのは、教育実習で一緒だった熱海。生徒にも人気で誰にでも好かれる熱海と、暗くて地味な自分は真逆のタイプだと認識していた那須だけど、なぜか熱海に「那須先生のことが好きなんです」と告白をされてしまう。熱海にキスをされても嫌だとは思えない自分に戸惑う那須だけど…？

  学校で、教師が恋をしたらダメですか？　先生×先生の職場恋愛事情。描き下ろしも収録！'

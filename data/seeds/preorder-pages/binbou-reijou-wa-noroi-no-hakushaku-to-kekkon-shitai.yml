rakuten_caption: '呪い？それがどうした！信じているのは君の笑顔（と、お金）

  お金がない。子爵領の経営難だったギルマン子爵家。そんな中エレナの元にある縁談が持ち掛けられた。支援をしてくれるとのことでエレナは即座に嫁入りを決意！しかし嫁ぎ先である“呪いの伯爵”には自分の家族全員を殺したという噂があり…。'

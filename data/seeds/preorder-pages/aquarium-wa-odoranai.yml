rakuten_caption: '謎と恐怖に満ちた水族館の秘密を解けーー…。

  累計60万ダウンロード突破の大人気ホラーゲーム、待望のコミカライズ！


  気だるげだが友達思いの少女・スーズは親友のルルと共に、

  ひょんなことから手に入れたプレミアムチケットを使い「ビアンカ水族館」を訪れる。


  水族館での非日常な体験を楽しむスーズたちだったが、

  ふと目を離した間にルルが行方をくらませてしまう。


  ルルを捜して水族館を探索しているうちに、

  気付けばスーズは元いた水族館によく似た、謎の水族館に迷い込んでしまいーー…。'

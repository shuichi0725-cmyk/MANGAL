rakuten_caption: 孤高の美男・レオナルド侯爵のもとに嫁いだリゼット。政略結婚とはいえ、「どうせなら旦那様の心を掴んでみせる」と意気込んでいた彼女を待っていたのはーーまさかの新郎不在の結婚式!?
  その後もレオナルドは一度も姿を見せず、リゼットは広い屋敷でひたすら孤独な日々を送ることに。「政略結婚の妻など、会う価値もないーーそうお考えなのですね？」ついに堪忍袋の緒が切れたリゼットは、レオナルドの部屋に“とある罠”を仕掛け、華麗に宣戦布告！
  名門侯爵家を舞台に、プライドと意地を懸けた夫婦喧嘩が今、始まるーー!!

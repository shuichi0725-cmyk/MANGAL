rakuten_caption: ロレッタは伯爵のもと、平民との不貞の証である黒髪の子として生まれてしまった。王侯貴族は魔力をあらわす髪色となり、魔力を持たない平民は茶や黒髪で生まれてくる。異界の導き手によるテクノロジーと魔力が融合する王国では魔力で紡がれた糸が動力源になり、その魔力を持つ者だけが特権階級に属する世界。そこで隠されるように育てられたロレッタに、婚姻という新たな運命が訪れるーー!!

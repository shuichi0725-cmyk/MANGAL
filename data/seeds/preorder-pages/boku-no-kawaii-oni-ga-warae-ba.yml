rakuten_caption: '「お前が傍にいると…

  痛みがなくなるんだ」


  平穏な毎日を送っていた間宮知春は、ある日、

  バイト中に子供を助けようとして事故に遭ってしまう。

  目が覚めるとーーそこは全く見覚えのない謎の村。

  スマホは通じず、周囲の風景はまるで昔の日本のよう。

  混乱している知春の前に現れたのはーー

  一人の美しい「鬼」--如だった。


  誰とも交わらず、森の奥深くで一人暮らす如。

  ある夜、“発情”している彼を助けたのをきっかけに

  知春は自分でも気づかないまま如に強く惹かれていく。


  どんなつらい夜も一人で耐えようと強がる如を

  放っておけない、抱きしめたい、俺がーー


  「我慢しないで、如。考えごとできなくなるくらい…

  気持ちいいところ全部触ろう」


  無自覚ド直球溺愛甘攻め×

  甘え下手な強がり鬼


  時を超えるエモーショナルラブBL！'

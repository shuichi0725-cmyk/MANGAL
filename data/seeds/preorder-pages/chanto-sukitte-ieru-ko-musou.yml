rakuten_caption: '男子高校生・澄江和泉に恋心を寄せる三人の女子は、

  いずれもメインヒロイン級の役者揃い！


  【学園のアイドルだけど、本当は甘えたがりなギャル】天崎雨音！

  【清楚な生徒会長だけど、裏ではお世話好きな元許嫁】白菊白亜！

  【ツンツン系後輩だけど、案外ちょろい小悪魔ちゃん】春日波留！


  しかし彼女たちはその盤石なポジションからか、

  なかなか一歩を踏み出せない日々を過ごしていた。


  そんな中で転校してきたのは、一見平凡だが天性のメインヒロイン・七瀬七緒。

  彼女が放ったとある一言が、ラブコメの勢力図を一瞬で塗り替える！


  そして開幕する熾烈なヒロインレース！

  いったい誰が勝つんだーー!?'

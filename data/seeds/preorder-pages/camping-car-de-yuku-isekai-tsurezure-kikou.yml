rakuten_caption: 念願のキャンピングカーを購入した主人公・吉岡茂人（ヨシオカシゲト）。納車当日にそのままキャンプ場へ向かい、車内で一夜を過ごす。翌朝、車の外に出た彼の前に広がっていたのは、見たことのないような大自然！
  さらには魔物やエルフまで出てきて、シゲトは自分が異世界に来てしまったと悟る。途方に暮れながらも運転席の画面を見ると、様々な便利機能を搭載した異世界仕様に変わっていて──!?
  孤独な元社畜のにぎやかなドライブ紀行が幕を開ける!!

rakuten_caption: 高校2年生の翼は実家のフィットネスジムが潰れて途方に暮れていたところ、ジムの常連だったアンヘル学院理事長のマリアにより特待生として学院に招かれる。寮で生活することになった翼は、マリアから同じく寮に住む7人の女の子のお世話をするように頼まれる。「ふしだらなことをしたら退学」という条件を出された翼だったが、この寮に住む「ちょっとワケアリ」な女の子達に翻弄され…。

rakuten_caption: '「ヌードモデルになってください…!!」


  大学に通いながらエロ絵師をしている陰キャの藤崎。

  男性の体をちゃんと描けるようになりたい！と素晴らしい筋肉を持つ陽キャ男子・千早に、勢いでモデルをお願いしてしまった。

  笑顔で引き受けてくれた千早に、エッチなことへの探究心が強い藤崎の要求はヒートアップ…！

  「勃起した〇〇〇を見てもいい？」と聞いたら「お前のも見せろよ」と押し倒されてしまって！？


  モデルになってもらうはずが自分もえっちなシーンのモデルになっちゃった！

  陽キャイケメン×陰キャ同人作家の凸凹キャンパスラブ。'

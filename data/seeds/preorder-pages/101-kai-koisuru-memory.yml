rakuten_caption: '何千年も前から愛していたよーー


  幼稚園での初対面で、

  電撃告白をされた軍司(ぐんじ)。

  幼なじみ・スウは高校生になっても

  変わり者で、赤点ばかりの問題児だ。

  一度勉強したら誰よりも優秀なのに

  「大切な記憶が消えちゃうから、

  新しいことを覚えたくない」と頑なにサボり、

  軍司にとっては大事な思い出も覚えていない。

  一番近くにいたはずなのに、時折見せる

  スウの知らない一面が気になり始めて…!?'

rakuten_caption: 'キツイつり目に化粧をしていなくても真っ赤な唇ーー見た目のせいで“悪女”と噂されるリーチェは男性にも怖がられ、女の子扱いをされたことなどなかった。

  唯一、婚約者のハーキンだけがリーチェの優しさを理解し、女性として大切にしてくれていた。

  ……はずだった。

  ある日、リーチェは庭園でこっそり抱き合うハーキンと、病弱な妹リリアの姿を目撃してしまう。

  信頼していた婚約者に裏切られ、過去との決別、人生の再起を誓うリーチェ。

  その先に待っていたのはーー？'

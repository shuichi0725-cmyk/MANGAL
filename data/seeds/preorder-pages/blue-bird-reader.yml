rakuten_caption: '『ひたむきに愛することだけが、私にできる全てだった』

  海辺の研究所で長く働くシンは、新任の青年・キーランと、ある研究のパートナーを組むことになった。どこか頑なな態度を崩さないキーランに興味を抱いたシン。やがて──二人は愛し合う関係へと至った。公私ともに支え合いながら、穏やかで満ち足りた日々を送る二人。しかしある時、キーランがふと口にした“願い”。それは、シンには決して叶えられないものだった……。

  ミステリアスな異邦人×生真面目な研究者──理性と衝動がせめぎあう、ストレンジ・ボーイズラブ！'

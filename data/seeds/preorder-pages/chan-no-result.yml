rakuten_caption: "死後、人生のリザルト画面が見えたなら。 \n\n 死んだ後に、自分の人生をゲームのように「リザルト画面」で確認できたら……？ \n\
  \n命を落とした元プロ野球選手の八晩の前に現れたのは、自らを「閻魔ちゃん」と呼ぶ天真爛漫な冥界の主。 彼女が持つ「閻魔帳」には、生涯で食べたパンの枚数から、誰にも言えない恥ずかしい失敗、そして無意識に誰かの心を動かした回数まで、人生のあらゆるデータが記録されている。\
  \ \n\n「冥土の土産に、何でも一つ教えてやろう」。 \n\n様々な思いを抱えてやってくる死者たちは、閻魔ちゃんが提示する数字を通して、自分でも気づかなかった人生の価値を再発見する。\
  \ 閻魔ちゃんと共に一生分のデータを振り返る、“冥土の土産話”が始まる！ \n\n 【編集担当からのおすすめ情報】 \n 描き下ろし、おまけページを多数収録！"

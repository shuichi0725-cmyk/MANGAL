rakuten_caption: 弁当屋で働くひばりが結婚したのは、優しくてちょっと多忙な団体職員・三輪伊吹。彼が家へ連れてくる同僚たちをひばりお得意の手料理でおもてなし！　だけど、同僚たちはタトゥーに金髪尖り耳と、少し変わった風貌で……。しかも伊吹は時折隠し事をしているように見えて!?　心と心をつなげるお料理で、新婚生活の秘密も不安も乗り越えられるはず……！　笑ってときめく、異世界×新婚グルメファンタジー開幕！

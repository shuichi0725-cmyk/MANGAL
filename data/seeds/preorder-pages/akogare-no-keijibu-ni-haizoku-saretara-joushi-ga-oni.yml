rakuten_caption: '念願叶って京都府警の刑事部所属となる岩槻亜寿沙だが、その配属先は怪異事件の捜査をする「特異捜査係」だった。

  亜寿沙は「鬼に噛まれた」という上司・阿久津聖司とともに「縁切り神社の怪異」の謎へ挑むことに…。'

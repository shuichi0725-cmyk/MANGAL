rakuten_caption: '幼なじみと秘密の関係

  恋人になれない2人の拗らせ愛


  天真爛漫でいつもみんなに笑顔を振りまく知佳は、幼なじみにだけ我儘な自分を見せている。「晴臣だけが、本当の僕を分かってくれればいい。」ある日、晴臣がクラスの女子からデートに誘われたと知り、苛立ちを抑えきれず二人の後をこっそり尾行することに。やがてホテル街に消えていく背中を見つけるも、突然見知らぬ男に絡まれ大ピンチ！そんな知佳を救ってくれたのは、女の子といたはずの晴臣だった。こんな場所にいるのは…きっとそういうことをしたいから。そう思い込んだ知佳がとった大胆な行動とは！？'

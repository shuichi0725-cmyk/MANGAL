rakuten_caption: '恋を壊された男と恋を捨てた男

  失ったはずの恋が、もう一度動き出すーー




  高校時代、恋人同士だった瑞稀と颯太。

  しかし、二人の関係を知った颯太の母によって、颯太はアメリカへの留学を余儀なくされる。

  「瑞稀のためなら家族を捨てる」と言ってくれた颯太に対し

  同じ覚悟を持てなかった瑞稀は一方的に別れを告げ逃げてしまう。


  数年後、就活中に偶然颯太との再会を果たした瑞稀。

  しかし、そこには かつての太陽のように笑う颯太の姿はなかった。

  「瑞稀に復讐するために帰ってきた」

  そう言って冷たい笑みを浮かべる颯太は瑞稀に"セフレ関係"を持ちかけてきてーー！？'

rakuten_caption: '"「鬼上司、実はSub!?」


  【コンプレックス持ち忠犬部下Dom×トラウマ持ち鬼上司Sub】

  大反響！立場逆転Dom/Subリーマンラブ！


  ーー営業部2年目のDom・小柴(こしば)は、成績トップの鬼上司・東(あずま)主任に扱かれる毎日。

  Domらしくないことが悩みの小柴にとって、「SubにモテそうなDom様」と噂される東は憧れの上司だった。


  そんなある日、小柴が不意に発した言葉が、偶然にも主任のSub性を暴いてしまう…！

  コマンドの甘い支配にとろける淫らな主任の姿に、Domとしての本能が強烈に刺激されてーーー。


  「俺を頼って 俺だけを見て 俺のコマンドで感じてほしい」

  不器用な2人の、甘くて優しいリーマンラブ!!"'

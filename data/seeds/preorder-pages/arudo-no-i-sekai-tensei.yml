rakuten_caption: '全てを失った少年が泥臭く運命に抗うやり直し英雄譚！！

  今度こそ手放さないーー

  希望を。家族を。人生を。


  大切な家族を失い絶望の果てに命を落とした男は、貴族の嫡男アルドとして異世界転生を果たす。


  新たな両親、双子の弟エルファスと温かい時間を紡ぐも再び大切な人を失う恐怖から“家族”に心を開けずにいた。


  だが、魔物の森に迷い込んだ弟に魔獣の凶牙が迫った瞬間、アルドは勝ち目のない敵を前に、迷いなく立ちはだかる!!


  一度目の人生で失ったものを今度こそ守り抜くために。


  そして、やり直し人生で出会った“魔法”の存在は少年の希望となり、運命を切り拓く力となるーー。'

rakuten_caption: "元風俗嬢で限界OLの大島さん女風に沼る！ \n\n 元風俗嬢で30代の大島さんと小松さんは、コールセンター勤務。\n大島さんは女風に給料を吸われ、小松さんは年下と不倫中。\n\
  “まとも“な人生を目指したはずが、気づけばどちらも迷子。\nそれでもクレーム対応の合間に、互いの地獄を共有しては笑い合う。\n欲望だらけの日常コメディ！！ \n\
  \n 【編集担当からのおすすめ情報】 \n 新進気鋭の漫画家・宮内 漣のデビュー作です。\n商業連載が初めて！？と驚くほどのネーム力とキャラクター力があります。\n\
  \n主人公の大島さんを一度知ると、彼女の行動から目が離せない！\n中毒性のあるキャラクターをお楽しみください！"

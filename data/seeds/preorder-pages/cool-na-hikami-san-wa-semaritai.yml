rakuten_caption: "栗園拓哉（38）、独身。趣味は少女漫画。無愛想で“氷結の門番”と呼ばれる部下・氷上結衣（27）からの相談は「婚活のため、肉食女子になりたい」だった。これは、練習のための“仮交際”のはずだがーー？\
  \ \n氷のような彼女との、不思議で楽しいオフィスラブコメ、開幕。"

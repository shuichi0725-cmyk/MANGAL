rakuten_caption: '傷つき疲れた心を癒すのは、香川の土地と人魚娘？


  ＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿



  【くらげバンチ『うどんの国の金色毛鞠』著者・篠丸のどか先生、推薦！！！】


  ゴリゴリの讃岐弁で喋る人魚！

  見慣れた街並み！

  ちょっぴり不憫なうどん屋の孫！

  応援するしかない…！


  ＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿


  数年ぶりに生まれ育った香川県に戻ってきた澄は

  東京での学校生活がうまくいかなかったため

  心に傷を負っていた。


  久しぶりに故郷の土地を歩く中

  澄は浜辺に倒れている人魚を見つける。

  瀬戸内海に棲む、人魚の娘・水珠は

  東京に強い憧れを持っているようでーー


  東京に行きたい人魚と

  東京から逃げてきた少年の

  瀬戸内海を舞台にした、恋の物語。'

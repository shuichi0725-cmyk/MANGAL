rakuten_caption: '『きみは面倒な婚約者』兎山もなか×椎野翠の最強タッグで贈る、大人のためのラブコメディ！


  若槻志乃29歳。同僚と結婚間近のどこにでもいるアラサー会社員。

  だったのに……上司と飲んだ翌朝、気づけば「保護」という名目で彼のマンションに「監禁」されていた。

  理由はもうすぐ地球が終わるから。--部長、本気ですか？

  どうして私を監禁したんですか？　好きだからって、それ、犯罪ですよ？


  すこしふしぎな大人のラブコメディ。'

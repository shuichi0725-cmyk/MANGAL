rakuten_caption: '（表）「私はただの幼馴染だ。立場は弁えている！」

  （本音）「はぅぅ!小石ちゃんが可愛いすぎて死ぬぅぅ!!」

  ★☆★☆★

  武勇の名門に生まれた侯爵令嬢テオジェンナは

  高潔かつ剛健な男装の麗人。

  しかし彼女には、致命的な弱点があった。

  「はぅぅ!今日も小石ちゃんが可愛いよぉ!!」

  幼馴染のルクリュスの可愛さに耐えられず、

  日々絶叫し、悶え苦しんでいるのである。

  しかし見た目とは大違いの腹黒策略家である

  ルクリュスもまた、テオジェンナへの

  ある想いに悩んでいてーー!?

  ★☆★☆★

  激ニブ男装令嬢×子犬系腹黒男子

  スレ違い暴走系ラブコメディ！

  第1話　麗しの侯爵令嬢は絶叫する

  第2話　妖精たちの腹の内　

  第3話　岩石乙女の苦悩　

  第4話　茶会での攻防　

  第5話　小石ちゃんのお願い　

  キャラクターデザイン公開　


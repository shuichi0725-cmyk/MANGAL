rakuten_caption: 'Domの紫乃は、誰とでもプレイするヤリチン大学生。

  被支配欲求に悩むSubたちを助けながら、プレイを楽しんでいた。

  そんなある日、ダイナミクス性の乱れを律するサークルのリーダー・久瀬と出会う。

  「欲求はコントロールできる」と主張する久瀬と対立する紫乃。

  挑戦的な態度の久瀬にコマンドを発する紫乃だが、なぜかコマンドが効かなくて!?

  怪しい薬や強力なコマンドで久瀬を負かそうとムキになる紫乃に、

  久瀬は「困ってるなら俺とパートナーになれ」と言い出し…？

  男前カタブツSub×負けず嫌い美人Domの逆転Dom/Subユニバース！'

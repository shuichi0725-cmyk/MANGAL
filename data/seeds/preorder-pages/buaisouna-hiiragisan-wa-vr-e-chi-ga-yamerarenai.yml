rakuten_caption: '祖父のカフェを継いだ店主・柊木 嵐の秘密の趣味はVR風俗!!

  VR風俗とは、VRのゴーグルで映像を見ながら人に身体を触ってもらうこと。嵐はこの趣味で仕事や対人関係のストレスを発散していた！

  担当してくれるのはいつも同じ男性で、人に触ってもらうことにハマってしまった嵐。

  仕事の繁忙期でしばらく風俗店に通えずにいたのだが、そんな時カフェに来店した顔の良い男・七瀬翠になじみの風俗店に拉致されてしまい…?!

  VRクリエイター×カフェ店主のすれ違いラブストーリー！'

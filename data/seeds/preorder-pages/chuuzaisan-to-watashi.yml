rakuten_caption: 'Xにて2400万View超え!!

  ヤンキー女子高生と駐在警官による心の交流を描いた話題作！


  「誰にも傷つけさせない、そのために僕がいます。」


  山と国道に挟まれた田舎町・つづみ町。

  この町に住む高校生のうららは、新しく赴任して来た駐在警官の事がなんだか気に入らない。

  へらへらしててナメられっぱなしで、威厳もなくて頼りない。


  そう思っていた、「あの時」まではーー。


  連載がスタートするやいなや海外からの翻訳出版オファーが殺到し、たちまち日・韓・中・独の4カ国での発売が決定した話題作が、大幅加筆＆描き下ろしも収録して待望のコミックス化！'

rakuten_caption: 'この不審者、伝説となる。

  「どこからどう見ても、紛れもない不審者である」現代に突如現れたダンジョン。そこへ挑んだまま消息を絶った青年・永野は、人類未踏の深層でーー25年もの歳月を生き延びていた。獰猛なモンスターを喰らい、最強の肉体と経験を得た彼が帰還した先は、“ダンジョン配信”が義務化された未来の日本。災害級モンスターの群れすらものともしない実力を見せつけ、永野の活躍は瞬く間に日本全土へと拡散されていく。25年分の生存知識を武器に、不審者はやがてーー新時代のレジェンドとなる。爽快感MAXの無双ダンジョン配信譚、開幕!!'

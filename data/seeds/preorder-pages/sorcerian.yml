catch: 名作RPGの各シナリオを、漫画家たちが自由に描いた全15冊。
synopsis: 日本ファルコムのアクションRPG『ソーサリアン』(1987)の各シナリオを題材に、複数の漫画家がそれぞれの解釈で描いたコミカライズシリーズ。角川書店から1988〜92年に本編12巻+新シリーズ3巻が刊行された。

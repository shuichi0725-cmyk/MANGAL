rakuten_caption: やり込みまくった乙女ゲームへの異世界転生に気づいたアリッサ！　未来で侍女として仕える予定の、極悪非道の悪役令嬢（予定）ルーナが悪役令嬢になるフラグをへし折るため、たった一人での戦うことを決意！　まずは、完璧な淑女の心得と礼儀作法を身に着け、ハイスペック侍女としてルーナを心優しきレディとして躾けます！　………と意気込むアリッサに、攻略対象様が次々「おもしれぇ女」と近づいてきて…それってーー!?　ハイスペック転生アラサー侍女が悪役令嬢の悪堕ちフラグをへし折っていくと、自分にはなぜか全然不要な恋愛フラグが立ちまくる、痛快爽快異世界恋愛ファンタジー！

rakuten_caption: "大人気ホラーゲーム『青鬼』の公式マンガ \n\n 主人公・タケルは、ホラーやオカルトをこよなく愛する中学生。変わった趣味のせいで周囲から距離を置かれていた彼のもとに、ある日、少女・サクラが現れる。\n\
  \n「お兄ちゃんを助けたいの」\n\n切迫した様子で助けを求めるサクラに協力することを決めたタケル。二人は行方不明になったサクラの兄を探すため、「ブルーベリー色の巨人」が出没すると噂される廃校へ足を踏み入れる。しかし、そこで待ち受けていたのは、人智を超えた恐怖だったーー。\n\
  大人気ゲーム『青鬼』公式監修のもとで描かれる、ホラー×ミステリー×バトルまんが。なべのしめじが贈る、子どもから大人まで夢中になれる最恐エンターテインメント。これまで語られなかった「青鬼」の謎に迫る新たな物語が幕を開ける！\
  \ \n\n 【編集担当からのおすすめ情報】 \n 本作の魅力は、「青鬼」らしい本格ホラーだけにとどまりません。迫力満点のバトル、思わず笑ってしまうギャグ、さらには恋愛要素まで盛り込まれた、新たな『青鬼』の世界が楽しめます。そして最大の見どころは、これまで明かされることのなかった「青鬼の正体」に迫るストーリー。果たしてその真実とはーー。あなたに、その秘密を知る覚悟はありますか？"

rakuten_caption: 火事で母親を失った少年・ヒカリは、その事故の調査員・陽刃に引き取られ、平穏な日々を過ごし始める。しかし、そんな日常を脅かす何者かの影が…。ヒカリは無自覚に物怪を引き寄せてしまう特異体質であり、陽刃はそんな物怪を狩る外法師だった!!

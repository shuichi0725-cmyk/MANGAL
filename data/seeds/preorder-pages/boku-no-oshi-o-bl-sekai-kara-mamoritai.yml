rakuten_caption: '「もしかして僕、推しとBL世界に来ちゃった！？」


  腐男子コミュ障大学生・真尋は、BL漫画から出てきたようなイケメン同級生・城戸を陰ながら推している。しかし、城戸には一途に想う人がいるようで…。

  ある日、真尋は暴走トラックから城戸を庇うが、2人とも轢かれてしまうー。

  目覚めると…ん？この世界、何かおかしい？あちこちでBL漫画みたいなことが起こってる！？もしかして僕、推しとBL世界に来てしまったー！？


  BLイベントが多発するこの世界で、推しを守ることを決意し、奮闘する真尋だが、

  次第に2人の距離は縮まっていき…？

  【クール系イケメン×コミュ障腐男子】のラブコメBL！'

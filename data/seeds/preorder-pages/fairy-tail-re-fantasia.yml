rakuten_caption: '祝『FAIRY TAIL』20周年！　

  真島ヒロが描く完全新作ストーリー!!


  あの天下一アツいお騒がせギルドが帰って来た！

  収穫祭でお祭り騒ぎの「妖精の尻尾」。そんな彼らに邪な目を向ける不穏な影が。嵐の予感ーー!?　



  マグノリアの街に収穫祭の季節がやってきた。心浮き立つお祭りに、妖精の尻尾も前のめり。中でも注目は「ミス・フェアリーテイルコンテスト」。妖精たちの誰を推すかで、早くも話題は持ち切りだった。一方で、祭りの思い出の“苦み”を噛み締める者の姿も。そんな中、この天下一のお騒がせギルドに邪な目を向ける影が現われる。その狙いは……ラクサス!?
  嵐を呼ぶ収穫祭は、はたして無事に最後のパレードを迎えられるのかーー!?'

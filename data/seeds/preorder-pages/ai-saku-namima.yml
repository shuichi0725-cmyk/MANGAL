rakuten_caption: '離島で民泊を営むツツムは、ある夜ケンカの仲裁に入る。

  しかしそれは、宿泊客の美波が自ら求めたプレイの一環だった。

  邪魔をされた腹いせに、美波に童貞を奪われてしまうツツム。

  激しい行為の最中、朦朧とした美波がしきりに呼んでいたのは

  今は亡き恋人の名前だった──。

  翌日からツツムが旅に出ることを知った美波は

  「俺も一緒に連れてって」と言い出す。

  無邪気なようで、悲しみ方が下手な彼をツツムは放っておけず…。

  傷を抱えた放浪者と彼を包み込もうとする青年の

  せつなくも優しい救済のふたり旅。

  描き下ろし21Pも収録。'

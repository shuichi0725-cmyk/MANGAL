rakuten_caption: '古いパソコンを久しぶりに起動した蒼井怜は、

  見知らぬ連絡先から一通のメールが届いていることに気づいた。

  Summit Cross=サミットクロス。

  かつて怜がプレイヤー名：reeenとしてやり込み、

  辞めてしまったFPSゲーム。

  そのコーチを依頼したいという内容だった。

  このタイミングでの依頼に興味を持った怜は、

  話だけでも聞こうとコンタクトを取ってみる。

  すると、そこに現れたのは超絶美少女で、

  人気VTuberの火鳥アリサだった!?'

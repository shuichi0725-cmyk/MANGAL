rakuten_caption: '梅雨のある日、部活が早めに終わった栗本詩暮。

  忘れ物を取りに行った視聴覚室で、クールな美少女・雨森潤奈に出会う。

  本や音楽の趣味が合って会話も弾む中、だんだんと二人は仲を深めていく。

  雨の日だけの逢瀬を繰り返すうちに、ドライなはずの潤奈の意外な一面が見え始める。

  ふたりの距離が吐息がかかるまで近づいたとき、「潤奈の秘密」が明らかになってーー

  しっとり甘い、雨の日限定ラブコメ第1巻！


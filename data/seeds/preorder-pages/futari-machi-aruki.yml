rakuten_caption: '大学進学を機にひとり暮らしを始めた女子大生ヒナが住んでいるのは、生活に難はないが面白みがなく退屈な街。大学4年間過ごすだけだし、まぁこんなもんか……と思っていたある日、ヒナは街中のなんの変哲もない場所の写真を撮っている青年カゲに出会う。カゲの行動に興味をもったヒナは、彼と一緒に街あるきをしてみることに！すると、平凡だと思っていた街の印象がどんどん変わっていき……！？

  なんでもない街を君と歩けば、世界が不思議な彩にあふれる！コミュ強女子大生×プロアシ志望青年の街あるきラブコメ！'

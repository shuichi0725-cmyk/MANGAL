rakuten_caption: '魔王を倒し世界に平和をもたらした英雄でありながら、

  魔王が死の直前に放った呪いにより最愛の娘を失ってしまった勇者・ジジルジ。

  自身も呪いにより全身に不治の傷を負いながら、絶望と復讐の余生を送っていた。


  数年後。

  魔王復活の報せを受けたジジルジは復讐を果たすべく魔王討伐に向かおうとするが、「回復役」だと言い張る無邪気な子供エルフがついてきてしまい……？


  娘を失い心と身体に深い傷を負った元勇者と、家族も仲間も知らずに育った子供エルフの、ヒーリング冒険ファンタジー！'

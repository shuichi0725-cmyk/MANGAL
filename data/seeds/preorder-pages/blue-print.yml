rakuten_caption: 「僕の建築できみを笑顔にするーー」沖縄に住む阿原屋創太は、人付き合いが苦手な小学生。唯一心を開く兄とキャッチボールをしていた空き地に公民館ができると知って、ひとり建設反対運動を起こそうとする。そんな彼が出会ったのは、自由奔放な建築家・鉄村麗子で……。彼女によって「建築」の面白さに目覚めた少年は、建築家になるという夢を抱き、東京の名門大学の建築学科に入学するがーー。青春建築ストーリー開幕!!

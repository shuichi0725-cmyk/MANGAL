rakuten_caption: '「ふたりをいい雰囲気にするはずが……俺がBLしてどうする!?」


  ある日、ふつーの男子高校生から

  学園ものBLゲームの悪役令息に転生していると気づいたアーサー。


  しかもゲームの展開次第では、自分に

  【地下牢エンド】や【触手エンド】があることも思い出して大慌て！


  命と貞操が助かる道は、ゲームの主人公が

  アーサーの婚約者である第一王子と結ばれるルート、ただ一つ！


  頼れる従者・エドガーを巻き込んで悪役をやり遂げ、

  王子と主人公をくっつけようと企むアーサー。


  だけど皆から嫌われるどころか、先に自分にBLフラグが立ちそうで！？'

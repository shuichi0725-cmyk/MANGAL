rakuten_caption: "あそびあそばせ、涼川りんフルカラーで暴走 \n\n 宇宙船に潰されて、死んで、始まる\n『あそびあそばせ』の涼川りん最新作！\n\
  \n刺激のない日常を嘆いていた漫画家・森田ちゃん。\n「宇宙船でも降ってこないかな……」\nその直後、本当に宇宙船に潰され即・死亡。\n\nしかし、宇宙人の姉妹ユーリン＆ぷーちゃんにより蘇生される。\
  \ \n彼女たちは、森田ちゃんを“地球の蟻”と勘違いして、 \nぷーちゃんの絵日記の観察対象に選定した。\n\n幼稚園卒園を目指す宇宙人×人間でいたい漫画家の\n\
  不条理SF同居コメディ開幕！！"

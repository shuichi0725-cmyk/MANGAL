rakuten_caption: 2026年、京都で大暴動が起きる。「京都暴動＝キョート・ライオット」だ。人々は自分の目の前にいる人間を殺し合い、未曽有の大惨劇が繰り広げられた。事件の発端になったのは、「鏡＝アンク」という名のたった1頭のチンパンジーだった。霊長類研究施設に勤める研究者・鈴木望は、世界に広がらんとする災厄にたった1人で立ち向かった……。大橋ユウ×イナベカズのタッグで描く、パニックSFコミカライズ開幕！！

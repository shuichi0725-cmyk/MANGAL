rakuten_caption: 全人類の心を熱くした孤高のヒーロー“キャシャーン”が待望の漫画化！　205X年。人類の生活はAIの深化により豊かになるも、深刻な環境破壊に悩まされていた。そんな中、東博士が環境を守るため開発していたAIが暴走し、人類不要を唱えるブライキング・ボスが誕生してしまう。東鉄也は、自らの命を犠牲とし、新造人間キャシャーンとなって、人類の未来の為に闘う道を選んで…!?

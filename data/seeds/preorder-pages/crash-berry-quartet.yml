rakuten_caption: '全員、片思い。



  クーデレDK→愛され姫DK→強面世話焼きDK→愛重め優等生→


  高校3年生の真央・柚鈴・誠吾・亮介は小さい頃から家が近所の幼馴染み。

  真央は長年柚鈴に片想いをしているが、柚鈴の思い人が亮介であることを知り気持ちを胸にしまい込んでいる。

  そんなある日、柚鈴が突然姿を消してしまう。

  捜しに向かおうとする真央をなぜか誠吾が必死に引き留める。

  「柚鈴のところには行かないで」

  その言葉をきっかけに、4人が抱えていた恋心と秘密が少しずつ明らかになっていき…？'

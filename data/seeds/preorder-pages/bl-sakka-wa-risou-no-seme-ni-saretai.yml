rakuten_caption: '理想の男とエッチした“はず”なのに、なぁんも覚えてない…（泣）


  新連載BL漫画の『攻めキャラ』の設定に悩んでいた漫画家・清瀬は、

  引っ越しの挨拶に来た美大浪人生の須藤を見た瞬間、

  「むっちゃ抱かれてぇ〜〜！！」と胸きゅんMAX。

  ヴィジュアル、体格すべてが、まさに理想の攻め！！

  会って早々食べ物をねだる須藤に、清瀬は交換条件で漫画用のモデルを依頼する。

  1ポーズごとにご飯かお酒を追加という条件に、ノリノリで応える須藤。

  酒を飲みながらお互いをデッサンしているうちに、いつのまにか……。

  翌朝、裸で目覚めた清瀬は昨晩の記憶がなくて大混乱！！　

  なのに須藤は「あんな白熱したのは初めてです」と満足そうでーー！？


  マイぺース美大浪人生×奥手でエッチなBL漫画家、胸きゅん・玉きゅん・ラブコメディ！


  描き下ろしは10P。その後のふたりのまったりラブ『公園シャセイ…デー？』'

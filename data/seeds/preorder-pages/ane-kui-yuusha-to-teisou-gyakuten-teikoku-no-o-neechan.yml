rakuten_caption: '汎用性が皆無でゴミスキル呼ばわりされる「姉喰い」スキルを持つがゆえ、

  不遇な生活を送っていた少年・ナツキ。

  だが隣国の軍事国家からの侵攻に対して立ち上がった時、彼の「姉喰い」は真価を発揮する！


  なぜなら……「炎の大将軍」フレイアや「氷の大将軍」シラユキをはじめ、

  相対した敵の大将軍たちはもれなく全員ショタ好き姉属性キャラだったのだ!!


  世界は平和に、貞操は大ピンチに!?

  ナツキのエッチで破天荒な英雄譚をとくと見よ！'

rakuten_caption: 中学二年生の田代有礼は猿に呼びかけられる不思議な夢を見る。「くるすの丘に来い」という夢に導かれるように「栗栖の丘学園」に転校が決まり、出会ったのは数学には強いがそれ以外は全然ダメなQと呼ばれる同級生だった。なぜかQに懐かれた有礼は、ある日校内で不思議な現象に遭遇し…！

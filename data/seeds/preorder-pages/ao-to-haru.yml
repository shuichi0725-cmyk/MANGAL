rakuten_caption: ボッチ女子（骨折中）×人気者男子の青春爆発ラブストーリー。 自分の気持ちを言葉にするのが苦手な青依（あおい）は、高校入学早々、友達作りに苦戦中…！
  しかも、階段から落ちてきた学年の人気者・三谷（みたに）くんを受け止めたことで、腕を骨折してしまう。でも、コミュ力抜群な三谷くんと関わる中で、憧れの「キラキラな青春」に一歩踏み出してーー…

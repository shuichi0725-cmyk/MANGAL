  先王である父親を亡くし、シャイニング王国を引き継いだ姫・コレット。慣れぬ政治に私腹を肥やす大臣、跋扈する悪党…上手くいかないフラストレーションや混沌とした国の闇を払拭する鍵は「セーラー服」！？

  セーラー服を纏った姫様が闇夜に棲む悪党をステゴロで成敗する爽快感抜群人情ドラマ、第1巻！'

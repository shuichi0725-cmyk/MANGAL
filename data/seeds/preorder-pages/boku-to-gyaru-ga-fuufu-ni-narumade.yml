rakuten_caption: 貧乏な家庭に育った少年・神長倉颯空。猛勉強の甲斐あってみごと希望する高校へ合格した彼だったが、ひょんなことから両親の借金が判明！
  その五千万円の借金をなぜか颯空が取り立てられていたところ、謎のギャル・百瀬月渚が現れて返済してくれることに。その代わりに月渚が颯空に出した条件は「自分と結婚してほしい」というものだった……！
  颯空は月渚の気持ちに時間をかけて応えていきたいと、条件を受け入れて彼女との結婚生活（仮）を始めたが月渚からのアプローチはエッチなものばかりで!? 大金持ちで巨乳でミステリアスなギャルとのエッチで甘々な結婚生活開幕♪

rakuten_caption: 【二人一組になってください】【誰とも組むことができなかった者は、「失格」となります】【一度組んだ相手と、再び組むことはできません】卒業式当日の朝、突然始まった「特別授業」という名のデスゲーム。誰とも手を繋げなければ、死ぬ。教室という閉鎖空間で、死に直面したスクールカーストの頂点から最下層までの27名の少女たち。いじめ、嫉妬、裏切り、依存、傲慢ーー容赦なく暴き出される心の闇。最後に生き残るのは、誰？　そして本当の友情とは？いつもの教室が地獄に変わる、令和の女子校デスゲーム！

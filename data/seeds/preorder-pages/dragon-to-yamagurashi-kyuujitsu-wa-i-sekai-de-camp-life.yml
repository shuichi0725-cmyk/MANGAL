rakuten_caption: '竜と亜人と、ゆるい×美味しいスローライフ♪

  「まずはこちらをご賞味あれ！」 「これは…きわめて美味であるな…！」 ブラック企業勤務で、キャンプだけが生き甲斐な22歳のマイペース美人・大津見咲弥（おおつみさくや）。ある時、亡くなった祖父から田舎の家と山を相続した咲弥は、これを機に早期リタイア。田舎暮らしでキャンプざんまいの日々を送ると決意し、早速咲弥が相続した山を登るとーーそこは異世界に繋がっていた!!
  慌てる間もなく、祖父の友人だというドラゴンと意気投合した咲弥は、異世界仕様になった山でキャンプ暮らしを目いっぱい楽しむことに。 グルメ大好きなドラゴンくんと、亜人の兄妹・アトルとチコをはじめ、
  初めて出会う種族、見たことない景色、美味しいキャンプ飯など“楽しいコト♪”が目白押し！ 異界の住人たちと交流を広げていく、のんびり日常ファンタジー開幕！'

rakuten_caption: '時は明治時代末期。

  警官である星次郎（せいじろう）は、

  近頃頻発している殺人事件を解決するため、

  朝から晩まで職務に奮闘する日々を送っていた。


  そんな中、ある情報屋の噂を聞きつけ、

  吉原遊郭に赴くことに。


  そこで出逢ったのは妖（あやかし）と見紛うほど

  妖艶な雰囲気を纏う謎の男、清助（きよすけ）だった。

  事件に関する情報が欲しいと頼む星次郎だが、

  依頼金が足りない。焦りばかりが募る星次郎に、


  「男に抱かれたことはあるか？」と


  清助はある“妥協案“を提示するーーー。'

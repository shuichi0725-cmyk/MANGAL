rakuten_caption: '過保護に育てられた小鳥は、恋を知って涙を流すーー


  砂漠の国の王女レイラは、オーストラリアの敏腕弁護士ミカエルを秘密の計画に巻き込むことに。過保護な父王のおかげで24歳になっても国外に出ることなく、恋も知らぬまま大嫌いな男との結婚を命じられたレイラ。せめて一度だけ思うがまま生きてみたいと、兄の新婚旅行に同行して密かに抜け出し、現地のミカエルの擁護で1週間の自由をつかんだのだが…。計画には誤算があった。レイラは絶対者の父王を永遠に背きたくなるほどに、ミカエルに惹かれてしまったのだーー!!'

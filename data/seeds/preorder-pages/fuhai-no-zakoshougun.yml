rakuten_caption: '戦闘系のスキルを重宝するロックウッド子爵家の長男、シビル。

  彼が授かったスキルは、あらゆる問いに『イエス』か『ノー』で答える《神解（メーティス）》だった。


  ハズレスキルと蔑まれ、家を追放されたうえ、弟からも命を狙われることにーー。

  《神解》を頼りに追跡を逃れ、ローデル帝国へ辿り着いたシビルは、女騎士イヴや商人ネオンと出会う。

  果たしてシビルは、ハズレスキルと呼ばれた《神解》を武器に、どのような未来を切り開いていくのかーー!?'

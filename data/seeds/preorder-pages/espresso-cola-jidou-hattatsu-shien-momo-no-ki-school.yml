rakuten_caption: '児童発達支援ーー。それはいろいろな要因による障害を持つ未就学児の子どもを対象に、個々の特性に沿って発達を促し、自立の基礎を育む「療育」機関。専門学校を卒業したばかりの新米保育士の山原は、そこで様々な生きづらさを抱えたこどもたちと向き合い、その成長に喜びを重ねながらも、各家庭が隠し持つ苦しさを目の当たりにしていくーー。

  ADHDや自閉スペクトラム症、遺伝子疾患による発達の遅れやばらつきなど、様々な生きづらさを抱えた子どもたちが生きる力を手に入れるためのメソッドとはーー？

  Amazonkindleにて300万DL超を記録。Amazonインディーズランキングで連続首位を取り続ける超高評価療育漫画作品を『ニーチェ先生』のハシモトが商業誌版として再発進！

  第1話…君と僕のはじめの一歩

  第2話…眠らない天使」

  第3話…しかめっ面の忍者　1

  第4話…しかめっ面の忍者　2

  第5話…しかめっ面の忍者　3'

rakuten_caption: '成人向け同人誌が売れると聞いて、描き始めること2年。全く売れずに貧乏作家の杉田は困り果てていた。そんな時ついに「作者絶対童貞」のレビューに衝撃を受け、一念発起してデリヘルを呼ぶ決意をする。ピンポーン！　いざ憧れの卒業！！　と思って扉を開けたら…そこには元同級生がいた。


  デリから始まる官能的で純なラブコメ開演です。'

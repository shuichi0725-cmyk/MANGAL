rakuten_caption: '全寮制の名門男子校

  そこには「姫」扱いされ、誰からも愛される存在──上園仁千佳がいた。

  努力を惜しまぬ彼は、穏やかな学園生活を守り抜いてきた。

  しかし、高校進級で編入生としてやって来た姫野杏樹に平和な日常を奪われる。

  名家の御曹司の杏樹は整った容姿と落ち着いた物腰で瞬く間に人気を集めるが、

  彼の視線はなぜか仁千佳を追っていて！？

  近すぎる距離、からかうような言葉。戸惑いながらも、心の奥がざわめいていくーー。

  華やかな寮生活の中で揺れ動く、姫と王子のスクールライフ'

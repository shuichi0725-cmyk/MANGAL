rakuten_caption: 「捨てる命なら、俺がもらおうーーー」体液に毒を持つ、特殊な一族のもとに生まれた灯里（あかり）。両親が他界した後は叔父の家で下女として働いていたが、毒入りの体を隠していたため「気味が悪い」と虐げられていた。ある日、百華遊郭でも一、二を争う大妓楼の楼主・雪（せつ）が灯里の家を訪れる。雪は莫大な支度金を用意し灯里を妻に迎えたいと言うが、彼はある秘密を抱えていてーーー！？　虐げられた毒入り少女×遊郭の大楼主の和風恋愛ファンタジー、開幕！

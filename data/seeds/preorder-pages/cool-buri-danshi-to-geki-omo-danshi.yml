rakuten_caption: '本当はバカップルに憧れる、恋に恋する男子・悠々。

  「そういうの、アホっぽいからやめたほうがいいよ」と

  元カレにフラれたことをきっかけに、

  頭が良いキャラを演じる“クールぶり男子”である。

  恋人の前では理想の自分でいたい。

  ーーしかし、今カレはすべてお見通しだった！

  悠々の本性をすべて把握しながら、重すぎる愛を隠してスパダリを演じる“激重男子”レン。

  お互いに理想を演じ合う二人だけど、好きな気持ちはちゃんと同じ。

  ときどき隠している“素の自分”がバレそうになりながらも、

  今日も最高にかわいい高校生カップル

  「レンゆゆ」のもだキュン学園BL、開幕!!

  本文は色刷りの豪華装丁！'

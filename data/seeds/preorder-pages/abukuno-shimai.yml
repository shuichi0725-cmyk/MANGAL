rakuten_caption: '姉と妹、2人っきりの、行き止まりのお話。

  突然の事故で両親を失い、お互いしか頼れる者がいなくなってしまった姉妹。

  両親が抱えていた莫大な黒い借金から妹を守るため、姉の澄乃は今日も誰かの【命】を生贄に──。

  何も知らない妹は、姉のゆりかごの中で今日も健やかに育つ。

  裏社会×姉妹サスペンス！'

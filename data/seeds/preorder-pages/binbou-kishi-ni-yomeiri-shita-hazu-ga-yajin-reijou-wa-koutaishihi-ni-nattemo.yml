rakuten_caption: '「熊を狩ろう」って言われて結婚したのに

  皇帝の隠し子とか、聞いてない!!

  暴れん坊令嬢×身分を隠した最強騎士 溺愛成り上がり冒険譚!


  ワケあって田舎の領地で育った侯爵令嬢・ラルフシーヌは、

  ずば抜けた運動能力と負けず嫌いな性格で

  村のガキ大将として名を轟かす「野人令嬢」である。

  帝宮での式典で暴れ周ったことをきっかけに

  騎士・セルミアーネに見初められ嫁入りするが、

  貧乏騎士だったはずの彼は、実は現皇帝の隠し子で──!?


  ［登場人物］

  ＜ラルフシーヌ＞

  名門侯爵家の11番目の子として生ま れたものの、養育費不足のため領地 で平民として育てられた「野人令嬢」。 帝宮でのお披露目式で、虐められて いた令嬢をかばって暴れたことで、
  セルミアーネに惚れられて!?


  ＜セルミアーネ＞

  現皇帝と公妾だった母から生まれた皇子だが、母の教えにより身分を隠

  していち騎士として生き、ラルフシーヌに求婚する。しかし皇太子達の

  相次ぐ夭逝により、急遽、帝国の皇太子として立つことになる──。

  第1話　野人と呼ばれる令嬢　

  第2話　二年越しのプロポーズ　

  第3話　二度の結婚式と初夜　

  第4話　新婚狩人生活　

  第5話　晴天の霹靂

  初期キャラクターデザイン公開

  あとがき'

rakuten_caption: '毒の力で美しい姫を虜にする、ハーレム無双譚！

  全身を毒に侵され、呪いの子として生きる少年カイム。家族にも嫌われ一人で生きる中で、やがて自らに宿る力の謎を知る。そして「毒の王」へ覚醒した時、世界最強の存在となり、美姫たちを虜にしていく…。大人気小説をコミック化！　ハーレム無双譚!'

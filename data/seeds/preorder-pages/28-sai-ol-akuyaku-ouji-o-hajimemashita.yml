rakuten_caption: '散々な一日の終わり、OLの天川織羽は、世界に絶望しながら帰り道を歩いていた。すると突然雷が落ちてきて──気づけば見知らぬ世界の、見知らぬ王子に転生していた！？　大混乱しつつ、少しずつ状況を把握していくと、どうやら身体の元の持ち主、オリバーは、悪い噂の絶えない冷酷非道な性格で、あらゆる人から嫌われまくっているとんでもない悪役王子だった……！！　

  なんとか汚名を返上すべく、世のため人のため、必死に奔走する織羽。最低の嫌われ者に転生してしまったシゴデキOLの、ハードモードな新しい人生が始まる！？　異世界【革命】ファンタジー、開幕！！'

rakuten_caption: 'マイペース［花食み］留年生×ぼっち［花生み］高校生のガーデンバース！


  高校生の樹は【花生み】のせいで周囲から疎まれ孤独な日々を過ごしていた。

  屋上で日光浴をしていると悪名高い留年生の真殿に声をかけられる。

  彼は樹の頭に咲く花を見て気味悪がるどころか

  「綺麗じゃん」と褒めてきたのだ。

  初めての反応に戸惑う樹だが、課題の植物のスケッチのモデルとして

  二人だけの時間を過ごすうち、次第に彼に好意を抱いていく。

  ある日、真殿は樹の頭に咲く花の香りを嗅いだ直後、

  無性にその花を食べたくなってしまい…!?'

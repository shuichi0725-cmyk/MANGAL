  常識外れの授業ばかりだが、そこを卒業できればこの世の全ての車に乗る事が出来る『超絶免許』が与えられる!! 一星は果たして、免許取得できるのか…!!?

  アクセル全開ド直球自動車教習所ギャグ1巻!!'

# 掲載誌の per-case 是正 (= 種3(series-supplement-v2.yml)のAI fill誤りを、種3を触らずに上書きする)
#
# ★なぜ要るか: magazine は種3のAI fill由来で、根拠のない推定が入っている。
#   種3は「純粋追加only・既存keyの内容変更は禁止」(CLAUDE.md 月次蒸留のabort条件)なので、
#   誤りは種3を直さずここで上書きする(可逆・出所を残す)。
# ★キー = 本番slug。値の magazine は data/magazines.yml のキーであること(未登録なら先に登録する)。
# ★source は必ず外部権威(Wikipedia/出版社公式)を書く。推測で足さない。
corrections:
  yume-maboroshi-no-gotoku:
    magazine: super-jump
    source: wiki-verified
    evidence: ja.wikipedia「スーパージャンプ」掲載作品一覧に「夢幻の如く(本宮ひろ志) 1991年12号 - 1995年15号」と明記。種3は weekly-young-jump と誤記していた
    added_at: '2026-08-07'
  jin:
    magazine: super-jump
    source: wiki-verified
    evidence: ja.wikipedia「JIN-仁-」に「『スーパージャンプ』(集英社)に2000年9号から2010年24号まで連載」と明記。種3は同一qidに3エントリあり、うち2つが weekly-young-jump と誤記していた(正しい super-jump のエントリも併存するが頁は誤記側を拾っていた)
    added_at: '2026-08-08'
  shadow-skill:
    magazine: afternoon
    source: wiki-verified
    evidence: ja.wikipedia「SHADOW SKILL」に第三期の掲載誌が「アフタヌーン・シーズン増刊→月刊アフタヌーン」(2000年2月-2014年3月)と明記。この頁は講談社版=第三期。種3は monthly-shonen-magazine と誤記していた
    added_at: '2026-08-08'
  wild-7:
    magazine: shonen-king
    source: wiki-verified
    evidence: ja.wikipedia「ワイルド7」掲載誌=少年キング、発表号 1969年9月21日号-1979年7月16日号。雑誌側 ja.wikipedia「週刊少年キング」(少年画報社 1963-1988)でも裏取り
    added_at: '2026-08-08'
  shin-wild-7:
    magazine: comic-banban
    source: wiki-verified
    evidence: ja.wikipedia「ワイルド7」の続編一覧で『新ワイルド7 野獣伝説』掲載誌=コミックバンバン(徳間書店)と明記。雑誌単独のWikipedia記事は無いが増刊号の実物書誌(コミックバンバン平成元年4月5日増刊号ほか)で実在確認
    added_at: '2026-08-08'
  shirasunamura:
    magazine: comic-rex
    source: wiki-verified
    evidence: ja.wikipedia「今井神」に『白砂村』一迅社〈REXコミックス〉全10巻(『月刊ComicREX』2006年5月号-2014年2月号)と明記。種3は weekly-young-jump(集英社)と誤記していた=一迅社作品なのであり得ない
    added_at: '2026-08-08'

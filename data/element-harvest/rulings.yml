# 作品ごとのユーザ裁定(要素付与 = scripts/_element-assign.py が付与案より優先して読む)。
# show = 表に出す語 / hide = 出さない語。 語は付与案に出る語(和名)で書く。 quote はユーザの発話そのまま。
# ★ここに書けるのはユーザが言ったことだけ(Claude の判断で足さない)。 同じ原作の頁は stems に並べる。
rulings:
  - stems:
      - yahari-ore-no-seishun-love-wa-machigatte-iru-comic
      - yahari-ore-no-seishun-rabukome-wa-machigatteiru
    show: ["三角関係"]
    at: "2026-10-09"
    quote: "どちらかというと三角関係はたしてほしい。"
    note: "AniList のネタバレ印は @comic のエントリ1件にだけ付いている(原作小説・アニメの各期には無い)。 直前の裁定「ネタバレ印の4語はいらない」の例外"

# ── 語ごとのユーザ裁定(全作品に効く)──
#   hide_common = ありふれた語: 多くの作品に当てはまり、間違いではないが探す手がかりにならない語。
#                 表には出さず「隠して持つ」(見えない適用。 羅針盤の近さにだけ使う)。 作品ごとの show が在ればそちらが優先。
#   ★ここに書けるのはユーザが言ったことだけ。 語を足す時は、足す語を見せて裁定を受けてから。
word_rulings:
  - kind: hide_common
    words: ["事件", "秘密", "カップル", "記憶", "中年"]
    at: "2026-10-09"
    quote: "ありふれたとは余りに適用数が多いが間違いない要素のものは見えない適用にするか？ということか？ならする。"
    note: "30作の試し(trial30)で、材料だけを根拠に表へ出た語。 私の問い「ありふれた語(事件・秘密・カップル・記憶・中年)を、表に出さない語にしますか」への答え"

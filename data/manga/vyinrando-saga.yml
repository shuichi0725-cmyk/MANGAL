synopsis: 『ヴィンランド・サガ』
  は、幸村誠による日本の漫画。『週刊少年マガジン』（講談社）にて2005年4月から連載が始まったが、週刊連載に幸村の執筆が追いつかず、同年10月に同誌での連載を終了、同年12月より『月刊アフタヌーン』（講談社）にて月刊ペースの連載を再開。2025年9月号をもって完結した。西本英雄によるスピンオフ作品として『元祖ユルヴァちゃん』がある。

synopsis: 『暗殺者である俺のステータスが勇者よりも明らかに強いのだが』（あんさつしゃであるおれのステータスがゆうしゃよりもあきらかにつよいのだが）は、赤井まつりによる日本のライトノベル。小説投稿サイト「小説家になろう」にて2017年1月26日から連載されている。書籍版はオーバーラップ文庫（オーバーラップ）より同年11月25日から刊行されており、イラストは東西が担当。漫画版は合鴨ひろゆきによる作画でウェブコミック配信サイト「コミックガルド」（オーバーラップ）にて2018年7月10日より連載されている。公式略称は「暗殺者」とされているが、「ステつよ」とも称される。

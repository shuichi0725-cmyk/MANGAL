synopsis: 『エトランゼ』シリーズは、紀伊カンナによるボーイズラブ漫画シリーズ。シリーズ第一作であり紀伊のデビュー作である『海辺のエトランゼ』（うみべのエトランゼ）は『on
  Blue』にて2013年から2014年にかけて連載され、その続編である『春風のエトランゼ』（はるかぜのエトランゼ）が『on
  Blue』にて2014年から連載されている。2020年にはアニメ映画『海辺のエトランゼ』が公開された。

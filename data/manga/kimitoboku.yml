synopsis: 『君と僕。』（きみとぼく）は、堀田きいちによる日本の漫画作品。2003年に『月刊少年ガンガン』（スクウェア・エニックス）での掲載を開始、2004年から『ガンガンパワード』（同）で連載。2009年からは『月刊Gファンタジー』（同）に移籍して連載。休載後、2022年2月号より同年4月号まで連載された。同誌同年5月号より7月号まで、『君と僕。番外編』が連載された。2019年4月時点でコミックス累計発行部数は380万部を突破している。

synopsis: 『1年A組のモンスター』（いちねんエーぐみのモンスター）は、英貴による日本の漫画。『月刊ComicREX』（一迅社）にて、2018年3月号より2026年5月号まで連載された。2024年6月時点で電子版を含めた累計部数は150万部を突破している。タイトルの「モンスター」はモンスターチルドレンに因んでいる。

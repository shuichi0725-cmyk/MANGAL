synopsis: 『姫騎士様のヒモ』（ひめきしさまのヒモ）は、白金透による日本のライトノベル。イラストはマシマサキが担当している。電撃文庫（KADOKAWA）より2022年2月から刊行されている。第28回電撃小説大賞大賞受賞作。2025年5月時点で、電子版も含めたシリーズ累計発行部数は20万部を突破している。

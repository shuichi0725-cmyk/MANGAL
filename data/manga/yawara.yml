synopsis: 『YAWARA!』（ヤワラ）は、浦沢直樹による日本の漫画作品。『ビッグコミックスピリッツ』（小学館）にて1986年30号から1993年38号まで連載された。第35回（平成元年度）小学館漫画賞受賞作。2021年5月時点で累計発行部数は3000万部を突破している。

synopsis: 『金色のガッシュ!!』（こんじきのガッシュ!!）は、雷句誠による日本の漫画。『週刊少年サンデー』（小学館）において、2001年6号から2008年新年4・5合併号（2007年の最終号）まで連載された。略称は「ガッシュ」「ガッシュベル」。単行本は全33巻。各話数はそれぞれ「Level.○○」という通し番号になっている。第48回（2002年度）小学館漫画賞受賞作品。全323話。2017年3月時点で電子版を含めたシリーズ累計発行部数は2380万部を記録している。

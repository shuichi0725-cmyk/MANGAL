synopsis: 『結婚するって、本当ですか』
  は、若木民喜による日本の漫画。『ビッグコミックスピリッツ』（小学館）にて、2020年16号から2023年28号まで連載された。のち、Amazon Prime
  Videoでドラマ化され、同年10月から配信開始された。また、2023年にアニメ化され、『ビッグコミックスピリッツ』同年33号にはアニメ化と単行本第11巻の発売を記念した特別編が掲載された。

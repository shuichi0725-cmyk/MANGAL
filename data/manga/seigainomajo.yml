synopsis: 『聖骸の魔女』（せいがいのまじょ）は、田中ほさなによる日本の漫画。『ヤングキングアワーズ』（少年画報社）において、2014年12月号から2018年10月号まで連載されと。ダークハーレムファンタジーと単行本帯等では称され、青年誌らしい女性のヌードやグロ描写もある。単行本では多くの用語解説が載っている。

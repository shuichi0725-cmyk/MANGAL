    = 現DBは最新MADBと同期済み。 「取込の遅れ」ではない。
  - 本番の月別新刊ISBNの崖(2026-04=785 / 05=153 / 06=1)は、
    MADB自体の**登録ラグ**(発売後に登録される)。 1.2.16(2026-05-22スナップ)時点で
    5〜6月の新刊が未登録なだけ。 蒸留しても取れない(MADBが登録するまで待ち)。
  - リリースは**月次**(毎月17〜22日頃)。 → GitHub release 経路の蒸留は月次で十分。
    日次が意味を持つのは artmuseums.go.jp サイトCSV経路(予約含む高頻度・別実装)。
  - ★未検証: 2026-05-29 の build が 1.2.16 を完全取込したかは record単位で未照合。
    次回蒸留(1.2.17公開時)は MADB-ID upsert が冪等なので、 1.2.16 分の重複再取込は安全。
  - ★protocol基盤の未実装: CLAUDE.md が前提に挙げる差分スクリプト
    `_diff-madb.ts` / `_diff-series.ts` / `_select-supplement-diff.ts` は**未作成**。
    正規の月次蒸留を回すにはこれらの実装が先(= マニフェスト+ゲート設計と統合する好機)。

